plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.imissyoujobe.pocketarcade'
    compileSdk 36

    defaultConfig {
        // Same package as the Play listing (it started as a PWABuilder app). Raise versionCode for every upload.
        applicationId 'io.github.imissyoujobe.pocketarcade'
        minSdk 26
        targetSdk 36
        versionCode 14
        versionName '1.1.4'
        resValue 'string', 'app_name', 'Joystik'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            // side-by-side test copy: installs next to the Play version
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            resValue 'string', 'app_name', 'Joystik test'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Build the whole web arcade into the app, so the games work offline right after install (no first-launch download).
// The files are copied from the repo root at build time; nothing is duplicated in git.
def siteAssets = layout.buildDirectory.dir('generated/site-assets')
tasks.register('copySite', Copy) {
    from("${rootDir}/..") {
        include 'index.html', 'games.js', 'sw.js', 'manifest.webmanifest', 'privacy.html', 'games/**', 'art/**', 'lib/**', 'icons/**'
    }
    into siteAssets.map { it.dir('www') }
}
android.sourceSets.main.assets.srcDir siteAssets
tasks.named('preBuild') { dependsOn 'copySite' }
