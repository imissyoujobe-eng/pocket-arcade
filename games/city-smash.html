<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>City Smash</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script>
// City Smash: you are a giant lizard. Climb the towers, punch out the windows until each one crumbles, grab the people waving from the windows,
// squash the ones running in the street, and swat the soldiers, tanks and choppers. A giant ape stomps around the city too, smashing whatever he likes.
K.theme({ bg: '#1a1030', ink: '#fff2e0', accent: '#7aff4a', accentInk: '#0a2400' });
const W = 360, H = 280, GY = 252, FW = 15, FH = 15, SC = 2.0;
K.screen(W, H);
K.hud(['score', 'city', 'hp']);
K.pad({ dpad: '4', buttons: [{ id: 'b', label: 'JUMP' }, { id: 'a', label: 'PUNCH' }] });

let state = 'title', score, hp, city, me, ape, blds, foes, shots, people, runners, parts, pops, spawnT, best = K.best('citysmash'), shake, msg, msgT, apeScore;
function title() { K.card({ title: 'CITY SMASH', text: '◀ ▶ walk. Walk into a tower and press ▲ ▼ to climb it. PUNCH smashes windows, soldiers, tanks and choppers. JUMP leaps. Punch the people waving from the windows to grab a snack and heal, and stomp the ones running in the street. Watch out for Kong-a-Long, the giant ape who wrecks the city too, and punch him if he gets in your way. Knock down every tower to wreck the city!', best: best ? 'BEST ' + best : '', button: 'Rampage', onStart: start }); }
function start() { score = 0; apeScore = 0; hp = 100; city = 1; buildCity(); state = 'play'; }
const PAL = [['#5a6a8a', '#3a4868'], ['#8a5a4a', '#6a3a2c'], ['#6a7a5a', '#4a5a3a'], ['#8a7a5a', '#6a5a3a'], ['#6a5a8a', '#4a3a6a'], ['#4a7a7a', '#2a5a5a']];
function buildCity() {
  blds = []; const n = city > 2 ? 5 : 4, gap = (W - 80) / n;
  for (let i = 0; i < n; i++) {
    const cols = city > 2 ? 3 : K.ri(3, 4), rows = K.ri(9, 14), w = cols * FW + 8, p = PAL[(i + city) % PAL.length];
    const b = { x: 40 + i * gap + (gap - w) / 2, w, cols, rows, h: rows * FH + 22, col: p[0], dark: p[1], wins: [], fall: 0, down: false, tilt: 0, roof: K.ri(0, 2), sign: Math.random() < 0.5, crack: 0 };
    for (let r = 0; r < rows; r++) for (let cc = 0; cc < cols; cc++) b.wins.push({ r, c: cc, hp: 2, person: Math.random() < 0.16 ? { kind: K.ri(0, 3), ph: Math.random() * 6, lean: Math.random() < 0.4 } : null, lit: Math.random() < 0.7 });
    blds.push(b);
  }
  me = { x: 24, y: GY, vx: 0, vy: 0, cling: null, face: 1, air: false, punchT: 0, hitT: 0, eatT: 0 };
  ape = { x: W - 24, y: GY, vx: 0, vy: 0, cling: null, face: -1, air: false, punchT: 0, think: 1, goal: null, stunT: 0, roarT: 0 };
  foes = []; shots = []; people = []; runners = []; parts = []; pops = []; spawnT = 2; shake = 0; msg = 'CITY ' + city; msgT = 1.6;
}
const winPos = (b, w) => ({ x: b.x + 4 + w.c * FW + 1, y: GY - b.h + b.fall + 18 + w.r * FH });
function boom(x, y, c, n, sp) { for (let i = 0; i < (n || 8); i++) parts.push({ x, y, vx: K.rnd(-1, 1) * (sp || 60), vy: K.rnd(-90, 10), t: K.rnd(0.4, 0.9), c }); }
function pop(x, y, txt, col) { pops.push({ x, y, txt, col: col || '#fff', t: 0.9 }); }
function hurt(n) { if (me.hitT > 0) return; me.hitT = 0.25; hp -= n; K.beep(150, 0.08, { type: 'sawtooth' }); if (hp <= 0) { state = 'over'; best = K.saveBest('citysmash', score); K.card({ title: 'LIZARD DOWN', text: 'You smashed ' + (city - 1) + ' cities for ' + score + ' points.', best: 'BEST ' + best, button: 'Again', onStart: start }); } }
function bldAt(x) { return blds.find(b => !b.down && !b.fall && x > b.x - 4 && x < b.x + b.w + 4); }

// one monster's movement: walking, jumping and climbing (used by you and by the ape)
function moveMonster(m, dx, climb, jump, dt) {
  if (m.cling) {
    const b = m.cling; if (b.down || b.fall > 0) { m.cling = null; m.air = true; return; }
    m.y = K.clamp(m.y + climb * 55 * dt, GY - b.h + b.fall + 30, GY);
    if (m.y >= GY && climb > 0) m.cling = null;
    if (jump) { m.cling = null; m.vx = -m.face * 70; m.vy = -140; m.air = true; m.face = -m.face; }
    if (dx && dx !== m.face) { m.cling = null; m.vx = dx * 50; m.air = true; m.face = dx; }
    return;
  }
  if (!m.air) m.vx = dx * 62; if (dx) m.face = dx;
  if (jump && !m.air) { m.vy = -165; m.air = true; }
  m.vy += 360 * dt; m.x += m.vx * dt; m.y += m.vy * dt; m.x = K.clamp(m.x, 22, W - 22);
  if (m.y >= GY) { if (m.air && m.vy > 120) { shake = Math.max(shake, 0.25); stomp(m); } m.y = GY; m.vy = 0; m.air = false; }
  const b = bldAt(m.x + m.face * 14);
  if (b && (climb < 0 || (m.air && m.vy > -40)) && m.y > GY - b.h + b.fall + 20) { m.cling = b; m.x = m.face > 0 ? b.x - 14 : b.x + b.w + 14; m.vx = 0; m.vy = 0; m.air = false; }
}
// a punch from a monster: where the fist lands, and what it hits
function punch(m, mine) {
  m.punchT = 0.2; const px = m.x + m.face * 32, py = m.y - 44; K.noise(0.06, mine ? 0.2 : 0.1);
  let hit = false;
  for (const b of blds) { if (b.down) continue; for (const w of b.wins) { if (w.hp <= 0) continue; const p = winPos(b, w); if (Math.abs(p.x + 6 - px) < 15 && Math.abs(p.y + 6 - py) < 16) { hit = true; w.hp--; if (mine) score += 10; else apeScore += 10; boom(p.x + 6, p.y + 6, '#bfe8ff', 5); b.crack = Math.min(1, b.crack + 0.02);
    if (w.hp <= 0) { if (mine) score += 40; boom(p.x + 6, p.y + 6, '#c8b0a0', 4); if (w.person) { const pp = w.person; w.person = null; if (mine) { hp = Math.min(100, hp + 12); score += 250; me.eatT = 0.5; pop(p.x + 6, p.y - 4, 'YUM! +250', '#7aff4a'); K.tune([660, 880], 0.05); } else { ape.roarT = 0.6; pop(p.x + 6, p.y - 4, 'GULP!', '#ffb04a'); } } } } } }
  for (const f of foes) if (Math.abs(f.x - px) < 20 && Math.abs(f.y - py) < 22) { f.dead = true; hit = true; const pts = f.k === 'heli' ? 300 : f.k === 'tank' ? 400 : 100; if (mine) { score += pts; pop(f.x, f.y - 10, '+' + pts); } else apeScore += pts; boom(f.x, f.y, '#ffb04a', 14); K.noise(0.2, 0.25); }
  // punching the other monster shoves it away
  const other = mine ? ape : me; if (Math.abs(other.x - px) < 20 && Math.abs(other.y - 30 - py) < 34) { hit = true; if (mine) { ape.stunT = 1.4; ape.cling = null; ape.vx = me.face * 90; ape.vy = -110; ape.air = true; score += 150; pop(ape.x, ape.y - 70, 'POW! +150', '#ffd23f'); } else { me.cling = null; me.vx = ape.face * 80; me.vy = -100; me.air = true; hurt(6); } K.beep(110, 0.15, { type: 'square' }); shake = 0.2; }
  return hit;
}
// landing hard on the street flattens anyone underneath
function stomp(m) { for (const r of runners) if (!r.dead && Math.abs(r.x - m.x) < 20) squash(r, m === me); }
function squash(r, mine) { r.dead = true; boom(r.x, GY - 3, '#d8c8b0', 6, 40); pops.push({ x: r.x, y: GY - 2, txt: '', flat: r, t: 2 }); if (mine) { score += 50; pop(r.x, GY - 22, 'SQUASH! +50', '#ff8ad8'); } else apeScore += 50; K.beep(90, 0.06, { type: 'square', vol: 0.05 }); }

// the ape: picks a target (a building with windows left, or soldiers), wanders there, climbs, smashes, roars
function apeAI(dt) {
  if (ape.stunT > 0) { ape.stunT -= dt; moveMonster(ape, 0, 0, false, dt); return; }
  ape.think -= dt;
  if (ape.think <= 0 || !ape.goal || ape.goal.down) { ape.think = K.rnd(3, 6); const live = blds.filter(b => !b.down && !b.fall); ape.goal = live.length ? live[K.ri(0, live.length - 1)] : null; ape.climbTo = ape.goal ? GY - K.rnd(30, ape.goal.h - 30) : GY; if (Math.random() < 0.3) { ape.roarT = 1; K.beep(80, 0.5, { type: 'sawtooth', to: 50, vol: 0.05 }); } }
  let dx = 0, climb = 0, jump = false;
  if (ape.goal) {
    const side = ape.x < ape.goal.x + ape.goal.w / 2 ? -1 : 1, tx = side < 0 ? ape.goal.x - 14 : ape.goal.x + ape.goal.w + 14;
    if (ape.cling === ape.goal) { climb = Math.abs(ape.y - ape.climbTo) > 4 ? Math.sign(ape.climbTo - ape.y) : 0; if (!climb && ape.punchT <= 0 && Math.random() < dt * 2.2) { if (!punch(ape, false)) ape.climbTo = GY - K.rnd(30, ape.goal.h - 30); } }
    else if (Math.abs(ape.x - tx) > 4) dx = Math.sign(tx - ape.x); else { ape.face = -side; climb = -1; }
  }
  // swat soldiers on the street and in the air nearby
  if (!ape.cling && ape.punchT <= 0 && foes.some(f => Math.abs(f.x - (ape.x + ape.face * 32)) < 22 && Math.abs(f.y - (ape.y - 44)) < 40)) punch(ape, false);
  if (!ape.cling && !ape.air && Math.random() < dt * 0.15) jump = true;
  moveMonster(ape, dx, climb, jump, dt);
}

function update(dt) {
  if (state !== 'play') return;
  if (shake > 0) shake -= dt; if (msgT > 0) msgT -= dt;
  for (const m of [me, ape]) { if (m.punchT > 0) m.punchT -= dt; if (m.roarT > 0) m.roarT -= dt; } if (me.hitT > 0) me.hitT -= dt; if (me.eatT > 0) me.eatT -= dt;
  const dx = (K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0), climb = (K.down('down') ? 1 : 0) - (K.down('up') ? 1 : 0);
  let tdx = dx; if (K.ptr.down && !me.air && !me.cling) tdx = K.ptr.x > me.x + 10 ? 1 : K.ptr.x < me.x - 10 ? -1 : 0;
  moveMonster(me, tdx, climb, K.hit('b'), dt);
  if (K.hit('a') || (K.ptr.tapped && K.ptr.y < me.y - 60)) punch(me, true);
  apeAI(dt);
  // monsters walking on the street squash the runners they step on
  for (const m of [me, ape]) if (!m.air && !m.cling && Math.abs(m.vx) > 1) for (const r of runners) if (!r.dead && Math.abs(r.x - m.x) < 9) squash(r, m === me);
  // buildings crack and fall once most windows are smashed; people pour out and run
  blds.forEach(b => { if (b.down) return; const broken = b.wins.filter(w => w.hp <= 0).length;
    if (broken >= b.wins.length * 0.6 && !b.fall) { b.fall = 0.01; K.noise(1.4, 0.55); shake = 1.1; for (const m of [me, ape]) if (m.cling === b) { m.cling = null; m.air = true; if (m === me) hurt(8); } for (let k = 0; k < 4; k++) runners.push({ x: b.x + K.rnd(0, b.w), vx: (Math.random() < 0.5 ? -1 : 1) * K.rnd(24, 40), ph: Math.random() * 6, kind: K.ri(0, 3) }); }
    if (b.fall) { b.fall += 70 * dt; b.tilt = Math.sin(b.fall / 14) * 0.02; for (let k = 0; k < 2; k++) parts.push({ x: b.x + K.rnd(-10, b.w + 10), y: GY - 6, vx: K.rnd(-50, 50), vy: K.rnd(-80, -20), t: K.rnd(0.8, 1.4), c: 'rgba(200,190,180,.7)', dust: 1 }); if (b.fall >= b.h) { b.down = true; score += 500; pop(b.x + b.w / 2, GY - 40, 'TOPPLED! +500', '#ffd23f'); } } });
  // people inside panic and sometimes run out the front door
  if (Math.random() < dt * 0.5 && runners.length < 10) { const b = blds.filter(q => !q.down && !q.fall)[0]; if (b) runners.push({ x: b.x + b.w / 2, vx: (Math.random() < 0.5 ? -1 : 1) * K.rnd(22, 38), ph: Math.random() * 6, kind: K.ri(0, 3) }); }
  runners.forEach(r => { if (r.dead) return; r.ph += dt * 14; const near = [me, ape].find(m => Math.abs(m.x - r.x) < 60 && !m.cling); if (near) r.vx = Math.sign(r.x - near.x || 1) * Math.abs(r.vx); r.x += r.vx * dt; });
  runners = runners.filter(r => !r.dead && r.x > -10 && r.x < W + 10);
  // the army fights back: soldiers, tanks from city 2, choppers
  spawnT -= dt;
  if (spawnT <= 0 && foes.length < 3 + city) { const side = Math.random() < 0.5, k = Math.random();
    if (k < 0.3 + city * 0.04) foes.push({ k: 'heli', x: side ? -24 : W + 24, y: K.rnd(50, 130), vx: side ? 32 : -32, cd: 2 });
    else if (city > 1 && k < 0.5) foes.push({ k: 'tank', x: side ? -24 : W + 24, y: GY, vx: side ? 18 : -18, cd: 2.5 });
    else foes.push({ k: 'sol', x: side ? -10 : W + 10, y: GY, vx: side ? 26 : -26, cd: K.rnd(1, 2) });
    spawnT = Math.max(0.9, K.rnd(1.5, 3) - city * 0.12); }
  foes.forEach(f => { f.x += f.vx * dt; if (f.k === 'heli') { if (Math.abs(f.x - me.x) < 90) f.vx *= Math.pow(0.4, dt); f.y += (me.y - 70 - f.y) * dt * 0.4; f.y = Math.max(30, f.y); }
    if ((f.k === 'sol' || f.k === 'tank') && Math.abs(f.x - me.x) < (f.k === 'tank' ? 120 : 70)) f.vx = 0;
    f.cd -= dt; if (f.cd <= 0 && f.x > 0 && f.x < W) { f.cd = K.rnd(1.4, 2.6) * (f.k === 'tank' ? 1.5 : 1); const sy = f.y - (f.k === 'sol' ? 14 : f.k === 'tank' ? 16 : 0), a = Math.atan2(me.y - 40 - sy, me.x - f.x); shots.push({ x: f.x, y: sy, vx: Math.cos(a) * (f.k === 'tank' ? 120 : 110), vy: Math.sin(a) * 110, big: f.k === 'tank' }); K.beep(f.k === 'tank' ? 200 : 800, 0.04, { vol: 0.03 }); }
    for (const m of [me, ape]) if ((f.k === 'sol') && !m.air && !m.cling && Math.abs(f.x - m.x) < 10) { f.dead = true; boom(f.x, f.y - 4, '#4a5a2a', 6); if (m === me) { hp = Math.min(100, hp + 4); score += 100; pop(f.x, f.y - 20, 'STOMP! +100'); } } });
  foes = foes.filter(f => !f.dead && f.x > -50 && f.x < W + 50);
  shots.forEach(s => { s.x += s.vx * dt; s.y += s.vy * dt; if (Math.abs(s.x - me.x) < 16 && s.y < me.y && s.y > me.y - 64) { s.dead = true; hurt(s.big ? 9 : 4); boom(s.x, s.y, '#ffd86b', 4); } else if (Math.abs(s.x - ape.x) < 16 && s.y < ape.y && s.y > ape.y - 64) { s.dead = true; boom(s.x, s.y, '#ffd86b', 4); } });
  shots = shots.filter(s => !s.dead && s.x > -5 && s.x < W + 5 && s.y > -5 && s.y < H);
  parts.forEach(p => { p.t -= dt; p.vy += (p.dust ? 20 : 150) * dt; p.x += p.vx * dt; p.y += p.vy * dt; }); parts = parts.filter(p => p.t > 0);
  pops.forEach(p => { p.t -= dt; if (!p.flat) p.y -= 20 * dt; }); pops = pops.filter(p => p.t > 0);
  if (state !== 'play') return;
  if (blds.every(b => b.down)) { city++; score += 1000; hp = Math.min(100, hp + 30); K.tune([392, 523, 659, 784], 0.1); buildCity(); }
  K.set('score', score); K.set('city', 'CITY ' + city); K.set('hp', 'HP ' + Math.max(0, Math.ceil(hp)));
}

// ---------- drawing ----------
function hsh(i, k) { const v = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return v - Math.floor(v); }
const SKIN = ['#f0c8a0', '#c8905a', '#8a5a3a', '#e0b088'], SHIRT = ['#3a7aff', '#ff4a6a', '#ffd23f', '#4ac87a', '#c07bff', '#ff8a3a'];
// a person in a window: waving both arms, shouting, some leaning out
function windowPerson(c, x, y, w, t, panic) {
  const k = w.person.kind, ph = t / 140 + w.person.ph, lean = w.person.lean ? 2 : 0;
  c.fillStyle = SHIRT[(k * 2 + w.r) % SHIRT.length]; c.beginPath(); c.roundRect(x + 3, y + 7 - lean, 7, 6 + lean, 1.5); c.fill();
  c.strokeStyle = SKIN[k]; c.lineWidth = 1.4; c.lineCap = 'round'; const a1 = Math.sin(ph) * 0.6, a2 = Math.sin(ph + 2) * 0.6;
  c.beginPath(); c.moveTo(x + 3.5, y + 8 - lean); c.lineTo(x + 0.5 + Math.sin(a1) * 2, y + 3 - lean - Math.cos(a1) * 2); c.moveTo(x + 9.5, y + 8 - lean); c.lineTo(x + 12.5 + Math.sin(a2) * 2, y + 3 - lean - Math.cos(a2) * 2); c.stroke();
  c.fillStyle = SKIN[k]; c.beginPath(); c.arc(x + 6.5, y + 4.5 - lean, 2.6, 0, 7); c.fill();
  c.fillStyle = ['#3a2414', '#e8c050', '#1a1010', '#8a3a1a'][k]; c.beginPath(); c.arc(x + 6.5, y + 3.8 - lean, 2.7, Math.PI, 0); c.fill();
  c.fillStyle = '#111'; c.fillRect(x + 5.2, y + 4.2 - lean, 0.8, 0.8); c.fillRect(x + 7.2, y + 4.2 - lean, 0.8, 0.8); c.beginPath(); c.ellipse(x + 6.6, y + 6 - lean, 0.8, panic ? 1 : 0.5, 0, 0, 7); c.fill();
  if (panic && Math.floor(t / 300 + w.r + w.c) % 3 === 0) { c.fillStyle = '#fff'; c.beginPath(); c.roundRect(x + 10, y - 7, 18, 7, 2); c.fill(); c.beginPath(); c.moveTo(x + 11, y - 1); c.lineTo(x + 9, y + 2); c.lineTo(x + 13, y - 1); c.fill(); c.fillStyle = '#d83a2a'; c.font = 'bold 5px sans-serif'; c.textAlign = 'left'; c.fillText('HELP!', x + 11.5, y - 2); }
}
function drawBuilding(c, b, t) {
  if (b.down) { // rubble pile with beams sticking out and a little smoke
    c.fillStyle = A.INK; c.beginPath(); c.moveTo(b.x - 8, GY); c.lineTo(b.x + 4, GY - 14); c.lineTo(b.x + b.w / 2, GY - 20); c.lineTo(b.x + b.w - 4, GY - 12); c.lineTo(b.x + b.w + 8, GY); c.fill();
    c.fillStyle = '#8a8088'; c.beginPath(); c.moveTo(b.x - 6, GY); c.lineTo(b.x + 5, GY - 12); c.lineTo(b.x + b.w / 2, GY - 18); c.lineTo(b.x + b.w - 4, GY - 10); c.lineTo(b.x + b.w + 6, GY); c.fill();
    for (let k = 0; k < 9; k++) A.part(c, b.x + hsh(k, b.x) * b.w, GY - 6 - hsh(k, 2) * 9, 6, 3.5, k % 3 ? b.col : '#a09098');
    c.strokeStyle = '#5a4a3a'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(b.x + b.w * 0.3, GY - 8); c.lineTo(b.x + b.w * 0.2, GY - 26); c.moveTo(b.x + b.w * 0.7, GY - 8); c.lineTo(b.x + b.w * 0.85, GY - 22); c.stroke();
    for (let k = 0; k < 3; k++) { const ph = (t / 1600 + k / 3) % 1; c.fillStyle = 'rgba(120,110,120,' + (0.35 * (1 - ph)) + ')'; c.beginPath(); c.arc(b.x + b.w / 2 + Math.sin(ph * 6 + k) * 6, GY - 20 - ph * 40, 4 + ph * 8, 0, 7); c.fill(); }
    return;
  }
  c.save(); c.beginPath(); c.rect(b.x - 30, -50, b.w + 60, GY + 50); c.clip();
  const top = GY - b.h + b.fall; c.translate(b.x + b.w / 2, GY); c.rotate(b.tilt); c.translate(-(b.x + b.w / 2), -GY);
  c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(b.x + 6, top + 6, b.w, b.h);
  c.fillStyle = A.INK; c.fillRect(b.x - 1, top - 1, b.w + 2, b.h + 2);
  // brick courses
  for (let yy = top; yy < GY; yy += 5) for (let xx = 0; xx < b.w; xx += 9) { const o = ((yy - top) / 5) % 2 ? 4.5 : 0; c.fillStyle = hsh(b.x + xx, yy) < 0.16 ? A.shade(b.col, -0.15) : hsh(b.x + xx, yy) > 0.9 ? A.shade(b.col, 0.1) : b.col; c.fillRect(b.x + Math.max(0, xx - o), yy, Math.min(8.4, b.w - Math.max(0, xx - o)), 4.4); }
  const sg = c.createLinearGradient(b.x, 0, b.x + b.w, 0); sg.addColorStop(0, 'rgba(255,220,200,.16)'); sg.addColorStop(0.6, 'rgba(0,0,0,0)'); sg.addColorStop(1, 'rgba(0,0,0,.3)'); c.fillStyle = sg; c.fillRect(b.x, top, b.w, b.h);
  // floor bands every few rows
  for (let r = 0; r <= b.rows; r += 3) { c.fillStyle = b.dark; c.fillRect(b.x, top + 16 + r * FH - 1, b.w, 1.5); }
