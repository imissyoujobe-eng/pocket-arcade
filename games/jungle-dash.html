<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Jungle Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: side-scrolling jungle on a canvas; HUD strip on top (score, time, lives); thumb controls at the bottom — walk on the left, jump on the right */
:root {
  --panel: #10281a;
  --panel-fg: #f4f1dc;
  --gold: #ffd23f;
  --gold-deep: #b8860b;
  --leaf: #4caf50;
  --leaf-deep: #22692a;
  --display: "Bungee", "Impact", system-ui, sans-serif;
  --body: "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--panel); color: var(--panel-fg); font-family: var(--body); touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.game { height: 100%; min-height: 560px; display: flex; flex-direction: column; }
.hud { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 8px 16px; }
.lbl { font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
.val { font-family: var(--display); font-size: 1.25rem; color: var(--gold); font-variant-numeric: tabular-nums; }
.time { font-family: var(--display); font-size: 1.7rem; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
.time.low { color: #ff6b5b; }
.lives { display: flex; gap: 4px; justify-content: flex-end; }
.lives svg { width: 22px; height: 14px; }
#field { position: relative; flex: 1; min-height: 360px; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.controls { display: flex; justify-content: space-between; gap: 10px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.pair { display: flex; gap: 10px; }
.ctl { font-family: var(--display); font-size: 1rem; color: #fff; border: 0; border-radius: 16px; width: 76px; height: 68px; display: grid; place-items: center; cursor: pointer; touch-action: none; background: #2c4a36; box-shadow: 0 5px 0 #06140b; }
.ctl.jump { width: 150px; background: var(--gold); color: var(--panel); box-shadow: 0 5px 0 var(--gold-deep); font-size: 1.2rem; }
.ctl.on { transform: translateY(4px); box-shadow: 0 1px 0 #06140b; filter: brightness(1.15); }
.ctl svg { width: 30px; height: 30px; }
.ctl:focus-visible, .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(16,40,26,.62); text-align: center; }
.card { max-width: 350px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.card h1, .card h2 { font-family: var(--display); margin: 0; line-height: 1; color: var(--gold); text-shadow: 0 4px 0 var(--leaf-deep); }
.card h1 { font-size: clamp(2.4rem, 12vw, 3.4rem); }
.card h2 { font-size: clamp(1.8rem, 9vw, 2.4rem); }
.card p { margin: 0; line-height: 1.45; text-shadow: 0 1px 3px #000; }
.card ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; text-shadow: 0 1px 3px #000; }
.btn { font-family: var(--display); font-size: 1.2rem; color: var(--panel); background: var(--gold); border: 0; border-radius: 12px; padding: 14px 28px; cursor: pointer; box-shadow: 0 6px 0 var(--gold-deep); }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--gold-deep); }
.banner { position: absolute; left: 0; right: 0; top: 16%; text-align: center; font-family: var(--display); font-size: clamp(1.5rem, 8vw, 2.5rem); color: #fff; text-shadow: 0 3px 0 var(--leaf-deep), 0 0 16px rgba(0,0,0,.5); pointer-events: none; padding-inline: 16px; }
</style>

<div class="game">
  <div class="hud">
    <div><div class="lbl">Score</div><div class="val" id="score">0</div></div>
    <div><div class="lbl" style="text-align:center">Time</div><div class="time" id="time">3:00</div></div>
    <div><div class="lbl" style="text-align:right">Lives</div><div class="lives" id="lives"></div></div>
  </div>
  <div id="field">
    <canvas id="cv"></canvas>
    <div class="banner" id="banner" hidden></div>
    <div class="overlay" id="start">
      <div class="card">
        <h1>Jungle Dash</h1>
        <ul>
          <li><b>◀ ▶</b> run through the jungle</li>
          <li><b>JUMP</b> over pits, snakes and logs</li>
          <li>Jump into a vine to grab it, JUMP again to let go</li>
          <li>Hop on the crocs only when their mouths are shut!</li>
        </ul>
        <p>Grab treasure and reach the temple before time runs out.</p>
        <button class="btn" id="play">Tap to Explore</button>
        <p id="best"></p>
      </div>
    </div>
    <div class="overlay" id="over" hidden>
      <div class="card">
        <h2 id="overTitle">Game Over</h2>
        <p id="overText"></p>
        <button class="btn" id="again">Explore Again</button>
      </div>
    </div>
  </div>
  <div class="controls">
    <div class="pair">
      <button class="ctl" id="left" aria-label="Run left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 L7 12 L15 20" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="ctl" id="right" aria-label="Run right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 L17 12 L9 20" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <button class="ctl jump" id="jump">JUMP</button>
  </div>
</div>

<script src="../lib/art.js"></script>
<script>
window.addEventListener('error', function (e) { var b = document.getElementById('banner'); if (b) { b.hidden = false; b.style.fontSize = '14px'; b.textContent = 'Error: ' + e.message; } });
(function () {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), field = $('field');
  let W = 0, H = 0, S = 1, baseY = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = field.clientWidth; H = field.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(H / 300, W / 400); baseY = H * 0.68;
  }

  // ---------- world ----------
  const ROOM = 460, ROOMS = 18, VINE_TOP = 260, VINE_L = 190, HANG = 54;
  const TREASURES = [{ k: 'bag', v: 1000 }, { k: 'bar', v: 2000 }, { k: 'gem', v: 4000 }];
  let rooms = [], END = 0;
  function buildWorld() {
    rooms = [];
    const types = ['pit', 'vine', 'logs', 'croc', 'tar', 'snake', 'logs2', 'vine2'];
    let prev = '';
    for (let i = 0; i < ROOMS; i++) {
      const r = i * ROOM; let t;
      if (i === 0) t = 'start'; else { do { t = types[Math.floor(Math.random() * types.length)]; } while (t === prev); }
      prev = t;
      const R = { x0: r, type: t, pits: [], vines: [], logs: [], snakes: [], croc: null, tar: null, tre: null };
      if (t === 'pit') R.pits.push([r + 170, r + 240], [r + 310, r + 380]);
      if (t === 'vine') { R.pits.push([r + 140, r + 380]); R.vines.push({ px: r + 260, ph: Math.random() * 6 }); }
      if (t === 'vine2') { R.croc = { a: r + 140, b: r + 380, heads: [], ph: 0 }; R.vines.push({ px: r + 260, ph: Math.random() * 6 }); }
      if (t === 'logs') for (let k = 0; k < 3; k++) R.logs.push({ x: r + 200 + k * 90, roll: true, a: 0 });
      if (t === 'logs2') R.logs.push({ x: r + 180, roll: false, a: 0 }, { x: r + 300, roll: false, a: 0 }, { x: r + 400, roll: true, a: 0 });
      if (t === 'croc') R.croc = { a: r + 130, b: r + 390, heads: [r + 200, r + 260, r + 320], ph: Math.random() * 3 };
      if (t === 'tar') R.tar = { c: r + 260, max: 120, ph: Math.random() * 5 };
      if (t === 'snake') { R.pits.push([r + 130, r + 200]); R.snakes.push(r + 310); }
      if (i > 0 && Math.random() < .7) { const T = TREASURES[Math.random() < .5 ? 0 : Math.random() < .6 ? 1 : 2]; R.tre = { x: r + ROOM - 30, k: T.k, v: T.v, got: false }; }
      rooms.push(R);
    }
    END = ROOMS * ROOM + 160;
  }
  function tarHalf(T, t) { const p = ((t + T.ph) % 5) / 5; let f; if (p < .4) f = 0; else if (p < .52) f = (p - .4) / .12; else if (p < .88) f = 1; else f = 1 - (p - .88) / .12; return T.max * f; }
  function crocOpen(C, t) { return ((t + C.ph) % 3) < 1.1; }
  function vineEnd(v, t) {
    const a = .62 * Math.sin(2.1 * t + v.ph);
    return { x: v.px + VINE_L * Math.sin(a), y: VINE_TOP - VINE_L * Math.cos(a), vx: VINE_L * Math.cos(a) * .62 * 2.1 * Math.cos(2.1 * t + v.ph) };
  }
  function roomAt(x) { return rooms[Math.max(0, Math.min(rooms.length - 1, Math.floor(x / ROOM)))]; }
  function holeAt(x, t) {
    const R = roomAt(x);
    for (const [a, b] of R.pits) if (x > a + 8 && x < b - 8) return 'pit';
    if (R.croc) { const C = R.croc; if (x > C.a + 6 && x < C.b - 6) { for (const h of C.heads) if (Math.abs(x - h) < 17) return crocOpen(C, t) ? 'croc' : null; return 'water'; } }
    if (R.tar) { const hw = tarHalf(R.tar, t); if (hw > 10 && Math.abs(x - R.tar.c) < hw - 8) return 'tar'; }
    return null;
  }

  // ---------- sound ----------
  let ac = null;
  function audio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} }
  function tone(f1, f2, len, type, vol, at) {
    if (!ac) return; const t = ac.currentTime + (at || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + len);
    g.gain.setValueAtTime(vol || .1, t); g.gain.exponentialRampToValueAtTime(.0001, t + len);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + len + .02);
  }
  function noise(dur, vol, freq) {
    if (!ac) return; const len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const s = ac.createBufferSource(); s.buffer = buf; const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = ac.createGain(); g.gain.value = vol; s.connect(f).connect(g).connect(ac.destination); s.start();
  }
  const sfx = {
    jump: () => tone(300, 700, .15, 'square', .07),
    grab: () => tone(900, 1200, .06, 'triangle', .1),
    land: () => noise(.06, .15, 400),
    thud: () => noise(.2, .6, 500),
    coin: () => { tone(880, 880, .08, 'triangle', .12); tone(1320, 1320, .12, 'triangle', .12, .08); tone(1760, 1760, .2, 'triangle', .12, .18); },
    die: () => tone(600, 90, .7, 'sawtooth', .1),
    win: () => [523, 659, 784, 1047, 1319].forEach((n, i) => tone(n, n, .18, 'square', .09, i * .12))
  };

  // ---------- input ----------
  const keys = { left: false, right: false, jump: false };
  let jumpQ = false;
  Object.keys(keys).forEach(k => {
    const el = $(k);
    const on = e => { e.preventDefault(); audio(); if (k === 'jump' && !keys.jump) jumpQ = true; keys[k] = true; el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch (_) {} };
    const off = () => { keys[k] = false; el.classList.remove('on'); };
    el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off); el.addEventListener('lostpointercapture', off);
    el.addEventListener('contextmenu', e => e.preventDefault());
  });
  const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'jump', ArrowUp: 'jump', KeyW: 'jump' };
  addEventListener('keydown', e => { const k = KEYMAP[e.code]; if (k) { e.preventDefault(); audio(); if (k === 'jump' && !keys.jump) jumpQ = true; keys[k] = true; $(k).classList.add('on'); } });
  addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { keys[k] = false; $(k).classList.remove('on'); } });

  // ---------- state ----------
  let P, phase = 'title', score = 0, lives = 3, timeLeft = 180, clock = 0, pops = [], best = 0, cam = 0, deadT = 0, deathKind = '';
  try { best = +localStorage.getItem('jungledash-best') || 0; } catch (e) {}
  function newPlayer(x) { P = { x, y: 0, vx: 0, vy: 0, air: false, vine: null, face: 1, run: 0, stumble: 0, hitCd: 0, grabCd: 0, inv: 1.2 }; }
  function banner(t, ms) { const b = $('banner'); b.textContent = t; b.hidden = false; clearTimeout(banner.t); banner.t = setTimeout(() => b.hidden = true, ms || 1100); }
  function pop(x, h, text, color) { pops.push({ x, h, text, color, t: 1 }); }
  const HAT = '<svg viewBox="0 0 22 14" aria-hidden="true"><ellipse cx="11" cy="11" rx="10.5" ry="2.8" fill="#c9a45c"/><rect x="5" y="2" width="12" height="9" rx="3" fill="#c9a45c"/><rect x="5" y="7" width="12" height="2" fill="#7a3b1e"/></svg>';
  let lastHud = '';
  function hud() {
    const t = Math.ceil(timeLeft), m = Math.floor(t / 60), s = t % 60;
    const key = score + '|' + t + '|' + lives;
    if (key === lastHud) return; lastHud = key;
    $('score').textContent = score.toLocaleString();
    $('time').textContent = m + ':' + (s < 10 ? '0' : '') + s;
    $('time').classList.toggle('low', phase === 'play' && timeLeft < 20);
    $('lives').innerHTML = HAT.repeat(Math.max(0, lives));
  }
  function newGame() { buildWorld(); score = 0; lives = 3; timeLeft = 180; pops = []; newPlayer(40); phase = 'play'; lastHud = ''; banner('Go!', 700); hud(); }
  function begin(e) {
    if (e) e.preventDefault();
    if ($('start').hidden && $('over').hidden) return;
    audio(); $('start').hidden = true; $('over').hidden = true; newGame();
  }
  $('play').addEventListener('click', begin); $('start').addEventListener('pointerup', begin); $('again').addEventListener('click', begin);

  const DEATH_TEXT = { pit: 'Fell in!', water: 'Splash!', croc: 'Chomp!', tar: 'Stuck in the tar!', snake: 'Snake bite!' };
  function die(kind) { phase = 'dying'; deadT = 1.1; deathKind = kind; P.vine = null; P.air = false; sfx.die(); banner(DEATH_TEXT[kind] || 'Ouch!', 1000); }
  function treasures() { const all = rooms.filter(r => r.tre), got = all.filter(r => r.tre.got); return got.length + ' of ' + all.length; }
  function saveBest() { const nb = score > best; if (nb) { best = score; try { localStorage.setItem('jungledash-best', best); } catch (e) {} } return nb; }
  function gameOver(timeUp) {
    phase = 'over'; const nb = saveBest();
    $('overTitle').textContent = nb ? 'New High Score!' : timeUp ? "Time's Up" : 'Game Over';
    $('overText').textContent = 'You found ' + treasures() + ' treasures and scored ' + score.toLocaleString() + '. Best: ' + best.toLocaleString() + '.';
    setTimeout(() => { $('over').hidden = false; }, 900); hud();
  }
  function win() {
    phase = 'win'; sfx.win();
    const bonus = Math.floor(timeLeft) * 20 + lives * 1000; score += bonus; const nb = saveBest();
    $('overTitle').textContent = nb ? 'New High Score!' : 'You Made It!';
    $('overText').textContent = 'You reached the temple with ' + treasures() + ' treasures. Time and lives bonus +' + bonus.toLocaleString() + '. Score ' + score.toLocaleString() + '. Best: ' + best.toLocaleString() + '.';
    banner('Temple reached!', 1500);
    setTimeout(() => { $('over').hidden = false; }, 1400); lastHud = ''; hud();
  }

  function update(dt) {
    clock += dt;
    rooms.forEach(R => R.logs.forEach(L => { if (L.roll) { L.x -= 70 * dt; L.a -= 70 * dt / 12; if (L.x < R.x0 + 60) L.x = R.x0 + ROOM - 20; } }));
    pops.forEach(p => { p.t -= dt; p.h += 40 * dt; }); pops = pops.filter(p => p.t > 0);
    if (phase === 'dying') {
      deadT -= dt;
      if (deathKind !== 'snake' && deathKind !== 'croc') P.y -= 70 * dt;
      if (deadT <= 0) {
        lives--; lastHud = ''; hud();
        if (lives <= 0) return gameOver(false);
        newPlayer(roomAt(P.x).x0 + 30); phase = 'play';
      }
      return;
    }
    if (phase !== 'play') return;
    timeLeft -= dt; if (timeLeft <= 0) { timeLeft = 0; return gameOver(true); }
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir && !P.air) P.face = dir;
    P.hitCd -= dt; P.grabCd -= dt; P.inv -= dt;
    const jump = jumpQ; jumpQ = false;
    if (P.vine) {
      const e = vineEnd(P.vine, clock); P.x = e.x; P.y = e.y - HANG;
      if (dir) P.face = dir;
      if (jump) { P.vine = null; P.air = true; const d = dir || (e.vx >= 0 ? 1 : -1); P.face = d; P.vx = d * 175; P.vy = 230; P.grabCd = .4; sfx.jump(); }
    } else if (!P.air) {
      let sp = dir * 140; if (P.stumble > 0) { P.stumble -= dt; sp *= .25; }
      P.vx = sp; P.x += sp * dt; if (sp) P.run += dt * 14;
      if (jump) { P.air = true; P.vy = 340; sfx.jump(); }
      else { const h = holeAt(P.x, clock); if (h) return die(h); }
    } else {
      P.vy -= 1000 * dt; P.x += P.vx * dt; P.y += P.vy * dt;
      if (P.grabCd <= 0) for (const v of roomAt(P.x).vines) { const e = vineEnd(v, clock); if (Math.hypot(e.x - P.x, e.y - (P.y + 44)) < 38) { P.vine = v; P.air = false; P.vy = 0; sfx.grab(); break; } }
      if (!P.vine && P.y <= 0) { P.y = 0; P.air = false; const h = holeAt(P.x, clock); if (h) return die(h); sfx.land(); }
    }
    P.x = Math.max(16, P.x);

    const R = roomAt(P.x);
    if (P.y < 16 && P.hitCd <= 0) for (const L of R.logs) if (Math.abs(P.x - L.x) < 20) { score = Math.max(0, score - 100); P.hitCd = .9; P.stumble = .45; pop(P.x, 60, '-100', '#ff6b6b'); sfx.thud(); break; }
    if (P.inv <= 0) for (const s of R.snakes) if (Math.abs(P.x - s) < 18 && P.y < 22) return die('snake');
    if (R.tre && !R.tre.got && Math.abs(P.x - R.tre.x) < 22 && P.y < 44) { R.tre.got = true; score += R.tre.v; pop(R.tre.x, 60, '+' + R.tre.v, '#ffd23f'); sfx.coin(); }
    if (P.x >= END) win();
  }

  // ---------- drawing ----------
  const sx = x => (x - cam) * S, sy = h => baseY - h * S;
  function hash(i) { const s = Math.sin(i * 127.1) * 43758.5453; return s - Math.floor(s); }
  let tunnelPat = null;
  function drawBackdrop() {
    const vw = W / S;
    // misty jungle sky glow through the canopy
    const g = ctx.createLinearGradient(0, 0, 0, baseY);
    g.addColorStop(0, '#0a2a18'); g.addColorStop(.45, '#2f7a45'); g.addColorStop(.8, '#a8d878'); g.addColorStop(1, '#6aa850');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, baseY);
    A.glow(ctx, W * .65, baseY * .45, W * .6, '255,250,200', .18);
    // god rays
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 5; i++) { const x = ((i * 170 - cam * .15) % (vw + 200) + vw + 200) % (vw + 200) - 100; ctx.fillStyle = 'rgba(255,250,200,.05)'; ctx.beginPath(); ctx.moveTo(x * S, 0); ctx.lineTo((x + 40) * S, 0); ctx.lineTo((x + 110) * S, baseY); ctx.lineTo((x + 60) * S, baseY); ctx.fill(); }
    ctx.restore();
    // three layers of trunks: far misty, mid, near with bark, moss and hanging leaves
    [[.2, 80, '#3a7a52', 8, .55], [.4, 110, '#2a5a38', 14, .3], [.65, 170, '#4a3522', 22, 0]].forEach(([par, step, col, wBase, fog]) => {
      const off = cam * par;
      for (let i = Math.floor(off / step) - 1; i * step - off < vw + step; i++) {
        const x = (i * step - off + hash(i + par * 10) * step * .5) * S, w = (wBase + hash(i * 3 + par) * 10) * S;
        const tg = ctx.createLinearGradient(x, 0, x + w, 0); tg.addColorStop(0, A.shade(col, .2)); tg.addColorStop(.5, col); tg.addColorStop(1, A.shade(col, -.45));
        ctx.fillStyle = tg; ctx.fillRect(x, 0, w, baseY);
        if (!fog) {
          ctx.fillStyle = 'rgba(0,0,0,.25)'; for (let k = 0; k < 9; k++) ctx.fillRect(x + w * (.2 + hash(i * 7 + k) * .6), (k * 30 + hash(i + k) * 20) * S, 1.2 * S, (12 + hash(k * 3 + i) * 14) * S);
          ctx.fillStyle = 'rgba(90,170,70,.55)'; ctx.fillRect(x, baseY - 40 * S, w * .5, 40 * S); ctx.fillRect(x + w * .1, baseY * .4, w * .3, 30 * S);

    // boots
    ctx.fillStyle = '#1a0e06'; ctx.fillRect(-8 + (hang ? -2 : air ? -3 : sw * 11 + 4), -4, 9, 4.5); ctx.fillRect(-1 + (hang ? 4 : air ? 11 : -sw * 11 - 4), -4, 9, 4.5);
    ctx.fillStyle = '#4a2a14'; ctx.fillRect(-7.4 + (hang ? -2 : air ? -3 : sw * 11 + 4), -3.4, 7.8, 3); ctx.fillRect(-.4 + (hang ? 4 : air ? 11 : -sw * 11 - 4), -3.4, 7.8, 3);

    ctx.fillStyle = '#8a5a2a'; ctx.fillRect(-8, -35, 3.2, 18); ctx.fillRect(4.8, -35, 3.2, 18); ctx.fillStyle = '#f0e0c0'; ctx.beginPath(); ctx.moveTo(-2, -36.5); ctx.lineTo(1, -32); ctx.lineTo(4, -36.5); ctx.fill();
    ctx.strokeStyle = '#5a3216'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-6, -36); ctx.lineTo(6, -20); ctx.stroke();
