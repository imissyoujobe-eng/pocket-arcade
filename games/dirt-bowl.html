<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dirt Bowl</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script src="../lib/three.min.js"></script>
<script>
// Dirt Bowl: stadium off-road truck racing under the lights. Four trucks, four laps, jumps, whoops and mud pits.
// Your truck drives itself: steer, tap NITRO for a boost, hold BRAKE to slow down or back up. Win prize money and
// spend it in the pit shop on a bigger engine, grippier tires and softer shocks. Finish last and you lose a truck.
K.theme({ bg: '#140d08', ink: '#fff6e8', accent: '#ff7a1a', accentInk: '#1a0d00' });
K.hud(['race', 'cash']);
K.pad({ dpad: 'lr', buttons: [{ id: 'v', label: 'VIEW', top: true }, { id: 'b', label: 'BRAKE' }, { id: 'a', label: 'NITRO' }] });
addEventListener('keydown', e => { if (e.key === 'v' || e.key === 'V') K.press('v'); });
addEventListener('keyup', e => { if (e.key === 'v' || e.key === 'V') K.release('v'); });

const TAU = Math.PI * 2, G = 22, TW = 11, HW = TW / 2, LAPS = 4;
const FX0 = -80, FZ0 = -52, FW = 160, FD = 104, SXN = 240, SZN = 156, CELL = FW / SXN, GXN = SXN + 1, GZN = SZN + 1;   // the stadium floor: 160 x 104 m on a 2/3 m grid
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrapA = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
const money = v => '$' + Math.round(v).toLocaleString('en-US');
const ord = n => n + (['ST', 'ND', 'RD'][n - 1] || 'TH');

// ---------------------------------------------------------------- the tracks
// pts: the centre line (a closed loop, metres). feats: what's on it, at a fraction u of the way round:
// table (tabletop jump), step (long step-up), kicker (ramp with a drop-off), double (two humps: jump the gap),
// whoops (a row of bumps), mud (a sticky, slow pit)
const TRACKS = [
  { n: 'Thunder Bowl', pts: [[-58, 30], [-12, 34], [38, 31], [64, 10], [60, -24], [28, -33], [4, -16], [-22, -32], [-56, -28], [-68, 0]],
    feats: [{ k: 'whoops', u: 0.10, n: 6 }, { k: 'table', u: 0.255, h: 2.2 }, { k: 'mud', u: 0.47, len: 20 }, { k: 'double', u: 0.635, h: 1.8 }, { k: 'kicker', u: 0.86, h: 2.0 }] },
  { n: 'Snake Pit', pts: [[-64, 32], [-24, 33], [-4, 14], [16, 33], [56, 33], [68, 6], [44, -6], [62, -30], [16, -35], [-2, -14], [-24, -34], [-62, -30], [-56, 2]],
    feats: [{ k: 'table', u: 0.12, h: 2.0 }, { k: 'mud', u: 0.33, len: 24 }, { k: 'whoops', u: 0.52, n: 7 }, { k: 'kicker', u: 0.70, h: 2.2 }, { k: 'double', u: 0.89, h: 1.7 }] },
  { n: 'Crossroads', pts: [[-18, -12], [-48, -32], [-70, -4], [-52, 30], [-18, 14], [18, -14], [52, -32], [70, 2], [50, 31], [18, 12]],
    feats: [{ k: 'step', u: 0.17, h: 1.7 }, { k: 'whoops', u: 0.36, n: 6 }, { k: 'table', u: 0.66, h: 2.3 }, { k: 'mud', u: 0.86, len: 18 }] },
  { n: 'Big Sky', pts: [[-60, 28], [0, 33], [60, 28], [70, 0], [60, -28], [0, -33], [-60, -28], [-70, 0]],
    feats: [{ k: 'table', u: 0.07, h: 2.6, top: 9 }, { k: 'double', u: 0.24, h: 2.0 }, { k: 'mud', u: 0.43, len: 22 }, { k: 'kicker', u: 0.57, h: 2.4 }, { k: 'whoops', u: 0.72, n: 8 }, { k: 'step', u: 0.86, h: 1.8 }] }
];
const FH = { table: 2.2, step: 1.7, kicker: 2.1, double: 1.8, whoops: 0.62, mud: 0 };
function featLen(f) { switch (f.k) { case 'table': return 13 + (f.top || 7); case 'step': return 15 + (f.top || 16); case 'kicker': return 11; case 'double': return 24; case 'whoops': return (f.n || 6) * 4.4; case 'mud': return f.len || 20; } return 0; }
// height of a feature, ds metres after its start
function featH(f, ds) {
  if (ds < 0 || ds > f.len) return 0;
  const h = f.h || FH[f.k];
  switch (f.k) {
    case 'table': { const top = f.top || 7; return ds < 6 ? h * ds / 6 : ds < 6 + top ? h : h * (1 - (ds - 6 - top) / 7); }
    case 'step': { const top = f.top || 16; return ds < 6 ? h * ds / 6 : ds < 6 + top ? h : h * (1 - (ds - 6 - top) / 9); }
    case 'kicker': return ds < 8 ? h * ds / 8 : h * 0.5 * (1 + Math.cos(Math.PI * (ds - 8) / 3));
    case 'double': { const hump = d => d < 0 || d > 10 ? 0 : d < 5 ? h * d / 5 : h * (10 - d) / 5; return Math.max(hump(ds), hump(ds - 14)); }
    case 'whoops': return h * 0.5 * (1 - Math.cos(TAU * ds / 4.4));
    case 'mud': return -0.32 * Math.sin(Math.PI * ds / f.len);
  }
  return 0;
}
let TR = null, smp = [], N = 0, TRL = 0, DS = 0.8, trackBox = null;
function sampleTrack(T) {
  const curve = new THREE.CatmullRomCurve3(T.pts.map(p => new THREE.Vector3(p[0], 0, p[1])), true, 'centripetal');
  const L = curve.getLength(); N = Math.round(L / 0.8);
  const P = curve.getSpacedPoints(N); P.pop();
  smp = P.map(p => ({ x: p.x, z: p.z }));
  smp.forEach((p, i) => { const q = smp[(i + 1) % N], dx = q.x - p.x, dz = q.z - p.z, d = Math.hypot(dx, dz) || 1; p.dx = dx / d; p.dz = dz / d; p.sx = -p.dz; p.sz = p.dx; p.a = Math.atan2(p.dx, p.dz); });
  let s = 0; smp.forEach((p, i) => { p.s = s; const q = smp[(i + 1) % N]; s += Math.hypot(q.x - p.x, q.z - p.z); }); TRL = s; DS = TRL / N;
  // curvature (heading change per metre), smoothed over a few metres
  smp.forEach((p, i) => { const a0 = smp[(i - 6 + N) % N].a, a1 = smp[(i + 6) % N].a; p.k = wrapA(a1 - a0) / (12 * DS); });
  TR = T; T.feats.forEach(f => { f.s0 = f.u * TRL; f.len = featLen(f); });
  smp.forEach(p => { p.mud = T.feats.some(f => f.k === 'mud' && inFeat(f, p.s)); p.jump = T.feats.some(f => f.k !== 'mud' && f.k !== 'whoops' && inFeat(f, p.s)); });
  let a = 1e9, b = -1e9, c = 1e9, d = -1e9; smp.forEach(p => { a = Math.min(a, p.x); b = Math.max(b, p.x); c = Math.min(c, p.z); d = Math.max(d, p.z); }); trackBox = { x0: a, x1: b, z0: c, z1: d };
}
function inFeat(f, s) { let ds = s - f.s0; if (ds < 0) ds += TRL; return ds <= f.len; }
function profH(s) { let h = 0; for (const f of TR.feats) { let ds = s - f.s0; if (ds < -TRL / 2) ds += TRL; else if (ds > TRL / 2) ds -= TRL; h += featH(f, ds); } return h; }
function mudAt(s) { for (const f of TR.feats) if (f.k === 'mud' && inFeat(f, s)) return true; return false; }
// how muddy the ground is at s (0..1), easing in and out over the first and last few metres
function mudW(s) { let w = 0; for (const f of TR.feats) { if (f.k !== 'mud') continue; let ds = s - f.s0; if (ds < -TRL / 2) ds += TRL; else if (ds > TRL / 2) ds -= TRL; if (ds < 0 || ds > f.len) continue; w = Math.max(w, sstep(0, 4, ds) * (1 - sstep(f.len - 4, f.len, ds))); } return w; }
// nearest centre-line sample to (x, z), searching around the last one we knew
function nearest(x, z, hint) {
  let best = 0, bd = 1e18;
  if (hint == null) { for (let i = 0; i < N; i += 3) { const p = smp[i], d = (p.x - x) * (p.x - x) + (p.z - z) * (p.z - z); if (d < bd) { bd = d; best = i; } } hint = best; }
  for (let j = -45; j <= 45; j++) { const i = (hint + j + N) % N, p = smp[i], d = (p.x - x) * (p.x - x) + (p.z - z) * (p.z - z); if (d < bd) { bd = d; best = i; } }
  return best;
}

// ---------------------------------------------------------------- the ground: one height map for the whole floor
const HF = new Float32Array(GXN * GZN), HC = new Float32Array(GXN * GZN * 3);
function vnoise(x, z) { const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz, h = (a, b) => A.hash(a, b); const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz); return lerp(lerp(h(ix, iz), h(ix + 1, iz), u), lerp(h(ix, iz + 1), h(ix + 1, iz + 1), u), v); }
function buildHeights() {
  for (let iz = 0; iz < GZN; iz++) for (let ix = 0; ix < GXN; ix++) {
    const x = FX0 + ix * CELL, z = FZ0 + iz * CELL;
    let ci = 0, bd = 1e18;
    for (let i = 0; i < N; i += 4) { const p = smp[i], d = (p.x - x) * (p.x - x) + (p.z - z) * (p.z - z); if (d < bd) { bd = d; ci = i; } }
    let bi = ci; for (let j = -5; j <= 5; j++) { const i = (ci + j + N) % N, p = smp[i], d = (p.x - x) * (p.x - x) + (p.z - z) * (p.z - z); if (d < bd) { bd = d; bi = i; } }
    const p = smp[bi], dx = x - p.x, dz = z - p.z, s = p.s + dx * p.dx + dz * p.dz, l = dx * p.sx + dz * p.sz, al = Math.abs(l);
    const fade = 1 - sstep(HW - 0.4, HW + 2.4, al), ft = fade > 0 ? profH(s) * fade : 0;
    // the berm: a steep inside face up to the crest (where the hay bales sit), then a long gentle back slope
    const u = al - (HW - 0.2), berm = u <= 0 ? 0 : u < 1.9 ? Math.pow(Math.sin(Math.PI / 2 * u / 1.9), 1.2) : u < 6.1 ? Math.pow(Math.cos(Math.PI / 2 * (u - 1.9) / 4.2), 1.5) : 0;
    const n = vnoise(x * 0.11, z * 0.11), n2 = vnoise(x * 0.5 + 40, z * 0.5);
    let h = ft >= 0 ? Math.max(ft, berm) : ft + berm;
    if (al > HW + 5.9) h += (n - 0.5) * 0.3 * sstep(HW + 5.9, HW + 10, al);
    const k = iz * GXN + ix; HF[k] = h;
    // colour: packed racing dirt with darker tyre grooves, loose light dirt on the berms, wet black mud, dull infield
    let r, g, b;
    if (al < HW + 0.3) {
      r = 0.66; g = 0.44; b = 0.25; const gr = Math.min(Math.abs(al - 1.5), Math.abs(al - 3.7)); if (gr < 0.55) { const q = 0.84 + gr * 0.2; r *= q; g *= q; b *= q; }
      if (ft > 0.25) { r *= 1.06; g *= 1.04; }
      const mw = mudW(((s % TRL) + TRL) % TRL) * (1 - sstep(HW - 1.6, HW + 0.3, al));
      if (mw > 0) { r = lerp(r, 0.25, mw); g = lerp(g, 0.165, mw); b = lerp(b, 0.10, mw); }
    } else if (al < HW + 5.9) { const q = sstep(HW + 0.3, HW + 1.2, al) * (1 - sstep(HW + 3, HW + 5.9, al) * 0.6); r = lerp(0.62, 0.74, q); g = lerp(0.42, 0.52, q); b = lerp(0.24, 0.31, q); }
    else { r = 0.50; g = 0.35; b = 0.21; if (n > 0.62) { r *= 0.88; g *= 0.88; b *= 0.9; } }
    const v = 0.9 + n2 * 0.2; HC[k * 3] = r * v; HC[k * 3 + 1] = g * v; HC[k * 3 + 2] = b * v;
  }
}
function gH(x, z) {
  let fx = (x - FX0) / CELL, fz = (z - FZ0) / CELL; fx = fx < 0 ? 0 : fx > GXN - 1.001 ? GXN - 1.001 : fx; fz = fz < 0 ? 0 : fz > GZN - 1.001 ? GZN - 1.001 : fz;
  const ix = fx | 0, iz = fz | 0, tx = fx - ix, tz = fz - iz, k = iz * GXN + ix;
  return (HF[k] * (1 - tx) + HF[k + 1] * tx) * (1 - tz) + (HF[k + GXN] * (1 - tx) + HF[k + GXN + 1] * tx) * tz;
}

// ---------------------------------------------------------------- 3D setup
let renderer, scene, camera, stageEl, hudC, hud, HWd = 1, HHd = 1, HD = 1, PR = 1.5, floorMesh = null, trackGrp = null, dirtTex = null;
function canvasTex(w, h, draw, rep) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; } t.anisotropy = 4; return t; }
function setup() {
  stageEl = document.getElementById('ks'); const kc = stageEl.querySelector('canvas'); if (kc) kc.style.display = 'none';
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' }); PR = Math.min(devicePixelRatio || 1, 1.75); renderer.setPixelRatio(PR);
  renderer.domElement.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block'; stageEl.style.position = 'relative'; stageEl.insertBefore(renderer.domElement, stageEl.firstChild);
  hudC = document.createElement('canvas'); hudC.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1'; stageEl.insertBefore(hudC, renderer.domElement.nextSibling); hud = hudC.getContext('2d');
  scene = new THREE.Scene(); camera = new THREE.PerspectiveCamera(60, 1, 0.2, 700);
  scene.background = A.skyTex(THREE, '#03050c', '#1b2236'); scene.fog = new THREE.Fog(0x161b28, 150, 420);
  scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x5a3c22, 0.72));
  const sun = new THREE.DirectionalLight(0xfff1dc, 0.95); sun.position.set(30, 90, 45); scene.add(sun);
  const fill = new THREE.DirectionalLight(0xc8d8ff, 0.35); fill.position.set(-40, 50, -60); scene.add(fill);
  dirtTex = canvasTex(256, 256, (c, w, h) => {
    c.fillStyle = '#e6e2dc'; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 2600; i++) { c.fillStyle = Math.random() < 0.55 ? 'rgba(60,40,25,' + (0.08 + Math.random() * 0.14) + ')' : 'rgba(255,250,240,' + (0.1 + Math.random() * 0.2) + ')'; const s = 1 + Math.random() * 2.2; c.fillRect(Math.random() * w, Math.random() * h, s, s); }
    for (let i = 0; i < 90; i++) { const x = Math.random() * w, y = Math.random() * h, r = 1.5 + Math.random() * 3; c.fillStyle = 'rgba(40,28,18,.35)'; c.beginPath(); c.ellipse(x + 1, y + 1, r, r * 0.7, 0, 0, TAU); c.fill(); c.fillStyle = 'rgba(220,205,185,.8)'; c.beginPath(); c.ellipse(x, y, r, r * 0.7, 0, 0, TAU); c.fill(); }
  }, true);
  dirtTex.repeat.set(FW / 4, FD / 4);
  buildStadium();
  PUFF = pSystem(700, false, softTex('puff')); GLOW = pSystem(300, true, softTex('glow')); scene.add(PUFF.pts, GLOW.pts);
  addEventListener('resize', fit); fit();
}
function fit() {
  if (!renderer) return;
  const r = stageEl.getBoundingClientRect(), w = Math.max(100, r.width), h = Math.max(100, r.height);
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  HWd = w; HHd = h; HD = Math.min(devicePixelRatio || 1, 2); hudC.width = Math.round(w * HD); hudC.height = Math.round(h * HD);
  const sc = (h * PR) / (2 * Math.tan(camera.fov * Math.PI / 360));
  [PUFF, GLOW].forEach(S => S && (S.mat.uniforms.scale.value = sc, S.mat.uniforms.maxs.value = 0.6 * sc));

// the stands, walls with sponsor boards, light towers and the big screen
function buildStadium() {
  const ads = canvasTex(1024, 128, (c, w, h) => {
    const AD = [['DIRT BOWL', '#ff7a1a', '#1a0d00'], ['GRIT OIL', '#1a1a1a', '#ffd23f'], ['MUDSLINGER TIRES', '#f4f0e6', '#c8282a'], ['TURBO JERKY', '#c8282a', '#fff']];
    AD.forEach((a, i) => { const x = i * w / 4; c.fillStyle = a[1]; c.fillRect(x, 0, w / 4, h); c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(x, h - 10, w / 4, 10); c.fillStyle = a[2]; c.font = 'bold ' + (a[0].length > 10 ? 30 : 40) + 'px Impact, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(a[0], x + w / 8, h / 2); c.fillStyle = 'rgba(255,255,255,.15)'; c.fillRect(x, 0, w / 4, 6); c.fillStyle = '#111'; c.fillRect(x, 0, 3, h); });
  }, true);
  const crowd = canvasTex(512, 256, (c, w, h) => {
    c.fillStyle = '#23262e'; c.fillRect(0, 0, w, h);
    for (let row = 0; row < 8; row++) { const y = row * 32; c.fillStyle = '#30343e'; c.fillRect(0, y + 24, w, 8); c.fillStyle = '#1a1c22'; c.fillRect(0, y + 31, w, 1);
      for (let x = 3; x < w; x += 11 + Math.random() * 4) { if (Math.random() < 0.1) continue; const col = ['#b8333f', '#3462b8', '#c8a632', '#d8d8d8', '#c86a2a', '#4a9a6a', '#7a5aa8', '#c88aa0', '#2a2a30'][Math.floor(Math.random() * 9)], up = Math.random() < 0.15 ? -3 : 0;
        c.fillStyle = col; c.beginPath(); c.roundRect(x, y + 11 + up, 9, 14, 3); c.fill(); c.fillStyle = ['#e8c09a', '#c08c64', '#8a5a3a', '#f0d4b8'][Math.floor(Math.random() * 4)]; c.beginPath(); c.arc(x + 4.5, y + 7 + up, 3.6, 0, TAU); c.fill(); } }
  }, true);
  const concrete = new THREE.MeshLambertMaterial({ color: 0x5a5e66 });
  const sides = [{ ax: 'z', s: 1 }, { ax: 'z', s: -1 }, { ax: 'x', s: 1 }, { ax: 'x', s: -1 }];
  sides.forEach(sd => {
    const long = sd.ax === 'z', len = long ? FW + 1.2 : FD + 1.2, edge = long ? FD / 2 + 0.3 : FW / 2 + 0.3;
    // wall
    const wall = new THREE.Mesh(new THREE.BoxGeometry(long ? len : 0.6, 2.3, long ? 0.6 : len), concrete);
    if (long) wall.position.set(0, 1.0, sd.s * (edge + 0.3)); else wall.position.set(sd.s * (edge + 0.3), 1.0, 0); scene.add(wall);
    // sponsor boards on the inside face
    const at = ads.clone(); at.needsUpdate = true; at.repeat.set(Math.round(len / 16), 1);
    const board = new THREE.Mesh(new THREE.PlaneGeometry(len, 1.5), new THREE.MeshBasicMaterial({ map: at, color: 0xdddddd }));
    board.position.y = 1.15; if (long) { board.position.z = sd.s * edge; board.rotation.y = sd.s > 0 ? Math.PI : 0; } else { board.position.x = sd.s * edge; board.rotation.y = sd.s > 0 ? -Math.PI / 2 : Math.PI / 2; }
    scene.add(board);
    // the stands: a steep bank of seats full of people, rising away from the wall
    const depth = 34, rise = 24, sl = Math.hypot(depth, rise), w2 = long ? FW + 70 : FD + 70;
    const ct = crowd.clone(); ct.needsUpdate = true; ct.repeat.set(w2 / 26, sl / 7);
    const st = new THREE.Mesh(new THREE.PlaneGeometry(w2, sl), new THREE.MeshLambertMaterial({ map: ct }));
    const ang = Math.atan2(rise, depth);
    const g = new THREE.Group(); g.add(st); st.rotation.x = -Math.PI / 2 + ang; st.position.set(0, 2.2 + rise / 2, -(1 + depth / 2));
    const roof = new THREE.Mesh(new THREE.BoxGeometry(w2, 2.2, 3), new THREE.MeshLambertMaterial({ color: 0x2a2d36 })); roof.position.set(0, 2.2 + rise + 1.1, -(depth + 2)); g.add(roof);
    // facing the field: the group's -z is outward
    if (long) { g.position.z = sd.s * (edge + 0.6); g.rotation.y = sd.s > 0 ? Math.PI : 0; } else { g.position.x = sd.s * (edge + 0.6); g.rotation.y = sd.s > 0 ? -Math.PI / 2 : Math.PI / 2; }
    scene.add(g);
  });
  // light towers in the corners, aimed at the floor
  const lamp = canvasTex(128, 64, (c, w, h) => { c.fillStyle = '#2a2a30'; c.fillRect(0, 0, w, h); for (let y = 0; y < 3; y++) for (let x = 0; x < 6; x++) { const g = c.createRadialGradient(12 + x * 21, 12 + y * 20, 1, 12 + x * 21, 12 + y * 20, 10); g.addColorStop(0, '#ffffff'); g.addColorStop(0.6, '#fff4d0'); g.addColorStop(1, '#8a8470'); c.fillStyle = g; c.fillRect(2 + x * 21, 2 + y * 20, 20, 19); } });
  const glowT = softTex('glow');
  [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(([sx, sz]) => {
    const x = sx * (FW / 2 + 30), z = sz * (FD / 2 + 30);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.9, 52, 8), new THREE.MeshLambertMaterial({ color: 0x3a3e46 })); pole.position.set(x, 26, z); scene.add(pole);
    const bank = new THREE.Mesh(new THREE.BoxGeometry(12, 6, 0.8), [0, 0, 0, 0, 1, 0].map(i => i ? new THREE.MeshBasicMaterial({ map: lamp }) : new THREE.MeshLambertMaterial({ color: 0x2a2a30 })));
    bank.position.set(x, 53, z); bank.lookAt(0, 0, 0); scene.add(bank);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowT, color: 0xfff2d8, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
    sp.position.set(x * 0.985, 53, z * 0.985); sp.scale.set(34, 34, 1); scene.add(sp);
  });
  // the big screen over the far stand

let camPos = new THREE.Vector3(0, 40, 90), camLook = new THREE.Vector3(), camYaw = 0, camY = 0, orbit = 0;
const DB = { auto: false, top: false, pause: false };   // test hooks: DB.auto lets the computer drive your truck
function camUpdate(dt) {
  const land = HWd > HHd;
  if (DB.cam) { camera.position.set(...DB.cam[0]); camera.lookAt(...DB.cam[1]); camera.fov = 50; camera.updateProjectionMatrix(); return; }
  if (DB.top) { camera.position.set(0, 150, 0.01); camera.lookAt(0, 0, 0); camera.fov = 60; camera.updateProjectionMatrix(); return; }
  if (state === 'title' || state === 'card') {
    orbit += dt * 0.06; const r = land ? 92 : 110;
    camera.position.set(Math.sin(orbit) * r, land ? 34 : 46, Math.cos(orbit) * r * 0.7); camera.lookAt(0, 0, 0);
    camera.fov = land ? 55 : 75; camera.updateProjectionMatrix(); camPos.copy(camera.position); return;
  }
  if (state === 'done' && doneT > 1.2) {
    orbit += dt * 0.35; const r = 11; camera.position.set(me.x + Math.sin(orbit) * r, me.y + 4.5, me.z + Math.cos(orbit) * r); camera.lookAt(me.x, me.y + 1.2, me.z); camPos.copy(camera.position); return;
  }
  const sp = Math.hypot(me.vx, me.vz), va = sp > 3 ? Math.atan2(me.vx, me.vz) : me.a;
  const want = me.a + wrapA(va - me.a) * 0.45; camYaw += wrapA(want - camYaw) * Math.min(1, dt * 3.2);
  camY += ((me.air ? Math.max(me.y - 1.2, gH(me.x, me.z)) : me.y) - camY) * Math.min(1, dt * (me.air ? 2.5 : 6));
  const back = view ? 16 : 7.4, up = view ? 12.5 : 4.0, ahead = view ? 6 : 7;
  const tx = me.x - Math.sin(camYaw) * back, tz = me.z - Math.cos(camYaw) * back, ty = Math.max(gH(tx, tz) + 1.6, camY + up);
  camPos.lerp(_v4.set(tx, ty, tz), Math.min(1, dt * 7));
  camLook.set(me.x + Math.sin(camYaw) * ahead, camY + (view ? 0 : 1.3), me.z + Math.cos(camYaw) * ahead);
  const sh = shake > 0 ? shake * 0.35 : 0; if (shake > 0) shake = Math.max(0, shake - dt * 1.5);
  camera.position.set(camPos.x + (Math.random() - 0.5) * sh, camPos.y + (Math.random() - 0.5) * sh, camPos.z + (Math.random() - 0.5) * sh); camera.lookAt(camLook);
  camera.fov = (land ? 58 : 76) + clamp(sp, 0, 32) * 0.18 + (me.nitroT > 0 ? 7 : 0); camera.updateProjectionMatrix();
}

// ---------------------------------------------------------------- HUD (drawn over the 3D picture)
function txt(c, s, x, y, size, col, align) { c.font = size + 'px Bungee, Impact, sans-serif'; c.textAlign = align || 'left'; c.textBaseline = 'middle'; c.fillStyle = 'rgba(0,0,0,.65)'; c.fillText(s, x + 2, y + 2); c.fillStyle = col; c.fillText(s, x, y); }
function position(t) {
  const sorted = trucks.slice().sort((a, b) => { if (a.done && b.done) return a.time - b.time; if (a.done) return -1; if (b.done) return 1; return b.prog - a.prog; });
  return sorted.indexOf(t) + 1;
}
function hudDraw() {
  const c = hud, w = HWd, h = HHd; c.setTransform(HD, 0, 0, HD, 0, 0); c.clearRect(0, 0, w, h);
  if (state === 'title' || state === 'card' || !me) return;
  const land = w > h, top = land ? 14 : 10, x0 = land ? 16 : 12;
  const pos = position(me);
  txt(c, ord(pos), x0, top + 18, land ? 32 : 28, pos === 1 ? '#ffd23f' : '#fff6e8');
  txt(c, 'LAP ' + Math.min(LAPS, me.lap + 1) + '/' + LAPS, x0, top + 48, 15, '#fff');
  // nitro bottles
  for (let k = 0; k < Math.min(9, me.nitros); k++) { const bx = x0 + k * 13, by = top + 64; c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(bx - 1, by - 1, 10, 22); c.fillStyle = '#2fe06a'; c.fillRect(bx, by + 4, 8, 16); c.fillStyle = '#f4f4f4'; c.fillRect(bx + 2, by, 4, 4); }
  if (me.nitroT > 0) { c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(x0, top + 90, 80, 6); c.fillStyle = '#5ac8ff'; c.fillRect(x0, top + 90, 80 * me.nitroT / (2.2 + me.up.eng * 0.12), 6); }
  txt(c, Math.round(Math.hypot(me.vx, me.vz) * 2.237) + ' MPH', x0, top + (me.nitroT > 0 ? 110 : 98), 13, '#ffd9b0');
  // minimap
  const ms = land ? 92 : 78, mx = w - ms - (land ? 14 : 10), my = top + 2, bw = trackBox.x1 - trackBox.x0, bh = trackBox.z1 - trackBox.z0, sc = ms / Math.max(bw, bh), ox = mx + (ms - bw * sc) / 2, oy = my + (ms - bh * sc) / 2;
  c.fillStyle = 'rgba(0,0,0,.4)'; c.beginPath(); c.roundRect(mx - 6, my - 6, ms + 12, ms + 12, 8); c.fill();
  c.strokeStyle = 'rgba(255,220,170,.85)'; c.lineWidth = 3; c.beginPath(); smp.forEach((p, i) => { if (i % 5) return; const X = ox + (p.x - trackBox.x0) * sc, Y = oy + (p.z - trackBox.z0) * sc; i ? c.lineTo(X, Y) : c.moveTo(X, Y); }); c.closePath(); c.stroke();
  trucks.forEach(t => { if (t === me) return; c.fillStyle = '#' + t.color.toString(16).padStart(6, '0'); c.beginPath(); c.arc(ox + (t.x - trackBox.x0) * sc, oy + (t.z - trackBox.z0) * sc, 3.2, 0, TAU); c.fill(); });
  c.fillStyle = '#fff'; c.beginPath(); c.arc(ox + (me.x - trackBox.x0) * sc, oy + (me.z - trackBox.z0) * sc, 5, 0, TAU); c.fill(); c.fillStyle = '#e23a2a'; c.beginPath(); c.arc(ox + (me.x - trackBox.x0) * sc, oy + (me.z - trackBox.z0) * sc, 3.5, 0, TAU); c.fill();
  // start lights
  if (state === 'count') {
    const n = countdown > 3 ? 0 : 4 - Math.ceil(countdown), cx = w / 2, cy = h * 0.3;
    c.fillStyle = 'rgba(10,10,14,.8)'; c.beginPath(); c.roundRect(cx - 74, cy - 22, 148, 44, 12); c.fill();
    for (let k = 0; k < 3; k++) { c.fillStyle = k < n ? '#ff3030' : '#3a1414'; c.beginPath(); c.arc(cx - 44 + k * 44, cy, 14, 0, TAU); c.fill(); }
  }
  if (state === 'race' && raceT < 1) { const cx = w / 2, cy = h * 0.3; c.fillStyle = 'rgba(10,10,14,.8)'; c.beginPath(); c.roundRect(cx - 74, cy - 22, 148, 44, 12); c.fill(); for (let k = 0; k < 3; k++) { c.fillStyle = '#30ff6a'; c.beginPath(); c.arc(cx - 44 + k * 44, cy, 14, 0, TAU); c.fill(); } txt(c, 'GO!', cx, cy + 50, 40, '#7cff6b', 'center'); }
  if (msgT > 0) txt(c, msg, w / 2, h * (land ? 0.24 : 0.22), land ? 26 : 22, '#ffd23f', 'center');
  if (state === 'done') txt(c, 'FINISHED ' + ord(finishOrder.indexOf(me) + 1), w / 2, h * 0.3, land ? 34 : 28, '#fff', 'center');
}

// ---------------------------------------------------------------- the season: races, prize money, the pit shop
function trackFor(r) { return r % TRACKS.length; }
function setTrack(ti) { if (trackNow !== ti) { buildTrackScene(TRACKS[ti]); trackNow = ti; } }
function attract() {
  setTrack(season ? trackFor(season.race) : 0); placeGrid(true); state = 'title'; raceT = 0;
}
function title() {
  attract();
  K.card({ title: 'DIRT BOWL', text: 'Stadium off-road racing under the lights: four trucks, four laps, big jumps, bumps and sticky mud. Your truck drives itself. Steer with the stick, tap NITRO for a burst of speed, hold BRAKE to slow down or back up. Land on the far side of a jump to keep your speed. Grab nitro cans and cash bags, win prize money, then upgrade your engine, tires and shocks in the pit shop. Finish last and you lose a truck. Lose all three and the season is over. VIEW switches the camera.', best: best ? 'BEST ' + money(best) : '', button: 'Start season', onStart: newSeason });
}
function newSeason() { audioOn(); season = SEASON0(); startRace(); }
function startRace() {
  audioOn(); const ti = trackFor(season.race); setTrack(ti); placeGrid(false);
  state = 'count'; countdown = 3.6; raceT = 0; raceBonus = 0; airBonus = 0; doneT = 0; msgT = 0; camY = me.y; camYaw = me.a; camPos.set(me.x - Math.sin(me.a) * 9, me.y + 4, me.z - Math.cos(me.a) * 9);
  K.set('race', 'RACE ' + (season.race + 1) + ' · ' + TRACKS[ti].n.toUpperCase()); K.set('cash', money(season.cash));
}
function finishRace() {
  const place = finishOrder.indexOf(me) + 1, prize = PRIZE[place - 1] + raceBonus + airBonus;
  season.cash += prize; season.winnings += prize; if (place === 1) season.wins++; season.nitros = me.nitros; season.race++;
  if (place === 4) season.credits--;
  if (season.winnings > best) { best = season.winnings; try { localStorage.setItem('pa-dirtbowl', best); } catch (e) {} }
  K.set('cash', money(season.cash));
  state = 'card';
  const extra = (raceBonus ? ' Cash bags: ' + money(raceBonus) + '.' : '') + (airBonus ? ' Big air bonus: ' + money(airBonus) + '.' : '');
  if (season.credits <= 0) {
    const b = K.saveBest('dirtbowl', season.winnings); best = Math.max(best, b);
    K.card({ title: 'SEASON OVER', text: 'Last place again, and that was your last truck. You raced ' + season.race + (season.race === 1 ? ' race' : ' races') + ' and won ' + season.wins + '. Total winnings: ' + money(season.winnings) + '.', best: 'BEST ' + money(best), button: 'New season', onStart: newSeason });
    return;
  }
  K.card({ title: place === 1 ? 'YOU WIN!' : ord(place) + ' PLACE', text: 'Prize money: ' + money(PRIZE[place - 1]) + '.' + extra + (place === 4 ? ' Last place costs you a truck. Trucks left: ' + season.credits + '.' : ' Trucks left: ' + season.credits + '.'), best: 'CASH ' + money(season.cash), button: 'Pit shop', onStart: shop });
}
const UPS = [{ id: 'eng', n: 'ENGINE', d: 'Top speed and pickup' }, { id: 'tire', n: 'TIRES', d: 'Grip in the turns' }, { id: 'shock', n: 'SHOCKS', d: 'Softer landings, less mud' }];
const upCost = lvl => 400 + lvl * 300;
function shop() {
  state = 'card';
  K.card({ title: 'PIT SHOP', text: '', best: '', button: 'Race ' + (season.race + 1) + ': ' + TRACKS[trackFor(season.race)].n, onStart: startRace });
  const ov = document.getElementById('ko'), btn = ov && ov.querySelector(':scope > button'), p = ov && ov.querySelector('p'); if (!btn) return;
  const box = document.createElement('div'); box.className = 'db-shop'; ov.insertBefore(box, btn);
  const cashP = document.createElement('div'); cashP.className = 'db-cash'; ov.insertBefore(cashP, box);
  if (p) p.remove();
  function row(label, desc, pips, max, cost, can, buy) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'db-up'; b.disabled = !can;
    const pp = '<span class="pips">' + Array.from({ length: max }, (_, i) => '<i class="' + (i < pips ? 'on' : '') + '"></i>').join('') + '</span>';
    b.innerHTML = '<b>' + label + '</b>' + pp + '<span class="d">' + desc + '</span><span class="c">' + cost + '</span>';
    b.onclick = () => { if (!b.disabled) { buy(); K.beep(880, 0.08, { vol: 0.05 }); draw(); } };
    return b;
  }
  function draw() {
    box.innerHTML = ''; cashP.textContent = 'CASH ' + money(season.cash) + '  ·  TRUCKS ' + '♥'.repeat(season.credits);
    UPS.forEach(u => { const lv = season.up[u.id], c = upCost(lv), max = lv >= 6; box.appendChild(row(u.n, u.d, lv, 6, max ? 'MAX' : money(c), !max && season.cash >= c, () => { season.cash -= c; season.up[u.id]++; })); });
    const nc = 150; box.appendChild(row('NITRO', 'One more bottle', season.nitros, 9, season.nitros >= 9 ? 'FULL' : money(nc), season.nitros < 9 && season.cash >= nc, () => { season.cash -= nc; season.nitros++; }));
    K.set('cash', money(season.cash));
  }
  draw();
}
{ const st = document.createElement('style'); st.textContent =
  '#ko .db-cash{font:16px Bungee,Impact,sans-serif;color:var(--accent,#ff7a1a);letter-spacing:.02em}' +
  '#ko .db-shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;width:min(560px,100%)}' +
  '#ko .db-up{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:10px;row-gap:2px;align-items:center;padding:9px 12px;border-radius:12px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;cursor:pointer;text-align:left}' +
  '#ko .db-up:not(:disabled):active{transform:translateY(1px)}#ko .db-up:focus-visible{outline:3px solid #fff}' +
  '#ko .db-up b{font:15px Bungee,Impact,sans-serif;font-weight:400;grid-row:1;grid-column:1}' +
  '#ko .db-up .pips{grid-row:1;grid-column:2;display:flex;gap:3px}#ko .db-up .pips i{width:11px;height:11px;border-radius:3px;background:rgba(255,255,255,.18)}#ko .db-up .pips i.on{background:#ffb02e}' +
  '#ko .db-up .d{grid-row:2;grid-column:1/3;font:12.5px Rubik,system-ui,sans-serif;opacity:.75}' +
  '#ko .db-up .c{grid-row:1/3;grid-column:3;font:15px Bungee,Impact,sans-serif;color:#7cff8a;background:rgba(0,0,0,.3);padding:8px 10px;border-radius:9px}' +
  '#ko .db-up:disabled{cursor:default;opacity:.55}#ko .db-up:disabled .c{color:#c8c8c8}' +
  '@media (max-height:560px){#ko .db-up{padding:5px 10px}#ko .db-up .d{font-size:11px}#ko .db-shop{gap:6px}}' +
  // sideways the shop is one column in the middle, clear of the stick and the buttons at the sides
  'body.land #ko .db-shop{grid-template-columns:1fr;width:min(390px,calc(100vw - 412px));gap:5px}body.land #ko .db-up{padding:4px 10px}body.land #ko .db-up .c{padding:5px 9px}body.land #ko .db-cash{font-size:14px}';
  document.head.appendChild(st); }

// ---------------------------------------------------------------- the loop
let slowF = [], slowSkip = 60;
function update(dt) { if (renderer && !DB.pause) tick(dt); }   // DB.pause freezes the game (tests step it with tick)
function tick(dt) {
  if (K.hit('v')) view = 1 - view;
  if (msgT > 0) msgT -= dt;
  if (state === 'count') { const b = Math.ceil(countdown); countdown -= dt; if (Math.ceil(countdown) !== b && countdown > 0 && countdown <= 3) K.beep(440, 0.15, { vol: 0.06 }); if (countdown <= 0) { state = 'race'; raceT = 0; K.beep(880, 0.4, { vol: 0.07 }); } }
  else if (state === 'race' || state === 'title' || state === 'card' || state === 'done') raceT += dt;
  trucks.forEach(t => drive(t, dt));
  // trucks bump into each other
  for (let i = 0; i < trucks.length; i++) for (let j = i + 1; j < trucks.length; j++) {
    const a = trucks[i], b = trucks[j], dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz);
    if (d < 3.0 && d > 0.01 && Math.abs(a.y - b.y) < 1.8) {
      const nx = dx / d, nz = dz / d, push = (3.0 - d) / 2; a.x -= nx * push; a.z -= nz * push; b.x += nx * push; b.z += nz * push;
      const va = a.vx * nx + a.vz * nz, vb = b.vx * nx + b.vz * nz; if (va - vb > 0) { const imp = (va - vb) * 0.55; a.vx -= nx * imp; a.vz -= nz * imp; b.vx += nx * imp; b.vz += nz * imp; if ((a === me || b === me) && imp > 1.5) { K.noise(0.1, 0.25); shake = Math.max(shake, 0.25); } }
    }
  }
  stepPicks(dt);
  // finishing
  if (state === 'race' || state === 'done') trucks.forEach(t => { if (!t.done && t.lap >= LAPS) { t.done = true; t.time = raceT; finishOrder.push(t); if (t === me) { state = 'done'; doneT = 0; const pl = finishOrder.length; K.tune(pl === 1 ? [523, 659, 784, 1047, 1319] : [523, 659, 784], 0.12); } } });
  // all three other trucks are home: you can only be fourth, so the race ends now
  if (state === 'race' && !me.done && trucks.every(t => t === me || t.done)) { me.done = true; me.time = raceT + 999; finishOrder.push(me); state = 'done'; doneT = 0; K.tune([392, 330, 262], 0.14); }
  if (state === 'done') { doneT += dt; if (doneT > 3.2) { trucks.forEach(t => { if (!t.done) { t.done = true; t.time = 1e6 - t.prog; finishOrder.push(t); } }); finishRace(); } }
  stepPS(PUFF, dt); stepPS(GLOW, dt);
}
function draw() {
  if (!renderer) return;
  const now = performance.now(), el = draw.last ? (now - draw.last) / 1000 : 0.016; draw.last = now;
  trucks.forEach(t => pose(t, Math.min(0.05, el)));
  camUpdate(Math.min(0.05, el)); engineSound();
  trucks.forEach(t => { const d = t === me || state === 'title' || state === 'card' ? 99 : camera.position.distanceTo(t.mesh.root.position), op = Math.round(clamp((d - 4) / 4, 0.12, 1) * 20) / 20, m = t.mesh;
    if (m.op !== op) { m.op = op; const tr = op < 0.99; [m.mat, m.nm].forEach(x => { if (x.transparent !== tr) { x.transparent = tr; x.depthWrite = !tr; x.needsUpdate = true; } x.opacity = op; }); } });
  renderer.render(scene, camera); hudDraw();
  // a phone that can't keep up: draw fewer pixels
  if (state === 'race' && !document.hidden) { if (slowSkip > 0) slowSkip--; else { slowF.push(el); if (slowF.length >= 60) { const med = slowF.slice().sort((a, b) => a - b)[30]; slowF.length = 0; if (med > 0.03 && PR > 0.8) { PR = Math.max(0.8, PR - 0.35); renderer.setPixelRatio(PR); fit(); slowSkip = 60; } } } }
}
setup(); title();
K.run(update, draw);
window.DB = DB; DB.state = () => ({ state, raceT, lap: me && me.lap, pos: me && position(me), trucks: trucks.map(t => ({ n: t.name, x: +t.x.toFixed(1), z: +t.z.toFixed(1), lap: t.lap, prog: t.prog, air: t.air, v: +Math.hypot(t.vx, t.vz).toFixed(1) })), season, picks: picks.length, PR });
</script>
