  if (ws && ws.x > 20 && ws.x < W - 20 && ws.y > 20 && ws.y < H - 20) { c.strokeStyle = AMBER; c.lineWidth = 2.5; c.beginPath(); c.moveTo(ws.x, ws.y - 12); c.lineTo(ws.x + 12, ws.y); c.lineTo(ws.x, ws.y + 12); c.lineTo(ws.x - 12, ws.y); c.closePath(); c.stroke(); txt(c, wlab, ws.x, ws.y - 22, AMBER, 'center', 12, 700); }
  else edgeArrow(c, wp.x, wp.y + 25, wp.z, AMBER, wlab);
  // bomb impact point
  if (P.bomb > 0 && !P.landed && P.agl > 15) {
    const tf = (P.vy + Math.sqrt(Math.max(0, P.vy * P.vy + 2 * 9.8 * P.agl))) / 9.8, ix = P.x + P.vx * tf * 0.95, iz = P.z + P.vz * tf * 0.95, s = toScreen(ix, groundH(ix, iz), iz, SC);
    if (s && s.y < H - 40) { c.strokeStyle = GRN; c.lineWidth = 2; c.beginPath(); c.arc(s.x, s.y, 9, 0, TAU); c.moveTo(s.x - 15, s.y); c.lineTo(s.x - 9, s.y); c.moveTo(s.x + 9, s.y); c.lineTo(s.x + 15, s.y); c.stroke(); txt(c, 'BOMB', s.x, s.y + 18, DIM, 'center', 10); }
  }
  // objective and score
  const obj = objective(), oy = land ? 18 : 108;
  txt(c, obj, land ? LX : cx, oy, GRN, land ? 'left' : 'center', land ? 13 : 12, 700);
  txt(c, 'ABOARD ' + aboard + '/' + H0.seats + '   SAVED ' + rescued + '/' + M.people, land ? LX : cx, oy + 19, DIM, land ? 'left' : 'center', 12);
  txt(c, String(score), W - 16, 18 + (land ? 0 : 0), GRN, 'right', 15, 700); txt(c, 'MISSION ' + (mi + 1) + '/' + MISSIONS.length, W - 16, 38, DIM, 'right', 11);
  // weapons and armour along the bottom of the sight
  const ap = P.armor / H0.armor;
  txt(c, 'GUN ∞   MSL ∞   BOMB ∞   FLR ' + P.flr, cx, wy, GRN, 'center', 12, 700);
  c.strokeStyle = DIM; c.lineWidth = 1.5; c.strokeRect(cx - 70, wy + 12, 140, 7); c.fillStyle = ap < 0.35 ? REDC : ap < 0.6 ? AMBER : GRN; c.fillRect(cx - 69, wy + 13, 138 * c01(ap), 5);
  if (ap < 0.35 && Math.floor(clock * 3) % 2) txt(c, 'LOW ARMOR — LAND AT THE FIREBASE', cx, wy - 18, REDC, 'center', 12, 700);
  if (P.rpm < 0.97) txt(c, 'ROTOR ' + Math.round(P.rpm * 100) + '%', cx, cy - 70, AMBER, 'center', 14, 700);
  else if (P.landed && (phase === 'pad' || phase === 'loaded')) txt(c, 'HOLD ▲ TO LIFT OFF', cx, cy - 70, AMBER, 'center', 15, 800);
  // banners and warnings
  if (msgT > 0) { c.globalAlpha = c01(msgT * 2); const by = land ? H * 0.22 : H * 0.3; txt(c, msg, cx, by, '#ffffff', 'center', 22, 800); if (msg2) txt(c, msg2, cx, by + 24, GRN, 'center', 13); c.globalAlpha = 1; }
  if (warnT > 0 && Math.floor(clock * 6) % 2) txt(c, warnTxt, cx, cy + 70, REDC, 'center', 15, 800);
  if (hitFlash > 0) { const g = c.createRadialGradient(cx, cy, H * 0.25, cx, cy, H * 0.8); g.addColorStop(0, 'rgba(255,40,20,0)'); g.addColorStop(1, 'rgba(255,40,20,' + (hitFlash * 0.45) + ')'); c.fillStyle = g; c.fillRect(0, 0, W, H); }
  if (state === 'dead') { c.fillStyle = 'rgba(0,0,0,' + c01(1 - deadT / 2.6) * 0.6 + ')'; c.fillRect(0, 0, W, H); }
}
function edgeArrow(c, x, y, z, col, label) {
  const v = viewDir(x, y, z); let a = Math.atan2(-v.y, v.x); if (v.z > 0) a = Math.atan2(clamp(-v.y / (Math.abs(v.x) + 1), -0.4, 0.4), v.x >= 0 ? 1 : -1);   // behind you: point to the side it is on
  const cx = HW / 2, cy = HH / 2, rx = HW / 2 - 46, ry = HH / 2 - 54, ex = cx + Math.cos(a) * rx, ey = cy + Math.sin(a) * ry;
  c.save(); c.translate(ex, ey); c.rotate(a); c.fillStyle = col; c.beginPath(); c.moveTo(14, 0); c.lineTo(-6, -10); c.lineTo(-6, 10); c.closePath(); c.fill(); c.restore();
  if (label) txt(c, label, clamp(ex, 70, HW - 70), clamp(ey + (ey > cy ? -20 : 20), 50, HH - 30), col, 'center', 12, 700);
}
function waypoint() { const S = SITES[M.lz]; const toLZ = (phase === 'out' || phase === 'load' || phase === 'pad') && remaining > 0; const t = toLZ ? S : BASE; return { x: t.x, z: t.z, y: groundH(t.x, t.z), name: toLZ ? S.name : 'FIREBASE' }; }
function objective() {
  const S = SITES[M.lz];
  if (phase === 'pad') return P.landed ? 'LIFT OFF · FLY TO ' + S.name : 'FLY TO ' + S.name + ' · ' + S.smokeName + ' SMOKE';
  if (phase === 'out') return 'FLY TO ' + S.name + ' · LAND BY THE ' + S.smokeName + ' SMOKE';
  if (phase === 'load') return 'LOADING · ' + remaining + ' STILL ON THE GROUND';
  if (phase === 'loaded' || phase === 'rtb') return 'RETURN TO THE FIREBASE · LAND ON A PAD';
  if (phase === 'unload') return 'UNLOADING · REPAIRING · REARMING';
  return '';
}

setup();
title();
K.run(update, draw);
