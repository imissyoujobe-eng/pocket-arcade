<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kaboom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600&display=swap">
<style>
/* Layout: one full-screen arcade cabinet; canvas fills the screen, HUD on top, drag anywhere to move buckets */
:root{
  --night:#141a3a; --brick:#7a3b2e; --fuse:#ffb42e; --blast:#ff5a36; --water:#4fc3f7; --ink:#f4f1ff;
  --display:'Bungee','Impact',system-ui,sans-serif; --body:'Rubik',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%;width:100%}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-family:var(--display);font-size:clamp(14px,4vw,20px);pointer-events:none;font-variant-numeric:tabular-nums}
#hud .lvl{color:var(--fuse)}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding-inline:16px;background:rgba(10,12,32,.72)}
#overlay h1{font-family:var(--display);font-size:clamp(48px,16vw,96px);margin:0;color:var(--fuse);text-shadow:0 4px 0 var(--blast),0 8px 24px rgba(255,90,54,.5);letter-spacing:.02em}
#overlay p{margin:0;max-width:34ch;line-height:1.5;opacity:.9}
#overlay .score{font-family:var(--display);font-size:22px;color:var(--water)}
button{font-family:var(--display);font-size:20px;padding:14px 32px;border:0;border-radius:999px;background:var(--fuse);color:#2a1300;box-shadow:0 5px 0 #b56d00;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #b56d00}
button:focus-visible{outline:3px solid var(--water);outline-offset:3px}
</style>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud"><span id="sc">0</span><span class="lvl" id="lv">WAVE 1</span><span id="lives">🪣🪣🪣</span></div>
  <div id="overlay">
    <h1>KABOOM</h1>
    <p>Rocky the raccoon is tossing bombs off the rooftop. Drag (or use ← →) to slide your water buckets and douse every one before it hits the street.</p>
    <div class="score" id="best"></div>
    <button id="go">Play</button>
  </div>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',resize);resize();

let best=0;try{best=+localStorage.getItem('kaboom-best')||0}catch(e){}
const showBest=()=>$('best').textContent=best?`BEST ${best}`:'';showBest();

// audio
let AC;
function beep(f,d,type='square',v=.08,slide=0){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}
function boom(){if(!AC)return;const n=AC.sampleRate*.6,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=.5;s.buffer=b;s.connect(g).connect(AC.destination);s.start();}

let state='menu',score=0,lives=3,wave=1,bombs=[],parts=[],splashes=[],rac,buckets,toDrop,dropTimer,waveDelay,shake,keys={};
const ROOF=()=>Math.max(110,H*.2);
function reset(){score=0;lives=3;wave=1;parts=[];splashes=[];shake=0;buckets={x:W/2,tx:W/2};rac={x:W/2,tx:W/2,speed:2};startWave();}
function startWave(){bombs=[];toDrop=8+wave*4;dropTimer=0;waveDelay=1.2;rac.speed=1.5+wave*.6;$('lv').textContent='WAVE '+wave;}
function hud(){$('sc').textContent=score;$('lives').textContent='🪣'.repeat(lives);}

function start(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  reset();hud();state='play';$('overlay').hidden=true;
}
$('go').onclick=start;

// input
function setX(x){if(state==='play')buckets.tx=x;}
cv.addEventListener('pointerdown',e=>setX(e.clientX));
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')setX(e.clientX)});
addEventListener('keydown',e=>{keys[e.key]=1;if((e.key===' '||e.key==='Enter')&&state!=='play'){start();}});
addEventListener('keyup',e=>keys[e.key]=0);

const bucketW=()=>Math.min(110,W*.24),bucketH=26;
const bucketYs=()=>{const n=lives,y0=H-60;return Array.from({length:n},(_,i)=>y0-i*38);};

function update(dt){
  if(keys.ArrowLeft||keys.a)buckets.tx-=600*dt;
  if(keys.ArrowRight||keys.d)buckets.tx+=600*dt;
  const bw=bucketW();buckets.tx=Math.max(bw/2,Math.min(W-bw/2,buckets.tx));
  buckets.x+=(buckets.tx-buckets.x)*Math.min(1,dt*18);

  if(waveDelay>0){waveDelay-=dt;}
  else if(toDrop>0){
    // raccoon wanders
    if(Math.abs(rac.tx-rac.x)<5)rac.tx=40+Math.random()*(W-80);
    rac.x+=Math.sign(rac.tx-rac.x)*Math.min(Math.abs(rac.tx-rac.x),rac.speed*60*dt*2);
    dropTimer-=dt;
    if(dropTimer<=0){
      bombs.push({x:rac.x,y:ROOF()+10,vy:120+wave*35,spin:Math.random()*6});
      toDrop--;dropTimer=Math.max(.22,.9-wave*.08);beep(700,.06,'triangle',.05);
    }
  } else if(!bombs.length){wave++;score+=wave*5;hud();beep(523,.12);setTimeout(()=>beep(784,.18),120);startWave();}

  const ys=bucketYs();
  for(let i=bombs.length-1;i>=0;i--){
    const b=bombs[i];b.y+=b.vy*dt;b.spin+=dt*6;
    let caught=false;
    for(const y of ys){if(Math.abs(b.y-y)<14&&Math.abs(b.x-buckets.x)<bw/2+6){caught=true;break;}}
    if(caught){bombs.splice(i,1);score+=wave;hud();beep(300+Math.random()*80,.08,'sine',.07,140);
      for(let k=0;k<8;k++)splashes.push({x:b.x,y:b.y,vx:(Math.random()-.5)*160,vy:-Math.random()*200,l:.5});continue;}
    if(b.y>H-12){explodeAll();return;}
  }
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt;}
  parts=parts.filter(p=>p.l>0);
  for(const p of splashes){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.l-=dt;}
  splashes=splashes.filter(p=>p.l>0);
  shake=Math.max(0,shake-dt*30);
}

function explodeAll(){
  boom();shake=14;
  for(const b of bombs)for(let k=0;k<22;k++)parts.push({x:b.x,y:b.y,vx:(Math.random()-.5)*400,vy:(Math.random()-.8)*400,l:.4+Math.random()*.6,c:Math.random()<.5?'#ff5a36':'#ffb42e'});
  bombs=[];lives--;hud();
  if(lives<=0){state='over';setTimeout(gameOver,900);}
  else{toDrop=Math.max(6,toDrop+2);waveDelay=1.4;}
}
function gameOver(){
  if(score>best){best=score;try{localStorage.setItem('kaboom-best',best)}catch(e){}}
  $('overlay').querySelector('p').textContent=`Kaboom! You doused ${score} points' worth of bombs and reached wave ${wave}.`;
  showBest();$('go').textContent='Play again';$('overlay').hidden=false;
}

// drawing
const stars=Array.from({length:60},()=>({x:Math.random(),y:Math.random()*.5,r:Math.random()*1.5+.3}));
function draw(t){
  ctx.save();
  if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b0f2a');g.addColorStop(1,'#2a2160');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  ctx.fillStyle='#fff';for(const s of stars){ctx.globalAlpha=.4+.4*Math.sin(t/600+s.x*20);ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  // moon
  ctx.fillStyle='#fff3c4';ctx.beginPath();ctx.arc(W*.82,H*.1+20,26,0,7);ctx.fill();
  // distant skyline
  ctx.fillStyle='#1c1a4a';for(let i=0;i<W;i+=48){const h=60+((i*37)%90);ctx.fillRect(i,H-h-30,44,h);}
  ctx.fillStyle='#ffd86b';for(let i=0;i<W;i+=48){for(let y=H-80;y>H-140;y-=22)if(((i+y)*7)%5<2)ctx.fillRect(i+10,y,6,8);}
  // street
  ctx.fillStyle='#2b2b3a';ctx.fillRect(0,H-30,W,30);
  ctx.fillStyle='#ffb42e';for(let i=10;i<W;i+=50)ctx.fillRect(i,H-16,24,3);
  // rooftop
  const r=ROOF();
  ctx.fillStyle='#7a3b2e';ctx.fillRect(0,r-20,W,24);
  ctx.fillStyle='#5a2a20';for(let i=0;i<W;i+=28)ctx.fillRect(i,r-20,2,24);ctx.fillRect(0,r-6,W,2);
  ctx.fillStyle='#9b4a39';ctx.fillRect(0,r-24,W,5);
  drawRaccoon(rac?rac.x:W/2,r-24,t);
  // bombs
  if(bombs)for(const b of bombs)drawBomb(b.x,b.y,b.spin,t);
  // buckets
  if(state!=='menu'){const bw=bucketW();for(const y of bucketYs())drawBucket(buckets.x,y,bw);}
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();}
  ctx.fillStyle='#4fc3f7';for(const p of splashes){ctx.globalAlpha=p.l*2;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  if(state==='play'&&waveDelay>0&&lives>0){ctx.fillStyle='#ffb42e';ctx.font=`28px Bungee, Impact, sans-serif`;ctx.textAlign='center';ctx.fillText('WAVE '+wave,W/2,H*.45);}
  ctx.restore();
}
function drawRaccoon(x,y,t){
  const bob=Math.sin(t/120)*2;ctx.save();ctx.translate(x,y+bob);
  // tail
  ctx.fillStyle='#8a8a96';ctx.beginPath();ctx.ellipse(22,-14,16,7,-.5,0,7);ctx.fill();
  ctx.fillStyle='#3a3a44';for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(16+i*7,-11-i*3.5,2.5,6,-.5,0,7);ctx.fill();}
  // body
  ctx.fillStyle='#8a8a96';ctx.beginPath();ctx.ellipse(0,-18,16,18,0,0,7);ctx.fill();
  ctx.fillStyle='#c9c9d2';ctx.beginPath();ctx.ellipse(0,-14,9,11,0,0,7);ctx.fill();
  // head
  ctx.fillStyle='#8a8a96';ctx.beginPath();ctx.arc(0,-42,14,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(-12,-50);ctx.lineTo(-9,-62);ctx.lineTo(-3,-53);ctx.fill();
  ctx.beginPath();ctx.moveTo(12,-50);ctx.lineTo(9,-62);ctx.lineTo(3,-53);ctx.fill();
  ctx.fillStyle='#2a2a33';ctx.beginPath();ctx.ellipse(0,-43,13,5,0,0,7);ctx.fill(); // mask
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-5,-43,2.6,0,7);ctx.arc(5,-43,2.6,0,7);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-5,-43,1.3,0,7);ctx.arc(5,-43,1.3,0,7);ctx.fill();
  ctx.fillStyle='#e8e8ee';ctx.beginPath();ctx.ellipse(0,-35,6,4,0,0,7);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0,-37,2,0,7);ctx.fill();
  // grin
  ctx.strokeStyle='#111';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,-34,3.5,.2,Math.PI-.2);ctx.stroke();
  ctx.restore();
}
function drawBomb(x,y,spin,t){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='#1d1d26';ctx.beginPath();ctx.arc(0,0,11,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(-4,-4,3.5,0,7);ctx.fill();
  ctx.fillStyle='#555';ctx.fillRect(-3,-15,6,5);
  ctx.strokeStyle='#c9a46a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-15);ctx.quadraticCurveTo(5,-20,3,-24);ctx.stroke();
  const f=Math.sin(t/40+spin)>0;ctx.fillStyle=f?'#ffb42e':'#ff5a36';ctx.beginPath();ctx.arc(3,-25,f?4:3,0,7);ctx.fill();
  ctx.restore();
}
function drawBucket(x,y,w){
  const h=bucketH;ctx.save();ctx.translate(x,y);
  ctx.fillStyle='#2f79b5';ctx.beginPath();ctx.moveTo(-w/2,-h/2);ctx.lineTo(w/2,-h/2);ctx.lineTo(w/2-8,h/2);ctx.lineTo(-w/2+8,h/2);ctx.closePath();ctx.fill();
  ctx.fillStyle='#4fc3f7';ctx.fillRect(-w/2+3,-h/2+2,w-6,6);
  ctx.fillStyle='#9fdcff';ctx.fillRect(-w/2,-h/2-3,w,4);
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(-w/2+10,-h/2+10,6,h-14);
  ctx.restore();
}

let last=performance.now();
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;if(state==='play')update(dt);else if(state==='over')update(0.0001)||0;draw(t);requestAnimationFrame(loop);}
rac={x:W/2};bombs=[];requestAnimationFrame(loop);
</script>

</body></html>
