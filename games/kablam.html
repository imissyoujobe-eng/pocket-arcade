<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kablam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600&display=swap">
<style>
/* Layout: one full-screen arcade cabinet; canvas fills the screen, HUD on top, drag anywhere to move buckets */
:root{
  --night:#141a3a; --brick:#7a3b2e; --fuse:#ffb42e; --blast:#ff5a36; --water:#4fc3f7; --ink:#f4f1ff;
  --display:'Bungee','Impact',system-ui,sans-serif; --body:'Rubik',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%;width:100%}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-family:var(--display);font-size:clamp(14px,4vw,20px);pointer-events:none;font-variant-numeric:tabular-nums}
#hud .lvl{color:var(--fuse)}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding-inline:16px;background:rgba(10,12,32,.72)}
#overlay h1{font-family:var(--display);font-size:clamp(48px,16vw,96px);margin:0;color:var(--fuse);text-shadow:0 4px 0 var(--blast),0 8px 24px rgba(255,90,54,.5);letter-spacing:.02em}
#overlay p{margin:0;max-width:34ch;line-height:1.5;opacity:.9}
#overlay .score{font-family:var(--display);font-size:22px;color:var(--water)}
button{font-family:var(--display);font-size:20px;padding:14px 32px;border:0;border-radius:999px;background:var(--fuse);color:#2a1300;box-shadow:0 5px 0 #b56d00;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #b56d00}
button:focus-visible{outline:3px solid var(--water);outline-offset:3px}
</style>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud"><span id="sc">0</span><span class="lvl" id="lv">WAVE 1</span><span id="lives">🪣🪣🪣</span></div>
  <div id="overlay">
    <h1>KABLAM</h1>
    <p>Rocky the raccoon is tossing bombs off the rooftop. Drag (or use ← →) to slide your water buckets and douse every one before it hits the street.</p>
    <div class="score" id="best"></div>
    <button id="go">Play</button>
  </div>
</div>

<script src="../lib/art.js"></script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',resize);resize();

let best=0;try{best=+localStorage.getItem('kaboom-best')||0}catch(e){}
const showBest=()=>$('best').textContent=best?`BEST ${best}`:'';showBest();

// audio
let AC;
function beep(f,d,type='square',v=.08,slide=0){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}
function boom(){if(!AC)return;const n=AC.sampleRate*.6,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=.5;s.buffer=b;s.connect(g).connect(AC.destination);s.start();}

let state='menu',score=0,lives=3,wave=1,bombs=[],parts=[],splashes=[],rac,buckets,toDrop,dropTimer,waveDelay,shake,keys={};
const ROOF=()=>Math.max(110,H*.2);
function reset(){score=0;lives=3;wave=1;parts=[];splashes=[];shake=0;buckets={x:W/2,tx:W/2};rac={x:W/2,tx:W/2,speed:2};startWave();}
function startWave(){bombs=[];toDrop=8+wave*4;dropTimer=0;waveDelay=1.2;rac.speed=1.5+wave*.6;$('lv').textContent='WAVE '+wave;}
function hud(){$('sc').textContent=score;$('lives').textContent='🪣'.repeat(lives);}

function start(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  reset();hud();state='play';$('overlay').hidden=true;
}
$('go').onclick=start;

// input
function setX(x){if(state==='play')buckets.tx=x;}
cv.addEventListener('pointerdown',e=>setX(e.clientX));
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')setX(e.clientX)});
addEventListener('keydown',e=>{keys[e.key]=1;if((e.key===' '||e.key==='Enter')&&state!=='play'){start();}});
addEventListener('keyup',e=>keys[e.key]=0);

const bucketW=()=>Math.min(110,W*.24),bucketH=26;
const bucketYs=()=>{const n=lives,y0=H-60;return Array.from({length:n},(_,i)=>y0-i*38);};

function update(dt){
  if(keys.ArrowLeft||keys.a)buckets.tx-=600*dt;
  if(keys.ArrowRight||keys.d)buckets.tx+=600*dt;
  const bw=bucketW();buckets.tx=Math.max(bw/2,Math.min(W-bw/2,buckets.tx));
  buckets.x+=(buckets.tx-buckets.x)*Math.min(1,dt*18);

  if(waveDelay>0){waveDelay-=dt;}
  else if(toDrop>0){
    // raccoon wanders
    if(Math.abs(rac.tx-rac.x)<5)rac.tx=40+Math.random()*(W-80);
    rac.x+=Math.sign(rac.tx-rac.x)*Math.min(Math.abs(rac.tx-rac.x),rac.speed*60*dt*2);
    dropTimer-=dt;
    if(dropTimer<=0){
      bombs.push({x:rac.x,y:ROOF()+10,vy:120+wave*35,spin:Math.random()*6});
      toDrop--;dropTimer=Math.max(.22,.9-wave*.08);beep(700,.06,'triangle',.05);
    }
  } else if(!bombs.length){wave++;score+=wave*5;hud();beep(523,.12);setTimeout(()=>beep(784,.18),120);startWave();}

  const ys=bucketYs();
  for(let i=bombs.length-1;i>=0;i--){
    const b=bombs[i];b.y+=b.vy*dt;b.spin+=dt*6;
    let caught=false;
    for(const y of ys){if(Math.abs(b.y-y)<14&&Math.abs(b.x-buckets.x)<bw/2+6){caught=true;break;}}
    if(caught){bombs.splice(i,1);score+=wave;hud();beep(300+Math.random()*80,.08,'sine',.07,140);
      for(let k=0;k<8;k++)splashes.push({x:b.x,y:b.y,vx:(Math.random()-.5)*160,vy:-Math.random()*200,l:.5});continue;}
    if(b.y>H-12){explodeAll();return;}
  }
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt;}
  parts=parts.filter(p=>p.l>0);
  for(const p of splashes){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.l-=dt;}
  splashes=splashes.filter(p=>p.l>0);
  shake=Math.max(0,shake-dt*30);
}

function explodeAll(){
  boom();shake=14;
  for(const b of bombs)for(let k=0;k<22;k++)parts.push({x:b.x,y:b.y,vx:(Math.random()-.5)*400,vy:(Math.random()-.8)*400,l:.4+Math.random()*.6,c:Math.random()<.5?'#ff5a36':'#ffb42e'});
  bombs=[];lives--;hud();
  if(lives<=0){state='over';setTimeout(gameOver,900);}
  else{toDrop=Math.max(6,toDrop+2);waveDelay=1.4;}
}
function gameOver(){
  if(score>best){best=score;try{localStorage.setItem('kaboom-best',best)}catch(e){}}
  $('overlay').querySelector('p').textContent=`Kablam! You doused ${score} points' worth of bombs and reached wave ${wave}.`;
  showBest();$('go').textContent='Play again';$('overlay').hidden=false;
}

// drawing
function draw(t){
  ctx.save();
  if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const r=ROOF();
  A.sky(ctx,W,H,{top:'#070a24',mid:'#1e1a52',bottom:'#4a2a6a',stars:true,sun:'#fff3c4',moon:true,sunX:W*.82,sunY:H*.1+20,sunR:24,sunGlow:'255,240,190',cloud:'rgba(120,110,180,.35)'},t);
  A.skyline(ctx,t/90,{W,factor:.2,base:H-36,amp:H*.35,col:'#1a1840',win:'rgba(255,216,107,.35)'});
  A.skyline(ctx,t/50,{W,factor:.4,base:H-30,amp:H*.22,col:'#12112e',win:'rgba(255,216,107,.7)'});
  // street with curb, puddle reflections and lamp posts
  const sg=ctx.createLinearGradient(0,H-30,0,H);sg.addColorStop(0,'#3a3a4c');sg.addColorStop(1,'#1c1c28');ctx.fillStyle=sg;ctx.fillRect(0,H-30,W,30);ctx.fillStyle='#55556a';ctx.fillRect(0,H-32,W,3);
  ctx.fillStyle='#ffb42e';for(let i=10;i<W;i+=50)ctx.fillRect(i,H-15,24,3);
  for(let x=W*.15;x<W;x+=W*.35){ctx.fillStyle='#22222e';ctx.fillRect(x-2,H-110,4,80);ctx.fillRect(x-2,H-110,16,3);ctx.fillStyle='#fff3c4';ctx.fillRect(x+10,H-108,6,4);A.glow(ctx,x+13,H-104,60,'255,220,140',.3);ctx.fillStyle='rgba(255,220,140,.08)';ctx.beginPath();ctx.moveTo(x+10,H-104);ctx.lineTo(x-20,H-30);ctx.lineTo(x+46,H-30);ctx.fill()}
  // rooftop: brick parapet, chimney with smoke, water tower
  ctx.fillStyle='rgba(10,8,20,.9)';ctx.fillRect(0,r-25,W,30);
  for(let y=r-20;y<r+4;y+=6)for(let x=-((y/6)%2)*9;x<W;x+=18){const h=A.hash(x,y);ctx.fillStyle=h<.2?'#6a2f24':h<.6?'#7a3b2e':'#8a4434';ctx.fillRect(x+.5,y+.5,17,5);ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(x+.5,y+.5,17,1)}
  const cg=ctx.createLinearGradient(0,r-26,0,r-19);cg.addColorStop(0,'#c8b8a8');cg.addColorStop(1,'#7a6a5c');ctx.fillStyle=cg;ctx.fillRect(0,r-26,W,6);ctx.fillStyle='rgba(0,0,0,.3)';for(let x=0;x<W;x+=24)ctx.fillRect(x,r-26,1,6);
  // chimney
  const chx=W*.12;ctx.fillStyle='#0a0814';ctx.fillRect(chx-1,r-61,26,36);for(let y=r-60;y<r-26;y+=6)for(let x=0;x<24;x+=12){ctx.fillStyle=A.hash(x,y)<.3?'#6a2f24':'#8a4434';ctx.fillRect(chx+x+((y/6)%2?-6:0)+.5,y+.5,11,5)}ctx.fillStyle='#55556a';ctx.fillRect(chx-3,r-64,30,5);
  for(let i=0;i<4;i++){const k=((t/1400+i/4)%1);ctx.fillStyle=`rgba(200,200,220,${.25*(1-k)})`;ctx.beginPath();ctx.arc(chx+12+Math.sin(k*6+i)*6,r-68-k*60,6+k*14,0,7);ctx.fill()}
  // water tower
  const wx=W*.9;if(W>340){ctx.strokeStyle='#2a1e18';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(wx-14,r-26);ctx.lineTo(wx-10,r-56);ctx.moveTo(wx+14,r-26);ctx.lineTo(wx+10,r-56);ctx.moveTo(wx-12,r-36);ctx.lineTo(wx+12,r-48);ctx.stroke();ctx.fillStyle='#0a0814';ctx.fillRect(wx-17,r-95,34,41);for(let i=0;i<8;i++){ctx.fillStyle=i%2?'#7a5232':'#8a6040';ctx.fillRect(wx-16+i*4,r-94,4,39)}ctx.fillStyle='#3a3a4c';ctx.fillRect(wx-16,r-84,32,2);ctx.fillRect(wx-16,r-66,32,2);ctx.fillStyle='#2a2030';ctx.beginPath();ctx.moveTo(wx-20,r-94);ctx.lineTo(wx,r-110);ctx.lineTo(wx+20,r-94);ctx.fill()}
  drawRaccoon(rac?rac.x:W/2,r-26,t);
  if(bombs)for(const b of bombs)drawBomb(b.x,b.y,b.spin,t);
  if(state!=='menu'){const bw=bucketW();for(const y of bucketYs())drawBucket(buckets.x,y,bw,t);}
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l);A.glow(ctx,p.x,p.y,14,'255,140,40',.3);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();}
  for(const p of splashes){ctx.globalAlpha=Math.min(1,p.l*2);ctx.fillStyle='#4fc3f7';ctx.beginPath();ctx.ellipse(p.x,p.y,2.4,3.6,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(p.x-.8,p.y-2,1.2,1.2)}
  ctx.globalAlpha=1;
  A.vignette(ctx,W,H,.35);
  if(state==='play'&&waveDelay>0&&lives>0){ctx.font=`28px Bungee, Impact, sans-serif`;ctx.textAlign='center';ctx.fillStyle='#000';ctx.fillText('WAVE '+wave,W/2+2,H*.45+2);ctx.fillStyle='#ffb42e';ctx.fillText('WAVE '+wave,W/2,H*.45);}
  ctx.restore();
}
function drawRaccoon(x,y,t){
  const bob=Math.sin(t/120)*2,dir=rac&&rac.tx!=null?Math.sign(rac.tx-rac.x)||1:1,step=Math.sin(t/90);ctx.save();ctx.translate(x,y+bob);ctx.scale(1.3,1.3);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,0,18,3,0,0,7);ctx.fill();
  const fur='#8a8a96',dk='#4a4a56',lt='#c9c9d2',ink='#14141c';
  // striped tail
  ctx.save();ctx.translate(-dir*14,-12);ctx.rotate(-dir*(.5+Math.sin(t/200)*.15));ctx.fillStyle=ink;ctx.beginPath();ctx.ellipse(-dir*12,-4,17,8,0,0,7);ctx.fill();ctx.fillStyle=fur;ctx.beginPath();ctx.ellipse(-dir*12,-4,16,7,0,0,7);ctx.fill();ctx.fillStyle='#33333d';for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(-dir*(4+i*6.5),-4,2.4,6.6,0,0,7);ctx.fill()}ctx.restore();
  // legs
  ctx.fillStyle=dk;ctx.fillRect(-9,-6+step,6,7);ctx.fillRect(3,-6-step,6,7);ctx.fillStyle=ink;ctx.fillRect(-10,0+step,8,2.5);ctx.fillRect(2,0-step,8,2.5);
  // body with belly and a loot sack
  ctx.fillStyle=ink;ctx.beginPath();ctx.ellipse(0,-18,17,19,0,0,7);ctx.fill();const bg=ctx.createRadialGradient(-5,-24,2,0,-18,19);bg.addColorStop(0,'#aaaab6');bg.addColorStop(1,'#62626e');ctx.fillStyle=bg;ctx.beginPath();ctx.ellipse(0,-18,16,18,0,0,7);ctx.fill();
  ctx.fillStyle=lt;ctx.beginPath();ctx.ellipse(0,-14,9,11,0,0,7);ctx.fill();
  ctx.fillStyle='#c84a3a';ctx.fillRect(-16,-30,32,6);ctx.fillStyle='#fff';for(let i=0;i<5;i++)ctx.fillRect(-14+i*7,-28,2,2);// striped burglar shirt band
  // arm holding a bomb up
  ctx.fillStyle=dk;ctx.save();ctx.translate(dir*12,-26);ctx.rotate(dir*(-.6+Math.sin(t/180)*.2));ctx.fillRect(-3,-12,6,13);ctx.restore();
  // head
  ctx.fillStyle=ink;ctx.beginPath();ctx.arc(0,-42,15,0,7);ctx.fill();const hg=ctx.createRadialGradient(-4,-47,2,0,-42,15);hg.addColorStop(0,'#b0b0bc');hg.addColorStop(1,'#6e6e7a');ctx.fillStyle=hg;ctx.beginPath();ctx.arc(0,-42,14,0,7);ctx.fill();
  for(const sx of[-1,1]){ctx.fillStyle=ink;ctx.beginPath();ctx.moveTo(sx*13,-49);ctx.lineTo(sx*9,-63);ctx.lineTo(sx*2,-53);ctx.fill();ctx.fillStyle='#e8a8b0';ctx.beginPath();ctx.moveTo(sx*10.5,-51);ctx.lineTo(sx*8.6,-59);ctx.lineTo(sx*4.5,-53);ctx.fill()}
  ctx.fillStyle='#e8e8ee';ctx.beginPath();ctx.ellipse(-6,-48,4,2,-.3,0,7);ctx.ellipse(6,-48,4,2,.3,0,7);ctx.fill();
  ctx.fillStyle='#22222b';ctx.beginPath();ctx.moveTo(-14,-42);ctx.quadraticCurveTo(-8,-49,0,-44);ctx.quadraticCurveTo(8,-49,14,-42);ctx.quadraticCurveTo(8,-38,0,-40);ctx.quadraticCurveTo(-8,-38,-14,-42);ctx.fill();
  const px=dir*1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-5,-43,2.8,0,7);ctx.arc(5,-43,2.8,0,7);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-5+px,-43,1.4,0,7);ctx.arc(5+px,-43,1.4,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-5+px,-44.4,.8,.8);ctx.fillRect(5+px,-44.4,.8,.8);
  ctx.fillStyle='#ececf2';ctx.beginPath();ctx.ellipse(0,-35,7,4.5,0,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(0,-37.5,2.4,1.6,0,0,7);ctx.fill();
  ctx.strokeStyle='#111';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(0,-35,3.6,.2,Math.PI-.2);ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(-1.6,-32,1.4,1.6);ctx.fillRect(.4,-32,1.4,1.6);
  ctx.restore();
}
function drawBomb(x,y,spin,t){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(3,13,9,2,0,0,7);ctx.fill();
  ctx.rotate(Math.sin(spin)*.25);
  A.ball(ctx,0,0,12,'#3a3a4c');ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(-4.5,-4.5,3.6,2.2,-.7,0,7);ctx.fill();
  ctx.fillStyle='#ffd23f';ctx.font='bold 7px sans-serif';ctx.textAlign='center';ctx.fillText('TNT',0,4);
  ctx.fillStyle='#14141c';ctx.fillRect(-4,-16.5,8,6);const cg=ctx.createLinearGradient(-3,0,3,0);cg.addColorStop(0,'#888');cg.addColorStop(.5,'#ddd');cg.addColorStop(1,'#666');ctx.fillStyle=cg;ctx.fillRect(-3.4,-16,6.8,5);
  ctx.strokeStyle='#c9a46a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-16);ctx.quadraticCurveTo(5,-21,3,-25);ctx.stroke();
  const f=Math.sin(t/40+spin)>0;A.glow(ctx,3,-26,16,'255,180,46',.6);ctx.fillStyle=f?'#ffb42e':'#ff5a36';ctx.beginPath();ctx.arc(3,-26,f?4.2:3,0,7);ctx.fill();ctx.fillStyle='#fff8c0';ctx.beginPath();ctx.arc(3,-26,1.6,0,7);ctx.fill();
  for(let i=0;i<3;i++){const a=t/60+i*2.1+spin;ctx.fillStyle='#ffe07a';ctx.fillRect(3+Math.cos(a)*7,-26+Math.sin(a)*7,1.5,1.5)}
  ctx.restore();
}
function drawBucket(x,y,w,t){
  const h=bucketH;ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,h/2+3,w/2-6,4,0,0,7);ctx.fill();
  // handle
  ctx.strokeStyle='#14141c';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-h/2,w/2-4,Math.PI*1.08,Math.PI*1.92);ctx.stroke();ctx.strokeStyle='#b8c4d0';ctx.lineWidth=2;ctx.stroke();
  // body: wooden staves bound with metal hoops
  ctx.fillStyle='#14141c';ctx.beginPath();ctx.moveTo(-w/2-1.5,-h/2-1);ctx.lineTo(w/2+1.5,-h/2-1);ctx.lineTo(w/2-7,h/2+1.5);ctx.lineTo(-w/2+7,h/2+1.5);ctx.closePath();ctx.fill();
  ctx.save();ctx.beginPath();ctx.moveTo(-w/2,-h/2);ctx.lineTo(w/2,-h/2);ctx.lineTo(w/2-8,h/2);ctx.lineTo(-w/2+8,h/2);ctx.closePath();ctx.clip();
  const n=Math.round(w/12);for(let i=0;i<n;i++){ctx.fillStyle=i%2?'#a8743c':'#b98446';ctx.fillRect(-w/2+i*w/n,-h/2,w/n,h);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(-w/2+i*w/n,-h/2,1,h)}
  const sh=ctx.createLinearGradient(-w/2,0,w/2,0);sh.addColorStop(0,'rgba(0,0,0,.35)');sh.addColorStop(.35,'rgba(255,255,255,.15)');sh.addColorStop(1,'rgba(0,0,0,.4)');ctx.fillStyle=sh;ctx.fillRect(-w/2,-h/2,w,h);
  for(const hy of[-h/2+4,h/2-6]){ctx.fillStyle='#5a6470';ctx.fillRect(-w/2,hy,w,3.5);ctx.fillStyle='#b8c4d0';ctx.fillRect(-w/2,hy,w,1.2)}
  ctx.restore();
  // water surface sloshing inside the rim
  ctx.fillStyle='#14141c';ctx.beginPath();ctx.ellipse(0,-h/2,w/2+1,5,0,0,7);ctx.fill();ctx.fillStyle='#1f6fb8';ctx.beginPath();ctx.ellipse(0,-h/2,w/2-1.5,3.6,0,0,7);ctx.fill();
  ctx.fillStyle='#4fc3f7';ctx.beginPath();ctx.ellipse(Math.sin(t/200)*4,-h/2+.5,w/2-8,2.2,0,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(-w/4+Math.sin(t/150)*6,-h/2-1,10,1.2);
  ctx.restore();
}

let last=performance.now();
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;if(state==='play')update(dt);else if(state==='over')update(0.0001)||0;draw(t);requestAnimationFrame(loop);}
rac={x:W/2};bombs=[];requestAnimationFrame(loop);
</script>
