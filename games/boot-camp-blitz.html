// a blast: knocks out soldiers, smashes bunkers, sets off barrels
function explode(x, z, R, big) {

// ---------- effects ----------
const PMAX = 120, parts = [], fM = new THREE.Matrix4(), fQ = new THREE.Quaternion(), fS = new THREE.Vector3(), fP = new THREE.Vector3(), fC = new THREE.Color(), fE = new THREE.Euler();
function burst(x, y, z, n, col, spd, up, size) { for (let i = 0; i < n && parts.length < PMAX; i++) { const a = Math.random() * 6.283, s = spd * (0.3 + Math.random() * 0.7); parts.push({ x, y, z, vx: Math.cos(a) * s, vz: Math.sin(a) * s, vy: up * (0.4 + Math.random() * 0.8), t: 0, life: 0.5 + Math.random() * 0.6, size: size * (0.6 + Math.random() * 0.8), col, r: Math.random() * 6 }); } }

function stepFx(dt) {

}

// ---------- shooting ----------
const MUZ = new THREE.Vector3(0.055, 1.285, 0.92);
function muzzle(o, out) { const c = Math.cos(o.face), s = Math.sin(o.face); return out.set(o.x + MUZ.x * c + MUZ.z * s, hAt(o.x, o.z) + MUZ.y, o.z - MUZ.x * s + MUZ.z * c); }
function fireBullet(list, from, dx, dz, speed, me) {
  const m = tracerPool.find((t, i) => !t.visible && (me ? i < 40 : i >= 40)); if (!m) return;
  const L = Math.hypot(dx, dz) || 1; m.visible = true; m.position.copy(from); m.rotation.set(0, Math.atan2(dx, dz), 0);
  list.push({ x: from.x, y: from.y, z: from.z, vx: dx / L * speed, vz: dz / L * speed, t: me ? 0.62 : 3, m });

// the nearest enemy or bunker in front of you (you lock on when you shoot)
function pickTarget() {

  foes.forEach(f => { if (!f.dead) consider(f.x, f.z, f); });
  objs.forEach(o => { if (!o.dead && (o.t === 'bunker' || o.t === 'barrel')) consider(o.x, o.z, o); });

}

// ---------- the loop ----------
const tmpV = new THREE.Vector3();
function update(dt) {
  if ((padT += dt) > 1) { padT = 0; measurePad(); }
  if (msgT > 0) msgT -= dt;
  pops.forEach(p => { p.t -= dt; p.y += dt * 1.2; }); pops = pops.filter(p => p.t > 0);

}
function play(dt) {

    const m = Math.hypot(mx, mz), firing = K.down('a') || K.hit('b');

    pushOut(P, 0.45);
    // no running back: stay within a few steps of the furthest point you've reached
    frontZ = Math.min(frontZ, P.z); P.z = Math.min(P.z, frontZ + 7);
    P.inv -= dt; P.kick = Math.max(0, P.kick - dt * 8);
    fireCd -= dt;
    if (K.down('a') && fireCd <= 0 && shots.length < 9) {

      if (target) { dx = target.x - mz0.x; dz = target.z - mz0.z; }
      fireBullet(shots, mz0, dx, dz, 48, true); flash(mz0.x, mz0.y, mz0.z); K.noise(0.05, 0.16);
    }
    if (K.hit('b') && nadesLeft > 0 && nades.length < 2) {
      nadesLeft--; const d = target ? K.clamp(Math.hypot(target.x - P.x, target.z - P.z), 5, 17) : 14, a = target ? Math.atan2(target.x - P.x, target.z - P.z) : P.face;
      nades.push({ sx: P.x, sz: P.z, tx: K.clamp(P.x + Math.sin(a) * d, -HW + 1, HW - 1), tz: P.z + Math.cos(a) * d, t: 0, T: 0.75, m: new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), new THREE.MeshLambertMaterial({ color: 0x3a4a22 })) });
      scene.add(nades[nades.length - 1].m); K.beep(500, 0.2, { type: 'triangle', to: 250, vol: 0.08 });
    }

    // the gate
    if (P.z < -GOAL) { const bonus = 2000 * stage; addScore(bonus); pop(P.x, 2.4, P.z, '+' + bonus.toLocaleString()); say('STAGE CLEAR!', 2.4); K.tune([392, 523, 659, 784], 0.14); nadesLeft += 2; state = 'clear'; clearT = 2.6; }

    f.walk += dt * 10 * run; pushOut(f, 0.45, HW + 2.5); f.kick = Math.max(0, f.kick - dt * 8);
    f.cd -= dt;
    if (alive && f.cd <= 0 && d < 26 && f.z < tz + 3) { f.cd = Math.max(0.9, 2.4 - stage * 0.15) + Math.random() * 1.4; f.kick = 1; const mz0 = muzzle(f, tmpV), sp = 0.4 + d * 0.06; fireBullet(eShots, mz0, tx - mz0.x + (Math.random() - 0.5) * sp, tz - mz0.z + (Math.random() - 0.5) * sp, 11 + stage * 0.6, false); flash(mz0.x, mz0.y, mz0.z); K.noise(0.05, 0.07); }
    if (alive && P.inv <= 0 && d < 0.9) playerHit();

  }

    if (b.t !== 'bunker' || b.dead || b.z > tz + 1 || tz - b.z > 34) return;
    if ((b.cd -= dt) <= 0) { b.cd = Math.max(1.1, 2.4 - stage * 0.15) + Math.random(); const a = Math.atan2(tx - b.x, tz - b.z); tmpV.set(b.x, hAt(b.x, b.z) + 1.3, b.z + 2.3); [-0.25, 0, 0.25].forEach(o => fireBullet(eShots, tmpV, Math.sin(a + o), Math.cos(a + o), 12 + stage * 0.7, false)); flash(b.x, tmpV.y, b.z + 2.4); K.noise(0.08, 0.1); }

    const b = !gone && blockAt(s.x, s.z, 0);
    if (b) { gone = true; if (b.t === 'bunker' || b.t === 'barrel') { b.hp--; burst(s.x, s.y, s.z, 4, 0xffd080, 3, 2, 0.04); if (b.hp <= 0) wreck(b); } else burst(s.x, s.y, s.z, 5, b.t === 'tree' ? 0x6a4a2a : b.t === 'sand' ? 0xc8b07a : TH.rock, 2.5, 2.5, 0.05); }
    if (!gone) for (const f of foes) if (!f.dead && Math.hypot(f.x - s.x, f.z - s.z) < 0.55) { killFoe(f); gone = true; break; }

    const b = !gone && blockAt(s.x, s.z, 0); if (b && !(b.t === 'bunker' && Math.hypot(s.x - b.x, s.z - b.z) < 3)) { gone = true; burst(s.x, s.y, s.z, 3, 0xffa060, 2, 2, 0.04); }
    if (!gone && alive && !P.dead && P.inv <= 0 && Math.hypot(P.x - s.x, P.z - s.z) < 0.38) { s.m.visible = false; playerHit(); break; }

}
function gameOver() {

  K.record('boot-camp-blitz', score, false, nb);
  K.card({ title: nb ? 'NEW HIGH SCORE!' : 'MISSION OVER', text: 'You fought to stage ' + stage + ' and scored ' + score.toLocaleString() + '.', best: 'BEST ' + best.toLocaleString(), button: 'Deploy again', onStart: newGame });
}
function newGame() { stage = 1; score = 0; lives = 3; nadesLeft = 5; nextLife = 20000; startStage(); state = 'play'; }

// ---------- camera and drawing ----------
function render(dt) {

  camera.position.copy(camPos); camera.lookAt(camLook);
  renderer.render(scene, camera); drawHud();
}
function camWant(pos, look) { const fx = P ? P.x : 0, fz = P ? P.z : 0, land = camera.aspect > 1; pos.set(fx * 0.9, hAt(fx, fz) + (land ? 2.7 : 3.1), fz + (land ? 4.6 : 5.4)); look.set(fx * 0.9, 0.7, fz - 11); }

function toScreen(x, y, z) { PV.set(x, y, z).project(camera); if (PV.z > 1 || PV.z < -1) return null; return { x: (PV.x + 1) / 2 * hudC._w, y: (1 - PV.y) / 2 * hudC._h }; }
function txt(s, x, y, size, col, al) { const c = hc; c.font = size + 'px Bungee, Impact, sans-serif'; c.textAlign = al || 'left'; c.textBaseline = 'middle'; c.fillStyle = 'rgba(0,0,0,.6)'; c.fillText(s, x + 1.5, y + 1.5); c.fillStyle = col || '#fff'; c.fillText(s, x, y); }

  c.fillStyle = 'rgba(0,0,0,.4)'; c.beginPath(); c.roundRect(8, 8, 116, 52, 10); c.fill();

  c.fillStyle = '#556b2f'; c.beginPath(); c.ellipse(21, 46, 5.5, 6.5, 0, 0, 7); c.fill(); c.fillStyle = '#999'; c.fillRect(19, 37.5, 4, 3.5); txt('×' + nadesLeft, 32, 46, 13, '#ffd23f');
  if (msgT > 0) txt(msg, w / 2, h * 0.22, 22, '#fff', 'center');
  if (state === 'play' && P && !P.dead && P.inv > 1.6 && stage === 1 && score === 0) txt('FIRE LOCKS ON · GRENADES LOB OVER COVER', w / 2, h - 16, 8, 'rgba(255,255,255,.85)', 'center');
}
function title() { K.card({ title: 'BOOT CAMP BLITZ', text: 'Fight north through the jungle, desert and snow to the gate. The joystick runs your soldier. Hold FIRE to shoot: you lock onto the nearest enemy or bunker ahead. GRENADE lobs over sandbags and wrecks bunkers. Grab green crates for more grenades, and shoot red barrels to blow up whoever is near them.', best: best ? 'BEST ' + best.toLocaleString() : '', button: 'Deploy', onStart: newGame }); }
setup(); TH = THEMES[0]; startStage(); state = 'title'; if (P) P.mesh.visible = true; title();
K.run(update, () => {});
window.bcbDebug = () => ({ state, stage, score, lives, nadesLeft, P: P && { x: P.x, z: P.z, dead: !!P.dead, inv: P.inv }, foes: foes.filter(f => !f.dead).length, objs: objs.length, goal: GOAL, target: target && (target.t || 'foe') });
