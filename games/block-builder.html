<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Block Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: 9-wide well on the left of a canvas with a slim side panel (next piece, bombs); HUD strip on top (score, level, lines); thumb controls at the bottom — move on the left, turn and drop on the right; swipe and tap on the well too */
:root {
  --panel: #101a2e;
  --panel-fg: #eef3ff;
  --gold: #ffd23f;
  --coral: #ff5d5d;
  --coral-deep: #a8262e;
  --teal: #2fd9c9;
  --teal-deep: #137a70;
  --display: "Bungee", "Impact", system-ui, sans-serif;
  --body: "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--panel); color: var(--panel-fg); font-family: var(--body); touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.game { height: 100%; min-height: 540px; display: flex; flex-direction: column; }
.hud { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 8px 16px; }
.lbl { font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
.val { font-family: var(--display); font-size: 1.25rem; color: var(--gold); font-variant-numeric: tabular-nums; }
.mid { text-align: center; }
.right { text-align: right; }
#field { position: relative; flex: 1; min-height: 340px; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.controls { display: flex; justify-content: space-between; gap: 10px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.pair { display: flex; gap: 10px; }
.ctl { font-family: var(--display); font-size: .95rem; color: #fff; border: 0; border-radius: 16px; width: 76px; height: 64px; display: grid; place-items: center; cursor: pointer; touch-action: none; background: #26345a; box-shadow: 0 5px 0 #050a18; }
.ctl.turn { background: var(--teal); box-shadow: 0 5px 0 var(--teal-deep); color: #06201d; }
.ctl.drop { background: var(--coral); box-shadow: 0 5px 0 var(--coral-deep); }
.ctl.on { transform: translateY(4px); box-shadow: 0 1px 0 #050a18; filter: brightness(1.15); }
.ctl svg { width: 30px; height: 30px; }
.ctl:focus-visible, .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(16,26,46,.75); text-align: center; }
.card { max-width: 340px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.card h1, .card h2 { font-family: var(--display); margin: 0; line-height: 1; color: var(--gold); text-shadow: 0 4px 0 var(--coral-deep); }
.card h1 { font-size: clamp(2.4rem, 12vw, 3.4rem); }
.card h2 { font-size: clamp(1.8rem, 9vw, 2.4rem); }
.card p { margin: 0; line-height: 1.45; }
.card ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.btn { font-family: var(--display); font-size: 1.2rem; color: var(--panel); background: var(--gold); border: 0; border-radius: 12px; padding: 14px 28px; cursor: pointer; box-shadow: 0 6px 0 #b8860b; }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8860b; }
.banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-family: var(--display); font-size: clamp(1.4rem, 8vw, 2.4rem); color: #fff; text-shadow: 0 3px 0 var(--coral-deep), 0 0 16px rgba(0,0,0,.5); pointer-events: none; padding-inline: 16px; }
</style>

<div class="game">
  <div class="hud">
    <div><div class="lbl">Score</div><div class="val" id="score">0</div></div>
    <div class="mid"><div class="lbl">Level</div><div class="val" id="level">1</div></div>
    <div class="right"><div class="lbl">Lines</div><div class="val" id="lines">0</div></div>
  </div>
  <div id="field">
    <canvas id="cv"></canvas>
    <div class="banner" id="banner" hidden></div>
    <div class="overlay" id="start">
      <div class="card">
        <h1>Block Builder</h1>
        <ul>
          <li><b>◀ ▶</b> or swipe sideways to move</li>
          <li><b>TURN</b> or tap the well to spin a piece</li>
          <li><b>DROP</b> slams it down, swipe down to nudge it</li>
          <li>Fill a whole row to clear it</li>
          <li>Every 8 lines you get a <b>bomb</b> that blasts a 3×3 hole</li>
        </ul>
        <button class="btn" id="play">Tap to Stack</button>
        <p id="best"></p>
      </div>
    </div>
    <div class="overlay" id="over" hidden>
      <div class="card">
        <h2 id="overTitle">Stacked Out</h2>
        <p id="overText"></p>
        <button class="btn" id="again">Stack Again</button>
      </div>
    </div>
  </div>
  <div class="controls">
    <div class="pair">
      <button class="ctl" id="left" aria-label="Move left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 L7 12 L15 20" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="ctl" id="right" aria-label="Move right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 L17 12 L9 20" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="pair">
      <button class="ctl turn" id="turn" aria-label="Turn piece"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12 A7 7 0 1 1 15 5.6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M13 2.5 L17 5.8 L13 9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="ctl drop" id="drop">DROP</button>
    </div>
  </div>
</div>

<script src="../lib/art.js"></script>
<script>
window.addEventListener('error', function (e) { var b = document.getElementById('banner'); if (b) { b.hidden = false; b.style.fontSize = '14px'; b.textContent = 'Error: ' + e.message; } });
(function () {

    { c: [[0, 0], [1, 0], [2, 0]], w: 1.2 },
    { c: [[0, 0], [0, 1], [1, 1]], w: 1.2 },
    { c: [[0, 0], [1, 0], [0, 1], [1, 1]], w: 1 },
    { c: [[0, 0], [1, 0], [2, 0], [1, 1]], w: 1 },
    { c: [[0, 0], [0, 1], [0, 2], [1, 2]], w: 1 },
    { c: [[0, 0], [1, 0], [1, 1], [2, 1]], w: .9 },
    { c: [[0, 0], [1, 0], [0, 1], [1, 1], [0, 2]], w: .55 },
    { c: [[0, 0], [2, 0], [0, 1], [1, 1], [2, 1]], w: .45 },

  // ---------- state ----------
  let grid, cur, next, score = 0, lines = 0, level = 1, best = 0, phase = 'title', fallT = 0, lockT = 0, lockMoves = 0, clearing = null, clearT = 0, bombsDue = 0, parts = [], shake = 0;

    const fg = c.createLinearGradient(fx, 0, fx + fw, 0); fg.addColorStop(0, '#5a6a8a'); fg.addColorStop(.5, '#8a9aba'); fg.addColorStop(1, '#4a5a7a'); c.fillStyle = fg; c.fillRect(fx, fy, fw, fh);
