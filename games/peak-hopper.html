<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Peak Hopper</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script>
// Peak Hopper: hop Boing diagonally around a pyramid of cubes and flip every top to the target color.
// Dodge bouncing balls and Hiss the snake, catch the green ball to freeze everyone, catch Smudge before he undoes your work,
// and ride a spinning disc back to the top to trick Hiss into jumping off.
K.theme({ bg: '#140c2a', ink: '#f6f0ff', accent: '#ffb02e', accentInk: '#2a1600' });
const W = 240, H = 300;
K.screen(W, H);
K.hud(['score', 'level', 'lives']);
K.pad({ dpad: '4', buttons: [] });

const ROWS = 7, CW = 28, RH = 21, TOPY = 62, CX = W / 2;
const DIRS = { ul: [-1, -1], ur: [-1, 0], dl: [1, 0], dr: [1, 1] };
// colors for each round: start / middle / target tops, plus the two side faces
const ROUND_COL = [
  { s: '#3a6ad8', m: '#e8c040', t: '#ffe8a0', l: '#8a4ac8', r: '#5a2a8a' },
  { s: '#d84a4a', m: '#3ac88a', t: '#e8f0ff', l: '#2a7a9a', r: '#1a4a6a' },
  { s: '#e8a030', m: '#d84ac8', t: '#6ad8ff', l: '#4a8a3a', r: '#2a5a24' },
  { s: '#6a6a7a', m: '#ff7a3a', t: '#ffd23f', l: '#a83a4a', r: '#6a1a2a' }
];

let state = 'title', score, lives, level, round, cubes, P, mobs, discs, spawnT, freezeT, msg, msgT, deadT, clearT, best = K.best('peakhopper'), hissLure = null, stars = [];
for (let i = 0; i < 50; i++) stars.push({ x: Math.random() * W, y: Math.random() * H * 0.6, s: Math.random() * 1.2 + 0.3, p: Math.random() * 6 });

function title() { K.card({ title: 'PEAK HOPPER', text: 'Push the joystick (or tap) toward a corner to hop that way. Land on every cube to change its top to the target color shown up top. Dodge red balls and Hiss the snake. Green ball freezes everyone. Catch Smudge before he un-flips your cubes. Jump onto a spinning disc to fly back to the top. Hiss will follow you off the edge!', best: best ? 'BEST ' + best : '', button: 'Hop!', onStart: start }); }
function start() { score = 0; lives = 3; level = 1; round = 1; newRound(); state = 'play'; hud(); }
function hud() { K.set('score', score); K.set('level', 'LV ' + level + '-' + round); K.set('lives', '●'.repeat(Math.max(0, lives))); }
function pal() { return ROUND_COL[(round - 1 + (level - 1)) % ROUND_COL.length]; }
// how many steps a cube needs, and whether a finished cube flips back when you land again
function steps() { return level === 2 || level >= 4 ? 2 : 1; }
function revert() { return level >= 3; }
function newRound() {
  cubes = []; for (let r = 0; r < ROWS; r++) { cubes.push([]); for (let c = 0; c <= r; c++) cubes[r].push({ v: 0, flash: 0 }); }
  discs = [{ r: 4, c: -1, used: false }, { r: 2, c: 3, used: false }];
  if (level >= 2) discs.push({ r: 5, c: 6, used: false });
  if (level >= 3) discs.push({ r: 3, c: -1, used: false });
  // keep only discs that don't sit on top of each other
  discs = discs.filter((d, i) => discs.findIndex(e => e.r === d.r && e.c === d.c) === i);
  mobs = []; spawnT = 2.2; freezeT = 0; deadT = 0; clearT = 0; hissLure = null;
  P = { r: 0, c: 0, hop: null, fall: null, disc: null };
  land(P.r, P.c, true);
  msg = 'LEVEL ' + level + '  ROUND ' + round; msgT = 1.6;
}
const pos = (r, c) => ({ x: CX + (c - r / 2) * CW, y: TOPY + r * RH });
const onPyr = (r, c) => r >= 0 && r < ROWS && c >= 0 && c <= r;
const hopTime = () => Math.max(0.2, 0.3 - (level - 1) * 0.015);
const mobTime = () => Math.max(0.42, 0.8 - (level - 1) * 0.07 - (round - 1) * 0.03);

function land(r, c, quiet) {
  const q = cubes[r][c], max = steps();
  if (q.v < max) { q.v++; score += 25; q.flash = 0.25; if (!quiet) K.beep(520 + q.v * 160, 0.06, { type: 'triangle', vol: 0.05 }); }
  else if (revert()) { q.v = max - 1; q.flash = 0.25; K.beep(260, 0.06, { type: 'triangle', vol: 0.05 }); }
  else if (!quiet) K.beep(420, 0.04, { type: 'triangle', vol: 0.03 });
  hud();
  if (cubes.every(row => row.every(q2 => q2.v === max))) roundClear();
}
function roundClear() {
  const unused = discs.filter(d => !d.used).length, bonus = 1000 + (round - 1) * 250 + (level - 1) * 500 + unused * 50;
  score += bonus; hud(); clearT = 2; msg = 'ROUND CLEAR! +' + bonus; msgT = 2; mobs = [];
  K.tune([523, 659, 784, 1047, 784, 1047, 1319], 0.08);
}

// ---------- hopping ----------
function startHop(o, dir, dur) {
  const [dr, dc] = DIRS[dir], tr = o.r + dr, tc = o.c + dc;
  o.hop = { fr: o.r, fc: o.c, tr, tc, t: 0, T: dur, dir }; o.face = dir;
}
function readDir() {
  const sx = K.stick.x, sy = K.stick.y;
  if (Math.hypot(sx, sy) > 0.4) return (sy < 0 ? 'u' : 'd') + (sx < 0 ? 'l' : 'r');
  const u = K.down('up'), d = K.down('down'), l = K.down('left'), r = K.down('right');
  if (u && l) return 'ul'; if (u && r) return 'ur'; if (d && l) return 'dl'; if (d && r) return 'dr';
  if (u) return 'ur'; if (r) return 'dr'; if (d) return 'dl'; if (l) return 'ul';
  if (K.ptr.tapped || K.ptr.down) { const p = drawPos(P); return (K.ptr.y < p.y - 10 ? 'u' : 'd') + (K.ptr.x < p.x ? 'l' : 'r'); }
  return null;
}
addEventListener('keydown', e => { const m = { q: 'ul', e: 'ur', z: 'dl', c: 'dr', Q: 'ul', E: 'ur', Z: 'dl', C: 'dr' }[e.key]; if (m) keyDir = m; });
let keyDir = null;

function drawPos(o) {
  if (o.fall) return { x: o.fall.x, y: o.fall.y };
  if (o.disc) return { x: o.disc.x, y: o.disc.y };
  if (!o.hop) { const p = pos(o.r, o.c); return { x: p.x, y: p.y - (o.drop || 0) }; }
  const h = o.hop, a = pos(h.fr, h.fc), b = pos(h.tr, h.tc), k = Math.min(1, h.t / h.T), up = b.y < a.y;
  return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k - Math.sin(k * Math.PI) * (up ? 16 : 11) };
}

function spawnMob() {
  const kinds = ['red', 'red'];
  if (!mobs.some(m => m.k === 'egg' || m.k === 'hiss')) kinds.push('egg', 'egg');
  if (Math.random() < 0.18) kinds.push('green');
  if (level >= 2 || round >= 3) kinds.push('smudge');
  const k = kinds[Math.floor(Math.random() * kinds.length)], c = Math.random() < 0.5 ? 0 : 1;
  mobs.push({ k, r: 1, c, hop: null, wait: 0.5, drop: 70, face: 'dl' });
}

function update(dt) {
  if (state !== 'play') return;
  if (msgT > 0) msgT -= dt;
  for (const row of cubes) for (const q of row) if (q.flash > 0) q.flash -= dt;
  for (const d of discs) d.spin = (d.spin || 0) + dt * 6;
  if (clearT > 0) { clearT -= dt; if (clearT <= 0) { round++; if (round > 4) { round = 1; level++; } newRound(); hud(); } return; }
  if (deadT > 0) { deadT -= dt; if (deadT <= 0) { if (lives <= 0) return over(); mobs = []; spawnT = 2; if (P.fall) { P = { r: 0, c: 0, hop: null, fall: null, disc: null }; } } return; }
  if (freezeT > 0) freezeT -= dt;

  // ---- player ----
  if (P.fall) { P.fall.vy += 400 * dt; P.fall.x += P.fall.vx * dt; P.fall.y += P.fall.vy * dt; if (P.fall.y > H + 30) die(false); return; }
  if (P.disc) {
    const d = P.disc; d.t += dt; const k = Math.min(1, d.t / 1.6), top = pos(0, 0);
    d.x = d.sx + (top.x - d.sx) * k; d.y = d.sy + (top.y - 30 - d.sy) * k - Math.sin(k * Math.PI) * 30;
    if (k >= 1) { P.disc = null; P.r = 0; P.c = 0; P.hop = null; P.drop = 30; P.dropV = 0; }
    return;
  }
  if (P.drop > 0) { P.dropV += 500 * dt; P.drop = Math.max(0, P.drop - P.dropV * dt); if (P.drop === 0) land(0, 0); }
  else if (P.hop) {
    P.hop.t += dt;
    if (P.hop.t >= P.hop.T) {
      const h = P.hop; P.hop = null;
      if (onPyr(h.tr, h.tc)) { P.r = h.tr; P.c = h.tc; land(P.r, P.c); }
      else {
        const disc = discs.find(d => !d.used && d.r === h.tr && d.c === h.tc);
        const p = pos(h.tr, h.tc);
        if (disc) { disc.used = true; P.disc = { t: 0, sx: p.x, sy: p.y, x: p.x, y: p.y }; K.tune([660, 880, 1100, 1320], 0.08); hissLure = { r: h.fr, c: h.fc, tr: h.tr, tc: h.tc }; }
        else { P.fall = { x: p.x, y: p.y, vx: (p.x - pos(h.fr, h.fc).x) * 0.8, vy: h.tr < h.fr ? -60 : 20, back: h.tr < h.fr }; K.beep(800, 0.9, { type: 'sine', to: 80, vol: 0.06 }); return; }
      }
    }
  } else if (clearT <= 0) {
    const d = keyDir || readDir(); keyDir = null;
    if (d) { startHop(P, d, hopTime()); K.beep(330, 0.05, { type: 'square', to: 500, vol: 0.03 }); }
  }

  // ---- enemies ----
  spawnT -= dt;
  if (spawnT <= 0 && mobs.length < 2 + Math.min(3, level)) { spawnMob(); spawnT = K.rnd(2.4, 4.2) - Math.min(1.4, level * 0.2); }
  for (const m of mobs) {
    if (m.fall) { m.fall.vy += 400 * dt; m.fall.x += m.fall.vx * dt; m.fall.y += m.fall.vy * dt; if (m.fall.y > H + 30) m.gone = true; continue; }
    if (m.drop > 0) { m.drop = Math.max(0, m.drop - 260 * dt); continue; }
    if (freezeT > 0 && m.k !== 'green') continue;
    if (m.hop) {
      m.hop.t += dt;
      if (m.hop.t >= m.hop.T) {
        const h = m.hop; m.hop = null;
        if (onPyr(h.tr, h.tc)) { m.r = h.tr; m.c = h.tc; if (m.k === 'smudge') { const q = cubes[m.r][m.c]; if (q.v > 0) { q.v--; q.flash = 0.2; } } K.beep(m.k === 'hiss' ? 180 : 240, 0.03, { vol: 0.02 }); }
        else { const p = pos(h.tr, h.tc); m.fall = { x: p.x, y: p.y, vx: (p.x - pos(h.fr, h.fc).x) * 0.8, vy: 0 }; if (m.k === 'hiss') { score += 500; hud(); msg = 'HISS FELL! +500'; msgT = 1.5; K.tune([880, 660, 440, 220], 0.08); hissLure = null; } }
      }
      continue;
    }
    m.wait -= dt; if (m.wait > 0) continue;
    m.wait = m.k === 'hiss' ? mobTime() * 0.25 : mobTime() * 0.35;
    let dir;
    if (m.k === 'egg' && m.r === ROWS - 1) { m.k = 'hiss'; m.wait = 0.6; K.beep(120, 0.4, { type: 'sawtooth', to: 300, vol: 0.05 }); continue; }
    if (m.k === 'hiss') {
      // chase Boing; if he rode a disc away, chase the spot he jumped from and follow him off the edge
      if (hissLure && P.disc) { dir = m.r === hissLure.r && m.c === hissLure.c ? Object.keys(DIRS).find(k => m.r + DIRS[k][0] === hissLure.tr && m.c + DIRS[k][1] === hissLure.tc) : bestDir(m, pos(hissLure.r, hissLure.c), true); }
      else { hissLure = null; dir = bestDir(m, drawPos(P), true); }
    } else dir = Math.random() < 0.5 ? 'dl' : 'dr';
    if (dir) startHop(m, dir, mobTime() * (m.k === 'hiss' ? 0.75 : 0.65));
  }
  mobs = mobs.filter(m => !m.gone);

  // ---- collisions ----
  if (!P.disc && !P.fall && !(P.drop > 0)) {
    const pp = drawPos(P);
    for (const m of mobs) {
      if (m.fall || m.drop > 10) continue;
      const mp = drawPos(m); if (Math.hypot(mp.x - pp.x, mp.y - pp.y) > 9) continue;
      if (m.k === 'green') { m.gone = true; freezeT = 3.5; score += 100; hud(); msg = 'FREEZE!'; msgT = 1.2; K.tune([1320, 990, 1320], 0.06); }
      else if (m.k === 'smudge') { m.gone = true; score += 300; hud(); msg = 'GOT SMUDGE! +300'; msgT = 1.2; K.tune([784, 988], 0.07); }
      else if (freezeT > 0) continue;
      else { die(true); break; }
    }
    mobs = mobs.filter(m => !m.gone);
  }
}
// pick the hop that brings this enemy closest to a point
function bestDir(m, target, canUp) {
  let best = null, bd = 1e9;
  for (const k in DIRS) { const [dr, dc] = DIRS[k], r = m.r + dr, c = m.c + dc; if (!onPyr(r, c) || (!canUp && dr < 0)) continue; const p = pos(r, c), d = Math.hypot(p.x - target.x, p.y - target.y); if (d < bd) { bd = d; best = k; } }
  return best;
}
function die(caught) {
  lives--; hud(); deadT = caught ? 1.8 : 0.6; msg = caught ? '' : 'WHOOPS!'; msgT = caught ? 0 : 1;
  if (caught) { P.yikes = 1.8; K.beep(150, 0.6, { type: 'sawtooth', to: 60, vol: 0.07 }); }
}
function over() { state = 'over'; best = K.saveBest('peakhopper', score); K.card({ title: 'GAME OVER', text: 'You reached level ' + level + ', round ' + round + ' with ' + score + ' points.', best: 'BEST ' + best, button: 'Hop again', onStart: start }); }

// ---------- drawing ----------
function cubeTop(q) { const p = pal(), max = steps(); return q.v === 0 ? p.s : q.v === max ? p.t : p.m; }
function drawCube(c, r, col, t) {
  const { x, y } = pos(r, col), q = cubes[r][col], p = pal(), INK = '#120a1e';
  const hw = CW / 2, th = 7, side = 14;
  // left face
  let g = c.createLinearGradient(x - hw, y, x, y + side + th); g.addColorStop(0, A.shade(p.l, 0.15)); g.addColorStop(1, A.shade(p.l, -0.25)); c.fillStyle = g;
  c.beginPath(); c.moveTo(x - hw, y); c.lineTo(x, y + th); c.lineTo(x, y + th + side); c.lineTo(x - hw, y + side); c.closePath(); c.fill();
  // right face
  g = c.createLinearGradient(x, y, x + hw, y + side + th); g.addColorStop(0, A.shade(p.r, 0.05)); g.addColorStop(1, A.shade(p.r, -0.35)); c.fillStyle = g;
  c.beginPath(); c.moveTo(x + hw, y); c.lineTo(x, y + th); c.lineTo(x, y + th + side); c.lineTo(x + hw, y + side); c.closePath(); c.fill();
  // brick lines on the sides
  c.strokeStyle = 'rgba(0,0,0,.18)'; c.lineWidth = 0.4; c.beginPath();
  for (let k = 1; k < 3; k++) { const yy = k * side / 3; c.moveTo(x - hw, y + yy); c.lineTo(x, y + th + yy); c.moveTo(x + hw, y + yy); c.lineTo(x, y + th + yy); }
  c.stroke();
  // top
  const top = cubeTop(q), fl = q.flash > 0 ? q.flash / 0.25 : 0;
  g = c.createLinearGradient(x - hw, y - th, x + hw, y + th); g.addColorStop(0, A.shade(top, 0.3)); g.addColorStop(1, A.shade(top, -0.12)); c.fillStyle = g;
  c.beginPath(); c.moveTo(x, y - th); c.lineTo(x + hw, y); c.lineTo(x, y + th); c.lineTo(x - hw, y); c.closePath(); c.fill();
  // inner bevel on the top
  c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 0.6; c.beginPath(); c.moveTo(x - hw + 3, y); c.lineTo(x, y - th + 1.5); c.lineTo(x + hw - 3, y); c.stroke();
  c.strokeStyle = 'rgba(0,0,0,.2)'; c.beginPath(); c.moveTo(x - hw + 3, y); c.lineTo(x, y + th - 1.5); c.lineTo(x + hw - 3, y); c.stroke();
  if (fl) { c.fillStyle = 'rgba(255,255,255,' + fl * 0.6 + ')'; c.beginPath(); c.moveTo(x, y - th); c.lineTo(x + hw, y); c.lineTo(x, y + th); c.lineTo(x - hw, y); c.closePath(); c.fill(); }
  if (clearT > 0 && Math.floor(t / 90) % 2) { c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.moveTo(x, y - th); c.lineTo(x + hw, y); c.lineTo(x, y + th); c.lineTo(x - hw, y); c.closePath(); c.fill(); }
  // dark outline
  c.strokeStyle = INK; c.lineWidth = 0.8; c.beginPath(); c.moveTo(x, y - th); c.lineTo(x + hw, y); c.lineTo(x + hw, y + side); c.lineTo(x, y + th + side); c.lineTo(x - hw, y + side); c.lineTo(x - hw, y); c.closePath(); c.moveTo(x - hw, y); c.lineTo(x, y + th); c.lineTo(x + hw, y); c.moveTo(x, y + th); c.lineTo(x, y + th + side); c.stroke();
}
function drawDisc(c, d, x, y) {
  const s = d.spin || 0; A.glow(c, x, y, 14, '255,255,255', 0.25);
  const cols = ['#ff4a4a', '#ffb02e', '#ffe84a', '#4ae86a', '#4ac8ff', '#a84aff'];
  for (let i = 0; i < 6; i++) { c.fillStyle = cols[(i + Math.floor(s)) % 6]; c.beginPath(); c.moveTo(x, y); c.ellipse(x, y, 9, 3.6, 0, i / 6 * 6.283, (i + 1) / 6 * 6.283); c.closePath(); c.fill(); }
  c.strokeStyle = '#120a1e'; c.lineWidth = 0.7; c.beginPath(); c.ellipse(x, y, 9, 3.6, 0, 0, 7); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.ellipse(x, y, 2.5, 1, 0, 0, 7); c.fill();
}
// Boing: round teal hopper with antennae, big eyes and sneakers
function drawBoing(c, x, y, face, t, squash) {
  const INK = '#120a1e', left = face && face[1] === 'l', back = face && face[0] === 'u', sq = squash || 0;
  c.save(); c.translate(x, y); if (left) c.scale(-1, 1);
  A.shadow(c, 0, 1, 5);
  // sneakers
  c.fillStyle = INK; c.beginPath(); c.ellipse(-2.8, -0.6, 2.8, 1.8, 0, 0, 7); c.ellipse(3, -0.6, 2.8, 1.8, 0, 0, 7); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.ellipse(-2.6, -0.8, 2.3, 1.3, 0, 0, 7); c.ellipse(3.2, -0.8, 2.3, 1.3, 0, 0, 7); c.fill();
  c.fillStyle = '#e63946'; c.fillRect(-4, -1.3, 2.6, 0.6); c.fillRect(1.8, -1.3, 2.6, 0.6);
  // body
  c.scale(1 + sq * 0.15, 1 - sq * 0.15);
  c.fillStyle = INK; c.beginPath(); c.arc(0, -8, 7, 0, 7); c.fill();
  const g = c.createRadialGradient(-2.4, -10.5, 0.8, 0, -8, 7); g.addColorStop(0, '#9af0e0'); g.addColorStop(0.55, '#2ac8b0'); g.addColorStop(1, '#14806e'); c.fillStyle = g; c.beginPath(); c.arc(0, -8, 6.4, 0, 7); c.fill();
  c.fillStyle = 'rgba(255,255,255,.18)'; c.beginPath(); c.ellipse(0, -5, 4, 2.4, 0, 0, 7); c.fill();
  // antennae
  c.strokeStyle = INK; c.lineWidth = 0.9; c.beginPath(); c.moveTo(-1.8, -14); c.quadraticCurveTo(-3.5, -18, -2.2 + Math.sin(t / 120), -19.5); c.moveTo(1.8, -14); c.quadraticCurveTo(3.8, -17.5, 3.6 + Math.sin(t / 120 + 1), -19); c.stroke();
  c.fillStyle = '#ffd23f'; c.beginPath(); c.arc(-2.2 + Math.sin(t / 120), -19.5, 1.3, 0, 7); c.arc(3.6 + Math.sin(t / 120 + 1), -19, 1.3, 0, 7); c.fill();
  if (!back) {
    // eyes and smile
    for (const ex of [-0.4, 3.4]) { c.fillStyle = INK; c.beginPath(); c.ellipse(ex, -9.5, 2.2, 2.7, 0, 0, 7); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.ellipse(ex, -9.5, 1.8, 2.3, 0, 0, 7); c.fill(); c.fillStyle = INK; c.beginPath(); c.arc(ex + 0.6, -9.1, 1, 0, 7); c.fill(); c.fillStyle = '#fff'; c.fillRect(ex + 0.6, -9.9, 0.5, 0.5); }
    c.strokeStyle = INK; c.lineWidth = 0.7; c.beginPath(); c.arc(1.6, -5.6, 2, 0.2, Math.PI - 0.2); c.stroke();
    c.fillStyle = '#ff8aa0'; c.beginPath(); c.ellipse(-3.4, -6, 1.2, 0.7, 0, 0, 7); c.ellipse(5.6, -6, 1, 0.6, 0, 0, 7); c.fill();
  } else { c.fillStyle = '#1aa894'; c.beginPath(); c.arc(0, -8, 2.6, 0, 7); c.fill(); }
  c.restore();
}
function drawBall(c, x, y, col, t) {
  A.shadow(c, x, y + 1, 4);
  c.fillStyle = '#120a1e'; c.beginPath(); c.arc(x, y - 4.5, 4.9, 0, 7); c.fill();
  const g = c.createRadialGradient(x - 1.6, y - 6.2, 0.5, x, y - 4.5, 4.5); g.addColorStop(0, '#fff'); g.addColorStop(0.25, A.shade(col, 0.3)); g.addColorStop(1, A.shade(col, -0.4)); c.fillStyle = g; c.beginPath(); c.arc(x, y - 4.5, 4.4, 0, 7); c.fill();
}
function drawEgg(c, x, y) {
  A.shadow(c, x, y + 1, 4);
  c.fillStyle = '#120a1e'; c.beginPath(); c.ellipse(x, y - 5, 4.4, 5.4, 0, 0, 7); c.fill();
  const g = c.createRadialGradient(x - 1.5, y - 7, 0.5, x, y - 5, 5); g.addColorStop(0, '#e8c8ff'); g.addColorStop(1, '#6a2a9a'); c.fillStyle = g; c.beginPath(); c.ellipse(x, y - 5, 3.9, 4.9, 0, 0, 7); c.fill();
  c.fillStyle = 'rgba(255,255,255,.5)'; for (const [dx, dy] of [[1.5, -6], [-1.4, -3.5], [1, -2.5]]) { c.beginPath(); c.arc(x + dx, y + dy, 0.6, 0, 7); c.fill(); }
}
function drawHiss(c, x, y, face, t) {
  const INK = '#120a1e', left = face && face[1] === 'l';
  c.save(); c.translate(x, y); if (left) c.scale(-1, 1);
  A.shadow(c, 0, 1, 6);
  // coiled body: three stacked rings
  for (let i = 0; i < 3; i++) { const yy = -2 - i * 3.6, rx = 6 - i * 1.2; c.fillStyle = INK; c.beginPath(); c.ellipse(0, yy, rx + 0.6, 2.6, 0, 0, 7); c.fill(); const g = c.createLinearGradient(0, yy - 2, 0, yy + 2); g.addColorStop(0, '#c88aff'); g.addColorStop(1, '#5a1a8a'); c.fillStyle = g; c.beginPath(); c.ellipse(0, yy, rx, 2.1, 0, 0, 7); c.fill(); c.fillStyle = '#ffd23f'; c.fillRect(-1 + i, yy - 0.3, 1, 0.6); }
  // neck and head
  const sw = Math.sin(t / 150) * 1.2;
  c.fillStyle = INK; c.beginPath(); c.ellipse(1 + sw, -15.5, 1.9, 3.4, 0.2, 0, 7); c.fill(); c.fillStyle = '#9a4ae0'; c.beginPath(); c.ellipse(1 + sw, -15.5, 1.4, 3, 0.2, 0, 7); c.fill();
  c.fillStyle = INK; c.beginPath(); c.ellipse(3 + sw, -19.5, 4.6, 3.3, 0, 0, 7); c.fill();
  const hg = c.createRadialGradient(2 + sw, -20.5, 0.4, 3 + sw, -19.5, 4.4); hg.addColorStop(0, '#d8a8ff'); hg.addColorStop(1, '#6a2a9a'); c.fillStyle = hg; c.beginPath(); c.ellipse(3 + sw, -19.5, 4.1, 2.8, 0, 0, 7); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(3.8 + sw, -20.6, 1.3, 0, 7); c.fill(); c.fillStyle = '#e63946'; c.beginPath(); c.arc(4.2 + sw, -20.5, 0.6, 0, 7); c.fill();
  c.strokeStyle = '#ff3b5c'; c.lineWidth = 0.6; const fl = Math.floor(t / 200) % 2; if (fl) { c.beginPath(); c.moveTo(7.2 + sw, -19); c.lineTo(9.4 + sw, -18.6); c.lineTo(10.2 + sw, -19.6); c.moveTo(9.4 + sw, -18.6); c.lineTo(10.2 + sw, -17.8); c.stroke(); }
  c.restore();
}
function drawSmudge(c, x, y, t) {
  const INK = '#120a1e';
  A.shadow(c, x, y + 1, 4);
  c.fillStyle = INK; c.beginPath(); c.ellipse(x, y - 5.5, 4.6, 5.6, 0, 0, 7); c.fill();
  const g = c.createRadialGradient(x - 1.5, y - 7.5, 0.5, x, y - 5.5, 5); g.addColorStop(0, '#b8ff9a'); g.addColorStop(1, '#3a8a2a'); c.fillStyle = g; c.beginPath(); c.ellipse(x, y - 5.5, 4.1, 5.1, 0, 0, 7); c.fill();
  c.fillStyle = INK; c.fillRect(x - 3.6, y - 8.6, 7.2, 2.2); c.fillStyle = '#ffd23f'; c.fillRect(x - 2.6, y - 8.1, 1.6, 1.2); c.fillRect(x + 1, y - 8.1, 1.6, 1.2);
  c.strokeStyle = INK; c.lineWidth = 0.6; c.beginPath(); c.moveTo(x - 1.6, y - 4); c.lineTo(x - 0.5, y - 3.4); c.lineTo(x + 0.5, y - 4); c.lineTo(x + 1.6, y - 3.4); c.stroke();
  // paint brush he un-flips cubes with
  c.strokeStyle = '#8a5a2a'; c.lineWidth = 1; c.beginPath(); c.moveTo(x + 3.6, y - 5); c.lineTo(x + 7, y - 9 + Math.sin(t / 100)); c.stroke(); c.fillStyle = pal().s; c.beginPath(); c.arc(x + 7.3, y - 9.4 + Math.sin(t / 100), 1.3, 0, 7); c.fill();
}
function drawMob(c, m, t) {
  const p = drawPos(m), y = p.y - (m.drop || 0);
  if (m.k === 'red') drawBall(c, p.x, y, '#ff3a3a', t);
  else if (m.k === 'green') drawBall(c, p.x, y, '#4ae86a', t);
  else if (m.k === 'egg') drawEgg(c, p.x, y);
  else if (m.k === 'hiss') drawHiss(c, p.x, y, m.face, t);
  else drawSmudge(c, p.x, y, t);
  if (freezeT > 0 && m.k !== 'green') { c.strokeStyle = 'rgba(160,230,255,.85)'; c.lineWidth = 0.8; c.beginPath(); c.arc(p.x, y - 6, 7, 0, 7); c.stroke(); }
}

function draw(c, t) {
  // night sky with twinkling stars and a far mountain line
  const sky = c.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#0a0620'); sky.addColorStop(0.6, '#2a1650'); sky.addColorStop(1, '#4a2060'); c.fillStyle = sky; c.fillRect(0, 0, W, H);
  for (const s of stars) { c.fillStyle = 'rgba(255,255,255,' + (0.4 + 0.4 * Math.sin(t / 500 + s.p)) + ')'; c.fillRect(s.x, s.y, s.s, s.s); }
  c.fillStyle = '#1e1040'; c.beginPath(); c.moveTo(0, H); for (let x = 0; x <= W; x += 10) c.lineTo(x, H - 40 - 18 * Math.sin(x / 31) - 10 * Math.sin(x / 13)); c.lineTo(W, H); c.fill();
  if (!cubes) return;
  // target color swatch
  const p = pal(); c.fillStyle = 'rgba(0,0,0,.4)'; c.beginPath(); c.roundRect(6, 6, 74, 22, 6); c.fill(); K.text(c, 'CHANGE TO', 30, 17, 5, '#fff');
  c.fillStyle = '#120a1e'; c.beginPath(); c.moveTo(68, 11); c.lineTo(76, 17); c.lineTo(68, 23); c.lineTo(60, 17); c.closePath(); c.fill(); c.fillStyle = p.t; c.beginPath(); c.moveTo(68, 12.2); c.lineTo(74.6, 17); c.lineTo(68, 21.8); c.lineTo(61.4, 17); c.closePath(); c.fill();
  // Boing falling off the back goes behind the pyramid
  if (P.fall && P.fall.back) drawBoing(c, P.fall.x, P.fall.y, 'dr', t);
  for (const m of mobs) if (m.fall && m.fall.y < pos(0, 0).y) drawMob(c, m, t);
  // pyramid back to front
  for (let r = 0; r < ROWS; r++) for (let col = 0; col <= r; col++) drawCube(c, r, col, t);
  for (const d of discs) if (!d.used) { const q = pos(d.r, d.c); drawDisc(c, d, q.x, q.y + 4 + Math.sin(t / 300 + d.r) * 1.5); }
  // characters sorted by depth so nearer ones overlap
  const list = mobs.map(m => ({ y: drawPos(m).y, f: () => drawMob(c, m, t) }));
  if (!(P.fall && P.fall.back) && deadT <= 0 || P.yikes > 0) {
    const pp = drawPos(P), sq = P.drop === 0 && P.hop && P.hop.t < 0.05 ? 1 : 0;
    list.push({ y: pp.y, f: () => { if (P.disc) drawDisc(c, { spin: t / 160 }, pp.x, pp.y + 2); drawBoing(c, pp.x, pp.y - (P.drop || 0), P.hop ? P.hop.dir : P.face, t, sq); } });
  }
  list.sort((a, b) => a.y - b.y).forEach(o => o.f());
  // YIKES! speech bubble when caught
  if (P.yikes > 0 && deadT > 0) {
    const pp = drawPos(P), bx = K.clamp(pp.x + 18, 30, W - 30), by = pp.y - 34;
    c.fillStyle = '#fff'; c.beginPath(); c.roundRect(bx - 22, by - 9, 44, 16, 7); c.fill(); c.beginPath(); c.moveTo(bx - 12, by + 6); c.lineTo(pp.x + 3, pp.y - 18); c.lineTo(bx - 4, by + 6); c.fill();
    c.strokeStyle = '#120a1e'; c.lineWidth = 0.8; c.beginPath(); c.roundRect(bx - 22, by - 9, 44, 16, 7); c.stroke(); K.text(c, 'YIKES!', bx, by - 1, 7, '#e63946');
  }
  if (freezeT > 0) { c.fillStyle = 'rgba(150,220,255,' + Math.min(0.15, freezeT * 0.05) + ')'; c.fillRect(0, 0, W, H); }
  if (msgT > 0 && msg) K.text(c, msg, W / 2, H - 22, 9, '#ffd23f');
  A.vignette(c, W, H, 0.3);
}
// remember which way Boing last faced
{ const _u = update; update = function (dt) { if (P && P.hop) P.face = P.hop.dir; if (P && P.yikes > 0) P.yikes -= dt; _u(dt); }; }
start(); state = 'title'; title(); K.run(update, draw);
</script>
