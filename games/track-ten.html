<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Track Ten</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script>
// Track Ten: ten track-and-field events back to back. Tap left and right in turn to run, then nail your ACTION timing.
K.theme({ bg: '#0f2a1a', ink: '#f2fff6', accent: '#ff5a36', accentInk: '#fff' });
const W = 320, H = 240, GY = 178;
K.screen(W, H);
K.hud(['event', 'points']);
K.pad({ dpad: 'lr', buttons: [{ id: 'a', label: 'ACTION' }] });

const EVENTS = [
  { n: '100 Metres', k: 'sprint', dist: 100, mult: 1, help: 'Tap ◀ ▶ ◀ ▶ as fast as you can.' },
  { n: 'Long Jump', k: 'jump', run: 40, scale: 0.7, ppm: 14, help: 'Run, press ACTION before the white line, hold to raise your angle, let go to jump.' },
  { n: 'Shot Put', k: 'stand', scale: 1.9, ppm: 9, help: 'Tap ◀ ▶ to build power, hold ACTION to aim, let go to throw.' },
  { n: 'High Jump', k: 'bar', run: 20, start: 1.8, step: 0.08, help: 'Run, then press ACTION on the yellow mark. Three misses and you are out.' },
  { n: '400 Metres', k: 'sprint', dist: 400, mult: 3.2, tscale: 3.4, help: 'Tap ◀ ▶ for one big lap.' },
  { n: '110m Hurdles', k: 'sprint', dist: 110, mult: 1, hurdles: true, help: 'Tap ◀ ▶ to run and ACTION to jump each hurdle.' },
  { n: 'Discus', k: 'stand', scale: 6, ppm: 3, help: 'Tap ◀ ▶ to spin up, hold ACTION to aim, let go to throw.' },
  { n: 'Pole Vault', k: 'bar', run: 30, start: 4.2, step: 0.2, help: 'Run, then press ACTION on the yellow mark to plant the pole.' },
  { n: 'Javelin', k: 'jump', run: 30, scale: 7.5, ppm: 2.5, throwing: true, help: 'Run, press ACTION before the line, hold to aim, let go to throw.' },
  { n: '1500 Metres', k: 'sprint', dist: 1500, mult: 9, tscale: 11, stamina: true, help: 'Pace yourself! Tapping too hard drains your stamina bar.' }
];
let state = 'title', ev, evI, total, phase, phT, a, results, best = K.best('trackten');
function title() { K.card({ title: 'TRACK TEN', text: 'Ten events, one champion. Tap the ◀ and ▶ buttons one after the other to run. Each event tells you when to press ACTION. Beat your best total.', best: best ? 'BEST ' + best + ' PTS' : '', button: 'Start event 1', onStart: start }); }
function start() { total = 0; evI = 0; results = []; begin(); state = 'play'; }
function begin() {
  ev = EVENTS[evI]; phase = 'intro'; phT = 2.6;
  a = { x: 0, v: 0, last: null, t: 0, stamina: 100, air: 0, angle: 0, holding: false, attempts: 0, fails: 0, bar: ev.start, cleared: 0, obj: null, hurdles: [], hit: 0, power: 0, done: false, msg: '' };
  if (ev.hurdles) for (let i = 0; i < 10; i++) a.hurdles.push(13.7 + i * 9.14);
  hud();
}
function hud() { K.set('event', (evI + 1) + '/10 ' + ev.n.toUpperCase()); K.set('points', total + ' PTS'); }
function mash(dt, cap) {
  let got = false;
  for (const side of ['left', 'right']) if (K.hit(side)) { got = true; const alt = a.last !== side; a.last = side; a.v = Math.min(cap || 11.6, a.v + (alt ? 0.95 : 0.25)); if (alt) K.beep(side === 'left' ? 180 : 220, 0.03, { vol: 0.03 }); }
  if (K.ptr.tapped) { const side = K.ptr.x < W / 2 ? 'left' : 'right'; const alt = a.last !== side; a.last = side; a.v = Math.min(cap || 11.6, a.v + (alt ? 0.95 : 0.25)); }
  a.v = Math.max(0, a.v - a.v * 0.7 * dt);
  return got;
}
function score(pts, msg) { pts = Math.max(0, Math.round(pts)); total += pts; results.push({ n: ev.n, msg, pts }); a.msg = msg + '  +' + pts; phase = 'result'; phT = 2.6; hud(); K.tune(pts > 700 ? [523, 659, 784, 1047] : [523, 659], 0.08); }

function update(dt) {
  if (state !== 'play') return;
  phT -= dt;
  if (phase === 'intro') { if (phT <= 0 || K.hit('a')) { phase = 'go'; a.t = 0; } return; }
  if (phase === 'result') { if (phT <= 0) { evI++; if (evI >= EVENTS.length) return finish(); begin(); } return; }
  a.t += dt;
  if (ev.k === 'sprint') {
    let cap = 11.6;
    if (ev.stamina) { cap = a.stamina > 5 ? 11.6 : 5.5; a.stamina = K.clamp(a.stamina - (a.v > 7.5 ? (a.v - 7.5) * 9 * dt : -12 * dt), 0, 100); }
    mash(dt, cap);
    if (ev.hurdles) {
      if (K.hit('a') && a.air <= 0) { a.air = 0.5; K.beep(500, 0.06, { vol: 0.04 }); }
      if (a.air > 0) a.air -= dt;
      for (let i = 0; i < a.hurdles.length; i++) { const hx = a.hurdles[i]; if (hx && a.x > hx - 0.3 && a.x < hx + 0.3) { if (a.air <= 0) { a.v *= 0.45; K.beep(140, 0.15, { vol: 0.06 }); a.knocked = (a.knocked || 0) + 1; } a.hurdles[i] = 0; } }
    }
    a.x += a.v * ev.mult * dt;
    if (a.x >= ev.dist) {
      const t = a.t * (ev.tscale || 1);
      const par = { 100: [10, 17], 400: [44, 70], 110: [13.5, 22], 1500: [220, 330] }[ev.dist];
      score(1000 * (par[1] - t) / (par[1] - par[0]), t.toFixed(2) + 's');
    }
  } else if (ev.k === 'jump') {
    if (!a.obj) {
      if (!a.holding) { mash(dt); a.x += a.v * dt * 1.3; }
      if (K.hit('a') && !a.holding) { a.holding = true; a.angle = 10; a.tv = a.v; }
      if (a.holding) { a.angle = Math.min(70, a.angle + 55 * dt); a.x += a.v * dt * 1.3; if (!K.down('a') || a.angle >= 70) launch(a.tv); }
      if (a.x > ev.run + 0.3 && !a.obj) score(0, 'FOUL!');
    } else fly(dt);
  } else if (ev.k === 'stand') {
    if (!a.obj) {
      if (!a.holding) { mash(dt); a.power = a.v; }
      if (K.hit('a') && a.t > 0.3) { a.holding = true; a.angle = 10; }
      if (a.holding) { a.angle = Math.min(70, a.angle + 55 * dt); if (!K.down('a') || a.angle >= 70) launch(a.power); }
      if (a.t > 8 && !a.holding) launch(a.power);
    } else fly(dt);
  } else if (ev.k === 'bar') {
    if (a.air > 0) { a.air -= dt; if (a.air <= 0) nextBar(); return; }
    mash(dt); a.x += a.v * dt * 1.2;
    const mark = ev.run - 2;
    if (K.hit('a')) {
      const off = Math.abs(a.x - mark), timing = Math.max(0, 1 - off / 2.2);
      const h = ev.start < 3 ? 1.35 + a.v * 0.06 + timing * 0.35 : 3.0 + a.v * 0.16 + timing * 1.4;
      a.jumpH = h; a.ok = h >= a.bar; a.air = 1.4; a.x = mark; K.beep(a.ok ? 700 : 200, 0.2, { vol: 0.06 });
    }
    if (a.x > ev.run + 2) { a.jumpH = 0; a.ok = false; a.air = 0.8; }
  }
}
function launch(v) {
  const ang = a.angle * Math.PI / 180, d = (v * v * Math.sin(2 * ang)) / 9.81 * ev.scale;
  a.obj = { t: 0, dur: 1.4, d: Math.max(0.3, d), ang }; a.holding = false; K.beep(400, 0.2, { to: 900, vol: 0.05 });
}
function fly(dt) {
  a.obj.t += dt / a.obj.dur;
  if (a.obj.t >= 1) {
    const d = a.obj.d;
    const par = { 'Long Jump': [8.2, 4], 'Shot Put': [21, 8], 'Discus': [68, 25], 'Javelin': [85, 30] }[ev.n];
    score(1000 * (d - par[1]) / (par[0] - par[1]), d.toFixed(2) + ' m');
  }
}
function nextBar() {
  if (a.ok) { a.cleared = a.bar; a.bar = +(a.bar + ev.step).toFixed(2); a.fails = 0; K.tune([659, 880], 0.07); }
  else { a.fails++; K.beep(150, 0.2, { type: 'sawtooth', vol: 0.05 }); }
  if (a.fails >= 3 || a.attempts >= 9) {
    const par = ev.start < 3 ? [2.3, 1.5] : [5.8, 3.4];
    return score(a.cleared ? 1000 * (a.cleared - par[1]) / (par[0] - par[1]) : 0, a.cleared ? a.cleared.toFixed(2) + ' m' : 'NO HEIGHT');
  }
  a.attempts++; a.x = 0; a.v = 0;
}
function finish() {
  state = 'over'; best = K.saveBest('trackten', total);
  const top = results.slice().sort((x, y) => y.pts - x.pts)[0];
  K.card({ title: total >= 7000 ? 'CHAMPION!' : 'FINISHED', text: 'Total: ' + total + ' points. Best event: ' + top.n + ' (' + top.msg + ').', best: 'BEST ' + best + ' PTS', button: 'Go again', onStart: start });
}

function runner(c, x, y, t, speed, pose) {
  x = Math.round(x); y = Math.round(y);
  const k = speed > 0.3 ? Math.floor(t / Math.max(40, 160 - speed * 10)) % 2 : 0;
  c.fillStyle = '#ffcf9e'; c.fillRect(x - 3, y - 30, 6, 6);
  c.fillStyle = '#e63946'; c.fillRect(x - 4, y - 24, 8, 10);
  c.fillStyle = '#fff'; c.fillRect(x - 2, y - 22, 4, 3);
  c.fillStyle = '#1f4aa8'; c.fillRect(x - 4, y - 14, 8, 4);
  c.fillStyle = '#ffcf9e';
  if (pose === 'air') { c.fillRect(x - 6, y - 10, 4, 6); c.fillRect(x + 2, y - 12, 6, 3); }
  else { c.fillRect(x - 4 + (k ? 3 : -2), y - 10, 3, 10); c.fillRect(x + 1 + (k ? -3 : 2), y - 10, 3, 10); }
  c.fillRect(x + (k ? 4 : -6), y - 23, 3, 7);
}
function draw(c, t) {
  c.fillStyle = '#8fd0ff'; c.fillRect(0, 0, W, 90);
  c.fillStyle = '#3a4a6a'; c.fillRect(0, 70, W, 30); for (let i = 0; i < 64; i++) { c.fillStyle = ['#ff5a36', '#ffd23f', '#fff', '#46a8ff'][i % 4]; c.fillRect((i * 5 - ((a ? a.x : 0) * 6)) % W + (i * 5 < 0 ? W : 0), 74 + (i % 4) * 5, 3, 3); }
  c.fillStyle = '#3fa34d'; c.fillRect(0, 100, W, H - 100);
  c.fillStyle = '#c8502c'; c.fillRect(0, GY - 30, W, 44); c.fillStyle = 'rgba(255,255,255,.6)'; c.fillRect(0, GY - 30, W, 1); c.fillRect(0, GY + 14, W, 1);
  if (!a) return;
  const ppm = ev.k === 'sprint' ? 18 : ev.k === 'bar' ? 14 : (ev.ppm || 10), cam = (ev.k === 'stand' ? 0 : a.x) * ppm - 90;
  const wx = m => m * ppm - cam;
  for (let m = Math.floor(cam / ppm / 10) * 10; m < (cam + W) / ppm; m += 10) { const x = wx(m); if (x > -20 && x < W) { c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(x, GY - 30, 1, 44); if (ev.k === 'sprint') K.text(c, m, x, GY + 22, 7, '#fff'); } }
  if (ev.k === 'sprint') { const fx = wx(ev.dist); c.fillStyle = '#fff'; c.fillRect(fx, GY - 30, 3, 44); if (ev.hurdles) for (const hx of a.hurdles) if (hx) { const x = wx(hx); c.fillStyle = '#fff'; c.fillRect(x, GY - 14, 2, 14); c.fillRect(x - 4, GY - 14, 10, 3); c.fillStyle = '#e63946'; c.fillRect(x - 4, GY - 12, 10, 1); } }
  if (ev.k === 'jump') { const lx = wx(ev.run); c.fillStyle = '#fff'; c.fillRect(lx, GY - 30, 3, 44); if (!ev.throwing) { c.fillStyle = '#e8d08a'; c.fillRect(lx + 3, GY - 30, W, 44); } }
  if (ev.k === 'stand') { c.fillStyle = '#9aa0a8'; c.beginPath(); c.arc(90, GY, 18, 0, 7); c.fill(); c.fillStyle = '#c8502c'; c.beginPath(); c.arc(90, GY, 15, 0, 7); c.fill(); for (let m = 5; m < 100; m += 5) { const x = 90 + m * ppm; if (x < W) { c.fillStyle = 'rgba(255,255,255,.4)'; c.fillRect(x, GY - 30, 1, 44); K.text(c, m, x, GY + 22, 7, '#fff'); } } }
  if (ev.k === 'bar') { const bx = wx(ev.run), mk = wx(ev.run - 2); c.fillStyle = '#ffd23f'; c.fillRect(mk - 1, GY - 2, 3, 6); c.fillStyle = '#ddd'; c.fillRect(bx - 1, GY - 90, 2, 90); c.fillRect(bx + 25, GY - 90, 2, 90); const byy = GY - a.bar * (ev.start < 3 ? 30 : 14); c.fillStyle = '#ff5a36'; c.fillRect(bx, byy, 26, 3); c.fillStyle = '#46a8ff'; c.fillRect(bx + 2, GY - 12, 26, 12); K.text(c, a.bar.toFixed(2) + ' m', bx + 13, byy - 10, 8, '#fff'); K.text(c, 'MISSES ' + 'X'.repeat(a.fails), 60, GY + 28, 8, '#fff'); }
  // athlete + flying object
  let rx = ev.k === 'stand' ? 90 : wx(a.x), ry = GY + 6, pose = '';
  if (ev.k === 'bar' && a.air > 0) { const k = 1 - a.air / 1.4, h = (a.jumpH || 0) * (ev.start < 3 ? 30 : 14); rx = wx(ev.run - 2) + k * 50; ry = GY + 6 - Math.sin(k * Math.PI) * h; pose = 'air'; }
  if (a.obj && ev.k === 'jump' && !ev.throwing) { const k = Math.min(1, a.obj.t); rx = wx(ev.run) + k * a.obj.d * ppm; ry = GY + 6 - Math.sin(k * Math.PI) * a.obj.d * 4; pose = 'air'; }
  runner(c, rx, ry, t, a.v, pose);
  if (a.obj && (ev.k === 'stand' || ev.throwing)) {
    const k = Math.min(1, a.obj.t), sx = ev.k === 'stand' ? 90 : wx(ev.run), ox = sx + k * a.obj.d * ppm, oy = GY - 24 - Math.sin(k * Math.PI) * a.obj.d * ppm * Math.tan(a.obj.ang) / 4;
    c.fillStyle = ev.n === 'Javelin' ? '#ddd' : '#555'; if (ev.n === 'Javelin') c.fillRect(ox - 8, oy, 16, 2); else { c.beginPath(); c.arc(ox, oy, 3, 0, 7); c.fill(); }
  }
  if (a.holding) { c.strokeStyle = '#ffd23f'; c.lineWidth = 2; c.beginPath(); c.moveTo(rx, GY - 20); c.lineTo(rx + Math.cos(a.angle * Math.PI / 180) * 30, GY - 20 - Math.sin(a.angle * Math.PI / 180) * 30); c.stroke(); K.text(c, Math.round(a.angle) + '°', rx + 30, GY - 52, 8, '#ffd23f'); }
  // speed / stamina meters
  c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(8, 104, 104, 9); c.fillStyle = '#ffd23f'; c.fillRect(10, 106, 100 * Math.min(1, (ev.k === 'stand' ? a.power : a.v) / 11.6), 5); K.text(c, ev.k === 'stand' ? 'POWER' : 'SPEED', 130, 109, 7, '#fff');
  if (ev.stamina) { c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(8, 116, 104, 9); c.fillStyle = a.stamina < 25 ? '#ff3b5c' : '#7cff6b'; c.fillRect(10, 118, a.stamina, 5); K.text(c, 'STAMINA', 134, 121, 7, '#fff'); }
  if (ev.k === 'sprint' && phase === 'go') K.text(c, (a.t * (ev.tscale || 1)).toFixed(2), W - 40, 109, 10, '#fff');
  if (phase === 'intro') { c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(20, 20, W - 40, 64); K.text(c, 'EVENT ' + (evI + 1) + ': ' + ev.n.toUpperCase(), W / 2, 36, 12, '#ffd23f'); wrap(c, ev.help, W / 2, 56, W - 60); }
  if (phase === 'result') { c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(40, 30, W - 80, 40); K.text(c, a.msg, W / 2, 50, 13, '#fff'); }
}
function wrap(c, txt, x, y, mw) {
  c.font = '9px Rubik, sans-serif'; c.textAlign = 'center'; c.fillStyle = '#fff';
  const words = txt.split(' '); let line = ''; for (const w of words) { const test = line ? line + ' ' + w : w; if (c.measureText(test).width > mw) { c.fillText(line, x, y); y += 11; line = w; } else line = test; } c.fillText(line, x, y);
}
title();
K.run(update, draw);
</script>
</body>
</html>
