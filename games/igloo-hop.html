<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Igloo Hop</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script>
// Igloo Hop: hop across drifting ice floes. Every white floe you land on adds a block to your igloo. Finish it and get inside before you freeze.
K.theme({ bg: '#061a33', ink: '#eef8ff', accent: '#7ee0ff', accentInk: '#002a3a' });
const W = 240, H = 340, SHORE = 92, ROWY = [140, 190, 240, 290], BLOCKS = 16;
K.screen(W, H);
K.hud(['score', 'level', 'lives']);
K.pad({ dpad: '4', buttons: [] });

let state = 'title', rows, me, blocks, temp, level, score, lives, critters, splashT, inside, best = K.best('igloo'), msg, msgT;
function title() { K.card({ title: 'IGLOO HOP', text: 'Hop up and down onto the drifting ice. Each white floe you land on adds a block to your igloo on the shore. When it is finished, walk in the door. Miss a floe and you take a swim. Watch the temperature!', best: best ? 'BEST ' + best : '', button: 'Bundle up', onStart: start }); }
function start() { level = 1; score = 0; lives = 4; newLevel(); state = 'play'; hud(); }
function newLevel() {
  rows = ROWY.map((y, i) => ({ y, dir: i % 2 ? -1 : 1, sp: (22 + level * 5) * (1 + i * 0.12), blue: false, floes: [0, 1, 2].map(k => ({ x: k * 90 + i * 20, w: Math.max(30, 52 - level * 2) })) }));
  critters = []; if (level >= 2) for (let i = 0; i < Math.min(4, level - 1); i++) critters.push({ row: K.ri(0, 3), x: K.rnd(0, W), sp: K.rnd(18, 30) * (Math.random() < .5 ? -1 : 1), kind: i % 2 ? 'crab' : 'goose' });
  blocks = 0; temp = 45; inside = 0; respawn(); msg = 'LEVEL ' + level; msgT = 1.6;
}
function respawn() { me = { row: -1, x: W / 2, hop: 0, from: 0, face: 1 }; splashT = 0; }
function hud() { K.set('score', score); K.set('level', 'LEVEL ' + level); K.set('lives', '☃'.repeat(Math.max(0, lives))); }
const rowY = r => r < 0 ? SHORE - 14 : ROWY[r];
function onFloe(r, x) { if (r < 0) return true; for (const f of rows[r].floes) { const fx = ((f.x % (W + 60)) + W + 60) % (W + 60) - 30; if (x > fx - 2 && x < fx + f.w + 2) return true; } return false; }

function update(dt) {
  if (state !== 'play') return;
  if (msgT > 0) msgT -= dt;
  if (inside > 0) { inside -= dt; if (Math.floor(temp) > 0 && Math.random() < 0.6) { temp -= 1; score += 15; hud(); K.beep(900, 0.03, { vol: 0.03 }); } if (inside <= 0) { level++; hud(); newLevel(); } return; }
  temp -= dt * 0.9; if (temp <= 0) return lose('FROZEN!');
  for (const r of rows) for (const f of r.floes) f.x += r.dir * r.sp * dt;
  for (const cr of critters) { cr.x += cr.sp * dt; if (cr.x < -10) cr.x = W + 10; if (cr.x > W + 10) cr.x = -10; }
  if (splashT > 0) { splashT -= dt; if (splashT <= 0) lose('SPLASH!'); return; }
  if (me.hop > 0) { me.hop -= dt * 5; if (me.hop <= 0) land(); return; }
  // ride the floe
  if (me.row >= 0) { me.x += rows[me.row].dir * rows[me.row].sp * dt; if (me.x < 6 || me.x > W - 6) return sink(); }
  const ax = (K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0);
  me.x = K.clamp(me.x + ax * 70 * dt, 6, W - 6); if (ax) me.face = ax;
  let up = K.hit('up'), dn = K.hit('down');
  if (K.ptr.tapped) { if (K.ptr.y < rowY(me.row) - 14) up = true; else if (K.ptr.y > rowY(me.row) + 14) dn = true; else me.x = K.clamp(K.ptr.x, 6, W - 6); }
  if (up && me.row >= 0) { me.from = me.row; me.row--; me.hop = 1; K.beep(600, 0.06, { vol: 0.04 }); }
  else if (dn && me.row < 3) { me.from = me.row; me.row++; me.hop = 1; K.beep(500, 0.06, { vol: 0.04 }); }
  else if (up && me.row < 0 && blocks >= BLOCKS && Math.abs(me.x - 196) < 16) { inside = 2.2; score += 200 * level; hud(); K.tune([523, 659, 784, 1047, 1319], 0.1); }
  // critters push you off
  if (me.row >= 0) for (const cr of critters) if (cr.row === me.row && Math.abs(cr.x - me.x) < 10) { me.x += Math.sign(cr.sp) * 60 * dt; }
}
function land() {
  me.hop = 0;
  if (!onFloe(me.row, me.x)) return sink();
  if (me.row >= 0) {
    const r = rows[me.row];
    if (!r.blue) { r.blue = true; if (blocks < BLOCKS) { blocks++; score += 10; hud(); K.beep(700 + blocks * 30, 0.08, { type: 'triangle', vol: 0.05 }); } }
    if (rows.every(r => r.blue)) rows.forEach(r => r.blue = false);
  }
}
function sink() { splashT = 0.8; K.noise(0.4, 0.3); }
function lose(t) {
  lives--; hud(); msg = t; msgT = 1.4; K.beep(200, 0.4, { type: 'sawtooth', to: 80, vol: 0.06 });
  if (lives <= 0) { state = 'over'; best = K.saveBest('igloo', score); setTimeout(() => K.card({ title: 'BRRR...', text: 'You reached level ' + level + ' with ' + score + ' points.', best: 'BEST ' + best, button: 'Try again', onStart: start }), 900); return; }
  temp = Math.max(temp, 30); respawn();
}

function draw(c, t) {
  const g = c.createLinearGradient(0, 0, 0, SHORE); g.addColorStop(0, '#0d2a5a'); g.addColorStop(1, '#5a7ab8'); c.fillStyle = g; c.fillRect(0, 0, W, SHORE);
  c.fillStyle = 'rgba(126,255,180,.25)'; for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(0, 20 + i * 8); for (let x = 0; x <= W; x += 10) c.lineTo(x, 20 + i * 8 + Math.sin(x / 30 + t / 900 + i) * 6); c.lineTo(W, 0); c.lineTo(0, 0); c.fill(); }
  c.fillStyle = '#eef6ff'; c.fillRect(0, SHORE - 8, W, 14); c.fillStyle = '#c8daf0'; c.fillRect(0, SHORE + 4, W, 3);
  c.fillStyle = '#0b3a6a'; c.fillRect(0, SHORE + 7, W, H - SHORE - 7);
  c.fillStyle = 'rgba(255,255,255,.08)'; for (let y = SHORE + 20; y < H; y += 12) c.fillRect(((y * 7 + t / 20) % W), y, 20, 1);
  if (!rows) return;
  // igloo
  const ix = 180, iy = SHORE - 8;
  for (let b = 0; b < BLOCKS; b++) { const row = Math.floor(b / 4), col = b % 4, w = 30 - row * 6; c.fillStyle = b < blocks ? '#f4fbff' : 'rgba(255,255,255,.12)'; c.fillRect(ix + (36 - w) / 2 + col * (w / 4), iy - 8 - row * 8, w / 4 - 1, 7); }
  if (blocks >= BLOCKS) { c.fillStyle = '#16304a'; c.fillRect(ix + 12, iy - 12, 10, 12); if (Math.floor(t / 300) % 2) K.text(c, '▲ IN', ix + 17, iy - 44, 8, '#7ee0ff'); }
  for (const r of rows) for (const f of r.floes) {
    const fx = ((f.x % (W + 60)) + W + 60) % (W + 60) - 30;
    c.fillStyle = r.blue ? '#4aa8e8' : '#f4fbff'; for (let k = 0; k < f.w; k += 12) c.fillRect(fx + k, r.y - 4, Math.min(10, f.w - k), 9);
    c.fillStyle = r.blue ? '#2a78b8' : '#b8d4ee'; for (let k = 0; k < f.w; k += 12) c.fillRect(fx + k, r.y + 4, Math.min(10, f.w - k), 2);
  }
  for (const cr of critters) { const x = Math.round(cr.x), y = ROWY[cr.row] - 8; if (cr.kind === 'crab') { c.fillStyle = '#ff5a36'; c.fillRect(x - 5, y, 10, 5); c.fillRect(x - 8, y - 2, 3, 3); c.fillRect(x + 5, y - 2, 3, 3); } else { c.fillStyle = '#ddd'; c.fillRect(x - 5, y - 2, 10, 6); c.fillStyle = '#333'; c.fillRect(x + (cr.sp > 0 ? 4 : -7), y - 6, 3, 6); c.fillStyle = '#ffb02e'; c.fillRect(x + (cr.sp > 0 ? 7 : -9), y - 5, 2, 1); } }
  // player
  if (inside <= 0 && splashT <= 0) {
    const ya = rowY(me.from), yb = rowY(me.row), k = me.hop > 0 ? 1 - me.hop : 1, y = Math.round(ya + (yb - ya) * k - Math.sin(k * Math.PI) * 14 * (me.hop > 0 ? 1 : 0));
    const x = Math.round(me.x);
    c.fillStyle = '#c0504a'; c.fillRect(x - 5, y - 14, 10, 10); c.fillStyle = '#7a4a2a'; c.fillRect(x - 6, y - 21, 12, 8); c.fillStyle = '#ffcf9e'; c.fillRect(x - 3, y - 19, 6, 5);
    c.fillStyle = '#000'; c.fillRect(x + (me.face > 0 ? 1 : -2), y - 18, 1, 1);
    c.fillStyle = '#3a3a4a'; c.fillRect(x - 5, y - 4, 4, 4); c.fillRect(x + 1, y - 4, 4, 4);
  }
  if (splashT > 0) { c.fillStyle = '#c8e8ff'; for (let i = 0; i < 6; i++) c.fillRect(me.x - 10 + i * 4, rowY(me.row) - (0.8 - splashT) * 30 * Math.sin(i), 2, 4); }
  // thermometer
  c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(10, 8, 70, 10); c.fillStyle = temp < 12 ? '#ff4f6d' : '#7ee0ff'; c.fillRect(11, 9, 68 * Math.max(0, temp) / 45, 8);
  K.text(c, Math.max(0, Math.ceil(temp)) + '°', 96, 13, 9, '#fff');
  if (msgT > 0) K.text(c, msg, W / 2, 116, 14, '#fff');
}
title();
K.run(update, draw);
</script>
</body>
</html>
