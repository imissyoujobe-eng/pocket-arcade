<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bug Bloom</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600&display=swap">
<style>
/* Layout: one portrait arcade screen; HUD strip above, touch zones on the canvas (left drag = move, right hold = action) */
:root{--bg:#060a14;--panel:#111a2e;--ink:#eaf0ff;--dim:#8f9bbd;--acc:#ff3d52;--acc2:#4fe36b;--display:'Bungee',Impact,system-ui,sans-serif;--body:'Rubik',system-ui,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding-inline:16px;padding-block:6px;box-sizing:border-box}
#hud{width:min(100%,440px);display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--display);font-size:clamp(14px,4.4vw,19px);font-variant-numeric:tabular-nums}

#hud .c{text-align:center}#hud .r{text-align:right}
#hud .btns{display:flex;gap:6px}
.ib{font:600 12px var(--body);letter-spacing:.06em;color:var(--ink);background:var(--panel);border:1px solid #26314f;border-radius:8px;padding:6px 8px;cursor:pointer}
#stage{position:relative;width:min(100%,440px,calc((100vh - 90px) * 2 / 3));width:min(100%,440px,calc((100dvh - 90px) * 2 / 3));aspect-ratio:2/3}
canvas{width:100%;height:100%;display:block;border-radius:10px;box-shadow:0 0 0 2px #1a2440,0 0 40px -10px var(--acc)}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:rgba(6,10,20,.84);border-radius:10px;padding-inline:20px;backdrop-filter:blur(2px)}
#overlay h1{font-family:var(--display);font-size:clamp(34px,11vw,58px);line-height:1;margin:0;color:var(--acc);text-shadow:0 0 22px var(--acc),3px 3px 0 var(--acc2);text-wrap:balance}
#overlay p{margin:0;max-width:30ch;line-height:1.5}
#overlay .how{font-size:12px;color:var(--dim);max-width:34ch}
#overlay .best{font-family:var(--display);font-size:14px;color:var(--acc2)}
#go{font-family:var(--display);font-size:20px;padding:12px 34px;border:0;border-radius:999px;background:var(--acc);color:#06101a;box-shadow:0 5px 0 rgba(0,0,0,.45);cursor:pointer}
button:active{transform:translateY(2px)}button:focus-visible{outline:3px solid var(--acc2);outline-offset:3px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){canvas{box-shadow:0 0 0 2px #1a2440}}

<div id="app">
  <div id="hud"><div><span class="lbl" id="l1">SCORE</span><span id="h1">0</span></div><div class="c"><span class="lbl" id="l2">WORD</span><span id="h2"></span></div><div class="r"><span class="lbl" id="l3">LIVES</span><span id="h3"></span></div><div class="btns"><button class="ib" id="pz" aria-label="Pause">II</button><button class="ib" id="mu" aria-label="Sound on or off">SND</button></div></div>
  <div id="stage"><canvas id="c" width="400" height="600"></canvas>
    <div id="overlay"><h1>Bug Bloom</h1><p id="msg">Munch every seed in the garden maze. Spin the green gates to block the beetles and spell BLOOM with the petal letters.</p><p class="how">Drag anywhere to walk. Walk into a gate to spin it. Avoid the red thorns, and lure beetles into them. Keys: arrows.</p><p class="best" id="bestline"></p><button id="go">Play</button></div>
  </div>
</div>
<script src="../lib/art.js"></script>
<script>
const GAME_ID='bug-bloom';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const W=cv.width,H=cv.height,TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,dist=(a,b,c,d)=>Math.hypot(c-a,d-b);
let AC,muted=false;
try{muted=localStorage.getItem('arcade_muted')==='1'}catch(e){}
function setMuteLabel(){$('mu').textContent=muted?'MUTE':'SND'}setMuteLabel();
$('mu').onclick=()=>{muted=!muted;setMuteLabel();try{localStorage.setItem('arcade_muted',muted?'1':'0')}catch(e){}};
function beep(f,d,v=.05,type='square',slide){if(!AC||muted)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d,v=.08,f=800){if(!AC||muted)return;try{const t=AC.currentTime,n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;fl.type='lowpass';fl.frequency.value=f;g.gain.value=v;s.connect(fl).connect(g).connect(AC.destination);s.start(t)}catch(e){}}
function jingle(notes,step=.09,type='square',v=.05){notes.forEach((n,i)=>setTimeout(()=>beep(n,step*1.4,v,type),i*step*1000))}
const keys={};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(state!=='play'&&k==='enter')startGame();if(k==='p'&&(state==='play'||state==='paused'))togglePause()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
let joy=null,fireId=null;const coarse=matchMedia('(pointer:coarse)').matches;
function cpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{const p=cpos(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}if((p.x<W*.55||!ACTION_LABEL)&&!joy)joy={id:e.pointerId,x0:p.x,y0:p.y,x:p.x,y:p.y};else{fireId=e.pointerId;tapPt=p}e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(joy&&e.pointerId===joy.id){const p=cpos(e);joy.x=p.x;joy.y=p.y;const dx=joy.x-joy.x0,dy=joy.y-joy.y0,m=Math.hypot(dx,dy);if(m>55){joy.x0=joy.x-dx/m*55;joy.y0=joy.y-dy/m*55}}});
function up(e){if(joy&&e.pointerId===joy.id)joy=null;if(e.pointerId===fireId)fireId=null}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
let tapPt=null;const inp={x:0,y:0,fire:false,fireTap:false,up:false,upTap:false};let prevFire=false,prevUp=false;
function readInput(){let x=0,y=0;if(keys.arrowleft||keys.a)x--;if(keys.arrowright||keys.d)x++;if(keys.arrowup||keys.w)y--;if(keys.arrowdown||keys.s)y++;
 if(joy){const dx=joy.x-joy.x0,dy=joy.y-joy.y0,m=Math.hypot(dx,dy);if(m>7){const k=Math.min(1,m/38);x=dx/m*k;y=dy/m*k}}
 const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}inp.x=x;inp.y=y;const f=fireId!=null||!!keys[' ']||!!keys.k||!!keys.j;inp.fireTap=f&&!prevFire;inp.fire=f;prevFire=f}
function drawJoy(){if(!joy&&!coarse)return;ctx.save();if(joy){ctx.globalAlpha=.3;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(joy.x0,joy.y0,42,0,TAU);ctx.stroke();ctx.fillStyle='#fff';const dx=joy.x-joy.x0,dy=joy.y-joy.y0,m=Math.hypot(dx,dy),k=m>42?42/m:1;ctx.beginPath();ctx.arc(joy.x0+dx*k,joy.y0+dy*k,17,0,TAU);ctx.fill()}
 if(coarse&&state==='play'&&ACTION_LABEL){ctx.globalAlpha=fireId!=null?.35:.14;ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--acc')||'#fff';ctx.beginPath();ctx.arc(W-58,H-62,34,0,TAU);ctx.fill();ctx.globalAlpha=.6;ctx.fillStyle='#fff';ctx.font='12px Rubik, sans-serif';ctx.textAlign='center';ctx.fillText(ACTION_LABEL,W-58,H-58)}ctx.restore()}
let ACTION_LABEL='FIRE';
/* juice: particles, floating text, screen shake */
let parts=[],floats=[],shake=0,flash=0,flashCol='#fff';
function burst(x,y,col,n=18,sp=160,life=.7,size=3){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life*rnd(.5,1),L:life,c:Array.isArray(col)?col[i%col.length]:col,s:size*rnd(.6,1.3)})}}
function floatText(x,y,t,col='#fff'){floats.push({x,y,t,c:col,l:1})}
function kick(s){shake=Math.max(shake,s)}
function updFx(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.2,dt);p.vy*=Math.pow(.2,dt);p.vy+=(p.g||0)*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);for(const f of floats){f.y-=40*dt;f.l-=dt}floats=floats.filter(f=>f.l>0);shake=Math.max(0,shake-dt*30);flash=Math.max(0,flash-dt*3)}
function drawFx(){for(const p of parts){ctx.globalAlpha=Math.max(0,p.l/p.L);ctx.fillStyle=p.c;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}ctx.globalAlpha=1;ctx.textAlign='center';ctx.font='14px Bungee, Impact, sans-serif';for(const f of floats){ctx.globalAlpha=Math.min(1,f.l*2);ctx.fillStyle='#000';ctx.fillText(f.t,f.x+1.5,f.y+1.5);ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y)}ctx.globalAlpha=1;if(flash>0){ctx.globalAlpha=flash*.5;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}}
let banner=null;function showBanner(t,sub='',dur=1.6){banner={t,sub,l:dur,L:dur}}
function drawBanner(dt){if(!banner)return;banner.l-=dt;if(banner.l<=0){banner=null;return}const a=Math.min(1,banner.l*3,(banner.L-banner.l)*6);ctx.save();ctx.globalAlpha=a;ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,H/2-46,W,banner.sub?84:64);ctx.textAlign='center';ctx.font='30px Bungee, Impact, sans-serif';ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--acc');ctx.fillText(banner.t,W/2,H/2-4);if(banner.sub){ctx.font='14px Rubik, sans-serif';ctx.fillStyle='#fff';ctx.fillText(banner.sub,W/2,H/2+24)}ctx.restore()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
let state='menu',score=0,best=0;
try{best=+localStorage.getItem('best_'+GAME_ID)||0}catch(e){}
function showBest(){$('bestline').textContent=best?'BEST '+best:''}showBest();
function saveBest(){if(score>best){best=score;try{localStorage.setItem('best_'+GAME_ID,best)}catch(e){}return true}return false}
function startGame(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();$('overlay').hidden=true;try{document.activeElement.blur()}catch(e){}parts=[];floats=[];banner=null;state='play';reset();jingle([523,659,784,1047],.07)}
$('go').onclick=startGame;
function gameOver(msg,useBest=true){if(state!=='play')return;state='over';let nb=false;if(useBest)nb=saveBest();$('msg').textContent=msg+(nb?' New best!':'');showBest();$('go').textContent='Play again';jingle([392,330,262,196],.14,'triangle',.06);setTimeout(()=>{$('overlay').hidden=false},1100)}
function togglePause(){if(state==='play'){state='paused';$('pz').textContent='▶'}else if(state==='paused'){state='play';$('pz').textContent='II';last=performance.now()}}
$('pz').onclick=togglePause;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause()});
let last=performance.now(),T=0;
function frame(t){const dt=Math.min(.033,(t-last)/1000);last=t;readInput();if(state==='play'){T+=dt;update(dt);updFx(dt)}else if(state==='over'||state==='menu')updFx(dt);
 ctx.save();if(shake>0)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));draw(state==='play'?dt:0);drawFx();ctx.restore();drawBanner(state==='play'?dt:0);drawJoy();
 if(state==='paused'){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='32px Bungee, Impact, sans-serif';ctx.fillText('PAUSED',W/2,H/2);ctx.font='13px Rubik, sans-serif';ctx.fillText('Tap ▶ to keep playing',W/2,H/2+28)}
 requestAnimationFrame(frame)}
</script>
<script>
// BUG BLOOM — maze chase. Munch every seed, spin the green gates to wall off the beetles, and spell BLOOM with the petal letters.
const CS=34,GC=11,GR=13,X0=13,Y0=14,DIRS=[[0,-1],[1,0],[0,1],[-1,0]],BIT=[1,2,4,8],CC=5,CR=6,WORD='BLOOM';
let open,gates,dots,dotsLeft,pl,ens,lives,level,deadT,releaseT,releaseEvery,letters,word,thorns,veg,freezeT,combo;
ACTION_LABEL='';
function reset(){score=0;lives=3;level=1;word=0;newLevel();hud()}
function hud(){$('h1').textContent=score;$('h2').textContent=WORD.split('').map((c,i)=>i<word?c:'·').join('');$('h3').textContent='◆'.repeat(Math.max(0,lives))||'–'}
function genMaze(){open=Array.from({length:GR},()=>new Array(GC).fill(0));const seen=Array.from({length:GR},()=>new Array(GC).fill(false));const st=[[0,0]];seen[0][0]=true;
 while(st.length){const [c,r]=st[st.length-1],nb=[];for(let d=0;d<4;d++){const nc=c+DIRS[d][0],nr=r+DIRS[d][1];if(nc>=0&&nr>=0&&nc<GC&&nr<GR&&!seen[nr][nc])nb.push(d)}
  if(!nb.length){st.pop();continue}const d=nb[Math.floor(Math.random()*nb.length)],nc=c+DIRS[d][0],nr=r+DIRS[d][1];open[r][c]|=BIT[d];open[nr][nc]|=BIT[(d+2)%4];seen[nr][nc]=true;st.push([nc,nr])}
 for(let i=0;i<GC*GR*1.6;i++){const c=Math.floor(Math.random()*GC),r=Math.floor(Math.random()*GR),d=Math.floor(Math.random()*4),nc=c+DIRS[d][0],nr=r+DIRS[d][1];if(nc>=0&&nr>=0&&nc<GC&&nr<GR){open[r][c]|=BIT[d];open[nr][nc]|=BIT[(d+2)%4]}}
 // the beetle nest in the middle opens only upward
 open[CR][CC]=1;open[CR-1][CC]|=4;for(const [c,r,d] of[[CC-1,CR,1],[CC+1,CR,3],[CC,CR+1,0]]){open[r][c]&=~BIT[d]}}
function wallOpen(c,r,d){return!!(open[r]&&open[r][c]&BIT[d])}
function gateAt(gx,gy){return gates.find(g=>g.x===gx&&g.y===gy)}
function gateBlocking(c,r,d){const L=d===1?[[c+1,r],[c+1,r+1]]:d===3?[[c,r],[c,r+1]]:d===2?[[c,r+1],[c+1,r+1]]:[[c,r],[c+1,r]];const vert=d===1||d===3;
 for(const [x,y] of L){const g=gateAt(x,y);if(!g)continue;
  // a vertical gate at (x,y) covers the vertical edges of rows y-1 and y; horizontal covers horizontal edges of columns x-1 and x
  if(vert&&g.v)return g;if(!vert&&!g.v)return g}return null}
function can(c,r,d,isPlayer){if(!wallOpen(c,r,d))return false;return!gateBlocking(c,r,d)}
let lvlDone=false;
function newLevel(){lvlDone=false;genMaze();gates=[];const tries=200;for(let i=0;i<tries&&gates.length<10+Math.min(4,level);i++){const gx=1+Math.floor(Math.random()*(GC-1)),gy=1+Math.floor(Math.random()*(GR-1));
  if(gates.some(g=>Math.abs(g.x-gx)+Math.abs(g.y-gy)<3))continue;if(Math.abs(gx-CC-.5)<2&&Math.abs(gy-CR-.5)<2)continue;
  // all four arms must sit on open passages
  const ok=wallOpen(gx-1,gy-1,1)&&wallOpen(gx-1,gy,1)&&wallOpen(gx-1,gy-1,2)&&wallOpen(gx,gy-1,2);if(!ok)continue;gates.push({x:gx,y:gy,v:Math.random()<.5,rot:0})}
 dots=Array.from({length:GR},()=>new Array(GC).fill(1));dots[CR][CC]=0;dots[GR-1][CC]=0;dotsLeft=GC*GR-2;
 letters=[];thorns=[];const free=()=>{let c,r;do{c=Math.floor(Math.random()*GC);r=Math.floor(Math.random()*GR)}while((c===CC&&(r===CR||r===GR-1))||letters.some(l=>l.c===c&&l.r===r)||thorns.some(l=>l.c===c&&l.r===r));return[c,r]};
 for(let i=0;i<3;i++){const [c,r]=free();letters.push({c,r,t:Math.random()*3});dots[r][c]=0;dotsLeft--}
 for(let i=0;i<Math.min(4,1+Math.floor(level/2));i++){const [c,r]=free();if(Math.abs(c-CC)+Math.abs(r-(GR-1))<3){i--;continue}thorns.push({c,r});if(dots[r][c]){dots[r][c]=0;dotsLeft--}}
 ens=[];releaseEvery=Math.max(4,9-level*.6);releaseT=releaseEvery*.5;veg=null;freezeT=0;combo=0;resetPos();showBanner('GARDEN '+level,'Eat every seed',1.3)}
function resetPos(){pl={c:CC,r:GR-1,d:1,p:0,moving:false,face:1,inv:1.5};for(const e of ens){e.c=CC;e.r=CR;e.p=0;e.d=0;e.out=false;e.wait=rnd(.5,2)}deadT=0}
function step(c,r,d){return[c+DIRS[d][0],r+DIRS[d][1]]}
function pos(e){const [dx,dy]=DIRS[e.d];return{x:X0+(e.c+dx*e.p+.5)*CS,y:Y0+(e.r+dy*e.p+.5)*CS}}
function bfsDir(e,tc,tr){const prev=new Map(),q=[[tc,tr]],k=(c,r)=>r*GC+c;prev.set(k(tc,tr),-1);while(q.length){const [c,r]=q.shift();if(c===e.c&&r===e.r)break;
 for(let d=0;d<4;d++){if(!can(c,r,d))continue;const [nc,nr]=step(c,r,d);const kk=k(nc,nr);if(!prev.has(kk)){prev.set(kk,(d+2)%4);q.push([nc,nr])}}}return prev.has(k(e.c,e.r))?prev.get(k(e.c,e.r)):-1}
function killPlayer(){if(deadT>0)return;lives--;deadT=2;const q=pos(pl);burst(q.x,q.y,['#ff3d52','#111','#fff'],36,200,1,4);kick(8);noise(.5,.1,1400);jingle([523,440,349,262],.12,'triangle',.06);showBanner('SQUASHED!',lives>0?'Lives left: '+lives:'',1.5);hud()}
function eat(c,r){if(dots[r]&&dots[r][c]){dots[r][c]=0;dotsLeft--;score+=10;if(Math.random()<.5)beep(660+((c+r)%3)*110,.04,.03,'triangle');hud()}
 const li=letters.findIndex(l=>l.c===c&&l.r===r);if(li>=0){const l=letters[li],col=Math.floor(l.t)%3,pts=[300,500,800][col]*level;score+=pts;const q={x:X0+(c+.5)*CS,y:Y0+(r+.5)*CS};floatText(q.x,q.y-12,WORD[word]+' +'+pts,['#ff3d52','#ffd23f','#4fa3ff'][col]);letters.splice(li,1);word++;jingle([784,988,1175],.06);
  if(word>=WORD.length){word=0;score+=3000;if(lives<6)lives++;showBanner('BLOOM!','+3000 and an extra life',2);jingle([523,659,784,1047,1319,1568],.09)}hud()}
 if(thorns.some(t=>t.c===c&&t.r===r)&&pl.inv<=0){killPlayer();return}
 if(veg&&veg.c===c&&veg.r===r){const pts=1000*level;score+=pts;floatText(X0+(c+.5)*CS,Y0+(r+.5)*CS-12,'+'+pts,'#7cffb2');veg=null;freezeT=5;showBanner('BEETLES FROZEN','5 seconds',1);jingle([1047,1319,1568],.06);hud()}
 if(dotsLeft<=0&&!lvlDone){lvlDone=true;score+=1000*level;level++;jingle([523,659,784,1047,784,1047,1319],.09);setTimeout(()=>{if(state==='play'){newLevel();hud()}},400)}}
function update(dt){for(const l of letters)l.t+=dt/1.2;for(const g of gates)g.rot=Math.max(0,g.rot-dt*6);
 if(deadT>0){deadT-=dt;if(deadT<=0){if(lives<=0){gameOver('The beetles win. Score '+score+'.');return}resetPos()}return}
 pl.inv-=dt;freezeT=Math.max(0,freezeT-dt);
 const want=Math.abs(inp.x)>Math.abs(inp.y)?(inp.x>.3?1:inp.x<-.3?3:-1):(inp.y>.3?2:inp.y<-.3?0:-1);
