<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Knockout Kid</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script>
// Knockout Kid: work your way up a ladder of five boxers. Read their tells, dodge, then punch through the opening.
// The fighters are drawn as shaded, muscular boxers (you from behind, them facing you). They hit back: punch into a
// guard and they counter, land a combo and they chain punches of their own. A knockout drops them face-first at your feet.
K.theme({ bg: '#120a14', ink: '#fff4f0', accent: '#ff3b5c', accentInk: '#fff' });
// tall portrait view: the 256-wide ring scene is drawn 1.12x bigger, centred, with extra crowd above it and HUD on top
let W = 240; const H = 330, SW = 256, SC = 1.12, OY = 56;
K.screen(W, H);
K.flex(240, H, w => { W = w; }, { maxW: 760 }); // phone on its side: the whole arena around the ring
K.hud(['me', 'round', 'foe']);
K.pad({ dpad: '4', buttons: [{ id: 'b', label: 'LEFT' }, { id: 'a', label: 'RIGHT' }, { id: 'c', label: 'UPPER' }, { id: 'd', label: 'BODY' }] });
// keyboard: C or U = uppercut, V or I = body hook (X and Z / Space are the left and right punches)
addEventListener('keydown', e => { if (e.repeat) return; if (e.key === 'c' || e.key === 'C' || e.key === 'u' || e.key === 'U') K.press('c'); else if (e.key === 'v' || e.key === 'V' || e.key === 'i' || e.key === 'I') K.press('d'); });
addEventListener('keyup', e => { if (e.key === 'c' || e.key === 'C' || e.key === 'u' || e.key === 'U') K.release('c'); else if (e.key === 'v' || e.key === 'V' || e.key === 'i' || e.key === 'I') K.release('d'); });

// look: skin, trunks, trim, hair color and style (hs), face extras, bulk (how big and muscled)
// fight: speed, tell (wind-up time), moves, guard, hp, dmg (how hard he hits), counter (fires back into your punches), chain (combos)
const FOES = [
  { n: 'GUS GUMBO', skin: '#e2a878', trunks: '#2f9e44', trim: '#ffd23f', hair: '#3a2a1a', hs: 'flat', face: 'stache', bulk: 1.0, speed: 1.05, tell: 0.75, moves: ['jab', 'hookR', 'jab', 'hookL'], guard: 0.45, hp: 160, dmg: 1.25, counter: 0.3, chain: 0.15 },
  { n: 'LADY LUMBER', skin: '#f0c49c', trunks: '#c8402c', trim: '#ffffff', hair: '#e8a040', hs: 'pony', face: 'lady', bulk: 0.9, speed: 1.15, tell: 0.65, moves: ['hookL', 'hookR', 'jab', 'hookL'], guard: 0.5, hp: 180, dmg: 1.35, counter: 0.38, chain: 0.25 },
  { n: 'BARON BLITZ', skin: '#f2d2b8', trunks: '#2a6fdb', trim: '#f2f2f2', hair: '#e8e8ec', hs: 'slick', face: 'goatee', bulk: 0.95, speed: 1.35, tell: 0.5, moves: ['jab', 'flurry', 'hookR', 'jab'], guard: 0.55, hp: 200, dmg: 1.45, counter: 0.45, chain: 0.3 },
  { n: 'MIGHTY MO', skin: '#8a5a38', trunks: '#8a4ad8', trim: '#ffd23f', hair: '#1a1a1a', hs: 'bald', face: 'beard', bulk: 1.18, speed: 1.15, tell: 0.55, moves: ['upper', 'hookL', 'upper', 'hookR', 'jab'], guard: 0.6, hp: 235, dmg: 1.75, counter: 0.45, chain: 0.3 },
  { n: 'IRON IVAN', skin: '#dcaa88', trunks: '#ffd23f', trim: '#c8102e', hair: '#8a4a2a', hs: 'buzz', face: 'scar', bulk: 1.12, speed: 1.4, tell: 0.42, moves: ['jab', 'hookL', 'upper', 'flurry', 'hookR'], guard: 0.65, hp: 270, dmg: 1.85, counter: 0.55, chain: 0.4 }
];
const ME = { skin: '#d9a07a', hair: '#2a1a10', trunks: '#2f9e44', trim: '#ffffff', glove: '#2f9e44' };
const MV = { jab: { dmg: 8, need: 'any', dur: 0.25 }, hookL: { dmg: 14, need: 'right', dur: 0.35 }, hookR: { dmg: 14, need: 'left', dur: 0.35 }, upper: { dmg: 20, need: 'duck', dur: 0.4 }, flurry: { dmg: 5, need: 'any', dur: 0.9 } };
let fx = [], dust = [], state = 'title', fi, foe, me, round, clock, msg, msgT, between, shake = 0, wins = K.best('knockout');
function title() { K.card({ title: 'KNOCKOUT KID', text: 'Watch your opponent: when they flash and wind up, WEAVE your head with ◀ or ▶, or DUCK with ▼ for uppercuts. Right after a miss they are wide open, so punch with LEFT and RIGHT! Hold ▲ while punching to aim at the head. UPPER is an uppercut to the chin (it beats a high guard) and BODY loops a hook around to his ribs (it beats a low guard). These fighters hit back: punch into their guard and they counter, and the tough ones throw combos. Land counters to earn stars, then ▲ + RIGHT throws a star punch.', best: wins ? 'FURTHEST: FIGHT ' + wins : '', button: 'Step into the ring', onStart: () => { fi = 0; fight(); } }); }
function fight() { const F = FOES[fi]; foe = { F, hp: F.hp, st: 'idle', t: 1.2, mv: null, guard: 'head', down: 0, downT: 0, knocks: 0, hit: 0, hitDir: 1, sway: 0, koT: 0, thud: false }; me = { hp: 100, st: 'idle', t: 0, stars: 0, punch: null, hit: 0 }; round = 1; clock = 90; fx = []; dust = []; between = 0; shake = 0; msg = F.n; msgT = 1.8; state = 'play'; hud(); K.tune([392, 523, 659], 0.12); }
function hud() { K.set('me', 'YOU ' + Math.max(0, Math.ceil(me.hp))); K.set('round', 'R' + round + ' ' + Math.ceil(clock)); K.set('foe', foe.F.n.split(' ')[0] + ' ' + Math.max(0, Math.ceil(foe.hp))); }

function update(dt) {
  if (shake > 0) shake -= dt;
  for (const d of dust) { d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 30 * dt; d.l -= dt; } dust = dust.filter(d => d.l > 0);
  if (foe && foe.st === 'ko') { koStep(dt); return; }
  if (state !== 'play') return;
  if (msgT > 0) { msgT -= dt; if (msgT > 1.2) return; }
  for (const f of fx) f.l -= dt; fx = fx.filter(f => f.l > 0);
  if (between > 0) { between -= dt; if (between <= 0) { round++; clock = 90; me.hp = Math.min(100, me.hp + 30); foe.hp = Math.min(foe.F.hp, foe.hp + 25); foe.knocks = Math.max(0, foe.knocks - 1); msg = 'ROUND ' + round; msgT = 1.5; } return; }
  clock -= dt; if (Math.floor(clock) !== Math.floor(clock + dt)) hud();
  if (clock <= 0) { if (round >= 3) return decision(); between = 2; msg = 'END OF ROUND ' + round; msgT = 2; return; }
  // knockdowns: he takes a knee for the count, then gets up with a good chunk of health back
  if (foe.down > 0) { foe.down -= dt; foe.downT += dt; if (foe.down <= 0) { foe.hp = Math.max(foe.hp, foe.F.hp * (0.65 - foe.knocks * 0.12)); foe.st = 'idle'; foe.t = 0.8; msg = 'HE\'S UP!'; msgT = 1; hud(); } return; }
  if (me.st === 'down') { me.t -= dt; if (K.hit('a') || K.hit('b') || K.hit('c') || K.hit('d') || K.ptr.tapped) { me.mash = (me.mash || 0) + 1; K.beep(300 + me.mash * 20, 0.04, { vol: 0.04 }); } if (me.mash >= 12 + me.knocks * 4) { me.st = 'idle'; me.hp = 40 - me.knocks * 8; me.mash = 0; msg = 'BACK ON YOUR FEET!'; msgT = 1; hud(); } else if (me.t <= 0) return defeat(); return; }
  // player actions
  if (me.t > 0) me.t -= dt; else me.st = 'idle';
  if (me.hit > 0) me.hit -= dt;
  if (me.st === 'idle') {
    if (K.hit('left')) { me.st = 'dodgeL'; me.t = 0.42; }
    else if (K.hit('right')) { me.st = 'dodgeR'; me.t = 0.42; }
    else if (K.hit('down')) { me.st = 'duck'; me.t = 0.45; }
    else if (K.hit('c') || K.hit('d')) {
      // uppercut (up the middle to the chin) or body hook (looping around to the ribs): slower than a straight punch, but they hit harder
      const kind = K.hit('c') ? 'upper' : 'hook'; me.alt = !me.alt;
      me.st = 'punch'; me.t = me.pdur = kind === 'upper' ? 0.38 : 0.36; me.punch = { side: me.alt ? 'R' : 'L', high: kind === 'upper', star: false, kind };
      landPunch(me.punch);
    }
    else if (K.hit('a') || K.hit('b')) {
      const star = K.down('up') && K.hit('a') && me.stars > 0;
      me.st = 'punch'; me.t = me.pdur = star ? 0.45 : 0.22; me.punch = { side: K.hit('a') ? 'R' : 'L', high: K.down('up'), star, kind: 'straight' };
      if (star) me.stars--;
      landPunch(me.punch);
    }
  }
  // opponent AI
  const F = foe.F; foe.sway += dt * 2; if (foe.hit > 0) foe.hit -= dt;
  foe.t -= dt * F.speed;
  if (foe.st === 'idle' && foe.t <= 0) { foe.mv = F.moves[K.ri(0, F.moves.length - 1)]; foe.st = 'tell'; foe.t = F.tell * (foe.mv === 'jab' ? 0.7 : 1); K.beep(foe.mv === 'upper' ? 160 : 520, 0.06, { vol: 0.04 }); }
  else if (foe.st === 'tell' && foe.t <= 0) { foe.st = 'attack'; foe.t = MV[foe.mv].dur; foe.hits = foe.mv === 'flurry' ? 3 : 1; foe.ht = 0; }
  else if (foe.st === 'attack') {
    foe.ht -= dt;
    if (foe.ht <= 0 && foe.hits > 0) {
      foe.hits--; foe.ht = 0.28;
      const need = MV[foe.mv].need, dodged = need === 'any' ? (me.st === 'dodgeL' || me.st === 'dodgeR' || me.st === 'duck') : need === 'duck' ? me.st === 'duck' : need === 'left' ? me.st === 'dodgeL' : me.st === 'dodgeR';
      if (dodged) { fx.push({ t: 'MISS', l: 0.5 }); K.beep(900, 0.05, { vol: 0.03 }); if (foe.hits === 0) { foe.st = 'open'; foe.t = 0.85; } }
      else { const d = MV[foe.mv].dmg * F.dmg; me.hp -= d; me.hit = 0.3; shake = 0.18; K.noise(0.12, 0.25); K.beep(140, 0.12, { type: 'square', vol: 0.06 }); hud(); fx.push({ t: 'POW', l: 0.4, x: 128, y: 150 }); if (me.hp <= 0) { me.st = 'down'; me.t = 4; me.knocks = (me.knocks || 0) + 1; me.mash = 0; msg = 'DOWN! MASH TO GET UP!'; msgT = 2; if (me.knocks >= 3) return defeat(); } }
    }
    // a landed attack can roll straight into another one: the tough fighters throw combos
    if (foe.t <= 0 && foe.st === 'attack') { if (Math.random() < F.chain) { foe.mv = F.moves[K.ri(0, F.moves.length - 1)]; foe.st = 'tell'; foe.t = F.tell * 0.75; } else { foe.st = 'idle'; foe.t = K.rnd(0.5, 1.2) / F.speed; foe.guard = Math.random() < 0.5 ? 'head' : 'body'; } }
  } else if (foe.st === 'open' && foe.t <= 0) { foe.st = 'idle'; foe.t = K.rnd(0.4, 0.9); }
  else if (foe.st === 'stun' && foe.t <= 0) { foe.st = 'idle'; foe.t = 0.5; }
}
// he fires right back: a quick counter with a short wind-up
function counter() { const F = foe.F; foe.mv = Math.random() < 0.55 ? 'jab' : (Math.random() < 0.5 ? 'hookL' : 'hookR'); foe.st = 'tell'; foe.t = 0.3 * F.speed; fx.push({ t: 'COUNTER!', l: 0.6 }); K.beep(620, 0.05, { vol: 0.04 }); }
function landPunch(pu) {
  const F = foe.F, kind = pu.kind || 'straight', open = foe.st === 'open' || foe.st === 'stun' || foe.st === 'tell' && Math.random() < 0.3;
  // an uppercut goes up the middle to his chin, a hook loops around to his ribs: each slips past most of the guard that covers that spot
  const toHead = kind === 'upper' || (kind === 'straight' && pu.high), covered = toHead ? foe.guard === 'head' : foe.guard === 'body';
  const gp = (F.guard + 0.3) * (kind === 'upper' ? 0.45 : kind === 'hook' ? 0.55 : 1);
  const guarded = !open && foe.st !== 'attack' && covered && Math.random() < gp;
  if (guarded) { fx.push({ t: 'BLOCK', l: 0.4 }); K.beep(200, 0.05, { vol: 0.04 }); if (Math.random() < 0.4) foe.guard = foe.guard === 'head' ? 'body' : 'head'; if (Math.random() < F.counter) counter(); return; }
  let dmg = pu.star ? 30 : kind === 'upper' ? 13 : kind === 'hook' ? 11 : pu.high ? 7 : 5;
  // punches that aren't on an opening only graze him (he rolls with them), and he may fire back
  const rolled = foe.st === 'idle'; if (rolled) dmg *= 0.7;
  if (foe.st === 'open') { dmg *= 1.6; if (Math.random() < 0.6 && me.stars < 3) { me.stars++; fx.push({ t: 'STAR!', l: 0.6 }); K.tune([988, 1319], 0.05); } foe.st = 'stun'; foe.t = 0.35; }
  if (foe.st === 'tell') { foe.st = 'stun'; foe.t = 0.4; }
  foe.hp -= dmg; foe.hit = kind === 'straight' ? 0.2 : 0.3; foe.hitKind = kind; foe.hitDir = pu.side === 'L' ? 1 : -1; K.noise(0.1, 0.25); K.beep(pu.star ? 120 : kind === 'upper' ? 180 : 250, 0.08, { type: 'square', vol: 0.06 }); hud();
  fx.push({ t: pu.star ? 'STAR PUNCH!' : kind === 'upper' ? 'UPPERCUT!' : kind === 'hook' ? 'BODY HOOK!' : 'HIT', l: 0.35 });
  if (foe.hp <= 0) {
    foe.knocks++;
    // the third knockdown, or sometimes the second, is a knockout: he goes face-first to the canvas
    if (foe.knocks >= 3 || (foe.knocks === 2 && Math.random() < 0.3)) { foe.st = 'ko'; foe.koT = 0; foe.thud = false; msg = 'KNOCKOUT!'; msgT = 2.6; K.tune([523, 392, 262], 0.15, { type: 'triangle' }); }
    else { foe.st = 'down'; foe.down = 3.2; foe.downT = 0; msg = 'KNOCKDOWN!'; msgT = 1.5; K.tune([523, 392, 262], 0.15, { type: 'triangle' }); }
  } else if (rolled && Math.random() < F.counter * 0.5) counter();
}
function koStep(dt) {
  foe.koT += dt; if (msgT > 0) msgT -= dt;
  if (!foe.thud && foe.koT > KO_LAND) { foe.thud = true; shake = 0.45; K.noise(0.45, 0.5); K.beep(70, 0.35, { type: 'sawtooth', to: 40, vol: 0.07 }); for (let i = 0; i < 12; i++) dust.push({ x: 128 + K.rnd(-70, 70), y: 214 + K.rnd(0, 80), vx: K.rnd(-50, 50), vy: K.rnd(-35, -10), l: K.rnd(0.4, 0.8), r: K.rnd(3, 6) }); }
  if (foe.koT > 2.7 && state === 'play') victory('KNOCKOUT!');
}
function victory(how) {
  state = 'over'; K.tune([523, 659, 784, 1047, 1319], 0.12);
  const champ = fi >= FOES.length - 1; wins = K.saveBest('knockout', fi + 1);
  setTimeout(() => K.card({ title: champ ? 'CHAMPION!' : how + ' YOU WIN!', text: champ ? 'You beat all five fighters. You are the Knockout Kid!' : 'You beat ' + foe.F.n + '. Next up: ' + FOES[fi + 1].n + '.', best: 'FURTHEST: FIGHT ' + wins, button: champ ? 'Start over' : 'Next fight', onStart: () => { fi = champ ? 0 : fi + 1; fight(); } }), 900);
}
function decision() { const win = foe.hp / foe.F.hp < me.hp / 100; if (win) victory('DECISION!'); else defeat(); }
function defeat() { state = 'over'; K.tune([392, 330, 262, 196], 0.18, { type: 'sawtooth' }); K.card({ title: 'DOWN FOR THE COUNT', text: foe.F.n + ' wins this one. Study the tells and try again!', best: wins ? 'FURTHEST: FIGHT ' + wins : '', button: 'Rematch', onStart: fight }); }

// ---------------- drawing: shaded, muscular boxers ----------------
const sh = (col, k) => A.shade(col, k), LINE = 'rgba(46,20,10,.6)';
// a tapered limb from (x1,y1) radius r1 to (x2,y2) radius r2, shaded across like a rounded muscle
function limb(c, x1, y1, x2, y2, r1, r2, col) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L, an = Math.atan2(ny, nx);
  c.beginPath(); c.moveTo(x1 + nx * r1, y1 + ny * r1); c.lineTo(x2 + nx * r2, y2 + ny * r2);
  c.arc(x2, y2, r2, an, an - Math.PI, true); c.lineTo(x1 - nx * r1, y1 - ny * r1); c.arc(x1, y1, r1, an - Math.PI, an - 2 * Math.PI, true); c.closePath();
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, r = (r1 + r2) / 2, lit = nx + ny < 0 ? 1 : -1;
  const g = c.createLinearGradient(mx - nx * r * lit, my - ny * r * lit, mx + nx * r * lit, my + ny * r * lit);
  g.addColorStop(0, sh(col, 0.22)); g.addColorStop(0.35, col); g.addColorStop(0.8, sh(col, -0.18)); g.addColorStop(1, sh(col, -0.34));
  c.fillStyle = g; c.fill(); c.strokeStyle = LINE; c.lineWidth = 1; c.stroke();
}
// a rounded muscle bulge with a highlight (biceps, calves, delts)
function bulge(c, x, y, rx, ry, rot, col) {
  c.save(); c.translate(x, y); c.rotate(rot);
  const g = c.createRadialGradient(-rx * 0.3, -ry * 0.35, 1, 0, 0, Math.max(rx, ry)); g.addColorStop(0, sh(col, 0.28)); g.addColorStop(0.55, col); g.addColorStop(1, sh(col, -0.22));
  c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, 7); c.fill(); c.strokeStyle = 'rgba(46,20,10,.35)'; c.lineWidth = 0.8; c.stroke(); c.restore();
}
function glove(c, x, y, r, col) {
  c.fillStyle = 'rgba(20,8,8,.92)'; c.beginPath(); c.arc(x, y, r + 1, 0, 7); c.fill();
  const g = c.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r); g.addColorStop(0, sh(col, 0.4)); g.addColorStop(0.5, col); g.addColorStop(1, sh(col, -0.4));
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  c.fillStyle = sh(col, -0.12); c.beginPath(); c.ellipse(x + r * 0.5, y + r * 0.1, r * 0.3, r * 0.5, -0.4, 0, 7); c.fill(); c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 0.8; c.stroke();
  c.fillStyle = '#f2f2f2'; c.beginPath(); c.ellipse(x, y + r * 0.8, r * 0.6, r * 0.26, 0, 0, 7); c.fill(); c.strokeStyle = 'rgba(0,0,0,.3)'; c.stroke();
  c.strokeStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.moveTo(x - r * 0.2, y + r * 0.66); c.lineTo(x + r * 0.2, y + r * 0.94); c.moveTo(x + r * 0.2, y + r * 0.66); c.lineTo(x - r * 0.2, y + r * 0.94); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(x - r * 0.35, y - r * 0.45, r * 0.32, r * 0.17, -0.6, 0, 7); c.fill();
}
// two-bone arm: shoulder S to glove G, elbow bent down and out
function arm(c, F, s, S, G, gcol) {
  const B = F.bulk || 1, reach = Math.hypot(G.x - S.x, G.y - S.y), far = reach > 49 * B, Lu = far ? reach * 0.52 : 25 * B, Lf = far ? reach * 0.5 : 24 * B, dx = G.x - S.x, dy = G.y - S.y, d = K.clamp(reach, Math.abs(Lu - Lf) + 3, Lu + Lf - 1);
  const a = Math.atan2(dy, dx), b = Math.acos(K.clamp((Lu * Lu + d * d - Lf * Lf) / (2 * Lu * d), -1, 1));
  const e1 = { x: S.x + Math.cos(a + b) * Lu, y: S.y + Math.sin(a + b) * Lu }, e2 = { x: S.x + Math.cos(a - b) * Lu, y: S.y + Math.sin(a - b) * Lu };
  const E = (e1.y + e1.x * s * 0.8) > (e2.y + e2.x * s * 0.8) ? e1 : e2;
  limb(c, S.x, S.y, E.x, E.y, (far ? 12 : 10.5) * B, (far ? 9.5 : 8) * B, F.skin);
  bulge(c, S.x + (E.x - S.x) * 0.5, S.y + (E.y - S.y) * 0.5, 6.5 * B, 9 * B, Math.atan2(E.y - S.y, E.x - S.x) - Math.PI / 2, F.skin);   // biceps
  limb(c, E.x, E.y, G.x, G.y, (far ? 9.5 : 8) * B, (far ? 7 : 6.5) * B, F.skin);
  bulge(c, E.x + (G.x - E.x) * 0.3, E.y + (G.y - E.y) * 0.3, 5.5 * B, 7.5 * B, Math.atan2(G.y - E.y, G.x - E.x) - Math.PI / 2, F.skin);   // forearm
  glove(c, G.x, G.y, G.r, gcol);
}
// the face, centered on the middle of the head
function head(c, F, face, t) {
  const sk = F.skin, hair = F.hair, brow = F.hs === 'slick' ? '#9a9aa2' : F.hs === 'bald' ? '#2a1a10' : sh(hair, -0.25);
  if (F.hs === 'pony') { c.fillStyle = sh(hair, -0.1); c.beginPath(); c.moveTo(9, -14); c.bezierCurveTo(22, -14, 26, 6, 19, 22); c.bezierCurveTo(16, 10, 12, 0, 8, -6); c.closePath(); c.fill(); c.strokeStyle = LINE; c.lineWidth = 1; c.stroke(); }
  for (const s of [-1, 1]) { c.fillStyle = sh(sk, -0.08); c.beginPath(); c.ellipse(s * 14.2, -1, 3, 5, 0, 0, 7); c.fill(); c.strokeStyle = LINE; c.lineWidth = 0.8; c.stroke(); c.fillStyle = 'rgba(90,30,20,.3)'; c.beginPath(); c.ellipse(s * 14.4, -1, 1.4, 3, 0, 0, 7); c.fill(); }
  // skull and square jaw
  c.beginPath(); c.moveTo(-14, -4); c.bezierCurveTo(-15, -24, 15, -24, 14, -4); c.bezierCurveTo(14.5, 7, 9, 15.5, 0, 16.5); c.bezierCurveTo(-9, 15.5, -14.5, 7, -14, -4); c.closePath();
