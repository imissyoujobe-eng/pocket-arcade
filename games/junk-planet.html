<style>
/* Layout: full-screen 3D floating island; hearts/junk/parts top-left, minimap top-right; floating joystick left half, JUMP + SPECIAL bottom-right; character-select overlay over a live 3D preview */
:root {

  --cyan: #3fe0ff;
  --display: "Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", system-ui, sans-serif;
  color-scheme: dark;

html, body { height: 100%; }
[hidden] { display: none !important; }

#app { position: relative; height: 100%; min-height: 480px; overflow: hidden; background: var(--space); }
#gl { display: block; width: 100%; height: 100%; touch-action: none; }

.hud { position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 6px; max-width: calc(100% - 150px); pointer-events: none; }

.hearts .gone { color: rgba(255,255,255,.18); text-shadow: none; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-family: var(--display); font-weight: 600; font-size: .95rem; padding: 3px 10px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip b { color: var(--gold); }
.chip.parts b { color: var(--cyan); }
.chip.fx { border-color: var(--lime); color: var(--lime); }
.chip.fx.bad { border-color: #8aa0c8; color: #c8d6f0; }
#map { position: absolute; top: 12px; right: 12px; width: 112px; height: 112px; border-radius: 18px; border: 2px solid rgba(255,255,255,.7); background: rgba(10,8,30,.75); box-shadow: 0 6px 18px rgba(0,0,0,.5); pointer-events: none; }
#music { position: absolute; top: 132px; right: 12px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); color: var(--fg); font-size: 1.1rem; cursor: pointer; }

.toast { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 10vw, 3.4rem); line-height: 1; color: #fff; text-shadow: 0 4px 0 rgba(60,20,90,.8), 0 0 24px rgba(255,79,163,.6); pointer-events: none; padding-inline: 16px; animation: pop .4s cubic-bezier(.2,1.6,.4,1); text-wrap: balance; }

.stick.idle { left: 84px; top: auto; bottom: 24px; margin: 0 0 calc(env(safe-area-inset-bottom, 0px)) -60px; opacity: .4; }
.knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #d8cfff); box-shadow: 0 4px 10px rgba(0,0,0,.4); }
.btns { position: absolute; right: 14px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; align-items: flex-end; }
.btn { font-family: var(--display); font-weight: 700; font-size: 1.05rem; letter-spacing: .03em; color: #fff; border: 0; border-radius: 50%; width: 72px; height: 72px; display: grid; place-items: center; cursor: pointer; touch-action: none; text-align: center; line-height: 1;
  background: radial-gradient(circle at 35% 30%, #7d6cff, #4a33d6); box-shadow: 0 5px 0 #24157a, inset 0 1px 0 rgba(255,255,255,.35); }

.story { margin: 6px auto 0; max-width: 340px; font-size: .9rem; line-height: 1.4; opacity: .9; text-shadow: 0 2px 6px #000; }
.picker { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 10px; align-items: center; padding: 14px; border-radius: 22px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.prow { display: flex; align-items: center; gap: 10px; width: 100%; }
.arrow { flex: none; width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: #fff; font-size: 1.4rem; cursor: pointer; }
.arrow:active { background: rgba(255,255,255,.3); }
#nameIn { flex: 1; min-width: 0; font-family: var(--display); font-weight: 700; font-size: 1.6rem; text-align: center; color: #fff; background: transparent; border: 0; border-bottom: 2px dashed rgba(255,255,255,.35); padding: 4px; }
#nameIn:focus { outline: none; border-bottom-color: var(--lime); }
.sp { font-size: .88rem; line-height: 1.35; min-height: 2.6em; }
.sp b { color: var(--pink); }
.dots { display: flex; gap: 6px; }

.big { font-family: var(--display); font-weight: 700; font-size: 1.5rem; color: #1a0b2e; background: linear-gradient(180deg, #e6ff8a, var(--lime)); border: 0; border-radius: 16px; padding: 12px 34px; cursor: pointer; box-shadow: 0 6px 0 #4d7a0a, 0 0 24px rgba(182,240,60,.45); }

.hint { font-size: .72rem; opacity: .7; }
.card h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(2.4rem, 12vw, 3.4rem); line-height: .95; color: var(--gold); text-shadow: 0 4px 0 #6a4a00, 0 0 24px rgba(255,207,63,.45); text-wrap: balance; }
.card { display: flex; flex-direction: column; gap: 14px; align-items: center; max-width: 360px; }
.card p { margin: 0; line-height: 1.45; }
.err { position: absolute; left: 12px; right: 12px; bottom: 50%; padding: 12px; border-radius: 10px; background: #5a1020; color: #fff; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
</style>

<div id="app">

  <div class="hud" id="hud" hidden>

    <div class="stats">

      <span class="chip">Junk <b id="junk">0</b></span>
      <span class="chip parts">Parts <b id="parts">0/8</b></span>
    </div>
    <div class="stats" id="fx"></div>
  </div>
  <canvas id="map" width="224" height="224" hidden></canvas>
  <button id="music" aria-label="Music on or off" hidden>♪</button>
  <div class="toast" id="toast" hidden></div>
  <div class="stick idle" id="stick" hidden><div class="knob" id="knob"></div></div>
  <div class="btns" id="btns" hidden>
    <button class="btn" id="bJump">JUMP</button>
    <button class="btn special" id="bSpec"><span id="specLbl">DASH</span><i id="specCd"></i></button>
  </div>

  <div class="overlay" id="select">

    <div class="picker">
      <div class="prow">

        <button class="arrow" id="next" aria-label="Next character">▶</button>
      </div>
      <div class="dots" id="dots"></div>
      <div class="sp" id="spDesc"></div>
      <button class="big" id="play">PLAY</button>
      <div class="hint">Tap the name to rename anyone</div>

  </div>
  <div class="overlay dim" id="over" hidden>
    <div class="card">
      <h2 id="overTitle">Lost in space</h2>
      <p id="overText"></p>
      <button class="big" id="again">TRY AGAIN</button>
    </div>
  </div>
</div>

<script src="../lib/three.min.js"></script>

  // ---------- characters ----------
  function human(o) {

      c.m.rotation.x = c.falling ? c.m.rotation.x + dt * 6 : 0;
      // hit player
      if (c.stun <= 0 && !c.falling && Math.abs((c.y + (c.type === 'bee' ? 0 : .5)) - (P.y + .6)) < 1.3 && d < c.r + .45 * P.scale * (shr ? .5 : 1)) hurt(c.x, c.z);
    });
    for (let i = critters.length - 1; i >= 0; i--) if (critters[i].gone) { scene.remove(critters[i].m); critters.splice(i, 1); }
    // --- fx visuals ---
    if (P.fx.bubble > 0) { if (!bubbleMesh) { bubbleMesh = new THREE.Mesh(new THREE.SphereGeometry(1.1, 24, 16), new THREE.MeshStandardMaterial({ color: 0x9adfff, transparent: true, opacity: .25, metalness: .3, roughness: .05, emissive: 0x3fe0ff, emissiveIntensity: .25 })); scene.add(bubbleMesh); } bubbleMesh.visible = true; bubbleMesh.position.set(P.x, P.y + .9, P.z); bubbleMesh.scale.setScalar(1 + Math.sin(clock * 5) * .04); } else if (bubbleMesh) bubbleMesh.visible = false;
    if (P.fx.rain > 0) {
      if (!cloudMesh) { cloudMesh = new THREE.Group(); const cm = M(0x7a8090, { roughness: 1 }); [[0, 0, 0, .6], [.5, .1, 0, .45], [-.5, .05, .1, .5], [.1, .3, 0, .45]].forEach(([x, y, z, r]) => ball(cloudMesh, r, cm, x, y, z)); scene.add(cloudMesh); }
      cloudMesh.visible = true; cloudMesh.position.set(P.x, P.y + 3.4, P.z); if (Math.random() < dt * 40) emit(P.x + (Math.random() - .5) * 1.2, P.y + 3, P.z + (Math.random() - .5) * 1.2, { vy: -12, life: .28, s0: .18, s1: .12, color: 0x7ab8ff });
    } else if (cloudMesh) cloudMesh.visible = false;
    if (P.fx.boots > 0 && grounded() && Math.random() < dt * 30) emit(P.x, .3, P.z, { vy: .5, life: .35, s0: .5, s1: .05, color: pick([0xff7a1a, 0xffcf3f]) });
    // special cooldown ring
    $('specCd').style.height = Math.max(0, P.spCd / (heroDef.id === 'goldie' ? 3.5 : heroDef.id === 'rosie' ? 3 : heroDef.id === 'shades' ? 2.2 : heroDef.id === 'slugger' ? 1.1 : 1.8)) * 100 + '%';
    fxHud();
  }
  function updParts(dt) {
    parts.forEach(p => { if (p.life <= 0) return; p.life -= dt; if (p.life <= 0) { p.m.visible = false; return; } const k = 1 - p.life / p.max; p.vy -= p.g * dt; p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt; p.m.position.z += p.vz * dt; p.m.scale.setScalar(p.s0 + (p.s1 - p.s0) * k); p.m.material.opacity = 1 - k * k; });
  }

  // ---------- camera & minimap ----------
  const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
  function updateCamera(dt, snap) {
    let tx, ty, tz, lx, ly, lz;
    if (state === 'select') { const a = Math.sin(clock * .5) * .35; tx = P.x + Math.sin(a) * 6.2; ty = 2.7; tz = P.z + Math.cos(a) * 6.2; lx = P.x; ly = .9; lz = P.z; }
    else { const fy = Math.max(-6, Math.min(P.y, 4)); tx = P.x; ty = 10.5 + fy * .5; tz = P.z + 8.5; lx = P.x; ly = fy * .6; lz = P.z; }
    const k = snap ? 1 : Math.min(1, dt * 5);
    camPos.x += (tx - camPos.x) * k; camPos.y += (ty - camPos.y) * k; camPos.z += (tz - camPos.z) * k;
    camLook.x += (lx - camLook.x) * k; camLook.y += (ly - camLook.y) * k; camLook.z += (lz - camLook.z) * k;
    camera.position.copy(camPos); camera.lookAt(camLook);
    sun.position.set(P.x + 15, 30, P.z + 12); sun.target.position.set(P.x, 0, P.z);
    if (state === 'select' && heroMesh) heroMesh.rotation.y = 0;
  }
  const mctx = $('map').getContext('2d');
  function drawMap() {
    if (state !== 'play' && state !== 'over') return;
    const S = 224, c = mctx, cs = (S - 20) / G, o = 10, th = THEMES[(level - 1) % 8];
    c.clearRect(0, 0, S, S);
    const top = '#' + new THREE.Color(th.top[0]).getHexString();
    for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) if (seen[idx(i, j)] && isLand(i, j)) { c.fillStyle = isBlocked(i, j) ? '#5a4a6a' : top; c.fillRect(o + i * cs, o + j * cs, cs + .5, cs + .5); }
    const dot = (x, z, col, r) => { c.fillStyle = col; c.beginPath(); c.arc(o + (x / T + G / 2) * cs, o + (z / T + G / 2) * cs, r, 0, Math.PI * 2); c.fill(); };
    crates.forEach(cr => { if (!cr.open && seen[idx(cellOf(cr.x), cellOf(cr.z))]) dot(cr.x, cr.z, '#b06aff', 4); });
    if (!part.got && seen[part.cell]) dot(part.x, part.z, '#3fe0ff', 7);
    if (seen[warp.cell]) dot(warp.x, warp.z, part.got ? '#3fe0ff' : '#ff3d5a', 6);
    critters.forEach(cr => { if (seen[idx(cellOf(cr.x), cellOf(cr.z))] || cr.type === 'bee') dot(cr.x, cr.z, '#ff4fa3', 3.5); });
    dot(P.x, P.z, '#ffffff', 6); c.strokeStyle = '#1a0b2e'; c.lineWidth = 2; c.stroke();
  }

  // ---------- loop ----------
  function resize() { const w = app.clientWidth, h = app.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 58 : 46; camera.updateProjectionMatrix(); }
  let last = performance.now(), W0 = 0, H0 = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (app.clientWidth !== W0 || app.clientHeight !== H0) { W0 = app.clientWidth; H0 = app.clientHeight; resize(); }
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    update(dt); updParts(dt); updateCamera(dt, false); drawMap(); music();
    renderer.render(scene, camera);
  }
  genLevel(1); setHero(0); placeAtStart(); updateCamera(0, true);
  requestAnimationFrame(frame);
})();
