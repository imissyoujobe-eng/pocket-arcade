<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Football</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/three.min.js"></script>
<script>
// Football: four-a-side indoor football in 3D, seen from one foot above your player's head (or through his eyes).
// Push the stick up to run and left / right to turn. Hold SHOOT and let go to fire (longer = harder). PASS finds a
// teammate. Without the ball SHOOT is a slide tackle and PASS switches player. SPRINT runs faster. VIEW swaps the
// over-the-head camera for your own eyes. Three minutes, next goal wins if it's level.
K.theme({ bg: '#06130b', ink: '#f1fff3', accent: '#3be07a', accentInk: '#03140a' });
K.hud(['score', 'clock']);
K.pad({ dpad: '4', buttons: [{ id: 'v', label: 'VIEW', top: true }, { id: 'a', label: 'SHOOT' }, { id: 'b', label: 'PASS' }, { id: 'c', label: 'SPRINT' }] });
addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (k === 'v') K.press('v'); if (k === 'c' || k === 'e') K.press('c'); });
addEventListener('keyup', e => { const k = e.key.toLowerCase(); if (k === 'v') K.release('v'); if (k === 'c' || k === 'e') K.release('c'); });
{ const st = document.createElement('style'); st.textContent =
  '#kp button[aria-label=a]{box-shadow:inset 0 -7px 0 #ff4a3a,0 4px 0 rgba(0,0,0,.35)}' +
  '#kp button[aria-label=b]{box-shadow:inset 0 -7px 0 #3ab4ff,0 4px 0 rgba(0,0,0,.35)}' +
  '#kp button[aria-label=c]{box-shadow:inset 0 -7px 0 #ffd23f,0 4px 0 rgba(0,0,0,.35)}';
  document.head.appendChild(st); }

const TAU = Math.PI * 2, WX = 22, WZ = 35, GW = 9, GHT = 3, GDP = 3.2, BR = 0.32, PS = 1.3, GRAV = 19, HT = 1.94 * PS;
const RUN = 7.2, SPR = 9.8, CPU_RUN = 6.6, CPU_CHASE = 8.0, MATCH = 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t, rnd = (a, b) => a + Math.random() * (b - a);
const adiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };
const dist2 = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);

// ---------------------------------------------------------------- 3D setup
let renderer, scene, camera, stageEl, hudC, hud, PR = 1.5, HW = 1, HH = 1;
function cTex(w, h, fn, rep) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); if (rep) t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t; }
const MC = {}; const mat = c => MC[c] || (MC[c] = new THREE.MeshLambertMaterial({ color: c }));
const cyl = (rt, rb, h, m, seg = 10) => new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
const sph = (r, m, w = 12, h = 10) => new THREE.Mesh(new THREE.SphereGeometry(r, w, h), m);
function setup() {
  stageEl = document.getElementById('ks'); const kc = stageEl.querySelector('canvas'); if (kc) kc.style.display = 'none';
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' }); PR = Math.min(devicePixelRatio || 1, 1.75); renderer.setPixelRatio(PR);
  renderer.domElement.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block'; stageEl.style.position = 'relative'; stageEl.insertBefore(renderer.domElement, stageEl.firstChild);
  hudC = document.createElement('canvas'); hudC.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1'; stageEl.insertBefore(hudC, renderer.domElement.nextSibling); hud = hudC.getContext('2d');
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a1424); scene.fog = new THREE.Fog(0x0a1424, 80, 220);
  camera = new THREE.PerspectiveCamera(68, 1, 0.1, 400);
  scene.add(new THREE.HemisphereLight(0xe4ecff, 0x2d5a2d, 0.85));
  const sun = new THREE.DirectionalLight(0xfff4e0, 0.75); sun.position.set(20, 60, 15); scene.add(sun);
  buildWorld(); buildTeams(); addEventListener('resize', fit); fit();
}
function fit() {
  if (!renderer) return;
  const r = stageEl.getBoundingClientRect(), w = Math.max(100, r.width), h = Math.max(100, r.height);
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  HW = w; HH = h; const d = Math.min(devicePixelRatio || 1, 2); hudC.width = Math.round(w * d); hudC.height = Math.round(h * d);
}

function pitchTex() {
  return cTex(1024, 2048, (c, w, h) => {
    const PW = 58, PL = 88; c.setTransform(w / PW, 0, 0, h / PL, w / 2, h / 2);
    for (let z = -PL / 2, i = 0; z < PL / 2; z += 5, i++) { c.fillStyle = i % 2 ? '#2f9a43' : '#37ac4d'; c.fillRect(-PW / 2, z, PW, 5.02); }
    c.fillStyle = 'rgba(0,50,0,.07)'; for (let i = 0; i < 7000; i++) c.fillRect((Math.random() - .5) * PW, (Math.random() - .5) * PL, .13, .13);
    c.strokeStyle = '#fff'; c.lineWidth = .17; c.lineCap = 'round';
    c.strokeRect(-WX, -WZ, WX * 2, WZ * 2);
    c.beginPath(); c.moveTo(-WX, 0); c.lineTo(WX, 0); c.stroke();
    c.beginPath(); c.arc(0, 0, 5.5, 0, TAU); c.stroke(); c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, .3, 0, TAU); c.fill();
    for (const s of [-1, 1]) {
      c.strokeRect(-10, s > 0 ? WZ - 9 : -WZ, 20, 9); c.strokeRect(-6, s > 0 ? WZ - 3.5 : -WZ, 12, 3.5);
      c.beginPath(); c.arc(0, s * (WZ - 7), .3, 0, TAU); c.fill();
      c.beginPath(); c.arc(0, s * (WZ - 7), 5.2, s > 0 ? Math.PI * 1.22 : Math.PI * .22, s > 0 ? Math.PI * 1.78 : Math.PI * .78); c.stroke();
    }
  });
}
function crowdTex() {
  const cols = ['#e63946', '#1f6bff', '#f2f2f2', '#ffd23f', '#3ddc84', '#ff9a1a', '#7a4cff'], sk = ['#f2c7a0', '#d9a070', '#8d5a3a', '#c68642'];
  return cTex(512, 256, (c, w, h) => {
    c.fillStyle = '#10141f'; c.fillRect(0, 0, w, h);
    for (let y = 6; y < h; y += 13) for (let x = ((y / 13) % 2) * 7; x < w; x += 14) { c.fillStyle = cols[(Math.random() * cols.length) | 0]; c.fillRect(x, y + 5, 11, 9); c.fillStyle = sk[(Math.random() * 4) | 0]; c.beginPath(); c.arc(x + 5.5, y + 2.5, 3.8, 0, TAU); c.fill(); }
  }, true);
}
function adTex() {
  const cols = ['#e63946', '#1f6bff', '#ffd23f', '#3ddc84', '#ff9a1a'], names = ['FOOTBALL', 'JOYSTIK', 'GOAL!', 'ARCADE', 'PLAY ON'];
  return cTex(1024, 64, (c, w, h) => { for (let i = 0; i < 5; i++) { c.fillStyle = cols[i]; c.fillRect(i * 204.8, 0, 205, h); c.fillStyle = i === 2 ? '#222' : '#fff'; c.font = 'bold 40px Bungee, Impact, sans-serif'; c.textAlign = 'center'; c.fillText(names[i], i * 204.8 + 102, 46); } }, true);
}
function netTex() { return cTex(64, 64, (c, w, h) => { c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 2; c.strokeRect(0, 0, w, h); }, true); }
function blobTex() { return cTex(64, 64, (c, w, h) => { const g = c.createRadialGradient(32, 32, 2, 32, 32, 30); g.addColorStop(0, 'rgba(0,0,0,.5)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 0, w, h); }); }
let BLOB = null;
function blob(r) { const m = new THREE.Mesh(new THREE.PlaneGeometry(r * 2, r * 2), new THREE.MeshBasicMaterial({ map: BLOB, transparent: true, depthWrite: false })); m.rotation.x = -Math.PI / 2; m.position.y = .03; return m; }

function buildWorld() {
  BLOB = blobTex();
  const pitch = new THREE.Mesh(new THREE.PlaneGeometry(58, 88), new THREE.MeshLambertMaterial({ map: pitchTex() })); pitch.rotation.x = -Math.PI / 2; scene.add(pitch);
  const out = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshLambertMaterial({ color: 0x15241a })); out.rotation.x = -Math.PI / 2; out.position.y = -.05; scene.add(out);
  // boards with adverts (end boards leave the goal open)
  const ad = adTex();
  function board(len, x, z, ry) { const t = ad.clone(); t.needsUpdate = true; t.repeat.set(len / 12, 1); const m = new THREE.Mesh(new THREE.BoxGeometry(len, 1.3, .35), new THREE.MeshLambertMaterial({ map: t })); m.position.set(x, .65, z); m.rotation.y = ry; scene.add(m); }
  for (const s of [-1, 1]) {
    board(WZ * 2 + .7, s * (WX + .2), 0, Math.PI / 2);
    const seg = WX - GW / 2; for (const sx of [-1, 1]) board(seg, sx * (GW / 2 + seg / 2), s * (WZ + .2), 0);
  }
  // goals
  const nt = netTex();
  function goalFrame(s) {
    const g = new THREE.Group(); g.position.z = s * WZ; const w = mat(0xffffff);
    for (const sx of [-1, 1]) { const p = cyl(.1, .1, GHT, w); p.position.set(sx * GW / 2, GHT / 2, 0); g.add(p); const b = cyl(.06, .06, GHT, w); b.position.set(sx * GW / 2, GHT / 2, s * GDP); g.add(b); const t = cyl(.05, .05, GDP, w); t.rotation.x = Math.PI / 2; t.position.set(sx * GW / 2, GHT, s * GDP / 2); g.add(t); }
    const bar = cyl(.1, .1, GW + .2, w); bar.rotation.z = Math.PI / 2; bar.position.y = GHT; g.add(bar);
    function netPlane(pw, ph, x, y, z, rx, ry) { const t = nt.clone(); t.needsUpdate = true; t.repeat.set(pw / .45, ph / .45); const m = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), new THREE.MeshBasicMaterial({ map: t, transparent: true, opacity: .55, side: THREE.DoubleSide, depthWrite: false })); m.position.set(x, y, z); m.rotation.set(rx, ry, 0); g.add(m); }
    netPlane(GW, GHT, 0, GHT / 2, s * GDP, 0, 0);
    for (const sx of [-1, 1]) netPlane(GDP, GHT, sx * GW / 2, GHT / 2, s * GDP / 2, 0, Math.PI / 2);
    netPlane(GW, GDP, 0, GHT, s * GDP / 2, Math.PI / 2, 0);
    scene.add(g);
  }
  goalFrame(1); goalFrame(-1);
  // stands full of fans
  const crowd = crowdTex(), a = 35 * Math.PI / 180, nrm = [-Math.sin(a), Math.cos(a)];
  function stand(len, side, end) {
    const t = crowd.clone(); t.needsUpdate = true; t.repeat.set(len / 9, 1.6);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(len, 17), new THREE.MeshBasicMaterial({ map: t, color: 0xb8b8c8 }));
    const base = (end ? WZ + 6 : WX + 2), c = base + 8.5 * Math.cos(a), y = 1.2 + 8.5 * Math.sin(a);
    if (!end) { m.position.set(side * c, y, 0); m.lookAt(side * (c + nrm[0]), y + nrm[1], 0); } else { m.position.set(0, y, side * c); m.lookAt(0, y + nrm[1], side * (c + nrm[0])); }
    scene.add(m);
  }
  for (const s of [-1, 1]) { stand(WZ * 2 + 30, s, false); stand(WX * 2 + 30, s, true); }
  // floodlight towers
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const pole = cyl(.4, .6, 24, mat(0x30343e)); pole.position.set(sx * (WX + 10), 12, sz * (WZ + 9)); scene.add(pole);
    const lamp = new THREE.Mesh(new THREE.BoxGeometry(7, 3, .6), new THREE.MeshBasicMaterial({ color: 0xfff6d8 })); lamp.position.set(sx * (WX + 10), 24.5, sz * (WZ + 9)); lamp.lookAt(0, 8, 0); scene.add(lamp);
  }
}

// the players: big, chunky, with a number on the back
const numTexC = {};
function numMat(n) { return numTexC[n] || (numTexC[n] = new THREE.MeshBasicMaterial({ map: cTex(128, 128, (c, w, h) => { c.font = 'bold 100px Bungee, Impact, sans-serif'; c.textAlign = 'center'; c.lineWidth = 9; c.strokeStyle = '#111'; c.strokeText(n, 64, 100); c.fillStyle = '#fff'; c.fillText(n, 64, 100); }), transparent: true })); }
function mkPlayer(team, role, num) {
  const kit = role === 'g' ? (team === 0 ? { j: 0xffd23f, s: 0x1b1b1b, k: 0xffd23f } : { j: 0x2fd070, s: 0x1b1b1b, k: 0x2fd070 }) : (team === 0 ? { j: 0x1f6bff, s: 0xffffff, k: 0x1f6bff } : { j: 0xe63946, s: 0x222222, k: 0xe63946 });
  const skin = [0xf2c7a0, 0xd9a070, 0x8d5a3a, 0xc68642, 0x5a3a26][num % 5], hair = [0x2a1a0e, 0x111111, 0xb98a3a, 0x6b3a1c, 0xd8c070][(num * 3) % 5];
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body); root.scale.setScalar(PS);
  const legs = [], arms = [];
  for (const sx of [-1, 1]) {
    const lg = new THREE.Group(); lg.position.set(sx * .14, .92, 0);
    const sh = cyl(.125, .11, .36, mat(kit.s)); sh.position.y = -.16; lg.add(sh);
    const sock = cyl(.085, .075, .5, mat(kit.k), 8); sock.position.y = -.6; lg.add(sock);
    const boot = new THREE.Mesh(new THREE.BoxGeometry(.15, .11, .32), mat(0x101010)); boot.position.set(0, -.88, .07); lg.add(boot);
    body.add(lg); legs.push(lg);
    const ag = new THREE.Group(); ag.position.set(sx * .38, 1.55, 0);
    const up = cyl(.09, .08, .3, mat(kit.j), 8); up.position.y = -.14; ag.add(up);
    const fo = cyl(.07, .06, .3, mat(role === 'g' ? kit.j : skin), 8); fo.position.y = -.4; ag.add(fo);
    const hand = sph(role === 'g' ? .13 : .075, mat(role === 'g' ? 0xff7a1a : skin), 8, 6); hand.position.y = -.58; ag.add(hand);
    body.add(ag); arms.push(ag);
  }
  const torso = cyl(.3, .24, .66, mat(kit.j), 12); torso.position.y = 1.28; torso.scale.z = .78; body.add(torso);
  const trim = cyl(.305, .305, .06, mat(0xffffff), 12); trim.position.y = 1.58; trim.scale.z = .78; body.add(trim);
  const neck = cyl(.07, .08, .1, mat(skin), 8); neck.position.y = 1.62; body.add(neck);
  const head = sph(.2, mat(skin), 14, 12); head.position.y = 1.74; body.add(head);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(.212, 14, 10, 0, TAU, 0, 1.95), mat(hair)); cap.position.set(0, 1.755, -.025); body.add(cap);
  for (const sx of [-1, 1]) { const e = sph(.03, mat(0x111111), 6, 5); e.position.set(sx * .075, 1.77, .185); body.add(e); }
  const bn = new THREE.Mesh(new THREE.PlaneGeometry(.36, .36), numMat(num)); bn.position.set(0, 1.3, -.245); bn.rotation.y = Math.PI; body.add(bn);
  const fn = new THREE.Mesh(new THREE.PlaneGeometry(.16, .16), numMat(num)); fn.position.set(.12, 1.42, .245); body.add(fn);
  const sh = blob(.85); root.add(sh);
  return { root, body, legs, arms };
}

let P = [], ball = null, ctrl = null;
function buildTeams() {
  const nums = [1, 9, 7, 11, 1, 10, 8, 4];
  for (let t = 0; t < 2; t++) for (let i = 0; i < 4; i++) {
    const p = { team: t, role: i === 0 ? 'g' : 'f', i, x: 0, z: 0, vx: 0, vz: 0, h: t === 0 ? 0 : Math.PI, sp: 0, ph: Math.random() * 6, kick: 0, tk: 0, stun: 0, lunge: 0, dive: 0, dd: 0, cel: 0, hold: 0, think: 0, dph: 0, home: { x: 0, z: 0 }, mesh: mkPlayer(t, i === 0 ? 'g' : 'f', nums[t * 4 + i]) };
    scene.add(p.mesh.root); P.push(p);
  }
  const bt = cTex(256, 128, (c, w, h) => { c.fillStyle = '#fafafa'; c.fillRect(0, 0, w, h); c.fillStyle = '#16161c'; for (let i = 0; i < 14; i++) { const x = (i % 7) * 40 + (i < 7 ? 12 : 32), y = i < 7 ? 34 : 92; c.beginPath(); for (let k = 0; k < 5; k++) { const a = k / 5 * TAU - 1.57; c.lineTo(x + Math.cos(a) * 15, y + Math.sin(a) * 15); } c.fill(); } });
  const bm = new THREE.Mesh(new THREE.SphereGeometry(BR, 18, 14), new THREE.MeshLambertMaterial({ map: bt, emissive: 0x303030 }));
  const bs = blob(.6); scene.add(bm, bs);
  ball = { x: 0, y: BR, z: 0, vx: 0, vy: 0, vz: 0, owner: null, cd: 0, target: null, last: null, mesh: bm, shadow: bs };
}
const HOME = [[0, -33.4], [0, -5], [-10, -14], [10, -14]];
function homeOf(t, i) { const h = HOME[i]; return t === 0 ? { x: h[0], z: h[1] } : { x: -h[0], z: -h[1] }; }

// ---------------------------------------------------------------- the match
let state = 'title', T = 0, clock = MATCH, ot = false, goals = [0, 0], charge = 0, view = 0, camH = 0, camSnap = true, kt = 0, gt = 0, swT = 0, banner = null, best = K.best('football'), lastScorer = -1;
function setBanner(t, sub, d) { banner = { t, sub: sub || '', l: d, L: d }; }
function hudSet() { K.set('score', 'YOU ' + goals[0] + ' – ' + goals[1] + ' CPU'); const c = Math.max(0, Math.ceil(clock)); K.set('clock', ot ? 'GOLDEN GOAL' : Math.floor(c / 60) + ':' + String(c % 60).padStart(2, '0')); }
function kickoff() {
  for (const p of P) { p.home = homeOf(p.team, p.i); p.x = p.home.x; p.z = p.home.z; if (p.team === 1 && p.i === 1) p.z = 4.5; if (p.team === 0 && p.i === 1) p.z = -4; p.vx = p.vz = p.sp = 0; p.h = p.team === 0 ? 0 : Math.PI; p.stun = 0; p.lunge = 0; p.dive = 0; p.cel = 0; p.hold = 0; p.kick = 0; }
  Object.assign(ball, { x: 0, y: BR, z: 0, vx: 0, vy: 0, vz: 0, owner: null, cd: 0, target: null, last: null });
  ctrl = P[1]; camSnap = true; charge = 0; state = 'kick';
  { const k = lastScorer === 0 ? P[5] : P[1]; k.z = k.team === 0 ? -2 : 2; k.x = 0; ball.owner = k; ball.last = k; if (k.team === 0) ctrl = k; } kt = 1.5; hudSet(); setBanner(ot ? 'GOLDEN GOAL' : 'KICK OFF', '', 1.3);
}
function startMatch() { goals = [0, 0]; clock = MATCH; ot = false; kickoff(); K.tune([523, 659, 784], .08, { type: 'triangle' }); }

// ---- kicking
function aimGoal(p, bx, bz) {
  const dir = p.team === 0 ? 1 : -1, gz = dir * WZ, cz = Math.cos(p.h);
  if (cz * dir > 0.05) { const xh = bx + Math.sin(p.h) / cz * (gz - bz); if (Math.abs(xh) < GW / 2 + 4) return Math.atan2(clamp(xh, -(GW / 2 - .7), GW / 2 - .7) - bx, gz - bz); }
  return p.h;
}
function release(p) { ball.owner = null; ball.cd = .3; ball.last = p; ball.target = null; }
function shootBall(p, c, cpuX) {
  const bx = ball.x, bz = ball.z; let ang = p.h;
  if (cpuX != null) ang = Math.atan2(cpuX - bx, (p.team === 0 ? WZ : -WZ) - bz); else ang = aimGoal(p, bx, bz);
  const sp = 14 + c * 21; release(p);
  ball.vx = Math.sin(ang) * sp; ball.vz = Math.cos(ang) * sp; ball.vy = .5 + c * c * 5.5; p.kick = .3;
  K.noise(.07, .1 + c * .12); K.beep(150 - c * 40, .12, { type: 'triangle', to: 70, vol: .09 });
  if (c > .6) pop(p.team === 0 ? 'POWER!' : '');
}
function passTo(p, tm) {
  const d = Math.hypot(tm.x - ball.x, tm.z - ball.z), lead = clamp(d / 18, .1, .8), sp = clamp(8 + d * .85, 11, 25);
  const tx = tm.x + tm.vx * lead, tz = tm.z + tm.vz * lead, dd = Math.hypot(tx - ball.x, tz - ball.z) || 1;
  release(p); ball.vx = (tx - ball.x) / dd * sp; ball.vz = (tz - ball.z) / dd * sp; ball.vy = d > 14 ? 2.4 : .3; ball.target = tm; p.kick = .25;
  K.beep(330, .06, { type: 'triangle', vol: .07 }); K.noise(.04, .08);
}
function humanPass(p) {
  let best = null, bs = -9;
  for (const tm of P) { if (tm.team !== p.team || tm === p || tm.role === 'g') continue; const d = dist2(tm, ball); if (d < 3 || d > 32) continue; const a = Math.abs(adiff(p.h, Math.atan2(tm.x - p.x, tm.z - p.z))); if (a > 1.1) continue; const s = Math.cos(a) * 1.3 - d / 50; if (s > bs) { bs = s; best = tm; } }
  if (best) { passTo(p, best); ctrl = best; } else { release(p); ball.vx = Math.sin(p.h) * 13; ball.vz = Math.cos(p.h) * 13; ball.vy = .3; p.kick = .25; K.beep(300, .06, { type: 'triangle' }); }
}
function tackle(p) { if (p.tk > 0 || p.stun > 0) return; p.lunge = .38; p.tk = .8; K.noise(.1, .1); }
let popT = null;
function pop(t) { if (t) popT = { t, l: 1 }; }

// ---- player movement
function drive(p, sp, dt, accel) { p.sp += clamp(sp - p.sp, -42 * dt, (accel || 26) * dt); p.vx = Math.sin(p.h) * p.sp; p.vz = Math.cos(p.h) * p.sp; }
function aiMove(p, tx, tz, spd, dt) {
  const dx = tx - p.x, dz = tz - p.z, d = Math.hypot(dx, dz), want = Math.atan2(dx, dz), da = adiff(p.h, want);
  p.h += clamp(da, -7 * dt, 7 * dt);
  const s = spd * clamp(d / 1.6, 0, 1) * (Math.abs(da) < 1.2 ? 1 : .35); drive(p, s, dt, 22);
}
function human(dt) {

  if (fwd < .8 || Math.abs(V3.x) > lim) { const right = V3.x >= 0, x = right ? HW - 22 : 22, y = HH * .45; c.fillStyle = 'rgba(255,255,255,.85)'; c.strokeStyle = '#111'; c.lineWidth = 2; c.beginPath(); c.moveTo(x + (right ? 14 : -14), y); c.lineTo(x - (right ? 8 : -8), y - 12); c.lineTo(x - (right ? 8 : -8), y + 12); c.closePath(); c.stroke(); c.fill(); }
  // shot power
  if (charge > 0) { const w = Math.min(220, HW * .5), x = (HW - w) / 2, y = HH - 22; c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(x - 3, y - 3, w + 6, 16); c.fillStyle = charge < .5 ? '#ffd23f' : charge < .9 ? '#ff9a1a' : '#ff3d52'; c.fillRect(x, y, w * charge, 10); }
  if (banner && banner.t) {
    const a = Math.min(1, banner.l * 3, (banner.L - banner.l) * 6); c.save(); c.globalAlpha = a; c.textAlign = 'center'; c.font = '44px Bungee, Impact, sans-serif';
    c.lineWidth = 8; c.strokeStyle = '#052'; c.strokeText(banner.t, HW / 2, HH * .36); c.fillStyle = '#fff'; c.fillText(banner.t, HW / 2, HH * .36);
    if (banner.sub) { c.font = '22px Bungee, Impact, sans-serif'; c.strokeText(banner.sub, HW / 2, HH * .36 + 34); c.fillStyle = '#3be07a'; c.fillText(banner.sub, HW / 2, HH * .36 + 34); } c.restore();
  }
  if (popT) { c.save(); c.globalAlpha = Math.min(1, popT.l * 2); c.textAlign = 'center'; c.font = '26px Bungee, Impact, sans-serif'; c.lineWidth = 6; c.strokeStyle = '#000'; c.strokeText(popT.t, HW / 2, HH * .5); c.fillStyle = '#ffd23f'; c.fillText(popT.t, HW / 2, HH * .5); c.restore(); }
}

setup();
for (const p of P) { p.home = homeOf(p.team, p.i); p.x = p.home.x; p.z = p.home.z; }
ctrl = P[1]; hudSet();
K.card({ title: 'FOOTBALL', art: { src: '../art/football.jpg', w: 600, h: 600 }, text: 'Four-a-side indoor football in 3D, seen from one foot above your player\'s head. Push the stick up to run and left or right to turn. Hold SHOOT and let go to fire: the longer you hold, the harder. PASS finds a teammate. Without the ball, SHOOT is a slide tackle and PASS switches player. SPRINT runs faster, VIEW looks through his eyes. Three minutes, golden goal if it\'s level.', best: best ? 'BEST ' + best : '', button: 'Kick off', onStart: startMatch });
K.run(update, draw);
window.DB = { state: () => ({ state, clock, goals, view, ctrl: ctrl && { x: +ctrl.x.toFixed(1), z: +ctrl.z.toFixed(1), h: +ctrl.h.toFixed(2) }, ball: { x: +ball.x.toFixed(1), y: +ball.y.toFixed(2), z: +ball.z.toFixed(1), own: ball.owner ? ball.owner.team + '/' + ball.owner.i : null }, PR }), start: startMatch, step: (n, dt) => { for (let i = 0; i < n; i++) update(dt); }, view: v => { view = v; camSnap = true; }, P: () => P, ball: () => ball, shoot: c => shootBall(ctrl, c) };
</script>
