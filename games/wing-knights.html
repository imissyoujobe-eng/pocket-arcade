<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wing Knights</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script>
// Wing Knights: flap your flying mount over a lava pit and knock enemy riders out of the sky. The higher lance wins. Grab their eggs before they hatch.
K.theme({ bg: '#0c0a14', ink: '#fff4e0', accent: '#ffcc33', accentInk: '#2a1a00' });
const W = 320, H = 240, LAVA = 224;
K.screen(W, H);
K.hud(['score', 'wave', 'lives']);
K.pad({ dpad: 'lr', buttons: [{ id: 'a', label: 'FLAP' }] });

const PLATS = [
  { x: -20, y: 70, w: 70 }, { x: 270, y: 70, w: 70 }, { x: 120, y: 54, w: 80 },
  { x: 90, y: 120, w: 60 }, { x: -20, y: 140, w: 60 }, { x: 280, y: 140, w: 60 }, { x: 200, y: 150, w: 70 },
  { x: 70, y: 200, w: 180 },
];
const SPAWNS = [{ x: 15, y: 70 }, { x: 305, y: 70 }, { x: 160, y: 54 }, { x: 160, y: 200 }];
const TIERS = [
  { name: 'RAIDER', col: '#e04040', pts: 500, spd: 60, flap: 0.55, aim: 10 },
  { name: 'HUNTER', col: '#b0b0c0', pts: 750, spd: 80, flap: 0.42, aim: -6 },
  { name: 'DARK LORD', col: '#4a7aff', pts: 1500, spd: 100, flap: 0.32, aim: -20 },
];
let state = 'title', score, lives, wave, me, foes, eggs, parts, pops, ptero, waveT, eggChain, nextLife, msg, msgT, best = K.best('wingknights'), flapAnim;
function title() { K.card({ title: 'WING KNIGHTS', text: 'Tap FLAP to fly (tap faster to climb), ◀ ▶ to steer. The screen wraps around the sides. Crash into enemy riders: whoever is HIGHER wins. Beaten riders drop eggs, so grab them before they hatch into new riders. Stay out of the lava! If a wave drags on, a flying beast comes hunting.', best: best ? 'BEST ' + best : '', button: 'Take Flight', onStart: start }); }
function start() { score = 0; lives = 4; wave = 0; nextLife = 20000; parts = []; pops = []; me = rider(160, 200, null); me.inv = 2; nextWave(); state = 'play'; }
function rider(x, y, tier) { return { x, y, vx: 0, vy: 0, face: 1, ground: null, tier, flapT: 0, think: K.rnd(0, 1), inv: 0, wing: 0, tx: x }; }
function nextWave() {
  wave++; foes = []; eggs = []; ptero = null; waveT = 0; eggChain = 0;
  const n = Math.min(8, 2 + wave);
  for (let i = 0; i < n; i++) { const s = SPAWNS[i % SPAWNS.length], t = Math.min(2, Math.floor((wave - 1 + i * 0.6) / 3)); const f = rider(s.x + K.rnd(-6, 6), s.y - 12, t); f.inv = 1 + i * 0.4; f.spawn = 1 + i * 0.4; foes.push(f); }
  msg = wave % 5 === 0 ? 'WAVE ' + wave + ': SURVIVAL WAVE' : 'WAVE ' + wave; msgT = 2;
  K.tune([392, 523, 659], 0.1, { type: 'triangle' });
}
function boom(x, y, c, n) { for (let i = 0; i < (n || 10); i++) parts.push({ x, y, vx: K.rnd(-70, 70), vy: K.rnd(-90, 10), t: K.rnd(0.3, 0.7), c }); }
function pop(x, y, txt) { pops.push({ x, y, txt, t: 1 }); }
function addScore(n) { score += n; if (score >= nextLife) { lives++; nextLife += 20000; msg = 'EXTRA LIFE!'; msgT = 1.2; K.tune([880, 1100, 1320], 0.06); } }
// physics shared by everyone that rides
function fly(r, dt, flap, dir, maxV) {
  if (flap) { r.vy = Math.max(-150, r.vy - 115); r.ground = null; r.wing = 0.15; }
  if (r.wing > 0) r.wing -= dt;
  const acc = r.ground ? 260 : 170;
  if (dir) { r.vx += dir * acc * dt; r.face = dir; } else if (r.ground) r.vx *= Math.pow(0.04, dt);
  r.vx = K.clamp(r.vx, -maxV, maxV);
  if (!r.ground) r.vy = Math.min(170, r.vy + 230 * dt);
  const oy = r.y; r.x += r.vx * dt; r.y += r.vy * dt;
  if (r.x < -8) r.x += W + 16; if (r.x > W + 8) r.x -= W + 16;
  if (r.y < 12) { r.y = 12; r.vy = Math.abs(r.vy) * 0.4; }
  if (r.ground) { const p = r.ground; if (r.x < p.x - 4 || r.x > p.x + p.w + 4) r.ground = null; else { r.y = p.y; r.vy = 0; } }
  else for (const p of PLATS) {
    if (r.x < p.x - 4 || r.x > p.x + p.w + 4) continue;
    if (r.vy >= 0 && oy <= p.y + 0.5 && r.y >= p.y) { r.y = p.y; r.vy = 0; r.ground = p; break; }
    if (r.vy < 0 && oy - 16 >= p.y + 6 && r.y - 16 < p.y + 6) { r.y = p.y + 22; r.vy = 40; K.beep(200, 0.03, { vol: 0.03 }); break; }
    if (r.y > p.y + 1 && r.y - 16 < p.y + 6) { if (r.x < p.x + 2 && r.vx > 0) { r.x = p.x - 5; r.vx = -r.vx * 0.6; } else if (r.x > p.x + p.w - 2 && r.vx < 0) { r.x = p.x + p.w + 5; r.vx = -r.vx * 0.6; } }
  }
}
function loseLife(why) {
  boom(me.x, me.y - 8, '#ffcc33', 20); K.noise(0.5, 0.4); K.beep(400, 0.6, { to: 60, type: 'sawtooth' }); lives--;
  if (lives <= 0) { state = 'over'; best = K.saveBest('wingknights', score); K.card({ title: 'UNHORSED', text: (why || 'Knocked out of the sky') + ' on wave ' + wave + '. Score ' + score + '.', best: 'BEST ' + best, button: 'Ride Again', onStart: start }); return; }
  const s = SPAWNS[3]; me = rider(s.x, s.y, null); me.inv = 3; me.ground = PLATS[7];
}
function update(dt) {
  if (state !== 'play') return;
  if (msgT > 0) msgT -= dt; waveT += dt;
  // ---- player ----
  let dir = (K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0), flap = K.hit('a');
  if (K.ptr.down) { if (K.ptr.x < W * 0.33) dir = -1; else if (K.ptr.x > W * 0.67) dir = 1; }
  if (K.ptr.tapped) flap = true;
  if (flap) K.beep(260, 0.04, { to: 180, vol: 0.04 });
  fly(me, dt, flap, dir, 120);
  if (me.inv > 0) { me.inv -= dt; if ((dir || flap) && me.inv > 0.6) me.inv = 0.6; }
  if (me.y > LAVA) { loseLife('Fell into the lava'); return; }
  // ---- enemies ----
  foes.forEach(f => {
    const T = TIERS[f.tier];
    if (f.spawn > 0) { f.spawn -= dt; return; }
    if (f.inv > 0) f.inv -= dt;
    f.think -= dt; if (f.think <= 0) { f.think = K.rnd(0.6, 1.4); f.tx = Math.random() < 0.7 ? me.x : K.rnd(0, W); f.ty = K.clamp(me.y + T.aim + K.rnd(-20, 20), 30, 190); }
    let dx = f.tx - f.x; if (Math.abs(dx) > W / 2) dx = -dx;
    const want = Math.abs(dx) > 12 ? Math.sign(dx) : 0;
    f.flapT -= dt; let fl = false;
    if (f.flapT <= 0 && (f.y > (f.ty || 100) || f.vy > 80 || f.y > LAVA - 30)) { fl = true; f.flapT = T.flap * K.rnd(0.7, 1.2); }
    fly(f, dt, fl, want, T.spd);
    if (f.y > LAVA) { f.dead = true; boom(f.x, LAVA, '#ff6a2a', 10); }
  });
  // ---- jousting ----
  foes.forEach(f => {
    if (f.dead || f.spawn > 0) return; let dx = f.x - me.x; if (Math.abs(dx) > W / 2) dx -= Math.sign(dx) * (W + 16);
    if (Math.abs(dx) > 15 || Math.abs(f.y - me.y) > 13) return;
    const diff = f.y - me.y;
    if (Math.abs(diff) < 3 || me.inv > 0 || f.inv > 0) { const s = Math.sign(dx) || 1; me.vx = -s * 90; f.vx = s * 90; me.x -= s * 3; f.x += s * 3; if (me.inv <= 0 && f.inv <= 0) K.beep(1200, 0.05); return; }
    if (diff > 0) { f.dead = true; const T = TIERS[f.tier]; addScore(T.pts); pop(f.x, f.y - 20, T.pts); boom(f.x, f.y - 8, T.col, 14); K.noise(0.2, 0.3); K.beep(800, 0.15, { to: 300 }); eggs.push({ x: f.x, y: f.y - 10, vx: f.vx * 0.5, vy: -60, tier: Math.min(2, f.tier + 1), t: 0, ground: null }); me.vy = Math.min(me.vy, -40); }
    else loseLife();
  });
  if (state !== 'play') return;
  foes = foes.filter(f => !f.dead);
  // ---- eggs ----
  eggs.forEach(e => {
    e.t += dt;
    if (!e.ground) { e.vy = Math.min(200, e.vy + 300 * dt); const oy = e.y; e.x += e.vx * dt; e.y += e.vy * dt; if (e.x < -6) e.x += W + 12; if (e.x > W + 6) e.x -= W + 12;
      for (const p of PLATS) if (e.x > p.x && e.x < p.x + p.w && oy <= p.y && e.y >= p.y) { e.y = p.y; if (e.vy > 80) { e.vy = -e.vy * 0.35; } else { e.vy = 0; e.ground = p; } break; }
      if (e.y > LAVA) e.dead = true; }
    else { e.x += e.vx * dt; e.vx *= Math.pow(0.2, dt); if (e.x < e.ground.x || e.x > e.ground.x + e.ground.w) e.ground = null; }
    let dx = e.x - me.x; if (Math.abs(dx) < 11 && Math.abs(e.y - me.y) < 14) { e.dead = true; eggChain++; const pts = Math.min(1000, 250 * eggChain); addScore(pts); pop(e.x, e.y - 12, pts); K.tune([660, 990], 0.05); }
    if (!e.dead && e.t > 7.5) { e.dead = true; const f = rider(e.x, e.y - 2, e.tier); f.spawn = 0.8; f.inv = 1.4; f.vy = -60; foes.push(f); boom(e.x, e.y - 4, '#fff', 6); K.beep(500, 0.2, { to: 900 }); }
  });
  eggs = eggs.filter(e => !e.dead);
  // ---- the flying beast shows up when a wave drags on ----
  if (!ptero && waveT > 50 && foes.length) { ptero = { x: -30, y: 60, vx: 110, vy: 0, t: 0 }; msg = 'THE BEAST IS COMING!'; msgT = 1.5; K.beep(150, 0.6, { to: 600, type: 'sawtooth' }); }
  if (ptero) { ptero.t += dt; const dy = me.y - 10 - ptero.y; ptero.vy += K.clamp(dy, -60, 60) * dt * 3; ptero.vy *= 0.97; ptero.y += ptero.vy * dt; ptero.x += ptero.vx * dt;
    if (ptero.x > W + 30) { ptero.vx = -Math.abs(ptero.vx); ptero.x = W + 30; } if (ptero.x < -30) { ptero.vx = Math.abs(ptero.vx); ptero.x = -30; }
    let dx = ptero.x - me.x;
    if (Math.abs(dx) < 16 && Math.abs(ptero.y - (me.y - 8)) < 10) {
      const headOn = Math.sign(ptero.vx) === -Math.sign(me.face) && Math.sign(dx) === me.face && Math.abs(ptero.y - (me.y - 10)) < 5;
      if (headOn) { addScore(1000); pop(ptero.x, ptero.y - 10, 1000); boom(ptero.x, ptero.y, '#7aff7a', 24); K.tune([523, 784, 1046], 0.08); ptero = null; waveT = 20; }
      else if (me.inv <= 0) { loseLife('Caught by the beast'); return; } } }
  // ---- wave clear ----
  if (!foes.length && !eggs.length) { const bonus = wave % 5 === 0 ? 3000 : 0; if (bonus) { addScore(bonus); pop(160, 100, 'BONUS ' + bonus); } nextWave(); }
  parts.forEach(p => { p.t -= dt; p.vy += 200 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }); parts = parts.filter(p => p.t > 0);
  pops.forEach(p => { p.t -= dt; p.y -= 20 * dt; }); pops = pops.filter(p => p.t > 0);
  K.set('score', score); K.set('wave', 'WAVE ' + wave); K.set('lives', '♞'.repeat(Math.max(0, lives)));
}
function drawRider(c, r, bird, armor, plume, t) {
  if (r.spawn > 0) { c.globalAlpha = 0.3 + 0.3 * Math.sin(t / 50); }
  if (r.inv > 0 && r.spawn <= 0 && Math.floor(t / 70) % 2) c.globalAlpha = 0.5;
  const x = Math.round(r.x), y = Math.round(r.y), f = r.face;
  // legs
  const run = r.ground && Math.abs(r.vx) > 10 ? Math.sin(t / 50) * 3 : 0;
  c.fillStyle = '#ffb030'; c.fillRect(x - 3 + run, y - 6, 2, 6); c.fillRect(x + 1 - run, y - 6, 2, 6);
  // body + neck + head of the mount
  c.fillStyle = bird; c.beginPath(); c.ellipse(x, y - 10, 8, 5, 0, 0, 7); c.fill();
  c.fillRect(x + f * 5 - 1.5, y - 18, 3, 8); c.fillRect(x + f * 5 - 1.5 + f * 1, y - 20, 4 * f, 3);
  c.fillStyle = '#ffb030'; c.fillRect(x + f * 9 - (f < 0 ? 3 : 0), y - 19, 3, 2);
  // wing
  const up = r.wing > 0 || !r.ground && Math.floor(t / 90) % 2 === 0;
  c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.moveTo(x - f * 2, y - 11); c.lineTo(x - f * 12, up ? y - 20 : y - 4); c.lineTo(x - f * 6, y - 9); c.fill();
  // rider + lance
  c.fillStyle = armor; c.fillRect(x - 3, y - 21, 6, 8); c.fillRect(x - 2, y - 26, 5, 5); c.fillStyle = plume; c.fillRect(x - f * 2 - 1, y - 29, 3, 3);
  c.fillStyle = '#ddd'; c.fillRect(f > 0 ? x + 2 : x - 16, y - 17, 14, 1.5);
  c.globalAlpha = 1;
}
function draw(c, t) {
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0c0a20'); g.addColorStop(1, '#3a1420'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 30; i++) { c.fillStyle = 'rgba(255,255,255,' + (0.2 + (i % 3) * 0.2) + ')'; c.fillRect((i * 83) % W, (i * 47) % 150, 1, 1); }
  // lava
  A.ridge(c, 0, { factor: 0, base: 200, amp: 70, col: '#1a0a18', edge: 'rgba(255,90,40,.35)', seed: 4 });
  A.ridge(c, 30, { factor: 0, base: 215, amp: 40, col: '#2a0e1a', edge: 'rgba(255,120,40,.4)', seed: 9 });
  A.lava(c, 0, LAVA, W, H - LAVA, t); A.glow(c, W / 2, H, 200, '255,90,20', 0.3);
  // ledges
  PLATS.forEach(p => { c.fillStyle = A.INK; c.beginPath(); c.moveTo(p.x + 3, p.y + 7); c.lineTo(p.x + p.w / 2, p.y + 21); c.lineTo(p.x + p.w - 3, p.y + 7); c.fill(); c.fillStyle = '#3a2a2a'; c.beginPath(); c.moveTo(p.x + 5, p.y + 7); c.lineTo(p.x + p.w / 2, p.y + 19); c.lineTo(p.x + p.w - 5, p.y + 7); c.fill(); c.fillStyle = 'rgba(255,120,40,.25)'; c.beginPath(); c.moveTo(p.x + p.w / 2, p.y + 19); c.lineTo(p.x + p.w - 5, p.y + 7); c.lineTo(p.x + p.w / 2, p.y + 9); c.fill();
    for (let x = p.x; x < p.x + p.w; x += 8) A.tile(c, 'wk', x, p.y - 2, { t: true, b: true, l: x === p.x, r: x + 8 >= p.x + p.w }, Math.floor(x / 8), Math.floor(p.y), A.PAL.rock); });
  eggs.forEach(e => { const shake = e.t > 6 ? Math.sin(t / 30) * 1.5 : 0; c.fillStyle = e.t > 6 ? '#ffe0a0' : '#f4f0e0'; c.beginPath(); c.ellipse(e.x + shake, e.y - 4, 3.5, 4.5, 0, 0, 7); c.fill(); });
  foes.forEach(f => drawRider(c, f, '#3a2a2a', TIERS[f.tier].col, TIERS[f.tier].col, t));
  if (state !== 'title') drawRider(c, me, '#ffd84a', '#d0d8e8', '#ffcc33', t);
  if (ptero) { const x = ptero.x, y = ptero.y, f = Math.sign(ptero.vx), fl = Math.sin(t / 60) * 8; c.fillStyle = '#4ac06a'; c.beginPath(); c.moveTo(x - 12 * f, y); c.lineTo(x + 14 * f, y - 2); c.lineTo(x + 6 * f, y + 4); c.fill(); c.beginPath(); c.moveTo(x - 4 * f, y); c.lineTo(x - 2 * f, y - 14 - fl); c.lineTo(x + 6 * f, y); c.fill(); c.fillStyle = '#ff3'; c.fillRect(x + 8 * f, y - 2, 2, 2); c.fillStyle = '#c03030'; c.fillRect(x + 12 * f - (f < 0 ? 4 : 0), y, 4, 2); }
  parts.forEach(p => { c.fillStyle = p.c; c.fillRect(p.x, p.y, 2, 2); });
  pops.forEach(p => K.text(c, String(p.txt), p.x, p.y, 8, '#ffcc33'));
  if (msgT > 0 && state === 'play') K.text(c, msg, W / 2, 100, 14, '#fff');
}
drawRider = A.ink(drawRider);
{ const _draw = draw; draw = function (c, t) { _draw(c, t); A.ambient(c, W, H, t, 'ember', 18); A.vignette(c, W, H, 0.4); }; }
start(); state = 'title'; title(); K.run(update, draw);
</script>
</body>
