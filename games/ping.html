<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: full-screen table on a canvas, your paddle at the bottom and the other at the top; drag anywhere on your half to move; scores glow in each half */
:root {
  --panel: #0a1a1f;
  --panel-fg: #e8fbff;
  --lime: #b8ff3c;
  --lime-deep: #5e8f00;
  --pink: #ff4fa3;
  --cyan: #2fe8ff;
  --display: "Bungee", "Impact", system-ui, sans-serif;
  --body: "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--panel); color: var(--panel-fg); font-family: var(--body); touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overflow: hidden; }
.game { position: relative; height: 100%; min-height: 480px; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(10,26,31,.78); text-align: center; }
.card { max-width: 330px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.card h1, .card h2 { font-family: var(--display); margin: 0; line-height: 1; color: var(--lime); text-shadow: 0 0 18px rgba(184,255,60,.55), 0 4px 0 var(--lime-deep); }
.card h1 { font-size: clamp(3rem, 18vw, 4.4rem); }
.card h2 { font-size: clamp(1.8rem, 9vw, 2.4rem); }
.card p { margin: 0; line-height: 1.45; }
.choices { display: grid; gap: 10px; width: 100%; }
.btn { font-family: var(--display); font-size: 1.05rem; color: #06140a; background: var(--lime); border: 0; border-radius: 12px; padding: 13px 20px; cursor: pointer; box-shadow: 0 6px 0 var(--lime-deep); }
.btn.alt { background: var(--cyan); box-shadow: 0 6px 0 #0f7f8f; }
.btn.pink { background: var(--pink); color: #fff; box-shadow: 0 6px 0 #9b1f5e; }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--lime-deep); }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.small { font-size: .85rem; opacity: .8; }
.pause { position: absolute; top: 10px; right: 12px; width: 40px; height: 40px; border-radius: 12px; border: 0; background: rgba(255,255,255,.1); color: #fff; font-family: var(--display); cursor: pointer; }
</style>

<div class="game" id="game">
  <canvas id="cv"></canvas>
  <button class="pause" id="pauseBtn" aria-label="Pause" hidden>II</button>
  <div class="overlay" id="start">
    <div class="card">
      <h1>Ping</h1>
      <p>Drag your finger anywhere on your half of the table to move your paddle. Hit the ball near the edge of your paddle to angle it. First to 7 wins.</p>
      <div class="choices">
        <button class="btn" data-mode="easy">vs Computer: Easy</button>
        <button class="btn alt" data-mode="hard">vs Computer: Hard</button>
        <button class="btn pink" data-mode="2p">2 Players (one phone)</button>
      </div>
      <p class="small" id="best"></p>
    </div>
  </div>
  <div class="overlay" id="over" hidden>
    <div class="card">
      <h2 id="overTitle">You Win!</h2>
      <p id="overText"></p>
      <div class="choices">
        <button class="btn" id="again">Play Again</button>
        <button class="btn alt" id="menu">Change Mode</button>
      </div>
    </div>
  </div>
  <div class="overlay" id="paused" hidden>
    <div class="card">
      <h2>Paused</h2>
      <div class="choices">
        <button class="btn" id="resume">Keep Playing</button>
        <button class="btn alt" id="quit">Quit to Menu</button>
      </div>
    </div>
  </div>
</div>

<script>
window.addEventListener('error', function (e) { var c = document.getElementById('overTitle'); if (c) { document.getElementById('over').hidden = false; c.textContent = 'Error'; document.getElementById('overText').textContent = e.message; } });
(function () {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), game = $('game');
  let W = 0, H = 0, U = 1;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = game.clientWidth; H = game.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    U = Math.min(W, H) / 400;
    if (bot) { bot.y = H - 46 * U; top.y = 46 * U; bot.w = top.w = Math.max(70, W * .26); }
  }

  // ---------- sound ----------
  let ac = null;
  function audio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} }
  function tone(f, len, type, vol, at) {
    if (!ac) return; const t = ac.currentTime + (at || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + len);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + len + .02);
  }
  const sfx = {
    paddle: s => tone(440 + Math.min(500, s * .5), .07, 'square', .09),
    wall: () => tone(300, .05, 'square', .06),
    point: good => (good ? [660, 880] : [330, 247]).forEach((n, i) => tone(n, .14, 'triangle', .1, i * .12)),
    win: () => [523, 659, 784, 1047, 1319].forEach((n, i) => tone(n, .16, 'square', .08, i * .11))
  };

  // ---------- state ----------
  let mode = 'easy', phase = 'title', serveT = 0, serveDir = 1, bot = null, top = null, ball = null, trail = [], parts = [], flash = 0, msg = '', msgT = 0, rally = 0, bestRally = 0;
  const WIN = 7;
  try { bestRally = +localStorage.getItem('ping-best-rally') || 0; } catch (e) {}
  function paddle(y, color) { return { x: W / 2, tx: W / 2, y, w: Math.max(70, W * .26), color, score: 0, glow: 0 }; }
  function newMatch(m) {
    mode = m; bot = paddle(H - 46 * U, '#b8ff3c'); top = paddle(46 * U, m === '2p' ? '#ff4fa3' : '#2fe8ff');
    serveDir = Math.random() < .5 ? 1 : -1; serve(); phase = 'play'; $('pauseBtn').hidden = false;
  }
  function serve() {
    ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: 8 * U, sp: 290 * U }; trail = []; rally = 0;
    serveT = 1.1;
  }
  function launch() {
    const a = (Math.random() - .5) * .9;
    ball.vx = Math.sin(a) * ball.sp; ball.vy = Math.cos(a) * ball.sp * serveDir;
  }
  function showMsg(t) { msg = t; msgT = 1.1; }
  function point(winnerBottom) {
    const p = winnerBottom ? bot : top; p.score++;
    sfx.point(mode === '2p' ? true : winnerBottom);
    burst(ball.x, winnerBottom ? 0 : H, winnerBottom ? '#b8ff3c' : top.color, 30);
    if (rally > bestRally && mode !== '2p') { bestRally = rally; try { localStorage.setItem('ping-best-rally', bestRally); } catch (e) {} }
    if (p.score >= WIN) return endMatch(winnerBottom);
    showMsg(mode === '2p' ? (winnerBottom ? 'Green scores!' : 'Pink scores!') : (winnerBottom ? 'Point!' : 'Computer scores'));
    serveDir = winnerBottom ? -1 : 1; serve();
  }
  function endMatch(bottomWon) {
    phase = 'over'; $('pauseBtn').hidden = true; sfx.win();
    const t = mode === '2p' ? (bottomWon ? 'Green Wins!' : 'Pink Wins!') : (bottomWon ? 'You Win!' : 'Computer Wins');
    $('overTitle').textContent = t;
    $('overText').textContent = 'Final score ' + bot.score + ' to ' + top.score + '.' + (mode !== '2p' ? ' Longest rally ever: ' + bestRally + ' hits.' : '');
    setTimeout(() => { $('over').hidden = false; }, 600);
  }
  function burst(x, y, col, n) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = (60 + Math.random() * 220) * U; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: .6, c: col }); } }

  // ---------- input ----------
  const pointers = new Map();
  function setTarget(e) {
    if (phase !== 'play') return;
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    if (y > H / 2 || mode !== '2p') bot.tx = x; else top.tx = x;
    if (mode === '2p' && y <= H / 2) top.tx = x;
  }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); audio(); pointers.set(e.pointerId, true); try { cv.setPointerCapture(e.pointerId); } catch (_) {} setTarget(e); });
  cv.addEventListener('pointermove', e => { if (pointers.has(e.pointerId) || e.pointerType === 'mouse') setTarget(e); });
  const up = e => pointers.delete(e.pointerId);
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  const keys = {};
  addEventListener('keydown', e => { keys[e.code] = true; if (['ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault(); audio(); });
  addEventListener('keyup', e => { keys[e.code] = false; });

  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { audio(); $('start').hidden = true; newMatch(b.dataset.mode); }));
  $('again').addEventListener('click', () => { $('over').hidden = true; newMatch(mode); });
  $('menu').addEventListener('click', () => { $('over').hidden = true; $('start').hidden = false; phase = 'title'; });
  $('pauseBtn').addEventListener('click', () => { if (phase === 'play') { phase = 'paused'; $('paused').hidden = false; } });
  $('resume').addEventListener('click', () => { $('paused').hidden = true; phase = 'play'; });
  $('quit').addEventListener('click', () => { $('paused').hidden = true; $('start').hidden = false; $('pauseBtn').hidden = true; phase = 'title'; });

  // ---------- update ----------
  function movePaddle(p, dt, maxSp) {
    const d = p.tx - p.x, step = maxSp * dt;
    p.x += Math.abs(d) <= step ? d : Math.sign(d) * step;
    p.x = Math.max(p.w / 2, Math.min(W - p.w / 2, p.x));
    p.glow = Math.max(0, p.glow - dt * 3);
  }
  function bounce(p, dir) {
    const off = Math.max(-1, Math.min(1, (ball.x - p.x) / (p.w / 2)));
    ball.sp = Math.min(ball.sp * 1.06, 900 * U);
    const a = off * 1.05;
    ball.vx = Math.sin(a) * ball.sp; ball.vy = Math.cos(a) * ball.sp * dir;
    p.glow = 1; flash = .08; rally++; sfx.paddle(ball.sp / U);
    burst(ball.x, ball.y, p.color, 8);
  }
  function update(dt) {
    parts.forEach(q => { q.t -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= .95; q.vy *= .95; }); parts = parts.filter(q => q.t > 0);
    if (msgT > 0) msgT -= dt; if (flash > 0) flash -= dt;
    if (phase !== 'play') return;
    // keyboard
    if (keys.ArrowLeft) bot.tx = bot.x - 60; if (keys.ArrowRight) bot.tx = bot.x + 60;
    if (mode === '2p') { if (keys.KeyA) top.tx = top.x - 60; if (keys.KeyD) top.tx = top.x + 60; }
    movePaddle(bot, dt, 2400 * U);
    if (mode === '2p') movePaddle(top, dt, 2400 * U);
    else {
      const hard = mode === 'hard';
      if (ball.vy < 0) {
        const lead = hard ? (ball.y - top.y) / Math.max(1, -ball.vy) : 0;
        let px = ball.x + ball.vx * lead * .9;
        while (px < 0 || px > W) px = px < 0 ? -px : 2 * W - px;
        top.tx = px + (hard ? 0 : Math.sin(performance.now() / 400) * top.w * .35);
      } else top.tx = W / 2;
      movePaddle(top, dt, (hard ? 520 : 260) * U + (hard ? 0 : bot.score * 10 * U));
    }
    if (serveT > 0) { serveT -= dt; if (serveT <= 0) launch(); return; }
    // ball, in small steps so fast balls don't tunnel
    const steps = Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / (ball.r * .8));
    for (let i = 0; i < steps; i++) {
      const h = dt / steps;
      ball.x += ball.vx * h; ball.y += ball.vy * h;
      if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); sfx.wall(); }
      if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); sfx.wall(); }
      const ph = 7 * U;
      if (ball.vy > 0 && ball.y + ball.r >= bot.y - ph && ball.y < bot.y + ph && Math.abs(ball.x - bot.x) < bot.w / 2 + ball.r) { ball.y = bot.y - ph - ball.r; bounce(bot, -1); }
      if (ball.vy < 0 && ball.y - ball.r <= top.y + ph && ball.y > top.y - ph && Math.abs(ball.x - top.x) < top.w / 2 + ball.r) { ball.y = top.y + ph + ball.r; bounce(top, 1); }
      if (ball.y > H + ball.r * 2) { point(false); return; }
      if (ball.y < -ball.r * 2) { point(true); return; }
    }
    trail.push({ x: ball.x, y: ball.y }); if (trail.length > 12) trail.shift();
  }

  // ---------- draw ----------
  function glowRect(p) {
    const h = 14 * U, x = p.x - p.w / 2, y = p.y - h / 2;
    ctx.save(); ctx.shadowColor = p.color; ctx.shadowBlur = 14 + p.glow * 20;
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, p.w, h, h / 2) : ctx.rect(x, y, p.w, h); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(x + h / 2, y + 2 * U, p.w - h, 2.5 * U);
  }
  function draw(now) {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0d2a2f'); g.addColorStop(.5, '#0a1a1f'); g.addColorStop(1, '#0d2a2f');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // table lines
    ctx.strokeStyle = 'rgba(232,251,255,.16)'; ctx.lineWidth = 3 * U; ctx.strokeRect(10 * U, 10 * U, W - 20 * U, H - 20 * U);
    ctx.beginPath(); ctx.moveTo(W / 2, 10 * U); ctx.lineTo(W / 2, H - 10 * U); ctx.lineWidth = 1.5 * U; ctx.stroke();
    // net
    ctx.fillStyle = 'rgba(232,251,255,.35)';
    for (let x = 12 * U; x < W - 12 * U; x += 18 * U) ctx.fillRect(x, H / 2 - 2 * U, 10 * U, 4 * U);
    if (!bot) return;
    // scores
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = Math.round(92 * U) + 'px Bungee, Impact, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.07)';
    ctx.fillText(top.score, W / 2, H * .27); ctx.fillText(bot.score, W / 2, H * .73);
    ctx.font = '700 ' + Math.round(12 * U) + 'px Nunito, system-ui, sans-serif'; ctx.fillStyle = 'rgba(232,251,255,.45)';
    ctx.fillText(mode === '2p' ? 'PINK' : 'COMPUTER', W / 2, H * .27 + 58 * U);
    ctx.fillText(mode === '2p' ? 'GREEN' : 'YOU', W / 2, H * .73 - 58 * U);
    // trail + ball
    trail.forEach((t, i) => { ctx.globalAlpha = i / trail.length * .35; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(t.x, t.y, ball.r * (i / trail.length), 0, 7); ctx.fill(); });
    ctx.globalAlpha = 1;
    if (ball && !(serveT > 0 && Math.floor(serveT * 8) % 2)) {
      ctx.save(); ctx.shadowColor = '#fff'; ctx.shadowBlur = 16; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 7); ctx.fill(); ctx.restore();
    }
    glowRect(top); glowRect(bot);
    parts.forEach(q => { ctx.globalAlpha = Math.max(0, q.t / .6); ctx.fillStyle = q.c; ctx.fillRect(q.x - 2 * U, q.y - 2 * U, 4 * U, 4 * U); });
    ctx.globalAlpha = 1;
    if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + flash + ')'; ctx.fillRect(0, 0, W, H); }
    if (rally >= 5 && phase === 'play') { ctx.font = Math.round(14 * U) + 'px Bungee, Impact, sans-serif'; ctx.fillStyle = '#b8ff3c'; ctx.fillText('Rally ' + rally, W * .18 + 20 * U, H / 2 - 18 * U); }
    if (msgT > 0) {
      ctx.globalAlpha = Math.min(1, msgT * 2); ctx.font = Math.round(26 * U) + 'px Bungee, Impact, sans-serif';
      ctx.fillStyle = '#fff'; ctx.shadowColor = '#000'; ctx.shadowBlur = 8; ctx.fillText(msg, W / 2, H / 2 - 40 * U); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
  }

  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (game.clientWidth !== W || game.clientHeight !== H) resize();
    if (!W || !H) return;
    const dt = Math.min(.033, (now - last) / 1000); last = now;
    update(dt); draw(now);
  }
  $('best').textContent = bestRally ? 'Longest rally vs computer: ' + bestRally + ' hits' : '';
  requestAnimationFrame(frame);
})();
</script>

</body></html>
