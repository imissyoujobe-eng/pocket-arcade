<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apex Grand Prix</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script>
// Apex Grand Prix: Formula racing from behind the wheel. Run a qualifying lap to earn your grid spot, then race three laps against the field.
K.theme({ bg: '#101826', ink: '#f4f6ff', accent: '#ff3b3b', accentInk: '#fff' });
const W = 320, H = 240, SEG = 100, RW = 1000, CAMH = 900, DEPTH = 0.84, DRAW = 110, MAXV = SEG * 62;
K.screen(W, H, { smooth: true });
K.hud(['mode', 'pos', 'time']);
K.pad({ dpad: '4', buttons: [{ id: 'b', label: 'BRAKE' }, { id: 'a', label: 'GAS' }] });

let segs = [], LEN = 0;
function addRoad(n, curve) { for (let i = 0; i < n; i++) { const k = i < n / 4 ? i / (n / 4) : i > n * 3 / 4 ? (n - i) / (n / 4) : 1; segs.push({ curve: curve * k, signs: [] }); } }
addRoad(120, 0); addRoad(160, 3); addRoad(90, 0); addRoad(140, -4); addRoad(70, 0); addRoad(120, 5); addRoad(100, -2); addRoad(160, -5); addRoad(80, 0); addRoad(140, 3.5); addRoad(140, 0);
LEN = segs.length * SEG;
for (let i = 10; i < segs.length; i += 9) { segs[i].signs.push({ x: (i % 18 ? -1 : 1) * (1.5 + (i % 5) * 0.12), k: i % 27 === 0 ? 'board' : 'post' }); }
const segAt = z => segs[Math.floor(((z % LEN) + LEN) % LEN / SEG)];

let state = 'title', mode, pos, v, px, gear, laps, lapT, raceT, qualTime, grid, cars, crashT, msg, msgT, best = K.best('apexgp'), steerVis = 0, sky = 0;
function title() { K.card({ title: 'APEX GRAND PRIX', text: 'Hold GAS, BRAKE for the corners and steer with ◀ ▶. Press ▲ for HIGH gear once you are moving fast, ▼ for LOW. First run a qualifying lap: the faster you go, the better you start. Then race 3 laps and beat the field. Stay off the grass and away from the signs!', best: best ? 'BEST LAP ' + (best / 100).toFixed(2) + 's' : '', button: 'Qualify', onStart: startQual }); }
function reset() { pos = 0; v = 0; px = 0; gear = 0; lapT = 0; crashT = 0; }
function startQual() { reset(); mode = 'qual'; cars = []; laps = 0; raceT = -3; say('QUALIFYING LAP', 2); state = 'play'; }
function startRace() {
  reset(); mode = 'race'; laps = 0; raceT = -3;
  cars = []; for (let i = 0; i < 7; i++) { const row = i < grid ? i : i + 1; cars.push({ z: (8 - row) * SEG * 6 + SEG * 4, x: (row % 2 ? 0.45 : -0.45), v: MAXV * (0.8 + i * 0.022), col: ['#3fa9ff', '#ffd23f', '#7cff6b', '#ff8a1f', '#c07bff', '#fff', '#ff4fa3'][i], lap: 0 }); }
  pos = (8 - grid) * SEG * 6 + SEG * 4 - SEG * 6; if (pos < 0) pos = 0;
  say('GRID POSITION ' + (grid + 1), 2); state = 'play';
}
function say(t, d) { msg = t; msgT = d || 1.4; }
function place() { const me = laps * LEN + pos; return 1 + cars.filter(c => c.lap * LEN + c.z > me).length; }
function hud() {
  K.set('mode', mode === 'qual' ? 'QUALIFY' : 'LAP ' + Math.min(3, laps + 1) + '/3');
  K.set('pos', mode === 'qual' ? (gear ? 'HIGH' : 'LOW') : 'P' + place());
  K.set('time', Math.max(0, raceT).toFixed(1) + 's');
}

function update(dt) {
  if (state !== 'play') return;
  if (msgT > 0) msgT -= dt;
  if (raceT < 0) { const b = Math.ceil(raceT); raceT += dt; if (Math.ceil(raceT) !== b) K.beep(b === 0 ? 880 : 440, b === 0 ? 0.4 : 0.15, { vol: 0.07 }); hud(); return; }
  raceT += dt; lapT += dt;
  const seg = segAt(pos), pct = v / MAXV;
  if (K.hit('up') && gear === 0) { gear = 1; K.beep(300, 0.08, { vol: 0.05 }); }
  if (K.hit('down') && gear === 1) { gear = 0; K.beep(200, 0.08, { vol: 0.05 }); }
  if (crashT > 0) { crashT -= dt; v = 0; if (crashT <= 0) { px = K.clamp(px, -0.8, 0.8); say('GO!', 0.6); } }
  else {
    const top = gear ? MAXV : MAXV * 0.55, acc = gear ? (pct < 0.4 ? MAXV * 0.08 : MAXV * 0.28) : MAXV * 0.45;
    if (K.down('a') || (K.ptr.down && K.ptr.y < H * 0.6)) v += (v < top ? acc : -MAXV * 0.3) * dt;
    else if (K.down('b')) v -= MAXV * 0.9 * dt;
    else v -= MAXV * 0.18 * dt;
    let st = (K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0);
    if (K.ptr.down && K.ptr.y >= H * 0.6) st = K.ptr.x < W / 2 ? -1 : 1;
    px += st * dt * 2.2 * pct; steerVis += (st - steerVis) * Math.min(1, dt * 10);
    px -= dt * 2.2 * pct * pct * seg.curve * 0.32;
    if (Math.abs(px) > 1) { if (v > MAXV * 0.3) v -= MAXV * 0.9 * dt; for (const s of seg.signs) if (Math.abs(px - s.x) < 0.35) crash('CRASHED INTO A SIGN!'); }
    px = K.clamp(px, -2.4, 2.4); v = K.clamp(v, 0, MAXV);
    for (const c of cars) { const dz = ((c.z - pos) % LEN + LEN) % LEN; if (dz < SEG * 1.2 && c.lap * LEN + c.z >= laps * LEN + pos - SEG && Math.abs(c.x - px) < 0.42 && v > c.v * 0.9) { crash('CRASH!'); c.v *= 0.9; } }
  }
  const before = pos; pos += v * dt;
  if (pos >= LEN) { pos -= LEN; laps++; if (mode === 'qual') return endQual(); K.tune([660, 880], 0.08); best = K.saveBest('apexgp', Math.round(lapT * 100), true); lapT = 0; if (laps >= 3) return endRace(); say('LAP ' + (laps + 1), 1); }
  // the field
  for (const c of cars) {
    const cs = segAt(c.z); let target = c.v * (1 - Math.abs(cs.curve) * 0.02);
    c.z += target * dt; if (c.z >= LEN) { c.z -= LEN; c.lap++; }
    const want = -cs.curve * 0.08 + (Math.sin(c.z / 3000 + c.v) * 0.3);
    c.x += (K.clamp(want, -0.7, 0.7) - c.x) * dt * 0.8;
  }
  if (Math.random() < 0.5) K.beep(60 + pct * 220 * (gear ? 0.8 : 1.4), 0.04, { type: 'sawtooth', vol: 0.02 });
  sky += seg.curve * pct * dt * 0.02;

}
function crash(t) { if (crashT > 0) return; crashT = 1.5; v = 0; say(t, 1.4); K.noise(0.6, 0.45); }
function endQual() {
  state = 'over'; qualTime = lapT; const cut = [21, 22, 23, 24.5, 26, 28, 30];
  grid = cut.findIndex(c => qualTime < c); if (grid < 0) grid = 7;
  best = K.saveBest('apexgp', Math.round(qualTime * 100), true);
  K.card({ title: 'QUALIFIED P' + (grid + 1), text: 'Your lap: ' + qualTime.toFixed(2) + ' seconds. Pole position takes under 21 seconds. Now race 3 laps against 7 cars!', best: 'BEST LAP ' + (best / 100).toFixed(2) + 's', button: 'Start race', onStart: startRace });
}
function endRace() {
  state = 'over'; const p = place(); K.tune(p === 1 ? [523, 659, 784, 1047, 1319] : [523, 659, 784], 0.1);
  K.card({ title: p === 1 ? 'YOU WIN!' : 'FINISHED P' + p, text: '3 laps in ' + raceT.toFixed(2) + ' seconds.' + (p === 1 ? ' Champagne time!' : ' Qualify faster to start further up.'), best: 'BEST LAP ' + (best / 100).toFixed(2) + 's', button: 'Qualify again', onStart: startQual });
}

function project(z, x, camX, camZ) { const cz = z - camZ; const s = DEPTH / Math.max(1, cz); return { x: W / 2 + s * (x - camX) * W / 2, y: H / 2 + s * CAMH * H / 2, w: s * RW * W / 2, s }; }
function quad(c, x1, y1, w1, x2, y2, w2, col) { c.fillStyle = col; c.beginPath(); c.moveTo(x1 - w1, y1); c.lineTo(x2 - w2, y2); c.lineTo(x2 + w2, y2); c.lineTo(x1 + w1, y1); c.fill(); }
function hsh(i, k) { const v = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return v - Math.floor(v); }
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; if (k < 0) { r *= 1 + k; g *= 1 + k; b *= 1 + k; } else { r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; } return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')'; }
// a formula car seen from behind: fat rear tyres, engine cover, halo, airbox, rear wing with endplates, rain light
function drawCar(c, x, y, w, col, me, tilt) {
  const h = w * 0.5; c.save(); c.translate(x, y); if (tilt) c.rotate(tilt * 0.04);
  c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(0, -h * 0.02, w * 0.62, h * 0.12, 0, 0, 7); c.fill();
  // rear tyres with sidewall stripe
  for (const sd of [-1, 1]) { const tx = sd * w * 0.44; const tg = c.createLinearGradient(tx - w * 0.12, 0, tx + w * 0.12, 0); tg.addColorStop(0, '#0c0c0e'); tg.addColorStop(0.5, '#2a2a30'); tg.addColorStop(1, '#0c0c0e'); c.fillStyle = tg; c.beginPath(); c.roundRect(tx - w * 0.12, -h * 0.78, w * 0.24, h * 0.78, w * 0.03); c.fill(); c.fillStyle = me ? '#ffd23f' : '#d8d8d8'; c.fillRect(tx - w * 0.12, -h * 0.42, w * 0.24, h * 0.04); }
  // diffuser and floor
  c.fillStyle = '#18181c'; c.fillRect(-w * 0.32, -h * 0.28, w * 0.64, h * 0.26); c.fillStyle = '#2a2a30'; for (let k = -2; k <= 2; k++) c.fillRect(k * w * 0.1 - w * 0.01, -h * 0.28, w * 0.02, h * 0.26);
  // body / engine cover tapering up to the airbox
  const bg = c.createLinearGradient(-w * 0.3, 0, w * 0.3, 0); bg.addColorStop(0, shade(col, -0.35)); bg.addColorStop(0.45, shade(col, 0.15)); bg.addColorStop(1, shade(col, -0.4));
  c.fillStyle = bg; c.beginPath(); c.moveTo(-w * 0.32, -h * 0.28); c.lineTo(-w * 0.2, -h * 0.72); c.lineTo(-w * 0.07, -h * 1.02); c.lineTo(w * 0.07, -h * 1.02); c.lineTo(w * 0.2, -h * 0.72); c.lineTo(w * 0.32, -h * 0.28); c.fill();
  c.fillStyle = 'rgba(255,255,255,.85)'; c.fillRect(-w * 0.015, -h * 0.98, w * 0.03, h * 0.66);
  // halo and helmet
  c.strokeStyle = '#1a1a1e'; c.lineWidth = Math.max(1, w * 0.025); c.beginPath(); c.ellipse(0, -h * 1.0, w * 0.13, h * 0.12, 0, Math.PI, 0); c.stroke();
  c.fillStyle = me ? '#ffd23f' : shade(col, 0.5); c.beginPath(); c.arc(0, -h * 0.99, w * 0.075, Math.PI, 0); c.fill();
  // rear wing: endplates, main plane, DRS flap, centre pylon
  c.fillStyle = '#121216'; c.fillRect(-w * 0.03, -h * 1.0, w * 0.06, h * 0.32);
  c.fillStyle = shade(col, -0.45); c.fillRect(-w * 0.52, -h * 1.32, w * 0.06, h * 0.5); c.fillRect(w * 0.46, -h * 1.32, w * 0.06, h * 0.5);
  const wg = c.createLinearGradient(0, -h * 1.28, 0, -h * 1.08); wg.addColorStop(0, shade(col, 0.2)); wg.addColorStop(1, shade(col, -0.3)); c.fillStyle = wg; c.fillRect(-w * 0.48, -h * 1.28, w * 0.96, h * 0.18);
  c.fillStyle = '#1a1a1e'; c.fillRect(-w * 0.48, -h * 1.09, w * 0.96, h * 0.05);
  c.fillStyle = 'rgba(255,255,255,.9)'; c.font = 'bold ' + Math.max(5, w * 0.11) + 'px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; if (w > 30) c.fillText(me ? 'APEX' : '', 0, -h * 1.19);
  // blinking rain light
  c.fillStyle = Math.floor(performance.now() / 160) % 2 ? '#ff2a2a' : '#7a0a0a'; c.fillRect(-w * 0.04, -h * 0.36, w * 0.08, h * 0.07);
  c.restore();
}
function draw(c, t) {
  // sky with sun and drifting clouds
  const g = c.createLinearGradient(0, 0, 0, H / 2); g.addColorStop(0, '#1a5ac8'); g.addColorStop(0.7, '#7ab8f0'); g.addColorStop(1, '#d8eeff'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  const sunX = W * 0.78 - sky * 120; const sg = c.createRadialGradient(sunX, 30, 0, sunX, 30, 50); sg.addColorStop(0, 'rgba(255,250,220,1)'); sg.addColorStop(0.2, 'rgba(255,240,200,.9)'); sg.addColorStop(1, 'rgba(255,240,200,0)'); c.fillStyle = sg; c.fillRect(sunX - 50, -20, 100, 100);
  c.fillStyle = 'rgba(255,255,255,.85)'; for (let i = 0; i < 5; i++) { const cx = ((i * 97 - sky * 260 + t / (300 + i * 60)) % (W + 120) + W + 120) % (W + 120) - 60, cy = 18 + (i % 3) * 14; c.beginPath(); c.arc(cx, cy, 9, 0, 7); c.arc(cx + 11, cy - 5, 11, 0, 7); c.arc(cx + 24, cy, 8, 0, 7); c.ellipse(cx + 12, cy + 3, 17, 6, 0, 0, 7); c.fill(); }
  // far mountains with snow caps, then nearer hills with trees
  c.fillStyle = '#7a8cb8'; c.beginPath(); c.moveTo(0, H / 2); for (let x = 0; x <= W; x += 6) c.lineTo(x, H / 2 - 18 - Math.abs(Math.sin((x + sky * 400) / 46)) * 30 - Math.sin((x + sky * 400) / 17) * 4); c.lineTo(W, H / 2); c.fill();
  c.fillStyle = '#4a8a4a'; c.beginPath(); c.moveTo(0, H / 2); for (let x = 0; x <= W; x += 6) c.lineTo(x, H / 2 - 6 - Math.abs(Math.sin((x + sky * 700) / 70)) * 10); c.lineTo(W, H / 2); c.fill();
  for (let i = 0; i < 40; i++) { const tx = ((i * 23 - sky * 700) % (W + 20) + W + 20) % (W + 20) - 10, ty = H / 2 - 4 - Math.abs(Math.sin((tx + sky * 700) / 70)) * 8; c.fillStyle = i % 2 ? '#2f6a32' : '#3a7a3a'; c.beginPath(); c.moveTo(tx, ty - 9); c.lineTo(tx - 3, ty); c.lineTo(tx + 3, ty); c.fill(); }
  c.fillStyle = '#4e9a3a'; c.fillRect(0, H / 2, W, H / 2);
  if (state === 'title') return;
  const base = Math.floor(pos / SEG), bpct = (pos % SEG) / SEG; let x = 0, dx = -segs[base % segs.length].curve * bpct, maxy = H;
  const proj = [];
  for (let n = 0; n < DRAW; n++) {
    const i = (base + n) % segs.length, s = segs[i], z1 = (base + n) * SEG, z2 = z1 + SEG;
    const p1 = project(z1, -x, px * RW, pos - SEG * 0.2), p2 = project(z2, -x - dx, px * RW, pos - SEG * 0.2);
    x += dx; dx += s.curve; proj.push({ i, p1, p2, clip: maxy });
    if (p2.y >= maxy || p1.y <= H / 2) continue;
    const light = Math.floor((base + n) / 3) % 2, fog = Math.min(1, n / DRAW);
    // grass stripes, then a runoff strip of sand/gravel, kerbs, track with tyre marks
    c.fillStyle = light ? '#58a640' : '#4c9636'; c.fillRect(0, p2.y, W, Math.min(p1.y, maxy) - p2.y);
    quad(c, p1.x, p1.y, p1.w * 1.55, p2.x, p2.y, p2.w * 1.55, light ? '#d8c48a' : '#ccb87e');
    quad(c, p1.x, p1.y, p1.w * 1.14, p2.x, p2.y, p2.w * 1.14, light ? '#f0f0f0' : '#e63946');
    quad(c, p1.x, p1.y, p1.w, p2.x, p2.y, p2.w, light ? '#5e5e66' : '#585860');
    quad(c, p1.x - p1.w * 0.35, p1.y, p1.w * 0.12, p2.x - p2.w * 0.35, p2.y, p2.w * 0.12, 'rgba(20,20,24,.25)');
    quad(c, p1.x + p1.w * 0.35, p1.y, p1.w * 0.12, p2.x + p2.w * 0.35, p2.y, p2.w * 0.12, 'rgba(20,20,24,.25)');
    quad(c, p1.x - p1.w * 0.96, p1.y, p1.w * 0.015, p2.x - p2.w * 0.96, p2.y, p2.w * 0.015, '#fff'); quad(c, p1.x + p1.w * 0.96, p1.y, p1.w * 0.015, p2.x + p2.w * 0.96, p2.y, p2.w * 0.015, '#fff');
    if (i < 3) { const cells = 10; for (let k = 0; k < cells; k++) { const f0 = -1 + k * 2 / cells, f1 = f0 + 2 / cells; c.fillStyle = (k + (n % 2)) % 2 ? '#111' : '#fff'; c.beginPath(); c.moveTo(p1.x + p1.w * f0, p1.y); c.lineTo(p2.x + p2.w * f0, p2.y); c.lineTo(p2.x + p2.w * f1, p2.y); c.lineTo(p1.x + p1.w * f1, p1.y); c.fill(); } }
    if (fog > 0.4) { c.fillStyle = 'rgba(200,225,255,' + (fog - 0.4) * 0.7 + ')'; c.fillRect(0, p2.y, W, Math.min(p1.y, maxy) - p2.y); }
    maxy = p2.y;
  }
  // roadside objects and cars, far to near
  for (let n = proj.length - 1; n >= 0; n--) {
    const { i, p1 } = proj[n]; if (p1.y > H || p1.y < H / 2) continue;
    // tyre barriers every few segments, trees and grandstands further out
    if (i % 4 === 0) for (const sd of [-1, 1]) { const bx = p1.x + sd * p1.w * 1.65, bw = p1.w * 0.22, bh = p1.w * 0.1; for (let k = 0; k < 3; k++) { c.fillStyle = k % 2 ? '#e63946' : '#1a1a1e'; c.fillRect(bx - bw / 2, p1.y - bh * (k + 1), bw, bh); } }
    if (i % 7 === 3) for (const sd of [-1, 1]) { const tx = p1.x + sd * p1.w * (3.4 + hsh(i, sd) * 1.8), th = p1.w * 0.75; c.fillStyle = '#5a3a1e'; c.fillRect(tx - th * 0.04, p1.y - th * 0.4, th * 0.08, th * 0.4); c.fillStyle = '#2f7a32'; c.beginPath(); c.arc(tx, p1.y - th * 0.6, th * 0.3, 0, 7); c.fill(); c.fillStyle = '#3f9a42'; c.beginPath(); c.arc(tx - th * 0.08, p1.y - th * 0.7, th * 0.16, 0, 7); c.fill(); }
    if (i % 60 === 20) { const sd = i % 120 === 20 ? 1 : -1, gx = p1.x + sd * p1.w * 3.2, gw = p1.w * 2.2, gh = p1.w * 0.9; c.fillStyle = '#5a6070'; c.fillRect(gx - gw / 2, p1.y - gh, gw, gh); for (let r = 0; r < 4; r++) for (let k = 0; k < 18; k++) { c.fillStyle = ['#e63946', '#ffd23f', '#3fa9ff', '#fff', '#7cff6b'][(k * 3 + r + i) % 5]; c.fillRect(gx - gw / 2 + k * gw / 18 + 1, p1.y - gh + r * gh / 4 + 2, Math.max(1, gw / 18 - 2), Math.max(1, gh / 4 - 4)); } c.fillStyle = '#c8ccd8'; c.fillRect(gx - gw / 2 - 2, p1.y - gh - gh * 0.15, gw + 4, gh * 0.15); }
    for (const sg of segs[i].signs) { const sx = p1.x + sg.x * p1.w, h = p1.w * (sg.k === 'board' ? 0.9 : 0.5); if (sg.k === 'board') { c.fillStyle = '#555'; c.fillRect(sx - h * 0.5, p1.y - h, h * 0.06, h); c.fillRect(sx + h * 0.44, p1.y - h, h * 0.06, h); c.fillStyle = '#1a1a1e'; c.fillRect(sx - h * 0.75, p1.y - h * 1.4, h * 1.5, h * 0.55); c.fillStyle = '#ffd23f'; c.fillRect(sx - h * 0.7, p1.y - h * 1.35, h * 1.4, h * 0.45); c.fillStyle = '#e63946'; c.font = 'bold ' + Math.max(4, h * 0.3) + 'px Impact, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('APEX', sx, p1.y - h * 1.12); } else { c.fillStyle = '#fff'; c.fillRect(sx - h * 0.05, p1.y - h, h * 0.1, h); c.fillStyle = '#e63946'; c.fillRect(sx - h * 0.05, p1.y - h, h * 0.1, h * 0.2); c.fillStyle = '#fff'; c.font = Math.max(3, h * 0.12) + 'px sans-serif'; } }
    for (const car of cars || []) { const rel = ((car.z - pos) % LEN + LEN) % LEN; if (Math.floor(rel / SEG) === n && n > 0) { const k = (rel % SEG) / SEG, p2 = proj[n].p2, cx = p1.x + (p2.x - p1.x) * k + car.x * (p1.w + (p2.w - p1.w) * k), cy = p1.y + (p2.y - p1.y) * k; drawCar(c, cx, cy, (p1.w + (p2.w - p1.w) * k) * 0.55, car.col); } }
  }
  // your car, with exhaust heat shimmer and tyre smoke off track
  const cx = W / 2 + steerVis * 6, cy = H - 14 + (Math.abs(px) > 1 && v > 0 ? Math.random() * 3 : 0);
  if (crashT > 0) { const k = Math.min(1, (1.5 - crashT) * 3); for (let i = 0; i < 3; i++) { c.fillStyle = ['#ff5a36', '#ffd23f', '#fff4c0'][i]; c.beginPath(); c.arc(cx + Math.sin(t / 40 + i) * 4, cy - 24, (34 - i * 9) * k, 0, 7); c.fill(); } c.fillStyle = 'rgba(60,60,60,.5)'; c.beginPath(); c.arc(cx, cy - 46 - (1.5 - crashT) * 20, 26 * k, 0, 7); c.fill(); }
  else { if (Math.abs(px) > 1 && v > MAXV * 0.2) { c.fillStyle = 'rgba(200,180,140,.5)'; for (let i = 0; i < 4; i++) { c.beginPath(); c.arc(cx + (i % 2 ? 40 : -40) + Math.random() * 8, cy - 6 - Math.random() * 10, 6 + Math.random() * 8, 0, 7); c.fill(); } } drawCar(c, cx, cy, 104, '#e63946', true, steerVis); }
  // dashboard: speed and gear
  c.fillStyle = 'rgba(0,0,0,.55)'; c.beginPath(); c.roundRect(6, H - 24, 76, 18, 5); c.fill(); K.text(c, Math.round(v / MAXV * 290) + ' MPH', 44, H - 15, 8, '#fff');
  c.fillStyle = '#333'; c.fillRect(10, H - 9, 68, 2); c.fillStyle = v / MAXV > 0.85 ? '#ff3b3b' : '#7cff6b'; c.fillRect(10, H - 9, 68 * v / MAXV, 2);
  c.fillStyle = 'rgba(0,0,0,.55)'; c.beginPath(); c.roundRect(W - 52, H - 24, 46, 18, 5); c.fill(); K.text(c, gear ? 'HIGH' : 'LOW', W - 29, H - 15, 8, gear ? '#ffd23f' : '#7cff6b');
  if (raceT < 0) { c.fillStyle = 'rgba(0,0,0,.7)'; c.beginPath(); c.roundRect(W / 2 - 34, 30, 68, 20, 6); c.fill(); const n = Math.ceil(-raceT); for (let k = 0; k < 3; k++) { c.fillStyle = k < 3 - n ? '#ff3b3b' : '#333'; c.beginPath(); c.arc(W / 2 - 20 + k * 20, 40, 7, 0, 7); c.fill(); } }
  else if (raceT < 0.8) { for (let k = 0; k < 3; k++) { c.fillStyle = '#3df07a'; c.beginPath(); c.arc(W / 2 - 20 + k * 20, 40, 7, 0, 7); c.fill(); } }
  if (msgT > 0) K.text(c, msg, W / 2, 64, 13, '#fff');
}
title();
K.run(update, draw);
</script>
