<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apex Grand Prix</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script>
// Apex Grand Prix: Formula racing from behind the wheel. Run a qualifying lap to earn your grid spot, then race three laps against the field.
K.theme({ bg: '#101826', ink: '#f4f6ff', accent: '#ff3b3b', accentInk: '#fff' });
const W = 320, H = 240, SEG = 100, RW = 1000, CAMH = 900, DEPTH = 0.84, DRAW = 110, MAXV = SEG * 62;
K.screen(W, H, { smooth: true });
K.hud(['mode', 'pos', 'time']);
K.pad({ dpad: '4', buttons: [{ id: 'b', label: 'BRAKE' }, { id: 'a', label: 'GAS' }] });

let segs = [], LEN = 0;
function addRoad(n, curve) { for (let i = 0; i < n; i++) { const k = i < n / 4 ? i / (n / 4) : i > n * 3 / 4 ? (n - i) / (n / 4) : 1; segs.push({ curve: curve * k, signs: [] }); } }
addRoad(120, 0); addRoad(160, 3); addRoad(90, 0); addRoad(140, -4); addRoad(70, 0); addRoad(120, 5); addRoad(100, -2); addRoad(160, -5); addRoad(80, 0); addRoad(140, 3.5); addRoad(140, 0);
LEN = segs.length * SEG;
for (let i = 10; i < segs.length; i += 9) { segs[i].signs.push({ x: (i % 18 ? -1 : 1) * (1.5 + (i % 5) * 0.12), k: i % 27 === 0 ? 'board' : 'post' }); }
const segAt = z => segs[Math.floor(((z % LEN) + LEN) % LEN / SEG)];

let state = 'title', mode, pos, v, px, gear, laps, lapT, raceT, qualTime, grid, cars, crashT, msg, msgT, best = K.best('apexgp'), steerVis = 0, sky = 0;
function title() { K.card({ title: 'APEX GRAND PRIX', text: 'Hold GAS, BRAKE for the corners and steer with ◀ ▶. Press ▲ for HIGH gear once you are moving fast, ▼ for LOW. First run a qualifying lap: the faster you go, the better you start. Then race 3 laps and beat the field. Stay off the grass and away from the signs!', best: best ? 'BEST LAP ' + (best / 100).toFixed(2) + 's' : '', button: 'Qualify', onStart: startQual }); }
function reset() { pos = 0; v = 0; px = 0; gear = 0; lapT = 0; crashT = 0; }
function startQual() { reset(); mode = 'qual'; cars = []; laps = 0; raceT = -3; say('QUALIFYING LAP', 2); state = 'play'; }
function startRace() {
  reset(); mode = 'race'; laps = 0; raceT = -3;
  cars = []; for (let i = 0; i < 7; i++) { const row = i < grid ? i : i + 1; cars.push({ z: (8 - row) * SEG * 6 + SEG * 4, x: (row % 2 ? 0.45 : -0.45), v: MAXV * (0.8 + i * 0.022), col: ['#3fa9ff', '#ffd23f', '#7cff6b', '#ff8a1f', '#c07bff', '#fff', '#ff4fa3'][i], lap: 0 }); }
  pos = (8 - grid) * SEG * 6 + SEG * 4 - SEG * 6; if (pos < 0) pos = 0;
  say('GRID POSITION ' + (grid + 1), 2); state = 'play';
}
function say(t, d) { msg = t; msgT = d || 1.4; }
function place() { const me = laps * LEN + pos; return 1 + cars.filter(c => c.lap * LEN + c.z > me).length; }
function hud() {
  K.set('mode', mode === 'qual' ? 'QUALIFY' : 'LAP ' + Math.min(3, laps + 1) + '/3');
  K.set('pos', mode === 'qual' ? (gear ? 'HIGH' : 'LOW') : 'P' + place());
  K.set('time', Math.max(0, raceT).toFixed(1) + 's');
}

function update(dt) {
  if (state !== 'play') return;
  if (msgT > 0) msgT -= dt;
  if (raceT < 0) { const b = Math.ceil(raceT); raceT += dt; if (Math.ceil(raceT) !== b) K.beep(b === 0 ? 880 : 440, b === 0 ? 0.4 : 0.15, { vol: 0.07 }); hud(); return; }
  raceT += dt; lapT += dt;
  const seg = segAt(pos), pct = v / MAXV;
  if (K.hit('up') && gear === 0) { gear = 1; K.beep(300, 0.08, { vol: 0.05 }); }
  if (K.hit('down') && gear === 1) { gear = 0; K.beep(200, 0.08, { vol: 0.05 }); }
  if (crashT > 0) { crashT -= dt; v = 0; if (crashT <= 0) { px = K.clamp(px, -0.8, 0.8); say('GO!', 0.6); } }
  else {
    const top = gear ? MAXV : MAXV * 0.55, acc = gear ? (pct < 0.4 ? MAXV * 0.08 : MAXV * 0.28) : MAXV * 0.45;
    if (K.down('a') || (K.ptr.down && K.ptr.y < H * 0.6)) v += (v < top ? acc : -MAXV * 0.3) * dt;
    else if (K.down('b')) v -= MAXV * 0.9 * dt;
    else v -= MAXV * 0.18 * dt;
    let st = (K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0);
    if (K.ptr.down && K.ptr.y >= H * 0.6) st = K.ptr.x < W / 2 ? -1 : 1;
    px += st * dt * 2.2 * pct; steerVis += (st - steerVis) * Math.min(1, dt * 10);
    px -= dt * 2.2 * pct * pct * seg.curve * 0.32;
    if (Math.abs(px) > 1) { if (v > MAXV * 0.3) v -= MAXV * 0.9 * dt; for (const s of seg.signs) if (Math.abs(px - s.x) < 0.35) crash('CRASHED INTO A SIGN!'); }
    px = K.clamp(px, -2.4, 2.4); v = K.clamp(v, 0, MAXV);
    for (const c of cars) { const dz = ((c.z - pos) % LEN + LEN) % LEN; if (dz < SEG * 1.2 && c.lap * LEN + c.z >= laps * LEN + pos - SEG && Math.abs(c.x - px) < 0.42 && v > c.v * 0.9) { crash('CRASH!'); c.v *= 0.9; } }
  }
  const before = pos; pos += v * dt;
  if (pos >= LEN) { pos -= LEN; laps++; if (mode === 'qual') return endQual(); K.tune([660, 880], 0.08); best = K.saveBest('apexgp', Math.round(lapT * 100), true); lapT = 0; if (laps >= 3) return endRace(); say('LAP ' + (laps + 1), 1); }
  // the field
  for (const c of cars) {
    const cs = segAt(c.z); let target = c.v * (1 - Math.abs(cs.curve) * 0.02);
    c.z += target * dt; if (c.z >= LEN) { c.z -= LEN; c.lap++; }
    const want = -cs.curve * 0.08 + (Math.sin(c.z / 3000 + c.v) * 0.3);
    c.x += (K.clamp(want, -0.7, 0.7) - c.x) * dt * 0.8;
  }
  if (Math.random() < 0.5) K.beep(60 + pct * 220 * (gear ? 0.8 : 1.4), 0.04, { type: 'sawtooth', vol: 0.02 });
  sky += seg.curve * pct * dt * 0.02;
  hud();
}
function crash(t) { if (crashT > 0) return; crashT = 1.5; v = 0; say(t, 1.4); K.noise(0.6, 0.45); }
function endQual() {
  state = 'over'; qualTime = lapT; const cut = [21, 22, 23, 24.5, 26, 28, 30];
  grid = cut.findIndex(c => qualTime < c); if (grid < 0) grid = 7;
  best = K.saveBest('apexgp', Math.round(qualTime * 100), true);
  K.card({ title: 'QUALIFIED P' + (grid + 1), text: 'Your lap: ' + qualTime.toFixed(2) + ' seconds. Pole position takes under 21 seconds. Now race 3 laps against 7 cars!', best: 'BEST LAP ' + (best / 100).toFixed(2) + 's', button: 'Start race', onStart: startRace });
}
function endRace() {
  state = 'over'; const p = place(); K.tune(p === 1 ? [523, 659, 784, 1047, 1319] : [523, 659, 784], 0.1);
  K.card({ title: p === 1 ? 'YOU WIN!' : 'FINISHED P' + p, text: '3 laps in ' + raceT.toFixed(2) + ' seconds.' + (p === 1 ? ' Champagne time!' : ' Qualify faster to start further up.'), best: 'BEST LAP ' + (best / 100).toFixed(2) + 's', button: 'Qualify again', onStart: startQual });
}

function project(z, x, camX, camZ) { const cz = z - camZ; const s = DEPTH / Math.max(1, cz); return { x: W / 2 + s * (x - camX) * W / 2, y: H / 2 + s * CAMH * H / 2, w: s * RW * W / 2, s }; }
function quad(c, x1, y1, w1, x2, y2, w2, col) { c.fillStyle = col; c.beginPath(); c.moveTo(x1 - w1, y1); c.lineTo(x2 - w2, y2); c.lineTo(x2 + w2, y2); c.lineTo(x1 + w1, y1); c.fill(); }
function drawCar(c, x, y, w, col) {
  const h = w * 0.45; c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(x - w * 0.55, y - h * 0.15, w * 1.1, h * 0.2);
  c.fillStyle = '#111'; c.fillRect(x - w * 0.55, y - h * 0.7, w * 0.22, h * 0.7); c.fillRect(x + w * 0.33, y - h * 0.7, w * 0.22, h * 0.7);
  c.fillStyle = col; c.fillRect(x - w * 0.3, y - h * 0.8, w * 0.6, h * 0.6); c.fillRect(x - w * 0.5, y - h * 1.15, w, h * 0.22);
  c.fillStyle = '#222'; c.fillRect(x - w * 0.12, y - h * 1.0, w * 0.24, h * 0.25);
}
function draw(c, t) {
  const g = c.createLinearGradient(0, 0, 0, H / 2); g.addColorStop(0, '#2a6fdb'); g.addColorStop(1, '#bfe4ff'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  // mountains
  c.fillStyle = '#6a7fa8'; c.beginPath(); c.moveTo(0, H / 2); for (let x = 0; x <= W; x += 10) c.lineTo(x, H / 2 - 14 - Math.abs(Math.sin((x + sky * 400) / 50)) * 26); c.lineTo(W, H / 2); c.fill();
  c.fillStyle = '#4e9a3a'; c.fillRect(0, H / 2, W, H / 2);
  if (state === 'title') return;
  const base = Math.floor(pos / SEG), bpct = (pos % SEG) / SEG; let x = 0, dx = -segs[base % segs.length].curve * bpct, maxy = H;
  const proj = [];
  for (let n = 0; n < DRAW; n++) {
    const i = (base + n) % segs.length, s = segs[i], z1 = (base + n) * SEG, z2 = z1 + SEG;
    const p1 = project(z1, -x, px * RW, pos - SEG * 0.2), p2 = project(z2, -x - dx, px * RW, pos - SEG * 0.2);
    x += dx; dx += s.curve; proj.push({ i, p1, p2, clip: maxy });
    if (p2.y >= maxy || p1.y <= H / 2) continue;
    const light = Math.floor((base + n) / 3) % 2;
    c.fillStyle = light ? '#4e9a3a' : '#468f34'; c.fillRect(0, p2.y, W, p1.y - p2.y + 1);
    quad(c, p1.x, p1.y, p1.w * 1.15, p2.x, p2.y, p2.w * 1.15, light ? '#e8e8e8' : '#e63946');
    quad(c, p1.x, p1.y, p1.w, p2.x, p2.y, p2.w, light ? '#6a6a72' : '#646470');
    if (light) quad(c, p1.x, p1.y, p1.w * 0.02, p2.x, p2.y, p2.w * 0.02, '#fff');
    if (i < 3) quad(c, p1.x, p1.y, p1.w, p2.x, p2.y, p2.w, (Math.floor(n) % 2) ? '#111' : '#fff');
    maxy = p2.y;
  }
  // signs and cars, far to near
  for (let n = proj.length - 1; n >= 0; n--) {
    const { i, p1 } = proj[n]; if (p1.y > H || p1.y < H / 2) continue;
    for (const sg of segs[i].signs) { const sx = p1.x + sg.x * p1.w, h = p1.w * (sg.k === 'board' ? 0.9 : 0.5); if (sg.k === 'board') { c.fillStyle = '#555'; c.fillRect(sx - 1, p1.y - h, 2, h); c.fillStyle = '#ffd23f'; c.fillRect(sx - h * 0.7, p1.y - h * 1.3, h * 1.4, h * 0.5); c.fillStyle = '#e63946'; c.fillRect(sx - h * 0.6, p1.y - h * 1.2, h * 1.2, h * 0.12); } else { c.fillStyle = '#fff'; c.fillRect(sx - h * 0.05, p1.y - h, h * 0.1, h); c.fillStyle = '#e63946'; c.fillRect(sx - h * 0.05, p1.y - h, h * 0.1, h * 0.2); } }
    for (const car of cars || []) { const rel = ((car.z - pos) % LEN + LEN) % LEN; if (Math.floor(rel / SEG) === n && n > 0) { const k = (rel % SEG) / SEG, p2 = proj[n].p2, cx = p1.x + (p2.x - p1.x) * k + car.x * (p1.w + (p2.w - p1.w) * k), cy = p1.y + (p2.y - p1.y) * k; drawCar(c, cx, cy, (p1.w + (p2.w - p1.w) * k) * 0.55, car.col); } }
  }
  // your car
  const cx = W / 2 + steerVis * 6, cy = H - 16 + (Math.abs(px) > 1 && v > 0 ? Math.random() * 3 : 0);
  if (crashT > 0) { c.fillStyle = Math.floor(t / 60) % 2 ? '#ffd23f' : '#ff5a36'; c.beginPath(); c.arc(cx, cy - 20, 30 * Math.min(1, (1.5 - crashT) * 3), 0, 7); c.fill(); }
  else drawCar(c, cx, cy, 90, '#e63946');
  // tach
  c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(6, H - 22, 70, 16); K.text(c, Math.round(v / MAXV * 290) + ' MPH', 40, H - 14, 8, '#fff');
  c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(W - 50, H - 22, 44, 16); K.text(c, gear ? 'HIGH' : 'LOW', W - 28, H - 14, 8, gear ? '#ffd23f' : '#7cff6b');
  if (raceT < 0) { const n = Math.ceil(-raceT); for (let k = 0; k < 3; k++) { c.fillStyle = k < 3 - n ? '#ff3b3b' : '#333'; c.beginPath(); c.arc(W / 2 - 20 + k * 20, 40, 7, 0, 7); c.fill(); } }
  else if (raceT < 0.8) { for (let k = 0; k < 3; k++) { c.fillStyle = '#3df07a'; c.beginPath(); c.arc(W / 2 - 20 + k * 20, 40, 7, 0, 7); c.fill(); } }
  if (msgT > 0) K.text(c, msg, W / 2, 64, 13, '#fff');
}
title();
K.run(update, draw);
</script>
</body>
</html>
