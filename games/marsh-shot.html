// ---------- drawing ----------

const FLASH_MAT = new THREE.MeshBasicMaterial({ color: 0xffffff }), FWD = new THREE.Vector3(0, 0, -1);
function toScreen(x, y, z) { PV.set(x, y, z).project(camera); if (PV.z > 1 || PV.z < -1) return null; return { x: (PV.x + 1) / 2 * hudC._w, y: (1 - PV.y) / 2 * hudC._h }; }

function drawHud() {
