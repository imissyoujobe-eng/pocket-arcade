<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Box Out</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600&display=swap">
<style>
/* Layout: square glowing grid arena, score strip above, swipe-anywhere controls (2P: each player swipes their own half) */
:root{--bg:#0a0a14;--grid:#16162a;--p1:#38f2ff;--p2:#ff8a1f;--ink:#e9ecff;--display:'Bungee',Impact,system-ui,sans-serif;--body:'Rubik',system-ui,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-inline:16px;box-sizing:border-box}
#hud{width:min(100%,560px);display:flex;justify-content:space-between;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
#hud .a{color:var(--p1)}#hud .b{color:var(--p2)}#hud .m{font-size:13px;opacity:.7;align-self:center}
#stage{position:relative;width:min(100%,560px,calc(100vh - 120px));aspect-ratio:1}
canvas{width:100%;height:100%;display:block;border-radius:8px}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:rgba(10,10,20,.86);border-radius:8px;padding-inline:16px}
#overlay h1{font-family:var(--display);font-size:clamp(44px,14vw,80px);margin:0;color:var(--p1);text-shadow:0 0 18px var(--p1),3px 3px 0 var(--p2)}
#overlay p{margin:0;max-width:32ch;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{font-family:var(--display);font-size:14px;padding:9px 14px;border-radius:10px;border:2px solid #2a2a48;background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--p1);color:var(--p1)}
#go{font-family:var(--display);font-size:20px;padding:12px 32px;border:0;border-radius:999px;background:var(--p1);color:#032a2e;box-shadow:0 5px 0 #138a94;cursor:pointer}
button:active{transform:translateY(2px)}button:focus-visible{outline:3px solid var(--p2);outline-offset:3px}
</style>
<div id="app">
  <div id="hud"><span class="a" id="s1">0</span><span class="m">FIRST TO 5</span><span class="b" id="s2">0</span></div>
  <div id="stage"><canvas id="c" width="560" height="560"></canvas>
    <div id="overlay"><h1>BOX OUT</h1><p id="msg">Your racer leaves a wall behind it. Trap your rival so they crash first. Swipe or use the arrow keys to turn.</p>
      <div class="row" id="opp"><button class="chip" aria-pressed="true" data-o="cpu">vs CPU</button><button class="chip" aria-pressed="false" data-o="2p">2 Players</button></div>
      <div class="row" id="spd"><button class="chip" aria-pressed="false" data-s="9">Chill</button><button class="chip" aria-pressed="true" data-s="13">Normal</button><button class="chip" aria-pressed="false" data-s="18">Turbo</button></div>
      <button id="go">Play</button></div>
  </div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const N=40,T=560/N,WIN=5,DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
let opp='cpu',speed=13,grid,P,state='menu',acc=0,score=[0,0],roundEnd=0,AC,boom=[];
function pick(g,a,cb){$(g).querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$(g).querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));cb(b.dataset[a])})}
pick('opp','o',v=>opp=v);pick('spd','s',v=>speed=+v);
function beep(f,d,v=.06,type='square'){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function newRound(){grid=Array.from({length:N},()=>new Array(N).fill(0));
  P=[{x:8,y:N-8,d:0,q:[],c:'#38f2ff',id:1,alive:true},{x:N-9,y:7,d:2,q:[],c:'#ff8a1f',id:2,alive:true}];
  for(const p of P)grid[p.y][p.x]=p.id;boom=[];roundEnd=0;acc=-0.8}
function start(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}score=[0,0];hud();newRound();state='play';$('overlay').hidden=true}
$('go').onclick=start;
function hud(){$('s1').textContent=score[0];$('s2').textContent=score[1]}
function turn(p,d){const last=p.q.length?p.q[p.q.length-1]:p.d;if((d+2)%4===last||d===last||p.q.length>2)return;p.q.push(d)}
const K1={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3},K2={w:0,d:1,s:2,a:3,W:0,D:1,S:2,A:3};
addEventListener('keydown',e=>{if(state!=='play'){if(e.key==='Enter'||e.key===' ')start();return}
  if(e.key in K1){turn(P[0],K1[e.key]);e.preventDefault()}if(opp==='2p'&&e.key in K2)turn(P[1],K2[e.key]);
  if(opp==='cpu'&&e.key in K2)turn(P[0],K2[e.key])});
const sw={};
cv.addEventListener('pointerdown',e=>{sw[e.pointerId]={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointermove',e=>{const s=sw[e.pointerId];if(!s||state!=='play')return;const dx=e.clientX-s.x,dy=e.clientY-s.y;if(Math.hypot(dx,dy)<22)return;
  const d=Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0);const r=cv.getBoundingClientRect();const top=s.y-r.top<r.height/2;
  turn(opp==='2p'&&top?P[1]:P[0],d);sw[e.pointerId]={x:e.clientX,y:e.clientY}});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,e=>delete sw[e.pointerId]));
const free=(x,y)=>x>=0&&y>=0&&x<N&&y<N&&!grid[y][x];
function floodCount(x,y,lim=300){if(!free(x,y))return 0;const seen=new Set([y*N+x]),st=[[x,y]];let c=0;while(st.length&&c<lim){const [a,b]=st.pop();c++;for(const[dx,dy]of DIRS){const nx=a+dx,ny=b+dy,k=ny*N+nx;if(free(nx,ny)&&!seen.has(k)){seen.add(k);st.push([nx,ny])}}}return c}
function cpu(p){const o=P[0];let best=p.d,bs=-1e9;
  for(let d=0;d<4;d++){if((d+2)%4===p.d)continue;const nx=p.x+DIRS[d][0],ny=p.y+DIRS[d][1];if(!free(nx,ny))continue;
    let s=floodCount(nx,ny)*3;s-=Math.hypot(nx-o.x,ny-o.y)*.6;if(d===p.d)s+=4;s+=Math.random()*3;if(s>bs){bs=s;best=d}}
  if(best!==p.d)p.q=[best]}
function step(){
  if(opp==='cpu')cpu(P[1]);
  for(const p of P){if(p.q.length)p.d=p.q.shift();p.nx=p.x+DIRS[p.d][0];p.ny=p.y+DIRS[p.d][1]}
  for(const p of P)if(!free(p.nx,p.ny))p.alive=false;
  if(P[0].nx===P[1].nx&&P[0].ny===P[1].ny)P[0].alive=P[1].alive=false;
  for(const p of P)if(p.alive){p.x=p.nx;p.y=p.ny;grid[p.y][p.x]=p.id}
  if(!P[0].alive||!P[1].alive){
    for(const p of P)if(!p.alive)for(let i=0;i<30;i++)boom.push({x:(p.x+.5)*T,y:(p.y+.5)*T,vx:(Math.random()-.5)*300,vy:(Math.random()-.5)*300,l:.8,c:p.c});
    let note;if(!P[0].alive&&!P[1].alive)note='Head-on crash. No point.';else if(!P[1].alive){score[0]++;note=(opp==='cpu'?'You':'Blue')+' scores!'}else{score[1]++;note=(opp==='cpu'?'CPU':'Orange')+' scores!'}
    hud();beep(120,.5,.1,'sawtooth');roundEnd=1.6;
    if(score[0]>=WIN||score[1]>=WIN){state='over';const w=score[0]>=WIN?(opp==='cpu'?'You win':'Blue wins'):(opp==='cpu'?'CPU wins':'Orange wins');
      setTimeout(()=>{$('msg').textContent=`${w} ${Math.max(...score)}–${Math.min(...score)}!`;$('go').textContent='Play again';$('overlay').hidden=false},1200)}
  }else beep(180+((P[0].x+P[0].y)%6)*20,.02,.015)}
function draw(dt){ctx.fillStyle='#0a0a14';ctx.fillRect(0,0,560,560);
  ctx.strokeStyle='#16162a';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<=N;i++){ctx.moveTo(i*T,0);ctx.lineTo(i*T,560);ctx.moveTo(0,i*T);ctx.lineTo(560,i*T)}ctx.stroke();
  if(grid){for(let y=0;y<N;y++)for(let x=0;x<N;x++){const v=grid[y][x];if(!v)continue;const c=v===1?'#38f2ff':'#ff8a1f';ctx.fillStyle=c;ctx.globalAlpha=.85;ctx.fillRect(x*T+1,y*T+1,T-2,T-2)}ctx.globalAlpha=1;
    for(const p of P){ctx.shadowColor=p.c;ctx.shadowBlur=18;ctx.fillStyle='#fff';ctx.fillRect(p.x*T,p.y*T,T,T);ctx.shadowBlur=0}}
  for(const b of boom){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;ctx.globalAlpha=Math.max(0,b.l);ctx.fillStyle=b.c;ctx.fillRect(b.x-2,b.y-2,4,4)}ctx.globalAlpha=1;boom=boom.filter(b=>b.l>0);
  ctx.strokeStyle='#38f2ff';ctx.globalAlpha=.35;ctx.lineWidth=3;ctx.strokeRect(1.5,1.5,557,557);ctx.globalAlpha=1;
  if(state==='play'&&acc<0&&!roundEnd){ctx.fillStyle='#e9ecff';ctx.font='36px Bungee, Impact, sans-serif';ctx.textAlign='center';ctx.fillText('READY',280,290)}}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  if(state==='play'){if(roundEnd){roundEnd-=dt;if(roundEnd<=0)newRound()}else{acc+=dt;const st=1/speed;while(acc>=st&&!roundEnd){acc-=st;step()}}}
  else if(state==='over'&&roundEnd>0)roundEnd-=dt;
  draw(dt);requestAnimationFrame(loop)}
newRound();requestAnimationFrame(loop);
</script>

</body></html>
