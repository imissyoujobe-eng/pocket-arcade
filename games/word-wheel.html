<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Word Wheel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;800&display=swap">
<style>
:root { --acc: #ff7a3d; --acc2: #ffd166; --ink: #fff; --tile: rgba(255,255,255,.88); --shade: rgba(10,14,30,.35); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2140; color: var(--ink); font-family: Rubik, system-ui, sans-serif;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
#app { position: fixed; inset: 0; z-index: 1; display: grid; grid-template-rows: auto minmax(0, 1fr) auto minmax(0, auto);
  padding: max(46px, calc(env(safe-area-inset-top, 0px) + 44px)) max(12px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
#top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pill { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(10,14,30,.42); backdrop-filter: blur(6px);
  font: 700 15px Rubik, sans-serif; text-shadow: 0 1px 2px rgba(0,0,0,.4); white-space: nowrap; }
#lvl b { font: 400 16px Bungee, Impact, sans-serif; letter-spacing: .02em; }
#lvl small { opacity: .85; font-weight: 500; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; }
.coin { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c8, #ffc83d 45%, #c88a10); box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); flex: none; }
#gridWrap { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; }
#grid { position: relative; }
.cell { position: absolute; border-radius: 18%; background: var(--tile); box-shadow: 0 2px 0 rgba(0,0,0,.18); display: flex; align-items: center; justify-content: center;
  font-weight: 800; color: #1d2340; transition: background .25s, transform .25s; }
.cell.on { background: linear-gradient(180deg, var(--acc2), var(--acc)); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.cell.hint { color: #6a6f88; }
.cell.pop { animation: pop .42s ease; }
.cell.flash { animation: flash .6s ease; }
@keyframes pop { 0% { transform: scale(.4); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes flash { 0%, 100% { transform: scale(1); filter: none; } 40% { transform: scale(1.12); filter: brightness(1.4); } }
#word { justify-self: center; min-height: 46px; margin: 6px 0 4px; display: flex; align-items: center; }
#word span { display: none; padding: 6px 16px; border-radius: 12px; background: var(--acc); font: 800 26px Rubik, sans-serif; letter-spacing: .08em; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
#word.has span { display: block; }
#word.bad span { animation: shake .4s; background: #e0485a; }
#word.dup span { background: #8a8fa8; }
#word.bonus span { background: #f5b82e; }
@keyframes shake { 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
#bottom { position: relative; display: flex; justify-content: center; align-items: center; }
#wheel { position: relative; border-radius: 50%; background: rgba(255,255,255,.82); box-shadow: 0 10px 30px rgba(0,0,0,.25), inset 0 0 0 6px rgba(255,255,255,.4); touch-action: none; }
#lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.let { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 800; color: #20253f; pointer-events: none; transition: left .3s, top .3s, background .15s, color .15s; }
.let.sel { background: var(--acc); color: #fff; }
.side { position: absolute; display: flex; flex-direction: column; gap: 14px; }
.btn { all: unset; box-sizing: border-box; width: 56px; height: 56px; border-radius: 50%; background: rgba(10,14,30,.5); border: 2px solid rgba(255,255,255,.75);
  display: flex; align-items: center; justify-content: center; flex-direction: column; cursor: pointer; position: relative; backdrop-filter: blur(4px); }
.btn:active { transform: scale(.93); }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.btn svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.btn .cost { position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 3px; padding: 1px 7px 1px 4px; border-radius: 999px; background: #1d2340; font: 700 11px Rubik, sans-serif; }
.btn .cost .coin { width: 12px; height: 12px; }
.btn .badge { position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: #f5b82e; color: #2a1a00; font: 800 12px Rubik, sans-serif; display: flex; align-items: center; justify-content: center; }
#ov { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px;
  background: rgba(10,14,30,.66); backdrop-filter: blur(3px); text-align: center; }
#ov[hidden] { display: none; }
#ov h1 { margin: 0; font: 400 clamp(30px, 10vw, 54px) Bungee, Impact, sans-serif; color: var(--acc2); text-shadow: 0 4px 0 rgba(0,0,0,.3); line-height: 1.05; }
#ov p { margin: 0; max-width: 34ch; line-height: 1.5; font-size: 16px; }
#ov .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.big { all: unset; box-sizing: border-box; padding: 13px 30px; min-height: 48px; border-radius: 999px; background: linear-gradient(180deg, var(--acc2), var(--acc)); color: #fff;
  font: 400 19px Bungee, Impact, sans-serif; text-shadow: 0 2px 0 rgba(0,0,0,.25); box-shadow: 0 5px 0 rgba(0,0,0,.3); cursor: pointer; }
.big.alt { background: rgba(255,255,255,.16); box-shadow: none; border: 2px solid rgba(255,255,255,.5); font-size: 15px; }
.big:active { transform: translateY(3px); }
.big:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
#bonusList { max-height: 40vh; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 420px; }
#bonusList span { padding: 4px 10px; border-radius: 8px; background: rgba(255,255,255,.14); font-weight: 700; letter-spacing: .05em; }
.fly { position: fixed; z-index: 4; pointer-events: none; font: 800 18px Rubik, sans-serif; color: #fff; text-shadow: 0 2px 3px rgba(0,0,0,.5); transition: transform .9s cubic-bezier(.2,.8,.2,1), opacity .9s; }
#toast { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); z-index: 4; pointer-events: none; font: 400 26px Bungee, Impact, sans-serif; color: var(--acc2);
  text-shadow: 0 3px 0 rgba(0,0,0,.35); opacity: 0; transition: opacity .3s, transform .3s; white-space: nowrap; }
#toast.on { opacity: 1; transform: translate(-50%, -60%); }
#load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 6; font: 400 20px Bungee, Impact, sans-serif; }
/* phone on its side: crossword on the left, wheel on the right */
@media (orientation: landscape) and (max-height: 620px) {
  #app { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr);
    padding-top: max(10px, env(safe-area-inset-top, 0px)); column-gap: 18px; }
  #top { grid-column: 1 / -1; padding-left: 120px; }
  #gridWrap { grid-column: 1; grid-row: 2 / 4; }
  #word { grid-column: 2; grid-row: 2; margin: 0; }
  #bottom { grid-column: 2; grid-row: 3; }
}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="app">
  <div id="top">
    <div class="pill" id="lvl"><b>LEVEL 1</b><small></small></div>
    <div class="pill" aria-label="coins"><span class="coin"></span><span id="coins">100</span></div>
  </div>
  <div id="gridWrap"><div id="grid" role="img" aria-label="crossword"></div></div>
  <div id="word" aria-live="polite"><span></span></div>
  <div id="bottom">
    <div class="side" id="leftBtns">
      <button class="btn" id="shuffle" aria-label="Shuffle the letters"><svg viewBox="0 0 24 24"><path d="M3 7h3c4 0 6 10 10 10h4M17 14l3 3-3 3M3 17h3c1.6 0 2.8-1.6 4-3.5M13.5 9.5C14.6 8 15.7 7 17 7h3M17 4l3 3-3 3"/></svg></button>
      <button class="btn" id="bonus" aria-label="Bonus words"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg><span class="badge" id="bcount">0</span></button>
    </div>
    <div id="wheel"><canvas id="lines"></canvas></div>
    <div class="side" id="rightBtns">
      <button class="btn" id="hint" aria-label="Hint: show a letter for 25 coins"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.8.6 1.1 1.4 1.1 2.2h5c0-.8.3-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg><span class="cost"><span class="coin"></span>25</span></button>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="ov" hidden></div>
<div id="load">LOADING WORDS…</div>
<script src="../lib/wordwheel-levels.js"></script>
<script>
// Word Wheel: swipe across the letters on the wheel to spell words and fill in the crossword.
// Extra real words count as bonus words (coins). Hints show a letter for 25 coins. 400 levels in 20 scenes.
(function () {
  'use strict';
  const LV = window.WHEEL_LEVELS, HINT = 25, SAVE = 'ww-save';
  const $ = id => document.getElementById(id);
  // ---------------------------------------------------------------- scenes: one painted backdrop per 20-level chapter
  const SCENES = [
    { name: 'Sunrise Meadow', sky: ['#ffd1a8', '#ff9d8a', '#8e7cc3'], sun: '#fff1c4', hills: ['#a8d672', '#7fbf5a', '#5a9e45'], acc: ['#ff7a3d', '#ffc857'], kind: 'meadow' },
    { name: 'Pine Forest', sky: ['#bfe6ff', '#8cc8f0', '#5f9fd0'], sun: '#ffffff', hills: ['#5d8f7a', '#3f735c', '#2a5640'], acc: ['#2f9e6e', '#7fe0a8'], kind: 'pines' },
    { name: 'Ocean Cliffs', sky: ['#9fdcff', '#5fb4ef', '#3a86d0'], sun: '#fffbe0', hills: ['#2f8fc4', '#c9b48a', '#8f7a56'], acc: ['#1f7fd0', '#5fd0ff'], kind: 'ocean' },
    { name: 'Desert Canyon', sky: ['#ffe0a3', '#ffb36b', '#e0704a'], sun: '#fff4d0', hills: ['#e09a5a', '#c4703f', '#9a4f2e'], acc: ['#d9542f', '#ffb347'], kind: 'mesa' },
    { name: 'Snowy Peaks', sky: ['#e8f4ff', '#bcd8f5', '#8fb4e0'], sun: '#ffffff', hills: ['#ffffff', '#d6e4f2', '#a9bfd6'], acc: ['#4a7fd6', '#8fc0ff'], kind: 'peaks' },
    { name: 'Lavender Hills', sky: ['#f6d6ff', '#cfa6f0', '#8f6ccf'], sun: '#fff0ff', hills: ['#b58ae0', '#9466c8', '#6e4aa6'], acc: ['#9a4fd6', '#e0a6ff'], kind: 'lavender' },
    { name: 'Autumn Lake', sky: ['#ffe4b8', '#ffc08a', '#d98a6a'], sun: '#fff0cc', hills: ['#e0883a', '#c25a2a', '#8a3a24'], acc: ['#e0602a', '#ffc04a'], kind: 'lake' },
    { name: 'City Lights', sky: ['#2a2f6a', '#1a1d48', '#0e1030'], sun: '#fff6d8', hills: ['#2e3366', '#22264f', '#161936'], acc: ['#ff4f9a', '#ffd34f'], kind: 'city', night: true },
    { name: 'Northern Lights', sky: ['#0f2a3a', '#0b1c30', '#060d1e'], sun: '#e8f8ff', hills: ['#dfeaf5', '#b6c8dc', '#8aa2ba'], acc: ['#20c0a0', '#8affd0'], kind: 'aurora', night: true },
    { name: 'Palm Beach', sky: ['#ffb38a', '#ff7a8a', '#7a5ac0'], sun: '#fff0b0', hills: ['#2fb8c8', '#f0d8a0', '#3a2a40'], acc: ['#ff5f6d', '#ffc371'], kind: 'beach' }
  ];
  const scene = n => SCENES[Math.floor(n / 20) % SCENES.length];
  const chapter = n => Math.floor(n / 20) + 1;
  // tiny repeatable random numbers, so a scene always paints the same way
  function rng(seed) { let s = seed * 9301 + 49297; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }
  function paint() {
    const cv = $('bg'), dpr = Math.min(devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight, S = scene(st.level), r = rng(Math.floor(st.level / 20) + 7);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, S.sky[2]); g.addColorStop(0.55, S.sky[1]); g.addColorStop(1, S.sky[0]); c.fillStyle = g; c.fillRect(0, 0, W, H);
    const hz = H * 0.62;   // horizon
    if (S.night) { for (let i = 0; i < 140; i++) { c.fillStyle = 'rgba(255,255,255,' + (0.3 + r() * 0.7) + ')'; const s = r() * 1.6 + 0.4; c.fillRect(r() * W, r() * hz, s, s); } }
    if (S.kind === 'aurora') for (let k = 0; k < 3; k++) {
      const y0 = H * (0.12 + k * 0.08); c.beginPath(); c.moveTo(0, y0); for (let x = 0; x <= W; x += 10) c.lineTo(x, y0 + Math.sin(x / (90 + k * 30) + k) * 30);
      for (let x = W; x >= 0; x -= 10) c.lineTo(x, y0 + 90 + Math.sin(x / (70 + k * 20) + k * 2) * 26);
      const ag = c.createLinearGradient(0, y0, 0, y0 + 110); ag.addColorStop(0, 'rgba(120,255,200,.0)'); ag.addColorStop(0.4, k === 1 ? 'rgba(160,120,255,.35)' : 'rgba(80,255,180,.4)'); ag.addColorStop(1, 'rgba(80,255,180,0)'); c.fillStyle = ag; c.fill();
    }
    // sun or moon with a soft glow
    const sx = W * (0.25 + r() * 0.5), sy = S.night ? H * 0.16 : hz - H * (0.12 + r() * 0.16), sr = Math.min(W, H) * 0.07;
    const sg = c.createRadialGradient(sx, sy, sr * 0.5, sx, sy, sr * 4); sg.addColorStop(0, S.sun + 'aa'); sg.addColorStop(1, S.sun + '00'); c.fillStyle = sg; c.fillRect(0, 0, W, H);
    c.fillStyle = S.sun; c.beginPath(); c.arc(sx, sy, sr, 0, 7); c.fill();
    if (!S.night) for (let i = 0; i < 5; i++) { const cx = r() * W, cy = H * (0.08 + r() * 0.3), cw = 50 + r() * 90; c.fillStyle = 'rgba(255,255,255,.55)'; for (let k = 0; k < 4; k++) { c.beginPath(); c.ellipse(cx + (k - 1.5) * cw * 0.3, cy - (k % 2) * 8, cw * 0.32, 14 + (k % 2) * 6, 0, 0, 7); c.fill(); } }
    // far shapes: mountains, mesas, skyline...
    const ridge = (y, amp, col, rough, peaks) => { c.fillStyle = col; c.beginPath(); c.moveTo(0, H); let x = 0; c.lineTo(0, y);
      while (x <= W + 20) { const yy = peaks ? y - Math.abs(Math.sin(x / 70 + y)) * amp - r() * rough : y - (Math.sin(x / 120 + y * 0.01) * 0.5 + 0.5) * amp - r() * rough; c.lineTo(x, yy); x += peaks ? 18 + r() * 30 : 14; }
      c.lineTo(W, H); c.closePath(); c.fill(); };
    if (S.kind === 'peaks' || S.kind === 'aurora') { ridge(hz - 10, H * 0.22, S.hills[2], 6, true); ridge(hz + 10, H * 0.14, S.hills[1], 4, true); }
    if (S.kind === 'mesa') { c.fillStyle = S.hills[2]; for (let i = 0; i < 4; i++) { const mx = r() * W, mw = 60 + r() * 120, mh = 40 + r() * 80; c.beginPath(); c.moveTo(mx - mw * 0.7, hz); c.lineTo(mx - mw * 0.5, hz - mh); c.lineTo(mx + mw * 0.5, hz - mh); c.lineTo(mx + mw * 0.7, hz); c.fill(); } }
    if (S.kind === 'city') { for (let x = -10; x < W; ) { const bw = 22 + r() * 40, bh = 40 + r() * H * 0.28; c.fillStyle = r() < 0.5 ? S.hills[0] : S.hills[1]; c.fillRect(x, hz - bh, bw, bh + 4);
        for (let wy = hz - bh + 8; wy < hz - 6; wy += 9) for (let wx = x + 5; wx < x + bw - 5; wx += 8) if (r() < 0.45) { c.fillStyle = r() < 0.7 ? 'rgba(255,214,120,.85)' : 'rgba(150,200,255,.7)'; c.fillRect(wx, wy, 3.5, 4); }
        x += bw + 2; } }
    if (S.kind === 'ocean' || S.kind === 'beach' || S.kind === 'lake') {
      const wg = c.createLinearGradient(0, hz, 0, H); wg.addColorStop(0, S.hills[0]); wg.addColorStop(1, S.kind === 'lake' ? '#3a5a7a' : '#1a5a8a'); c.fillStyle = wg; c.fillRect(0, hz, W, H - hz);
      c.fillStyle = 'rgba(255,255,255,.35)'; for (let i = 0; i < 40; i++) c.fillRect(r() * W, hz + r() * (H - hz), 10 + r() * 30, 1.5);
      c.fillStyle = S.sun + '55'; c.fillRect(sx - sr, hz, sr * 2, H - hz);   // sun path on the water
    }
    if (S.kind === 'lake') { ridge(hz, H * 0.08, S.hills[2], 3, false); for (let i = 0; i < 26; i++) { const tx = r() * W, th = 20 + r() * 26; c.fillStyle = i % 3 ? S.hills[1] : S.hills[0]; c.beginPath(); c.ellipse(tx, hz - th * 0.6, th * 0.45, th * 0.6, 0, 0, 7); c.fill(); } }
    if (S.kind === 'ocean') { c.fillStyle = S.hills[2]; c.beginPath(); c.moveTo(W, hz - H * 0.2); c.lineTo(W * 0.72, hz - H * 0.17); c.lineTo(W * 0.62, hz + 6); c.lineTo(W, H * 0.8); c.fill(); c.fillStyle = S.hills[1]; c.fillRect(W * 0.62, hz - H * 0.2 - 4, W * 0.4, 8); }
    if (S.kind === 'beach') { c.fillStyle = S.hills[1]; c.beginPath(); c.moveTo(0, H); c.lineTo(0, H * 0.84); c.quadraticCurveTo(W * 0.5, H * 0.78, W, H * 0.88); c.lineTo(W, H); c.fill();
      for (const [px, lean] of [[W * 0.12, 0.25], [W * 0.86, -0.2]]) { c.strokeStyle = S.hills[2]; c.lineWidth = 7; c.beginPath(); c.moveTo(px, H * 0.86); c.quadraticCurveTo(px + lean * 60, H * 0.7, px + lean * 90, H * 0.56); c.stroke();
        c.fillStyle = S.hills[2]; for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2; c.beginPath(); c.ellipse(px + lean * 90 + Math.cos(a) * 30, H * 0.56 + Math.sin(a) * 10 + 8, 34, 8, a, 0, 7); c.fill(); } } }
    // near hills, trees and flowers
    if (S.kind === 'meadow' || S.kind === 'lavender' || S.kind === 'pines' || S.kind === 'mesa') { ridge(hz + 10, H * 0.08, S.hills[0], 0, false); ridge(hz + H * 0.12, H * 0.07, S.hills[1], 0, false); ridge(hz + H * 0.24, H * 0.06, S.hills[2], 0, false); }
    if (S.kind === 'pines') for (let i = 0; i < 46; i++) { const tx = r() * W, ty = hz + r() * H * 0.3, th = 24 + (ty - hz) * 0.5; c.fillStyle = i % 2 ? '#24503a' : '#1c4230'; c.beginPath(); c.moveTo(tx, ty - th); c.lineTo(tx - th * 0.3, ty); c.lineTo(tx + th * 0.3, ty); c.fill(); }
    if (S.kind === 'meadow' || S.kind === 'lavender') for (let i = 0; i < 160; i++) { const fx = r() * W, fy = hz + H * 0.1 + r() * H * 0.3; c.fillStyle = S.kind === 'lavender' ? (i % 2 ? '#c9a0ff' : '#9a6ad8') : ['#fff', '#ffd1e6', '#ffe28a'][i % 3]; c.fillRect(fx, fy, 2.4, 2.4); }
    if (S.kind === 'peaks' || S.kind === 'aurora') { ridge(hz + H * 0.12, H * 0.05, S.hills[0], 0, false); for (let i = 0; i < 18; i++) { const tx = r() * W, ty = hz + H * 0.08 + r() * H * 0.2, th = 22 + r() * 14; c.fillStyle = '#2f4a52'; c.beginPath(); c.moveTo(tx, ty - th); c.lineTo(tx - th * 0.28, ty); c.lineTo(tx + th * 0.28, ty); c.fill(); } }
    // a soft dark band behind the wheel so the letters always read
    const bg2 = c.createLinearGradient(0, H * 0.55, 0, H); bg2.addColorStop(0, 'rgba(10,14,30,0)'); bg2.addColorStop(1, 'rgba(10,14,30,.35)'); c.fillStyle = bg2; c.fillRect(0, H * 0.55, W, H * 0.45);
    document.documentElement.style.setProperty('--acc', S.acc[0]); document.documentElement.style.setProperty('--acc2', S.acc[1]);
  }

  // ---------------------------------------------------------------- sound
  let AC = null;
  function tone(f, d, o) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); o = o || {};
    const t = AC.currentTime + (o.at || 0), os = AC.createOscillator(), g = AC.createGain(); os.type = o.type || 'triangle'; os.frequency.setValueAtTime(f, t); if (o.to) os.frequency.exponentialRampToValueAtTime(o.to, t + d);
    g.gain.setValueAtTime(o.vol || 0.07, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); os.connect(g).connect(AC.destination); os.start(t); os.stop(t + d + 0.05); } catch (e) {} }
  const tune = (notes, step, o) => notes.forEach((f, i) => tone(f, step * 1.4, Object.assign({ at: i * step }, o || {})));

  // ---------------------------------------------------------------- saved progress (kept on this phone only)
  let st = { level: 0, coins: 100, found: [], bonus: [], hints: [], best: 0, totalBonus: 0 };
  try { const s = JSON.parse(localStorage.getItem(SAVE)); if (s && typeof s.level === 'number') st = Object.assign(st, s); } catch (e) {}
  st.level = Math.max(0, Math.min(LV.length - 1, st.level));
  const save = () => { try { localStorage.setItem(SAVE, JSON.stringify(st)); } catch (e) {} };
  // My Scores: the highest level finished, and each finished level counts as a play
  function record(n) {
    try { const best = +localStorage.getItem('pa-wordwheel') || 0; if (n > best) localStorage.setItem('pa-wordwheel', n);
      const s = JSON.parse(localStorage.getItem('pa-stats') || '{}') || {}, r = s.wordwheel || { n: 0 }; r.n = (r.n || 0) + 1; r.at = Date.now(); r.last = n; if (n > best) r.bAt = r.at; s.wordwheel = r; localStorage.setItem('pa-stats', JSON.stringify(s)); } catch (e) {}
  }

  // ---------------------------------------------------------------- the level
  let L, cells, words, letters, order, sel = [], DICT = null, busy = false;
  function setup() {
    L = LV[st.level]; cells = new Map(); words = [];
    L.p.forEach(([w, x, y, d], i) => { const ks = []; for (let k = 0; k < w.length; k++) { const cx = x + (d ? 0 : k), cy = y + (d ? k : 0), key = cx + ',' + cy; ks.push(key);
      if (!cells.has(key)) cells.set(key, { x: cx, y: cy, ch: w[k], on: false, hint: false }); } words.push({ w, ks, found: false }); });
    for (const w of words) if (st.found.includes(w.w)) { w.found = true; for (const k of w.ks) cells.get(k).on = true; }
    for (const k of st.hints) if (cells.has(k)) cells.get(k).hint = true;
    letters = L.l.split(''); order = letters.map((_, i) => i);
    const S = scene(st.level);
    $('lvl').innerHTML = '<b>LEVEL ' + (st.level + 1) + '</b><small>' + S.name + ' · ' + (st.level % 20 + 1) + '/20</small>';
    $('coins').textContent = st.coins; $('bcount').textContent = st.bonus.length;
    paint(); layout();
  }
  // sizes: the crossword fills its area, the wheel takes what's left at the bottom
  function layout() {
    if (!L) return;
    const land = innerWidth > innerHeight && innerHeight <= 620, gw = $('gridWrap').getBoundingClientRect(), bw = $('bottom').getBoundingClientRect().width;
    // leave room for the button stacks on both sides of the wheel
    const wheelD = Math.max(150, land ? Math.min(innerHeight - 130, bw - 150, 300) : Math.min(bw - 150, innerHeight * 0.34, 300));
    const wheel = $('wheel'); wheel.style.width = wheel.style.height = wheelD + 'px';
    const lb = $('leftBtns'), rb = $('rightBtns'); lb.style.left = 'calc(50% - ' + (wheelD / 2 + 70) + 'px)'; rb.style.left = 'calc(50% + ' + (wheelD / 2 + 14) + 'px)';
    lb.style.bottom = rb.style.bottom = '0px';
    const gwW = gw.width - 8, gwH = gw.height - 8, size = Math.max(16, Math.min(52, Math.floor(Math.min(gwW / L.w, gwH / L.h)))), gap = Math.max(2, Math.round(size * 0.08));
    const grid = $('grid'); grid.style.width = (L.w * size) + 'px'; grid.style.height = (L.h * size) + 'px'; grid.innerHTML = '';
    for (const [k, c] of cells) {
      const d = document.createElement('div'); d.className = 'cell' + (c.on ? ' on' : c.hint ? ' hint' : ''); d.dataset.k = k;
      d.style.left = (c.x * size + gap / 2) + 'px'; d.style.top = (c.y * size + gap / 2) + 'px'; d.style.width = d.style.height = (size - gap) + 'px'; d.style.fontSize = Math.round(size * 0.56) + 'px';
      d.textContent = c.on || c.hint ? c.ch : ''; c.el = d; grid.appendChild(d);
    }
    $('grid').setAttribute('aria-label', 'crossword, ' + words.filter(w => w.found).length + ' of ' + words.length + ' words found');
    placeLetters(false);
  }
  function placeLetters(anim) {
    const wheel = $('wheel'), D = wheel.clientWidth, R = D * 0.33, n = letters.length, ls = Math.round(D * (n > 6 ? 0.2 : 0.23));
    wheel.querySelectorAll('.let').forEach(e => { if (!anim) e.remove(); });
    order.forEach((li, slot) => {
      const a = -Math.PI / 2 + slot / n * Math.PI * 2, x = D / 2 + Math.cos(a) * R, y = D / 2 + Math.sin(a) * R;
      let e = wheel.querySelector('.let[data-i="' + li + '"]');
      if (!e) { e = document.createElement('div'); e.className = 'let'; e.dataset.i = li; e.textContent = letters[li]; wheel.appendChild(e); }
      e.style.width = e.style.height = ls + 'px'; e.style.fontSize = Math.round(ls * 0.72) + 'px'; e.style.left = x + 'px'; e.style.top = y + 'px';
      e._x = x; e._y = y; e._r = ls * 0.62;
    });
    const cv = $('lines'), dpr = Math.min(devicePixelRatio || 1, 2); cv.width = D * dpr; cv.height = D * dpr; drawLines(null);
  }

  // ---------------------------------------------------------------- swiping
  function letterAt(px, py) { for (const e of $('wheel').querySelectorAll('.let')) if (Math.hypot(px - e._x, py - e._y) < e._r) return +e.dataset.i; return -1; }
  function drawLines(finger) {
    const cv = $('lines'), c = cv.getContext('2d'), dpr = cv.width / ($('wheel').clientWidth || 1); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, cv.width, cv.height);
    if (!sel.length) return;
    const pts = sel.map(i => { const e = $('wheel').querySelector('.let[data-i="' + i + '"]'); return [e._x, e._y]; }); if (finger) pts.push(finger);
    c.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--acc'); c.lineWidth = 9; c.lineCap = 'round'; c.lineJoin = 'round'; c.globalAlpha = 0.85;
    c.beginPath(); pts.forEach((p, k) => k ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.stroke();
  }
  function showWord(cls) { const w = $('word'); w.className = sel.length ? 'has ' + (cls || '') : (cls ? 'has ' + cls : ''); w.querySelector('span').textContent = sel.map(i => letters[i]).join(''); }
  function updSel() { $('wheel').querySelectorAll('.let').forEach(e => e.classList.toggle('sel', sel.includes(+e.dataset.i))); showWord(); if (!dragging) drawLines(null); }
  let dragging = false;
  const wheelEl = () => $('wheel');
  function local(e) { const r = wheelEl().getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  function addLetter(i) { sel.push(i); tone(420 + sel.length * 70, 0.12, { vol: 0.05 }); updSel(); }
  addEventListener('pointerdown', e => {
    if (busy || !DICT || !$('ov').hidden || !wheelEl().contains(e.target)) return;
    const [x, y] = local(e), i = letterAt(x, y); if (i < 0) return;
    dragging = true; sel = []; addLetter(i); try { wheelEl().setPointerCapture(e.pointerId); } catch (_) {} drawLines([x, y]); e.preventDefault();
  });
  addEventListener('pointermove', e => {
    if (!dragging) return; const [x, y] = local(e), i = letterAt(x, y);
    if (i >= 0) { if (!sel.includes(i)) addLetter(i); else if (sel.length > 1 && sel[sel.length - 2] === i) { sel.pop(); updSel(); } }   // slide back to undo the last letter
    drawLines([x, y]);
  });
  const finish = () => { if (!dragging) return; dragging = false; const w = sel.map(i => letters[i]).join(''); drawLines(null); submit(w); };
  addEventListener('pointerup', finish); addEventListener('pointercancel', finish);
  // typing works too (keyboard)
  addEventListener('keydown', e => {
    if (!DICT || busy || !$('ov').hidden) return;
    if (e.key === 'Enter') { const w = sel.map(i => letters[i]).join(''); submit(w); return; }
    if (e.key === 'Backspace') { sel.pop(); updSel(); return; }
    const k = e.key.toUpperCase(); if (k.length !== 1 || k < 'A' || k > 'Z') return;
    const i = letters.findIndex((ch, j) => ch === k && !sel.includes(j)); if (i >= 0) addLetter(i);
  });

  // ---------------------------------------------------------------- checking a word
  function submit(w) {
    if (w.length < 3) { sel = []; updSel(); return; }
    const hit = words.find(x => x.w === w);
    if (hit && !hit.found) { found(hit); sel = []; updSel(); return; }
    if (hit) { showWord('dup'); for (const k of hit.ks) { const el = cells.get(k).el; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } tone(300, 0.15, { vol: 0.04 }); return later(); }
    if (DICT.has(w.toLowerCase())) {
      if (st.bonus.includes(w)) { showWord('dup'); toast('ALREADY FOUND'); return later(); }
      st.bonus.push(w); st.totalBonus = (st.totalBonus || 0) + 1; st.coins += 2; save(); showWord('bonus'); flyStar(); toast('BONUS WORD +2');
      $('coins').textContent = st.coins; $('bcount').textContent = st.bonus.length; tune([880, 1175, 1568], 0.07, { vol: 0.05 }); return later();
    }
    showWord('bad'); tone(160, 0.25, { type: 'square', vol: 0.04 }); later();
  }
  function later() { setTimeout(() => { if (!dragging) { sel = []; updSel(); } }, 520); }
  function found(w) {
    w.found = true; st.found.push(w.w); save();
    // the letters fly from the word box into their squares
    const src = $('word').getBoundingClientRect();
    w.ks.forEach((k, j) => {
      const c = cells.get(k), r = c.el.getBoundingClientRect(), f = document.createElement('div'); f.className = 'fly'; f.textContent = c.ch;
      f.style.left = (src.left + src.width / 2 - 8 + (j - w.ks.length / 2) * 16) + 'px'; f.style.top = (src.top + 8) + 'px'; document.body.appendChild(f);
      requestAnimationFrame(() => { f.style.transform = 'translate(' + (r.left - parseFloat(f.style.left) + r.width / 2 - 8) + 'px,' + (r.top - parseFloat(f.style.top) + r.height / 2 - 12) + 'px)'; f.style.opacity = '0.2'; });
      setTimeout(() => { f.remove(); c.on = true; c.el.className = 'cell on pop'; c.el.textContent = c.ch; }, 380 + j * 60);
    });
    tune([523, 659, 784].slice(0, 2 + (w.w.length > 4)), 0.08, { vol: 0.06 });
    if (words.every(x => x.found)) { busy = true; setTimeout(complete, 900 + w.ks.length * 60); }
  }
  function toast(s) { const t = $('toast'); t.textContent = s; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 900); }
  function flyStar() {
    const b = $('bonus').getBoundingClientRect(), s = $('word').getBoundingClientRect(), f = document.createElement('div'); f.className = 'fly'; f.textContent = '★'; f.style.fontSize = '30px'; f.style.color = '#ffd34f';
    f.style.left = (s.left + s.width / 2) + 'px'; f.style.top = s.top + 'px'; document.body.appendChild(f);
    requestAnimationFrame(() => { f.style.transform = 'translate(' + (b.left - s.left - s.width / 2 + 12) + 'px,' + (b.top - s.top + 10) + 'px) scale(.6)'; f.style.opacity = '0.3'; });
    setTimeout(() => f.remove(), 950);
  }
  // ---------------------------------------------------------------- shuffle and hint
  $('shuffle').onclick = () => { if (busy) return; for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } placeLetters(true); tone(600, 0.08, { vol: 0.04 }); tone(800, 0.08, { at: 0.06, vol: 0.04 }); };
  $('hint').onclick = () => {
    if (busy || !DICT) return;
    if (st.coins < HINT) { toast('NEED ' + HINT + ' COINS'); tone(180, 0.2, { vol: 0.04 }); return; }
    // the first hidden letter of an unfound word (short words first)
    const w = words.filter(x => !x.found).sort((a, b) => a.w.length - b.w.length)[0]; if (!w) return;
    const k = w.ks.find(k => !cells.get(k).on && !cells.get(k).hint); if (!k) return;
    st.coins -= HINT; st.hints.push(k); const c = cells.get(k); c.hint = true; c.el.className = 'cell hint pop'; c.el.textContent = c.ch;
    $('coins').textContent = st.coins; tone(988, 0.15, { vol: 0.05 });
    // a word whose letters are all showing counts as found
    for (const x of words) if (!x.found && x.ks.every(k => cells.get(k).on || cells.get(k).hint)) found(x);
    save();
  };
  // ---------------------------------------------------------------- bonus words list
  $('bonus').onclick = () => {
    const ov = $('ov'); ov.innerHTML = '<h1>BONUS WORDS</h1><p>Extra real words you spelled on this level. Each one is worth 2 coins.</p><div id="bonusList"></div><div class="row"><button class="big" id="cl">BACK</button></div>';
    const bl = $('bonusList'); if (!st.bonus.length) bl.innerHTML = '<span>None yet: try spelling other words with these letters!</span>'; else st.bonus.forEach(w => { const s = document.createElement('span'); s.textContent = w; bl.appendChild(s); });
    ov.hidden = false; $('cl').onclick = () => { ov.hidden = true; }; $('cl').focus();
  };
  // ---------------------------------------------------------------- level complete
  const PRAISE = ['GREAT!', 'BRILLIANT!', 'SPLENDID!', 'AWESOME!', 'SUPERB!', 'NICE ONE!', 'WONDERFUL!', 'FANTASTIC!'];
  function complete() {
    const n = st.level + 1, chEnd = n % 20 === 0, used = st.hints.length, earn = 10 + (used ? 0 : 5) + (chEnd ? 50 : 0);
    st.coins += earn; record(n);
    tune([523, 659, 784, 1047, 1319], 0.1, { vol: 0.06 });
    const ov = $('ov'), last = n >= LV.length;
    ov.innerHTML = '<h1>' + (last ? 'YOU DID IT!' : chEnd ? 'CHAPTER DONE!' : PRAISE[n % PRAISE.length]) + '</h1><p>' +
      (last ? 'Every one of the ' + LV.length + ' levels is finished. Amazing!' : chEnd ? 'You finished ' + scene(st.level).name + '. Next up: ' + scene(n).name + '!' : 'Level ' + n + ' done.') +
      '</p><div class="pill"><span class="coin"></span>+' + earn + (used ? '' : ' (no hints bonus)') + '</div><div class="row"><button class="big" id="nx">' + (last ? 'PLAY AGAIN' : 'NEXT LEVEL') + '</button></div>';
    ov.hidden = false; $('nx').focus();
    $('nx').onclick = () => { st.level = last ? 0 : n; st.found = []; st.bonus = []; st.hints = []; save(); ov.hidden = true; busy = false; setup(); };
    save();
  }

  // ---------------------------------------------------------------- start: load the dictionary for bonus words
  addEventListener('resize', () => { clearTimeout(layout.t); layout.t = setTimeout(() => { paint(); layout(); }, 80); });
  setup();
  fetch('../lib/words.txt').then(r => r.text()).then(t => {
    DICT = new Set(); for (const w of t.split('\n')) if (w && w[0] !== '#') DICT.add(w.trim());
    $('load').remove();
    if (st.level === 0 && !st.found.length && !localStorage.getItem('ww-seen')) {
      try { localStorage.setItem('ww-seen', '1'); } catch (e) {}
      const ov = $('ov'); ov.innerHTML = '<h1>WORD WHEEL</h1><p>Slide your finger across the letters on the wheel to spell words, then let go. Every word fills in part of the crossword. Extra real words are bonus words worth coins.</p><p>Stuck? Tap the arrows to shuffle, or the light bulb to show a letter.</p><div class="row"><button class="big" id="go">PLAY</button></div>';
      ov.hidden = false; $('go').onclick = () => { ov.hidden = true; tone(660, 0.1, { vol: 0.04 }); }; $('go').focus();
    }
  }).catch(() => { $('load').textContent = 'Could not load the word list. Check your connection and reopen the game.'; });
})();
</script>
</body>
</html>
