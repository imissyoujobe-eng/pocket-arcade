<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Oval Rush</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600&display=swap">
<style>
/* Layout: full-screen top-down speedway with chase camera; race strip on top; left/right halves of the screen steer */
:root{--asphalt:#3a3d44;--grass:#3f8f3a;--paint:#f6f3e8;--you:#ffd23f;--ink:#fff;--bg:#2f7a2c;
--display:'Bungee',Impact,system-ui,sans-serif;--body:'Rubik',system-ui,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%}canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:10px 16px;font-family:var(--display);font-size:clamp(14px,4vw,20px);text-shadow:0 2px 0 rgba(0,0,0,.5);pointer-events:none;font-variant-numeric:tabular-nums}
#hint{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;padding-inline:16px;pointer-events:none;font-family:var(--display);font-size:28px;opacity:.35}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:rgba(18,22,26,.84);padding-inline:16px}
#overlay h1{font-family:var(--display);font-size:clamp(44px,14vw,84px);margin:0;color:var(--you);font-style:italic;text-shadow:4px 4px 0 #d7263d}
#overlay p{margin:0;max-width:32ch;line-height:1.5}
#go{font-family:var(--display);font-size:20px;padding:12px 32px;border:0;border-radius:999px;background:#d7263d;color:#fff;box-shadow:0 5px 0 #8a1526;cursor:pointer}
#go:active{transform:translateY(3px)}#go:focus-visible{outline:3px solid var(--you);outline-offset:3px}
</style>
<div id="wrap"><canvas id="c"></canvas>
  <div id="hud"><span id="lap">LAP 1/5</span><span id="pos">P4</span><span id="spd">0 MPH</span></div>
  <div id="hint"><span>◀</span><span>▶</span></div>
  <div id="overlay"><h1>OVAL RUSH</h1><p id="msg">Five laps, four cars, one checkered flag. Your car floors it on its own. Steer with the joystick (or arrow keys) and hold GAS (or Space) to go. Pull back to brake. Stay off the grass.</p><div id="best"></div><button id="go">Start your engine</button></div>
</div>
<script src="../lib/art.js"></script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
// track: two straights + two semicircles
const L=1400,RAD=520,TW=170,M=400,LAPS=5;
const pts=[];{const per=2*L+2*Math.PI*RAD;for(let i=0;i<M;i++){let s=i/M*per,x,y;
  if(s<L){x=-L/2+s;y=RAD}else if((s-=L)<Math.PI*RAD){const a=Math.PI/2-s/RAD;x=L/2+Math.cos(a)*RAD;y=Math.sin(a)*RAD}
  else if((s-=Math.PI*RAD)<L){x=L/2-s;y=-RAD}else{s-=L;const a=-Math.PI/2-s/RAD;x=-L/2+Math.cos(a)*RAD;y=Math.sin(a)*RAD}pts.push({x,y})}}
function nearest(x,y,hint){let bi=0,bd=1e18;const range=hint==null?M:40;for(let k=-range/2;k<range/2;k++){const i=hint==null?k+range/2:((hint+k)%M+M)%M;const p=pts[i],d=(p.x-x)**2+(p.y-y)**2;if(d<bd){bd=d;bi=i}}return{i:bi,d:Math.sqrt(bd)}}
const COLORS=['#ffd23f','#d7263d','#2e86de','#1b998b'],NUMS=[7,14,22,31];
let cars,state='menu',keys={},steerTouch={},count=0,raceTime=0,AC,eng,best=null,finishOrder=[];
try{best=JSON.parse(localStorage.getItem('oval-best'))}catch(e){}if(best)$('best').textContent='BEST '+best.toFixed(2)+'s';
function setup(){cars=COLORS.map((c,i)=>{const row=Math.floor(i/2),lane=i%2;const p=pts[M-4-row*8],n=pts[(M-3-row*8)%M];const a=Math.atan2(n.y-p.y,n.x-p.x);
  const off=(lane?1:-1)*TW*.22;return{x:p.x-Math.sin(a)*off,y:p.y+Math.cos(a)*off,a,v:0,c,num:NUMS[i],cpu:i>0,idx:M-4-row*8,prog:-(4+row*8),lap:0,done:false,skill:.9+Math.random()*.08-(i===3?.04:0),laneOff:off,finish:0}});
  // player starts at back
  const you=cars[0];const back=cars[3];[you.x,back.x]=[back.x,you.x];[you.y,back.y]=[back.y,you.y];[you.idx,back.idx]=[back.idx,you.idx];[you.prog,back.prog]=[back.prog,you.prog];[you.laneOff,back.laneOff]=[back.laneOff,you.laneOff]}
function start(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();eng=AC.createOscillator();const g=AC.createGain();g.gain.value=.03;eng.type='sawtooth';eng.frequency.value=40;eng.connect(g).connect(AC.destination);eng.start()}catch(e){}}
  setup();count=3.5;raceTime=0;finishOrder=[];state='play';$('overlay').hidden=true}
$('go').onclick=start;setup();
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key.startsWith('Arrow'))e.preventDefault();if(e.key==='Enter'&&state!=='play')start()});addEventListener('keyup',e=>keys[e.key]=0);
cv.addEventListener('pointerdown',e=>steerTouch[e.pointerId]=e.clientX<W/2?-1:1);cv.addEventListener('pointermove',e=>{if(steerTouch[e.pointerId])steerTouch[e.pointerId]=e.clientX<W/2?-1:1});
['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,e=>delete steerTouch[e.pointerId]));
function beep(f,d,v=.08){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
const MAXV=620;
function update(dt){
  if(count>0){const before=Math.ceil(count);count-=dt;if(Math.ceil(count)!==before&&count>0)beep(440,.15);if(count<=0)beep(880,.4);return}
  raceTime+=dt;
  for(const c of cars){
    const n=nearest(c.x,c.y,c.idx);let di=n.i-c.idx;if(di<-M/2)di+=M;if(di>M/2)di-=M;c.idx=n.i;c.prog+=di;
    const offTrack=n.d>TW/2;
    let steer=0,throttle=1;
    if(c.done){throttle=.3}
    if(!c.cpu){steer=(keys.ArrowLeft||keys.a?-1:0)+(keys.ArrowRight||keys.d?1:0);for(const k in steerTouch)steer+=steerTouch[k];steer=Math.max(-1,Math.min(1,steer));throttle=(keys[' ']||keys.ArrowUp||keys.w)?1:0;if(keys.ArrowDown||keys.s)throttle=-.6}
    else{const look=pts[(c.idx+12)%M],nx=pts[(c.idx+13)%M];const la=Math.atan2(nx.y-look.y,nx.x-look.x);const tx=look.x-Math.sin(la)*c.laneOff,ty=look.y+Math.cos(la)*c.laneOff;
      let want=Math.atan2(ty-c.y,tx-c.x)-c.a;while(want>Math.PI)want-=2*Math.PI;while(want<-Math.PI)want+=2*Math.PI;steer=Math.max(-1,Math.min(1,want*3));
      // avoid cars ahead by shifting lane
      for(const o of cars)if(o!==c){const dx=o.x-c.x,dy=o.y-c.y,ahead=dx*Math.cos(c.a)+dy*Math.sin(c.a),side=-dx*Math.sin(c.a)+dy*Math.cos(c.a);if(ahead>0&&ahead<120&&Math.abs(side)<40)c.laneOff+=(side>0?-1:1)*60*dt}
      c.laneOff=Math.max(-TW*.32,Math.min(TW*.32,c.laneOff))}
    const max=(offTrack?MAXV*.45:MAXV)*(c.cpu?c.skill:1);
    c.v+=(throttle>0?throttle*(max-c.v)*.9:throttle*400)*dt;if(c.v>max)c.v-=(c.v-max)*3*dt;
    c.a+=steer*dt*(1.9-c.v/MAXV*.6)*Math.min(1,c.v/120);
    c.x+=Math.cos(c.a)*c.v*dt;c.y+=Math.sin(c.a)*c.v*dt;
    // hard outer wall
    if(n.d>TW/2+120){const p=pts[n.i];const k=(TW/2+120)/n.d;c.x=p.x+(c.x-p.x)*k;c.y=p.y+(c.y-p.y)*k;c.v*=.6;if(!c.cpu)beep(90,.1,.06)}
    const lapNow=Math.floor((c.prog)/M);if(lapNow>c.lap){c.lap=lapNow;if(c.lap>=LAPS&&!c.done){c.done=true;c.finish=raceTime;finishOrder.push(c);if(!c.cpu)finish()}else if(!c.cpu)beep(660,.12)}
  }
  // car-to-car bumps
  for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){const a=cars[i],b=cars[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d<34&&d>0){const push=(34-d)/2,nx=dx/d,ny=dy/d;a.x-=nx*push;a.y-=ny*push;b.x+=nx*push;b.y+=ny*push;a.v*=.97;b.v*=.97}}
  const me=cars[0];$('lap').textContent='LAP '+Math.min(LAPS,Math.max(1,me.lap+1))+'/'+LAPS;$('pos').textContent='P'+place();$('spd').textContent=Math.round(me.v*.36)+' MPH';
  if(eng)eng.frequency.setTargetAtTime(40+me.v*.22,AC.currentTime,.05);
}
function place(){const me=cars[0];if(me.done)return finishOrder.indexOf(me)+1;return 1+cars.filter(c=>c!==me&&(c.done||c.prog>me.prog)).length}
function finish(){const p=place();const t=raceTime;state='over';if(p===1&&(!best||t<best)){best=t;try{localStorage.setItem('oval-best',JSON.stringify(best))}catch(e){}}
  setTimeout(()=>{$('msg').textContent=(p===1?'🏁 Victory lane! ':'Checkered flag. You finished P'+p+'. ')+'Time: '+t.toFixed(2)+'s';$('best').textContent=best?'BEST WIN '+best.toFixed(2)+'s':'';$('go').textContent='Race again';$('overlay').hidden=false;if(eng)eng.frequency.value=30},1500)}
// ---- detail art: the whole speedway is painted once into a cached world image ----
const WX0=-L/2-RAD-520,WY0=-RAD-520,WW=L+2*RAD+1040,WH=2*RAD+1040,WS=.75;let worldCv=null;
function trackPath(c,off){c.beginPath();pts.forEach((p,i)=>{const n=pts[(i+1)%M],a=Math.atan2(n.y-p.y,n.x-p.x),x=p.x-Math.sin(a)*off,y=p.y+Math.cos(a)*off;i?c.lineTo(x,y):c.moveTo(x,y)});c.closePath()}
function buildWorld(){const c2=document.createElement('canvas');c2.width=WW*WS;c2.height=WH*WS;const c=c2.getContext('2d');c.scale(WS,WS);c.translate(-WX0,-WY0);
  // grass with mowing stripes and speckle
  c.fillStyle='#2f7a2c';c.fillRect(WX0,WY0,WW,WH);for(let x=WX0;x<WX0+WW;x+=160){c.fillStyle='#378a33';c.fillRect(x,WY0,80,WH)}
  for(let i=0;i<9000;i++){c.fillStyle=Math.random()<.5?'rgba(0,40,0,.18)':'rgba(170,230,120,.14)';c.fillRect(WX0+Math.random()*WW,WY0+Math.random()*WH,3,6)}
  // trees and a parking lot outside the wall
  for(let i=0;i<70;i++){const a=i/70*Math.PI*2,rx=L/2+RAD+340+A.hash(i,1)*120,ry=RAD+300+A.hash(i,2)*120,x=Math.cos(a)*rx,y=Math.sin(a)*ry;if(y>RAD+200&&Math.abs(x)<L/2+60)continue;c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.arc(x+14,y+14,40,0,7);c.fill();const tg=c.createRadialGradient(x-12,y-12,6,x,y,42);tg.addColorStop(0,'#5ab84a');tg.addColorStop(1,'#1e5a1e');c.fillStyle=tg;c.beginPath();c.arc(x,y,40,0,7);c.fill();c.fillStyle='rgba(255,255,255,.12)';c.beginPath();c.arc(x-14,y-14,12,0,7);c.fill()}
  // outer asphalt apron + SAFER wall (concrete with sponsor panels) + catch fence
  c.lineJoin='round';c.strokeStyle='#4a4d54';c.lineWidth=TW+300;trackPath(c,0);c.stroke();
  c.strokeStyle='#2f7a2c';c.lineWidth=TW+236;trackPath(c,0);c.stroke();
  c.lineWidth=18;c.strokeStyle='#c8ccd2';trackPath(c,(TW/2+120));c.stroke();c.lineWidth=4;c.strokeStyle='#8a8e96';trackPath(c,(TW/2+128));c.stroke();
  c.setLineDash([60,80]);c.lineWidth=12;c.strokeStyle='#d7263d';trackPath(c,(TW/2+120));c.stroke();c.strokeStyle='#2e86de';c.lineDashOffset=70;trackPath(c,(TW/2+120));c.stroke();c.setLineDash([]);c.lineDashOffset=0;
  c.lineWidth=2;c.strokeStyle='rgba(30,30,40,.6)';c.setLineDash([3,7]);trackPath(c,(TW/2+136));c.stroke();c.setLineDash([]);
  // racing surface: apron band, asphalt with grain, groove, tire marks
  c.strokeStyle='#6a6e76';c.lineWidth=TW+40;trackPath(c,0);c.stroke();c.strokeStyle='#3a3d44';c.lineWidth=TW;trackPath(c,0);c.stroke();
  c.save();c.lineWidth=TW;c.strokeStyle='#000';trackPath(c,0);c.globalCompositeOperation='source-atop';
  for(let i=0;i<40000;i++){const p=pts[i%M],r=(Math.random()-.5)*TW;c.fillStyle=Math.random()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.12)';c.fillRect(p.x+r+(Math.random()-.5)*40,p.y+(Math.random()-.5)*40,2,2)}c.restore();
  c.strokeStyle='rgba(20,20,24,.45)';c.lineWidth=40;trackPath(c,TW*.12);c.stroke();// racing groove
  c.strokeStyle='rgba(10,10,12,.35)';c.lineWidth=3;for(const o of[TW*.05,TW*.18,-TW*.08]){c.setLineDash([200+Math.random()*200,300]);trackPath(c,o);c.stroke()}c.setLineDash([]);
  // dashed center + white edge lines + red/white kerb on the inside
  c.setLineDash([40,40]);c.strokeStyle='rgba(246,243,232,.5)';c.lineWidth=4;trackPath(c,0);c.stroke();c.setLineDash([]);
  c.strokeStyle='#f6f3e8';c.lineWidth=4;trackPath(c,TW/2);c.stroke();trackPath(c,-TW/2);c.stroke();
  c.lineWidth=14;c.setLineDash([24,24]);c.strokeStyle='#d7263d';trackPath(c,-(TW/2+12));c.stroke();c.strokeStyle='#fff';c.lineDashOffset=24;trackPath(c,-(TW/2+12));c.stroke();c.setLineDash([]);c.lineDashOffset=0;
  c.strokeStyle='#ffd23f';c.lineWidth=5;trackPath(c,-(TW/2+24));c.stroke();
  // start/finish checkers + yard of bricks
  {const p=pts[0];for(let r=0;r<3;r++)for(let k=0;k<TW/20;k++){c.fillStyle=(r+k)%2?'#111':'#fff';c.fillRect(p.x+r*20-30,p.y-TW/2+k*20,20,20)}}
  // infield: pit road, garages, logo
  c.fillStyle='#4a4d54';c.fillRect(-L/2,RAD-TW/2-150,L,70);c.strokeStyle='#ffd23f';c.lineWidth=3;c.setLineDash([20,20]);c.beginPath();c.moveTo(-L/2,RAD-TW/2-115);c.lineTo(L/2,RAD-TW/2-115);c.stroke();c.setLineDash([]);
  for(let x=-L/2+20;x<L/2-60;x+=90){c.fillStyle='rgba(0,0,0,.3)';c.fillRect(x+8,RAD-TW/2-246,74,84);c.fillStyle='#d8dce2';c.fillRect(x,RAD-TW/2-252,74,84);c.fillStyle=['#d7263d','#2e86de','#ffd23f','#1b998b'][(x/90|0)&3];c.fillRect(x,RAD-TW/2-252,74,10);c.fillStyle='#5a5e66';c.fillRect(x+10,RAD-TW/2-196,54,28);c.fillStyle='rgba(0,0,0,.25)';for(let k=0;k<6;k++)c.fillRect(x+10,RAD-TW/2-194+k*4.5,54,1)}
  c.fillStyle='rgba(255,255,255,.2)';c.font='italic 160px Bungee, Impact, sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('OVAL RUSH',0,-30);
  c.strokeStyle='rgba(255,255,255,.25)';c.lineWidth=6;c.strokeRect(-L/2+60,-RAD+TW/2+90,L-120,180);
  // grandstand: tiered seats packed with fans, roof, flags
  const gy=RAD+TW/2+140;c.fillStyle='rgba(0,0,0,.35)';c.fillRect(-L/2+10,gy+14,L,110);
  for(let r=0;r<5;r++){c.fillStyle=r%2?'#8a8e96':'#a0a4ac';c.fillRect(-L/2,gy+r*20,L,20);for(let x=-L/2+6;x<L/2;x+=12){if(A.hash(x,r)<.1)continue;c.fillStyle=['#ffd23f','#d7263d','#2e86de','#fff','#1b998b','#ff7aa8','#ff9f43'][Math.abs((x*7+r*3)|0)%7];c.fillRect(x,gy+r*20+4,8,9);c.fillStyle=['#f2c8a0','#c88a5a','#8a5a3a'][Math.abs(x+r)%3];c.beginPath();c.arc(x+4,gy+r*20+4,3.5,0,7);c.fill()}}
  c.fillStyle='#d7263d';c.fillRect(-L/2-10,gy+100,L+20,22);c.fillStyle='#fff';c.font='bold 16px Bungee, Impact, sans-serif';for(let x=-L/2+60;x<L/2;x+=260)c.fillText('SPEEDWAY',x+60,gy+112);
  for(let x=-L/2;x<=L/2;x+=140){c.fillStyle='#5a5e66';c.fillRect(x-2,gy-20,4,24);c.fillStyle=['#d7263d','#ffd23f','#2e86de'][(x/140|0)%3+0>2?0:((x/140|0)%3+3)%3];c.fillRect(x+2,gy-20,18,10)}
  worldCv=c2}
function draw(){const me=cars[0],zoom=Math.min(1,Math.max(.55,Math.min(W,H)/700));if(!worldCv)buildWorld();
  ctx.fillStyle='#2f7a2c';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H/2+H*.12);ctx.scale(zoom,zoom);const lookX=me.x+Math.cos(me.a)*me.v*.25,lookY=me.y+Math.sin(me.a)*me.v*.25;ctx.translate(-lookX,-lookY);
  ctx.drawImage(worldCv,WX0,WY0,WW,WH);
  for(const c of [...cars].sort((a,b)=>a.cpu-b.cpu).reverse())drawCar(c);
  ctx.restore();
  A.vignette(ctx,W,H,.3);
  if(state==='play'&&count>0){ctx.font='72px Bungee, Impact, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';const t2=count>.5?Math.ceil(count-.5):'GO!';ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillText(t2,W/2+3,H*.35+4);ctx.fillStyle=count>.5?'#fff':'#7cff6b';ctx.fillText(t2,W/2,H*.35)}
  // minimap
  const mm=Math.min(110,W*.28),sx=mm/(L+2*RAD+TW),ox=W-mm-14,oy=48;ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.roundRect(ox-8,oy-8,mm+16,(2*RAD+TW)*sx+16,8);ctx.fill();
  ctx.strokeStyle='#3a3d44';ctx.lineWidth=5;ctx.beginPath();pts.forEach((p,i)=>{const x=ox+(p.x+L/2+RAD+TW/2)*sx,y=oy+(p.y+RAD+TW/2)*sx;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=1.2;ctx.stroke();
  for(const c of cars){ctx.fillStyle='#000';ctx.beginPath();ctx.arc(ox+(c.x+L/2+RAD+TW/2)*sx,oy+(c.y+RAD+TW/2)*sx,c.cpu?4:5.5,0,7);ctx.fill();ctx.fillStyle=c.c;ctx.beginPath();ctx.arc(ox+(c.x+L/2+RAD+TW/2)*sx,oy+(c.y+RAD+TW/2)*sx,c.cpu?3:4.5,0,7);ctx.fill()}}
function drawCar(c){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);ctx.scale(1.15,1.15);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.roundRect(-28,-12,62,30,8);ctx.fill();
  // tires with tread
  for(const [tx,ty,tw,th] of[[-24,-17,13,7],[-24,10,13,7],[12,-16,11,6],[12,10,11,6]]){ctx.fillStyle='#0a0a0e';ctx.beginPath();ctx.roundRect(tx,ty,tw,th,2);ctx.fill();ctx.fillStyle='#2a2a32';for(let k=2;k<tw-1;k+=3)ctx.fillRect(tx+k,ty+1,1,th-2)}
  // body: ink outline, gradient paint, hood + roof panels
  ctx.fillStyle='#0a0a0e';ctx.beginPath();ctx.moveTo(32,0);ctx.lineTo(11,-9);ctx.lineTo(-21,-11);ctx.lineTo(-26,0);ctx.lineTo(-21,11);ctx.lineTo(11,9);ctx.closePath();ctx.fill();
