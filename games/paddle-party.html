<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Paddle Party</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600&display=swap">
<style>
/* Layout: vertical arena (phone-first), you at the bottom, CPU or friend at the top; mode picker on the title card */
:root{--bg:#0e1020;--line:#2b2f55;--p1:#3ef0c9;--p2:#ff5fa2;--ball:#fff36b;--ink:#eef0ff;
--display:'Bungee',Impact,system-ui,sans-serif;--body:'Rubik',system-ui,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center;padding-inline:16px;box-sizing:border-box}
#stage{position:relative;height:min(100%,calc((100vw - 32px)*1.6));aspect-ratio:10/16;max-width:100%}
canvas{width:100%;height:100%;display:block}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:rgba(14,16,32,.86);padding-inline:16px}
#overlay h1{font-family:var(--display);font-size:clamp(34px,11vw,60px);line-height:1;margin:0;color:var(--p1);text-shadow:3px 3px 0 var(--p2)}
#overlay p{margin:0;max-width:30ch;line-height:1.5;opacity:.9}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{font-family:var(--display);font-size:14px;padding:9px 14px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--p1);background:rgba(62,240,201,.15);color:var(--p1)}
#go{font-family:var(--display);font-size:20px;padding:12px 32px;border:0;border-radius:999px;background:var(--p1);color:#04221b;box-shadow:0 5px 0 #179c7f;cursor:pointer}
button:active{transform:translateY(2px)}button:focus-visible{outline:3px solid var(--ball);outline-offset:3px}
.lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
</style>
<div id="wrap"><div id="stage"><canvas id="c" width="400" height="640"></canvas>
  <div id="overlay"><h1>PADDLE<br>PARTY</h1><p id="msg">Four games, one paddle. First to 7 wins. Drag your side of the screen to move.</p>
    <span class="lbl">Game</span><div class="row" id="modes"><button class="chip" aria-pressed="true" data-m="classic">Classic</button><button class="chip" aria-pressed="false" data-m="soccer">Soccer</button><button class="chip" aria-pressed="false" data-m="hockey">Hockey</button><button class="chip" aria-pressed="false" data-m="hoops">Hoops</button></div>
    <span class="lbl">Players</span><div class="row" id="players"><button class="chip" aria-pressed="true" data-p="1">1P vs CPU</button><button class="chip" aria-pressed="false" data-p="2">2 Players</button></div>
    <button id="go">Play</button></div>
</div></div>
<script src="../lib/art.js"></script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const W=400,H=640,PW=70,PH=12,BR=8,WIN=7;
let mode='classic',players=1,state='menu',p1,p2,ball,s1,s2,serveT,AC,flash=0,trail=[];
function pick(groupId,attr,cb){$(groupId).querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$(groupId).querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));cb(b.dataset[attr])})}
pick('modes','m',v=>mode=v);pick('players','p',v=>players=+v);
function beep(f,d,v=.06,type='square'){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
const GOAL=()=>mode==='soccer'||mode==='hockey'?140:W;
function start(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  p1={x:W/2,y:H-50,tx:W/2,ty:H-50};p2={x:W/2,y:50,tx:W/2,ty:50};s1=0;s2=0;serve(1);state='play';$('overlay').hidden=true}
function serve(dir){ball={x:W/2,y:H/2,vx:(Math.random()-.5)*160,vy:0,dir};serveT=.9;trail=[]}
$('go').onclick=start;
// input: bottom half moves p1; top half moves p2 in 2P
const ptrs={};
function toCanvas(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function handle(e){if(state!=='play')return;const c=toCanvas(e);const who=players===2&&c.y<H/2?p2:p1;who.tx=c.x;if(mode==='hockey'){who.ty=who===p1?Math.max(H/2+30,Math.min(H-30,c.y)):Math.max(30,Math.min(H/2-30,c.y))}}
cv.addEventListener('pointerdown',e=>{ptrs[e.pointerId]=1;handle(e)});cv.addEventListener('pointermove',e=>{if(ptrs[e.pointerId]||e.pointerType==='mouse')handle(e)});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,e=>delete ptrs[e.pointerId]));
const keys={};addEventListener('keydown',e=>{keys[e.key]=1;if(e.key==='Enter'&&state!=='play')start()});addEventListener('keyup',e=>keys[e.key]=0);
function paddleHit(p,top){const half=PW/2;
  if(Math.abs(ball.x-p.x)<half+BR&&Math.abs(ball.y-p.y)<PH/2+BR&&(top?ball.vy<0:ball.vy>0)){
    const off=(ball.x-p.x)/half;const sp=Math.min(720,Math.hypot(ball.vx,ball.vy)*1.06+10);const ang=off*1.05;
    ball.vx=Math.sin(ang)*sp;ball.vy=(top?1:-1)*Math.cos(ang)*sp;
    if(mode==='hockey')ball.vy+=(top?1:-1)*Math.abs(p.vy||0)*.4;
    ball.y=p.y+(top?1:-1)*(PH/2+BR);flash=.08;beep(top?520:660,.05)}}
function update(dt){
  if(keys.ArrowLeft)p1.tx-=420*dt;if(keys.ArrowRight)p1.tx+=420*dt;if(keys.a)p2.tx-=420*dt;if(keys.d)p2.tx+=420*dt;
  if(players===1){const lead=mode==='hoops'?ball.x:ball.x+ball.vx*.15;const react=mode==='classic'?.85:.75;p2.tx+=(lead-p2.tx)*Math.min(1,dt*6*react);
    if(mode==='hockey')p2.ty=ball.y<H/2?Math.max(30,Math.min(H/2-30,ball.y-30)):60}
  for(const p of [p1,p2]){p.tx=Math.max(PW/2,Math.min(W-PW/2,p.tx));const oy=p.y;p.x+=(p.tx-p.x)*Math.min(1,dt*20);p.y+=(p.ty-p.y)*Math.min(1,dt*20);p.vy=(p.y-oy)/dt}
  if(serveT>0){serveT-=dt;if(serveT<=0){ball.vy=ball.dir*260}return}
  if(mode==='hoops')ball.vx*=1;
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;trail.push({x:ball.x,y:ball.y});if(trail.length>10)trail.shift();
  if(ball.x<BR){ball.x=BR;ball.vx=Math.abs(ball.vx);beep(300,.03)}if(ball.x>W-BR){ball.x=W-BR;ball.vx=-Math.abs(ball.vx);beep(300,.03)}
  // hoops: bumper pegs in middle
  if(mode==='hoops'){for(const pg of pegs){const d=Math.hypot(ball.x-pg.x,ball.y-pg.y);if(d<BR+pg.r){const nx=(ball.x-pg.x)/d,ny=(ball.y-pg.y)/d,dot=ball.vx*nx+ball.vy*ny;if(dot<0){ball.vx-=2*dot*nx;ball.vy-=2*dot*ny;ball.x=pg.x+nx*(BR+pg.r);beep(880,.04,.04,'triangle')}}}}
  paddleHit(p1,false);paddleHit(p2,true);
  const gw=GOAL(),inGoal=Math.abs(ball.x-W/2)<gw/2;
  if(mode==='hoops'){ // score only through hoop rings near ends; otherwise bounce back
    for(const [hy,who] of [[18,1],[H-18,2]]){if(Math.abs(ball.y-hy)<10&&Math.abs(ball.x-W/2)<34){point(who);return}}
    if(ball.y<BR){ball.y=BR;ball.vy=Math.abs(ball.vy)}if(ball.y>H-BR){ball.y=H-BR;ball.vy=-Math.abs(ball.vy)}return}
  if(ball.y<-BR){if(inGoal){point(1);return}}
  if(ball.y>H+BR){if(inGoal){point(2);return}}
  if(!inGoal){if(ball.y<BR+4){ball.y=BR+4;ball.vy=Math.abs(ball.vy);beep(300,.03)}if(ball.y>H-BR-4){ball.y=H-BR-4;ball.vy=-Math.abs(ball.vy);beep(300,.03)}}
}
const pegs=[{x:W/2,y:H/2,r:16},{x:W*.25,y:H*.38,r:10},{x:W*.75,y:H*.38,r:10},{x:W*.25,y:H*.62,r:10},{x:W*.75,y:H*.62,r:10}];
function point(who){if(who===1)s1++;else s2++;beep(who===1?880:200,.25,.08,who===1?'square':'sawtooth');
  if(s1>=WIN||s2>=WIN){state='over';const youWin=s1>s2;$('msg').textContent=players===2?`${youWin?'Bottom':'Top'} player wins ${Math.max(s1,s2)}–${Math.min(s1,s2)}!`:youWin?`You win ${s1}–${s2}!`:`CPU wins ${s2}–${s1}. Rematch?`;$('go').textContent='Play again';setTimeout(()=>$('overlay').hidden=false,500);return}
  serve(who===1?-1:1)}
// ---- detail art: a cached, textured field for each mode ----
const fieldCache={};
function buildField(m){const c2=document.createElement('canvas');c2.width=W;c2.height=H;const c=c2.getContext('2d'),gw=GOAL();
  if(m==='classic'){const g=c.createRadialGradient(W/2,H/2,40,W/2,H/2,H*.7);g.addColorStop(0,'#1a1e44');g.addColorStop(1,'#07081a');c.fillStyle=g;c.fillRect(0,0,W,H);
    c.strokeStyle='rgba(80,100,255,.12)';c.lineWidth=1;for(let x=0;x<=W;x+=20){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}for(let y=0;y<=H;y+=20){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}
    c.fillStyle='rgba(0,0,0,.18)';for(let y=0;y<H;y+=3)c.fillRect(0,y,W,1);
    c.strokeStyle='#4a52a8';c.lineWidth=3;c.setLineDash([12,10]);c.beginPath();c.moveTo(0,H/2);c.lineTo(W,H/2);c.stroke();c.setLineDash([]);
    c.strokeStyle='rgba(120,140,255,.5)';c.lineWidth=4;c.strokeRect(2,2,W-4,H-4)}
  else if(m==='soccer'){for(let i=0;i<16;i++){c.fillStyle=i%2?'#2a8a3e':'#319a46';c.fillRect(0,i*H/16,W,H/16+1)}
    for(let i=0;i<2500;i++){c.fillStyle=Math.random()<.5?'rgba(0,40,0,.15)':'rgba(180,255,160,.12)';c.fillRect(Math.random()*W,Math.random()*H,1,2.5)}
    c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=3;c.strokeRect(10,8,W-20,H-16);c.beginPath();c.moveTo(10,H/2);c.lineTo(W-10,H/2);c.stroke();c.beginPath();c.arc(W/2,H/2,50,0,7);c.stroke();c.fillStyle='#fff';c.beginPath();c.arc(W/2,H/2,4,0,7);c.fill();
    for(const [y,d] of[[8,1],[H-8,-1]]){c.strokeRect(W/2-gw/2-30,d>0?y:y-80,gw+60,80);c.strokeRect(W/2-gw/2+10,d>0?y:y-34,gw-20,34);c.beginPath();c.arc(W/2,y+d*80,30,d>0?0:Math.PI,d>0?Math.PI:Math.PI*2);c.stroke();
      // goal net
      c.fillStyle='rgba(255,255,255,.18)';c.fillRect(W/2-gw/2,d>0?0:H-8,gw,8);c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1;for(let x=W/2-gw/2;x<=W/2+gw/2;x+=6){c.beginPath();c.moveTo(x,d>0?0:H-8);c.lineTo(x,d>0?8:H);c.stroke()}c.lineWidth=3;c.strokeStyle='rgba(255,255,255,.9)'}
    for(const [x,y] of[[10,8],[W-10,8],[10,H-8],[W-10,H-8]]){c.fillStyle='#ffd23f';c.fillRect(x-1,y-14*(y<H/2?-1:1)-(y<H/2?0:0),2,1);c.beginPath();c.arc(x,y,10,0,7);c.stroke()}}
  else if(m==='hockey'){const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#eef6ff');g.addColorStop(1,'#cfe2f4');c.fillStyle=g;c.fillRect(0,0,W,H);
    for(let i=0;i<500;i++){const x=Math.random()*W,y=Math.random()*H,a=Math.random()*6.28,l=4+Math.random()*24;c.strokeStyle='rgba(140,180,220,'+(.15+Math.random()*.3)+')';c.lineWidth=.6;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+Math.cos(a)*l*.5+3,y+Math.sin(a)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);c.stroke()}
    c.fillStyle='#d32f3a';c.fillRect(0,H/2-3,W,6);c.fillStyle='rgba(255,255,255,.6)';for(let x=0;x<W;x+=14)c.fillRect(x,H/2-1,6,2);
    c.fillStyle='#2a5ad8';c.fillRect(0,H*.3-3,W,6);c.fillRect(0,H*.7-3,W,6);
    c.strokeStyle='#2a5ad8';c.lineWidth=2;c.beginPath();c.arc(W/2,H/2,50,0,7);c.stroke();c.fillStyle='#2a5ad8';c.beginPath();c.arc(W/2,H/2,5,0,7);c.fill();
    for(const [x,y] of[[W*.25,H*.15],[W*.75,H*.15],[W*.25,H*.85],[W*.75,H*.85]]){c.strokeStyle='#d32f3a';c.beginPath();c.arc(x,y,32,0,7);c.stroke();c.fillStyle='#d32f3a';c.beginPath();c.arc(x,y,4,0,7);c.fill()}
    for(const [y,d] of[[0,1],[H,-1]]){c.fillStyle='rgba(80,160,255,.35)';c.beginPath();c.arc(W/2,y,gw/2,d>0?0:Math.PI,d>0?Math.PI:2*Math.PI);c.fill();c.strokeStyle='#d32f3a';c.lineWidth=3;c.beginPath();c.moveTo(0,y+d*30);c.lineTo(W,y+d*30);c.stroke()}
    // boards with ads
    c.fillStyle='#f4f4f4';c.fillRect(0,0,6,H);c.fillRect(W-6,0,6,H);c.fillStyle='#ffd23f';c.fillRect(0,0,6,4);for(let y=40;y<H;y+=90){c.fillStyle=['#ff5fa2','#3ef0c9','#ffd23f'][(y/90|0)%3];c.fillRect(0,y,6,40);c.fillRect(W-6,y+45,6,40)}
    c.fillStyle='#ff5fa2';c.fillRect(0,0,W/2-gw/2,5);c.fillRect(W/2+gw/2,0,W/2-gw/2,5);c.fillRect(0,H-5,W/2-gw/2,5);c.fillRect(W/2+gw/2,H-5,W/2-gw/2,5)}
  else{// hardwood court
    for(let x=0;x<W;x+=14){for(let y=-(x*7%60);y<H;y+=60){const h=A.hash(x,y);const g=c.createLinearGradient(x,0,x+14,0);const b=h<.3?'#c8884a':h<.7?'#d49858':'#be7e40';g.addColorStop(0,A.shade(b,.08));g.addColorStop(1,A.shade(b,-.08));c.fillStyle=g;c.fillRect(x,y,14,60);c.fillStyle='rgba(60,30,10,.35)';c.fillRect(x,y,1,60);c.fillRect(x,y+59,14,1);c.strokeStyle='rgba(120,60,20,.15)';c.lineWidth=.6;for(let k=0;k<3;k++){c.beginPath();c.moveTo(x+3+k*4,y+2);c.quadraticCurveTo(x+5+k*4,y+30,x+3+k*4,y+58);c.stroke()}}}
    c.fillStyle='rgba(255,240,210,.12)';c.fillRect(0,0,W,H);
    c.strokeStyle='#fff';c.lineWidth=3;c.strokeRect(8,4,W-16,H-8);c.beginPath();c.moveTo(8,H/2);c.lineTo(W-8,H/2);c.stroke();c.beginPath();c.arc(W/2,H/2,50,0,7);c.stroke();
    for(const [y,d] of[[4,1],[H-4,-1]]){c.fillStyle='rgba(200,60,40,.55)';c.fillRect(W/2-50,d>0?y:y-140,100,140);c.strokeRect(W/2-50,d>0?y:y-140,100,140);c.beginPath();c.arc(W/2,y+d*140,50,d>0?0:Math.PI,d>0?Math.PI:2*Math.PI);c.stroke();c.beginPath();c.arc(W/2,y+d*20,170,d>0?.15:Math.PI+.15,d>0?Math.PI-.15:2*Math.PI-.15);c.stroke()}
    c.font='bold 28px Bungee, Impact, sans-serif';c.textAlign='center';c.fillStyle='rgba(120,40,20,.25)';c.fillText('PARTY',W/2,H/2+10)}
  return fieldCache[m]=c2}
function drawPaddle(p,c,top){const x=p.x-PW/2,y=p.y-PH/2;A.shadow(ctx,p.x,p.y+PH/2+3,PW*.5);
  A.glow(ctx,p.x,p.y,PW*.8,c==='#3ef0c9'?'62,240,201':'255,95,162',flash?.45:.25);
  ctx.fillStyle='#05060e';ctx.beginPath();ctx.roundRect(x-1.5,y-1.5,PW+3,PH+3,7);ctx.fill();
  const g=ctx.createLinearGradient(0,y,0,y+PH);g.addColorStop(0,A.shade(c,.55));g.addColorStop(.5,c);g.addColorStop(1,A.shade(c,-.4));ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,PW,PH,6);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(x+8,y+2,PW-16,2);ctx.fillStyle='rgba(0,0,0,.25)';for(let k=-2;k<=2;k++)ctx.fillRect(p.x+k*6-1,y+4,2,PH-6);
  ctx.fillStyle='#05060e';ctx.fillRect(x+3,y+2,4,PH-4);ctx.fillRect(x+PW-7,y+2,4,PH-4);ctx.fillStyle='#fff';ctx.fillRect(x+4,y+3,2,PH-6);ctx.fillRect(x+PW-6,y+3,2,PH-6)}
function draw(t){
  ctx.drawImage(fieldCache[mode]||buildField(mode),0,0);
  if(mode==='hoops'){for(const pg of pegs){A.shadow(ctx,pg.x+2,pg.y+pg.r,pg.r);A.glow(ctx,pg.x,pg.y,pg.r*2.4,'255,159,28',.3);A.ball(ctx,pg.x,pg.y,pg.r,'#ff9f1c');ctx.fillStyle='#fff';ctx.font='bold '+Math.round(pg.r)+'px sans-serif';ctx.textAlign='center';ctx.fillText('★',pg.x,pg.y+pg.r*.35)}
    for(const hy of [18,H-18]){const top=hy<H/2;ctx.fillStyle='#05060e';ctx.fillRect(W/2-47,top?0:H-7,94,7);ctx.fillStyle='#fff';ctx.fillRect(W/2-46,top?0:H-6,92,6);ctx.strokeStyle='#d32f3a';ctx.lineWidth=1.5;ctx.strokeRect(W/2-16,top?0:H-6,32,5);
      ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1;for(let k=-3;k<=3;k++){ctx.beginPath();ctx.moveTo(W/2+k*10,hy);ctx.lineTo(W/2+k*7,hy+(top?16:-16));ctx.stroke()}ctx.beginPath();ctx.moveTo(W/2-30,hy+(top?8:-8));ctx.lineTo(W/2+30,hy+(top?8:-8));ctx.stroke();
      ctx.strokeStyle='#5a1a0a';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(W/2,hy,34,8,0,0,7);ctx.stroke();ctx.strokeStyle='#ff5a36';ctx.lineWidth=4;ctx.stroke()}}
  // score
  ctx.font='64px Bungee, Impact, sans-serif';ctx.textAlign='right';ctx.globalAlpha=.22;ctx.fillStyle='#ff5fa2';ctx.fillText(s2??0,W-20,H/2-20);ctx.fillStyle=mode==='hockey'?'#1a8a6a':'#3ef0c9';ctx.fillText(s1??0,W-20,H/2+70);ctx.globalAlpha=1;
  if(state==='menu')return;
  // trail & ball
  const tc=mode==='hockey'?'rgba(20,30,50,':mode==='soccer'?'rgba(255,255,255,':mode==='hoops'?'rgba(255,138,42,':'rgba(255,243,107,';
  trail.forEach((p,i)=>{ctx.fillStyle=tc+(i/trail.length*.35)+')';ctx.beginPath();ctx.arc(p.x,p.y,BR*i/trail.length,0,7);ctx.fill()});
  A.shadow(ctx,ball.x+3,ball.y+BR+2,BR);
  if(mode==='soccer'){A.ball(ctx,ball.x,ball.y,BR+1,'#ffffff');ctx.fillStyle='#14141c';ctx.save();ctx.translate(ball.x,ball.y);ctx.rotate(t/150);ctx.beginPath();for(let k=0;k<5;k++){const a=k*1.2566-1.57;ctx.lineTo(Math.cos(a)*3.6,Math.sin(a)*3.6)}ctx.fill();for(let k=0;k<5;k++){const a=k*1.2566-1.57;ctx.beginPath();ctx.arc(Math.cos(a)*8,Math.sin(a)*8,2.2,0,7);ctx.fill()}ctx.restore()}
  else if(mode==='hockey'){ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(ball.x,ball.y+1.5,BR+1,BR-1,0,0,7);ctx.fill();ctx.fillStyle='#2a2a30';ctx.beginPath();ctx.ellipse(ball.x,ball.y,BR+1,BR-1,0,0,7);ctx.fill();ctx.strokeStyle='#666';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(ball.x,ball.y,BR-2,BR-4,0,0,7);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(ball.x-4,ball.y-4,5,1.2)}
  else if(mode==='hoops'){A.ball(ctx,ball.x,ball.y,BR+1,'#ff8a2a');ctx.strokeStyle='#4a1a04';ctx.lineWidth=1.1;ctx.save();ctx.translate(ball.x,ball.y);ctx.rotate(t/180);ctx.beginPath();ctx.moveTo(-BR,0);ctx.lineTo(BR,0);ctx.moveTo(0,-BR);ctx.lineTo(0,BR);ctx.stroke();ctx.beginPath();ctx.arc(-BR*1.3,0,BR*.9,-.8,.8);ctx.stroke();ctx.beginPath();ctx.arc(BR*1.3,0,BR*.9,Math.PI-.8,Math.PI+.8);ctx.stroke();ctx.restore()}
  else{A.glow(ctx,ball.x,ball.y,BR*3.5,'255,243,107',.6);ctx.fillStyle='#fff36b';ctx.fillRect(ball.x-BR,ball.y-BR,BR*2,BR*2);ctx.fillStyle='#fff';ctx.fillRect(ball.x-BR+2,ball.y-BR+2,BR,3)}
  drawPaddle(p1,'#3ef0c9',false);drawPaddle(p2,'#ff5fa2',true);
  if(serveT>0){ctx.font='22px Bungee, Impact, sans-serif';ctx.textAlign='center';ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillText('READY',W/2+2,H/2-58);ctx.fillStyle='#eef0ff';ctx.fillText('READY',W/2,H/2-60)}
  A.vignette(ctx,W,H,.3);
  flash=Math.max(0,flash-.016);
}
let last=performance.now();function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;if(state==='play')update(dt);draw(t);requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
