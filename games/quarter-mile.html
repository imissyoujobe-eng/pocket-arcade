<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quarter Mile</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script>
// Quarter Mile: drag racing. Rev on the lights, launch on green, shift in the green zone, don't blow the engine.
K.theme({ bg: '#14110f', ink: '#fff6ea', accent: '#ff5a36', accentInk: '#fff' });
const W = 320, H = 240;
K.screen(W, H);
K.hud(['round', 'et', 'best']);
K.pad({ dpad: 'none', buttons: [{ id: 'b', label: 'SHIFT' }, { id: 'a', label: 'GAS' }] });

const TOP = [42, 82, 130, 240], RATE = [6800, 4300, 2900, 2000], RED = 9000, FT = 1320;
let state = 'title', round, me, cpu, phase, clock, tree, msg, msgT, bestET = K.best('quartermile'), result;
function car() { return { d: 0, v: 0, rpm: 1200, gear: 0, red: 0, blown: false, done: false, et: 0, spin: 0 }; }
function title() { K.card({ title: 'QUARTER MILE', text: 'Hold GAS to rev while the lights count down. Launch on green with the needle around 6,000. Hit SHIFT when the needle reaches the green zone. Stay out of the red or the engine blows.', best: bestET ? 'BEST ' + (bestET / 1000).toFixed(3) + 's' : '', button: 'Race', onStart: () => { round = 1; race(); } }); }
function race() {
  me = car(); cpu = car(); phase = 'stage'; clock = 0; tree = -1; result = '';
  cpu.target = Math.max(7.55, 8.45 - round * 0.12 + K.rnd(-0.06, 0.08));
  state = 'play'; hud();
}
function hud() { K.set('round', 'ROUND ' + round); K.set('et', me && me.et ? (me.et).toFixed(3) + 's' : '—'); K.set('best', bestET ? 'BEST ' + (bestET / 1000).toFixed(3) : ''); }

function update(dt) {
  if (state !== 'play') return;
  clock += dt;
  if (msgT > 0) msgT -= dt;
  if (phase === 'stage') {
    // three ambers then green
    const nt = Math.floor((clock - 1.2) / 0.5);
    if (nt !== tree && nt >= 0 && nt <= 3) { tree = nt; K.beep(nt === 3 ? 880 : 440, nt === 3 ? 0.35 : 0.12, { vol: 0.07 }); }
    if (K.down('a')) me.rpm = Math.min(RED + 400, me.rpm + 9000 * dt); else me.rpm = Math.max(1200, me.rpm - 7000 * dt);
    cpu.rpm = 1200 + 4800 * Math.min(1, Math.max(0, clock - 1.2) / 1.4);
    if (K.hit('b') && tree < 3) { foul('JUMPED THE GUN'); return; }
    if (tree === 3) {
      phase = 'go'; clock = 0; me.gear = 1; cpu.gear = 1;
      const r = me.rpm;
      if (r < 3500) { me.spin = -0.8; say('BOGGED DOWN'); } else if (r > 7600) { me.spin = 1.0; say('WHEELSPIN!'); } else say(r > 5200 && r < 7000 ? 'PERFECT LAUNCH' : 'GOOD LAUNCH');
      me.rpm = Math.min(me.rpm, 7000) * 0.55;
    }
    return;
  }
  if (phase === 'go') {
    step(me, dt, K.down('a'), K.hit('b'));
    cpuStep(dt);
    if (me.done && cpu.done) finish();
    else if (me.blown && (cpu.done || clock > 15)) finish();
  }
}
function step(c, dt, gas, shift) {
  if (c.done || c.blown) { c.v = Math.max(0, c.v - 40 * dt); c.d += c.v * 1.4667 * dt; return; }
  c.et += dt;
  if (shift && c.gear < 4) { c.gear++; c.rpm = c.v / TOP[c.gear - 1] * RED; K.beep(180, 0.12, { type: 'sawtooth', vol: 0.06 }); }
  const g = c.gear - 1;
  if (gas) {
    let rate = RATE[g] * band(c.rpm);
    if (c.spin > 0) { rate *= 0.45; c.spin -= dt; } else if (c.spin < 0) { rate *= 0.35; c.spin += dt; }
    c.rpm += rate * dt * (c.rpm < 2500 ? 0.6 : 1);
  } else c.rpm = Math.max(900, c.rpm - 3000 * dt);
  if (c.gear === 4) c.rpm = Math.min(c.rpm, RED - 100);
  if (c.rpm > RED) { c.rpm = RED + Math.sin(clock * 60) * 150; c.red += dt; if (c.red > 0.7 && c === me) { c.blown = true; say('ENGINE BLOWN!'); K.noise(0.8, 0.4); } } else c.red = Math.max(0, c.red - dt);
  const vt = Math.min(c.rpm, RED) / RED * TOP[g];
  c.v += (vt - c.v) * Math.min(1, dt * 6);
  c.d += c.v * 1.4667 * dt;
  if (c.d >= FT) { c.done = true; c.d = FT; }
  if (c === me && Math.random() < 0.5) K.beep(50 + c.rpm / 45, 0.05, { type: 'sawtooth', vol: 0.025 });
}
function band(r) { return r < 4500 ? 0.5 : r < 6000 ? 0.5 + 0.5 * (r - 4500) / 1500 : r < 8300 ? 1 : 0.4; }
function cpuStep(dt) {
  if (cpu.done) { cpu.v = Math.max(0, cpu.v - 40 * dt); return; }
  cpu.et += dt;
  // smooth curve that reaches 1320 ft at the target time
  const k = Math.min(1, cpu.et / cpu.target), d = FT * (k * k * (1.55 - 0.55 * k));
  cpu.v = (d - cpu.d) / dt / 1.4667; cpu.d = d;
  cpu.gear = Math.min(4, 1 + Math.floor(k * 4.2)); cpu.rpm = 5500 + ((k * 4.2) % 1) * 3000;
  if (k >= 1) { cpu.done = true; cpu.et = cpu.target; }
}
function foul(t) { phase = 'end'; result = 'FOUL: ' + t; K.beep(140, 0.5, { type: 'sawtooth', vol: 0.08 }); setTimeout(endCard, 900); }
function say(t) { msg = t; msgT = 1.6; }
function finish() {
  if (phase === 'end') return; phase = 'end';
  const win = !me.blown && me.et < cpu.et;
  if (!me.blown) { bestET = K.saveBest('quartermile', Math.round(me.et * 1000), true); }
  result = me.blown ? 'Engine blown. CPU wins.' : win ? 'You win! ' + me.et.toFixed(3) + 's vs ' + cpu.et.toFixed(3) + 's' : 'CPU wins. ' + cpu.et.toFixed(3) + 's vs your ' + me.et.toFixed(3) + 's';
  hud();
  if (win) K.tune([523, 659, 784, 1047], 0.1);
  setTimeout(() => {
    if (win) { round++; K.card({ title: 'ROUND ' + (round - 1) + ' WON', text: result + '. The next driver is quicker.', best: 'BEST ' + (bestET / 1000).toFixed(3) + 's', button: 'Next race', onStart: race }); }
    else endCard();
  }, 1400);
}
function endCard() { state = 'over'; K.card({ title: 'GAME OVER', text: result + '. You won ' + (round - 1) + ' race' + (round === 2 ? '' : 's') + '.', best: bestET ? 'BEST ' + (bestET / 1000).toFixed(3) + 's' : '', button: 'Race again', onStart: () => { round = 1; race(); } }); }

function drawCar(c, x, y, col, t) {
  c.fillStyle = col; c.fillRect(x - 30, y - 8, 46, 7); c.fillRect(x - 10, y - 13, 16, 5);
  c.fillRect(x + 14, y - 6, 12, 4); c.fillRect(x - 34, y - 16, 4, 12); c.fillRect(x - 38, y - 17, 10, 3);
  c.fillStyle = '#111'; c.beginPath(); c.arc(x - 22, y, 7, 0, 7); c.fill(); c.beginPath(); c.arc(x + 20, y + 2, 4, 0, 7); c.fill();
  c.fillStyle = '#888'; c.fillRect(x - 23, y - 1, 2, 2); c.fillRect(x + 19, y + 1, 2, 2);
  c.fillStyle = '#9fd6ff'; c.fillRect(x - 6, y - 12, 6, 3);
}
function draw(c, t) {
  c.fillStyle = '#2b2f3a'; c.fillRect(0, 0, W, H);
  // sky + crowd
  c.fillStyle = '#ff9f6b'; c.fillRect(0, 0, W, 50); c.fillStyle = '#ffcf8a'; c.fillRect(0, 36, W, 14);
  const cam = me ? me.d : 0, sc = 3; // pixels per foot
  c.fillStyle = '#3b2a4a'; c.fillRect(0, 50, W, 22);
  for (let i = 0; i < 40; i++) { const x = ((i * 23 - cam * sc * 0.6) % (W + 40) + W + 40) % (W + 40) - 20; c.fillStyle = ['#ff5a36', '#ffd23f', '#46a8ff', '#fff'][i % 4]; c.fillRect(x, 56 + (i % 3) * 5, 4, 4); }
  // track
  c.fillStyle = '#4a4e5a'; c.fillRect(0, 72, W, 120);
  c.fillStyle = '#fff'; c.fillRect(0, 131, W, 2);
  for (let f = Math.floor(cam / 20) * 20 - 40; f < cam + 80; f += 20) { const x = 90 + (f - cam) * sc; c.fillStyle = '#5c6070'; c.fillRect(x, 74, 2, 56); c.fillRect(x, 134, 2, 56); }
  // start and finish
  [0, FT].forEach(f => { const x = 90 + (f - cam) * sc; if (x > -20 && x < W + 20) { for (let k = 0; k < 12; k++) { c.fillStyle = k % 2 ? '#111' : '#fff'; c.fillRect(x, 74 + k * 10, 6, 10); } } });
  if (me) {
    const cx = 90 + (cpu.d - cam) * sc;
    drawCar(c, cx, 120, '#46a8ff', t);
    if (cx > W + 30) K.text(c, 'CPU +' + Math.round(cpu.d - cam) + ' FT ▶', W - 50, 100, 9, '#9fd6ff');
    if (cx < -40) K.text(c, '◀ CPU -' + Math.round(cam - cpu.d) + ' FT', 50, 100, 9, '#9fd6ff');
    drawCar(c, 90, 180, me.blown ? '#555' : '#ff5a36', t);
    if (me.blown) { c.fillStyle = 'rgba(80,80,80,.6)'; for (let i = 0; i < 5; i++) c.fillRect(70 + Math.sin(t / 100 + i) * 6, 150 - i * 8 - (t / 30 % 8), 10, 8); }
  }
  // tree lights
  if (me && (phase === 'stage' || clock < 0.6)) {
    c.fillStyle = '#111'; c.fillRect(W / 2 - 14, 78, 28, 52);
    for (let i = 0; i < 4; i++) { const on = tree >= i; c.fillStyle = on ? (i === 3 ? '#3df07a' : '#ffb02e') : '#333'; c.beginPath(); c.arc(W / 2, 86 + i * 12, 4.5, 0, 7); c.fill(); }
  }
  // dash: tach + gear + speed
  c.fillStyle = 'rgba(0,0,0,.7)'; c.fillRect(0, 192, W, 48);
  const tx = 60, ty = 236, r = 36;
  c.lineWidth = 6;
  [[0, 0.67, '#555'], [0.67, 0.92, '#3df07a'], [0.92, 0.97, '#ffb02e'], [0.97, 1, '#ff3b3b']].forEach(z => { c.strokeStyle = z[2]; c.beginPath(); c.arc(tx, ty, r, Math.PI + z[0] * Math.PI, Math.PI + z[1] * Math.PI); c.stroke(); });
  const rpm = me ? Math.min(me.rpm, RED + 300) : 0, a = Math.PI + Math.min(1.02, rpm / (RED * 1.0)) * Math.PI;
  c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.moveTo(tx, ty); c.lineTo(tx + Math.cos(a) * (r - 4), ty + Math.sin(a) * (r - 4)); c.stroke();
  K.text(c, me ? (me.gear || 'N') : 'N', 150, 210, 20, '#ffd23f'); K.text(c, 'GEAR', 150, 228, 8, '#aaa');
  K.text(c, me ? Math.round(me.v) : 0, 220, 210, 20, '#fff'); K.text(c, 'MPH', 220, 228, 8, '#aaa');
  K.text(c, me ? Math.max(0, Math.round(FT - me.d)) : FT, 285, 210, 14, '#fff'); K.text(c, 'FT LEFT', 285, 228, 8, '#aaa');
  if (msgT > 0) K.text(c, msg, W / 2, 104, 14, '#ffd23f');
  if (phase === 'end' && result) K.text(c, me.et < cpu.et && !me.blown ? 'YOU WIN!' : 'CPU WINS', W / 2, 104, 18, '#fff');
}
title();
K.run(update, draw);
</script>
</body>
</html>
