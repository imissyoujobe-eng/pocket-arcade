<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hero's Reflex</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script>
// Hero's Reflex: an interactive castle adventure. Each room springs a trap. Watch for the flash and react in time to guide the clumsy hero to the dragon's treasure.
K.theme({ bg: '#120a06', ink: '#fff0d8', accent: '#ffcc33', accentInk: '#2a1800' });
const W = 320, H = 220;
K.screen(W, H, { smooth: true });
K.hud(['score', 'room', 'lives']);
K.pad({ dpad: '4', buttons: [{ id: 'a', label: 'SWORD' }] });

// each room: a list of beats. beat: { want: 'left'|'right'|'up'|'down'|'a', hint: where the flash shows, say: text, scene }
const ROOMS = [
  { name: 'THE DRAWBRIDGE', bg: '#2a3a5a', beats: [{ want: 'up', say: 'The bridge cracks!', flash: [160, 140] }, { want: 'a', say: 'Tentacles from the moat!', flash: [230, 150] }, { want: 'up', say: 'Run for the gate!', flash: [160, 60] }] },
  { name: 'FALLING FLOOR', bg: '#3a2a1a', beats: [{ want: 'right', say: 'The floor gives way!', flash: [270, 150] }, { want: 'left', say: 'Again! Jump back!', flash: [50, 150] }, { want: 'up', say: 'A ledge above!', flash: [160, 50] }] },
  { name: 'SKELETON HALL', bg: '#2a2a3a', beats: [{ want: 'a', say: 'A skeleton swings!', flash: [220, 110] }, { want: 'down', say: 'Duck the axe!', flash: [160, 180] }, { want: 'a', say: 'Another one!', flash: [100, 110] }, { want: 'right', say: 'Dash past!', flash: [280, 120] }] },
  { name: 'FLAME PILLARS', bg: '#4a1a0a', beats: [{ want: 'left', say: 'Fire on the right!', flash: [40, 120] }, { want: 'right', say: 'Fire on the left!', flash: [280, 120] }, { want: 'up', say: 'Leap the lava!', flash: [160, 50] }, { want: 'down', say: 'Fireball overhead!', flash: [160, 190] }] },
  { name: 'THE WHIRLPOOL', bg: '#0a2a4a', beats: [{ want: 'left', say: 'Rapids! Steer!', flash: [40, 140] }, { want: 'right', say: 'Rocks ahead!', flash: [280, 140] }, { want: 'left', say: 'Again!', flash: [40, 140] }, { want: 'up', say: 'Grab the chain!', flash: [160, 40] }] },
  { name: 'MUD KING', bg: '#2a3a1a', beats: [{ want: 'a', say: 'A mud giant rises!', flash: [160, 100] }, { want: 'left', say: 'Its fist!', flash: [50, 130] }, { want: 'a', say: 'Strike its crown!', flash: [160, 70] }, { want: 'down', say: 'It swings low... no, high!', flash: [160, 190] }] },
  { name: 'THE DRAGON', bg: '#3a0a1a', beats: [{ want: 'right', say: 'Dragon breath!', flash: [280, 140] }, { want: 'up', say: 'Climb the gold!', flash: [160, 50] }, { want: 'a', say: 'Grab the magic sword!', flash: [200, 80] }, { want: 'left', say: 'Tail sweep!', flash: [40, 150] }, { want: 'a', say: 'STRIKE NOW!', flash: [230, 90] }] },
];
const DIRS = { left: '◀', right: '▶', up: '▲', down: '▼', a: 'SWORD' };
let state = 'title', score, lives, room, beat, phase, timer, window_, result, anim, best = K.best('herosreflex'), order, loop, showArrow;
function title() { K.card({ title: "HERO'S REFLEX", text: 'Every room springs a trap. When something FLASHES, press the move it points to: ◀ ▶ ▲ ▼ to dodge, SWORD to fight. Too slow or the wrong move costs a life. Easy mode shows the arrow too; it disappears after the first loop.', best: best ? 'BEST ' + best : '', button: 'Enter the Castle', onStart: start }); }
function start() { score = 0; lives = 5; loop = 0; order = ROOMS.map((_, i) => i); room = 0; beginRoom(); state = 'play'; }
function beginRoom() { beat = 0; phase = 'intro'; timer = 1.6; anim = 0; K.tune([392, 466, 523], 0.12, { type: 'triangle' }); }
function windowFor() { return Math.max(0.7, 1.6 - loop * 0.25 - room * 0.06); }
function input() { for (const k of ['left', 'right', 'up', 'down', 'a']) if (K.hit(k)) return k;
  if (K.ptr.tapped) { const dx = K.ptr.x - 160, dy = K.ptr.y - 120; if (Math.hypot(dx, dy) < 30) return 'a'; return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'); }
  return null; }
function fail(why) { result = why; phase = 'dead'; timer = 1.8; lives--; K.beep(200, 0.6, { to: 50, type: 'sawtooth' }); K.noise(0.4, 0.3); }
function update(dt) {
  if (state !== 'play') return;
  anim += dt; timer -= dt;
  const R = ROOMS[order[room]], B = R.beats[beat];
  if (phase === 'intro') { if (timer <= 0) { phase = 'wait'; timer = K.rnd(0.5, 1.1); } }
  else if (phase === 'wait') { input(); if (timer <= 0) { phase = 'act'; window_ = windowFor(); timer = window_; showArrow = loop === 0; K.beep(1000, 0.08); } }
  else if (phase === 'act') {
    const k = input();
    if (k) { if (k === B.want) { score += Math.round(100 + 200 * timer / window_); phase = 'good'; timer = 0.7; K.tune([660, 880], 0.06); } else fail('WRONG MOVE!'); }
    else if (timer <= 0) fail('TOO SLOW!');
  }
  else if (phase === 'good') { if (timer <= 0) { beat++; if (beat >= R.beats.length) { score += 500; phase = 'clear'; timer = 1.4; K.tune([523, 659, 784, 1046], 0.1); } else { phase = 'wait'; timer = K.rnd(0.4, 1); } } }
  else if (phase === 'clear') { if (timer <= 0) { room++; if (room >= ROOMS.length) { loop++; room = 0; score += 3000; } beginRoom(); } }
  else if (phase === 'dead') { if (timer <= 0) { if (lives <= 0) { state = 'over'; best = K.saveBest('herosreflex', score); K.card({ title: 'THE HERO FALLS', text: 'You got through ' + (loop * ROOMS.length + room) + ' rooms with ' + score + ' points.', best: 'BEST ' + best, button: 'Try Again', onStart: start }); return; } beginRoom(); } }
  K.set('score', score); K.set('room', 'ROOM ' + (loop * ROOMS.length + room + 1)); K.set('lives', '♥'.repeat(Math.max(0, lives)));
}
function hero(c, x, y, pose) {
  const bob = Math.sin(anim * 8) * 1.5;
  c.fillStyle = '#d0a060'; c.beginPath(); c.arc(x, y - 30 + bob, 6, 0, 7); c.fill();
  c.fillStyle = '#ffd84a'; c.fillRect(x - 6, y - 38 + bob, 12, 3);
  c.fillStyle = '#7a8aa0'; c.fillRect(x - 6, y - 24 + bob, 12, 14);
  c.fillStyle = '#4a3a2a'; c.fillRect(x - 5, y - 10, 4, 10); c.fillRect(x + 1, y - 10, 4, 10);
  c.strokeStyle = '#e0e8ff'; c.lineWidth = 2; c.beginPath();
  if (pose === 'a') { c.moveTo(x + 6, y - 20); c.lineTo(x + 22, y - 34); } else if (pose === 'up') { c.moveTo(x + 6, y - 22); c.lineTo(x + 8, y - 44); } else { c.moveTo(x + 6, y - 16); c.lineTo(x + 12, y - 2); }
  c.stroke(); c.lineWidth = 1;
}
function draw(c, t) {
  const R = ROOMS[order[room] || 0], B = R.beats[Math.min(beat, R.beats.length - 1)];
  c.fillStyle = R.bg; c.fillRect(0, 0, W, H);
  c.fillStyle = 'rgba(0,0,0,.25)'; for (let y = 0; y < H; y += 16) for (let x = (y / 16 % 2) * 16; x < W; x += 32) c.fillRect(x, y, 30, 14);
  c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(0, 175, W, 45);
  const torch = 0.6 + Math.sin(t / 90) * 0.2; c.fillStyle = 'rgba(255,170,60,' + torch + ')'; c.beginPath(); c.arc(30, 40, 6, 0, 7); c.arc(290, 40, 6, 0, 7); c.fill();
  // hazard drawing
  if (state === 'play' && (phase === 'act' || phase === 'wait')) {
    const [fx, fy] = B.flash, on = phase === 'act' && Math.floor(t / 110) % 2 === 0;
    c.fillStyle = on ? 'rgba(255,255,200,.95)' : 'rgba(120,60,200,.6)';
    c.beginPath(); for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2, r = i % 2 ? 9 : 18 + Math.sin(t / 60) * 3; c.lineTo(fx + Math.cos(a) * r, fy + Math.sin(a) * r); } c.fill();
    if (phase === 'act') { c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(60, 200, 200 * timer / window_, 5); if (showArrow) K.text(c, DIRS[B.want], fx, fy - 26, 14, '#ffcc33'); }
  }
  let pose = '', hx = 160; if (phase === 'good') { pose = B.want; if (B.want === 'left') hx = 130; if (B.want === 'right') hx = 190; }
  if (phase === 'dead') { c.fillStyle = 'rgba(200,0,0,.3)'; c.fillRect(0, 0, W, H); c.fillStyle = '#e0e0e0'; c.beginPath(); c.arc(160, 160, 7, 0, 7); c.fill(); c.fillRect(150, 165, 20, 4); K.text(c, result, 160, 90, 16, '#ff6a6a'); }
  else if (state === 'play' || state === 'title') hero(c, hx, phase === 'good' && B.want === 'up' ? 160 : phase === 'good' && B.want === 'down' ? 185 : 175, pose);
  if (phase === 'intro') { K.text(c, R.name, 160, 70, 18, '#ffcc33'); }
  else if (phase !== 'dead' && state === 'play') K.text(c, phase === 'clear' ? 'ROOM CLEARED!' : B.say, 160, 22, 11, '#fff');
}
start(); state = 'title'; title(); K.run(update, draw);
</script>
</body>
</html>
