<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brush Blaster</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script>
// Brush Blaster: junk food is attacking the teeth. Squirt toothpaste up or down to stop it before it causes cavities.
K.theme({ bg: '#2a0a14', ink: '#fff2f5', accent: '#5fd6ff', accentInk: '#002a3a' });
const W = 240, H = 340, TOPY = 34, BOTY = 306, N = 8;
K.screen(W, H);
K.hud(['score', 'wave', 'teeth']);
K.pad({ dpad: '4', buttons: [{ id: 'a', label: 'SQUIRT' }] });
const FOODS = ['candy', 'burger', 'fries', 'donut', 'soda'];
let state = 'title', teeth, tube, shots, foods, parts, wave, toSpawn, spawnT, score, best = K.best('brush'), msgT;
const tx = i => 15 + i * 30;
function title() { K.card({ title: 'BRUSH BLASTER', text: 'Junk food is heading for the teeth! Move the toothpaste tube and SQUIRT. Press up or down to choose which way you aim. Every bite turns a tooth yellow, then brown, then it falls out.', best: best ? 'BEST ' + best : '', button: 'Brush', onStart: start }); }
function start() { teeth = { top: Array(N).fill(3), bot: Array(N).fill(3) }; tube = { x: W / 2, y: H / 2, up: true }; shots = []; foods = []; parts = []; wave = 0; score = 0; newWave(); state = 'play'; hud(); }
function newWave() { toSpawn = 10 + wave * 2; spawnT = 1; msgT = 1.6; }
function alive() { return teeth.top.filter(h => h > 0).length + teeth.bot.filter(h => h > 0).length; }
function hud() { K.set('score', score); K.set('wave', 'WAVE ' + (wave + 1)); K.set('teeth', 'TEETH ' + alive()); }

function update(dt) {
  if (state !== 'play') return;
  if (msgT > 0) msgT -= dt;
  let ax = (K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0), ay = (K.down('down') ? 1 : 0) - (K.down('up') ? 1 : 0);
  if (K.down('up')) tube.up = true; if (K.down('down')) tube.up = false;
  let fire = K.hit('a') || (K.down('a') && Math.random() < dt * 6);
  if (K.ptr.down) { ax = K.clamp((K.ptr.x - tube.x) / 10, -1, 1); tube.up = K.ptr.y < tube.y; if (K.ptr.tapped) fire = true; }
  tube.x = K.clamp(tube.x + ax * 120 * dt, 14, W - 14); tube.y = K.clamp(tube.y + ay * 80 * dt, 120, 220);
  if (fire && shots.length < 3) { shots.push({ x: tube.x, y: tube.y + (tube.up ? -14 : 14), vy: tube.up ? -260 : 260 }); K.beep(1200, 0.06, { type: 'sine', to: 700, vol: 0.04 }); }
  for (const s of shots) s.y += s.vy * dt;
  shots = shots.filter(s => s.y > TOPY && s.y < BOTY);
  spawnT -= dt;
  if (toSpawn > 0 && spawnT <= 0) {
    const row = Math.random() < 0.5 ? 'top' : 'bot', live = teeth[row].map((h, i) => h > 0 ? i : -1).filter(i => i >= 0);
    if (live.length) {
      const target = live[K.ri(0, live.length - 1)], left = Math.random() < 0.5;
      foods.push({ x: left ? -10 : W + 10, y: K.rnd(140, 200), row, target, kind: FOODS[Math.min(FOODS.length - 1, K.ri(0, Math.min(4, wave)))], sp: K.rnd(30, 42) * (1 + wave * 0.07), wob: Math.random() * 6 });
    }
    toSpawn--; spawnT = K.rnd(0.6, 1.4) / (1 + wave * 0.08);
  }
  for (const f of foods) {
    const gx = tx(f.target), gy = f.row === 'top' ? TOPY + 22 : BOTY - 22, dx = gx - f.x, dy = gy - f.y, d = Math.hypot(dx, dy);
    f.wob += dt * 4; f.x += (dx / d) * f.sp * dt + Math.sin(f.wob) * 10 * dt; f.y += (dy / d) * f.sp * dt;
    if (d < 6) {
      f.dead = true; teeth[f.row][f.target]--; K.beep(150, 0.25, { type: 'sawtooth', to: 70, vol: 0.06 }); hud();
      if (alive() === 0) return over();
    }
    for (const s of shots) if (!s.dead && Math.abs(s.x - f.x) < 10 && Math.abs(s.y - f.y) < 10) { s.dead = f.dead = true; score += 20 + wave * 5; hud(); splat(f.x, f.y); }
    if (Math.abs(f.x - tube.x) < 10 && Math.abs(f.y - tube.y) < 12) { f.dead = true; score += 5; splat(f.x, f.y); }
  }
  foods = foods.filter(f => !f.dead); shots = shots.filter(s => !s.dead);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.l -= dt; } parts = parts.filter(p => p.l > 0);
  if (toSpawn <= 0 && !foods.length) {
    const bonus = alive() * 10; score += bonus; wave++;
    if (wave % 3 === 0) { for (const r of ['top', 'bot']) { const i = teeth[r].findIndex(h => h <= 0); if (i >= 0) { teeth[r][i] = 3; break; } } }
    hud(); newWave(); K.tune([659, 784, 988], 0.08, { type: 'triangle' });
  }
}
function splat(x, y) { K.beep(500, 0.08, { type: 'triangle', vol: 0.05 }); for (let i = 0; i < 8; i++) parts.push({ x, y, vx: K.rnd(-60, 60), vy: K.rnd(-60, 60), l: 0.4 }); }
function over() { state = 'over'; best = K.saveBest('brush', score); K.card({ title: 'TOOTHLESS', text: 'The junk food won on wave ' + (wave + 1) + '. You scored ' + score + '.', best: 'BEST ' + best, button: 'Brush again', onStart: start }); }

function drawTooth(c, x, y, h, top) {
  c.save(); c.translate(x, y); if (!top) c.scale(1, -1);
  if (h <= 0) { c.fillStyle = '#5a1a2a'; c.fillRect(-10, -4, 20, 4); c.restore(); return; }
  c.fillStyle = h === 3 ? '#fbfbf5' : h === 2 ? '#f2dc7a' : '#9a6a3a';
  c.beginPath(); c.moveTo(-11, 0); c.lineTo(11, 0); c.lineTo(10, 20); c.lineTo(3, 20); c.lineTo(0, 16); c.lineTo(-3, 20); c.lineTo(-10, 20); c.closePath(); c.fill();
  if (h < 3) { c.fillStyle = 'rgba(80,40,10,.5)'; c.fillRect(-4, 6, 5, 4); }
  c.fillStyle = 'rgba(255,255,255,.6)'; c.fillRect(-7, 2, 3, 8);
  c.restore();
}
function drawFood(c, f, t) {
  const x = Math.round(f.x), y = Math.round(f.y);
  switch (f.kind) {
    case 'candy': c.fillStyle = '#ff5fa2'; c.beginPath(); c.arc(x, y, 6, 0, 7); c.fill(); c.fillStyle = '#fff'; c.fillRect(x - 10, y - 2, 4, 4); c.fillRect(x + 6, y - 2, 4, 4); c.fillStyle = '#ff9fc8'; c.fillRect(x - 2, y - 4, 3, 3); break;
    case 'burger': c.fillStyle = '#e0a14a'; c.fillRect(x - 7, y - 6, 14, 4); c.fillStyle = '#3fa34d'; c.fillRect(x - 7, y - 2, 14, 2); c.fillStyle = '#6b3a1e'; c.fillRect(x - 7, y, 14, 3); c.fillStyle = '#e0a14a'; c.fillRect(x - 6, y + 3, 12, 3); break;
    case 'fries': c.fillStyle = '#e63946'; c.fillRect(x - 5, y - 1, 10, 8); c.fillStyle = '#ffd23f'; for (let i = 0; i < 4; i++) c.fillRect(x - 4 + i * 2.5, y - 7 + (i % 2) * 2, 2, 7); break;
    case 'donut': c.fillStyle = '#d9a35b'; c.beginPath(); c.arc(x, y, 7, 0, 7); c.fill(); c.fillStyle = '#7a3aa0'; c.beginPath(); c.arc(x, y - 1, 6, 0, 7); c.fill(); c.fillStyle = '#2a0a14'; c.beginPath(); c.arc(x, y, 2.5, 0, 7); c.fill(); break;
    case 'soda': c.fillStyle = '#46a8ff'; c.fillRect(x - 4, y - 7, 8, 14); c.fillStyle = '#ddd'; c.fillRect(x - 4, y - 7, 8, 2); c.fillStyle = '#fff'; c.fillRect(x - 2, y - 2, 4, 3); break;
  }
}
function draw(c, t) {
  c.fillStyle = '#7a1a2e'; c.fillRect(0, 0, W, H);
  c.fillStyle = '#e86a8a'; c.fillRect(0, 0, W, TOPY + 4); c.fillRect(0, BOTY - 4, W, H - BOTY + 4);
  c.fillStyle = '#c0405e'; c.beginPath(); c.ellipse(W / 2, H / 2 + 20, 90, 40, 0, 0, 7); c.fill();
  c.fillStyle = '#a8324e'; c.fillRect(W / 2 - 1, H / 2 - 10, 2, 50);
  if (!teeth) return;
  for (let i = 0; i < N; i++) { drawTooth(c, tx(i), TOPY, teeth.top[i], true); drawTooth(c, tx(i), BOTY, teeth.bot[i], false); }
  for (const f of foods) drawFood(c, f, t);
  c.fillStyle = '#ffffff'; for (const s of shots) { c.fillRect(s.x - 3, s.y - 5, 6, 10); c.fillStyle = '#5fd6ff'; c.fillRect(s.x - 1, s.y - 4, 2, 8); c.fillStyle = '#ffffff'; }
  // tube
  const x = Math.round(tube.x), y = Math.round(tube.y), u = tube.up ? -1 : 1;
  c.fillStyle = '#f2f2f2'; c.fillRect(x - 7, y - 10, 14, 20); c.fillStyle = '#5fd6ff'; c.fillRect(x - 7, y - 3, 14, 6);
  c.fillStyle = '#ddd'; c.fillRect(x - 4, y + u * 10 - (u < 0 ? 4 : 0), 8, 4); c.fillStyle = '#e63946'; c.fillRect(x - 7, y - u * 10 - (u > 0 ? 3 : 0), 14, 3);
  for (const p of parts) { c.fillStyle = 'rgba(255,255,255,' + p.l * 2 + ')'; c.fillRect(p.x, p.y, 3, 3); }
  if (msgT > 0) K.text(c, 'WAVE ' + (wave + 1), W / 2, 110, 16, '#fff');
}
title();
K.run(update, draw);
</script>
</body>
</html>
