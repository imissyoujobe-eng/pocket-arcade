<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Commando Sights</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script>
// Commando Sights: you hold a hilltop. The battlefield stays still; the enemy comes at you from far away, sprinting
// from cover to cover (sandbags, rocks, barrels, barriers) and popping up to shoot. Tanks and jeeps roll in from the
// distance, a few runners cut across, a chopper buzzes over. Rifle, grenades (they land behind cover) and rockets (for armor).
K.theme({ bg: '#1a1408', ink: '#fff6e0', accent: '#ffb24a', accentInk: '#2a1600' });
let W = 240; const H = 330, HY = 132;
K.screen(W, H, { smooth: true });
K.hud(['score', 'ammo', 'hp']);
K.pad({ dpad: '4', buttons: [{ id: 'c', label: 'GRENADE' }, { id: 'b', label: 'ROCKET' }, { id: 'a', label: 'FIRE' }] });
addEventListener('keydown', e => { if (e.key === 'g' || e.key === 'G') K.press('c'); });
addEventListener('keyup', e => { if (e.key === 'g' || e.key === 'G') K.release('c'); });

// ---- depth: everything lives at a world spot (wx meters left/right, Z meters away) seen from a hilltop ----
const GK = 1700, PK = 380;                       // ground drop and pixels-per-meter constants
const gy = Z => HY + 4 + GK / Z;                // screen y of the ground at distance Z
const ppm = Z => PK / Z;                         // pixels per meter at distance Z
const sxw = (wx, Z) => W / 2 + wx * PK / Z;      // screen x
const zAtY = y => y <= HY + 4 + GK / 70 ? 70 : K.clamp(GK / (y - HY - 4), 8, 70);
const maxWx = Z => (W / 2 - 12) * Z / PK;        // how far left/right is still on screen at Z
const ROWS = [47, 37, 29, 22, 16.5, 12.5];        // lines of cover, far to near

let state = 'title', score, hp, ammo, mags, rockets, grenades, stage, kills, need, cx, cy, foes, covers, bunkers, wrecks, shots, parts, smoke, flashes, spawnT, vehT, sideT, heliT, reload, shake, best = K.best('commandosights'), hurtFlash, msgs;
K.flex(240, H, w => { W = w; layout(); }, { smooth: true }); // phone on its side: the battlefield widens to fill the screen
function title() { K.card({ title: 'COMMANDO SIGHTS', text: 'Hold the hill! Aim with the joystick or drag on the screen. FIRE shoots. The enemy comes from far away, running from cover to cover: shoot them while they\'re in the open or when they pop up to fire (a red ! means they\'re aiming at you). GRENADE lobs onto the spot in your sights and gets them behind cover. ROCKET is for tanks and jeeps. Don\'t shoot the hostages in white. Your rifle never runs out; shoot crates for more grenades and rockets.', best: best ? 'BEST ' + best : '', button: 'Lock & Load', onStart: start, art: { src: '../art/commando-sights.jpg', w: 600, h: 678 } }); }
function start() { score = 0; hp = 10; stage = 1; ammo = Infinity; mags = 0; rockets = 6; grenades = 10; cx = W / 2; cy = HY + 60; hurtFlash = 0; startStage(); state = 'play'; }
function startStage() {
  kills = 0; need = 12 + stage * 4; foes = []; shots = []; parts = []; smoke = []; flashes = []; wrecks = []; msgs = [];
  spawnT = 1; vehT = stage >= 2 ? 9 : 14; sideT = 7; heliT = stage >= 3 ? 16 : 999; reload = 0; shake = 0;
  covers = null; layout();
}
// cover: sandbags, rocks, barrels, concrete barriers and crates on each row; two bunkers at the back
function layout() {
  if (!foes) return;
  const keep = covers && covers._w === W; if (keep) return;
  covers = []; covers._w = W; let seed = stage * 31;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  ROWS.forEach((Z, ri) => {
    const m = maxWx(Z) * 0.92, n = Math.max(2, Math.round(m * 2 / (ri < 2 ? 5.5 : 4.6)));
    for (let i = 0; i < n; i++) { const wx = -m + (i + 0.5) * (2 * m / n) + (rnd() - 0.5) * 1.6; const kind = ['sand', 'rock', 'barrel', 'wall', 'crates', 'sand'][Math.floor(rnd() * 6)];
      const dims = { sand: [2.4, 0.95], rock: [1.9, 1.15], barrel: [1.3, 1.0], wall: [2.5, 1.0], crates: [1.7, 1.25] }[kind]; covers.push({ kind, wx, Z: Z + (rnd() - 0.5) * 1.2, w: dims[0], h: dims[1], seed: Math.floor(rnd() * 999) }); }
  });
  const bm = maxWx(55) * 0.55; bunkers = [{ wx: -bm, Z: 56, w: 7, h: 3 }, { wx: bm, Z: 58, w: 8, h: 3.2 }];
}
function say(s, t) { msgs.push({ s, t: t || 1.4 }); }
function boom(x, y, c, n, sp) { for (let i = 0; i < (n || 10); i++) parts.push({ x, y, vx: K.rnd(-1, 1) * (sp || 80), vy: K.rnd(-1.2, 0.2) * (sp || 80), t: K.rnd(0.3, 0.8), c }); }
function puff(x, y, r, l, dark) { smoke.push({ x, y, r, l, L: l, vx: K.rnd(-6, 6), vy: K.rnd(-14, -6), dark }); }
const SKIN = ['#e2b08a', '#c8905a', '#8a5a3a', '#f0c8a0'];

// ---- spawning ----
function coverAt(Zmin, Zmax, nearWx) { const list = covers.filter(c => c.Z >= Zmin && c.Z <= Zmax); if (!list.length) return null; list.sort((a, b) => Math.abs(a.wx - nearWx) - Math.abs(b.wx - nearWx)); return list[Math.floor(Math.random() * Math.min(3, list.length))]; }
function spawnSoldier() {
  const b = bunkers[Math.random() < 0.5 ? 0 : 1], f = { k: 'sol', wx: b.wx + K.rnd(-1.5, 1.5), Z: b.Z - 1, st: 'run', t: 0, hp: 1, skin: SKIN[K.ri(0, 3)], seed: Math.random() * 10, cd: K.rnd(1.5, 3) };
  goNext(f); foes.push(f);
}
// pick the next piece of cover a little closer, and sprint for it
function goNext(f) {
  const nextZ = ROWS.filter(z => z < f.Z - 3)[0] === undefined ? null : Math.max(...ROWS.filter(z => z < f.Z - 3));
  const c = nextZ ? coverAt(nextZ - 1.5, nextZ + 1.5, f.wx + K.rnd(-4, 4)) : null;
  if (!c) { f.st = 'hide'; f.t = K.rnd(1, 2); f.final = true; return; }
  f.cover = c; f.tx = c.wx + K.rnd(-c.w * 0.3, c.w * 0.3); f.tZ = c.Z + 0.7; f.st = 'run'; f.spd = K.rnd(3.6, 5.2) * (1 + stage * 0.04);
}
function spawnSide() { const side = Math.random() < 0.5 ? -1 : 1, Z = K.rnd(14, 24), host = Math.random() < 0.3; foes.push({ k: host ? 'host' : 'side', wx: -side * (maxWx(Z) + 2), Z, dir: side, spd: K.rnd(5, 7), hp: 1, skin: SKIN[K.ri(0, 3)], cd: K.rnd(0.8, 1.6), seed: Math.random() * 10 }); }
function spawnVehicle() {
  const tank = stage >= 2 && Math.random() < 0.55, wx = K.rnd(-0.5, 0.5) * maxWx(60);
  foes.push(tank ? { k: 'tank', wx, Z: 66, hp: 40, stopZ: K.rnd(20, 26), spd: 2.2, cd: 4, seed: Math.random() * 10 } : { k: 'jeep', wx, Z: 66, hp: 12, stopZ: K.rnd(16, 22), spd: 7, cd: 2.5, weave: Math.random() * 6, seed: Math.random() * 10 });
  say(tank ? 'TANK INCOMING!' : 'JEEP INCOMING!', 1.6);
}
function spawnHeli() { const side = Math.random() < 0.5 ? -1 : 1; foes.push({ k: 'heli', x: side < 0 ? -80 : W + 80, y: 58, vx: -side * 32, hp: 15, cd: 2 }); }

// ---- what's on screen where: bounding boxes for hits, nearest first ----
function poseH(f) { return f.st === 'hide' ? 1.0 : f.st === 'dead' ? 0 : 1.8; }
function boxOf(o) {
  if (o.k === 'heli') return { x0: o.x - 30, x1: o.x + 30, y0: o.y - 14, y1: o.y + 12, Z: 30 };
  if (o.k === 'crate') { const p = ppm(o.Z); return { x0: sxw(o.wx, o.Z) - 0.6 * p, x1: sxw(o.wx, o.Z) + 0.6 * p, y0: gy(o.Z) - 1.1 * p, y1: gy(o.Z), Z: o.Z }; }
  const p = ppm(o.Z), x = sxw(o.wx, o.Z), y = gy(o.Z);
  if (o.kind) return { x0: x - o.w / 2 * p, x1: x + o.w / 2 * p, y0: y - o.h * p, y1: y, Z: o.Z, cover: true };
  if (o.k === 'tank') return { x0: x - 1.9 * p, x1: x + 1.9 * p, y0: y - 2.4 * p, y1: y, Z: o.Z };
  if (o.k === 'jeep') return { x0: x - 1.1 * p, x1: x + 1.1 * p, y0: y - 1.9 * p, y1: y, Z: o.Z };
  return { x0: x - 0.42 * p, x1: x + 0.42 * p, y0: y - poseH(o) * p - 0.1 * p, y1: y, Z: o.Z };
}
function hitAt(x, y) {
  const cands = [];
  foes.forEach(f => { if (f.dead || f.st === 'dead') return; const b = boxOf(f); if (x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1) cands.push({ o: f, Z: b.Z }); });
  covers.concat(wrecks).forEach(c => { const b = boxOf(c); if (x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1) cands.push({ o: c, Z: b.Z, cover: true }); });
  cands.sort((a, b) => a.Z - b.Z); return cands[0] || null;
}
function damage(f, n, how) {
  f.hp -= n; f.flash = 0.12;
  if (f.hp > 0) return;
  if (f.k === 'host') { f.st = 'dead'; f.dt = 0; score = Math.max(0, score - 500); hp--; say('HOSTAGE HIT!'); K.beep(150, 0.4, { to: 80 }); return; }
  if (f.k === 'crate') { f.dead = true; if (f.give === 'gren' || f.give === 'mag') { grenades += 3; say('+3 GRENADES'); } else { rockets += 2; say('+2 ROCKETS'); } K.tune([660, 880], 0.06); return; }
  if (f.k === 'tank' || f.k === 'jeep') { f.dead = true; const x = sxw(f.wx, f.Z), y = gy(f.Z), p = ppm(f.Z); boom(x, y - p, '#ffb04a', 34, 120); for (let i = 0; i < 8; i++) puff(x + K.rnd(-1, 1) * p, y - p, 1.2 * p, 1.6, true); shake = 0.5; K.noise(0.9, 0.6); wrecks.push({ kind: 'wreck', tank: f.k === 'tank', wx: f.wx, Z: f.Z, w: f.k === 'tank' ? 3.4 : 2, h: f.k === 'tank' ? 1.4 : 1.2, seed: f.seed });
    score += f.k === 'tank' ? 1500 : 500; kills += f.k === 'tank' ? 5 : 3; say(f.k === 'tank' ? 'TANK DESTROYED!' : 'JEEP DOWN!'); return; }
  if (f.k === 'heli') { f.dead = true; boom(f.x, f.y, '#ffb04a', 34, 120); for (let i = 0; i < 6; i++) puff(f.x, f.y, 8, 1.4, true); score += 1000; kills += 4; K.noise(0.8, 0.5); say('CHOPPER DOWN!'); return; }
  f.st = 'dead'; f.dt = 0; f.aim = 0; score += 100; kills += 1; K.noise(0.1, 0.25);
}
// ---- your weapons ----
function fireRifle() {
  K.beep(180, 0.05, { type: 'sawtooth', vol: 0.04 }); const tx = cx + K.rnd(-2.5, 2.5), ty = cy + K.rnd(-2.5, 2.5);
  flashes.push({ t: 0.05, x: tx, y: ty, shot: 1 });
  const h = hitAt(tx, ty);
  if (h) { if (h.cover) { boom(tx, ty, '#c8a878', 4, 30); } else if (h.o.k === 'tank') { boom(tx, ty, '#ffe08a', 4, 40); K.beep(1800, 0.03, { vol: 0.03 }); damage(h.o, 1); } else damage(h.o, h.o.k === 'jeep' ? 1 : 1); }
  else if (ty > HY) boom(tx, ty, '#a88a5a', 3, 25);
}
function aimPoint() { const h = hitAt(cx, cy); const Z = h ? h.Z : zAtY(cy); return { Z, wx: (cx - W / 2) * Z / PK, sx: cx, sy: cy }; }
function throwGrenade() { if (grenades <= 0) { say('NO GRENADES'); return; } grenades--; const a = aimPoint(); shots.push({ k: 'gren', t: 0, T: 0.55 + a.Z / 60, Z: a.Z, wx: a.wx, sx: W / 2 + 30, sy: H - 10 }); K.beep(400, 0.12, { to: 250, vol: 0.04 }); }
function fireRocket() { if (rockets <= 0) { say('NO ROCKETS'); return; } rockets--; const a = aimPoint(); shots.push({ k: 'rkt', t: 0, T: 0.15 + a.Z / 140, Z: a.Z, wx: a.wx, sx: W / 2 - 26, sy: H - 8 }); K.noise(0.4, 0.4); K.beep(250, 0.3, { to: 900, vol: 0.05 }); }
function blast(wx, Z, r, dmgSol, dmgVeh) {
  const x = sxw(wx, Z), y = gy(Z), p = ppm(Z); boom(x, y - 0.4 * p, '#ffd24a', 24, 100); for (let i = 0; i < 5; i++) puff(x + K.rnd(-0.8, 0.8) * p, y - 0.3 * p, 0.9 * p, 1.1); flashes.push({ t: 0.12, x, y: y - 0.5 * p, big: r * p }); shake = Math.max(shake, 0.25); K.noise(0.5, 0.5); K.beep(70, 0.3, { type: 'sawtooth', to: 40, vol: 0.06 });
  foes.forEach(f => { if (f.dead || f.st === 'dead') return; if (f.k === 'heli') return; const d = Math.hypot(f.wx - wx, f.Z - Z); if (d < r) damage(f, f.k === 'tank' || f.k === 'jeep' ? dmgVeh : f.k === 'crate' ? 1 : dmgSol); });
}
function hurt(n) { hp -= n || 1; hurtFlash = 0.25; shake = Math.max(shake, 0.2 * (n || 1)); K.beep(120, 0.2, { to: 60, type: 'sawtooth' }); if (hp <= 0) { state = 'over'; best = K.saveBest('commandosights', score); K.card({ title: 'MISSION FAILED', text: 'You reached stage ' + stage + ' with ' + score + ' points.', best: 'BEST ' + best, button: 'Again', onStart: start }); } }

function update(dt) {
  if (state !== 'play') return;
  // the sight follows the stick: a small push for fine aim, all the way for fast sweeps (about twice the old speed)
  const sp = 360 + (W - 240) * 0.5, ax = K.stick.x || ((K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0)), ay = K.stick.y || ((K.down('down') ? 1 : 0) - (K.down('up') ? 1 : 0));
  cx += ax * sp * dt; cy += ay * sp * 0.8 * dt;
  if (K.ptr.down) { cx += (K.ptr.x - cx) * Math.min(1, dt * 14); cy += (K.ptr.y - 34 - cy) * Math.min(1, dt * 14); }
  cx = K.clamp(cx, 0, W); cy = K.clamp(cy, 0, H);
  if (reload > 0) { reload -= dt; if (reload <= 0) { ammo = 30; K.beep(500, 0.05); } }
  if (shake > 0) shake -= dt;
  const firing = K.down('a') || K.ptr.down;
  if (firing && reload <= 0 && ammo > 0 && Math.floor(performance.now() / 95) !== Math.floor((performance.now() - dt * 1000) / 95)) fireRifle();
  if (K.hit('c')) throwGrenade();
  if (K.hit('b')) fireRocket();
  // grenades arc out and land; rockets streak straight in
  shots.forEach(s => { s.t += dt; if (s.t >= s.T) { s.dead = true; if (s.k === 'gren') blast(s.wx, s.Z, 4.5, 99, 20); else blast(s.wx, s.Z, 3.2, 99, 34); } }); shots = shots.filter(s => !s.dead);
  // who comes on
  spawnT -= dt; const active = foes.filter(f => f.k === 'sol' && f.st !== 'dead').length;
  if (spawnT <= 0 && active < 4 + stage) { spawnSoldier(); spawnT = K.rnd(0.9, 2.0) / (1 + stage * 0.08); }
  sideT -= dt; if (sideT <= 0) { spawnSide(); sideT = K.rnd(7, 12); }
  vehT -= dt; if (vehT <= 0 && !foes.some(f => (f.k === 'tank' || f.k === 'jeep') && !f.dead)) { spawnVehicle(); vehT = K.rnd(16, 24) - stage; }
  heliT -= dt; if (heliT <= 0) { spawnHeli(); heliT = K.rnd(20, 30); }
  if (Math.random() < dt * 0.06) { const Z = K.rnd(14, 30); foes.push({ k: 'crate', wx: K.rnd(-0.7, 0.7) * maxWx(Z), Z, hp: 1, life: 6, give: ['gren', 'gren', 'rocket', 'rocket'][K.ri(0, 3)] }); }
  if (ammo === 0 && mags === 0 && reload <= 0 && rockets === 0 && !foes.some(f => f.k === 'crate')) foes.push({ k: 'crate', wx: 0, Z: 18, hp: 1, life: 6, give: 'mag' });
  foes.forEach(f => {
    if (f.flash > 0) f.flash -= dt;
    if (f.st === 'dead') { f.dt += dt; if (f.dt > 1.4) f.dead = true; return; }
    if (f.k === 'sol') {
      if (f.st === 'run') {
        const dx = f.tx - f.wx, dz = f.tZ - f.Z, d = Math.hypot(dx, dz);
        if (d < 0.3) { f.st = 'hide'; f.t = K.rnd(0.8, 2.2); }
        else { f.wx += dx / d * f.spd * dt; f.Z += dz / d * f.spd * dt; f.ph = (f.ph || 0) + dt * f.spd * 2.4; }
        // now and then a runner snaps off a shot on the move
        f.cd -= dt; if (f.cd <= 0 && !f.aim) { f.cd = K.rnd(2.5, 4); if (Math.random() < 0.35) f.aim = 0.45; }
      } else if (f.st === 'hide') { f.t -= dt; if (f.t <= 0) { if (f.final || Math.random() < 0.55) { f.st = 'peek'; f.t = K.rnd(1.2, 2.0); f.aim = K.rnd(0.5, 0.8) - stage * 0.02; } else goNext(f); } }
      else if (f.st === 'peek') { f.t -= dt; if (f.t <= 0) { f.st = 'hide'; f.aim = 0; f.t = K.rnd(0.8, 1.8); if (!f.final && Math.random() < 0.6) goNext(f); } }
      if (f.aim > 0) { f.aim -= dt; if (f.aim <= 0) enemyShot(f, 0.2 + 9 / f.Z * 0.5); }
    } else if (f.k === 'side' || f.k === 'host') {
      f.wx += f.dir * f.spd * dt; f.ph = (f.ph || 0) + dt * f.spd * 2.4;
      if (f.k === 'side') { f.cd -= dt; if (f.cd <= 0 && !f.aim) { f.cd = K.rnd(1.2, 2); f.aim = 0.4; } if (f.aim > 0) { f.aim -= dt; if (f.aim <= 0) enemyShot(f, 0.3); } }
      if (Math.abs(f.wx) > maxWx(f.Z) + 3) f.dead = true;
    } else if (f.k === 'tank' || f.k === 'jeep') {
      if (f.Z > f.stopZ) { f.Z -= f.spd * dt; if (f.k === 'jeep') f.wx += Math.sin(performance.now() / 700 + f.weave) * 2.5 * dt; if (Math.random() < dt * 4) puff(sxw(f.wx, f.Z) + K.rnd(-1, 1) * ppm(f.Z), gy(f.Z), 0.5 * ppm(f.Z), 0.8); }
      f.cd -= dt; if (f.cd <= 0 && f.Z < 50) { f.cd = f.k === 'tank' ? K.rnd(3.5, 4.5) : K.rnd(2, 3); f.aim = f.k === 'tank' ? 1.0 : 0.6; }
      if (f.aim > 0) { f.aim -= dt; if (f.aim <= 0) { if (f.k === 'tank') { flashes.push({ t: 0.15, x: sxw(f.wx, f.Z), y: gy(f.Z) - 1.5 * ppm(f.Z), muzzle: 1, r: 1.2 * ppm(f.Z) }); K.noise(0.5, 0.5); if (Math.random() < 0.55) { hurt(2); say('TANK HIT YOU!'); } else boom(K.rnd(20, W - 20), K.rnd(HY + 60, H - 40), '#a88a5a', 20, 90); } else enemyShot(f, 0.45); } }
      if (f.hp < (f.k === 'tank' ? 20 : 6) && Math.random() < dt * 6) puff(sxw(f.wx, f.Z), gy(f.Z) - 1.5 * ppm(f.Z), 0.6 * ppm(f.Z), 1.4, true);
    } else if (f.k === 'heli') {
      f.x += f.vx * dt; f.y = 58 + Math.sin(performance.now() / 500) * 8;
      f.cd -= dt; if (f.cd <= 0 && f.x > 20 && f.x < W - 20) { f.cd = K.rnd(1.6, 2.6); f.aim = 0.6; } if (f.aim > 0) { f.aim -= dt; if (f.aim <= 0) enemyShot(f, 0.4); }
      if (f.x < -120 || f.x > W + 120) f.dead = true;
    } else if (f.k === 'crate') { f.life -= dt; if (f.life <= 0) f.dead = true; }
  });
  if (state !== 'play') return;
  foes = foes.filter(f => !f.dead);
  wrecks.forEach(w => { if (Math.random() < 0.2) puff(sxw(w.wx, w.Z) + K.rnd(-0.6, 0.6) * ppm(w.Z), gy(w.Z) - w.h * ppm(w.Z), 0.5 * ppm(w.Z), 1.6, true); });
  flashes.forEach(f => f.t -= dt); flashes = flashes.filter(f => f.t > 0);
  msgs.forEach(m => m.t -= dt); msgs = msgs.filter(m => m.t > 0);
  parts.forEach(p => { p.t -= dt; p.vy += 200 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }); parts = parts.filter(p => p.t > 0);
  smoke.forEach(s => { s.l -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.r *= 1 + dt * 0.6; }); smoke = smoke.filter(s => s.l > 0);
  if (hurtFlash > 0) hurtFlash -= dt;
  if (kills >= need) { score += 1000 + hp * 100; stage++; hp = Math.min(10, hp + 3); grenades += 4; rockets += 3; K.tune([523, 659, 784, 1046], 0.12); startStage(); say('STAGE CLEAR! STAGE ' + stage, 2.4); }
  K.set('score', score); K.set('ammo', '∞  G' + grenades + '  R' + rockets); K.set('hp', 'HP ' + Math.max(0, hp));
}
function enemyShot(f, chance) {
  const x = f.k === 'heli' ? f.x : sxw(f.wx, f.Z), y = f.k === 'heli' ? f.y + 6 : gy(f.Z) - (f.k === 'jeep' ? 1.6 : 1.35) * ppm(f.Z);
  flashes.push({ t: 0.08, x, y, muzzle: 1, r: Math.max(3, 0.25 * (f.k === 'heli' ? 12 : ppm(f.Z))) }); K.beep(300, 0.04, { type: 'square', vol: 0.03 });
  if (Math.random() < chance) hurt(1);
}

// ---------------- drawing ----------------
const INK = 'rgba(20,12,6,.9)';
// a soldier facing you, feet at (x, y), s = pixels per meter. Poses: running at you, crouched behind cover, up and aiming, falling

function draw(c, t) {
