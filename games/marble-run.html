<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marble Run</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script>
// Marble Run: roll a marble down tilted isometric courses against the clock. Mind the edges, the slopes and the black marble.
K.theme({ bg: '#0c0c1a', ink: '#f0f0ff', accent: '#4ae0ff', accentInk: '#002030' });
const W = 320, H = 240, T = 16;
K.screen(W, H, { smooth: true });
K.hud(['score', 'course', 'time']);
K.pad({ dpad: '4', buttons: [{ id: 'a', label: 'BOOST' }] });

// tile chars: '.' void, '#' floor, 'G' goal, 'S' start, '<>^v' slope pushing that way, 'X' bumper pad, 'C' checkpoint
const COURSES = [
  { name: 'PRACTICE RACE', time: 40, map: [
    '##S###......',
    '######......',
    '..####......',
    '..#vv#......',
    '..#vv######.',
    '..#>>>>>>##.',
    '.......####.',
    '.......#vv#.',
    '.......#vv#.',
    '..######C##.',
    '..#<<<<<<<#.',
    '..##........',
    '..##........',
    '..#GG.......'] },
  { name: 'NARROW RIDGE', time: 45, map: [
    'S##.........',
    '###.........',
    '.#v.........',
    '.#v.........',
    '.##########.',
    '.......#v...',
    '.......#v...',
    '.....###C##.',
    '.....#......',
    '.....#......',
    '.....##>>##.',
    '.........#..',
    '..########..',
    '..#.........',
    '..##GG......'] },
  { name: 'SLIDE CITY', time: 50, map: [
    '.S##........',
    '.###>>>>>##.',
    '.........vv.',
    '.##<<<<<<<v.',
    '.#v.........',
    '.#v...###...',
    '.##>>>#C#...',
    '......#v#...',
    '..#####v####',
    '..#........#',
    '..#.####<<<#',
    '..#.#v......',
    '..###v......',
    '.....####GG.'] },
];
let state = 'title', score, ci, map, rows, cols, ball, enemy, timeLeft, check, camX, camY, fallT, msg, msgT, best = K.best('marblerun');
const tile = (gx, gy) => (gy < 0 || gy >= rows || gx < 0 || gx >= cols) ? '.' : map[gy][gx];
function iso(x, y, z) { return { x: (x - y) * 15 + 160 - camX, y: (x + y) * 7.5 - (z || 0) + 60 - camY }; }
function title() { K.card({ title: 'MARBLE RUN', text: 'Roll the marble with the arrows (or drag the way you want to roll). Reach the green goal before the clock runs out. Slopes push you, edges drop you, and the black marble shoves you around. Leftover time carries into the next course.', best: best ? 'BEST ' + best : '', button: 'Roll', onStart: start }); }
function start() { score = 0; ci = 0; timeLeft = 0; load(); state = 'play'; }
function load() {
  const C = COURSES[ci]; map = C.map; rows = map.length; cols = map[0].length; timeLeft += C.time;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) if (map[y][x] === 'S') check = { x: x * T + 8, y: y * T + 8 };
  ball = { x: check.x, y: check.y, vx: 0, vy: 0, z: 0, vz: 0 }; fallT = 0;
  let ex = null; for (let y = rows - 1; y >= 0 && !ex; y--) for (let x = 0; x < cols; x++) if (map[y][x] === '#') { ex = { x: x * T + 8, y: y * T + 8 }; break; }
  enemy = ci > 0 ? { x: ex.x, y: ex.y, vx: 0, vy: 0 } : null;
  msg = COURSES[ci].name; msgT = 2; camX = 0; camY = 0;
}
function update(dt) {
  if (state !== 'play') return;
  timeLeft -= dt; if (msgT > 0) msgT -= dt;
  if (timeLeft <= 0) { timeLeft = 0; state = 'over'; best = K.saveBest('marblerun', score); K.card({ title: 'TIME UP', text: 'You made it to course ' + (ci + 1) + ' with ' + score + ' points.', best: 'BEST ' + best, button: 'Again', onStart: start }); return; }
  if (fallT > 0) { fallT -= dt; ball.vz -= 400 * dt; ball.z += ball.vz * dt; if (fallT <= 0) { ball.x = check.x; ball.y = check.y; ball.vx = ball.vy = 0; ball.z = 0; ball.vz = 0; } return; }
  // input in screen terms, mapped to grid axes (screen right = +x -y, screen down = +x +y)
  let sx = (K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0), sy = (K.down('down') ? 1 : 0) - (K.down('up') ? 1 : 0);
  if (K.ptr.down) { const p = iso(ball.x / T, ball.y / T, 0); const dx = K.ptr.x - p.x, dy = K.ptr.y - p.y, m = Math.hypot(dx, dy); if (m > 8) { sx = dx / m; sy = dy / m; } }
  const acc = K.down('a') ? 260 : 170;
  ball.vx += (sx * 0.7 + sy) * acc * dt * 0.7; ball.vy += (-sx * 0.7 + sy) * acc * dt * 0.7;
  const gx = Math.floor(ball.x / T), gy = Math.floor(ball.y / T), tl = tile(gx, gy);
  const push = 150; if (tl === '>') ball.vx += push * dt; if (tl === '<') ball.vx -= push * dt; if (tl === 'v') ball.vy += push * dt; if (tl === '^') ball.vy -= push * dt;
  if (tl === 'X') { ball.vx *= -1.4; ball.vy *= -1.4; K.beep(900, 0.06); }
  if (tl === 'C' && (check.x !== gx * T + 8 || check.y !== gy * T + 8)) { check = { x: gx * T + 8, y: gy * T + 8 }; msg = 'CHECKPOINT'; msgT = 1; K.tune([660, 990], 0.06); }
  ball.vx *= 1 - 0.9 * dt; ball.vy *= 1 - 0.9 * dt;
  const sp = Math.hypot(ball.vx, ball.vy); if (sp > 170) { ball.vx *= 170 / sp; ball.vy *= 170 / sp; }
  ball.x += ball.vx * dt; ball.y += ball.vy * dt;
  if (enemy) { const dx = ball.x - enemy.x, dy = ball.y - enemy.y, d = Math.hypot(dx, dy) || 1; enemy.vx += dx / d * 70 * dt; enemy.vy += dy / d * 70 * dt; enemy.vx *= 1 - dt; enemy.vy *= 1 - dt; const nx = enemy.x + enemy.vx * dt, ny = enemy.y + enemy.vy * dt; if (tile(Math.floor(nx / T), Math.floor(ny / T)) !== '.') { enemy.x = nx; enemy.y = ny; } else { enemy.vx *= -0.5; enemy.vy *= -0.5; }
    if (d < 11) { ball.vx += dx / d * 140; ball.vy += dy / d * 140; enemy.vx -= dx / d * 60; enemy.vy -= dy / d * 60; K.beep(300, 0.05); } }
  const nt = tile(Math.floor(ball.x / T), Math.floor(ball.y / T));
  if (nt === '.') { fallT = 1.2; ball.vz = 40; timeLeft = Math.max(0.1, timeLeft - 3); msg = 'FELL OFF! -3s'; msgT = 1.2; K.beep(600, 0.8, { to: 80 }); }
  if (nt === 'G') { score += Math.round(timeLeft) * 100 + 1000; K.tune([523, 659, 784, 1046, 1318], 0.09); ci++;
    if (ci >= COURSES.length) { state = 'over'; best = K.saveBest('marblerun', score); K.card({ title: 'FINISH!', text: 'All three courses done! Score ' + score + '.', best: 'BEST ' + best, button: 'Again', onStart: start }); return; }
    load(); }
  const p = iso(ball.x / T, ball.y / T, 0); camX += (p.x + camX - 160 - camX) * Math.min(1, dt * 4); camY += (p.y + camY - 120 - camY) * Math.min(1, dt * 4);
  K.set('score', score); K.set('course', 'COURSE ' + (ci + 1)); K.set('time', Math.ceil(timeLeft) + 's');
}
function hsh(i, k) { const v = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return v - Math.floor(v); }
let trail = [];
function draw(c, t) {
  // deep space backdrop: gradient, nebula clouds and twinkling stars drifting with the camera
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#07071a'); g.addColorStop(0.6, '#140c3a'); g.addColorStop(1, '#2a0f4a'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  const ox = (camX || 0) * 0.15, oy = (camY || 0) * 0.15;
  [[80, 60, 90, '120,60,220'], [250, 170, 110, '40,140,220'], [200, 40, 70, '220,60,160']].forEach(([x, y, r, col]) => { const gx = ((x - ox) % 420 + 420) % 420 - 50, gy = ((y - oy) % 320 + 320) % 320 - 40, gr = c.createRadialGradient(gx, gy, 0, gx, gy, r); gr.addColorStop(0, 'rgba(' + col + ',.22)'); gr.addColorStop(1, 'rgba(' + col + ',0)'); c.fillStyle = gr; c.fillRect(gx - r, gy - r, r * 2, r * 2); });
  for (let i = 0; i < 70; i++) { const sx = ((hsh(i, 1) * 400 - ox * (0.5 + hsh(i, 3))) % 340 + 340) % 340 - 10, sy = ((hsh(i, 2) * 300 - oy * (0.5 + hsh(i, 3))) % 260 + 260) % 260 - 10; c.fillStyle = 'rgba(255,255,255,' + (0.3 + 0.5 * Math.abs(Math.sin(t / 600 + i))) + ')'; c.fillRect(sx, sy, hsh(i, 4) < 0.15 ? 1.6 : 1, hsh(i, 4) < 0.15 ? 1.6 : 1); }
  if (!map) return;
  const TH = 12;
  for (let s = 0; s < rows + cols; s++) for (let y = 0; y < rows; y++) { const x = s - y; if (x < 0 || x >= cols) continue; const ch = map[y][x]; if (ch === '.') continue;
    const a = iso(x, y), b = iso(x + 1, y), cc = iso(x + 1, y + 1), d = iso(x, y + 1);
    if (cc.y < -20 || a.y > H + 30 || b.x < -30 || d.x > W + 30) continue;
    // side walls (only where the neighbour is empty), with a dark gradient and a glowing edge line
    if (tile(x, y + 1) === '.') { const sg = c.createLinearGradient(0, d.y, 0, d.y + TH); sg.addColorStop(0, '#3a3a7a'); sg.addColorStop(1, '#14143a'); c.fillStyle = sg; c.beginPath(); c.moveTo(d.x, d.y); c.lineTo(cc.x, cc.y); c.lineTo(cc.x, cc.y + TH); c.lineTo(d.x, d.y + TH); c.fill(); c.strokeStyle = 'rgba(120,220,255,.55)'; c.lineWidth = 0.8; c.beginPath(); c.moveTo(d.x, d.y + 0.5); c.lineTo(cc.x, cc.y + 0.5); c.stroke(); }
    if (tile(x + 1, y) === '.') { const sg = c.createLinearGradient(0, b.y, 0, b.y + TH); sg.addColorStop(0, '#24245a'); sg.addColorStop(1, '#0c0c28'); c.fillStyle = sg; c.beginPath(); c.moveTo(b.x, b.y); c.lineTo(cc.x, cc.y); c.lineTo(cc.x, cc.y + TH); c.lineTo(b.x, b.y + TH); c.fill(); c.strokeStyle = 'rgba(120,220,255,.4)'; c.lineWidth = 0.8; c.beginPath(); c.moveTo(b.x, b.y + 0.5); c.lineTo(cc.x, cc.y + 0.5); c.stroke(); }
    // top face
    let top = (x + y) % 2 ? ['#9aa8ec', '#7a88d0'] : ['#8a98e0', '#6a78c4'];
    if (ch === 'G') top = ['#7affa0', '#2ad05a']; else if (ch === 'C') top = ['#ffe07a', '#e8a820']; else if (ch === 'X') top = ['#ff8ab8', '#d02a6a']; else if ('<>^v'.includes(ch)) top = ['#7ab0ff', '#3a6ad0'];
    const tg = c.createLinearGradient(a.x, a.y, cc.x, cc.y); tg.addColorStop(0, top[0]); tg.addColorStop(1, top[1]); c.fillStyle = tg;
    c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.lineTo(cc.x, cc.y); c.lineTo(d.x, d.y); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 0.6; c.stroke();
    // tile details
    const m = iso(x + 0.5, y + 0.5);
    if ('<>^v'.includes(ch)) { const dir = { '>': [1, 0], '<': [-1, 0], 'v': [0, 1], '^': [0, -1] }[ch]; for (let k = 0; k < 2; k++) { const ph = ((t / 500 + k * 0.5) % 1) - 0.5, p0 = iso(x + 0.5 + dir[0] * ph * 0.7 - dir[1] * 0.22, y + 0.5 + dir[1] * ph * 0.7 + dir[0] * 0.22), p1 = iso(x + 0.5 + dir[0] * (ph * 0.7 + 0.18), y + 0.5 + dir[1] * (ph * 0.7 + 0.18)), p2 = iso(x + 0.5 + dir[0] * ph * 0.7 + dir[1] * 0.22, y + 0.5 + dir[1] * ph * 0.7 - dir[0] * 0.22); c.strokeStyle = 'rgba(255,255,255,' + (0.8 - Math.abs(ph)) + ')'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(p0.x, p0.y); c.lineTo(p1.x, p1.y); c.lineTo(p2.x, p2.y); c.stroke(); } }
    if (ch === 'G') { const gl = c.createRadialGradient(m.x, m.y, 0, m.x, m.y, 26); gl.addColorStop(0, 'rgba(120,255,160,' + (0.35 + 0.15 * Math.sin(t / 200)) + ')'); gl.addColorStop(1, 'rgba(120,255,160,0)'); c.fillStyle = gl; c.fillRect(m.x - 26, m.y - 26, 52, 52); if ((x + y) % 2 === 0) { c.fillStyle = '#ddd'; c.fillRect(m.x - 0.6, m.y - 22, 1.2, 22); for (let r = 0; r < 3; r++) for (let k = 0; k < 4; k++) { c.fillStyle = (r + k) % 2 ? '#111' : '#fff'; c.fillRect(m.x + 0.6 + k * 2.5, m.y - 22 + r * 2.5 + Math.sin(t / 150 + k) * 0.6, 2.5, 2.5); } } }
    if (ch === 'C') { c.fillStyle = '#ddd'; c.fillRect(m.x - 0.6, m.y - 14, 1.2, 14); c.fillStyle = check && check.x === x * T + 8 && check.y === y * T + 8 ? '#4aff7a' : '#ffd23f'; c.beginPath(); c.moveTo(m.x + 0.6, m.y - 14); c.lineTo(m.x + 8 + Math.sin(t / 180) * 1.2, m.y - 11.5); c.lineTo(m.x + 0.6, m.y - 9); c.fill(); }
    if (ch === 'X') { c.strokeStyle = 'rgba(255,255,255,' + (0.5 + 0.4 * Math.sin(t / 120)) + ')'; c.lineWidth = 1.2; c.beginPath(); c.ellipse(m.x, m.y, 7, 3.5, 0, 0, 7); c.stroke(); }
    if (ch === 'S') { c.strokeStyle = 'rgba(74,224,255,.8)'; c.lineWidth = 1; c.beginPath(); c.ellipse(m.x, m.y, 8, 4, 0, 0, 7); c.stroke(); }
  }
  // glass marbles: shadow, swirl inside, rim light, specular highlight
  const drawBall = (o, col, z, dark) => {
    const sh = iso(o.x / T, o.y / T, 0); if (!z) { c.fillStyle = 'rgba(0,0,0,.45)'; c.beginPath(); c.ellipse(sh.x + 1, sh.y + 1, 7, 3.4, 0, 0, 7); c.fill(); }
    const p = iso(o.x / T, o.y / T, 6.5 + (z || 0)), R = 6.5;
    const gr = c.createRadialGradient(p.x - 2.2, p.y - 2.2, 0.5, p.x, p.y, R); gr.addColorStop(0, dark ? '#8a8a9a' : '#e8fcff'); gr.addColorStop(0.35, col); gr.addColorStop(1, dark ? '#050508' : '#0a3a6a'); c.fillStyle = gr; c.beginPath(); c.arc(p.x, p.y, R, 0, 7); c.fill();
    const rot = (o.x + o.y) / 6; c.save(); c.beginPath(); c.arc(p.x, p.y, R - 0.8, 0, 7); c.clip(); c.strokeStyle = dark ? 'rgba(255,60,60,.6)' : 'rgba(255,255,255,.55)'; c.lineWidth = 1.4; c.beginPath(); c.ellipse(p.x, p.y, R * 0.8, R * 0.32, rot, 0, 7); c.stroke(); c.strokeStyle = dark ? 'rgba(255,140,40,.4)' : 'rgba(255,210,80,.6)'; c.beginPath(); c.ellipse(p.x, p.y, R * 0.3, R * 0.75, rot, 0, 7); c.stroke(); c.restore();
    c.fillStyle = 'rgba(255,255,255,.9)'; c.beginPath(); c.ellipse(p.x - 2.2, p.y - 2.6, 1.8, 1.1, -0.6, 0, 7); c.fill();
    c.strokeStyle = dark ? 'rgba(255,80,80,.5)' : 'rgba(160,240,255,.7)'; c.lineWidth = 0.6; c.beginPath(); c.arc(p.x, p.y, R, 0.2, 2.4); c.stroke();
    if (dark) { c.fillStyle = '#ff3a4a'; c.beginPath(); c.arc(p.x - 1.8, p.y - 0.5, 0.9, 0, 7); c.arc(p.x + 1.8, p.y - 0.5, 0.9, 0, 7); c.fill(); }
  };
  // speed trail
  if (state === 'play' && !fallT) { trail.push({ x: ball.x, y: ball.y }); if (trail.length > 10) trail.shift(); } else trail = [];
  trail.forEach((q, i) => { const p = iso(q.x / T, q.y / T, 6.5); c.fillStyle = 'rgba(74,224,255,' + (i / trail.length) * 0.25 + ')'; c.beginPath(); c.arc(p.x, p.y, 2 + i * 0.4, 0, 7); c.fill(); });
  if (enemy) drawBall(enemy, '#3a3a44', 0, true);
  if (state !== 'title') drawBall(ball, '#4ae0ff', ball.z);
  const v = c.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.85); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.45)'); c.fillStyle = v; c.fillRect(0, 0, W, H);
  if (msgT > 0) K.text(c, msg, 160, 30, 14, '#fff');
}
start(); state = 'title'; title(); K.run(update, draw);
</script>
</body>
</html>
