<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rodeo Roundup</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script src="../lib/roster.js"></script>
<script>
// Rodeo Roundup: the herd is stampeding. Ride between the lanes and lasso every steer before it gets past you.
K.theme({ bg: '#2a1a0e', ink: '#fff4e0', accent: '#ffb02e', accentInk: '#2a1600' });
const W = 220, H = 360, HZ = 104, LANES = [146, 202, 258, 314], MAXSTRAY = 5, CS = 1.7; // tall screen; CS = how big the horse and cattle are drawn
K.screen(W, H);
K.hud(['score', 'strays']);
K.pad({ dpad: '4', buttons: [{ id: 'a', label: 'ROPE' }] });
const BREEDS = [{ n: 'brown', c: '#8a5a32', v: 1, pts: 10 }, { n: 'black', c: '#2a2420', v: 1.35, pts: 25 }, { n: 'spotted', c: '#f0e8dc', v: 1.15, pts: 50, weave: 1 }];
let state = 'title', rider, herd, skulls, rope, dust, score, strays, spawnT, time, best = K.best('rodeo');
function title() { K.card({ title: 'RODEO ROUNDUP', text: 'Steers are stampeding past! Ride up and down the lanes and throw your ROPE at the steer ahead of you. Steer around cow skulls or your horse stumbles. Let ' + MAXSTRAY + ' steers get away and the round is over.', best: best ? 'BEST ' + best : '', button: 'Yee-haw', onStart: start }); }
function start() { rider = { lane: 1, y: LANES[1], x: 50, jump: 0 }; herd = []; skulls = []; rope = null; dust = []; score = 0; strays = 0; spawnT = 1; time = 0; state = 'play'; hud(); }
function hud() { K.set('score', score); K.set('strays', 'STRAYS ' + '✕'.repeat(strays) + '·'.repeat(MAXSTRAY - strays)); }
const pace = () => 1 + Math.min(1.5, time / 70);

function update(dt) {
  if (state !== 'play') return;
  time += dt;
  if (K.hit('up')) rider.lane = Math.max(0, rider.lane - 1);
  if (K.hit('down')) rider.lane = Math.min(3, rider.lane + 1);
  if (K.ptr.tapped) { if (K.ptr.x > W * 0.7 && !rope) throwRope(); else { let best = 0; LANES.forEach((ly, i) => { if (Math.abs(ly - K.ptr.y) < Math.abs(LANES[best] - K.ptr.y)) best = i; }); rider.lane = best; } }
  rider.y += (LANES[rider.lane] - rider.y) * Math.min(1, dt * 12);
  const ax = (K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0);
  rider.x = K.clamp(rider.x + ax * 80 * dt, 24, 110);
  if (rider.jump > 0) rider.jump -= dt;
  if (K.hit('a') && !rope) throwRope();
  // spawn steers and skulls
  spawnT -= dt;
  if (spawnT <= 0) {
    const r = Math.random(), br = time > 40 && r < 0.2 ? BREEDS[2] : time > 15 && r < 0.5 ? BREEDS[1] : BREEDS[0];
    herd.push({ lane: K.ri(0, 3), x: W + 20, br, wt: K.rnd(1, 2.5) });
    if (Math.random() < 0.25) skulls.push({ lane: K.ri(0, 3), x: W + 60 });
    spawnT = K.rnd(0.7, 1.5) / pace();
  }
  const spd = 52 * pace();
  for (const s of herd) {
    s.x -= spd * s.br.v * dt;
    if (s.br.weave) { s.wt -= dt; if (s.wt <= 0) { s.wt = K.rnd(1, 2); s.lane = K.clamp(s.lane + (Math.random() < .5 ? -1 : 1), 0, 3); } }
    s.y = s.y == null ? LANES[s.lane] : s.y + (LANES[s.lane] - s.y) * Math.min(1, dt * 5);
    if (s.x < -20 && !s.caught) { s.gone = true; strays++; hud(); K.beep(180, 0.3, { type: 'sawtooth', to: 90, vol: 0.06 }); if (strays >= MAXSTRAY) return over(); }
  }
  for (const k of skulls) {
    k.x -= spd * 0.8 * dt;
    if (rider.jump <= 0 && k.lane === rider.lane && Math.abs(k.x - rider.x) < 22) { k.hit = true; rider.x = Math.max(24, rider.x - 34); rider.jump = 0; K.noise(0.2, 0.2); }
  }
  skulls = skulls.filter(k => k.x > -20 && !k.hit);
  // auto-hop over a skull when the horse is right on it and you tap up/down? Keep it simple: skulls cost you ground.
  if (rope) {
    rope.t += dt;
    const reach = rope.t < 0.25 ? rope.t / 0.25 : 1 - (rope.t - 0.25) / 0.25;
    rope.x = rider.x + 28 + reach * 95;
    if (!rope.done) for (const s of herd) if (!s.caught && s.lane === rope.lane && Math.abs(s.x - rope.x) < 20) {
      s.caught = true; rope.done = true; score += s.br.pts; hud(); K.tune([660, 880], 0.07, { type: 'triangle' });
      for (let i = 0; i < 8; i++) dust.push({ x: s.x, y: LANES[s.lane], vx: K.rnd(-30, 30), vy: K.rnd(-40, -10), l: 0.5 });
    }
    if (rope.t > 0.5) rope = null;
  }
  herd = herd.filter(s => !s.gone && !(s.caught && (s.cx = (s.cx || 0) + dt) > 0.6));
  if (Math.random() < 0.4) dust.push({ x: rider.x - 22, y: rider.y + 12, vx: -30, vy: -10, l: 0.4 });
  for (const d of dust) { d.x += d.vx * dt; d.y += d.vy * dt; d.l -= dt; } dust = dust.filter(d => d.l > 0);
}
function throwRope() { rope = { t: 0, lane: rider.lane, x: rider.x, done: false }; K.beep(500, 0.15, { type: 'triangle', to: 900, vol: 0.05 }); }
function over() { state = 'over'; best = K.saveBest('rodeo', score); K.card({ title: 'THEY GOT AWAY', text: 'You roped ' + score + ' points of cattle before ' + MAXSTRAY + ' steers broke loose.', best: 'BEST ' + best, button: 'Ride again', onStart: start }); }

function drawSteer(c, s, t) {
  const x = s.x, y = s.y, gal = Math.sin(t / 90 + x * 0.1), INK = A.INK, sh = A.shade, col = s.caught ? '#c9a46a' : s.br.c;
  A.shadow(c, x, y + 10, 18); c.save(); c.translate(x, y); c.scale(CS, CS); c.translate(-x, -y);
  c.lineCap = 'round'; c.lineJoin = 'round';
  // galloping legs, the far pair a little darker
  for (const [lx, a, d] of [[-7, gal, -0.3], [6, -gal, -0.3], [-3, -gal, 0], [3, gal, 0]]) {
    c.strokeStyle = INK; c.lineWidth = 2.8; c.beginPath(); c.moveTo(x + lx, y - 1); c.lineTo(x + lx + a * 2, y + 6.4); c.stroke();
    c.strokeStyle = sh(col, d - 0.15); c.lineWidth = 1.6; c.beginPath(); c.moveTo(x + lx, y - 1); c.lineTo(x + lx + a * 2, y + 6); c.stroke();
    c.fillStyle = '#1a1410'; c.fillRect(x + lx + a * 2 - 1.1, y + 5.6, 2.2, 1.4);
  }
  // tail
  c.strokeStyle = INK; c.lineWidth = 1.4; c.beginPath(); c.moveTo(x + 9.5, y - 6); c.quadraticCurveTo(x + 13 + gal, y - 4, x + 13.5, y + 0.5); c.stroke();
  c.fillStyle = INK; c.beginPath(); c.arc(x + 13.6, y + 0.8, 1.3, 0, 7); c.fill();
  // body with shading and patches
  c.fillStyle = INK; c.beginPath(); c.ellipse(x, y - 3.6, 11, 5.6, 0, 0, 7); c.fill();
  const g = c.createLinearGradient(0, y - 9, 0, y + 1.5); g.addColorStop(0, sh(col, 0.25)); g.addColorStop(1, sh(col, -0.3));
  c.fillStyle = g; c.beginPath(); c.ellipse(x, y - 3.6, 10.2, 4.9, 0, 0, 7); c.fill();
  if (s.br.weave) { c.fillStyle = '#2a2420'; c.beginPath(); c.ellipse(x - 2, y - 5, 3.2, 2.2, 0.3, 0, 7); c.fill(); c.beginPath(); c.ellipse(x + 5.5, y - 2.5, 2.6, 1.8, -0.2, 0, 7); c.fill(); }
  // shoulder hump, head, muzzle, eye
  c.fillStyle = INK; c.beginPath(); c.ellipse(x - 8.5, y - 6.5, 5, 4.2, -0.3, 0, 7); c.fill();
  c.fillStyle = sh(col, 0.08); c.beginPath(); c.ellipse(x - 8.5, y - 6.5, 4.3, 3.5, -0.3, 0, 7); c.fill();
  c.fillStyle = INK; c.beginPath(); c.roundRect(x - 16.4, y - 8.6, 7.6, 6.4, 2); c.fill();
  c.fillStyle = col; c.beginPath(); c.roundRect(x - 15.8, y - 8, 6.4, 5.2, 1.6); c.fill();
  c.fillStyle = sh(col, 0.4); c.beginPath(); c.roundRect(x - 16, y - 5.4, 3.6, 2.8, 1.2); c.fill();
  c.fillStyle = '#1a1410'; c.fillRect(x - 15.4, y - 4.6, 0.8, 0.8);
  c.fillStyle = '#fff'; c.fillRect(x - 13.4, y - 7.2, 1.4, 1.2); c.fillStyle = '#111'; c.fillRect(x - 13.4, y - 7.2, 0.8, 1.2);
  // long horns
  c.strokeStyle = INK; c.lineWidth = 2.2; c.beginPath(); c.moveTo(x - 11, y - 8.4); c.quadraticCurveTo(x - 9, y - 12.5, x - 4.5, y - 12.8); c.moveTo(x - 14, y - 8.4); c.quadraticCurveTo(x - 17, y - 12, x - 20, y - 12.2); c.stroke();
  c.strokeStyle = '#f0e8dc'; c.lineWidth = 1.1; c.beginPath(); c.moveTo(x - 11, y - 8.4); c.quadraticCurveTo(x - 9, y - 12.5, x - 4.5, y - 12.8); c.moveTo(x - 14, y - 8.4); c.quadraticCurveTo(x - 17, y - 12, x - 20, y - 12.2); c.stroke();
  if (s.caught) { c.strokeStyle = '#ffd23f'; c.lineWidth = 1; c.beginPath(); c.ellipse(x - 12, y - 6.5, 6, 4.6, 0, 0, 7); c.stroke(); }
  c.restore();
}
function draw(c, t) {
  const cm = (time || 0) * 30;
  c.save(); c.beginPath(); c.rect(0, 0, W, HZ + 1); c.clip();
  A.sky(c, W, HZ + 1, { top: '#5a4ab8', mid: '#ff9a6a', bottom: '#ffe0a0', sun: '#ffe8a0', sunX: 50, sunY: 66, sunR: 20, cloud: 'rgba(255,220,200,.6)' }, t);
  A.ridge(c, cm, { factor: 0.2, base: HZ - 6, amp: 44, col: '#c0604a', bands: ['rgba(255,210,170,.3)', 'rgba(120,40,30,.25)'], mesa: true, edge: 'rgba(0,0,0,.25)', seed: 2 });
  A.ridge(c, cm, { factor: 0.5, base: HZ + 1, amp: 18, col: '#9a4a32', edge: 'rgba(0,0,0,.35)', seed: 7 });
  c.restore();
  c.fillStyle = '#d9a35b'; c.fillRect(0, HZ, W, H - HZ);
  for (let i = 0; i < 4; i++) { c.fillStyle = i % 2 ? '#cf9a52' : '#d9a35b'; c.fillRect(0, LANES[i] - 28, W, 56); for (let k = 0; k < 40; k++) { const x = ((A.hash(k, i) * 500 - cm * 2.6) % 500 + 500) % 500 - 30; c.fillStyle = k % 3 ? 'rgba(140,90,40,.35)' : 'rgba(255,230,180,.35)'; c.fillRect(x, LANES[i] - 26 + A.hash(k, i + 5) * 52, 2 + (k % 3), 1.5); } c.fillStyle = 'rgba(0,0,0,.12)'; c.fillRect(0, LANES[i] + 16, W, 2); }
  c.fillStyle = A.INK; c.fillRect(0, HZ, W, 1.5);
  c.fillStyle = '#b8823e'; for (let x = -(((time || 0) * 80) % 40); x < W; x += 40) for (const ly of LANES) c.fillRect(x, ly + 22, 8, 2);
  // cactus
  c.fillStyle = '#3f8530'; for (let k = 0; k < 3; k++) { const x = ((k * 140 - (time || 0) * 30) % 420 + 420) % 420 - 40; c.fillRect(x, HZ - 14, 7, 20); c.fillRect(x - 7, HZ - 9, 7, 3); c.fillRect(x - 7, HZ - 17, 3, 10); c.fillRect(x + 7, HZ - 11, 7, 3); c.fillRect(x + 11, HZ - 19, 3, 10); }
  if (!herd) return;
  for (const k of skulls) { const x = Math.round(k.x), y = LANES[k.lane]; c.save(); c.translate(x, y); c.scale(1.5, 1.5); c.translate(-x, -y); c.fillStyle = '#f2ede2'; c.fillRect(x - 5, y - 2, 10, 7); c.fillRect(x - 9, y - 4, 4, 2); c.fillRect(x + 5, y - 4, 4, 2); c.fillStyle = '#333'; c.fillRect(x - 3, y, 2, 2); c.fillRect(x + 1, y, 2, 2); c.restore(); }
  const items = herd.map(s => ({ y: s.y || LANES[s.lane], d: () => drawSteer(c, s, t) })).concat([{ y: rider.y, d: () => drawRider(c, t) }]).sort((a, b) => a.y - b.y);
  items.forEach(i => i.d());
  if (rope) { c.strokeStyle = '#ffd23f'; c.lineWidth = 2.2; c.beginPath(); c.moveTo(rider.x + 8, rider.y - 36); c.quadraticCurveTo((rider.x + rope.x) / 2, LANES[rope.lane] - 64, rope.x, LANES[rope.lane] - 14); c.stroke(); c.beginPath(); c.arc(rope.x, LANES[rope.lane] - 14, 10, 0, 7); c.stroke(); }
  for (const d of dust) { c.fillStyle = 'rgba(240,210,160,' + d.l * 1.5 + ')'; c.fillRect(d.x, d.y, 3, 3); }
}
function drawRider(c, t) {
  const x = rider.x, y = rider.y, gal = Math.sin(t / 70), INK = A.INK, sh = A.shade, HC = '#f2ede2';
  A.shadow(c, x, y + 12, 22); c.save(); c.translate(x, y); c.scale(CS, CS); c.translate(-x, -y);
  c.lineCap = 'round'; c.lineJoin = 'round';
  // flowing tail
  c.strokeStyle = INK; c.lineWidth = 3.4; c.beginPath(); c.moveTo(x - 11, y - 8); c.quadraticCurveTo(x - 16 - gal, y - 7, x - 16.5, y + 1); c.stroke();
  c.strokeStyle = '#7a4a2a'; c.lineWidth = 2; c.beginPath(); c.moveTo(x - 11, y - 8); c.quadraticCurveTo(x - 16 - gal, y - 7, x - 16.5, y + 1); c.stroke();
  // galloping legs with hooves
  for (const [lx, a, d] of [[-9, gal, -0.35], [8, -gal, -0.35], [-5, -gal, 0], [5, gal, 0]]) {
    c.strokeStyle = INK; c.lineWidth = 3.4; c.beginPath(); c.moveTo(x + lx, y - 1); c.lineTo(x + lx + a * 2.4, y + 4); c.lineTo(x + lx + a * 1.2, y + 8); c.stroke();
    c.strokeStyle = sh(HC, d - 0.05); c.lineWidth = 2; c.beginPath(); c.moveTo(x + lx, y - 1); c.lineTo(x + lx + a * 2.4, y + 4); c.lineTo(x + lx + a * 1.2, y + 7.6); c.stroke();
    c.fillStyle = '#3a2414'; c.fillRect(x + lx + a * 1.2 - 1.4, y + 7.4, 2.8, 1.6);
  }
  // body: a paint horse
  c.fillStyle = INK; c.beginPath(); c.ellipse(x, y - 4.6, 13, 6.2, 0, 0, 7); c.fill();
  const g = c.createLinearGradient(0, y - 11, 0, y + 1.5); g.addColorStop(0, '#ffffff'); g.addColorStop(0.6, HC); g.addColorStop(1, '#c8bca8');
  c.fillStyle = g; c.beginPath(); c.ellipse(x, y - 4.6, 12.2, 5.5, 0, 0, 7); c.fill();
  c.fillStyle = '#8a5a34'; c.beginPath(); c.ellipse(x - 6.5, y - 5.6, 4, 3, 0.2, 0, 7); c.fill(); c.beginPath(); c.ellipse(x + 4, y - 2.4, 3, 2, -0.3, 0, 7); c.fill();
  // neck, head, mane, ear and eye
  c.fillStyle = INK; c.beginPath(); c.moveTo(x + 7, y - 9.5); c.lineTo(x + 12, y - 17.5); c.lineTo(x + 19.6, y - 16); c.lineTo(x + 21, y - 11.5); c.lineTo(x + 17.5, y - 10.6); c.lineTo(x + 13.5, y - 11.5); c.lineTo(x + 11, y - 3); c.closePath(); c.fill();
  c.fillStyle = HC; c.beginPath(); c.moveTo(x + 7.8, y - 9.4); c.lineTo(x + 12.4, y - 16.8); c.lineTo(x + 19.1, y - 15.4); c.lineTo(x + 20.2, y - 12.1); c.lineTo(x + 17.4, y - 11.3); c.lineTo(x + 13, y - 12.2); c.lineTo(x + 10.6, y - 4); c.closePath(); c.fill();
  c.fillStyle = '#c8bca8'; c.fillRect(x + 18, y - 13.4, 2, 1.6);
  c.fillStyle = '#7a4a2a'; c.beginPath(); c.moveTo(x + 8.5, y - 10); c.lineTo(x + 12, y - 17.6); c.lineTo(x + 13.6, y - 16.6); c.lineTo(x + 10.4, y - 9); c.closePath(); c.fill();
  c.fillStyle = INK; c.beginPath(); c.moveTo(x + 13.2, y - 17.2); c.lineTo(x + 13.8, y - 20); c.lineTo(x + 15, y - 17); c.closePath(); c.fill();
  c.fillStyle = '#111'; c.fillRect(x + 15.6, y - 15.4, 1.2, 1.1);
  c.strokeStyle = '#5a3a22'; c.lineWidth = 0.7; c.beginPath(); c.moveTo(x + 14, y - 16.6); c.lineTo(x + 18.6, y - 12.2); c.lineTo(x + 5, y - 14.5); c.stroke();
  // blanket and saddle
  c.fillStyle = '#2a4a8a'; c.fillRect(x - 5, y - 10.6, 9, 3.4); c.fillStyle = '#ffd23f'; c.fillRect(x - 5, y - 8.2, 9, 0.7);
  c.fillStyle = INK; c.beginPath(); c.roundRect(x - 4, y - 12, 7.4, 2.6, 1.2); c.fill(); c.fillStyle = '#7a4a2a'; c.beginPath(); c.roundRect(x - 3.6, y - 11.7, 6.6, 1.9, 1); c.fill();
  // the rider: Desire'e, J.T. or the classic cowpoke
  if (window.Roster && Roster.on()) Roster.draw(c, 'ride', x + 1, y - 9.5, 1, 31, { t: t });
  else drawCowpoke(c, x, y);
  c.restore();
}
// the classic cowpoke: hat, bandana, red shirt and leather vest, jeans in the stirrup, rope coil in hand
function drawCowpoke(c, x, y) {
  const INK = A.INK;
  c.fillStyle = INK; c.beginPath(); c.roundRect(x - 0.6, y - 11.6, 4, 8, 1.2); c.fill(); c.fillStyle = '#2a4a8a'; c.fillRect(x - 0.1, y - 11.2, 3, 6.4); c.fillStyle = '#3a2414'; c.fillRect(x - 0.4, y - 5, 4.2, 2);
  c.fillStyle = INK; c.beginPath(); c.roundRect(x - 3.6, y - 20.6, 8.8, 10.6, 2); c.fill();
  c.fillStyle = '#e63946'; c.beginPath(); c.roundRect(x - 3, y - 20, 7.6, 9.6, 1.6); c.fill();
  c.fillStyle = '#7a4a2a'; c.fillRect(x - 3, y - 19.6, 2.4, 9.2); c.fillRect(x + 2.2, y - 19.6, 2.4, 9.2); c.fillStyle = '#ffd23f'; c.fillRect(x + 2.6, y - 17.8, 1, 1);
  c.fillStyle = INK; c.fillRect(x + 3.6, y - 19, 3.6, 3); c.fillStyle = '#e63946'; c.fillRect(x + 4, y - 18.6, 2.8, 2.2); c.fillStyle = '#ffcf9e'; c.fillRect(x + 6.6, y - 18.6, 1.6, 1.8);
  c.strokeStyle = '#ffd23f'; c.lineWidth = 0.8; c.beginPath(); c.ellipse(x + 8, y - 16, 2.2, 3, 0.3, 0, 7); c.stroke();
  c.fillStyle = '#d83a3a'; c.beginPath(); c.moveTo(x - 1.6, y - 20.4); c.lineTo(x + 4.4, y - 20.4); c.lineTo(x + 1.4, y - 18); c.closePath(); c.fill();
  c.fillStyle = INK; c.beginPath(); c.arc(x + 1.4, y - 23.4, 3.6, 0, 7); c.fill();
  const fg = c.createRadialGradient(x + 2, y - 24, 0.4, x + 1.4, y - 23.4, 3.2); fg.addColorStop(0, '#ffe2c0'); fg.addColorStop(1, '#d89a68'); c.fillStyle = fg; c.beginPath(); c.arc(x + 1.4, y - 23.4, 3.1, 0, 7); c.fill();
  c.fillStyle = '#222'; c.fillRect(x + 2.8, y - 24.2, 0.9, 1); c.fillStyle = '#6b3a1e'; c.fillRect(x + 2, y - 21.9, 2, 0.6);
  c.fillStyle = INK; c.beginPath(); c.ellipse(x + 1.4, y - 26, 6.6, 1.6, 0, 0, 7); c.fill(); c.beginPath(); c.roundRect(x - 1.8, y - 30.8, 6.4, 5.2, 1.6); c.fill();
  c.fillStyle = '#8a5a2a'; c.beginPath(); c.ellipse(x + 1.4, y - 26, 5.9, 1.05, 0, 0, 7); c.fill(); c.beginPath(); c.roundRect(x - 1.2, y - 30.2, 5.2, 4.4, 1.3); c.fill();
  c.fillStyle = '#5a3216'; c.fillRect(x - 1.2, y - 27.2, 5.2, 0.9); c.fillStyle = 'rgba(255,255,255,.25)'; c.fillRect(x - 0.6, y - 29.8, 1, 2.4);
}
Roster.offer({ classic: 'Cowpoke', thumb: (g, w, h, t) => { g.save(); g.translate(13, 50); g.scale(1.5, 1.5); drawCowpoke(g, 0, 0); g.restore(); } });
title();
{ const _draw = draw; draw = function (c, t) { _draw(c, t); A.vignette(c, W, H, 0.3); }; }
K.run(update, draw);
</script>
</body>
</html>
