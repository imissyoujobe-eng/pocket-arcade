<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barn Buzzer</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script>
// Barn Buzzer: fly a biplane through every barn on the course as fast as you can. Dodge geese and windmills.
K.theme({ bg: '#18301c', ink: '#fffbea', accent: '#ffd23f', accentInk: '#2a1d00' });
const W = 320, H = 240, GROUND = 206;
K.screen(W, H);
K.hud(['course', 'barns', 'time']);
K.pad({ dpad: 'ud', buttons: [{ id: 'a', label: 'BOOST' }] });

const COURSES = [{ n: 'Meadow', barns: 8, geese: 0.5, mills: 2 }, { n: 'Valley', barns: 12, geese: 0.9, mills: 4 }, { n: 'Storm Ridge', barns: 16, geese: 1.4, mills: 6 }];
let state = 'title', course = 0, plane, cam, things, barnsLeft, time, bump, done, clouds;
function bestKey() { return 'barn' + course; }
function title() {
  K.card({ title: 'BARN BUZZER', text: 'Fly your biplane through the open door of every barn. Clip a wall or a windmill and you lose speed. Geese too. Hold BOOST for more speed. Fastest time wins.', best: bestLine(), button: 'Fly ' + COURSES[course].n, onStart: start });
}
function bestLine() { const b = K.best(bestKey()); return b ? COURSES[course].n.toUpperCase() + ' BEST ' + (b / 100).toFixed(2) + 's' : ''; }
function start() {
  const C = COURSES[course];
  plane = { x: 0, y: 120, vy: 0, v: 90, tilt: 0 }; cam = 0; time = 0; bump = 0; done = false; things = [];
  let x = 260;
  for (let i = 0; i < C.barns; i++) {
    things.push({ t: 'barn', x, passed: false, door: K.ri(0, 2) });
    const gap = K.rnd(230, 330);
    if (Math.random() < C.mills / C.barns) things.push({ t: 'mill', x: x + gap * 0.5, h: K.ri(70, 110) });
    if (Math.random() < C.geese / 2 + 0.2) things.push({ t: 'geese', x: x + gap * K.rnd(0.35, 0.75), y: K.rnd(50, 150), vy: K.rnd(-10, 10), n: K.ri(2, 4) });
    x += gap;
  }
  barnsLeft = C.barns; clouds = Array.from({ length: 8 }, (_, i) => ({ x: i * 90 + K.rnd(0, 60), y: K.rnd(14, 70), s: K.rnd(0.8, 1.4) }));
  state = 'play'; hud();
}
function hud() { K.set('course', COURSES[course].n.toUpperCase()); K.set('barns', 'BARNS ' + barnsLeft); K.set('time', time.toFixed(2) + 's'); }
// a barn's doorway: 3 heights so you have to line up
function doorY(b) { return [150, 160, 170][b.door]; }

function update(dt) {
  if (state !== 'play') return;
  if (!done) time += dt;
  const target = done ? 60 : (K.down('a') ? 150 : 100);
  plane.v += (target - plane.v) * dt * (bump > 0 ? 0.6 : 1.6);
  if (bump > 0) bump -= dt;
  const climb = (K.down('up') ? -1 : 0) + (K.down('down') ? 1 : 0);
  if (K.ptr.down) plane.vy += K.clamp((K.ptr.y - plane.y) * 4, -240, 240) * dt * 3;
  plane.vy += climb * 340 * dt; plane.vy *= Math.pow(0.04, dt);
  plane.y = K.clamp(plane.y + plane.vy * dt, 24, GROUND - 10);
  plane.tilt = K.clamp(plane.vy / 160, -0.5, 0.5);
  plane.x += plane.v * dt; cam = plane.x - 80;
  if (Math.random() < 0.6) K.beep(70 + plane.v * 0.6, 0.04, { type: 'sawtooth', vol: 0.015 });
  for (const th of things) {
    if (th.t === 'geese') { th.y += th.vy * dt; th.x -= 14 * dt; if (th.y < 40 || th.y > 170) th.vy = -th.vy; }
    if (th.hit) continue;
    const dx = plane.x - th.x;
    if (th.t === 'barn' && !th.passed) {
      // barn body spans x .. x+60; door is 30px tall, opening from dy-28 to dy
      if (dx > -14 && dx < 60) {
        const top = doorY(th) - 30, bot = doorY(th);
        if (plane.y - 5 < top || plane.y + 5 > bot) { if (dx < 0) { knock(); th.hitT = 0.5; plane.x = th.x - 18; } }
      }
      if (dx >= 60) { th.passed = true; barnsLeft--; hud(); K.tune([660, 880], 0.07, { type: 'triangle' }); if (!barnsLeft) finish(); }
    }
    if (th.t === 'mill' && Math.abs(dx - 4) < 10 && plane.y > GROUND - th.h - 18) { knock(); th.hit = true; }
    if (th.t === 'geese') for (let k = 0; k < th.n; k++) { const gx = th.x + k * 14, gy = th.y + (k % 2) * 8; if (Math.abs(plane.x - gx) < 12 && Math.abs(plane.y - gy) < 9) { knock(); th.hit = true; break; } }
  }
  if (Math.floor(time * 10) % 2 === 0) hud();
}
function knock() { plane.v = 25; bump = 0.8; plane.vy = (Math.random() - .5) * 120; K.noise(0.25, 0.25); K.beep(160, 0.25, { type: 'square', to: 80, vol: 0.06 }); }
function finish() {
  done = true; hud();
  const t = Math.round(time * 100), best = K.saveBest(bestKey(), t, true);
  K.tune([523, 659, 784, 1047, 1319], 0.1);
  setTimeout(() => {
    state = 'over';
    const next = course < COURSES.length - 1;
    K.card({ title: 'TOUCHDOWN', text: COURSES[course].n + ' done in ' + time.toFixed(2) + ' seconds.' + (next ? ' Ready for ' + COURSES[course + 1].n + '?' : ' You beat every course!'), best: 'BEST ' + (best / 100).toFixed(2) + 's', button: next ? 'Next course' : 'Fly again', onStart: () => { if (next) course++; else course = 0; start(); } });
  }, 1200);
}

function draw(c, t) {
  const sky = c.createLinearGradient(0, 0, 0, GROUND); sky.addColorStop(0, '#6ec3ff'); sky.addColorStop(1, '#d6f0ff');
  c.fillStyle = sky; c.fillRect(0, 0, W, H);
  const cm = cam || 0;
  c.fillStyle = '#fff';
  if (clouds) for (const cl of clouds) { const x = ((cl.x - cm * 0.2 * cl.s) % 720 + 720) % 720 - 60; c.beginPath(); c.arc(x, cl.y, 12 * cl.s, 0, 7); c.arc(x + 14 * cl.s, cl.y - 5, 14 * cl.s, 0, 7); c.arc(x + 28 * cl.s, cl.y, 11 * cl.s, 0, 7); c.fill(); }
  // hills
  c.fillStyle = '#7fbf5a';
  c.beginPath(); c.moveTo(0, GROUND); for (let x = 0; x <= W; x += 8) c.lineTo(x, GROUND - 26 - Math.sin((x + cm * 0.4) / 50) * 14); c.lineTo(W, GROUND); c.fill();
  c.fillStyle = '#4e9a3a'; c.fillRect(0, GROUND, W, H - GROUND);
  c.fillStyle = '#3f8530'; for (let x = -((cm) % 24); x < W; x += 24) c.fillRect(x, GROUND + 6, 12, 3);
  // fence
  c.fillStyle = '#c99a57'; for (let x = -((cm * 1) % 30); x < W; x += 30) c.fillRect(x, GROUND - 10, 3, 10); c.fillRect(0, GROUND - 7, W, 2);
  if (!things) return;
  for (const th of things) {
    const x = th.x - cm;
    if (x < -80 || x > W + 80) continue;
    if (th.t === 'barn') {
      const dy = doorY(th);
      c.fillStyle = th.passed ? '#a33a2a' : '#c8402c'; c.fillRect(x, 120, 60, GROUND - 120);
      c.fillStyle = '#5a2418'; c.beginPath(); c.moveTo(x - 6, 122); c.lineTo(x + 30, 92); c.lineTo(x + 66, 122); c.fill();
      c.fillStyle = '#fff'; c.fillRect(x, 120, 60, 3); c.fillRect(x, GROUND - 3, 60, 3);
      c.fillStyle = '#2a1410'; c.fillRect(x - 2, dy - 30, 64, 30);
      c.strokeStyle = '#fff'; c.lineWidth = 2; c.strokeRect(x, dy - 30, 60, 30);
      if (!th.passed) { c.fillStyle = '#ffd23f'; c.beginPath(); c.moveTo(x - 10, dy - 15); c.lineTo(x - 18, dy - 21); c.lineTo(x - 18, dy - 9); c.fill(); }
      c.fillStyle = '#333'; c.fillRect(x + 28, 80, 2, 14); c.fillRect(x + 22, 82, 14, 2);
    }
    if (th.t === 'mill') {
      const top = GROUND - th.h;
      c.fillStyle = '#9aa0a8'; c.beginPath(); c.moveTo(x - 6, GROUND); c.lineTo(x + 2, top); c.lineTo(x + 6, top); c.lineTo(x + 14, GROUND); c.fill();
      c.save(); c.translate(x + 4, top); c.rotate(t / 200); c.fillStyle = '#eee'; for (let k = 0; k < 4; k++) { c.rotate(Math.PI / 2); c.fillRect(-2, 0, 4, 20); } c.restore();
    }
    if (th.t === 'geese' && !th.hit) for (let k = 0; k < th.n; k++) {
      const gx = x + k * 14, gy = th.y + (k % 2) * 8, f = Math.sin(t / 80 + k) > 0;
      c.fillStyle = '#555'; c.fillRect(gx - 5, gy - 2, 10, 4); c.fillRect(gx - 9, gy - 3, 4, 2);
      c.fillStyle = '#777'; c.fillRect(gx - 2, gy + (f ? -6 : 2), 6, 4); c.fillStyle = '#ffb02e'; c.fillRect(gx - 11, gy - 2, 2, 1);
    }
  }
  // plane
  if (plane) {
    c.save(); c.translate(80, plane.y); c.rotate(plane.tilt);
    if (bump > 0 && Math.floor(t / 60) % 2) c.globalAlpha = 0.5;
    c.fillStyle = '#ffd23f'; c.fillRect(-14, -3, 26, 6); c.fillRect(-16, -8, 4, 6);
    c.fillStyle = '#e63946'; c.fillRect(-8, -9, 14, 3); c.fillRect(-8, 5, 14, 3);
    c.fillStyle = '#5a3a1a'; c.fillRect(-5, -6, 2, 12); c.fillRect(3, -6, 2, 12);
    c.fillStyle = '#333'; c.fillRect(12, -2, 3, 4);
    c.fillStyle = '#ccc'; const p = (t / 25 | 0) % 2 ? 9 : 3; c.fillRect(15, -p, 2, p * 2);
    c.fillStyle = '#7a4a2a'; c.fillRect(-2, -6, 4, 3);
    c.restore();
  }
  if (state === 'play' && time < 1.5) K.text(c, 'FLY THROUGH THE DOORS!', W / 2, 40, 12, '#fff');
  if (done) K.text(c, 'COURSE CLEAR!', W / 2, 60, 18, '#ffd23f');
}
title();
K.run(update, draw);
</script>
</body>
</html>
