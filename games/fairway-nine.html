  teePeg.visible = ball.onTee; teePeg.position.set(ball.x, gy + 0.012, ball.z);
  const cl = flag.userData.cloth.geometry.attributes.position; for (let i = 0; i < cl.count; i++) { const x = cl.getX(i) + 0.35; cl.setZ(i, Math.sin(t / 200 + x * 7) * 0.05 * x * (0.5 + Math.hypot(wind.x, wind.z) * 0.15)); } cl.needsUpdate = true; flag.rotation.y = Math.atan2(-wind.z, wind.x);
  if (trailM.visible && flightPts.length > 5) { const a = trailM.geometry.attributes.position, n = Math.min(TRAIL_N, flightPts.length / 3); a.array.set(flightPts.length > TRAIL_N * 3 ? flightPts.slice(0, TRAIL_N * 3) : flightPts); a.needsUpdate = true; trailM.geometry.setDrawRange(0, n); }
  // your arms and club swing around your chest
  swingG.quaternion.setFromAxisAngle(SWING_AXIS, theta);
  // cameras
  let near = 0.25;
  if (camMode === 'aim' || camMode === 'walk') { aimView(tA, tB); const k = camMode === 'walk' ? 2.6 : 9; camPos.lerp(tA, 1 - Math.exp(-k * dt)); camLook.lerp(tB, 1 - Math.exp(-k * 1.2 * dt)); golfer.visible = false; }
  else if (camMode === 'address') { eyeWorld(tA); addrLook(tB); camPos.lerp(tA, 1 - Math.exp(-7 * dt)); camLook.lerp(tB, 1 - Math.exp(-8 * dt)); golfer.visible = true; near = 0.03; }
  else {
    // your eyes come up off the ball and follow it, then chase it down the fairway
    PV.set(ball.x, ball.y, ball.z); const sp = Math.hypot(ball.vx, ball.vz);
    if (sp > 1) { tC.set(ball.vx / sp, 0, ball.vz / sp); chaseDir.lerp(tC, 1 - Math.exp(-2.2 * dt)).normalize(); }
    const putt = shotClub === PUTTER, flying = ball.mode === 'fly', back = putt ? 4 : flying ? 11 : 7, up = putt ? 1.5 : flying ? 3.2 : 2.4;
    tB.set(ball.x - chaseDir.x * back, 0, ball.z - chaseDir.z * back); tB.y = Math.max(hAt(tB.x, tB.z) + 1.5, ball.y + up);
    const u = putt ? sstep(1.1, 2.6, watchT) * K.clamp((PV.distanceTo(eyeAtHit) - 6) / 6, 0, 1) : sstep(0.45, 1.7, watchT);
    tA.copy(eyeAtHit); tA.y += Math.min(0.12, watchT * 0.4); camPos.copy(tA).lerp(tB, u);
    camPos.y = Math.max(camPos.y, hAt(camPos.x, camPos.z) + 1.1);
    camLook.lerp(PV, 1 - Math.exp(-(watchT < 0.4 ? 9 : 14) * dt));

  }
  // looking straight down at the ball, 'up' on the screen is the way you face; otherwise it's the sky
  aD.subVectors(camLook, camPos).normalize(); const kUp = (camMode === 'address' || golfer.visible) ? sstep(0.8, 0.97, -aD.y) * 4 : 0; camera.up.set(-Math.cos(aimA) * kUp, 1, Math.sin(aimA) * kUp).normalize();
  if (golfer.visible) poseArms();
  camera.position.copy(camPos); camera.lookAt(camLook);
  const fovT = camMode === 'address' || (camMode === 'follow' && golfer.visible) ? (camera.aspect < 1 ? 76 : 60) : (camera.aspect < 1 ? 64 : 48);
  fovNow += (fovT - fovNow) * (1 - Math.exp(-6 * dt)); camera.fov = fovNow; camera.near = near; camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  drawHud();
}

// ---------- HUD ----------
function toScreen(x, y, z) { PV.set(x, y, z).project(camera); if (PV.z > 1 || PV.z < -1) return null; return { x: (PV.x + 1) / 2 * hudC._w, y: (1 - PV.y) / 2 * hudC._h }; }
function txt(s, x, y, size, col, al) { const c = hc; c.font = size + 'px Bungee, Impact, sans-serif'; c.textAlign = al || 'left'; c.textBaseline = 'middle'; c.fillStyle = 'rgba(0,0,0,.6)'; c.fillText(s, x + 1.5, y + 1.5); c.fillStyle = col || '#fff'; c.fillText(s, x, y); }
function box(x, y, w, h) { hc.fillStyle = 'rgba(0,0,0,.45)'; hc.beginPath(); hc.roundRect(x, y, w, h, 10); hc.fill(); }
function drawHud() {
  const W0 = hudC._w, h = hudC._h, c = hc; c.clearRect(0, 0, W0, h); if (state !== 'play' || !hd) return; const w = W0 - insetR;
  const onGreen = lie === 'green' && phase !== 'watch', d = distToPin(), C = CLUBS[club];
  // aim: dotted line out to where this club carries, or the putt's path across the green
  if (phase === 'aim' && camMode === 'aim') {
    if (C.putt) { for (let i = 0; i < puttPts.length; i += 2) { const p = toScreen(puttPts[i], hAt(puttPts[i], puttPts[i + 1]) + 0.02, puttPts[i + 1]); if (!p) continue; c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.arc(p.x, p.y, 2.6, 0, 7); c.fill(); } }
    else {
      const L = carryFor(club, 1), N = 26;
      for (let i = 1; i <= N; i++) { const f = i / N, x = ball.x + Math.sin(aimA) * L * f, z = ball.z + Math.cos(aimA) * L * f, p = toScreen(x, hAt(x, z) + 0.15, z); if (!p) continue; c.fillStyle = 'rgba(255,255,255,' + (0.95 - f * 0.4) + ')'; c.beginPath(); c.arc(p.x, p.y, 4.2 - f * 2.4, 0, 7); c.fill(); }
      const x = ball.x + Math.sin(aimA) * L, z = ball.z + Math.cos(aimA) * L, p = toScreen(x, hAt(x, z) + 0.2, z); if (p) { c.strokeStyle = '#ffd23f'; c.lineWidth = 2.5; c.beginPath(); c.ellipse(p.x, p.y, 13, 5, 0, 0, 7); c.stroke(); }
    }
  }
  // the pin: a marker over the flag with how far it is
  if (d > 6 && phase !== 'charge' && phase !== 'down') { const p = toScreen(green.cup.x, green.cup.y + 3, green.cup.z); if (p && p.y > 30 && p.y < h - 20) { c.fillStyle = '#e8202a'; c.beginPath(); c.moveTo(p.x, p.y - 2); c.lineTo(p.x - 7, p.y - 14); c.lineTo(p.x + 7, p.y - 14); c.fill(); txt(Math.round(d * YD) + '', p.x, p.y - 23, 10, '#fff', 'center'); } }
  // top left: par, distance, club and how far it goes, uphill or downhill
  const elev = phase === 'watch' ? 0 : (green.cup.y - (ball.y - BR)) * FT; box(8, 8, 156, Math.abs(elev) > 3 ? 62 : 46);
  txt('PAR ' + hd.par, 16, 21, 12, '#ffd23f'); txt(onGreen || d < 20 ? Math.round(d * FT) + ' FT' : Math.round(d * YD) + ' YDS', 76, 21, 12, '#fff');
  txt(C.n + (C.putt ? ' · ' + Math.round(puttRange * FT) + ' FT MAX' : ' · ' + Math.round(carryFor(club, 1) * YD) + ' YDS'), 16, 40, 9, '#cfe8c8');
  if (Math.abs(elev) > 3) txt((elev > 0 ? '▲ UPHILL ' : '▼ DOWNHILL ') + Math.round(Math.abs(elev)) + ' FT', 16, 56, 8, elev > 0 ? '#ffb38a' : '#9fd6ff');
  // top right: wind, the arrow turned to where you're facing
  const ws = Math.hypot(wind.x, wind.z), wa = Math.atan2(wind.x, wind.z) - aimA; box(w - 92, 8, 84, 58); txt('WIND', w - 50, 19, 9, '#fff', 'center'); txt(Math.round(ws * 2.237) + ' MPH', w - 50, 56, 9, '#9fd6ff', 'center');
  c.save(); c.translate(w - 50, 37); c.rotate(-wa); c.fillStyle = '#9fd6ff'; const L = 6 + ws * 2.2; c.fillRect(-2, -L / 2 + 4, 4, L - 4); c.beginPath(); c.moveTo(0, -L / 2 - 5); c.lineTo(-6, -L / 2 + 4); c.lineTo(6, -L / 2 + 4); c.fill(); c.restore();
  if (phase !== 'charge' && phase !== 'down') miniMap(c, w);
  // power meter and how far that much power sends it
  if (phase === 'charge' || phase === 'down' || (phase === 'watch' && watchT < 0.5)) {
    const bh = Math.min(220, h * 0.4), x = w - 36, y = h * 0.52 - bh / 2 + 20; box(x - 9, y - 24, 40, bh + 36);
    const g = c.createLinearGradient(0, y + bh, 0, y); g.addColorStop(0, '#5ad65a'); g.addColorStop(0.75, '#ffd23f'); g.addColorStop(1, '#ff4a3a'); c.fillStyle = g; c.fillRect(x, y, 22, bh);
    for (let i = 1; i < 4; i++) { c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(x, y + bh * i / 4, 22, 1); }
    const ny = y + bh * (1 - power); c.fillStyle = '#fff'; c.fillRect(x - 6, ny - 2, 34, 4); txt('POWER', x + 11, y - 13, 7, '#fff', 'center');
    const cy = K.clamp(ny, y + 8, y + bh - 8), dist = carryFor(club, Math.round(power * 50) / 50);
    txt(C.putt ? Math.round(dist * FT) + ' FT' : Math.round(dist * YD) + ' YDS', x - 14, cy, 12, '#fff', 'right');
  }
  if (phase === 'aim' && camMode === 'aim') txt(C.putt ? '◀ ▶ READ THE LINE · HOLD SWING' : '◀ ▶ AIM · CLUB · HOLD SWING', w / 2, h - 18, 10, '#fff', 'center');
  if (phase === 'charge') txt(pdir < 0 ? 'LET GO!' : 'LET GO TO HIT', w / 2, h - 18, 11, pdir < 0 ? '#ff8a7a' : '#ffd23f', 'center');
  if (phase === 'watch' && ball.mode === 'fly' && watchT > 1.2) txt('HOLD SWING TO SPEED UP', w / 2, h - 18, 8, 'rgba(255,255,255,.8)', 'center');
  if (ballM.visible && phase === 'watch') { const far = camera.position.distanceTo(PV.set(ball.x, ball.y, ball.z)); if (far > 22) { const p = toScreen(ball.x, ball.y + 0.03, ball.z); if (p) { c.fillStyle = 'rgba(0,0,0,.5)'; c.beginPath(); c.arc(p.x, p.y, 4.6, 0, 7); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(p.x, p.y, 3.2, 0, 7); c.fill(); } } }
  if (msgT > 0) txt(msg, w / 2, h * 0.24, 18, '#fff', 'center');
  if (fadeT > 0) { c.fillStyle = 'rgba(0,0,0,' + Math.min(1, fadeT / 0.16) + ')'; c.fillRect(0, 0, W0, h); }
}
// little map of the hole: fairway, water, sand, the green, the ball and your aim (mirrored left-right so it matches
// what you see looking down the hole)
function miniMap(c, w) {
  const mw = 64, mh = 100, x0 = w - 82, y0 = 76; let ax = 1e9, bx = -1e9, az = 1e9, bz = -1e9; path.forEach(p => { ax = Math.min(ax, p.x); bx = Math.max(bx, p.x); az = Math.min(az, p.z); bz = Math.max(bz, p.z); });
  ax -= 35; bx += 35; az -= 15; bz += 25; const sc = Math.min(mw / (bx - ax), mh / (bz - az)), ox = x0 + (mw - (bx - ax) * sc) / 2, X = x => ox + (bx - x) * sc, Y = z => y0 + mh - (z - az) * sc;
  box(x0 - 8, y0 - 8, mw + 16, mh + 16);
  c.strokeStyle = '#5cb83c'; c.lineWidth = Math.max(3, hd.fw * sc); c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); path.forEach((p, i) => i ? c.lineTo(X(p.x), Y(p.z)) : c.moveTo(X(p.x), Y(p.z))); c.stroke();
  ponds.forEach(p => { c.fillStyle = '#3a8ad8'; c.beginPath(); c.ellipse(X(p.x), Y(p.z), p.rx * sc * 1.1, p.rz * sc * 1.1, 0, 0, 7); c.fill(); });
  bunkers.forEach(b => { c.fillStyle = '#e8d6a0'; c.beginPath(); c.ellipse(X(b.x), Y(b.z), Math.max(1.3, b.rx * sc), Math.max(1.3, b.rz * sc), 0, 0, 7); c.fill(); });
  c.fillStyle = '#7ad85a'; c.beginPath(); c.ellipse(X(green.x), Y(green.z), green.rx * sc, green.rz * sc, 0, 0, 7); c.fill();
  c.fillStyle = '#e8202a'; c.fillRect(X(green.cup.x) - 1, Y(green.cup.z) - 6, 2, 6);
  if (phase === 'aim' && !CLUBS[club].putt) { const L = carryFor(club, 1); c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1; c.beginPath(); c.moveTo(X(ball.x), Y(ball.z)); c.lineTo(X(ball.x + Math.sin(aimA) * L), Y(ball.z + Math.cos(aimA) * L)); c.stroke(); }
  c.fillStyle = '#fff'; c.beginPath(); c.arc(X(ball.x), Y(ball.z), 2.6, 0, 7); c.fill();
}

function title() { K.card({ title: 'FAIRWAY NINE', text: 'Nine holes of 3D golf through your own eyes. Stand behind the ball and aim with ◀ ▶ (or drag), tap CLUB to switch clubs. Hold SWING: you step up and look down at the ball as the power meter climbs, and let go to hit. Your eyes follow the ball. Wind pushes it, and it rolls down the hills. On the green, the dotted line shows how the putt breaks. Sand, water and big trees are waiting.', best: best ? 'BEST ' + fmtPar(best - 100) : '', button: 'Tee off', onStart: () => { cards = []; hole = 0; loadHole(); state = 'play'; } ,
  art: { src: '../art/fairway-nine.jpg', w: 600, h: 600, band: [0.1, 0.5] } }); }
setup(); calibrate(); hole = 0; loadHole(); state = 'title'; title();
K.run(update, () => {});
// a peek for the tests
window.golfDebug = () => ({ state, phase, hole, strokes, club: CLUBS[club].n, lie, ball: { ...ball }, cup: green.cup, d: distToPin(), trees: trees.length, camMode, theta, power, cards: cards.slice(), msg });
window.golfSet = o => { if (o.addr) { fitClub(); placeGolfer(); camMode = 'address'; eyeWorld(camPos); addrLook(camLook); fovNow = camera.aspect < 1 ? 76 : 60; } if (o.ball) Object.assign(ball, o.ball); if (o.aim != null) aimA = o.aim; if (o.club != null) club = o.club; if (o.lie) lie = o.lie; if (o.wind) wind = o.wind; if (o.hole != null) { hole = o.hole; loadHole(); } puttKey = ''; carryCache = {}; };
