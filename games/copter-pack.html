<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Copter Pack</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script>
// Copter Pack: fly a heli-pack down through the mine, blast critters with your helmet laser, dynamite the walls and rescue the trapped miner.
K.theme({ bg: '#120c08', ink: '#fff2e0', accent: '#ffb02e', accentInk: '#2a1600' });
const W = 320, H = 240, T = 16;          // one mine room, in world units
const VW = 150, VH = 200;                  // camera window: zoomed in on the pilot, phone-shaped
K.screen(VW, VH);
let camX = 0, camY = 0, camRoom = -1;
K.hud(['score', 'level', 'lives', 'tnt']);
K.pad({ dpad: '4', buttons: [{ id: 'b', label: 'TNT' }, { id: 'a', label: 'LASER' }] });

const L1 = [[
  '####################', '#P.................#', '#..................#', '#..................#', '###########....#####',
  '#..................#', '#..................#', '#.....B............#', '#..................#', '#...################',
  '#.........W........#', '#.........W........#', '#.........W........#', '#.........W........#', '################...#'
], [
  '################...#', '#..................#', '#..................#', '#..........S.......#', '#..................#',
  '####...#############', '#..................#', '#..L...............#', '#..L...............#', '#..L......B........#',
  '#..L...............#', '#..L.........W.....#', '#..L.........W.....#', '#..L.........W...M.#', '####################'
]];
const L2 = [[
  '####################', '#.................P#', '#..................#', '#..B...............#', '#....###############',
  '#.......W..........#', '#.......W..........#', '#.......W....S.....#', '#.......W..........#', '###############....#',
  '#..................#', '#..................#', '#.....LLLLLL.......#', '#..................#', '#...################'
], [
  '#...################', '#..................#', '#.....S............#', '#..................#', '#############.....##',
  '#..................#', '#....W.............#', '#....W......B......#', '#....W.............#', '#....W.............#',
  '#....###############', '#..................#', '#..................#', '#..L..L..L..L..L...#', '################...#'
], [
  '################...#', '#..................#', '#..................#', '#.......S..........#', '#..................#',
  '######...###########', '#..................#', '#..B...............#', '#..................#', '#..................#',
  '#..........W.......#', '#..........W.......#', '#..........W.......#', '#..........W....M..#', '####################'
]];
const mirror = lv => lv.map(room => room.map(r => r.split('').reverse().join('')));
const LEVELS = [L1, L2, mirror(L1), mirror(L2)];

let state = 'title', lvIdx, lap, rooms, room, p, score, lives, tnt, power, bombs, fx, beam, dead, msg, msgT, rescued, best = K.best('copter');
function title() { K.card({ title: 'COPTER PACK', text: 'A miner is trapped deep in the mine! Hold UP to fly, LASER to zap critters, and drop TNT next to striped walls to blast through, then get clear! Lava glows orange and is deadly. Your power runs down, so hurry.', best: best ? 'BEST ' + best : '', button: 'Fly down', onStart: start }); }
function start() { score = 0; lives = 4; lvIdx = 0; lap = 0; loadLevel(); state = 'play'; hud(); }
function loadLevel() {
  const src = LEVELS[lvIdx % LEVELS.length];
  rooms = src.map(r => ({ g: r.map(row => row.split('')), mobs: [] }));
  rooms.forEach((rm, ri) => rm.g.forEach((row, y) => row.forEach((ch, x) => {
    if (ch === 'P') { rm.start = { x: x * T + 3, y: y * T }; row[x] = '.'; }
    if (ch === 'S') { rm.mobs.push({ t: 'spider', x: x * T + 8, y0: y * T, y: y * T, ph: Math.random() * 6 }); row[x] = '.'; }
    if (ch === 'B') { rm.mobs.push({ t: 'bat', x: x * T + 8, y: y * T + 8, vx: (40 + lap * 12) * (Math.random() < .5 ? -1 : 1) }); row[x] = '.'; }
    if (ch === 'M') { rm.miner = { x: x * T + 8, y: y * T + 16 }; row[x] = '.'; }
  })));
  room = 0; tnt = 6; power = 100; bombs = []; fx = []; rescued = 0; msg = 'LEVEL ' + (lvIdx + 1); msgT = 1.5;
  spawn();
}
function spawn() { const s = rooms[0].start; room = 0; p = { x: s.x, y: s.y, vx: 0, vy: 0, face: 1, onGround: false }; dead = 0; beam = 0; }
function hud() { K.set('score', score); K.set('level', 'LV ' + (lvIdx + 1)); K.set('lives', '♥'.repeat(Math.max(0, lives))); K.set('tnt', 'TNT ' + tnt); }

function tileAt(px, py, ri) {
  ri = ri === undefined ? room : ri; let r = ri, y = py;
  while (y >= H && r < rooms.length - 1) { y -= H; r++; } while (y < 0 && r > 0) { y += H; r--; }
  const tx = Math.floor(px / T), ty = Math.floor(y / T);
  if (tx < 0 || tx >= 20 || ty < 0 || ty >= 15) return '#';
  return rooms[r].g[ty][tx];
}
const solid = ch => ch === '#' || ch === 'W' || ch === 'L';
function boxHits(x, y, w, h, test) { for (const [ax, ay] of [[x, y], [x + w - 1, y], [x, y + h - 1], [x + w - 1, y + h - 1], [x + w / 2, y], [x + w / 2, y + h - 1], [x, y + h / 2], [x + w - 1, y + h / 2]]) if (test(tileAt(ax, ay))) return true; return false; }

function update(dt) {
  if (state !== 'play') return;
  if (msgT > 0) msgT -= dt;
  for (const f of fx) { f.l -= dt; } fx = fx.filter(f => f.l > 0);
  if (dead > 0) { dead -= dt; if (dead <= 0) { if (lives <= 0) return over(); power = Math.max(power, 60); spawn(); } return; }
  if (rescued > 0) { rescued -= dt; if (rescued <= 0) { lvIdx++; if (lvIdx % LEVELS.length === 0) lap++; loadLevel(); hud(); } return; }
  power -= dt * 1.6; if (power <= 0) { power = 0; return die('OUT OF POWER'); }
  const ax = (K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0);
  if (ax) p.face = ax;
  p.vx = ax * 72;
  const thrust = K.down('up');
  p.vy += (thrust ? -560 : 330) * dt; p.vy = K.clamp(p.vy, -95, 170);
  if (K.down('down')) p.vy = Math.min(170, p.vy + 300 * dt);
  // move x then y against solid tiles
  const PW = 10, PH = 14;
  let nx = p.x + p.vx * dt;
  if (!boxHits(nx, p.y, PW, PH, solid)) p.x = nx;
  let ny = p.y + p.vy * dt; p.onGround = false;
  if (!boxHits(p.x, ny, PW, PH, solid)) p.y = ny; else { if (p.vy > 0) p.onGround = true; p.vy = 0; }
  if (boxHits(p.x, p.y, PW, PH, ch => ch === 'L')) return die('BURNED!');
  if (boxHits(p.x - 1, p.y - 1, PW + 2, PH + 2, ch => ch === 'L')) return die('BURNED!');
  if (p.y > H - 2 && room < rooms.length - 1) { room++; p.y -= H; }
  if (p.y < -6 && room > 0) { room--; p.y += H; }
  if (thrust && Math.random() < 0.5) K.beep(110, 0.03, { type: 'sawtooth', vol: 0.015 });
  // laser
  beam = 0;
  if (K.down('a')) {
    const y = p.y + 4, x0 = p.x + (p.face > 0 ? PW : 0);
    let len = 0; while (len < 80 && !solid(tileAt(x0 + p.face * len, y))) len += 2;
    beam = len;
    for (const m of rooms[room].mobs) if (!m.dead && Math.abs(m.y - y) < 9 && (p.face > 0 ? m.x > x0 && m.x < x0 + len + 4 : m.x < x0 && m.x > x0 - len - 4)) { m.dead = true; score += 50; hud(); pop(m.x, m.y, '#ffd23f'); K.beep(400, 0.12, { to: 100, vol: 0.06 }); }
    if (Math.random() < 0.4) K.beep(1800, 0.02, { vol: 0.015 });
  }
  // dynamite
  if (K.hit('b') && tnt > 0 && p.onGround) { tnt--; hud(); bombs.push({ x: p.x + PW / 2, y: p.y + PH - 4, room, t: 1.4 }); K.beep(700, 0.05, { vol: 0.04 }); }
  for (const b of bombs) {
    b.t -= dt;
    if (b.t <= 0) {
      b.dead = true; K.noise(0.6, 0.45); fx.push({ x: b.x, y: b.y, room: b.room, l: 0.5, boom: true });
      const g = rooms[b.room].g;
      for (let ty = 0; ty < 15; ty++) for (let tx = 0; tx < 20; tx++) if (g[ty][tx] === 'W' && Math.hypot(tx * T + 8 - b.x, ty * T + 8 - b.y) < 34) { g[ty][tx] = '.'; score += 75; for (let i = 0; i < 5; i++) fx.push({ x: tx * T + 8, y: ty * T + 8, vx: K.rnd(-80, 80), vy: K.rnd(-80, 20), room: b.room, l: 0.6, rock: true }); }
      for (const m of rooms[b.room].mobs) if (!m.dead && Math.hypot(m.x - b.x, m.y - b.y) < 34) { m.dead = true; score += 50; }
      hud();
      if (b.room === room && Math.hypot(p.x + PW / 2 - b.x, p.y + PH / 2 - b.y) < 26) return die('TOO CLOSE TO THE TNT');
    }
  }
  bombs = bombs.filter(b => !b.dead);
  for (const f of fx) if (f.rock) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 300 * dt; }
  // critters
  for (const m of rooms[room].mobs) {
    if (m.dead) continue;
    if (m.t === 'spider') { m.ph += dt * (1.5 + lap * 0.4); m.y = m.y0 + 10 + (Math.sin(m.ph) * 0.5 + 0.5) * 40; }
    else { const nx = m.x + m.vx * dt; if (solid(tileAt(nx + Math.sign(m.vx) * 6, m.y))) m.vx = -m.vx; else m.x = nx; m.y += Math.sin(performance.now() / 200 + m.x) * 0.3; }
    if (Math.abs(m.x - (p.x + PW / 2)) < 10 && Math.abs(m.y - (p.y + PH / 2)) < 11) return die('BITTEN!');
  }
  const mn = rooms[room].miner;
  if (mn && Math.abs(mn.x - (p.x + PW / 2)) < 14 && Math.abs(mn.y - (p.y + PH)) < 16) {
    const bonus = 1000 + Math.floor(power) * 10 + tnt * 50; score += bonus; hud(); rescued = 2.4; msg = 'RESCUED! +' + bonus; msgT = 2.4;
    K.tune([523, 659, 784, 1047, 1319], 0.1);
  }
}
function pop(x, y, c) { for (let i = 0; i < 8; i++) fx.push({ x, y, vx: K.rnd(-60, 60), vy: K.rnd(-60, 20), room, l: 0.4, rock: true, c }); }
function die(t) { lives--; hud(); dead = 1.6; msg = t; msgT = 1.6; pop(p.x + 5, p.y + 7, '#ff5a36'); K.beep(200, 0.5, { type: 'sawtooth', to: 50, vol: 0.07 }); }
function over() { state = 'over'; best = K.saveBest('copter', score); K.card({ title: 'MISSION OVER', text: 'You reached level ' + (lvIdx + 1) + ' and scored ' + score + '.', best: 'BEST ' + best, button: 'Fly again', onStart: start }); }

function draw(c, t) {
  c.fillStyle = '#0a0604'; c.fillRect(0, 0, VW, VH);
  if (!rooms) return;
  // follow camera, kept inside the room; snaps when you fly into a new room
  const tx = K.clamp(p.x + 5 + p.face * 10 - VW / 2, 0, W - VW), ty = K.clamp(p.y + 7 - VH / 2, 0, H - VH);
  if (camRoom !== room) { camX = tx; camY = ty; camRoom = room; } else { camX += (tx - camX) * 0.12; camY += (ty - camY) * 0.12; }
  c.save(); c.translate(-camX, -camY);
  const bgc = c.createLinearGradient(0, 0, 0, H); bgc.addColorStop(0, '#120a06'); bgc.addColorStop(1, '#2a1a10'); c.fillStyle = bgc; c.fillRect(0, 0, W, H);
  const g = rooms[room].g;
  for (let i = 0; i < 14; i++) { c.fillStyle = 'rgba(80,55,35,' + (0.2 + A.hash(i, room) * 0.2) + ')'; c.beginPath(); c.ellipse(A.hash(i, room, 1) * W, A.hash(i, room, 2) * H, 14 + A.hash(i, 3) * 20, 8 + A.hash(i, 4) * 10, A.hash(i, 5) * 3, 0, 7); c.fill(); }
  const solidC = (x, y) => x < 0 || y < 0 || x >= 20 || y >= 15 || g[y][x] === '#';
  for (let y = 0; y < 15; y++) for (let x = 0; x < 20; x++) {
    const ch = g[y][x], X = x * T, Y = y * T;
    if (ch === '#') A.tile(c, 'cp', X, Y, A.edges(solidC, x, y), x + room * 20, y, Object.assign({}, A.PAL.earth, { base: '#6b4a2e', hi: '#8a6440', lo: '#4a321e', mortar: '#24160c', grass: null }));
    else if (ch === 'W') { // cracked timber wall, weak to TNT
      c.fillStyle = '#3a2410'; c.fillRect(X, Y, T, T);
      for (let k = 0; k < 3; k++) { const py = Y + 0.5 + k * 5.2, g2 = c.createLinearGradient(0, py, 0, py + 4.6); g2.addColorStop(0, '#e8c070'); g2.addColorStop(1, '#a87a34'); c.fillStyle = g2; c.fillRect(X + 0.5, py, T - 1, 4.6); c.fillStyle = 'rgba(90,55,20,.55)'; c.fillRect(X + 1 + A.hash(x, y + k) * 8, py + 1.6, 5, 0.5); c.fillStyle = '#5a3a1a'; c.beginPath(); c.arc(X + 2.5, py + 2.3, 0.7, 0, 7); c.arc(X + T - 2.5, py + 2.3, 0.7, 0, 7); c.fill(); }
      c.strokeStyle = 'rgba(30,15,5,.8)'; c.lineWidth = 0.6; c.beginPath(); c.moveTo(X + 4 + A.hash(x, y) * 6, Y + 1); c.lineTo(X + 7, Y + 7); c.lineTo(X + 5 + A.hash(y, x) * 6, Y + 15); c.stroke();
      c.fillStyle = 'rgba(230,57,70,.85)'; c.fillRect(X + 1, Y + T - 3, 3, 2); c.fillRect(X + T - 4, Y + T - 3, 3, 2);
    }
    else if (ch === 'L') A.lava(c, X, Y, T, T, t + x * 50);
  }
  const mn = rooms[room].miner;
  if (mn && rescued <= 0) drawMiner(c, mn.x, mn.y, t);
  for (const m of rooms[room].mobs) { if (m.dead) continue; if (m.t === 'spider') drawSpider(c, m, t); else drawBat(c, m, t); }
  for (const b of bombs) if (b.room === room) drawTNT(c, b.x, b.y, t, b.t);
  for (const f of fx) if (f.room === room || f.room === undefined) {
    if (f.boom) { const k = 1 - f.l / 0.5, r = 34 * (0.3 + k * 0.7); A.glow(c, f.x, f.y, r * 1.6, '255,170,60', 0.7 * (1 - k)); c.fillStyle = 'rgba(255,120,40,' + (1 - k) + ')'; c.beginPath(); for (let i = 0; i < 16; i++) { const an = i / 16 * 6.283, rr = r * (i % 2 ? 0.7 : 1); c.lineTo(f.x + Math.cos(an) * rr, f.y + Math.sin(an) * rr); } c.fill(); c.fillStyle = 'rgba(255,240,170,' + (1 - k) + ')'; c.beginPath(); c.arc(f.x, f.y, r * 0.45, 0, 7); c.fill(); }
    else { c.fillStyle = A.INK; c.fillRect(f.x - 2.2, f.y - 2.2, 3.4, 3.4); c.fillStyle = f.c || '#8a6a3a'; c.fillRect(f.x - 1.7, f.y - 1.7, 2.4, 2.4); }
  }
  if (dead <= 0) drawHero(c, p.x, p.y, p.face, t, K.down('up'));
  if (dead <= 0 && beam) { const y = p.y + 5.2, bx = p.face > 0 ? p.x + 13 : p.x - 3 - beam; A.glow(c, bx + beam / 2, y, beam / 2 + 6, '120,255,110', 0.16); c.fillStyle = 'rgba(124,255,107,.55)'; c.fillRect(bx, y - 1.6, beam, 3.2); c.fillStyle = '#eaffe4'; c.fillRect(bx, y - 0.5, beam, 1); const ex = p.face > 0 ? bx + beam : bx; A.glow(c, ex, y, 6, '200,255,180', 0.8); }
  c.restore();
  // power bar
  c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(6, VH - 10, 80, 6); c.fillStyle = power < 25 ? '#ff3b5c' : '#ffd23f'; c.fillRect(7, VH - 9, 78 * power / 100, 4);
  K.text(c, 'POWER', 6, VH - 15, 4, '#ccc', 'left');
  K.text(c, 'ROOM ' + (room + 1) + '/' + rooms.length, VW - 5, VH - 7, 4.5, '#ccc', 'right');
  if (msgT > 0) K.text(c, msg, VW / 2, 30, 9, '#fff');
}
// ---------- detailed sprites (drawn at world scale, canvas is high-res) ----------
function drawHero(c, x, y, face, t, thrust) {
  const INK = A.INK; c.save(); c.translate(x + 5, y); if (face < 0) c.scale(-1, 1);
  // rotor: blurred disc plus spinning blades
  const sp = t / 25; c.fillStyle = 'rgba(220,220,230,.18)'; c.beginPath(); c.ellipse(0, -3.6, 9.5, 1.6, 0, 0, 7); c.fill();
  c.strokeStyle = '#e8e8ee'; c.lineWidth = 1; c.beginPath(); const bl = 9 * Math.cos(sp); c.moveTo(-bl, -3.6); c.lineTo(bl, -3.6); c.stroke();
  c.fillStyle = INK; c.fillRect(-1.1, -4.6, 2.2, 4); c.fillStyle = '#9a9aa6'; c.fillRect(-0.6, -4.2, 1.2, 3.4); c.fillStyle = '#e63946'; c.beginPath(); c.arc(0, -3.6, 0.9, 0, 7); c.fill();
  // backpack motor
  c.fillStyle = INK; c.fillRect(-7.2, 3.5, 4, 7.5); c.fillStyle = '#6a6a78'; c.fillRect(-6.8, 4, 3.2, 6.6); c.fillStyle = '#9a9aa8'; c.fillRect(-6.6, 4.2, 1, 6); c.fillStyle = '#3a3a44'; for (let k = 0; k < 3; k++) c.fillRect(-6.4, 5 + k * 1.8, 2.6, 0.6);
  if (thrust) { const f = 0.6 + Math.random() * 0.6; A.glow(c, -5.2, 12.5, 4, '255,160,60', 0.7); c.fillStyle = '#ffb02e'; c.beginPath(); c.moveTo(-6.6, 11); c.lineTo(-5.2, 11 + 4 * f); c.lineTo(-3.8, 11); c.fill(); }
  // boots and legs
  c.fillStyle = INK; c.fillRect(-4.3, 10.6, 3.6, 3.6); c.fillRect(0.7, 10.6, 3.6, 3.6);
  c.fillStyle = '#2a3a6a'; c.fillRect(-3.9, 10.6, 2.8, 2.2); c.fillRect(1.1, 10.6, 2.8, 2.2);
  c.fillStyle = '#4a2e1a'; c.fillRect(-4, 12.6, 3.2, 1.4); c.fillRect(1, 12.6, 3.6, 1.4);
  // red jumpsuit with belt and zipper
  c.fillStyle = INK; c.beginPath(); c.roundRect(-4.6, 5.6, 9.2, 6, 1.6); c.fill();
  const g = c.createLinearGradient(-4, 0, 4, 0); g.addColorStop(0, '#9a1d25'); g.addColorStop(0.4, '#ff5a5a'); g.addColorStop(1, '#b8232c'); c.fillStyle = g; c.beginPath(); c.roundRect(-4.1, 6, 8.2, 5.2, 1.3); c.fill();
  c.fillStyle = '#3a2410'; c.fillRect(-4.1, 9, 8.2, 1.1); c.fillStyle = '#ffd23f'; c.fillRect(-0.7, 8.9, 1.4, 1.3);
  c.fillStyle = 'rgba(255,255,255,.4)'; c.fillRect(0.2, 6.3, 0.4, 2.5);
  c.fillStyle = '#ffd23f'; c.fillRect(-3.9, 6.6, 1.2, 0.6); c.fillRect(2.7, 6.6, 1.2, 0.6);
  // arm holding the laser pistol
  c.fillStyle = INK; c.fillRect(2.4, 6.6, 3.4, 2.4); c.fillStyle = '#d83a3a'; c.fillRect(2.7, 6.9, 2.8, 1.8);
  c.fillStyle = INK; c.fillRect(5, 4.2, 4.2, 3.2); c.fillStyle = '#4a4a56'; c.fillRect(5.3, 4.5, 3.6, 2); c.fillStyle = '#7cff6b'; c.fillRect(8.3, 4.8, 0.7, 1.2); c.fillStyle = '#ffcf9e'; c.fillRect(5.2, 6.4, 1.6, 1.4);
  // head with goggles
  c.fillStyle = INK; c.beginPath(); c.arc(0, 2.6, 3.9, 0, 7); c.fill();
  const fg = c.createRadialGradient(-1, 1.6, 0.4, 0, 2.6, 3.6); fg.addColorStop(0, '#ffe2c0'); fg.addColorStop(1, '#d89a68'); c.fillStyle = fg; c.beginPath(); c.arc(0, 2.6, 3.4, 0, 7); c.fill();
  c.fillStyle = '#5a3a1a'; c.fillRect(-3.3, 2.1, 6.6, 1); c.fillStyle = INK; c.beginPath(); c.arc(1.5, 2.6, 1.35, 0, 7); c.fill(); c.fillStyle = '#7ac8ff'; c.beginPath(); c.arc(1.5, 2.6, 0.95, 0, 7); c.fill(); c.fillStyle = '#fff'; c.fillRect(1, 2, 0.5, 0.5);
  c.fillStyle = '#b8603a'; c.fillRect(1.2, 4.4, 1.6, 0.5);
  // mining helmet with lamp
  c.fillStyle = INK; c.beginPath(); c.arc(0, 1.6, 4.1, Math.PI, 0); c.fill(); c.fillRect(-4.6, 1.2, 9.2, 1.5);
  const hg = c.createLinearGradient(0, -2.4, 0, 1.6); hg.addColorStop(0, '#fff09a'); hg.addColorStop(1, '#d8a020'); c.fillStyle = hg; c.beginPath(); c.arc(0, 1.5, 3.6, Math.PI, 0); c.fill(); c.fillRect(-4.2, 1.4, 8.4, 0.9);
  c.fillStyle = '#c8c8d0'; c.fillRect(2.2, -1.3, 1.8, 1.8); c.fillStyle = '#fffbe0'; c.fillRect(3.1, -1, 0.8, 1.2);
  c.restore();
  // helmet lamp beam lights up the tunnel ahead
  const lx = x + 5 + face * 4, ly = y - 0.3; const lg = c.createRadialGradient(lx, ly, 1, lx + face * 18, ly + 4, 26); lg.addColorStop(0, 'rgba(255,240,180,.28)'); lg.addColorStop(1, 'rgba(255,240,180,0)');
  c.save(); c.globalCompositeOperation = 'lighter'; c.fillStyle = lg; c.beginPath(); c.moveTo(lx, ly); c.lineTo(lx + face * 40, ly - 10); c.lineTo(lx + face * 40, ly + 18); c.closePath(); c.fill(); c.restore();
}
function drawMiner(c, x, y, t) {
