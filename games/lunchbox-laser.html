<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lunchbox Laser</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script>
// Lunchbox Laser: waves of runaway snacks, each wave flies its own pattern. Clear them before your energy runs out.
K.theme({ bg: '#1a0f2e', ink: '#fff4f8', accent: '#ff5fa2', accentInk: '#2a0016' });
const W = 240, H = 360, PY = 334;
K.screen(W, H);
K.hud(['score', 'wave', 'lives']);
K.pad({ dpad: 'lr', buttons: [{ id: 'a', label: 'FIRE' }] });

const SNACKS = [
  { n: 'Burgers', pat: 'drift' }, { n: 'Cookies', pat: 'bounce' }, { n: 'Fries', pat: 'zig' }, { n: 'Donuts', pat: 'swirl' },
  { n: 'Soda Cans', pat: 'drop' }, { n: 'Hot Dogs', pat: 'rows' }, { n: 'Pizza', pat: 'dive' }, { n: 'Cones', pat: 'wave' }
];
let state = 'title', score, lives, wave, kind, enemies, shots, crumbs, parts, px, energy, t, dead, fireT, nextLife, banner, best = K.best('lunchbox');
const stars = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.2 + 0.3 }));

function title() { K.card({ title: 'LUNCHBOX LASER', text: 'The snacks escaped! Each wave flies a new pattern. Blast them all before your energy bar runs out. Watch for falling crumbs.', best: best ? 'BEST ' + best : '', button: 'Play', onStart: start }); }
function start() { score = 0; lives = 3; wave = 0; nextLife = 10000; px = W / 2; parts = []; newWave(); state = 'play'; hud(); }
function hud() { K.set('score', score); K.set('wave', 'WAVE ' + (wave + 1)); K.set('lives', '▲'.repeat(Math.max(0, lives))); }
function newWave() {
  kind = SNACKS[wave % 8]; enemies = []; shots = []; crumbs = []; t = 0; energy = 100; dead = 0; fireT = 0; banner = 2;
  for (let r = 0; r < 3; r++) for (let i = 0; i < 6; i++) {
    const idx = r * 6 + i;
    enemies.push({ idx, r, bx: 20 + i * 38 + (r % 2) * 18, by: 40 + r * 34, x: 0, y: 0, vx: (Math.random() < .5 ? -1 : 1) * K.rnd(40, 70), vy: K.rnd(30, 55), dive: 0, alive: true });
  }
  for (const e of enemies) { e.x = e.bx; e.y = e.by; }
  K.tune([392, 523, 659, 784], 0.09, { type: 'triangle' });
}
const speedK = () => 1 + Math.floor(wave / 8) * 0.35;

function move(e, dt) {
  const s = speedK(), tt = t * s;
  switch (kind.pat) {
    case 'drift': e.x = ((e.bx + tt * 34) % (W + 30)) - 15; e.y = e.by; break;
    case 'bounce': e.x += e.vx * dt * s; e.y += e.vy * dt * s; if (e.x < 8 || e.x > W - 8) e.vx = -e.vx; if (e.y < 24 || e.y > 230) e.vy = -e.vy; e.x = K.clamp(e.x, 8, W - 8); e.y = K.clamp(e.y, 24, 230); break;
    case 'zig': e.x = e.bx + Math.sin(tt * 2.4 + e.idx) * 26; e.y = ((e.by + tt * 22) % 280) + 20; break;
    case 'swirl': { const a = tt * 1.1 + e.idx * 0.35; e.x = W / 2 + Math.cos(a) * (60 + e.r * 18); e.y = 120 + Math.sin(a * 1.3) * (50 + e.r * 10); break; }
    case 'drop':
      if (e.dive) { e.y += 150 * dt * s; if (e.y > H + 10) { e.y = -10; e.dive = 0; } }
      else { e.x = ((e.bx + tt * 26) % (W + 30)) - 15; if (e.y < e.by) e.y = Math.min(e.by, e.y + 80 * dt); if (Math.abs(e.x - px) < 6 && Math.random() < 0.05 * s) e.dive = 1; }
      break;
    case 'rows': { const dir = e.r % 2 ? -1 : 1; e.x = (((e.bx + dir * tt * 44) % (W + 30)) + W + 30) % (W + 30) - 15; e.y = e.by + ((tt * 6) % 120); break; }
    case 'dive':
      if (e.dive) { e.y += 120 * dt * s; e.x += (px - e.x) * dt * 1.2; if (e.y > H + 10) { e.y = -10; e.dive = 0; } }
      else { e.x = ((e.bx + tt * 30) % (W + 30)) - 15; e.y += (e.by - e.y) * dt * 2; if (Math.random() < 0.004 * s) e.dive = 1; }
      break;
    case 'wave': e.x = ((e.bx + tt * 40) % (W + 30)) - 15; e.y = e.by + Math.sin(e.x / 26 + e.r) * 22 + 10; break;
  }
}

function update(dt) {
  if (state !== 'play') return;
  for (const s of stars) { s.y += s.s * 20 * dt; if (s.y > H) s.y = 0; }
  stepParts(dt);
  if (dead > 0) { dead -= dt; if (dead <= 0) { if (lives <= 0) return over(); energy = 100; crumbs = []; for (const e of enemies) { e.dive = 0; if (e.y > 260) e.y = e.by; } } return; }
  if (banner > 0) banner -= dt;
  t += dt;
  px += ((K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0)) * 120 * dt;
  if (K.ptr.down && K.ptr.y > 200) px += K.clamp(K.ptr.x - px, -120 * dt, 120 * dt);
  px = K.clamp(px, 10, W - 10);
  energy -= dt * (100 / (36 - Math.min(14, wave)));
  if (energy <= 0) return die();
  fireT -= dt;
  if ((K.down('a') || (K.ptr.down && K.ptr.y > 200)) && fireT <= 0 && shots.length < 2) { shots.push({ x: px, y: PY - 10 }); fireT = 0.16; K.beep(1400, 0.07, { to: 500, vol: 0.035 }); }
  for (const s of shots) { s.y -= 300 * dt; }
  shots = shots.filter(s => s.y > -10);
  const live = enemies.filter(e => e.alive);
  for (const e of live) {
    move(e, dt);
    if (Math.random() < dt * (0.12 + wave * 0.02) && e.y < 260 && crumbs.length < 4 + wave) crumbs.push({ x: e.x, y: e.y + 6, v: 80 + wave * 4 });
    for (const s of shots) if (!s.dead && Math.abs(s.x - e.x) < 9 && Math.abs(s.y - e.y) < 8) {
      s.dead = true; e.alive = false; score += 20 + (wave % 8) * 10 + Math.floor(wave / 8) * 50; pop(e.x, e.y, colorOf()); K.beep(300, 0.1, { type: 'triangle', to: 120, vol: 0.06 });
      if (score >= nextLife) { lives++; nextLife += 10000; K.tune([660, 880, 1100], 0.08); }
      hud();
    }
    if (Math.abs(e.x - px) < 11 && Math.abs(e.y - PY) < 10) { e.alive = false; return die(); }
  }
  shots = shots.filter(s => !s.dead);
  for (const c of crumbs) { c.y += c.v * dt; if (Math.abs(c.x - px) < 7 && c.y > PY - 8 && c.y < PY + 6) { c.y = H + 20; return die(); } }
  crumbs = crumbs.filter(c => c.y < H + 5);
  if (!enemies.some(e => e.alive)) {
    const bonus = Math.floor(energy) * 10; score += bonus; hud();
    parts.push({ txt: 'ENERGY BONUS ' + bonus, x: W / 2, y: 180, l: 2, vy: -10 });
    wave++; hud(); newWave();
  }
}
function die() { lives--; hud(); dead = 1.6; pop(px, PY, '#ffd23f', 30); K.noise(0.5, 0.3); }
function over() { state = 'over'; best = K.saveBest('lunchbox', score); K.card({ title: 'LUNCH OVER', text: 'You reached wave ' + (wave + 1) + ' with ' + score + ' points.', best: 'BEST ' + best, button: 'Play again', onStart: start }); }
function pop(x, y, col, n) { for (let i = 0; i < (n || 12); i++) parts.push({ x, y, vx: K.rnd(-80, 80), vy: K.rnd(-80, 80), l: K.rnd(0.3, 0.7), c: col }); }
function stepParts(dt) { for (const p of parts) { p.x += (p.vx || 0) * dt; p.y += p.vy * dt; p.l -= dt; } parts = parts.filter(p => p.l > 0); }
function colorOf() { return ['#c8792c', '#d9a35b', '#ffd23f', '#ff8fc7', '#e63946', '#e8743b', '#ffb02e', '#fff0d6'][wave % 8]; }

function drawSnack(c, x, y, k, tt) {
  x = Math.round(x); y = Math.round(y); A.glow(c, x, y, 13, '255,220,150', 0.12);
  switch (k) {
    case 0: c.fillStyle = '#e0a14a'; c.fillRect(x - 8, y - 6, 16, 4); c.fillStyle = '#3fa34d'; c.fillRect(x - 8, y - 2, 16, 2); c.fillStyle = '#6b3a1e'; c.fillRect(x - 8, y, 16, 3); c.fillStyle = '#e0a14a'; c.fillRect(x - 7, y + 3, 14, 3); break;
    case 1: c.fillStyle = '#d9a35b'; c.beginPath(); c.arc(x, y, 7, 0, 7); c.fill(); c.fillStyle = '#4a2810'; [[-3, -2], [2, -3], [0, 2], [3, 2], [-3, 3]].forEach(p => c.fillRect(x + p[0], y + p[1], 2, 2)); break;
    case 2: c.fillStyle = '#e63946'; c.fillRect(x - 6, y - 1, 12, 8); c.fillStyle = '#ffd23f'; for (let i = 0; i < 5; i++) c.fillRect(x - 5 + i * 2.4, y - 8 + (i % 2) * 2, 2, 8); break;
    case 3: c.fillStyle = '#d9a35b'; c.beginPath(); c.arc(x, y, 8, 0, 7); c.fill(); c.fillStyle = '#ff8fc7'; c.beginPath(); c.arc(x, y - 1, 7, 0, 7); c.fill(); c.fillStyle = '#1a0f2e'; c.beginPath(); c.arc(x, y, 3, 0, 7); c.fill(); c.fillStyle = '#fff'; c.fillRect(x - 4, y - 5, 2, 1); c.fillRect(x + 3, y - 3, 1, 2); break;
    case 4: c.fillStyle = '#e63946'; c.fillRect(x - 5, y - 8, 10, 16); c.fillStyle = '#ddd'; c.fillRect(x - 5, y - 8, 10, 2); c.fillStyle = '#fff'; c.fillRect(x - 3, y - 2, 6, 3); break;
    case 5: c.fillStyle = '#e8b56a'; c.fillRect(x - 9, y - 4, 18, 8); c.fillStyle = '#b5482b'; c.fillRect(x - 10, y - 2, 20, 4); c.fillStyle = '#ffd23f'; for (let i = -7; i < 8; i += 4) c.fillRect(x + i, y - 3 + ((i + 7) / 4 % 2), 2, 1); break;
    case 6: c.fillStyle = '#ffd23f'; c.beginPath(); c.moveTo(x - 8, y - 7); c.lineTo(x + 8, y - 7); c.lineTo(x, y + 9); c.fill(); c.fillStyle = '#c8792c'; c.fillRect(x - 8, y - 8, 16, 3); c.fillStyle = '#e63946'; c.fillRect(x - 3, y - 4, 3, 3); c.fillRect(x + 2, y - 1, 3, 3); break;
    case 7: c.fillStyle = '#d9a35b'; c.beginPath(); c.moveTo(x - 5, y); c.lineTo(x + 5, y); c.lineTo(x, y + 10); c.fill(); c.fillStyle = ['#ff8fc7', '#fff0d6', '#7ee0b0'][((Math.floor(x / 40) % 3) + 3) % 3]; c.beginPath(); c.arc(x, y - 3, 6, 0, 7); c.fill(); break;
  }
}
function paintBackground(c) {
  const bgG = c.createLinearGradient(0, 0, 0, H); bgG.addColorStop(0, '#120a28'); bgG.addColorStop(0.55, '#2a1440'); bgG.addColorStop(1, '#3a1a3a'); c.fillStyle = bgG; c.fillRect(0, 0, W, H);
  A.glow(c, 60, 80, 90, '255,90,170', 0.18); A.glow(c, 190, 150, 100, '90,140,255', 0.16);
  const HZ = 250; c.save(); c.beginPath(); c.rect(0, HZ, W, H - HZ); c.clip();
  const fg = c.createLinearGradient(0, HZ, 0, H); fg.addColorStop(0, '#2a1a3a'); fg.addColorStop(1, '#4a2a4a'); c.fillStyle = fg; c.fillRect(0, HZ, W, H - HZ);
  for (let r = 0; r < 8; r++) { const y0 = HZ + Math.pow(r / 8, 1.8) * (H - HZ), y1 = HZ + Math.pow((r + 1) / 8, 1.8) * (H - HZ);
    for (let k = -8; k < 8; k++) { if ((k + r) % 2) continue; const sx = (v, y) => W / 2 + v * (24 + (y - HZ) * 1.6);
      c.fillStyle = 'rgba(255,240,220,.08)'; c.beginPath(); c.moveTo(sx(k, y0), y0); c.lineTo(sx(k + 1, y0), y0); c.lineTo(sx(k + 1, y1), y1); c.lineTo(sx(k, y1), y1); c.fill(); } }
  c.restore(); c.fillStyle = 'rgba(255,140,200,.35)'; c.fillRect(0, HZ, W, 1);
}
function draw(c, now) {
  // cafeteria at night: checkered floor in perspective, lit windows, nebula glow
  background(c);
  for (const s of stars) { c.fillStyle = 'rgba(255,255,255,' + (0.3 + s.s * 0.4) * (0.7 + 0.3 * Math.sin(now / 400 + s.x)) + ')'; c.fillRect(s.x, s.y, s.s > 0.7 ? 1.5 : 1, s.s > 0.7 ? 1.5 : 1); }
  if (state === 'title') { for (let k = 0; k < 8; k++) drawSnack(c, 30 + (k % 4) * 60, 110 + Math.floor(k / 4) * 50 + Math.sin(now / 400 + k) * 6, k); return; }
  for (const e of enemies) if (e.alive) drawSnack(c, e.x, e.y, wave % 8, now);
  for (const s of shots) { A.glow(c, s.x, s.y - 4, 9, '255,95,162', 0.5); c.fillStyle = '#ff5fa2'; c.fillRect(s.x - 1.5, s.y - 9, 3, 11); c.fillStyle = '#fff'; c.fillRect(s.x - 0.5, s.y - 8, 1, 9); }
  for (const cr of crumbs) { c.fillStyle = A.INK; c.fillRect(cr.x - 2.2, cr.y - 2.2, 4.4, 4.4); c.fillStyle = '#e8c890'; c.fillRect(cr.x - 1.6, cr.y - 1.6, 3.2, 3.2); c.fillStyle = '#fff4dc'; c.fillRect(cr.x - 1.6, cr.y - 1.6, 1.4, 1.2); }
  if (dead <= 0 && state === 'play') { const x = Math.round(px);
    // lunchbox cannon
    A.glow(c, x, PY + 14, 18, '120,220,255', 0.25);
    A.part(c, x - 13, PY + 1, 26, 12, '#3a9adf'); c.fillStyle = '#7ee0ff'; c.fillRect(x - 13, PY + 1, 26, 3); c.fillStyle = '#ffd23f'; c.fillRect(x - 3, PY + 5, 6, 3); c.fillStyle = A.INK; c.fillRect(x - 13, PY + 7, 26, 0.8);
    c.strokeStyle = A.INK; c.lineWidth = 3; c.beginPath(); c.arc(x, PY + 1, 6, Math.PI, 0); c.stroke(); c.strokeStyle = '#d0d8e8'; c.lineWidth = 1.6; c.stroke();
    A.part(c, x - 2.5, PY - 11, 5, 10, '#e8eef8'); c.fillStyle = '#ff5fa2'; c.fillRect(x - 2.5, PY - 11, 5, 2);
    c.fillStyle = '#ff5fa2'; c.fillRect(x - 10, PY + 13, 5, 2.5); c.fillRect(x + 5, PY + 13, 5, 2.5); c.fillStyle = 'rgba(255,200,240,' + (0.5 + 0.5 * Math.sin(now / 60)) + ')'; c.fillRect(x - 9, PY + 15.5, 3, 2); c.fillRect(x + 6, PY + 15.5, 3, 2); }
  for (const p of parts) { c.globalAlpha = Math.min(1, p.l * 2); if (p.txt) K.text(c, p.txt, p.x, p.y, 10, '#ffd23f'); else { c.fillStyle = p.c; c.fillRect(p.x - 2, p.y - 2, 4, 4); } } c.globalAlpha = 1;
  // energy bar
  c.fillStyle = 'rgba(255,255,255,.12)'; c.fillRect(20, H - 10, W - 40, 5);
  c.fillStyle = energy < 25 ? '#e63946' : '#7ee0b0'; c.fillRect(20, H - 10, (W - 40) * Math.max(0, energy) / 100, 5);
  if (banner > 0) K.text(c, kind.n.toUpperCase() + '!', W / 2, 160, 18, '#ffd23f');
  if (dead > 0 && lives > 0) K.text(c, 'GET READY', W / 2, 200, 14, '#fff');
}
drawSnack = A.ink(drawSnack);
// Speed fix: the inked outline and glow are slow to draw, so each snack is drawn once into a
// small picture and that picture is reused every frame.
{ const _sn = drawSnack, cache = {}, R = 4, SZ = 48;
  const sprite = k => { if (cache[k]) return cache[k]; const cv = document.createElement('canvas'); cv.width = cv.height = SZ * R; const g = cv.getContext('2d');
    g.scale(R, R); g.translate(SZ / 2, SZ / 2); g.scale(1.25, 1.25); _sn(g, 0, 0, k, 0); return (cache[k] = cv); };
  drawSnack = function (c, x, y, k) { c.drawImage(sprite(k), Math.round(x) - SZ / 2, Math.round(y) - SZ / 2, SZ, SZ); }; }
// the cafeteria background never changes, so draw it once too
let bgPic = null;
function background(c) {
  if (!bgPic) { const R = 3; bgPic = document.createElement('canvas'); bgPic.width = W * R; bgPic.height = H * R; const g = bgPic.getContext('2d'); g.scale(R, R); paintBackground(g); }
  c.drawImage(bgPic, 0, 0, W, H);
}
title();
{ const _draw = draw; draw = function (c, t) { _draw(c, t); A.vignette(c, W, H, 0.4); }; }
K.run(update, draw);
</script>
</body>
</html>
