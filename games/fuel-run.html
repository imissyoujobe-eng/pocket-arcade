<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fuel Run</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script>
// Fuel Run: fly up the river, blast boats, choppers and bridges, and fly over fuel depots to refuel.
K.theme({ bg: '#0c1f14', ink: '#effff2', accent: '#ffd23f', accentInk: '#2a1d00' });
const W = 240, H = 360, PY = 300, ROW = 8, SEC = 110;
const c = K.screen(W, H);
K.hud(['score', 'lives']);
K.pad({ dpad: '4', buttons: [{ id: 'a', label: 'FIRE' }] });

function hash(i) { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
// River shape for row i, worked out from i alone so a respawn rebuilds the same river.
function geo(i) {
  let cx = 120 + 30 * Math.sin(i * 0.021) + 18 * Math.sin(i * 0.057 + 1);
  let hw = 62 + 30 * Math.sin(i * 0.017 + 2) + 14 * Math.sin(i * 0.049);
  const s = ((i % SEC) + SEC) % SEC, d = Math.min(s, SEC - s);
  if (i < 40) { const t = Math.max(0, (i - 16) / 24); cx = 120 + (cx - 120) * t; hw = 70 + (hw - 70) * t; }
  else if (d < 12) { const t = 1 - d / 12; hw = hw + (30 - hw) * t; cx = cx + (120 - cx) * t; }
  hw = Math.max(32, hw);
  const g = { l: Math.max(8, cx - hw), r: Math.min(232, cx + hw), il: 0, ir: 0, bridge: i > 0 && s === 0 };
  if (hw > 80 && d > 16 && i >= 40) { const ih = (hw - 80) * 1.5 * Math.min(1, (d - 16) / 12, (i - 40) / 12); if (ih > 3) { g.il = cx - ih; g.ir = cx + ih; } }
  return g;
}
function solidAt(x, wy) { const g = geo(Math.floor(wy / ROW)); return x < g.l || x > g.r || (g.il && x > g.il && x < g.ir); }

let state = 'title', score, lives, fuel, dist, speed, objs, shots, parts, genUpTo, checkpoint, px, dead, fireT, level, jetT, best = K.best('fuelrun');
function title() {
  K.card({ title: 'FUEL RUN', text: 'Fly up the river. Shoot boats, choppers and bridges. Fly over FUEL tanks to fill up, and never touch the riverbank.', best: best ? 'BEST ' + best : '', button: 'Take off', onStart: start });
}
function start() { score = 0; lives = 3; checkpoint = 0; respawn(); state = 'play'; hud(); }
function respawn() {
  dist = checkpoint * ROW + 16; fuel = 100; px = geo(checkpoint + 2).il ? 60 : 120; dead = 0; fireT = 0; jetT = 4;
  objs = []; shots = []; parts = []; genUpTo = Math.floor(dist / ROW) + 1; level = Math.floor(checkpoint / SEC) + 1;
}
function hud() { K.set('score', score); K.set('lives', '✈'.repeat(Math.max(0, lives))); }

function spawnRow(i) {
  const g = geo(i);
  if (g.bridge) { objs.push({ t: 'bridge', wy: i * ROW, x: g.l, w: g.r - g.l, h: 8, hp: 1, row: i }); return; }
  const s = i % SEC, d = Math.min(s, SEC - s);
  if (i < 30 || d < 14) return;
  const lv = Math.floor(i / SEC) + 1, r = hash(i * 7.13);
  if (r > 0.075 + lv * 0.012) return;
  const k = hash(i * 3.71), type = k < 0.3 ? 'fuel' : k < 0.7 ? 'ship' : 'heli';
  const w = type === 'fuel' ? 12 : type === 'ship' ? 18 : 14, h = type === 'fuel' ? 22 : type === 'ship' ? 8 : 10;
  let lo = g.l + 4, hi = g.r - 4 - w;
  if (g.il) { if (hash(i * 1.9) < 0.5) hi = g.il - 4 - w; else lo = g.ir + 4; }
  if (hi <= lo) return;
  objs.push({ t: type, wy: i * ROW, x: lo + hash(i * 5.3) * (hi - lo), w, h, vx: 0, active: false, spd: (type === 'heli' ? 42 : 28) + lv * 6 });
}
const sy = wy => PY - (wy - dist);

function update(dt) {
  if (state !== 'play') return;
  if (dead > 0) {
    dead -= dt; stepParts(dt);
    if (dead <= 0) { if (lives <= 0) return over(); respawn(); }
    return;
  }
  speed = K.down('up') ? 92 : K.down('down') ? 28 : 52;
  dist += speed * dt;
  const mv = 95 * dt; if (K.down('left')) px -= mv; if (K.down('right')) px += mv;
  px = K.clamp(px, 6, W - 6);
  fuel -= dt * (3.2 + level * 0.25);
  // new rows coming into view
  const top = Math.floor((dist + PY + 20) / ROW);
  while (genUpTo <= top) spawnRow(genUpTo++);
  // fire
  fireT -= dt;
  if (K.down('a') && fireT <= 0) { shots.push({ x: px, wy: dist + 10 }); fireT = 0.2; K.beep(900, 0.06, { to: 300, vol: 0.04 }); }
  for (const s of shots) s.wy += 330 * dt;
  // enemy jets crossing from later rivers on
  if (level >= 2) { jetT -= dt; if (jetT <= 0) { jetT = K.rnd(4, 8) / level * 2; const left = Math.random() < 0.5; objs.push({ t: 'jet', wy: dist + K.rnd(120, 220), x: left ? -20 : W + 4, w: 16, h: 8, vx: left ? 110 : -110 }); } }
  // objects
  for (const o of objs) {
    const y = sy(o.wy);
    if (o.t === 'ship' || o.t === 'heli') {
      if (!o.active && y > 40 && hash(o.wy * 0.37) < 0.65 + level * 0.05) { o.active = true; o.vx = (px > o.x ? 1 : -1) * o.spd; }
      if (o.active) {
        const nx = o.x + o.vx * dt;
        if (solidAt(nx, o.wy + 4) || solidAt(nx + o.w, o.wy + 4)) o.vx = -o.vx; else o.x = nx;
      }
    }
    if (o.t === 'jet') o.x += o.vx * dt;
  }
  // shots vs things
  for (const s of shots) {
    if (s.dead) continue;
    if (solidAt(s.x, s.wy) && !geo(Math.floor(s.wy / ROW)).bridge) { s.dead = true; continue; }
    if (sy(s.wy) < -10) { s.dead = true; continue; }
    for (const o of objs) {
      if (o.dead) continue;
      if (s.x > o.x - 2 && s.x < o.x + o.w + 2 && s.wy > o.wy - 2 && s.wy < o.wy + o.h + 4) {
        s.dead = true; o.dead = true;
        const pts = { ship: 30, heli: 60, fuel: 80, jet: 100, bridge: 500 }[o.t];
        score += pts; hud(); boom(o.x + o.w / 2, sy(o.wy) - o.h / 2, o.t === 'bridge' ? 40 : 16);
        if (o.t === 'bridge') { checkpoint = o.row; level = Math.floor(o.row / SEC) + 1; K.tune([523, 659, 784], 0.08); }
        break;
      }
    }
  }
  shots = shots.filter(s => !s.dead);
  // player vs world
  const hit = { x: px - 6, y: 0, w: 12, h: 12 };
  if (solidAt(px - 5, dist + 2) || solidAt(px + 5, dist + 2) || solidAt(px, dist + 12)) return crash();
  refuel = false;
  for (const o of objs) {
    if (o.dead) continue;
    const r = { x: o.x, w: o.w, y: o.wy, h: o.h };
    if (px + 6 > r.x && px - 6 < r.x + r.w && dist + 12 > r.y && dist < r.y + r.h) {
      if (o.t === 'fuel') { refuel = true; continue; }
      o.dead = true; boom(o.x + o.w / 2, sy(o.wy), 14); return crash();
    }
  }
  if (refuel) { fuel = Math.min(100, fuel + 34 * dt); if (Math.random() < 0.2) K.beep(1200 + fuel * 6, 0.04, { vol: 0.03 }); }
  if (fuel <= 0) return crash();
  if (fuel < 25 && Math.floor(performance.now() / 300) % 2 && Math.random() < 0.1) K.beep(220, 0.08, { vol: 0.04 });
  objs = objs.filter(o => !o.dead && sy(o.wy) < H + 40 && o.x > -40 && o.x < W + 40);
  stepParts(dt);
}
let refuel = false;
function stepParts(dt) { for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.l -= dt; } parts = parts.filter(p => p.l > 0); }
function boom(x, y, n) { K.noise(0.35, 0.25); for (let i = 0; i < n; i++) parts.push({ x, y, vx: K.rnd(-90, 90), vy: K.rnd(-90, 90), l: K.rnd(0.3, 0.8), c: Math.random() < 0.5 ? '#ffb02e' : '#ff5a36' }); }
function crash() { boom(px, PY + 6, 30); lives--; hud(); dead = 1.4; K.beep(160, 0.6, { type: 'sawtooth', to: 40, vol: 0.08 }); }
function over() { state = 'over'; best = K.saveBest('fuelrun', score); K.card({ title: 'SPLASHDOWN', text: 'You scored ' + score + ' and made it to river ' + level + '.', best: 'BEST ' + best, button: 'Fly again', onStart: start }); }

const GRASS = { base: '#5aa83e', hi: '#7cc85a', lo: '#3e8a2c' }, SAND = '#e8d29a', SAND2 = '#c8b07a';
function riverPath(c, first, last, d, side, pad) { // side: 'river' builds the whole channel outline
  c.beginPath();
  for (let i = first; i <= last; i++) { const g = geo(i), y = PY - (i * ROW + ROW / 2 - d); if (i === first) c.moveTo(g.l - pad, y); else c.lineTo(g.l - pad, y); }
  for (let i = last; i >= first; i--) { const g = geo(i), y = PY - (i * ROW + ROW / 2 - d); c.lineTo(g.r + pad, y); }
  c.closePath();
}
function islands(c, first, last, d, pad, fill) {
  let run = null; const flush = () => { if (!run || run.length < 2) { run = null; return; } c.beginPath(); run.forEach((p, k) => k ? c.lineTo(p[0] - pad, p[2]) : c.moveTo(p[0] - pad, p[2])); for (let k = run.length - 1; k >= 0; k--) c.lineTo(run[k][1] + pad, run[k][2]); c.closePath(); fill(); run = null; };
  for (let i = first; i <= last + 1; i++) { const g = geo(i); if (g.il && i <= last) { (run = run || []).push([g.il, g.ir, PY - (i * ROW + ROW / 2 - d)]); } else flush(); }
}
function draw(c, t) {
  const d = dist || 0, first = Math.floor((d - (H - PY) - 16) / ROW), last = Math.floor((d + PY + 16) / ROW);
  // land: textured grass tiles that scroll with the river
  const t0 = Math.floor((d - (H - PY)) / 16) - 1, t1 = Math.floor((d + PY) / 16) + 1;
  for (let ty = t0; ty <= t1; ty++) { const y = PY - (ty * 16 + 16 - d); for (let tx = 0; tx < W / 16; tx++) A.grassTD(c, tx * 16, y, tx, ty, GRASS); }
  // farm fields and roads on the banks
  for (let i = first; i <= last; i += 1) { if (((i * 7) % 53) !== 0) continue; const g = geo(i), y = PY - (i * ROW - d); const side = (i >> 3) % 2 ? 0 : 1; const fx = side ? g.r + 14 : 6, fw = side ? W - g.r - 20 : g.l - 20; if (fw > 26) { c.fillStyle = A.INK; c.fillRect(fx - 1, y - 31, fw + 2, 32); c.fillStyle = (i % 3) ? '#c8a050' : '#8a6a3a'; c.fillRect(fx, y - 30, fw, 30); c.fillStyle = 'rgba(0,0,0,.18)'; for (let k = 3; k < 30; k += 5) c.fillRect(fx, y - 30 + k, fw, 1.5); } }
  // sandy shores, then the water channel
  c.fillStyle = SAND2; riverPath(c, first, last, d, 'river', 7); c.fill();
  c.fillStyle = SAND; riverPath(c, first, last, d, 'river', 4); c.fill();
  const wg = c.createLinearGradient(0, 0, W, 0); wg.addColorStop(0, '#2a7ad0'); wg.addColorStop(0.5, '#1e5ab0'); wg.addColorStop(1, '#2a7ad0');
  c.fillStyle = wg; riverPath(c, first, last, d, 'river', 0); c.fill();
  c.save(); riverPath(c, first, last, d, 'river', 0); c.clip();
  // ripples drifting downstream and shore foam
  for (let k = 0; k < 40; k++) { const rx = A.hash(k, 1) * W, ry = ((A.hash(k, 2) * (H + 40)) + d * 0.5 + t / 40) % (H + 40) - 20; c.fillStyle = 'rgba(255,255,255,' + (0.12 + A.hash(k, 3) * 0.18) + ')'; c.fillRect(rx, ry, 5 + A.hash(k, 4) * 8, 1); }
  c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1.5; riverPath(c, first, last, d, 'river', -1); c.stroke();
  c.restore();
  c.strokeStyle = A.INK; c.lineWidth = 1; riverPath(c, first, last, d, 'river', 7); c.stroke();
  // islands
  islands(c, first, last, d, 4, () => { c.fillStyle = SAND; c.fill(); c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 2; c.stroke(); });
  islands(c, first, last, d, 0, () => { c.fillStyle = '#4e9a36'; c.fill(); c.strokeStyle = A.INK; c.lineWidth = 1; c.stroke(); });
  // trees on the banks and islands
  for (let i = first; i <= last; i++) { const g = geo(i), y = PY - (i * ROW - d); for (let k = 0; k < 3; k++) { if (A.hash(i, k + 5) > 0.42) continue; const x = A.hash(i, k + 9) * W; const onIsle = g.il && x > g.il + 6 && x < g.ir - 6; if (!onIsle && !(x < g.l - 14 || x > g.r + 14)) continue; if (A.hash(i, k + 13) < 0.15 && !onIsle) house(c, x - 9, y - 9, i); else A.treeTD(c, x - 8, y - 8, i, k); } }
  // bridges: a road crosses the whole map
  for (let i = first; i <= last; i++) { const g = geo(i); if (!g.bridge) continue; const y = PY - (i * ROW + ROW - d);
    c.fillStyle = A.INK; c.fillRect(0, y - 3, W, 14); c.fillStyle = '#5a5e66'; c.fillRect(0, y - 2, W, 12); c.fillStyle = '#f4e04a'; for (let x = 0; x < W; x += 16) c.fillRect(x, y + 3.5, 8, 1.5); }
  if (objs) for (const o of objs) drawObj(c, o, sy(o.wy), t);
  if (shots) for (const s of shots) { const y = sy(s.wy); A.glow(c, s.x, y - 3, 6, '255,240,120', 0.5); c.fillStyle = '#fffbd0'; c.fillRect(s.x - 1, y - 7, 2, 7); }
  if (state === 'play' && dead <= 0) drawJet(c, px, PY - 13, t);
  if (parts) for (const p of parts) { c.globalAlpha = Math.min(1, p.l * 2); c.fillStyle = p.c; c.beginPath(); c.arc(p.x, p.y, 2.5, 0, 7); c.fill(); } c.globalAlpha = 1;
  A.vignette(c, W, H, 0.3);
  // fuel gauge
  if (state === 'play') {
    c.fillStyle = A.INK; c.fillRect(58, H - 24, 124, 20); c.fillStyle = '#2a2a34'; c.fillRect(60, H - 22, 120, 16);
    const fg = c.createLinearGradient(0, H - 20, 0, H - 8); fg.addColorStop(0, fuel < 25 ? '#ff8a8a' : '#fff08a'); fg.addColorStop(1, fuel < 25 ? '#c02a3a' : '#e0a020'); c.fillStyle = fg; c.fillRect(62, H - 20, 116 * Math.max(0, fuel) / 100, 12);
    for (let k = 1; k < 4; k++) { c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(62 + k * 29, H - 20, 1, 12); }
    K.text(c, refuel ? 'FUELING' : 'FUEL', 120, H - 14, 9, '#111');
    if (dead > 0 && lives > 0) K.text(c, 'GET READY', W / 2, H / 2, 16, '#fff');
  }
}
function house(c, x, y, i) { c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(x + 3, y + 3, 18, 14); const roof = ['#c84a3a', '#3a6ac0', '#8a5a3a'][i % 3]; c.fillStyle = A.INK; c.fillRect(x - 0.5, y - 0.5, 19, 15); c.fillStyle = roof; c.fillRect(x, y, 18, 7); c.fillStyle = A.shade(roof, -0.25); c.fillRect(x, y + 7, 18, 7); c.fillStyle = 'rgba(255,255,255,.25)'; c.fillRect(x, y, 18, 1.5); c.fillStyle = '#5a3a2a'; c.fillRect(x + 13, y + 1, 3, 3); }
function drawJet(c, x, y, t) {
  // shadow on the water below
  c.fillStyle = 'rgba(0,0,30,.3)'; c.beginPath(); c.moveTo(x + 6, y + 6); c.lineTo(x - 2, y + 18); c.lineTo(x + 14, y + 18); c.fill();
  const fl = 3 + ((t / 50) | 0) % 2 * 2; A.glow(c, x, y + 16, 10, '255,160,60', 0.6); c.fillStyle = '#ffb02a'; c.beginPath(); c.moveTo(x - 2, y + 13); c.lineTo(x, y + 13 + fl + 2); c.lineTo(x + 2, y + 13); c.fill(); c.fillStyle = '#fff6c0'; c.fillRect(x - 0.7, y + 13, 1.4, fl);
  c.fillStyle = A.INK; c.beginPath(); c.moveTo(x, y - 1.5); c.lineTo(x + 2.8, y + 5); c.lineTo(x + 9.5, y + 9.5); c.lineTo(x + 9.5, y + 11.5); c.lineTo(x + 3, y + 10.5); c.lineTo(x + 4.5, y + 14.5); c.lineTo(x - 4.5, y + 14.5); c.lineTo(x - 3, y + 10.5); c.lineTo(x - 9.5, y + 11.5); c.lineTo(x - 9.5, y + 9.5); c.lineTo(x - 2.8, y + 5); c.closePath(); c.fill();
  const bg = c.createLinearGradient(x - 9, 0, x + 9, 0); bg.addColorStop(0, '#c8a020'); bg.addColorStop(0.45, '#ffe46a'); bg.addColorStop(1, '#b08a10'); c.fillStyle = bg;
  c.beginPath(); c.moveTo(x, y); c.lineTo(x + 2, y + 5.5); c.lineTo(x + 8.5, y + 9.8); c.lineTo(x + 8.5, y + 10.8); c.lineTo(x + 2, y + 10); c.lineTo(x + 3.5, y + 13.8); c.lineTo(x - 3.5, y + 13.8); c.lineTo(x - 2, y + 10); c.lineTo(x - 8.5, y + 10.8); c.lineTo(x - 8.5, y + 9.8); c.lineTo(x - 2, y + 5.5); c.closePath(); c.fill();
  c.fillStyle = '#4ac8ff'; c.beginPath(); c.ellipse(x, y + 4.5, 1.2, 2.4, 0, 0, 7); c.fill(); c.fillStyle = 'rgba(255,255,255,.8)'; c.fillRect(x - 0.4, y + 3, 0.8, 1.2);
  c.fillStyle = '#e63946'; c.fillRect(x - 8.5, y + 9.8, 1.5, 1); c.fillRect(x + 7, y + 9.8, 1.5, 1);
}
function drawObj(c, o, y, t) {
  const x = o.x;
  if (o.t === 'bridge') { c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(x, y + 2, o.w, 4); c.fillStyle = A.INK; c.fillRect(x - 1, y - 11, o.w + 2, 14); c.fillStyle = '#9a7040'; c.fillRect(x, y - 10, o.w, 12); c.fillStyle = '#c99a57'; for (let k = x; k < x + o.w; k += 6) c.fillRect(k, y - 10, 4, 12); c.fillStyle = '#5a5e66'; c.fillRect(x, y - 7, o.w, 6); c.fillStyle = '#f4e04a'; for (let k = x + 2; k < x + o.w; k += 12) c.fillRect(k, y - 4.5, 6, 1); c.fillStyle = '#6a4a22'; c.fillRect(x, y - 10, o.w, 1.5); c.fillRect(x, y + 0.5, o.w, 1.5); return; }
  if (o.t === 'ship') { const dir = o.vx < 0 ? -1 : 1; c.fillStyle = 'rgba(255,255,255,.5)'; for (let k = 1; k < 4; k++) c.fillRect(x + (dir > 0 ? -k * 4 : o.w + k * 3), y - 4 - k * 0.5 + Math.sin(t / 200 + k), 3, 1);
    c.fillStyle = A.INK; c.beginPath(); c.moveTo(x - 1, y - 7.5); c.lineTo(x + o.w + 1, y - 7.5); c.lineTo(x + o.w - 2, y + 0.5); c.lineTo(x + 2, y + 0.5); c.fill(); c.fillStyle = '#3a3a48'; c.beginPath(); c.moveTo(x, y - 7); c.lineTo(x + o.w, y - 7); c.lineTo(x + o.w - 3, y); c.lineTo(x + 3, y); c.fill(); c.fillStyle = '#c8303a'; c.fillRect(x + 2, y - 2, o.w - 4, 1.5);
    A.part(c, x + 5, y - 11, 8, 4, '#e8e8f0'); c.fillStyle = '#4ac8ff'; c.fillRect(x + 6, y - 10, 2, 1.5); c.fillRect(x + 10, y - 10, 2, 1.5); return; }
  if (o.t === 'heli') { const r = (t / 30) % 6.28; c.fillStyle = 'rgba(0,0,30,.25)'; c.beginPath(); c.ellipse(x + 10, y + 4, 7, 3, 0, 0, 7); c.fill();
    A.part(c, x + 2, y - 8, 10, 7, '#3a6a3a'); A.part(c, x + (o.vx < 0 ? 11 : -6), y - 6, 7, 2, '#2e5a2e'); c.fillStyle = '#9ad8ff'; c.fillRect(x + (o.vx < 0 ? 2 : 8), y - 7, 3, 4);
    c.strokeStyle = 'rgba(220,220,220,.75)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(x + 7 - Math.cos(r) * 9, y - 5 - Math.sin(r) * 3); c.lineTo(x + 7 + Math.cos(r) * 9, y - 5 + Math.sin(r) * 3); c.stroke(); c.fillStyle = 'rgba(220,220,220,.2)'; c.beginPath(); c.ellipse(x + 7, y - 5, 9, 3, 0, 0, 7); c.fill(); return; }
  if (o.t === 'fuel') { c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(x + 2, y - o.h + 2, o.w, o.h); A.part(c, x, y - o.h, o.w, o.h, '#f4f4f8'); c.fillStyle = '#e63946'; for (let k = 0; k < 4; k++) c.fillRect(x + 1, y - o.h + 2 + k * 5, o.w - 2, 2); c.save(); c.translate(x + o.w / 2, y - o.h / 2); c.rotate(-Math.PI / 2); K.text(c, 'FUEL', 0, 0, 6, '#fff'); c.restore(); A.glow(c, x + o.w / 2, y - o.h / 2, 16, '255,240,150', 0.15); return; }
  if (o.t === 'jet') { const f = o.vx > 0 ? 1 : -1; c.fillStyle = 'rgba(0,0,30,.25)'; c.fillRect(x + 4, y + 2, 14, 3); A.part(c, x, y - 5, 16, 3, '#b0b8c8'); A.part(c, x + (f > 0 ? 4 : 8), y - 9, 4, 11, '#c8d0e0'); c.fillStyle = '#e63946'; c.fillRect(x + (f > 0 ? 14 : 0), y - 4.5, 2, 2); }
}
title();
K.run(update, draw);
</script>
</body>
</html>
