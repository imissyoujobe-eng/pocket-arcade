<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brick Pigs</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script>
// Brick Pigs: the wolf drops down and huffs bricks out of your wall. Ram him back up and carry new bricks to patch the holes.
K.theme({ bg: '#1f2a14', ink: '#fffaf0', accent: '#ff8fb0', accentInk: '#3a0016' });
const W = 240, H = 340, COLS = 8, ROWS = 4, BW = 28, BH = 12, WX = 8, WY = 272, PILE = { x: 20, y: 96 };
K.screen(W, H);
K.hud(['score', 'level', 'pigs']);
K.pad({ dpad: '4', buttons: [{ id: 'a', label: 'DASH' }] });

let state = 'title', wall, pig, wolf, pigs, score, level, time, parts, best = K.best('brickpigs'), msg, msgT;
function title() { K.card({ title: 'BRICK PIGS', text: 'The wolf drops down and huffs bricks out of your wall. Run into him to knock him back up! Grab a brick from the pile in the corner and carry it to a gap to patch it. If he blows a hole all the way through, you lose a pig.', best: best ? 'BEST ' + best : '', button: 'Build', onStart: start }); }
function start() { pigs = 3; score = 0; level = 1; time = 0; parts = []; reset(); state = 'play'; hud(); }
function reset() {
  wall = Array.from({ length: COLS }, () => ROWS);
  pig = { x: W / 2, y: 220, carry: false, dash: 0, face: 1 };
  wolf = { x: W / 2, y: 50, col: 3, st: 'walk', t: 1.5, blow: 0 };
}
function hud() { K.set('score', score); K.set('level', 'LEVEL ' + level); K.set('pigs', '🐷'.repeat(Math.max(0, pigs))); }
const colX = i => WX + i * BW + BW / 2;
const wallTop = i => WY + (ROWS - wall[i]) * BH;

function update(dt) {
  if (state !== 'play') return;
  time += dt; if (msgT > 0) msgT -= dt;
  if (time > level * 45) { level++; hud(); msg = 'LEVEL ' + level; msgT = 1.5; K.tune([523, 659, 784], 0.08); }
  // pig
  let ax = (K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0), ay = (K.down('down') ? 1 : 0) - (K.down('up') ? 1 : 0);
  if (K.ptr.down) { const dx = K.ptr.x - pig.x, dy = K.ptr.y - pig.y, d = Math.hypot(dx, dy); if (d > 4) { ax = dx / d; ay = dy / d; } }
  if (K.hit('a') && pig.dash <= 0) { pig.dash = 0.35; K.beep(300, 0.1, { to: 600, vol: 0.05 }); }
  if (pig.dash > 0) pig.dash -= dt;
  const sp = (pig.carry ? 70 : 95) * (pig.dash > 0 ? 2.2 : 1);
  if (ax) pig.face = Math.sign(ax);
  pig.x = K.clamp(pig.x + ax * sp * dt, 12, W - 12); pig.y = K.clamp(pig.y + ay * sp * dt, 90, WY - 10);
  // pick up a brick
  if (!pig.carry && Math.hypot(pig.x - PILE.x, pig.y - PILE.y) < 20) { pig.carry = true; K.beep(700, 0.06, { vol: 0.05 }); }
  // drop a brick into the column below you if it has a gap
  if (pig.carry && pig.y > WY - 30) {
    const col = K.clamp(Math.floor((pig.x - WX) / BW), 0, COLS - 1);
    if (wall[col] < ROWS && !(wolf.st === 'blow' && wolf.col === col)) { wall[col]++; pig.carry = false; score += 10; hud(); K.beep(220, 0.08, { type: 'square', vol: 0.06 }); }
  }
  // wolf
  const w = wolf, fall = 26 + level * 6;
  if (w.st === 'walk') { const tx = colX(w.col); w.x += K.clamp(tx - w.x, -60 * dt, 60 * dt); w.t -= dt; if (w.t <= 0 && Math.abs(tx - w.x) < 1) { w.st = 'drop'; } else if (Math.abs(tx - w.x) < 1 && w.t > 0 && Math.random() < dt) w.col = pickCol(); }
  else if (w.st === 'drop') { w.y += fall * dt; if (w.y >= wallTop(w.col) - 18) { w.y = wallTop(w.col) - 18; w.st = 'blow'; w.blow = 0; } }
  else if (w.st === 'blow') {
    w.blow += dt;
    if (w.blow > Math.max(0.5, 1.3 - level * 0.1)) {
      w.blow = 0; wall[w.col]--; K.noise(0.25, 0.2); for (let i = 0; i < 6; i++) parts.push({ x: colX(w.col), y: wallTop(w.col), vx: K.rnd(-60, 60), vy: K.rnd(-80, -20), l: 0.6, c: '#b5482b' });
      if (wall[w.col] <= 0) return lose();
      w.y = wallTop(w.col) - 18;
    }
  } else if (w.st === 'up') { w.y -= 160 * dt; if (w.y <= 50) { w.y = 50; w.st = 'walk'; w.col = pickCol(); w.t = K.rnd(0.6, 1.6) / (1 + level * 0.15); } }
  if (w.st !== 'up' && Math.abs(pig.x - w.x) < 16 && Math.abs(pig.y - (w.y + 6)) < 16 && pig.y > w.y - 4) {
    w.st = 'up'; score += 50 + (pig.dash > 0 ? 25 : 0); hud(); K.beep(160, 0.15, { type: 'square', to: 600, vol: 0.07 });
  }
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 250 * dt; p.l -= dt; } parts = parts.filter(p => p.l > 0);
}
function pickCol() { // prefer weak columns
  let best = K.ri(0, COLS - 1); for (let i = 0; i < COLS; i++) if (wall[i] < wall[best] && Math.random() < 0.5) best = i; return best;
}
function lose() {
  pigs--; hud(); K.tune([392, 330, 262, 196], 0.15, { type: 'sawtooth' });
  if (pigs <= 0) { state = 'over'; best = K.saveBest('brickpigs', score); setTimeout(() => K.card({ title: 'HUFFED & PUFFED', text: 'The wolf got in on level ' + level + '. You scored ' + score + '.', best: 'BEST ' + best, button: 'Rebuild', onStart: start }), 800); return; }
  msg = 'THE WOLF GOT IN!'; msgT = 1.6; reset();
}

function draw(c, t) {
  c.fillStyle = '#8fd0ff'; c.fillRect(0, 0, W, 76); c.fillStyle = '#fff'; c.beginPath(); c.arc(170, 30, 10, 0, 7); c.arc(182, 26, 12, 0, 7); c.arc(194, 31, 9, 0, 7); c.fill();
  c.fillStyle = '#6b4a2a'; c.fillRect(0, 70, W, 10); c.fillStyle = '#4e9a3a'; c.fillRect(0, 66, W, 5);
  c.fillStyle = '#6fbf4a'; c.fillRect(0, 80, W, H - 80);
  c.fillStyle = '#62ad40'; for (let y = 90; y < WY; y += 14) for (let x = (y / 14 % 2) * 10; x < W; x += 24) c.fillRect(x, y, 2, 3);
  // brick pile
  c.fillStyle = '#c8602c'; for (let i = 0; i < 6; i++) c.fillRect(PILE.x - 14 + (i % 3) * 10, PILE.y + 4 - Math.floor(i / 3) * 6, 9, 5);
  K.text(c, 'BRICKS', PILE.x + 14, PILE.y + 18, 7, '#3a2a10');
  // house
  c.fillStyle = '#f2e3c6'; c.fillRect(WX, WY + ROWS * BH, COLS * BW, H - WY - ROWS * BH);
  c.fillStyle = '#e8b3c4'; for (let i = 0; i < 5; i++) c.fillRect(WX + 20 + i * 44, WY + ROWS * BH + 6, 16, 12);
  if (!wall) return;
  for (let i = 0; i < COLS; i++) for (let r = 0; r < wall[i]; r++) { const x = WX + i * BW, y = WY + (ROWS - 1 - r) * BH; c.fillStyle = (i + r) % 2 ? '#c8602c' : '#b5502a'; c.fillRect(x + 1, y + 1, BW - 2, BH - 2); c.fillStyle = 'rgba(255,255,255,.15)'; c.fillRect(x + 1, y + 1, BW - 2, 2); }
  for (let i = 0; i < COLS; i++) if (wall[i] < ROWS) { c.fillStyle = 'rgba(255,240,120,' + (0.25 + Math.sin(t / 150) * 0.15) + ')'; c.fillRect(WX + i * BW + 2, wallTop(i) - 4, BW - 4, 2); }
  // wolf + rope
  const w = wolf;
  c.strokeStyle = '#6b4a2a'; c.lineWidth = 1; c.beginPath(); c.moveTo(w.x, 70); c.lineTo(w.x, w.y - 8); c.stroke();
  drawWolf(c, w.x, w.y, t, w.st === 'blow');
  if (w.st === 'blow') { c.strokeStyle = 'rgba(255,255,255,.7)'; for (let k = 0; k < 3; k++) { const yy = w.y + 14 + ((t / 40 + k * 4) % 10); c.beginPath(); c.moveTo(w.x - 6 + k * 6, yy); c.lineTo(w.x - 8 + k * 6, yy + 4); c.stroke(); } }
  drawPig(c, pig.x, pig.y, t);
  for (const p of parts) { c.fillStyle = p.c; c.fillRect(p.x - 2, p.y - 2, 4, 3); }
  if (msgT > 0) K.text(c, msg, W / 2, 150, 14, '#fff');
}
function drawWolf(c, x, y, t, puff) {
  x = Math.round(x); y = Math.round(y);
  c.fillStyle = '#6b6f7a'; c.fillRect(x - 8, y - 6, 16, 14); c.fillRect(x - 7, y - 16, 14, 11);
  c.beginPath(); c.moveTo(x - 7, y - 15); c.lineTo(x - 5, y - 22); c.lineTo(x - 2, y - 15); c.fill(); c.beginPath(); c.moveTo(x + 7, y - 15); c.lineTo(x + 5, y - 22); c.lineTo(x + 2, y - 15); c.fill();
  c.fillStyle = '#9aa0aa'; c.fillRect(x - 4, y - 9, 8, 6); c.fillStyle = '#111'; c.fillRect(x - 1, y - 9, 3, 2);
  c.fillStyle = '#ffd23f'; c.fillRect(x - 5, y - 13, 2, 2); c.fillRect(x + 3, y - 13, 2, 2);
  if (puff) { c.fillStyle = '#c03'; c.fillRect(x - 2, y - 4, 4, 2 + (Math.floor(t / 100) % 2)); }
  c.fillStyle = '#4a4e58'; c.fillRect(x - 8, y + 8, 5, 4); c.fillRect(x + 3, y + 8, 5, 4);
}
function drawPig(c, x, y, t) {
  x = Math.round(x); y = Math.round(y); const f = pig.face;
  if (pig.dash > 0) { c.fillStyle = 'rgba(255,255,255,.4)'; c.fillRect(x - 14 * f - 6, y - 2, 8, 2); c.fillRect(x - 14 * f - 4, y + 4, 6, 2); }
  c.fillStyle = '#ff9fbf'; c.beginPath(); c.ellipse(x, y, 11, 8, 0, 0, 7); c.fill();
  c.beginPath(); c.arc(x + 9 * f, y - 4, 6, 0, 7); c.fill();
  c.fillStyle = '#ff7aa0'; c.fillRect(x + 13 * f - 2, y - 5, 4, 4); c.fillStyle = '#7a2a40'; c.fillRect(x + 13 * f - 1, y - 4, 1, 1); c.fillRect(x + 13 * f + 1, y - 4, 1, 1);
  c.fillStyle = '#000'; c.fillRect(x + 8 * f, y - 7, 2, 2);
  c.fillStyle = '#ff7aa0'; c.fillRect(x + 5 * f, y - 11, 3, 3);
  c.fillRect(x - 7, y + 6, 3, 4); c.fillRect(x + 4, y + 6, 3, 4);
  if (pig.carry) { c.fillStyle = '#c8602c'; c.fillRect(x - 7, y - 20, 14, 7); c.fillStyle = 'rgba(255,255,255,.2)'; c.fillRect(x - 7, y - 20, 14, 2); }
}
title();
K.run(update, draw);
</script>
</body>
</html>
