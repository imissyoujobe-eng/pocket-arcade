  if (killT > 0) txt(c, kill, w / 2, h * (land ? 0.2 : 0.18), land ? 18 : 15, '#ffcf4a', 'center');
  if (msgT > 0) { txt(c, msg, w / 2, h * 0.36, land ? 30 : 24, '#fff', 'center'); if (msg2) txt(c, msg2, w / 2, h * 0.36 + 32, 15, '#e8f0d8', 'center'); }
  if (warnT > 0 && Math.floor(clock * 6) % 2 === 0) txt(c, warnTxt, w / 2, h * 0.5, land ? 18 : 15, '#ff6a4a', 'center');
  if (hitFlash > 0) { const g = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.7); g.addColorStop(0, 'rgba(255,0,0,0)'); g.addColorStop(1, 'rgba(200,0,0,' + hitFlash * 0.5 + ')'); c.fillStyle = g; c.fillRect(0, 0, w, h); }
}

// ---------------------------------------------------------------- missions and the game
const NAMES = ['Mangrove Run', 'Snake Bend', 'Monsoon Gorge', 'Black Water', 'Dragon Narrows', 'Tiger Reach'];
function mName(i) { return NAMES[i % NAMES.length] + (i >= NAMES.length ? ' ' + (Math.floor(i / NAMES.length) + 1) : ''); }
function placeBoat(z) { P.z = z; P.x = cx(z); P.a = Math.atan(dcx(z)); P.vx = 0; P.vz = 0; P.v = 0; P.hull = 100; P.dead = false; P.deadT = 0; P.inv = 2; P.rkts = 6; camYaw = P.a; camPos.set(P.x - Math.sin(P.a) * 12, 5.4, P.z - Math.cos(P.a) * 12); }
function startMission() {
  audioOn(); buildRiver(mi); makeMission(mi); if (!boat) { boat = boatModel(); scene.add(boat); }
  P.cp = 0; placeBoat(8); mScore = 0; state = 'run'; clock = 0; hitFlash = 0;
  K.set('mission', 'MISSION ' + (mi + 1) + ' · ' + mName(mi).toUpperCase()); K.set('score', score);
  banner('MISSION ' + (mi + 1), 'Run the river and knock down the bridge', 3);
}
function title() {
  state = 'title'; mi = 0; buildRiver(0); makeMission(0); if (!boat) { boat = boatModel(); scene.add(boat); } placeBoat(60); P.v = 14;
  K.card({ title: 'RIVER RATS', text: 'Jungle river patrol in a fast jet boat. Steer with the stick: push it up for full speed, pull back to slow down or reverse. Hold GUN for the bow minigun: it locks on to whatever is ahead of you and leads it. Tap RKT for a homing rocket from the roof pod (they reload one at a time). Your three SEALs shoot at anything on the banks by themselves. Watch for gunners in the trees, gun nests, towers, sampans, floating mines, log booms (shoot the red floats) and tripwires on the banks. Grab crates for repairs. At the top of the river, knock down the bridge. VIEW puts you behind the gun.', best: best ? 'BEST ' + best : '', button: 'Start patrol', onStart: () => { score = 0; boats = 3; mi = 0; startMission(); } });
}
function missionDone() {
  state = 'card'; const bonus = Math.round(P.hull * 10) + 500; score += bonus; mScore += bonus; K.set('score', score);
  if (score > best) { best = score; try { localStorage.setItem('pa-riverrats', best); } catch (e) {} }
  K.card({ title: 'BRIDGE DOWN!', text: 'Mission ' + (mi + 1) + ' complete. Mission score ' + mScore + ' (hull bonus ' + bonus + '). Next: ' + mName(mi + 1) + ', with more of them waiting on the banks.', best: 'SCORE ' + score, button: 'Next mission', onStart: () => { mi++; startMission(); } });
}
function gameOver() {
  state = 'card'; const b = K.saveBest('riverrats', score); best = Math.max(best, b);
  K.card({ title: 'PATROL OVER', text: 'All three boats lost on mission ' + (mi + 1) + ' (' + mName(mi) + '). Score ' + score + '.', best: 'BEST ' + best, button: 'Patrol again', onStart: () => { score = 0; boats = 3; mi = 0; startMission(); } });
}

// ---------------------------------------------------------------- the loop
let slowF = [], slowSkip = 60;
function update(dt) { if (renderer && !DB.pause) tick(dt); }
function tick(dt) {
  clock += dt; if (msgT > 0) msgT -= dt; if (killT > 0) killT -= dt; if (warnT > 0) warnT -= dt; if (hitFlash > 0) hitFlash = Math.max(0, hitFlash - dt * 1.5);
  if (K.hit('v')) view = 1 - view;
  if (state === 'title' || state === 'card') {
    // attract: the boat runs the river by itself
    const ahead = cx(P.z + 40); P.a += wrapA(Math.atan2(ahead - P.x, 40) - P.a) * Math.min(1, dt * 1.5); P.v = 16; const fx = Math.sin(P.a), fz = Math.cos(P.a); P.vx = fx * P.v; P.vz = fz * P.v; P.x += P.vx * dt; P.z += P.vz * dt;
    if (P.z > RV.L - 200) placeBoat(60), P.v = 16;
    stepPS(PUFF, dt); stepPS(GLOW, dt); return;
  }
  if (state === 'run' || state === 'won') {
    boatStep(dt); if (state === 'run') weapons(dt); enemiesStep(dt); projectiles(dt);
    if (DB.god) P.hull = 100;
    if (P.dead) { P.deadT += dt; if (P.deadT > 2.6) { if (boats <= 0) { gameOver(); } else { placeBoat(checkpoints[P.cp] + 8); banner('NEW BOAT', 'Boats left: ' + boats, 1.6); } } }
    if (state === 'won') { doneT += dt; if (doneT > 3.5) missionDone(); }
  }
  // the river flows: ripples drift downstream
  if (waterTex) { waterTex.offset.y -= dt * 0.08; waterTex.offset.x = Math.sin(clock * 0.3) * 0.02; }
  stepPS(PUFF, dt); stepPS(GLOW, dt);
}
function draw() {
  if (!renderer) return;
  const now = performance.now(), el = draw.last ? Math.min(0.05, (now - draw.last) / 1000) : 0.016; draw.last = now;
  if (boat) poseBoat(el);
  camUpdate(el); engineSound();
  renderer.render(scene, camera); hudDraw();
  if (state === 'run' && !document.hidden) { if (slowSkip > 0) slowSkip--; else { slowF.push(el); if (slowF.length >= 60) { const med = slowF.slice().sort((a, b) => a - b)[30]; slowF.length = 0; if (med > 0.03 && PR > 0.8) { PR = Math.max(0.8, PR - 0.35); renderer.setPixelRatio(PR); fit(); slowSkip = 60; } } } }
}
setup(); title();
K.run(update, draw);
window.DB = DB; DB.state = () => ({ state, z: Math.round(P.z), x: +P.x.toFixed(1), hull: P.hull, boats, score, enemies: enemies.filter(e => !e.dead).length, lock: P.lock && P.lock.type, rkts: P.rkts, L: RV.L });
</script>
</body>
</html>
