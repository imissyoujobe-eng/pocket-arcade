.............s.......................#", "#....s.s..............................s..s.....#", "#..............##..............##..............#", "#.........g....##..#....#......##......k.......#", "#..............##..............##..............#", "#..............##..............##..............#", "#######################EE#######################"]};

let state = 'title', worlds, wn, w, p, cam, trans, ents, fx, bombs, drops, hp, maxHp, gems, keys, bombN, hasSword, hasBombs, talk, spawnPt, cleared, time, crown, best = K.best('hollowcrown');
function title() { K.card({ title: 'HOLLOW CROWN', text: 'Explore the wilds with the arrow pad. Visit the cave just north of where you start to get a sword, then press SWORD to swing. Cut bushes, find the bomb bag in the dungeon and blast cracked rocks. Defeat the Cinder Wyrm to claim the crown.', best: best ? 'BEST TIME ' + fmt(best) : '', button: 'Begin quest', onStart: start }); }
function fmt(s) { return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }
function start() {

  hp = 3; maxHp = 3; gems = 0; keys = 0; bombN = 0; hasSword = false; hasBombs = false; talk = null; cleared = {}; time = 0; crown = null; fx = []; drops = []; bombs = [];

function enter(name, at) {

let screenKey = '';
function hud() { K.set('gems', '◆ ' + gems); K.set('keys', keys ? '⚿ ' + keys : ''); K.set('bombs', hasBombs ? '● ' + bombN : ''); K.set('time', fmt(time)); }

function update(dt) {

    if (K.hit('a')) { if (hasSword) { p.atk = 0.22; K.beep(900, 0.06, { to: 300, vol: 0.04 }); swing(); } else { talk = { who: '', lines: ['You have nothing to swing yet. The cave to the north might help.'] }; } }

  }

    if (ch === 'H') { D.set(w, here.tx, here.ty, '.'); maxHp++; hp = maxHp; K.tune([523, 659, 784, 1047], 0.1); talk = { who: '', lines: ['A heart container! Your max health grows.'] }; }
    if (ch === 'b') { D.set(w, here.tx, here.ty, '.'); hasBombs = true; bombN = 8; hud(); K.tune([523, 659, 784, 1047], 0.1); talk = { who: '', lines: ['The bomb bag! Press BOMB to drop one. Blast cracked rock to find secrets.'] }; }

    e.t -= dt;
    if (e.kind === 'blob' || e.kind === 'bones' || e.kind === 'grunt') {
      if (e.t <= 0) { e.t = K.rnd(0.6, 1.6); const ds = [[1, 0], [-1, 0], [0, 1], [0, -1], [0, 0]]; e.dir = e.kind === 'grunt' && Math.random() < 0.6 ? (Math.abs(p.x - e.x) > Math.abs(p.y - e.y) ? [Math.sign(p.x - e.x), 0] : [0, Math.sign(p.y - e.y)]) : ds[K.ri(0, 4)]; if (e.kind === 'blob' && Math.random() < 0.4) { const v = Math.abs(p.x - e.x) > Math.abs(p.y - e.y) ? [Math.sign(p.x - e.x), 0] : [0, Math.sign(p.y - e.y)]; fx.push({ rock: true, x: e.x + 6, y: e.y + 6, vx: v[0] * 110, vy: v[1] * 110, l: 2 }); } }
      const sp = e.kind === 'grunt' ? 40 : 30; if (D.move(w, e, e.dir[0] * sp * dt, e.dir[1] * sp * dt, ch => D.isSolid(ch) || ch === 'L' || ch === 'E' || ch === 'S' || ch === 'C')) e.t = 0;
      e.x = K.clamp(e.x, cam.x + 2, cam.x + VW - 14); e.y = K.clamp(e.y, cam.y + 2, cam.y + VH - 14);
    } else if (e.kind === 'bat') { if (e.t <= 0) { e.t = K.rnd(0.4, 1.2); const a = Math.random() * 6.28; e.dir = [Math.cos(a), Math.sin(a)]; } e.x = K.clamp(e.x + e.dir[0] * 55 * dt, cam.x + 4, cam.x + VW - 16); e.y = K.clamp(e.y + e.dir[1] * 55 * dt, cam.y + 4, cam.y + VH - 16); }

      e.fire -= dt; if (e.fire <= 0) { e.fire = e.hp < 6 ? 1 : 1.6; for (let k = -1; k <= 1; k++) { const a = Math.atan2(p.y - e.y - 14, p.x - e.x - 16) + k * 0.3; fx.push({ fireball: true, x: e.x + 16, y: e.y + 18, vx: Math.cos(a) * 95, vy: Math.sin(a) * 95, l: 3 }); } K.beep(160, 0.25, { type: 'sawtooth', vol: 0.05 }); }

  for (const d of drops) { d.l -= dt; if (D.overlap(p, { x: d.x - 4, y: d.y - 4, w: 8, h: 8 })) { d.l = 0; if (d.k === 'heart') hp = Math.min(maxHp, hp + 1); else if (d.k === 'gem') { gems++; hud(); } else if (d.k === 'bomb' && hasBombs) { bombN = Math.min(16, bombN + 4); hud(); } K.beep(1100, 0.05, { vol: 0.04 }); } }

function findTile(wd, ch, dx, dy) { for (let y = 0; y < wd.rows; y++) for (let x = 0; x < wd.cols; x++) if (wd.g[y][x] === ch) return { x: (x + dx) * T + 2, y: (y + dy) * T + 2 }; return { x: 32, y: 32 }; }
function touching(set) { for (const [ax, ay] of [[p.x + 2, p.y + 2], [p.x + 10, p.y + 2], [p.x + 2, p.y + 10], [p.x + 10, p.y + 10], [p.x + 6 + D.faceVec(p.face)[0] * 8, p.y + 6 + D.faceVec(p.face)[1] * 8]]) { const ch = D.tile(w, ax, ay); if (set.includes(ch)) return { ch, tx: Math.floor(ax / T), ty: Math.floor(ay / T) }; } return null; }
function openRun(tx, ty, ch) { for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (D.tile(w, (tx + dx) * T + 1, (ty + dy) * T + 1) === ch) D.set(w, tx + dx, ty + dy, '.'); }
function roomClear() { return !ents.some(e => e.alive && e.kind !== 'wyrm'); }
function swing() {
  const box = D.swordBox(p, 16);
  for (const e of ents) if (e.alive && e.inv <= 0 && D.overlap(box, e)) { e.hp--; e.inv = 0.3; const v = D.faceVec(p.face); D.move(w, e, v[0] * 12, v[1] * 12); K.beep(300, 0.06, { vol: 0.05 }); if (e.hp <= 0) kill(e); }
  // cut bushes
  for (const [ax, ay] of [[box.x + 2, box.y + 2], [box.x + box.w - 2, box.y + box.h - 2], [box.x + box.w / 2, box.y + box.h / 2]]) if (D.tile(w, ax, ay) === 'B') { const tx = Math.floor(ax / T), ty = Math.floor(ay / T); D.set(w, tx, ty, '.'); for (let i = 0; i < 6; i++) fx.push({ leaf: true, x: tx * T + 8, y: ty * T + 8, vx: K.rnd(-50, 50), vy: K.rnd(-50, 50), l: 0.4 }); if (Math.random() < 0.35) drops.push({ k: Math.random() < 0.5 ? 'heart' : 'gem', x: tx * T + 8, y: ty * T + 8, l: 8 }); }

function kill(e) {

  if (e.kind === 'wyrm') { cleared.boss = true; crown = { x: e.x + 10, y: e.y + 8, w: 12, h: 12 }; K.tune([392, 523, 659, 784, 1047, 1319, 1568], 0.12); talk = { who: '', lines: ['The Cinder Wyrm crumbles to ash. Something glints where it fell...'] }; }
  else if (wn === 'dung' && roomClear()) K.tune([659, 880], 0.08);

function explode(x, y) {
  K.noise(0.5, 0.4); for (let i = 0; i < 20; i++) fx.push({ x, y, vx: K.rnd(-100, 100), vy: K.rnd(-100, 100), l: 0.5, boom: true });
  for (let ty = Math.floor((y - 24) / T); ty <= Math.floor((y + 24) / T); ty++) for (let tx = Math.floor((x - 24) / T); tx <= Math.floor((x + 24) / T); tx++) { const ch = D.tile(w, tx * T + 1, ty * T + 1); if ((ch === 'K' || ch === 'B') && Math.hypot(tx * T + 8 - x, ty * T + 8 - y) < 28) { D.set(w, tx, ty, '.'); if (ch === 'K') K.tune([659, 784, 1047], 0.08); } }
  for (const e of ents) if (e.alive && Math.hypot(e.x + e.w / 2 - x, e.y + e.h / 2 - y) < 28) { e.hp -= 2; if (e.hp <= 0) kill(e); }

function hurt(n, src) {
  if (p.inv > 0) return; hp -= n; p.inv = 1; const dx = p.x - (src.x || p.x), dy = p.y - (src.y || p.y), d = Math.hypot(dx, dy) || 1; p.kb = [dx / d, dy / d]; p.kbT = 0.15; K.beep(220, 0.15, { type: 'square', vol: 0.06 });
  if (hp <= 0) { hp = maxHp; K.tune([392, 330, 262, 196], 0.15, { type: 'sawtooth' }); talk = { who: '', lines: ['You collapse... and wake up back at the entrance.'] }; const sp = spawnPt; enter(sp.name, { x: sp.x, y: sp.y }); }
}
function win() { state = 'over'; const t = Math.floor(time); best = K.saveBest('hollowcrown', t, true); K.card({ title: 'THE CROWN IS YOURS', text: 'You claimed the Hollow Crown in ' + fmt(t) + ' with ' + maxHp + ' hearts and ' + gems + ' gems.', best: 'BEST TIME ' + fmt(best), button: 'New quest', onStart: start }); }

// ---- drawing ----
function drawTile(c, ch, x, y, tx, ty, t) {
  const dung = wn === 'dung';

  if (!dung && ch === '.' && (tx * 7 + ty * 13) % 11 === 0) { c.fillStyle = '#5aa83a'; c.fillRect(x + 4, y + 6, 2, 3); c.fillRect(x + 9, y + 9, 2, 3); }
  if (ch === 'T') { c.fillStyle = '#2f7a2c'; c.beginPath(); c.arc(x + 8, y + 7, 7, 0, 7); c.fill(); c.fillStyle = '#3f9a3a'; c.beginPath(); c.arc(x + 6, y + 5, 3, 0, 7); c.fill(); c.fillStyle = '#6a3a1a'; c.fillRect(x + 6, y + 12, 4, 4); }
  else if (ch === 'W' || ch === '~') { c.fillStyle = '#2a7ad8'; c.fillRect(x, y, T, T); c.fillStyle = '#7ac8ff'; c.fillRect(x + (t / 80 + tx * 3) % 12, y + 5 + (tx % 2) * 5, 4, 1); }
  else if (ch === 'R') { c.fillStyle = '#9a8a7a'; c.fillRect(x, y, T, T); c.fillStyle = '#b8a898'; c.fillRect(x + 2, y + 2, 6, 5); c.fillRect(x + 8, y + 9, 6, 5); c.fillStyle = '#6a5a4a'; c.fillRect(x, y + 15, T, 1); }
  else if (ch === 'K') { c.fillStyle = '#9a8a7a'; c.fillRect(x, y, T, T); c.strokeStyle = '#4a3a2a'; c.lineWidth = 1; c.beginPath(); c.moveTo(x + 3, y + 2); c.lineTo(x + 8, y + 8); c.lineTo(x + 5, y + 14); c.moveTo(x + 8, y + 8); c.lineTo(x + 13, y + 6); c.stroke(); }
