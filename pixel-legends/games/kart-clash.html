<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kart Clash</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script src="../lib/three.min.js"></script>
<script src="../lib/racer.js"></script>
<script>
// Kart Clash: a three-race kart cup. Grab item boxes for turbos, oil slicks and homing bolts.
K.theme({ bg: '#0c1a2a', ink: '#fffaf0', accent: '#ff5a36', accentInk: '#fff' });
K.hud(['cup', 'pts']);
K.pad({ dpad: 'lr', buttons: [{ id: 'b', label: 'BRAKE' }, { id: 'a', label: 'ITEM' }] });
const TRACKS = [
  { n: 'Meadow Loop', width: 16, pts: [[0, 0], [80, -10], [140, 30], [150, 100], [110, 150], [40, 140], [-20, 170], [-90, 140], [-110, 70], [-70, 20]], theme: { sky: 0x8fd8ff, ground: 0x5cb84a, road: '#55585f', edge: ['#e63946', '#ffffff'], scenery: 'trees' } },
  { n: 'Desert Dash', width: 16, pts: [[0, 0], [100, 0], [160, -60], [220, -20], [200, 60], [120, 80], [100, 150], [20, 160], [-60, 120], [-60, 40]], theme: { sky: 0xffd8a0, ground: 0xe0b070, road: '#8a6a4a', edge: ['#ffb02e', '#5a3a1a'], scenery: 'cactus', line: 'rgba(255,240,200,.6)' } },
  { n: 'Frosty Peaks', width: 15, pts: [[0, 0], [60, -40], [140, -40], [180, 20], [140, 80], [160, 150], [90, 190], [0, 150], [-40, 200], [-120, 160], [-100, 60], [-50, 40]], theme: { sky: 0xcfe8ff, ground: 0xf2f6ff, road: '#6a7a8a', edge: ['#46a8ff', '#ffffff'], scenery: 'snow', fog: 0xe8f2ff } }
];
const POINTS = [10, 8, 6, 5, 4, 3, 2, 1];
let race = 0, total = 0, places = [], best = K.best('kartclash');
const CFG = { style: 'kart', tracks: TRACKS, laps: 3, cpus: 5, maxSpeed: 26, items: true, colors: [0x46a8ff, 0x3fd06a, 0xffd23f, 0xc8a0ff, 0xff8fb0, 0xe63946], onFinish };
function title() { K.card({ title: 'KART CLASH', text: 'Three races, one cup. Your kart drives itself forward; steer with ◀ ▶ (or touch the left or right side of the screen). Drive through gold item boxes and tap ITEM to use what you get: a turbo, an oil slick behind you, or a homing bolt for the kart ahead.', best: best ? 'BEST CUP ' + best + ' PTS' : '', button: 'Start cup', onStart: () => { race = 0; total = 0; places = []; go(); } }); }
function go() { K.set('cup', 'RACE ' + (race + 1) + '/3 · ' + TRACKS[race].n.toUpperCase()); K.set('pts', total + ' PTS'); R.start(CFG, race); }
function ord(n) { return n + (['ST', 'ND', 'RD'][n - 1] || 'TH'); }
function onFinish(place) {
  R.stop(); places.push(place); total += POINTS[place - 1] || 0; K.set('pts', total + ' PTS');
  if (race < 2) { race++; K.card({ title: place === 1 ? '1ST PLACE!' : 'FINISHED ' + ord(place), text: 'You earned ' + (POINTS[place - 1] || 0) + ' points. Cup total: ' + total + '. Next: ' + TRACKS[race].n + '.', best: '', button: 'Next race', onStart: go }); }
  else { best = K.saveBest('kartclash', total); const trophy = total >= 28 ? 'GOLD' : total >= 22 ? 'SILVER' : total >= 15 ? 'BRONZE' : null; K.card({ title: trophy ? trophy + ' TROPHY!' : 'CUP OVER', text: 'Your finishes: ' + places.join(', ') + '. Total ' + total + ' points.' + (trophy ? '' : ' Win more races for a trophy!'), best: 'BEST CUP ' + best + ' PTS', button: 'Race again', onStart: () => { race = 0; total = 0; places = []; go(); } }); }
}
title();
K.run(dt => R.tick(dt), () => {});
</script>
</body>
</html>
