<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Door Runner</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/plat.js"></script>
<script src="../lib/art.js"></script>
<script>
// Door Runner: a secret agent fights through an enemy base. Hop between floors, duck into doors to dodge, and watch your ammo.
K.theme({ bg: '#0e0e14', ink: '#f6f6ff', accent: '#ffd23a', accentInk: '#221a00' });
const VW = 256, VH = 192, T = 16;
K.screen(VW, VH);
K.hud(['score', 'ammo', 'lives']);
K.pad({ dpad: '4', buttons: [{ id: 'b', label: 'FIRE' }, { id: 'a', label: 'JUMP' }] });

// two floors: ground (row 13) and balcony '=' (row 8). D enemy door, A ammo door, M machine gun door, F finish
const E = '................', G = '################', BAL = '================';
const CH = {
  start: [E, E, E, E, E, E, E, '................', '======..........', E, E, E, '.S..............', G, G],
  hall:  [E, E, E, E, E, E, '...D.......D....', '...D.......D....', BAL, E, E, '.......D........', '.......D........', G, G],
  ammo:  [E, E, E, E, E, E, '......A.........', '......A.........', '====.=====.=====', E, E, '..D.........D...', '..D.........D...', G, G],
  gun:   [E, E, E, E, E, E, '.........M......', '.........M......', '.....===========', E, E, '...D.......HH...', '...D.......HH...', G, G],
  pit:   [E, E, E, E, E, E, '.......D........', '.......D........', BAL, E, E, E, E, '#####......#####', '#####......#####'],
  end:   [E, E, E, E, E, E, E, E, BAL, E, E, '.........F......', '.........F......', G, G],
};
const STAGES = [
  { n: 'Entry Hall', wall: '#3a3a4a', trim: '#5a5a6a', chunks: ['start', 'hall', 'ammo', 'hall', 'pit', 'gun', 'hall', 'end'] },
  { n: 'Cavern Labs', wall: '#3a4a3a', trim: '#5a6a5a', chunks: ['start', 'hall', 'pit', 'ammo', 'hall', 'gun', 'pit', 'hall', 'ammo', 'end'] },
  { n: 'The Vault', wall: '#4a3a3a', trim: '#7a5a4a', chunks: ['start', 'ammo', 'hall', 'pit', 'hall', 'gun', 'hall', 'pit', 'ammo', 'hall', 'end'] },
];
let state = 'title', si, w, p, cam, foes, doors, shots, eshots, fx, score, lives, ammo, mg, hp, deadT, hide, timeLeft, msg, msgT, fireCd, best = K.best('doorrunner');
function newGame() { si = 0; score = 0; lives = 3; load(); state = 'play'; }
function title() { K.card({ title: 'DOOR RUNNER', text: 'FIRE your pistol and watch the bullet count. Hold ▲ + JUMP to leap up to the balcony, ▼ + JUMP to drop down. Stand at a door and press ▲ to hide inside (enemies come out of doors too!). Doors marked A refill ammo and M gives a machine gun. Reach the exit before time runs out. Two hits cost a life.', best: best ? 'BEST ' + best : '', button: 'Go', onStart: newGame }); }
function load() {
  const S = STAGES[si]; w = P.world(P.join(S.chunks.map(k => CH[k]))); P.SOLID = '#H'; P.ONEWAY = '=';
  foes = []; doors = []; shots = []; eshots = []; fx = []; cam = { x: 0, y: 0 }; timeLeft = 120; msg = 'STAGE ' + (si + 1) + ': ' + S.n.toUpperCase(); msgT = 2; ammo = Math.max(ammo || 0, 40); mg = 0;
  for (let y = 0; y < w.rows; y++) for (let x = 0; x < w.cols; x++) { const ch = w.g[y][x];
    if (ch === 'S') { w.start = { x: x * T, y: y * T }; w.g[y][x] = '.'; }
    if ('DAM'.includes(ch) && w.g[y + 1] && w.g[y + 1][x] === ch) doors.push({ x: x * T, y: y * T, k: ch, cd: K.rnd(1, 4), used: false }); }
  respawn(true);
}
function respawn(first) { p = P.player(first ? w.start.x : Math.max(w.start.x, cam.x + 30), first ? w.start.y : 20, { w: 10, h: 22, run: 80, sprint: 80, autoRun: false, jump: 280 }); p.inv = first ? 0.5 : 2; hp = 2; deadT = 0; hide = null; fireCd = 0; }
function hurt() { if (p.inv > 0 || hide || deadT > 0) return; hp--; p.inv = 1.2; K.beep(150, 0.2, { type: 'sawtooth' }); if (hp <= 0) die(); }
function die() { deadT = 1.4; lives--; K.beep(300, 0.6, { to: 60 }); }
function spawnAt(d) { const top = d.y < 9 * T; foes.push({ x: d.x + 3, y: d.y + 32 - 22, w: 10, h: 22, vx: 0, vy: 0, hp: si > 0 && Math.random() < 0.3 ? 2 : 1, k: Math.random() < 0.25 ? 'leaper' : 'gunner', cd: K.rnd(0.8, 1.6), out: 0.4, alive: true, col: ['#c03a3a', '#3a7ac0', '#7a3ac0'][K.ri(0, 2)] }); K.beep(250, 0.1); }
function update(dt) {
  if (state !== 'play') return;
  if (msgT > 0) msgT -= dt;
  if (deadT > 0) { deadT -= dt; if (deadT <= 0) { if (lives <= 0) { state = 'over'; best = K.saveBest('doorrunner', score); K.card({ title: 'AGENT DOWN', text: 'You reached stage ' + (si + 1) + ' with ' + score + ' points.', best: 'BEST ' + best, button: 'Again', onStart: () => { ammo = 0; newGame(); } }); return; } respawn(false); } return; }
  timeLeft -= dt; if (timeLeft <= 0) { timeLeft = 0; die(); timeLeft = 60; return; }
  const atDoor = doors.find(d => Math.abs(d.x + 8 - (p.x + 5)) < 9 && Math.abs(d.y + 32 - (p.y + p.h)) < 4);
  if (hide) { if (K.hit('up') || K.hit('down') || K.hit('left') || K.hit('right') || K.hit('a')) { hide = null; p.inv = 0.4; K.beep(400, 0.05); } }
  else {
    if (K.down('up') && K.hit('a') && p.ground && p.y > 9 * T) { p.vy = -400; K.beep(300, 0.1, { to: 600 }); }
    P.control(w, p, dt, { jump: K.hit('a') && !K.down('up') && !(K.down('down') && p.ground), run: false, down: false });
    if (K.down('down') && K.hit('a') && p.ground && p.y < 9 * T) { p.y += 6; p.ground = false; }
    if (p.fell) { p.fell = false; die(); return; }
    if (atDoor && K.hit('up') && p.ground) { hide = atDoor; p.vx = 0; K.beep(200, 0.08); if (atDoor.k === 'A' && !atDoor.used) { atDoor.used = true; ammo += 50; msg = '+50 BULLETS'; msgT = 1; K.tune([660, 880], 0.05); } if (atDoor.k === 'M' && !atDoor.used) { atDoor.used = true; mg = 15; ammo += 30; msg = 'MACHINE GUN!'; msgT = 1; K.tune([660, 880, 1100], 0.05); } }
    fireCd -= dt;
    if (mg > 0) mg -= dt;
    if ((mg > 0 ? K.down('b') : K.hit('b')) && fireCd <= 0) { if (ammo > 0) { ammo--; fireCd = mg > 0 ? 0.08 : 0.25; shots.push({ x: p.x + 5 + p.face * 8, y: p.y + 9, vx: p.face * 320 }); K.beep(mg > 0 ? 900 : 700, 0.04, { to: 200, vol: 0.05 }); } else { fireCd = 0.3; K.beep(120, 0.04); msg = 'OUT OF AMMO: FIND AN A DOOR'; msgT = 1; } }
  }
  if (p.inv > 0) p.inv -= dt;
  doors.forEach(d => { if (d.k !== 'D') return; if (d.x < cam.x - 20 || d.x > cam.x + VW + 10) return; d.cd -= dt; if (d.cd <= 0 && foes.filter(f => f.alive).length < 3 + si && Math.abs(d.x - p.x) > 40) { d.cd = K.rnd(2.5, 5) - si * 0.4; spawnAt(d); } });
  foes.forEach(f => { if (!f.alive) return; if (f.out > 0) { f.out -= dt; return; }
    f.vy = Math.min(300, f.vy + 800 * dt); const dir = Math.sign(p.x - f.x) || 1; const sameFloor = Math.abs((f.y + f.h) - (p.y + p.h)) < 10;
    if (f.k === 'leaper') { if (f.ground && Math.abs(p.x - f.x) < 90 && Math.random() < dt * 1.5) { f.vy = -260; f.vx = dir * 90; } if (f.ground) f.vx = dir * 30; }
    else { f.vx = Math.abs(p.x - f.x) > 70 ? dir * 35 : 0; f.cd -= dt; if (f.cd <= 0 && sameFloor && Math.abs(p.x - f.x) < 200) { f.cd = K.rnd(1.4, 2.6) - si * 0.2; eshots.push({ x: f.x + 5, y: f.y + 9, vx: dir * 130 }); K.beep(500, 0.04, { vol: 0.03 }); } }
    P.move(w, f, dt); if (f.y > w.py) f.alive = false;
    if (P.overlap(p, f) && !hide) hurt(); });
  shots.forEach(s => { s.x += s.vx * dt; if (P.isSolid(P.tile(w, s.x, s.y))) s.dead = true; for (const f of foes) if (f.alive && f.out <= 0 && s.x > f.x && s.x < f.x + f.w && s.y > f.y && s.y < f.y + f.h) { s.dead = true; if (--f.hp <= 0) { f.alive = false; score += 200; K.noise(0.12, 0.25); for (let i = 0; i < 6; i++) fx.push({ x: f.x + 5, y: f.y + 8, vx: K.rnd(-50, 50), vy: K.rnd(-80, 0), t: 0.5, c: f.col }); } break; } });
  shots = shots.filter(s => !s.dead && Math.abs(s.x - p.x) < 340);
  eshots.forEach(s => { s.x += s.vx * dt; if (P.isSolid(P.tile(w, s.x, s.y))) s.dead = true; if (!hide && s.x > p.x && s.x < p.x + p.w && s.y > p.y && s.y < p.y + p.h) { s.dead = true; hurt(); } });
  eshots = eshots.filter(s => !s.dead && Math.abs(s.x - p.x) < 340); foes = foes.filter(f => f.alive || f.out > 0);
  fx.forEach(e => { e.t -= dt; e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 300 * dt; }); fx = fx.filter(e => e.t > 0);
  if (P.touches(w, p, 'F')) { score += 2000 + Math.floor(timeLeft) * 20; K.tune([523, 659, 784, 1046], 0.12); si++;
    if (si >= STAGES.length) { state = 'over'; best = K.saveBest('doorrunner', score); K.card({ title: 'MISSION DONE', text: 'You cracked the vault! Final score ' + score + '.', best: 'BEST ' + best, button: 'Again', onStart: () => { ammo = 0; newGame(); } }); return; }
    load(); }
  cam = P.cam(w, p, cam, VW, VH);
  K.set('score', score + '  ⏱' + Math.ceil(timeLeft)); K.set('ammo', (mg > 0 ? 'MG ' : '') + '•' + ammo); K.set('lives', '♥'.repeat(Math.max(0, lives)) + ' ' + '▮'.repeat(Math.max(0, hp)));
}
function agent(c, x, y, face, t, top, legs, hair, moving) {
  const step = moving ? Math.sin(t / 70) * 2 : 0;
  c.fillStyle = legs; c.fillRect(x + 1 + step * 0.5, y + 13, 4, 9); c.fillRect(x + 5 - step * 0.5, y + 13, 4, 9);
  c.fillStyle = top; c.fillRect(x, y + 5, 10, 9); c.fillStyle = '#e0b088'; c.fillRect(x + 2, y - 2, 7, 7); c.fillStyle = hair; c.fillRect(x + 1, y - 3, 8, 3);
  c.fillStyle = '#222'; c.fillRect(face > 0 ? x + 8 : x - 6, y + 7, 8, 2);
}
function draw(c, t) {
  const S = STAGES[si] || STAGES[0], cx = Math.round(cam.x), cy = Math.round(cam.y);
  wallBg(c, t, S, cx, cy);
  if (!w) return;
  doors.forEach(d => { const x = d.x - cx, y = d.y - cy; if (x < -20 || x > VW) return; drawDoor(c, x, y, d, t); if (d.k !== 'D') K.text(c, d.used ? '·' : d.k, x + 8, y - 6, 8, '#fff'); if (hide === d) { c.fillStyle = 'rgba(255,255,255,.3)'; c.fillRect(x, y, T, 32); } });
  P.eachVisible(w, cam, VW, VH, (ch, x, y) => {
    if (ch === '#') artTile(c, '#', x, y, Math.round((x + cx) / T), Math.round((y + cy) / T), si, '#', A.PAL.metal);
    else if (ch === 'H') artTile(c, 'H', x, y, Math.round((x + cx) / T), Math.round((y + cy) / T), 0, 'H', A.PAL.wood);
    else if (ch === '=') { A.ledge(c, x, y, T, A.PAL.metal); c.fillStyle = A.INK; c.fillRect(x + 6.5, y + 5, 3, 9); c.fillStyle = '#7a8494'; c.fillRect(x + 7, y + 5, 2, 9); }
    else if (ch === 'F') { c.fillStyle = Math.floor(t / 200) % 2 ? '#3aff7a' : '#2ac05a'; c.fillRect(x, y, T, T); }
  });
  foes.forEach(f => { const x = Math.round(f.x) - cx, y = Math.round(f.y) - cy; if (f.out > 0) c.globalAlpha = 1 - f.out; agent(c, x, y, Math.sign(p.x - f.x) || 1, t + f.x, f.col, '#2a2a2a', f.col, f.vx); c.globalAlpha = 1; if (f.hp > 1) { c.fillStyle = '#ffd23a'; c.fillRect(x + 3, y - 6, 4, 2); } });
  if (deadT <= 0 && !hide && !(p.inv > 0 && Math.floor(t / 80) % 2) && state !== 'title') agent(c, Math.round(p.x) - cx, Math.round(p.y) - cy, p.face, t, '#e0e0f0', '#2a2a5a', '#3a2a1a', p.vx);
  c.fillStyle = '#fff'; shots.forEach(s => c.fillRect(s.x - cx - 2, s.y - cy, 5, 2));
  c.fillStyle = '#ff6a4a'; eshots.forEach(s => c.fillRect(s.x - cx - 2, s.y - cy, 4, 2));
  fx.forEach(e => { c.fillStyle = e.c; c.fillRect(e.x - cx, e.y - cy, 2, 2); });
  if (deadT > 0) K.text(c, 'HIT!', VW / 2, VH / 2, 18, '#ff4a4a');
  if (msgT > 0) K.text(c, msg, VW / 2, 30, 11, '#fff');
}
function wallBg(c, t, S, cx, cy) {
  c.fillStyle = S.wall; c.fillRect(0, 0, VW, VH);
  // concrete panels with seams, bolts and grime
  for (let x = -(cx * 0.6 % 48) - 48; x < VW + 48; x += 48) for (let y = -(cy % 32) - 32; y < VH + 32; y += 32) { const i = Math.floor((x + cx * 0.6) / 48), j = Math.floor((y + cy) / 32); c.fillStyle = A.hash(i, j) < 0.5 ? A.shade(S.wall, 0.06) : A.shade(S.wall, -0.06); c.fillRect(x + 1, y + 1, 46, 30); c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(x, y, 48, 1); c.fillRect(x, y, 1, 32); c.fillStyle = 'rgba(255,255,255,.08)'; c.fillRect(x + 1, y + 1, 46, 1); c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(x + 3, y + 3, 1.5, 1.5); c.fillRect(x + 43, y + 3, 1.5, 1.5); if (A.hash(i, j, 2) < 0.3) { c.fillStyle = 'rgba(0,0,0,.15)'; c.fillRect(x + 10, y + 12, 20, 14); } }
  for (let x = -(cx % 96); x < VW; x += 96) { c.fillStyle = S.trim; c.fillRect(x, 0, 6, VH); c.fillStyle = 'rgba(255,255,255,.15)'; c.fillRect(x, 0, 1.5, VH); c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(x + 5, 0, 1, VH); }
  c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(0, 9 * T - cy, VW, 4 * T);
  for (let x = -(cx % 128) + 40; x < VW; x += 128) { c.fillStyle = '#222'; c.fillRect(x, 7 * T - cy - 6, 12, 4); A.glow(c, x + 6, 7 * T - cy, 40, '255,240,200', 0.18); c.fillStyle = '#fff8d0'; c.fillRect(x + 2, 7 * T - cy - 2, 8, 2); }
}
function drawDoor(c, x, y, d, t) {
  const col = d.k === 'D' ? '#6a4228' : d.k === 'A' ? '#2a6a3a' : '#6a2a6a';
  A.part(c, x - 1.5, y - 1.5, T + 3, 33.5, '#3a3a44'); A.part(c, x, y, T, 32, col);
  c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(x + 2, y + 3, T - 4, 11); c.fillRect(x + 2, y + 17, T - 4, 12); c.fillStyle = 'rgba(255,255,255,.12)'; c.fillRect(x + 2, y + 3, T - 4, 1); c.fillRect(x + 2, y + 17, T - 4, 1);
  A.ball(c, x + 12, y + 17, 1.3, '#ffd23a');
}
function artTile(c, ch, x, y, tx, ty, i, set, pal) { const sol = (a, b) => a < 0 || a >= w.cols || b >= w.rows || (b >= 0 && set.indexOf(w.g[b][a]) >= 0); A.tile(c, ch + i, x, y, A.edges(sol, tx, ty), tx, ty, pal); }
agent = A.ink(agent);
{ const _draw = draw; draw = function (c, t) { _draw(c, t); if (w) { A.ambient(c, VW, VH, t, 'dust', 12); A.vignette(c, VW, VH, 0.45); } }; }
newGame(); state = 'title'; title(); K.run(update, draw);
</script>
</body>
</html>
