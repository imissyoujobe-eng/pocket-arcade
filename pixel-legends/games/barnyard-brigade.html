<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barnyard Brigade</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script>
// Barnyard Brigade: turn-based squad battle. Your helmeted goats take on the computer's rooster regiment across hills you can blow apart.
K.theme({ bg: '#10203a', ink: '#fff8ea', accent: '#ffd23f', accentInk: '#2a1d00' });
const W = 320, H = 240, WW = 720, WATER = 226, G = 300;
K.screen(W, H, { smooth: true });
K.hud(['you', 'turn', 'cpu']);
K.pad({ dpad: '4', buttons: [{ id: 'b', label: 'WEAPON' }, { id: 'a', label: 'FIRE' }] });
const WEAPONS = [
  { n: 'BAZOOKA', r: 24, dmg: 45, ammo: 99 },
  { n: 'GRENADE', r: 28, dmg: 50, ammo: 3, fuse: 3 },
  { n: 'AIRSTRIKE', r: 20, dmg: 30, ammo: 1 }
];
const NAMES = [['Billy', 'Nanny', 'Butch'], ['Red', 'Rusty', 'Colonel']];

let state = 'title', ground, units, turnTeam, idx, phase, aimA, power, charging, weapon, ammo, shots, booms, wind, turnT, walkLeft, cam, camT, msg, msgT, parts, level = 1, wins = K.best('barnyard-wins'), settleT;
function title() { K.card({ title: 'BARNYARD BRIGADE', text: 'Your goat squad versus the rooster regiment! On your turn walk with ◀ ▶, aim with ▲ ▼, change weapon with WEAPON, then hold FIRE to power up and let go. Watch the wind. Knock every rooster out, or into the water, to win.', best: wins ? 'WINS ' + wins : '', button: 'Battle!', onStart: start }); }
function start() {
  // rolling hills with a valley in the middle
  ground = new Float32Array(WW); const p1 = Math.random() * 6, p2 = Math.random() * 6;
  for (let x = 0; x < WW; x++) ground[x] = 150 - Math.sin(x / 90 + p1) * 26 - Math.sin(x / 37 + p2) * 10 + Math.max(0, 40 - Math.abs(x - WW / 2) / 3) * 0.6 + (x < 30 || x > WW - 30 ? 40 : 0);
  units = [];
  [[60, 140, 220], [WW - 220, WW - 140, WW - 60]].forEach((xs, team) => xs.forEach((x, i) => units.push({ team, name: NAMES[team][i], x, y: ground[x] - 1, vx: 0, vy: 0, hp: 100, alive: true, face: team ? -1 : 1, onG: true })));
  ammo = [WEAPONS.map(w => w.ammo), WEAPONS.map(w => w.ammo)];
  shots = []; booms = []; parts = []; turnTeam = 1; idx = [-1, -1]; cam = 0; state = 'play';
  nextTurn();
}
function alive(team) { return units.filter(u => u.alive && u.team === team); }
function cur() { return units.filter(u => u.team === turnTeam)[idx[turnTeam]]; }
function hud() {
  const hp = t => alive(t).reduce((a, u) => a + u.hp, 0);
  K.set('you', 'GOATS ' + hp(0)); K.set('turn', turnTeam === 0 ? 'YOUR TURN' : 'CPU TURN'); K.set('cpu', 'ROOSTERS ' + hp(1));
}
function say(t, d) { msg = t; msgT = d || 1.4; }
function nextTurn() {
  if (!alive(0).length || !alive(1).length) return endGame();
  turnTeam = 1 - turnTeam;
  const team = units.filter(u => u.team === turnTeam);
  do { idx[turnTeam] = (idx[turnTeam] + 1) % team.length; } while (!team[idx[turnTeam]].alive);
  const u = cur(); aimA = u.face > 0 ? -0.7 : -Math.PI + 0.7; power = 0; charging = false; weapon = 0; turnT = 30; walkLeft = 1.6;
  wind = K.rnd(-1, 1) * (0.6 + level * 0.2);
  phase = 'aim'; camT = u.x; say((turnTeam === 0 ? 'YOUR TURN: ' : 'CPU: ') + u.name.toUpperCase(), 1.4); hud();
  if (turnTeam === 1) { phase = 'cpu'; setTimeout(cpuTurn, 1200); }
}
function endGame() {
  state = 'over'; const win = alive(0).length > 0;
  if (win) { wins++; level++; try { localStorage.setItem('pa-barnyard-wins', wins); } catch (e) {} K.tune([523, 659, 784, 1047, 1319], 0.1); }
  else K.tune([392, 330, 262, 196], 0.15);
  setTimeout(() => K.card({ title: win ? 'GOATS WIN!' : 'ROOSTERS WIN', text: win ? 'The barnyard is yours! ' + alive(0).length + ' goat' + (alive(0).length === 1 ? '' : 's') + ' still standing. The roosters will aim better next time.' : 'Your squad got plucked. Regroup and try again!', best: 'WINS ' + wins, button: win ? 'Next battle' : 'Rematch', onStart: start }), 900);
}

// ---- terrain ----
const gAt = x => ground[K.clamp(Math.round(x), 0, WW - 1)];
function crater(cx, cy, r) {
  for (let x = Math.max(0, Math.floor(cx - r)); x <= Math.min(WW - 1, Math.ceil(cx + r)); x++) {
    const h = Math.sqrt(r * r - (x - cx) ** 2), bottom = cy + h;
    if (ground[x] < bottom && ground[x] > cy - h - 40) ground[x] = Math.min(WATER + 10, Math.max(ground[x], bottom));
  }
}
function explode(x, y, w) {
  crater(x, y, w.r); booms.push({ x, y, r: w.r, t: 0 }); K.noise(0.5, 0.45); K.beep(90, 0.3, { type: 'sawtooth', to: 40, vol: 0.06 });
  for (let i = 0; i < 18; i++) parts.push({ x, y, vx: K.rnd(-120, 120), vy: K.rnd(-160, -20), l: K.rnd(0.4, 1), c: i % 3 ? '#7a5230' : '#ffb02e' });
  for (const u of units) {
    if (!u.alive) continue;
    const d = Math.hypot(u.x - x, u.y - 6 - y);
    if (d < w.r + 8) {
      const dmg = Math.round(w.dmg * (1 - d / (w.r + 8)) + 5); u.hp = Math.max(0, u.hp - dmg);
      const a = Math.atan2(u.y - 6 - y, u.x - x); u.vx += Math.cos(a) * 120 * (1 - d / (w.r + 8)); u.vy += Math.sin(a) * 150 - 60; u.onG = false;
      parts.push({ x: u.x, y: u.y - 22, vx: 0, vy: -20, l: 1.2, txt: '-' + dmg, c: u.team ? '#ff8a5a' : '#7ee0ff' });
    }
  }
  hud();
}

// ---- shooting ----
function fire(u, a, p, wi) {
  const w = WEAPONS[wi]; if (ammo[u.team][wi] <= 0) return;
  ammo[u.team][wi]--;
  const sp = 90 + p * 260, x = u.x + Math.cos(a) * 10, y = u.y - 10 + Math.sin(a) * 10;
  shots.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, w: wi, fuse: w.fuse || 0, t: 0 });
  phase = 'fly'; K.beep(220, 0.15, { type: 'square', to: 500, vol: 0.06 });
}
function stepShot(s, dt) {
  s.t += dt; s.vx += wind * 40 * dt; s.vy += G * dt;
  const n = 4;
  for (let i = 0; i < n; i++) {
    s.x += s.vx * dt / n; s.y += s.vy * dt / n;
    if (s.x < -60 || s.x > WW + 60 || s.y > WATER + 8) { if (s.y > WATER) splash(s.x); return 'gone'; }
    let hitUnit = WEAPONS[s.w].fuse ? null : units.find(u => u.alive && s.t > 0.1 && Math.hypot(u.x - s.x, u.y - 7 - s.y) < 8);
    if (s.y >= gAt(s.x) || hitUnit) {
      if (s.w === 1) { // grenade bounces until the fuse runs out
        s.y = gAt(s.x) - 1; const sl = gAt(s.x + 2) - gAt(s.x - 2); s.vy = -Math.abs(s.vy) * 0.45; s.vx = s.vx * 0.6 - sl * 6; if (Math.abs(s.vy) > 30) K.beep(400, 0.03, { vol: 0.03 }); break;
      }
      if (s.w === 2) { // airstrike flare: bombs drop along the line
        for (let k = -2; k <= 2; k++) shots.push({ x: s.x + k * 22, y: -40 - Math.abs(k) * 25, vx: wind * 10, vy: 60, w: 0, bomb: true, t: 0 });
        K.beep(1200, 0.4, { type: 'sine', to: 400, vol: 0.05 }); return 'gone';
      }
      explode(s.x, s.y, s.bomb ? WEAPONS[2] : WEAPONS[s.w]); return 'gone';
    }
  }
  if (s.w === 1) { s.fuse -= dt; if (s.fuse <= 0) { explode(s.x, s.y, WEAPONS[1]); return 'gone'; } }
}
function splash(x) { K.noise(0.3, 0.2); for (let i = 0; i < 12; i++) parts.push({ x, y: WATER, vx: K.rnd(-40, 40), vy: K.rnd(-120, -40), l: 0.6, c: '#9fd6ff' }); }
function simulate(u, a, p, wi) {
  const sp = 90 + p * 260; let x = u.x + Math.cos(a) * 10, y = u.y - 10 + Math.sin(a) * 10, vx = Math.cos(a) * sp, vy = Math.sin(a) * sp;
  for (let i = 0; i < 400; i++) { const dt = 0.02; vx += wind * 40 * dt; vy += G * dt; x += vx * dt; y += vy * dt; if (x < 0 || x > WW || y > WATER) return null; if (y >= gAt(x)) return { x, y }; for (const e of units) if (e.alive && e.team !== u.team && Math.hypot(e.x - x, e.y - 7 - y) < 8) return { x, y }; }
  return null;
}
function cpuTurn() {
  if (state !== 'play' || phase !== 'cpu') return;
  const u = cur(), foes = alive(0); if (!u || !foes.length) return;
  const tgt = foes.sort((a, b) => a.hp - b.hp + (Math.abs(a.x - u.x) - Math.abs(b.x - u.x)) * 0.05)[0];
  let wi = 0; if (ammo[1][2] > 0 && Math.random() < 0.25) wi = 2; else if (ammo[1][1] > 0 && Math.abs(tgt.x - u.x) < 160 && Math.random() < 0.4) wi = 1;
  let bestS = null, bd = 1e9; const dir = tgt.x < u.x ? -1 : 1;
  for (let ang = 10; ang <= 80; ang += 5) for (let p = 0.2; p <= 1; p += 0.05) {
    const a = dir > 0 ? -ang * Math.PI / 180 : -Math.PI + ang * Math.PI / 180, hit = simulate(u, a, p, wi);
    if (!hit) continue; const d = Math.hypot(hit.x - tgt.x, hit.y - tgt.y) + (Math.abs(hit.x - u.x) < 30 ? 200 : 0);
    if (d < bd) { bd = d; bestS = { a, p }; }
  }
  if (!bestS) bestS = { a: dir > 0 ? -0.8 : -Math.PI + 0.8, p: 0.6 };
  const err = Math.max(0.02, 0.12 - level * 0.02);
  u.face = dir; aimA = bestS.a + K.rnd(-err, err) * 0.6; power = K.clamp(bestS.p + K.rnd(-err, err), 0.1, 1); weapon = wi;
  phase = 'cpuAim'; setTimeout(() => { if (state === 'play' && phase === 'cpuAim') fire(u, aimA, power, weapon); }, 900);
}

function update(dt) {
  if (state !== 'play') return;
  if (msgT > 0) msgT -= dt;
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; if (!p.txt) p.vy += 300 * dt; p.l -= dt; } parts = parts.filter(p => p.l > 0);
  for (const b of booms) b.t += dt; booms = booms.filter(b => b.t < 0.5);
  // units fall and slide
  let moving = false;
  for (const u of units) {
    if (!u.alive) continue;
    const gy = gAt(u.x);
    if (!u.onG || u.y < gy - 1) {
      u.onG = false; u.vy += G * dt; u.x += u.vx * dt; u.y += u.vy * dt; u.x = K.clamp(u.x, 4, WW - 4); moving = true;
      if (u.y >= gAt(u.x)) { u.y = gAt(u.x); if (u.vy > 220) { const d = Math.round((u.vy - 220) / 6); u.hp = Math.max(0, u.hp - d); parts.push({ x: u.x, y: u.y - 22, vx: 0, vy: -20, l: 1, txt: '-' + d, c: '#fff' }); } u.vx = 0; u.vy = 0; u.onG = true; }
    } else u.y = gy;
    if (u.y > WATER - 2) { u.alive = false; splash(u.x); say(u.name.toUpperCase() + ' SANK!', 1.4); hud(); }
    if (u.alive && u.hp <= 0) { u.alive = false; say(u.name.toUpperCase() + ' IS OUT!', 1.4); K.tune([330, 262, 196], 0.1); hud(); }
  }
  const u = cur();
  if (phase === 'aim' && u && u.alive) {
    turnT -= dt; if (turnT <= 0) { say('OUT OF TIME'); phase = 'settle'; settleT = 0.5; }
    const mv = (K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0);
    if (mv && walkLeft > 0 && u.onG && !charging) {
      const nx = u.x + mv * 32 * dt; if (gAt(nx) > u.y - 5) { u.x = K.clamp(nx, 6, WW - 6); u.y = gAt(u.x); walkLeft -= dt; }
      if (u.face !== mv) { u.face = mv; aimA = Math.PI - aimA; }
    }
    const av = (K.down('up') ? 1 : 0) - (K.down('down') ? 1 : 0);
    if (av) aimA += (u.face > 0 ? -av : av) * 1.4 * dt;
    if (u.face > 0) aimA = K.clamp(aimA, -Math.PI / 2 + 0.02, 0.6); else aimA = K.clamp(aimA, -Math.PI - 0.6, -Math.PI / 2 - 0.02);
    if (K.hit('b')) { do { weapon = (weapon + 1) % 3; } while (ammo[0][weapon] <= 0); K.beep(700, 0.04, { vol: 0.04 }); }
    // touch: drag on the battlefield to aim and power, let go to fire
    if (K.ptr.down) { const sx = u.x - cam, sy = u.y - 10, dx = K.ptr.x - sx, dy = K.ptr.y - sy; if (Math.hypot(dx, dy) > 12) { aimA = Math.atan2(dy, dx); u.face = dx < 0 ? -1 : 1; power = K.clamp((Math.hypot(dx, dy) - 12) / 110, 0, 1); charging = 'touch'; } }
    else if (charging === 'touch') { charging = false; if (power > 0.05) fire(u, aimA, power, weapon); }
    if (K.down('a')) { charging = true; power = Math.min(1, power + dt * 0.7); }
    else if (charging === true) { charging = false; fire(u, aimA, power, weapon); }
    camT = u.x;
  }
  if (phase === 'fly' || phase === 'settle') {
    for (const s of shots) if (stepShot(s, dt) === 'gone') s.dead = true;
    shots = shots.filter(s => !s.dead);
    if (shots.length) camT = shots[0].x;
    if (phase === 'fly' && !shots.length) { phase = 'settle'; settleT = 0.9; }
    if (phase === 'settle' && !shots.length && !moving) { settleT -= dt; if (settleT <= 0) nextTurn(); }
  }
  if (phase === 'cpu' || phase === 'cpuAim') camT = u ? u.x : camT;
  cam += (K.clamp(camT - W / 2, 0, WW - W) - cam) * Math.min(1, dt * 4);
}

function drawUnit(c, u, t, active) {
  const x = u.x - cam, y = u.y, f = u.face;
  c.save(); c.translate(x, y); c.scale(f, 1);
  if (u.team === 0) {
    // goat
    c.fillStyle = '#e8e2d6'; c.beginPath(); c.ellipse(0, -7, 7, 5, 0, 0, 7); c.fill();
    c.fillStyle = '#6a5a48'; c.fillRect(-5, -3, 2, 4); c.fillRect(3, -3, 2, 4);
    c.fillStyle = '#e8e2d6'; c.beginPath(); c.ellipse(6, -13, 4, 3.5, 0.3, 0, 7); c.fill();
    c.fillStyle = '#b8a888'; c.beginPath(); c.moveTo(6, -10); c.lineTo(7, -6); c.lineTo(8, -10); c.fill();
    c.fillStyle = '#3a6ad8'; c.beginPath(); c.ellipse(5, -16, 4.5, 2.6, 0, Math.PI, 0); c.fill(); c.fillRect(1, -16, 9, 1.5);
    c.fillStyle = '#222'; c.fillRect(8, -14, 1.5, 1.5);
  } else {
    // rooster
    c.fillStyle = '#c8502c'; c.beginPath(); c.ellipse(0, -7, 6, 6, 0, 0, 7); c.fill();
    c.fillStyle = '#2a6a3a'; c.beginPath(); c.moveTo(-5, -9); c.lineTo(-11, -16); c.lineTo(-8, -6); c.fill();
    c.fillStyle = '#ffb02e'; c.fillRect(-2, -1, 1.5, 3); c.fillRect(2, -1, 1.5, 3);
    c.fillStyle = '#e8e2d6'; c.beginPath(); c.arc(4, -14, 3.5, 0, 7); c.fill();
    c.fillStyle = '#ffb02e'; c.beginPath(); c.moveTo(7, -14); c.lineTo(10, -13); c.lineTo(7, -12); c.fill();
    c.fillStyle = '#d83a3a'; c.beginPath(); c.ellipse(4, -17, 4.2, 2.4, 0, Math.PI, 0); c.fill(); c.fillRect(0, -17, 8, 1.5);
    c.fillStyle = '#222'; c.fillRect(5, -15, 1.5, 1.5);
  }
  c.restore();
  K.text(c, String(u.hp), x, y - 26, 7, u.team ? '#ffb08a' : '#9fd6ff');
  if (active) { c.fillStyle = '#ffd23f'; c.beginPath(); c.moveTo(x - 4, y - 38 + Math.sin(t / 150) * 2); c.lineTo(x + 4, y - 38 + Math.sin(t / 150) * 2); c.lineTo(x, y - 33 + Math.sin(t / 150) * 2); c.fill(); }
}
function draw(c, t) {
  const cm = cam || 0;
  A.sky(c, W, H, { top: '#3a7ad8', mid: '#8ac8f8', bottom: '#e8f6ff', sun: '#fff6c0', sunY: 40 }, t);
  A.ridge(c, cm, { factor: 0.12, base: 115, amp: 30, col: '#a8c8b0', edge: 'rgba(0,0,0,.12)', seed: 2, fog: 'rgba(230,245,255,.4)' });
  A.ridge(c, cm, { factor: 0.3, base: 135, amp: 22, col: '#7ab07a', edge: 'rgba(0,0,0,.2)', seed: 5 });
  A.trees(c, cm, { factor: 0.3, base: 138, col: '#3a7a3a', hi: '#5a9a4a', kind: 'round', spacing: 38, size: 0.8 });
  // barn in the distance
  const bx = 300 - cm * 0.3; c.fillStyle = '#b83a2a'; c.fillRect(bx, 92, 34, 26); c.beginPath(); c.moveTo(bx - 3, 93); c.lineTo(bx + 17, 78); c.lineTo(bx + 37, 93); c.fill(); c.fillStyle = '#fff'; c.fillRect(bx + 12, 102, 10, 16);
  if (!ground) { c.fillStyle = '#6a8f3a'; c.fillRect(0, 160, W, 80); return; }
  // terrain
  c.fillStyle = '#7a5230'; c.beginPath(); c.moveTo(0, H);
  for (let sx = 0; sx <= W; sx += 2) c.lineTo(sx, gAt(sx + cm)); c.lineTo(W, H); c.fill();
  c.save(); c.beginPath(); c.moveTo(0, H); for (let sx = 0; sx <= W; sx += 2) c.lineTo(sx, gAt(sx + cm)); c.lineTo(W, H); c.closePath(); c.clip();
  for (let ty = 0; ty < H / 16 + 1; ty++) for (let x = -((cm | 0) % 16) - 16; x < W; x += 16) A.tile(c, 'bb', x, ty * 16, { t: false, b: false, l: false, r: false }, Math.floor((x + cm) / 16), ty, A.PAL.earth);
  c.restore();
  c.strokeStyle = A.INK; c.lineWidth = 6; c.beginPath(); for (let sx = 0; sx <= W; sx += 2) { const y = gAt(sx + cm); sx ? c.lineTo(sx, y + 1) : c.moveTo(sx, y + 1); } c.stroke();
  c.strokeStyle = '#4caa3a'; c.lineWidth = 4.5; c.stroke(); c.strokeStyle = '#7ad65a'; c.lineWidth = 1.5; c.beginPath(); for (let sx = 0; sx <= W; sx += 2) { const y = gAt(sx + cm); sx ? c.lineTo(sx, y - 0.5) : c.moveTo(sx, y - 0.5); } c.stroke();
  c.fillStyle = 'rgba(0,0,0,.12)'; for (let sx = 0; sx < W; sx += 14) c.fillRect(sx + ((cm | 0) % 14 ? 0 : 0), gAt(sx + cm) + 12 + (sx * 7) % 20, 4, 3);
  // water
  c.fillStyle = '#2a6fb8'; c.fillRect(0, WATER, W, H - WATER); c.fillStyle = 'rgba(255,255,255,.4)'; for (let x = -((t / 30) % 16); x < W; x += 16) c.fillRect(x, WATER + Math.sin(t / 300 + x) * 1.5, 8, 2);
  const u = cur();
  for (const v of units) if (v.alive) drawUnit(c, v, t, v === u && (phase === 'aim' || phase === 'cpu' || phase === 'cpuAim'));
  // aim line
  if (u && u.alive && (phase === 'aim' || phase === 'cpuAim')) {
    const sx = u.x - cm, sy = u.y - 10;
    c.fillStyle = 'rgba(255,255,255,.8)'; for (let d = 14; d < 40; d += 5) c.fillRect(sx + Math.cos(aimA) * d - 1, sy + Math.sin(aimA) * d - 1, 2, 2);
    c.strokeStyle = '#ffd23f'; c.lineWidth = 1.5; c.beginPath(); c.arc(sx + Math.cos(aimA) * 44, sy + Math.sin(aimA) * 44, 4, 0, 7); c.stroke();
    c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(sx - 15, sy + 16, 30, 4); c.fillStyle = power > 0.8 ? '#ff5a36' : '#ffd23f'; c.fillRect(sx - 15, sy + 16, 30 * power, 4);
  }
  for (const s of shots) { const x = s.x - cm; if (s.w === 1) { c.fillStyle = '#3a5a2a'; c.beginPath(); c.arc(x, s.y, 3, 0, 7); c.fill(); } else if (s.w === 2) { c.fillStyle = '#ff3b3b'; c.fillRect(x - 1.5, s.y - 1.5, 3, 3); } else { c.save(); c.translate(x, s.y); c.rotate(Math.atan2(s.vy, s.vx)); c.fillStyle = '#444'; c.fillRect(-5, -1.5, 10, 3); c.fillStyle = '#ffb02e'; c.fillRect(-8, -1, 3, 2); c.restore(); } }
  for (const b of booms) { c.fillStyle = 'rgba(255,' + (200 - b.t * 300 | 0) + ',60,' + (1 - b.t * 2) + ')'; c.beginPath(); c.arc(b.x - cm, b.y, b.r * (0.5 + b.t * 1.5), 0, 7); c.fill(); }
  for (const p of parts) { if (p.txt) K.text(c, p.txt, p.x - cm, p.y, 9, p.c); else { c.fillStyle = p.c; c.fillRect(p.x - cm - 1, p.y - 1, 3, 3); } }
  // info bar
  if (state === 'play' && turnTeam === 0) {
    c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(4, 4, 120, 16); K.text(c, WEAPONS[weapon].n + (ammo[0][weapon] < 50 ? ' x' + ammo[0][weapon] : ''), 64, 12, 8, '#ffd23f', 'center');
    if (phase === 'aim') K.text(c, Math.ceil(turnT) + 's', 140, 12, 8, '#fff');
  }
  c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(W - 76, 4, 72, 16);
  K.text(c, 'WIND', W - 58, 12, 7, '#fff'); c.fillStyle = '#9fd6ff'; c.fillRect(W - 38, 10, wind * 16, 4);
  if (msgT > 0) K.text(c, msg, W / 2, 42, 13, '#fff');
}
title();
