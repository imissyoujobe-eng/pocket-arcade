<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Critter Quest</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/td.js"></script>
<script src="../lib/art.js"></script>
<script>
// Critter Quest: pick a partner critter, catch wild ones in the tall grass, and beat the three trainers to become champion.
K.theme({ bg: '#101a10', ink: '#fffaf0', accent: '#ffd23f', accentInk: '#2a1d00' });
const VW = 256, VH = 192, T = 16;
K.screen(VW, VH);
K.hud(['badges', 'orbs', 'party']);
K.pad({ dpad: '4', buttons: [{ id: 'b', label: 'BACK' }, { id: 'a', label: 'OK' }] });
const MAP = ["TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT", "T..............T,,,,,,,,,,,,,,,T", "T.HHHH...HHHH..T,,,,..,,,,,,,,,T", "T.HHHH...HHHH..T,,,,..,,,TT,,,,T", "T.HHdH...HHCH..T,,,,..,,,TT,,,,T", "T..............T,,,,........,,,T", "T..............A.....,,,,...,,,T", "T...TTT..TTT...........,,,,..1.T", "T.....GGGG.....T,,,,,,,,,,,,,,,T", "T.....H..H.....T,,,,,,,,,,,,,,,T", "T.....HH3H.....T,,,,,,,,,,,,,,,T", "TTTTTT....TTTTTTTTTTTT....TTTTTT", "TTTTTT....TTTTTTTTTTTT....TTTTTT", "T,,,,,,......,,T.......WWWWWWWWT", "T,,TT,,,,,,..,,T...,,..WWWWWWWWT", "T,,TT,,,,,,..,,T...,,,.WWWWWWWWT", "T,,,,,,,o,,..,,T...,,,...WWWWWWT", "T,,,,,,,,,,..........,,..WWWWWWT", "T,,,,TT,,,,..........,,....2.WWT", "T,,,,TT,,,,..,,T.......WWWWWWWWT", "T,,,,,,,,,,..,,T.......WWWWWWWWT", "T,,,,,,,,,,..,,T.......WWWWWWWWT", "T..,,,,,,,,..,,T.......WWWWWWWWT", "TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT"];

const TYPES = { fire: { col: '#ff6a3a', beats: 'leaf' }, water: { col: '#3a8aff', beats: 'fire' }, leaf: { col: '#4ad04a', beats: 'water' }, normal: { col: '#c8b8a0', beats: '' } };
const MOVES = {
  tackle: { n: 'Tackle', type: 'normal', pow: 35 }, peck: { n: 'Quick Peck', type: 'normal', pow: 45 },
  ember: { n: 'Ember', type: 'fire', pow: 42 }, blaze: { n: 'Blaze Dash', type: 'fire', pow: 65 },
  splash: { n: 'Bubble', type: 'water', pow: 42 }, surge: { n: 'Tide Surge', type: 'water', pow: 65 },
  vine: { n: 'Vine Snap', type: 'leaf', pow: 42 }, bloom: { n: 'Petal Storm', type: 'leaf', pow: 65 }
};
const SPECIES = {
  emberpup: { n: 'Emberpup', type: 'fire', hp: 20, atk: 11, def: 9, spd: 11, moves: ['tackle', 'ember', 'blaze'], col: '#ff8a3a', shape: 'pup' },
  tidekit: { n: 'Tidekit', type: 'water', hp: 22, atk: 10, def: 11, spd: 9, moves: ['tackle', 'splash', 'surge'], col: '#4aa8ff', shape: 'kit' },
  sproutle: { n: 'Sproutle', type: 'leaf', hp: 21, atk: 10, def: 10, spd: 10, moves: ['tackle', 'vine', 'bloom'], col: '#5ad06a', shape: 'sprout' },
  pebblit: { n: 'Pebblit', type: 'normal', hp: 18, atk: 9, def: 12, spd: 6, moves: ['tackle', 'peck'], col: '#a89888', shape: 'rock' },
  flitwing: { n: 'Flitwing', type: 'normal', hp: 15, atk: 10, def: 7, spd: 14, moves: ['peck', 'tackle'], col: '#c8a0ff', shape: 'bird' },
  mossnail: { n: 'Mossnail', type: 'leaf', hp: 20, atk: 8, def: 13, spd: 5, moves: ['tackle', 'vine'], col: '#7ab04a', shape: 'snail' },
  sparkfin: { n: 'Sparkfin', type: 'water', hp: 17, atk: 11, def: 8, spd: 12, moves: ['tackle', 'splash'], col: '#46d0ff', shape: 'fish' },
  cindermoth: { n: 'Cindermoth', type: 'fire', hp: 16, atk: 12, def: 7, spd: 13, moves: ['peck', 'ember'], col: '#ffb02e', shape: 'bird' },
  thornet: { n: 'Thornet', type: 'leaf', hp: 17, atk: 12, def: 8, spd: 12, moves: ['peck', 'vine', 'bloom'], col: '#3fa34d', shape: 'bug' }
};
const AREAS = [ // by screen: [sx,sy] -> wild list and level range
  { sx: 1, sy: 0, wild: ['pebblit', 'flitwing', 'thornet'], lv: [2, 4] },
  { sx: 0, sy: 1, wild: ['mossnail', 'cindermoth', 'thornet', 'pebblit'], lv: [4, 6] },
  { sx: 1, sy: 1, wild: ['sparkfin', 'flitwing', 'mossnail', 'cindermoth'], lv: [6, 8] }
];
const TRAINERS = {
  1: { n: 'RANGER ADA', team: [['thornet', 5], ['mossnail', 6]], hello: 'The tall grass made my critters tough. Let\'s battle!', bye: 'You earned the Leaf Badge!' },
  2: { n: 'CAPTAIN BO', team: [['sparkfin', 8], ['pebblit', 8], ['tidekit', 9]], hello: 'Ahoy! My crew has sailed every lake. Ready?', bye: 'You earned the Wave Badge!' },
  3: { n: 'CHAMPION CY', team: [['cindermoth', 11], ['thornet', 11], ['emberpup', 12]], hello: 'So you beat Ada and Bo. Show me what a champion looks like!', bye: 'Incredible... You are the new Critter Champion!' }
};

let state = 'title', w, p, cam, trans, party, orbs, badges, talk, menu, battle, beaten, steps, time, best = K.best('critter');
function mk(sp, lv) { const s = SPECIES[sp]; const c = { sp, n: s.n, type: s.type, lv, xp: 0 }; stats(c); c.hp = c.max; return c; }
function stats(c) { const s = SPECIES[c.sp]; c.max = s.hp + c.lv * 3; c.atk = s.atk + c.lv * 2; c.def = s.def + c.lv * 2; c.spd = s.spd + c.lv * 2; c.moves = s.moves.filter((m, i) => i < 2 || c.lv >= 7); }
function title() { K.card({ title: 'CRITTER QUEST', text: 'Choose a partner, then walk through tall grass to meet wild critters. Weaken them and throw a snare orb to catch them. Fire beats leaf, leaf beats water, water beats fire. Beat Ranger Ada and Captain Bo, then the Champion waits in town!', best: best ? 'BEST TIME ' + Math.floor(best / 60) + ':' + String(best % 60).padStart(2, '0') : '', button: 'Choose partner', onStart: start }); }
function start() {
  w = D.world(MAP); D.SOLID = 'THWGdC123';
  party = []; orbs = 5; badges = 0; beaten = {}; steps = 0; time = 0; battle = null; talk = null;
  p = { x: 7 * T + 2, y: 6 * T + 2, w: 12, h: 12, face: 'd' }; const s = D.screenOf(p.x, p.y); cam = D.camFor(s); trans = null;
  menu = { kind: 'starter', items: ['emberpup', 'tidekit', 'sproutle'], i: 0 };
  state = 'play'; hud();
}
function hud() { K.set('badges', 'BADGES ' + badges + '/3'); K.set('orbs', 'ORBS ' + orbs); K.set('party', party.map(c => c.n.slice(0, 4) + c.lv).join(' ')); }
function heal() { party.forEach(c => c.hp = c.max); }

// ---------- overworld ----------
function update(dt) {
  if (state !== 'play') return;
  time += dt;
  if (menu && menu.kind === 'starter') { if (K.hit('left')) menu.i = (menu.i + 2) % 3; if (K.hit('right')) menu.i = (menu.i + 1) % 3; if (K.ptr.tapped) menu.i = K.clamp(Math.floor(K.ptr.x / (VW / 3)), 0, 2); if (K.hit('a') || (K.ptr.tapped && K.ptr.y > 60)) { const sp = menu.items[menu.i]; party.push(mk(sp, 5)); menu = null; hud(); K.tune([523, 659, 784, 1047], 0.1); talk = { lines: ['You chose ' + SPECIES[sp].n + '! It looks happy to see you.', 'The critter center (the door with the red sign) heals your team for free.'] }; } return; }
  if (battle) return battleUpdate(dt);
  if (talk) { if (K.hit('a') || K.hit('b') || K.ptr.tapped) { talk.lines.shift(); if (!talk.lines.length) { const d = talk.done; talk = null; if (d) d(); } } return; }
  if (trans) { trans.t += dt / 0.4; cam.x = trans.fx + (trans.tx - trans.fx) * Math.min(1, trans.t); cam.y = trans.fy + (trans.ty - trans.fy) * Math.min(1, trans.t); if (trans.t >= 1) trans = null; return; }
  const d = D.input(p);
  if (d[0] || d[1]) {
    const ox = Math.floor((p.x + 6) / T), oy = Math.floor((p.y + 6) / T);
    D.move(w, p, d[0] * 70 * dt, 0); D.move(w, p, 0, d[1] * 70 * dt); p.walk = (p.walk || 0) + dt;
    const nx = Math.floor((p.x + 6) / T), ny = Math.floor((p.y + 6) / T);
    if ((nx !== ox || ny !== oy) && D.tile(w, p.x + 6, p.y + 6) === ',' && Math.random() < 0.13) wildBattle();
    if (D.tile(w, p.x + 6, p.y + 6) === 'o') { D.set(w, nx, ny, ','); orbs += 5; hud(); K.tune([784, 988], 0.07); talk = { lines: ['You found 5 snare orbs!'] }; }
  }
  if (K.hit('a')) interact();
  const s = D.screenOf(p.x + 6, p.y + 6), c2 = D.camFor(s);
  if (c2.x !== cam.x || c2.y !== cam.y) trans = { fx: cam.x, fy: cam.y, tx: c2.x, ty: c2.y, t: 0 };
}
function interact() {
  const v = D.faceVec(p.face), fx = p.x + 6 + v[0] * 14, fy = p.y + 6 + v[1] * 14, ch = D.tile(w, fx, fy);
  if (ch === 'C' || ch === 'd') { heal(); K.tune([659, 784, 988, 1319], 0.08); talk = { lines: [ch === 'C' ? 'CRITTER CENTER: Your team is fully healed! Here are some spare orbs.' : 'Mom: You look tired! Rest up. (Team healed.)'] }; if (ch === 'C') { orbs = Math.max(orbs, 5); hud(); } return; }
  if (ch === 'G') { talk = { lines: [badges >= 2 ? 'The arena gate is open.' : 'ARENA: Only trainers with 2 badges may challenge the Champion.'] }; return; }
  if ('123'.includes(ch)) { const id = +ch; const tr = TRAINERS[id]; if (beaten[id]) { talk = { lines: [tr.n + ': Great battle! Keep training.'] }; return; } if (!party.some(c => c.hp > 0)) { talk = { lines: ['Your team needs healing first!'] }; return; } talk = { lines: [tr.n + ': ' + tr.hello], done: () => startBattle(tr.team.map(t => mk(t[0], t[1])), id) }; }
}
function wildBattle() {
  const s = D.screenOf(p.x + 6, p.y + 6), a = AREAS.find(a => a.sx === s.sx && a.sy === s.sy); if (!a || !party.some(c => c.hp > 0)) return;
  startBattle([mk(a.wild[K.ri(0, a.wild.length - 1)], K.ri(a.lv[0], a.lv[1]))], 0);
}

// ---------- battle ----------
function startBattle(foes, trainer) {
  battle = { foes, foe: foes[0], trainer, me: party.find(c => c.hp > 0), mode: 'menu', sel: 0, msgs: [], anim: 0 };
  battle.msgs.push(trainer ? TRAINERS[trainer].n + ' sends out ' + battle.foe.n + '!' : 'A wild ' + battle.foe.n + ' appeared!');
  battle.msgs.push('Go, ' + battle.me.n + '!'); battle.mode = 'msg';
  K.tune([392, 523, 392, 659], 0.08, { type: 'square' });
}
function mult(mt, def) { const a = TYPES[mt]; if (a.beats === def) return 2; if (TYPES[def] && TYPES[def].beats === mt) return 0.5; return 1; }
function damage(att, def, mv) { const m = MOVES[mv]; const stab = SPECIES[att.sp].type === m.type ? 1.25 : 1; const k = mult(m.type, def.type); return { d: Math.max(1, Math.floor(((2 * att.lv / 5 + 2) * m.pow * att.atk / def.def / 50 + 2) * stab * k * K.rnd(0.85, 1))), k }; }
function useMove(att, def, mv, mine) {
  const r = damage(att, def, mv); def.hp = Math.max(0, def.hp - r.d); battle.shake = mine ? 'foe' : 'me'; battle.anim = 0.4;
  battle.msgs.push((mine ? '' : 'Foe ') + att.n + ' used ' + MOVES[mv].n + '!'); if (r.k > 1) battle.msgs.push('It\'s super effective!'); if (r.k < 1) battle.msgs.push('It\'s not very effective...');
  K.beep(r.k > 1 ? 200 : 300, 0.15, { type: 'square', vol: 0.06 });
}
function foeTurn() { const b = battle; if (b.foe.hp <= 0) return; const mv = b.foe.moves[K.ri(0, b.foe.moves.length - 1)]; useMove(b.foe, b.me, mv, false); }
function playerAct(act) {
  const b = battle;
  if (act.kind === 'move') {
    const meFirst = b.me.spd >= b.foe.spd;
    if (meFirst) { useMove(b.me, b.foe, act.mv, true); if (b.foe.hp > 0) foeTurn(); }
    else { foeTurn(); if (b.me.hp > 0) useMove(b.me, b.foe, act.mv, true); }
  } else if (act.kind === 'orb') {
    if (b.trainer) { b.msgs.push('You can\'t catch a trainer\'s critter!'); }
    else if (orbs <= 0) { b.msgs.push('You are out of snare orbs!'); }
    else {
      orbs--; hud(); const chance = (1 - b.foe.hp / b.foe.max) * 0.75 + 0.18;
      b.msgs.push('You threw a snare orb...');
      if (Math.random() < chance) { b.msgs.push('Gotcha! ' + b.foe.n + ' was caught!'); if (party.length < 4) { party.push(b.foe); b.msgs.push(b.foe.n + ' joined your team.'); } else b.msgs.push('Your team is full, so it was set free with a wave.'); b.caught = true; K.tune([523, 659, 784, 1047], 0.08); hud(); }
      else { b.msgs.push('Oh no! It broke free!'); foeTurn(); }
    }
  } else if (act.kind === 'swap') { b.me = act.c; b.msgs.push('Go, ' + b.me.n + '!'); foeTurn(); }
  else if (act.kind === 'run') { if (b.trainer) b.msgs.push('You can\'t run from a trainer battle!'); else if (Math.random() < 0.8) { b.msgs.push('You got away safely.'); b.fled = true; } else { b.msgs.push('Couldn\'t get away!'); foeTurn(); } }
  b.mode = 'msg';
}
function afterMsgs() {
  const b = battle;
  if (b.caught || b.fled) return endBattle(false);
  if (b.foe.hp <= 0) {
    const xp = b.foe.lv * 10 * (b.trainer ? 1.5 : 1) | 0; b.me.xp += xp; b.msgs.push(b.foe.n + ' fainted! ' + b.me.n + ' gained ' + xp + ' XP.');
    while (b.me.xp >= 20 + b.me.lv * 15) { b.me.xp -= 20 + b.me.lv * 15; b.me.lv++; const old = b.me.moves.length; stats(b.me); b.me.hp = Math.min(b.me.max, b.me.hp + 5); b.msgs.push(b.me.n + ' grew to level ' + b.me.lv + '!'); if (b.me.moves.length > old) b.msgs.push(b.me.n + ' learned ' + MOVES[b.me.moves[b.me.moves.length - 1]].n + '!'); K.tune([659, 784, 988], 0.07); }
    const next = b.foes.find(f => f.hp > 0);
    if (next) { b.foe = next; b.msgs.push(TRAINERS[b.trainer].n + ' sends out ' + next.n + '!'); b.mode = 'msg'; return; }
    b.won = true; if (b.trainer) { b.msgs.push(TRAINERS[b.trainer].bye); } b.mode = 'msg'; b.finish = true; return;
  }
  if (b.me.hp <= 0) {
    if (!b.swapNote) { b.swapNote = 1; b.msgs.push(b.me.n + ' fainted!'); b.mode = 'msg'; return; }
    b.swapNote = 0;
    const alt = party.find(c => c.hp > 0);
    if (alt) { b.mode = 'swapForced'; b.sel = party.indexOf(alt); }
    else { b.msgs.push('You have no critters left... You hurry back to the critter center.'); b.lost = true; b.finish = true; }
    return;
  }
  b.mode = 'menu'; b.sel = 0;
}
function endBattle() {
  const b = battle; battle = null; hud();
  if (b.won && b.trainer) { beaten[b.trainer] = true; badges = Object.keys(beaten).filter(k => k < 3).length; hud(); if (b.trainer === 3) return win(); if (badges >= 2) { for (let y = 0; y < w.rows; y++) for (let x = 0; x < w.cols; x++) if (w.g[y][x] === 'G') w.g[y][x] = '.'; talk = { lines: ['You have two badges! The arena gate in town is now open.'] }; } }
  if (b.lost) { heal(); p.x = 11 * T + 2; p.y = 5 * T + 2; const s = D.screenOf(p.x, p.y); cam = D.camFor(s); }
}
function battleUpdate(dt) {
  const b = battle; if (b.anim > 0) b.anim -= dt;
  if (b.mode === 'msg') { if (K.hit('a') || K.hit('b') || K.ptr.tapped) { b.msgs.shift(); K.beep(700, 0.03, { vol: 0.03 }); if (!b.msgs.length) { if (b.finish) return endBattle(); afterMsgs(); } } return; }
  const opts = optsFor(b);
  if (K.hit('up')) b.sel = (b.sel + opts.length - (opts.length > 2 ? 2 : 1)) % opts.length;
  if (K.hit('down')) b.sel = (b.sel + (opts.length > 2 ? 2 : 1)) % opts.length;
  if (K.hit('left')) b.sel = (b.sel + opts.length - 1) % opts.length;
  if (K.hit('right')) b.sel = (b.sel + 1) % opts.length;
  if (K.ptr.tapped) { const r = optRects(opts); r.forEach((rc, i) => { if (K.ptr.x > rc.x && K.ptr.x < rc.x + rc.w && K.ptr.y > rc.y && K.ptr.y < rc.y + rc.h) { if (b.sel === i) choose(opts[i]); b.sel = i; } }); }
  if (K.hit('a')) choose(opts[b.sel]);
  if (K.hit('b') && (b.mode === 'fight' || b.mode === 'swap')) { b.mode = 'menu'; b.sel = 0; }
}
function optsFor(b) {
  if (b.mode === 'menu') return [{ t: 'FIGHT', a: 'fight' }, { t: 'TEAM', a: 'swap' }, { t: 'ORB x' + orbs, a: 'orb' }, { t: 'RUN', a: 'run' }];
  if (b.mode === 'fight') return b.me.moves.map(m => ({ t: MOVES[m].n, a: 'mv', mv: m }));
  if (b.mode === 'swap' || b.mode === 'swapForced') return party.map(c => ({ t: c.n + ' ' + c.hp + '/' + c.max, a: 'sw', c, dis: c.hp <= 0 || c === b.me }));
  return [];
}
function choose(o) {
  const b = battle; if (!o || o.dis) { K.beep(150, 0.05, { vol: 0.04 }); return; }
  K.beep(800, 0.03, { vol: 0.03 });
  if (o.a === 'fight') { b.mode = 'fight'; b.sel = 0; }
  else if (o.a === 'swap') { b.mode = 'swap'; b.sel = 0; }
  else if (o.a === 'orb') playerAct({ kind: 'orb' });
  else if (o.a === 'run') playerAct({ kind: 'run' });
  else if (o.a === 'mv') playerAct({ kind: 'move', mv: o.mv });
  else if (o.a === 'sw') { if (b.mode === 'swapForced') { b.me = o.c; b.msgs.push('Go, ' + o.c.n + '!'); b.mode = 'msg'; } else playerAct({ kind: 'swap', c: o.c }); }
}
function optRects(opts) { return opts.map((o, i) => ({ x: 8 + (i % 2) * 122, y: VH - 52 + Math.floor(i / 2) * 22, w: 118, h: 20 })); }
function win() { state = 'over'; const tt = Math.floor(time); best = K.saveBest('critter', tt, true); K.tune([523, 659, 784, 1047, 1319, 1568], 0.12); K.card({ title: 'CHAMPION!', text: 'You beat all three trainers with a team of ' + party.length + ' in ' + Math.floor(tt / 60) + ' minutes.', best: 'BEST TIME ' + Math.floor(best / 60) + ':' + String(best % 60).padStart(2, '0'), button: 'New adventure', onStart: start }); }

// ---------- drawing ----------
function critter(c, sp, x, y, s, flip) {
  const S = SPECIES[sp], col = S.col; c.save(); c.translate(x, y); c.scale(flip ? -s : s, s);
  c.fillStyle = 'rgba(0,0,0,.2)'; c.beginPath(); c.ellipse(0, 14, 14, 4, 0, 0, 7); c.fill();
  c.fillStyle = col;
  switch (S.shape) {
    case 'pup': c.beginPath(); c.ellipse(0, 4, 12, 9, 0, 0, 7); c.fill(); c.beginPath(); c.arc(8, -6, 8, 0, 7); c.fill(); c.beginPath(); c.moveTo(4, -12); c.lineTo(6, -20); c.lineTo(9, -12); c.fill(); c.beginPath(); c.moveTo(10, -12); c.lineTo(13, -19); c.lineTo(15, -10); c.fill(); c.fillStyle = '#ffd23f'; c.beginPath(); c.moveTo(-12, 0); c.lineTo(-20, -8); c.lineTo(-16, 4); c.fill(); break;
    case 'kit': c.beginPath(); c.ellipse(0, 4, 12, 10, 0, 0, 7); c.fill(); c.beginPath(); c.arc(6, -6, 8, 0, 7); c.fill(); c.fillStyle = '#c8e8ff'; c.beginPath(); c.ellipse(0, 7, 7, 5, 0, 0, 7); c.fill(); c.fillStyle = col; c.beginPath(); c.ellipse(-14, 0, 6, 3, -0.5, 0, 7); c.fill(); break;
    case 'sprout': c.beginPath(); c.ellipse(0, 5, 11, 9, 0, 0, 7); c.fill(); c.fillStyle = '#3a8a2a'; c.beginPath(); c.ellipse(-5, -10, 4, 8, -0.6, 0, 7); c.fill(); c.beginPath(); c.ellipse(5, -10, 4, 8, 0.6, 0, 7); c.fill(); break;
    case 'rock': c.beginPath(); c.moveTo(-12, 12); c.lineTo(-10, -4); c.lineTo(0, -10); c.lineTo(11, -2); c.lineTo(12, 12); c.fill(); break;
    case 'bird': c.beginPath(); c.ellipse(0, 2, 9, 8, 0, 0, 7); c.fill(); c.beginPath(); c.ellipse(-8, -4, 9, 4, -0.6, 0, 7); c.fill(); c.fillStyle = '#ffd23f'; c.beginPath(); c.moveTo(8, 0); c.lineTo(15, 2); c.lineTo(8, 4); c.fill(); break;
    case 'snail': c.fillStyle = '#c8b090'; c.fillRect(-12, 6, 24, 6); c.fillStyle = col; c.beginPath(); c.arc(-2, 0, 9, 0, 7); c.fill(); c.strokeStyle = '#3a6a2a'; c.beginPath(); c.arc(-2, 0, 5, 0, 5); c.stroke(); c.fillStyle = '#c8b090'; c.fillRect(9, -4, 3, 10); break;
    case 'fish': c.beginPath(); c.ellipse(0, 2, 12, 7, 0, 0, 7); c.fill(); c.beginPath(); c.moveTo(-10, 2); c.lineTo(-18, -6); c.lineTo(-18, 10); c.fill(); c.fillStyle = '#ffd23f'; c.fillRect(-2, -8, 4, 5); break;
