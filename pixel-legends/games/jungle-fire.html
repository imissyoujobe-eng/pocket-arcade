<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jungle Fire</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/plat.js"></script>
<script src="../lib/art.js"></script>
<script>
// Jungle Fire: run and gun through three stages. Aim in eight directions, grab weapon capsules and take down the fortress wall at the end of each stage.
K.theme({ bg: '#0c140a', ink: '#fffaf0', accent: '#ff5a36', accentInk: '#fff' });
const VW = 320, VH = 240, T = 16;
K.screen(VW, VH);
K.hud(['score', 'gun', 'lives']);
K.pad({ dpad: '4', buttons: [{ id: 'b', label: 'FIRE' }, { id: 'a', label: 'JUMP' }] });

const E = '................', G = '################';
const CH = {
  start: [E, E, E, E, E, E, E, E, E, E, E, E, '.S..............', G, G],
  run: [E, E, E, E, E, E, E, E, E, '.........====...', E, '...s............', '..........s.....', G, G],
  ledges: [E, E, E, E, E, E, '..........n.....', '.........====...', E, '....====........', E, E, '.c..........s...', G, G],
  water: [E, E, E, E, E, E, E, E, E, E, E, '...===....===...', '.....s..........', '##~~~~~~~~~~~~##', '##~~~~~~~~~~~~##'],
  bunker: [E, E, E, E, E, E, E, '........HHHH....', '........t..H....', '...........H....', '.......n........', '.....====.......', '..s...........s.', G, G],
  cliffs: [E, E, E, E, '.......n........', '......HHHH......', E, '...===..........', '...........c....', E, '....===...====..', E, '..........s.....', G, G],
  boss: ['........................', '........................', '........................', '........................', '................HHHHHHHH', '................HHHHHHHH', '................HHHHHHHH', '................HHHHHHHH', '................HHHHHHHH', '................HHHHHHHH', '................HHHHHHHH', '................HHHHHHHH', '..s.............HHHHHHHH', '########################', '########################']
};
const STAGES = [
  { n: 'Jungle', sky: '#1a3a2a', g: '#4a3a1a', top: '#3fa34d', chunks: ['start', 'run', 'ledges', 'water', 'run', 'bunker', 'ledges', 'boss'] },
  { n: 'Canyon Base', sky: '#6a3a2a', g: '#8a5a3a', top: '#c08a4a', chunks: ['start', 'cliffs', 'run', 'bunker', 'water', 'cliffs', 'bunker', 'boss'] },
  { n: 'Hive', sky: '#2a0a2a', g: '#5a2a4a', top: '#c04a8a', chunks: ['start', 'bunker', 'cliffs', 'ledges', 'water', 'bunker', 'cliffs', 'run', 'boss'] }
];
const GUNS = { N: { n: 'RIFLE', rate: 0.22, spd: 260 }, R: { n: 'RAPID', rate: 0.09, spd: 300 }, S: { n: 'SPREAD', rate: 0.28, spd: 240 }, L: { n: 'LASER', rate: 0.35, spd: 400 } };
let state = 'title', si, w, p, cam, ents, shots, eshots, fx, caps, score, lives, gun, deadT, spawnT, boss, winT, msg, msgT, best = K.best('junglefire');
function newGame() { si = 0; score = 0; lives = 5; gun = 'N'; load(); state = 'play'; }
function title() { K.card({ title: 'JUNGLE FIRE', text: 'Hold FIRE to shoot. Hold up or down while firing to aim diagonally or straight up; press down on the ground to lie flat. Shoot the flying capsules for new guns: R rapid, S spread, L laser. One hit costs a life, so keep moving!', best: best ? 'BEST ' + best : '', button: 'Lock and load', onStart: newGame }); }
function load() {
  const S = STAGES[si];
  w = P.world(P.join(S.chunks.map(k => CH[k])));
  P.SOLID = '#H'; P.ONEWAY = '=';
  ents = []; shots = []; eshots = []; fx = []; caps = []; cam = { x: 0, y: 0 }; deadT = 0; winT = 0; spawnT = 2; msg = 'STAGE ' + (si + 1) + ': ' + S.n.toUpperCase(); msgT = 1.8;
  for (let y = 0; y < w.rows; y++) for (let x = 0; x < w.cols; x++) {
    const ch = w.g[y][x], X = x * T, Y = y * T;
    if (ch === 'S') { w.start = { x: X, y: Y }; w.g[y][x] = '.'; }
    if (ch === 's') { ents.push(P.walker(X, Y, { kind: 'soldier', h: 16, w: 10, vx: -46, hp: 1, smart: false })); w.g[y][x] = '.'; }
    if (ch === 'n') { ents.push({ kind: 'sniper', x: X, y: Y, w: 10, h: 16, hp: 2, t: K.rnd(0.5, 2), alive: true }); w.g[y][x] = '.'; }
    if (ch === 't') { ents.push({ kind: 'turret', x: X, y: Y, w: 16, h: 16, hp: 5, t: 1, alive: true }); w.g[y][x] = '.'; }
    if (ch === 'c') { caps.push({ x: X, y: Y, trig: X - 140, on: false, alive: true, kind: ['R', 'S', 'L', 'S'][(x + si) % 4], ph: 0 }); w.g[y][x] = '.'; }
  }
  const bx = (w.cols - 8) * T; boss = { x: bx, hp: 40 + si * 15, core: { x: bx + 18, y: 7 * T, w: 20, h: 26 }, guns: [{ x: bx + 6, y: 5 * T + 4, t: 1 }, { x: bx + 6, y: 10 * T + 4, t: 1.6 }], open: false, dead: false };
  respawn(true);
}
function respawn(start) { p = P.player(start ? w.start.x : Math.max(cam ? cam.x + 30 : 30, 30), start ? w.start.y : 40, { h: 18, w: 10, run: 80, sprint: 80, autoRun: false, jump: 300 }); p.inv = start ? 0 : 2.5; deadT = 0; hud(); }
function hud() { K.set('score', score); K.set('gun', GUNS[gun].n); K.set('lives', '♥'.repeat(Math.max(0, lives))); }

function aimDir() {
  const up = K.down('up'), dn = K.down('down'), mv = K.down('left') || K.down('right');
  if (up && !mv) return [0, -1];
  if (up && mv) return [p.face * 0.707, -0.707];
  if (dn && mv && !p.ground) return [p.face * 0.707, 0.707];
  if (dn && !p.ground) return [0, 1];
  return [p.face, 0];
}
let fireT = 0;
function update(dt) {
  if (state !== 'play') return;
  if (msgT > 0) msgT -= dt;
  for (const f of fx) { f.l -= dt; if (f.vx) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 200 * dt; } } fx = fx.filter(f => f.l > 0);
  if (deadT > 0) { deadT -= dt; p.vy += 600 * dt; p.y += p.vy * dt; p.x -= 40 * dt; if (deadT <= 0) { lives--; gun = 'N'; hud(); if (lives < 0) return over(); respawn(false); } return; }
  if (winT > 0) { winT -= dt; if (winT <= 0) { si++; if (si >= STAGES.length) return victory(); load(); } return; }
  const prone = p.ground && K.down('down') && !K.down('left') && !K.down('right');
  p.h = prone ? 8 : 18; if (prone && !p.wasProne) p.y += 10; if (!prone && p.wasProne) p.y -= 10; p.wasProne = prone;
  if (prone) { p.vx = 0; p.vy = Math.min(330, p.vy + 800 * dt); P.move(w, p, dt); if (K.down('a') && K.hit('a')) {} }
  else P.control(w, p, dt, { down: false, run: false });
  // keep the screen scrolling forward only, like an arcade shooter
  p.x = Math.max(p.x, cam.x + 2);
  if (p.fell) { p.fell = false; return die(); }
  // shooting
  fireT -= dt;
  if (K.down('b') && fireT <= 0) {
    const g = GUNS[gun], d = prone ? [p.face, 0] : aimDir(), ox = p.x + p.w / 2 + d[0] * 8, oy = p.y + (prone ? 3 : 6) + d[1] * 8;
    const fire = (dx, dy) => shots.push({ x: ox, y: oy, vx: dx * g.spd, vy: dy * g.spd, l: 1.2, laser: gun === 'L', dmg: gun === 'L' ? 3 : 1 });
    if (gun === 'S') { const a = Math.atan2(d[1], d[0]); for (let k = -2; k <= 2; k++) fire(Math.cos(a + k * 0.16), Math.sin(a + k * 0.16)); } else fire(d[0], d[1]);
    fireT = g.rate; K.beep(gun === 'L' ? 1200 : 700, 0.05, { to: 200, vol: 0.03 });
  }
  for (const s of shots) { s.x += s.vx * dt; s.y += s.vy * dt; s.l -= dt; if (P.isSolid(P.tile(w, s.x, s.y)) && !s.laser && (boss.dead || s.x < boss.x)) s.l = 0; if (!boss.dead && s.x > boss.x + 44) s.l = 0; if (s.x < cam.x - 10 || s.x > cam.x + VW + 10) s.l = 0; }
  // enemy soldiers keep coming from the right
  spawnT -= dt;
  if (spawnT <= 0 && !boss.open) { spawnT = K.rnd(1.2, 2.6) / (1 + si * 0.25); const x = cam.x + VW + 10; let y = 0; for (let ty = 2; ty < 13; ty++) if (P.isSolid(P.tile(w, x, ty * T)) || P.tile(w, x, ty * T) === '=') { y = (ty - 1) * T; break; } if (y) ents.push(P.walker(x, y, { kind: 'soldier', h: 16, w: 10, vx: -50 - si * 6, hp: 1 })); }
  for (const e of ents) {
    if (!e.alive || e.x > cam.x + VW + 30) continue;
    if (e.kind === 'soldier') { P.stepWalker(w, e, dt); e.vx = e.vx > 0 ? -Math.abs(e.vx) : e.vx; if (e.x < cam.x - 30) e.alive = false; if (Math.random() < dt * 0.3 * (1 + si * 0.3)) eshot(e.x + 5, e.y + 5, 110); }
    else { e.t -= dt; if (e.t <= 0) { e.t = (e.kind === 'turret' ? 1.4 : 2) / (1 + si * 0.2); eshot(e.x + e.w / 2, e.y + 6, e.kind === 'turret' ? 120 : 140); } }
    for (const s of shots) if (s.l > 0 && P.overlap({ x: s.x - 2, y: s.y - 2, w: 4, h: 4 }, e)) { if (!s.laser) s.l = 0; e.hp -= s.dmg; if (e.hp <= 0) { e.alive = false; score += e.kind === 'turret' ? 500 : e.kind === 'sniper' ? 300 : 100; hud(); boom(e.x + e.w / 2, e.y + e.h / 2, 10); } else K.beep(300, 0.03, { vol: 0.03 }); }
    if (e.alive && p.inv <= 0 && P.overlap(p, e)) return die();
  }
  ents = ents.filter(e => e.alive);
  // weapon capsules fly across when you reach them
  for (const cp of caps) {
    if (!cp.alive) continue;
    if (!cp.on && p.x > cp.trig) { cp.on = true; cp.x = cam.x - 10; cp.y0 = 60; }
    if (cp.on && !cp.drop) { cp.ph += dt * 3; cp.x += 70 * dt; cp.y = cp.y0 + Math.sin(cp.ph) * 20; for (const s of shots) if (s.l > 0 && Math.abs(s.x - cp.x) < 10 && Math.abs(s.y - cp.y) < 8) { s.l = 0; cp.drop = true; cp.vy = -100; K.beep(600, 0.1, { vol: 0.05 }); } if (cp.x > cam.x + VW + 20) cp.alive = false; }
    if (cp.drop) { cp.vy = Math.min(200, cp.vy + 400 * dt); cp.y += cp.vy * dt; if (P.isSolid(P.tile(w, cp.x, cp.y + 6)) || P.tile(w, cp.x, cp.y + 6) === '=') { cp.y = Math.floor((cp.y + 6) / T) * T - 6; cp.vy = 0; } if (Math.abs(cp.x - (p.x + 5)) < 12 && Math.abs(cp.y - (p.y + 9)) < 14) { cp.alive = false; gun = cp.kind; hud(); K.tune([523, 784, 1047], 0.06); } }
  }
  // enemy bullets
  for (const b of eshots) { b.x += b.vx * dt; b.y += b.vy * dt; b.l -= dt; if (P.isSolid(P.tile(w, b.x, b.y)) && b.l < 2.8) b.l = 0; if (p.inv <= 0 && P.overlap({ x: b.x - 2, y: b.y - 2, w: 4, h: 4 }, p)) return die(); }
  eshots = eshots.filter(b => b.l > 0); shots = shots.filter(s => s.l > 0);
  // boss wall
  if (!boss.dead && cam.x >= w.px - VW - 2) {
    if (!boss.open) { boss.open = true; msg = 'DESTROY THE CORE!'; msgT = 1.5; }
    for (const g of boss.guns) { g.t -= dt; if (g.t <= 0) { g.t = K.rnd(0.8, 1.6) / (1 + si * 0.2); eshot(g.x, g.y, 130 + si * 15); } }
    if (Math.random() < dt * 0.6) ents.push(P.walker(boss.x - 4, 12 * T, { kind: 'soldier', h: 16, w: 10, vx: -60, hp: 1 }));
    for (const s of shots) if (s.l > 0 && P.overlap({ x: s.x - 2, y: s.y - 2, w: 4, h: 4 }, boss.core)) { if (!s.laser) s.l = 0; boss.hp -= s.dmg; boss.hit = 0.06; K.beep(200, 0.03, { vol: 0.04 }); if (boss.hp <= 0) { boss.dead = true; score += 5000; hud(); for (let i = 0; i < 6; i++) setTimeout(() => boom(boss.x + K.rnd(0, 120), K.rnd(60, 200), 20), i * 150); winT = 3; msg = 'STAGE CLEAR!'; msgT = 3; K.tune([392, 523, 659, 784, 1047], 0.12); } }
    if (boss.hit > 0) boss.hit -= dt;
  }
  cam.x = Math.max(cam.x, Math.min(w.px - VW, p.x - VW * 0.4)); cam.y = 0;
}
function eshot(x, y, spd) { const dx = p.x + 5 - x, dy = p.y + 8 - y, d = Math.hypot(dx, dy) || 1; eshots.push({ x, y, vx: dx / d * spd, vy: dy / d * spd, l: 3 }); }
function boom(x, y, n) { K.noise(0.3, 0.25); for (let i = 0; i < n; i++) fx.push({ x, y, vx: K.rnd(-90, 90), vy: K.rnd(-120, 20), l: K.rnd(0.3, 0.7) }); }
function die() { if (deadT || p.inv > 0) return; deadT = 1.4; p.vy = -200; boom(p.x + 5, p.y + 8, 14); K.beep(150, 0.5, { type: 'sawtooth', to: 60, vol: 0.07 }); }
function over() { state = 'over'; best = K.saveBest('junglefire', score); K.card({ title: 'MISSION FAILED', text: 'You fought to stage ' + (si + 1) + ' and scored ' + score + '.', best: 'BEST ' + best, button: 'Redeploy', onStart: newGame }); }
function victory() { state = 'over'; const f = score + lives * 3000; best = K.saveBest('junglefire', f); K.card({ title: 'MISSION COMPLETE', text: 'All three fortresses down! Final score ' + f + '.', best: 'BEST ' + best, button: 'Play again', onStart: newGame }); }

function drawTile(c, ch, x, y, tx, ty, t) {
  const S = STAGES[si];
  if (ch === '#') { artTile(c, '#', x, y, tx, ty, si, '#', (ART[si] || ART[0]).pal); }
  else if (ch === 'H') { artTile(c, 'H', x, y, tx, ty, si, 'H', A.PAL.metal); }
  else if (ch === '=') { c.fillStyle = '#7a5a3a'; c.fillRect(x, y, T, 5); c.fillStyle = '#c8a070'; c.fillRect(x, y, T, 2); }
  else if (ch === '~') { c.fillStyle = '#2a6aa8'; c.fillRect(x, y + 3, T, T - 3); c.fillStyle = '#7ac8f0'; c.fillRect(x + (t / 60 + tx * 5) % 12, y + 3, 4, 1); }
}
function drawSoldier(c, x, y, e, t) { const k = Math.floor(t / 120) % 2; c.fillStyle = '#c8b090'; c.fillRect(x + 2, y, 6, 5); c.fillStyle = '#7a3a2a'; c.fillRect(x + 1, y - 1, 8, 2); c.fillStyle = '#a84a3a'; c.fillRect(x + 1, y + 5, 8, 6); c.fillStyle = '#5a3a2a'; c.fillRect(x + 1 + k, y + 11, 3, 5); c.fillRect(x + 6 - k, y + 11, 3, 5); c.fillStyle = '#333'; c.fillRect(x - 3, y + 6, 6, 2); }
function draw(c, t) {
  if (!w) { c.fillStyle = '#1a3a2a'; c.fillRect(0, 0, VW, VH); return; }
  const S = STAGES[si]; artBg(c, t, si);
  P.eachVisible(w, cam, VW, VH, (ch, x, y, tx, ty) => drawTile(c, ch, x, y, tx, ty, t));
  if (!boss.dead) { const bx = Math.round(boss.x - cam.x); if (bx < VW) { const cr = boss.core; c.fillStyle = boss.hit > 0 ? '#fff' : (Math.floor(t / 200) % 2 ? '#ff3b5c' : '#c0203a'); c.fillRect(cr.x - cam.x, cr.y, cr.w, cr.h); c.fillStyle = '#ffd23f'; c.fillRect(cr.x - cam.x + 6, cr.y + 8, 8, 10); for (const g of boss.guns) { c.fillStyle = '#2a2a3a'; c.fillRect(g.x - cam.x - 8, g.y - 4, 14, 8); c.fillStyle = '#ff5a36'; c.fillRect(g.x - cam.x - 10, g.y - 1, 4, 2); } if (boss.open) { c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(bx + 10, 30, 100, 6); c.fillStyle = '#ff3b5c'; c.fillRect(bx + 11, 31, 98 * boss.hp / (40 + si * 15), 4); } } }
  for (const e of ents) { const x = Math.round(e.x - cam.x), y = Math.round(e.y - cam.y); if (e.kind === 'soldier') drawSoldier(c, x, y, e, t); else if (e.kind === 'sniper') { c.fillStyle = '#4a6a3a'; c.fillRect(x, y + 4, 10, 12); c.fillStyle = '#c8b090'; c.fillRect(x + 2, y, 6, 5); c.fillStyle = '#222'; c.fillRect(x - 6, y + 6, 8, 2); } else { c.fillStyle = '#3a3a4a'; c.beginPath(); c.arc(x + 8, y + 8, 7, 0, 7); c.fill(); c.fillStyle = '#ff3b5c'; c.beginPath(); c.arc(x + 8, y + 8, 3, 0, 7); c.fill(); const a = Math.atan2(p.y - e.y, p.x - e.x); c.strokeStyle = '#222'; c.lineWidth = 3; c.beginPath(); c.moveTo(x + 8, y + 8); c.lineTo(x + 8 + Math.cos(a) * 11, y + 8 + Math.sin(a) * 11); c.stroke(); } }
  for (const cp of caps) if (cp.alive && cp.on) { const x = Math.round(cp.x - cam.x), y = Math.round(cp.y); c.fillStyle = '#c0c6d6'; c.fillRect(x - 8, y - 5, 16, 10); c.fillStyle = '#e63946'; c.fillRect(x - 10, y - 2, 4, 4); c.fillRect(x + 6, y - 2, 4, 4); K.text(c, cp.kind, x, y + 1, 8, '#2a6fdb'); }
  c.fillStyle = '#ffd23f'; for (const s of shots) { if (s.laser) { c.fillStyle = '#7cffda'; c.fillRect(s.x - cam.x - 6, s.y - 1.5, 12, 3); c.fillStyle = '#ffd23f'; } else c.fillRect(s.x - cam.x - 2, s.y - 2, 4, 4); }
  c.fillStyle = '#ff5a36'; for (const b of eshots) { c.beginPath(); c.arc(b.x - cam.x, b.y, 2.5, 0, 7); c.fill(); }
  for (const f of fx) { c.globalAlpha = Math.min(1, f.l * 2); c.fillStyle = Math.random() < .5 ? '#ffd23f' : '#ff5a36'; c.fillRect(f.x - cam.x - 2, f.y - 2, 4, 4); } c.globalAlpha = 1;
  if (!(p.inv > 0 && Math.floor(t / 60) % 2)) {
    const x = Math.round(p.x - cam.x), y = Math.round(p.y - cam.y), f = p.face;
    if (p.h < 10) { c.fillStyle = '#2a6fdb'; c.fillRect(x - 4, y + 2, 14, 6); c.fillStyle = '#ffcf9e'; c.fillRect(f > 0 ? x + 8 : x - 6, y + 1, 5, 5); c.fillStyle = '#e63946'; c.fillRect(f > 0 ? x + 8 : x - 6, y, 5, 2); c.fillStyle = '#222'; c.fillRect(f > 0 ? x + 12 : x - 12, y + 3, 7, 2); }
    else {
      const d = aimDir(), k = p.ground && Math.abs(p.vx) > 5 ? Math.floor(p.anim / 8) % 2 : 0;
      c.fillStyle = '#2a6fdb'; c.fillRect(x + 1 + k * 2, y + 12, 3, 6); c.fillRect(x + 6 - k * 2, y + 12, 3, 6);
      c.fillStyle = '#ffcf9e'; c.fillRect(x + 1, y + 5, 8, 7); c.fillStyle = '#2a6fdb'; c.fillRect(x + 1, y + 9, 8, 3);
      c.fillStyle = '#ffcf9e'; c.fillRect(x + 2, y, 6, 5); c.fillStyle = '#e63946'; c.fillRect(x + 1, y, 8, 2); c.fillRect(x + (f > 0 ? -2 : 8), y + 1, 4, 1);
      c.strokeStyle = '#222'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(x + 5, y + 7); c.lineTo(x + 5 + d[0] * 10, y + 7 + d[1] * 10); c.stroke();
    }
  }
  if (msgT > 0) K.text(c, msg, VW / 2, 50, 13, '#fff');
}
