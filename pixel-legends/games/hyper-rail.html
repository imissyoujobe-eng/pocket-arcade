<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hyper Rail</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script src="../lib/three.min.js"></script>
<script src="../lib/racer.js"></script>
<script>
// Hyper Rail: futuristic hover racing. Hit the orange boost pads, stay off the energy walls, and win the Grand Prix.
K.theme({ bg: '#05030f', ink: '#e8f4ff', accent: '#46d0ff', accentInk: '#001a2a' });
K.hud(['gp', 'pts']);
K.pad({ dpad: 'lr', buttons: [{ id: 'b', label: 'BRAKE' }] });
const TRACKS = [
  { n: 'Neon City', width: 18, pts: [[0, 0], [120, 0], [180, 60], [120, 120], [180, 200], [80, 240], [0, 180], [-80, 230], [-140, 150], [-80, 70]], theme: { sky: 0x0a0620, ground: 0x120a2a, road: '#1a1a3a', edge: ['#ff3bd0', '#46d0ff'], scenery: 'city', fog: 0x1a0a3a, wall: 0x46d0ff, line: 'rgba(70,208,255,.7)' } },
  { n: 'Orbital Ring', width: 18, pts: [[0, 0], [90, -40], [190, -20], [240, 60], [200, 150], [100, 190], [0, 160], [-60, 220], [-150, 180], [-160, 80], [-90, 30]], theme: { sky: 0x02020a, ground: 0x05050f, road: '#22223a', edge: ['#ffd23f', '#ffffff'], scenery: 'space', fog: 0x05050f, wall: 0xffd23f, line: 'rgba(255,210,63,.6)' } },
  { n: 'Lava Rim', width: 17, pts: [[0, 0], [70, -60], [150, -50], [190, 20], [150, 90], [200, 160], [120, 220], [30, 190], [-50, 230], [-120, 170], [-90, 90], [-40, 50]], theme: { sky: 0x2a0a06, ground: 0x3a1206, road: '#2a1a1a', edge: ['#ff5a1a', '#ffd23f'], scenery: 'rocks', fog: 0x4a1a0a, wall: 0xff5a1a, line: 'rgba(255,138,31,.7)' } }
];
const POINTS = [15, 12, 10, 8, 6, 4, 2, 1];
let race = 0, total = 0, places = [], best = K.best('hyperrail');
const CFG = { style: 'hover', tracks: TRACKS, laps: 3, cpus: 7, maxSpeed: 40, items: false, boostPads: true, energy: true, colors: [0x46d0ff, 0xff3bd0, 0xffd23f, 0x7cff6b, 0xff8a1f, 0xc8a0ff, 0xffffff, 0xff3b5c], onFinish };
function title() { K.card({ title: 'HYPER RAIL', text: 'Hover racing at full throttle. Steer with ◀ ▶ or touch the sides of the screen. Orange arrow pads give a speed burst and a bit of energy. Scraping the glowing side walls drains your energy, and if it hits zero you are out!', best: best ? 'BEST GP ' + best + ' PTS' : '', button: 'Start Grand Prix', onStart: () => { race = 0; total = 0; places = []; go(); } }); }
function go() { K.set('gp', 'RACE ' + (race + 1) + '/3 · ' + TRACKS[race].n.toUpperCase()); K.set('pts', total + ' PTS'); R.start(CFG, race); }
function ord(n) { return n + (['ST', 'ND', 'RD'][n - 1] || 'TH'); }
function onFinish(place, time, ti, wrecked) {
  R.stop(); places.push(place); const pts = wrecked ? 0 : POINTS[place - 1] || 0; total += pts; K.set('pts', total + ' PTS');
  if (race < 2) { race++; K.card({ title: wrecked ? 'WRECKED!' : place === 1 ? 'VICTORY!' : 'FINISHED ' + ord(place), text: (wrecked ? 'Your machine ran out of energy. ' : 'You earned ' + pts + ' points. ') + 'Total: ' + total + '. Next: ' + TRACKS[race].n + '.', best: '', button: 'Next race', onStart: go }); }
  else { best = K.saveBest('hyperrail', total); const champ = total >= 40; K.card({ title: champ ? 'GRAND PRIX CHAMPION!' : 'GRAND PRIX OVER', text: 'Finishes: ' + places.map(ord).join(', ') + '. Total ' + total + ' points.', best: 'BEST GP ' + best + ' PTS', button: 'Race again', onStart: () => { race = 0; total = 0; places = []; go(); } }); }
}
title();
K.run(dt => R.tick(dt), () => {});
</script>
</body>
</html>
