<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wing Squadron</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script src="../lib/three.min.js"></script>
<script>
// Wing Squadron: a 3D on-rails space shooter. Blast fighters, fly through rings for shields, and take down the mothership at the end of each stage.
K.theme({ bg: '#02030a', ink: '#e8f4ff', accent: '#46d0ff', accentInk: '#001a2a' });
K.hud(['score', 'stage', 'bombs']);
K.pad({ dpad: '4', buttons: [{ id: 'b', label: 'BOMB' }, { id: 'a', label: 'FIRE' }] });

const STAGES = [
  { n: 'Verdant Planet', sky: 0x6ab8ff, fog: 0x9ad0ff, ground: 0x3f8a3a, len: 900, kind: 'planet' },
  { n: 'Asteroid Belt', sky: 0x05050f, fog: 0x0a0a1a, ground: null, len: 1000, kind: 'rocks' },
  { n: 'Iron Fortress', sky: 0x1a0a14, fog: 0x2a1020, ground: 0x3a3a48, len: 1100, kind: 'base' }
];
let state = 'title', renderer, scene, camera, stageEl, hudC, hud, ship, shipM, ents, shots, eshots, rings, fx, si, dist, score, shield, bombs, boss, fireT, touch, msg, msgT, best = K.best('wing');
const X = 9, Y = 5.5; // ship bounds
function setup() {
  stageEl = document.getElementById('ks'); const kc = stageEl.querySelector('canvas'); if (kc) kc.style.display = 'none';
  renderer = new THREE.WebGLRenderer({ antialias: false }); renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
  renderer.domElement.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block'; stageEl.style.position = 'relative'; stageEl.insertBefore(renderer.domElement, stageEl.firstChild);
  hudC = document.createElement('canvas'); hudC.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1'; stageEl.insertBefore(hudC, renderer.domElement.nextSibling); hud = hudC.getContext('2d');
  camera = new THREE.PerspectiveCamera(70, 1, 0.5, 600);
  const el = renderer.domElement, tp = e => { const r = el.getBoundingClientRect(); touch = { x: ((e.clientX - r.left) / r.width - 0.5) * 2, y: -((e.clientY - r.top) / r.height - 0.5) * 2 }; };
  el.addEventListener('pointerdown', e => { tp(e); try { el.setPointerCapture(e.pointerId); } catch (_) {} }); el.addEventListener('pointermove', e => { if (touch) tp(e); }); ['pointerup', 'pointercancel'].forEach(n => el.addEventListener(n, () => touch = null));
  addEventListener('resize', fit); fit();
}
function fit() { const r = stageEl.getBoundingClientRect(), w = Math.max(100, r.width), h = Math.max(100, r.height); renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 85 : 65; camera.updateProjectionMatrix(); const d = Math.min(devicePixelRatio || 1, 2); hudC.width = w * d; hudC.height = h * d; hud.setTransform(d, 0, 0, d, 0, 0); hudC._w = w; hudC._h = h; }
function title() { K.card({ title: 'WING SQUADRON', text: 'Fly with the arrow pad (or drag on the screen). FIRE shoots lasers, BOMB clears everything nearby. Fly through gold rings to repair your shield. Survive each stage and destroy the mothership waiting at the end!', best: best ? 'BEST ' + best : '', button: 'Launch', onStart: () => { if (!renderer) setup(); si = 0; score = 0; bombs = 3; shield = 100; loadStage(); state = 'play'; } }); }
function loadStage() {
  const S = STAGES[si]; scene = new THREE.Scene(); scene.background = A.skyTex(THREE, '#' + new THREE.Color(S.sky).offsetHSL(0, 0, -0.15).getHexString(), '#' + new THREE.Color(S.fog).getHexString()); scene.fog = new THREE.Fog(S.fog, 60, 260);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 0.9)); const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(30, 80, 40); scene.add(sun);
  if (S.ground !== null) { const g = new THREE.Mesh(new THREE.PlaneGeometry(400, 800, 20, 40), new THREE.MeshLambertMaterial({ color: 0xffffff, map: A.tex3(THREE, si === 0 ? 'fields' : si === 1 ? 'sand' : 'grass', S.ground, si === 0 ? 10 : 24) })); g.rotation.x = -Math.PI / 2; g.position.set(0, -10, -300); scene.add(g); const grid = new THREE.GridHelper(400, 40, 0x000000, 0x000000); grid.material.opacity = 0.15; grid.material.transparent = true; grid.position.set(0, -9.9, -300); scene.add(grid); scene.userData.grid = grid; }
  else { const stars = new THREE.BufferGeometry(), arr = []; for (let i = 0; i < 600; i++) arr.push((Math.random() - .5) * 400, (Math.random() - .5) * 300, -Math.random() * 500); stars.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3)); scene.add(new THREE.Points(stars, new THREE.PointsMaterial({ color: 0xffffff, size: 1 }))); }
  shipM = makeShip(0x46d0ff); scene.add(shipM);
  ship = { x: 0, y: 0, vx: 0, vy: 0, roll: 0, inv: 1.5 }; ents = []; shots = []; eshots = []; rings = []; fx = []; dist = 0; boss = null; fireT = 0; msg = 'STAGE ' + (si + 1) + ': ' + S.n.toUpperCase(); msgT = 2.5; scene.userData.props = [];
  hudUpd();
}
function hudUpd() { K.set('score', score); K.set('stage', 'STAGE ' + (si + 1)); K.set('bombs', 'BOMBS ' + '●'.repeat(bombs)); }
function makeShip(col) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.ConeGeometry(0.8, 3.4, 4), new THREE.MeshLambertMaterial({ color: 0xe8eef8 })); body.rotation.x = -Math.PI / 2; body.rotation.y = Math.PI / 4;
  const wingL = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.12, 1.2), new THREE.MeshLambertMaterial({ color: col })); wingL.position.set(-1.4, 0, 0.5); wingL.rotation.z = 0.25;
  const wingR = wingL.clone(); wingR.position.x = 1.4; wingR.rotation.z = -0.25;
  const cock = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 6), new THREE.MeshLambertMaterial({ color: 0x2a6fdb })); cock.position.set(0, 0.35, 0.1);
  const eng = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.2), new THREE.MeshBasicMaterial({ color: 0xff8a1f })); eng.position.set(0, 0, 1.7);
  g.add(body, wingL, wingR, cock, eng); return g;
}
function enemyMesh(kind) {
  const g = new THREE.Group();
  if (kind === 'fighter') { const b = new THREE.Mesh(new THREE.OctahedronGeometry(1, 0), new THREE.MeshLambertMaterial({ color: 0xff3b5c })); b.scale.set(1.4, 0.6, 1); const w = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 0.8), new THREE.MeshLambertMaterial({ color: 0x8a1a2a })); g.add(b, w); }
  else if (kind === 'rock') { const r = new THREE.Mesh(new THREE.DodecahedronGeometry(1.8 + Math.random() * 1.5, 0), new THREE.MeshLambertMaterial({ color: 0x7a6a5a })); g.add(r); }
  else if (kind === 'turret') { const b = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.5, 1.6, 8), new THREE.MeshLambertMaterial({ color: 0x8a8a9a })); const t = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 2), new THREE.MeshLambertMaterial({ color: 0x333333 })); t.position.set(0, 0.9, 0.6); g.add(b, t); }
  else if (kind === 'tower') { const h = 8 + Math.random() * 14; const b = new THREE.Mesh(new THREE.BoxGeometry(3, h, 3), new THREE.MeshLambertMaterial({ color: si === 2 ? 0x5a5a6a : 0xd8d0c0 })); b.position.y = h / 2; g.add(b); g.userData.h = h; }
  else if (kind === 'boss') { const c = new THREE.Mesh(new THREE.CylinderGeometry(6, 9, 3, 10), new THREE.MeshLambertMaterial({ color: 0x5a4a8a })); const core = new THREE.Mesh(new THREE.SphereGeometry(2, 12, 8), new THREE.MeshBasicMaterial({ color: 0xff3b5c })); core.position.z = 2; c.rotation.x = Math.PI / 2; const a1 = new THREE.Mesh(new THREE.BoxGeometry(18, 1, 3), new THREE.MeshLambertMaterial({ color: 0x3a2a5a })); g.add(c, core, a1); g.userData.core = core; }
  scene.add(g); return g;
}
function spawn(kind, x, y, z, extra) { const e = Object.assign({ kind, x, y, z, hp: { fighter: 2, rock: 3, turret: 3, tower: 999, boss: 80 + si * 40 }[kind], t: Math.random() * 6, m: enemyMesh(kind), r: { fighter: 1.6, rock: 2.6, turret: 1.6, tower: 2, boss: 7 }[kind] }, extra || {}); ents.push(e); return e; }
const SPEED = 38;
function update(dt) {
  if (state !== 'play') return;
  const S = STAGES[si];
  if (msgT > 0) msgT -= dt;
  // ship control
  let ax = (K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0), ay = (K.down('up') ? 1 : 0) - (K.down('down') ? 1 : 0);
  if (touch) { ax = K.clamp((touch.x * X - ship.x) / 2, -1, 1); ay = K.clamp((touch.y * Y + 1 - ship.y) / 2, -1, 1); }
  ship.vx += ax * 60 * dt; ship.vy += ay * 50 * dt; ship.vx *= Math.pow(0.02, dt); ship.vy *= Math.pow(0.02, dt);
  ship.x = K.clamp(ship.x + ship.vx * dt, -X, X); ship.y = K.clamp(ship.y + ship.vy * dt, -Y + (S.ground !== null ? 1.5 : 0), Y);
  ship.roll += (-ship.vx * 0.06 - ship.roll) * Math.min(1, dt * 8);
  if (ship.inv > 0) ship.inv -= dt;
  // fire
  fireT -= dt;
  if ((K.down('a') || touch) && fireT <= 0) { fireT = 0.14; for (const s of [-0.9, 0.9]) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 2.2), new THREE.MeshBasicMaterial({ color: 0x7cff6b })); m.position.set(ship.x + s, ship.y, -2); scene.add(m); shots.push({ m, l: 1.2 }); } K.beep(1400, 0.04, { to: 600, vol: 0.02 }); }
  if (K.hit('b') && bombs > 0) { bombs--; hudUpd(); K.noise(0.8, 0.5); const fl = { flash: 0.4 }; fx.push(fl); for (const e of ents) if (e.z > -120 && e.kind !== 'tower') { e.hp -= e.kind === 'boss' ? 15 : 99; if (e.hp <= 0) kill(e); } for (const b of eshots) b.l = 0; }
  // the world rolls toward you
  dist += SPEED * dt;
  if (scene.userData.grid) scene.userData.grid.position.z = -300 + (dist % 10);
  if (!boss) {
    if (Math.random() < dt * (1.1 + si * 0.4)) { const k = S.kind === 'rocks' && Math.random() < 0.6 ? 'rock' : 'fighter'; const n = k === 'fighter' && Math.random() < 0.5 ? 3 : 1, bx = K.rnd(-X, X), by = K.rnd(-Y + 2, Y); for (let i = 0; i < n; i++) spawn(k, bx + i * 3 - (n - 1) * 1.5, by, -220 - i * 6, { vx: K.rnd(-4, 4), wave: Math.random() * 6 }); }
    if (S.ground !== null && Math.random() < dt * 1.6) { const side = Math.random() < 0.5 ? -1 : 1; const tw = spawn('tower', side * K.rnd(6, 30), -10, -230); if (Math.abs(tw.x) < X + 2) tw.danger = true; }
    if (S.kind !== 'rocks' && S.ground !== null && Math.random() < dt * 0.4) spawn('turret', K.rnd(-X, X), -9, -230);
    if (Math.random() < dt * 0.18) { const m = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.25, 6, 18), new THREE.MeshBasicMaterial({ color: 0xffd23f })); const r = { x: K.rnd(-X + 2, X - 2), y: K.rnd(-Y + 2, Y - 1), z: -220, m }; m.position.set(r.x, r.y, r.z); scene.add(m); rings.push(r); }
    if (dist > S.len) { boss = spawn('boss', 0, 2, -160); boss.dir = 1; msg = 'WARNING: MOTHERSHIP!'; msgT = 2; K.tune([200, 150, 200, 150], 0.2, { type: 'sawtooth' }); }
  }
  // move things
  for (const e of ents) {
    if (e.kind === 'boss') { e.z = Math.min(-60, e.z + 30 * dt); e.t += dt; e.x = Math.sin(e.t * 0.7) * 7; e.y = 2 + Math.sin(e.t * 1.1) * 3; if (e.z >= -61 && Math.random() < dt * (1.2 + si * 0.4)) for (let k = -1; k <= 1; k++) shootAt(e, k * 0.12); e.m.userData.core.material.color.setHex(e.hit > 0 ? 0xffffff : 0xff3b5c); }
    else { e.z += SPEED * dt * (e.kind === 'fighter' ? 1.3 : 1); if (e.kind === 'fighter') { e.t += dt; e.x += Math.sin(e.t * 2 + e.wave) * 6 * dt + e.vx * dt; if (e.z > -150 && e.z < -40 && Math.random() < dt * (0.6 + si * 0.3)) shootAt(e, 0); } if (e.kind === 'turret' && e.z > -140 && e.z < -30 && Math.random() < dt * 0.8) shootAt(e, 0); if (e.kind === 'rock') { e.m.rotation.x += dt; e.m.rotation.y += dt * 0.7; } }
    if (e.hit > 0) e.hit -= dt;
    e.m.position.set(e.x, e.y, e.z);
    // collide with ship
    if (e.kind === 'tower') { if (e.z > -1.5 && e.z < 1.5 && Math.abs(e.x - ship.x) < 2.2 && ship.y < -10 + e.m.userData.h) damage(25); }
    else if (e.z > -2 && e.z < 2 && Math.hypot(e.x - ship.x, e.y - ship.y) < e.r + 0.8) { damage(e.kind === 'boss' ? 30 : 20); if (e.kind !== 'boss') kill(e, true); }
    if (e.z > 15) e.gone = true;
  }
  for (const s of shots) { s.m.position.z -= 160 * dt; s.l -= dt; for (const e of ents) if (!e.dead && e.kind !== 'tower' && Math.abs(e.z - s.m.position.z) < 3 && Math.hypot(e.x - s.m.position.x, e.y - s.m.position.y) < e.r + (e.kind === 'boss' ? 0 : 0.6)) { s.l = 0; e.hp--; e.hit = 0.08; K.beep(300, 0.03, { vol: 0.03 }); if (e.hp <= 0) kill(e); break; } }
  for (const b of eshots) { b.m.position.addScaledVector(b.v, dt); b.l -= dt; if (Math.abs(b.m.position.z) < 1.2 && Math.hypot(b.m.position.x - ship.x, b.m.position.y - ship.y) < 1.3) { b.l = 0; damage(10); } }
  for (const r of rings) { r.z += SPEED * dt; r.m.position.z = r.z; r.m.rotation.z += dt; if (!r.got && Math.abs(r.z) < 1.5 && Math.hypot(r.x - ship.x, r.y - ship.y) < 2.2) { r.got = true; shield = Math.min(100, shield + 25); score += 100; hudUpd(); K.tune([880, 1175, 1568], 0.05); r.m.visible = false; } }
  for (const f of fx) { if (f.flash) f.flash -= dt; else { f.l -= dt; f.m.position.addScaledVector(f.v, dt); f.m.scale.multiplyScalar(1 + dt * 2); f.m.material.opacity = Math.max(0, f.l); } }
  cleanup();
  shipM.position.set(ship.x, ship.y, 0); shipM.rotation.set(ship.vy * 0.03, 0, ship.roll); shipM.visible = !(ship.inv > 0 && Math.floor(performance.now() / 80) % 2);
}
function shootAt(e, spread) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.45, 6, 4), new THREE.MeshBasicMaterial({ color: 0xff8a1f })); m.position.set(e.x, e.y, e.z + 2); scene.add(m); const v = new THREE.Vector3(ship.x - e.x + spread * 40, ship.y - e.y, -e.z).normalize().multiplyScalar(45 + si * 8); eshots.push({ m, v, l: 4 }); }
function kill(e, quiet) {
  e.dead = true; e.gone = true; score += { fighter: 100, rock: 50, turret: 150, boss: 3000 }[e.kind] || 0; hudUpd();
  for (let i = 0; i < (e.kind === 'boss' ? 40 : 10); i++) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshBasicMaterial({ color: Math.random() < .5 ? 0xffd23f : 0xff5a1a, transparent: true })); m.position.set(e.x, e.y, e.z); scene.add(m); fx.push({ m, v: new THREE.Vector3(K.rnd(-1, 1), K.rnd(-1, 1), K.rnd(-1, 1)).multiplyScalar(e.kind === 'boss' ? 30 : 12), l: 0.8 }); }
  if (!quiet) K.noise(e.kind === 'boss' ? 1.2 : 0.3, 0.3);
  if (e.kind === 'boss') { K.tune([523, 659, 784, 1047, 1319], 0.12); setTimeout(() => { si++; if (si >= STAGES.length) return win(); shield = Math.min(100, shield + 40); bombs = Math.max(bombs, 2); loadStage(); }, 2500); }
}
function damage(n) { if (ship.inv > 0) return; shield -= n; ship.inv = 1; hudUpd(); K.beep(160, 0.25, { type: 'square', vol: 0.07 }); fx.push({ flash: 0.25, red: true }); if (shield <= 0) lose(); }
function cleanup() {
  for (const arr of [ents]) for (const e of arr) if (e.gone) scene.remove(e.m);
  ents = ents.filter(e => !e.gone);
  shots.forEach(s => { if (s.l <= 0) scene.remove(s.m); }); shots = shots.filter(s => s.l > 0);
  eshots.forEach(b => { if (b.l <= 0 || b.m.position.z > 15) { scene.remove(b.m); b.l = 0; } }); eshots = eshots.filter(b => b.l > 0);
  rings.forEach(r => { if (r.z > 15) scene.remove(r.m); }); rings = rings.filter(r => r.z <= 15);
  fx.forEach(f => { if (f.m && f.l <= 0) scene.remove(f.m); }); fx = fx.filter(f => f.flash > 0 || (f.m && f.l > 0));
}
function lose() { state = 'over'; K.tune([392, 330, 262, 196], 0.2, { type: 'sawtooth' }); best = K.saveBest('wing', score); K.card({ title: 'SHOT DOWN', text: 'You made it to stage ' + (si + 1) + ' with ' + score + ' points.', best: 'BEST ' + best, button: 'Launch again', onStart: () => { si = 0; score = 0; bombs = 3; shield = 100; loadStage(); state = 'play'; } }); }
function win() { state = 'over'; best = K.saveBest('wing', score + shield * 20); K.card({ title: 'SQUADRON VICTORY!', text: 'All three motherships destroyed! Final score ' + (score + shield * 20) + ' including your shield bonus.', best: 'BEST ' + best, button: 'Fly again', onStart: () => { si = 0; score = 0; bombs = 3; shield = 100; loadStage(); state = 'play'; } }); }
function draw() {
  if (!renderer || !scene) return;
  camera.position.set(ship.x * 0.7, ship.y * 0.6 + 2.2, 10); camera.lookAt(ship.x * 0.8, ship.y * 0.7, -30); camera.rotation.z = ship.roll * 0.3;
  renderer.render(scene, camera);

  c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(12, 12, 120, 12); c.fillStyle = shield > 30 ? '#46d0ff' : '#ff3b5c'; c.fillRect(13, 13, 118 * Math.max(0, shield) / 100, 10);
  c.font = '10px Bungee, Impact, sans-serif'; c.fillStyle = '#fff'; c.textAlign = 'left'; c.fillText('SHIELD', 12, 38);
  if (boss && !boss.dead) { c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(w / 2 - 80, h - 26, 160, 10); c.fillStyle = '#ff3b5c'; c.fillRect(w / 2 - 79, h - 25, 158 * Math.max(0, boss.hp) / (80 + si * 40), 8); }
  if (msgT > 0) { c.font = '20px Bungee, Impact, sans-serif'; c.textAlign = 'center'; c.fillStyle = 'rgba(0,0,0,.6)'; c.fillText(msg, w / 2 + 2, h * 0.3 + 2); c.fillStyle = '#ffd23f'; c.fillText(msg, w / 2, h * 0.3); }
  // crosshair
  const v = new THREE.Vector3(ship.x, ship.y, -25).project(camera), cx = (v.x + 1) / 2 * w, cy = (1 - v.y) / 2 * h; c.strokeStyle = 'rgba(124,255,107,.8)'; c.lineWidth = 2; c.strokeRect(cx - 8, cy - 8, 16, 16);
}
title();
K.run(update, draw);
</script>
