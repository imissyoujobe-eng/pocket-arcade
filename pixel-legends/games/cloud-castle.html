<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cloud Castle 3D</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script src="../lib/three.min.js"></script>
<script>
// Cloud Castle 3D: hop across floating islands in the sky and collect the six sun stars scattered around Cloud Castle.
K.theme({ bg: '#6ec3ff', ink: '#fffaf0', accent: '#ffd23f', accentInk: '#2a1d00' });
K.hud(['stars', 'coins', 'hearts', 'time']);
K.pad({ dpad: '4', buttons: [{ id: 'b', label: 'POUND' }, { id: 'a', label: 'JUMP' }] });

let state = 'title', renderer, scene, camera, stageEl, hudC, hud, boxes, movers, coins, stars, puffs, hero, heroM, cam, starN, coinN, hearts, time, msg, msgT, best = K.best('cloudcastle');
function setup() {
  stageEl = document.getElementById('ks'); const kc = stageEl.querySelector('canvas'); if (kc) kc.style.display = 'none';
  renderer = new THREE.WebGLRenderer({ antialias: false }); renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
  renderer.domElement.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block'; stageEl.style.position = 'relative'; stageEl.insertBefore(renderer.domElement, stageEl.firstChild);
  hudC = document.createElement('canvas'); hudC.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1'; stageEl.insertBefore(hudC, renderer.domElement.nextSibling); hud = hudC.getContext('2d');
  camera = new THREE.PerspectiveCamera(65, 1, 0.3, 500); addEventListener('resize', fit); fit();
}
function fit() { const r = stageEl.getBoundingClientRect(), w = Math.max(100, r.width), h = Math.max(100, r.height); renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 80 : 62; camera.updateProjectionMatrix(); const d = Math.min(devicePixelRatio || 1, 2); hudC.width = w * d; hudC.height = h * d; hud.setTransform(d, 0, 0, d, 0, 0); hudC._w = w; hudC._h = h; }
function title() { K.card({ title: 'CLOUD CASTLE 3D', text: 'Six sun stars are hidden on the islands around Cloud Castle. ▲ runs forward, ◀ ▶ turn, ▼ backs up. JUMP to hop, press JUMP again in the air for a second jump, and POUND in the air to stomp down. Bop the Puffs on the head. Falling off the clouds sends you back to the last flag.', best: best ? 'BEST TIME ' + Math.floor(best / 60) + ':' + String(best % 60).padStart(2, '0') : '', button: 'Start', onStart: () => { if (!renderer) setup(); build(); state = 'play'; } }); }

function box(x, y, z, w, h, d, col, o) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: col })); m.position.set(x, y, z); scene.add(m); const b = Object.assign({ m, x, y, z, w, h, d }, o || {}); boxes.push(b); return b; }
function island(x, y, z, w, d, top) { const b = box(x, y - 1, z, w, 2, d, top || 0x6fd06a); const dirt = new THREE.Mesh(new THREE.CylinderGeometry(Math.min(w, d) * 0.45, 1, 6, 7), new THREE.MeshLambertMaterial({ color: 0x9a6a3a })); dirt.position.set(x, y - 5, z); scene.add(dirt); return b; }
function mover(x, y, z, w, d, ax, amp, spd) { const b = box(x, y, z, w, 0.8, d, 0xffd8a0); b.base = { x, y, z }; b.ax = ax; b.amp = amp; b.spd = spd; b.ph = 0; movers.push(b); return b; }
function coinAt(x, y, z) { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.1, 12), new THREE.MeshLambertMaterial({ color: 0xffd23f, emissive: 0x553300 })); m.rotation.x = Math.PI / 2; m.position.set(x, y, z); scene.add(m); coins.push({ m, x, y, z }); }
function starAt(x, y, z, hint) { const g = new THREE.Group(), shape = new THREE.Shape(); for (let i = 0; i < 10; i++) { const r = i % 2 ? 0.45 : 1, a = i / 10 * Math.PI * 2 + Math.PI / 2; i ? shape.lineTo(Math.cos(a) * r, Math.sin(a) * r) : shape.moveTo(Math.cos(a) * r, Math.sin(a) * r); } const m = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.3, bevelEnabled: false }), new THREE.MeshLambertMaterial({ color: 0xffd23f, emissive: 0x886600 })); m.position.z = -0.15; g.add(m); g.position.set(x, y, z); scene.add(g); stars.push({ m: g, x, y, z, hint }); }
function puff(x, y, z, range, axis) { const g = new THREE.Group(); const b = new THREE.Mesh(new THREE.SphereGeometry(0.7, 10, 8), new THREE.MeshLambertMaterial({ color: 0xc0306a })); b.position.y = 0.7; const e1 = new THREE.Mesh(new THREE.SphereGeometry(0.16, 6, 4), new THREE.MeshBasicMaterial({ color: 0xffffff })); e1.position.set(-0.25, 0.9, 0.6); const e2 = e1.clone(); e2.position.x = 0.25; g.add(b, e1, e2); g.position.set(x, y, z); scene.add(g); puffs.push({ m: g, x, y, z, base: { x, z }, range, axis, ph: Math.random() * 6, alive: true }); }
function flag(x, y, z) { const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 3, 6), new THREE.MeshLambertMaterial({ color: 0xffffff })); pole.position.set(x, y + 1.5, z); const f = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.8), new THREE.MeshLambertMaterial({ color: 0xff5a36, side: THREE.DoubleSide })); f.position.set(x + 0.6, y + 2.6, z); scene.add(pole, f); return { x, y, z, f }; }
let flags, checkpoint;
function build() {
  scene = new THREE.Scene(); scene.background = A.skyTex(THREE, '#3a8ae8', '#cfeeff'); scene.fog = new THREE.Fog(0xbfe8ff, 60, 220);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x6688aa, 0.95)); const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(40, 80, 30); scene.add(sun);
  boxes = []; movers = []; coins = []; stars = []; puffs = []; flags = [];
  // clouds below
  for (let i = 0; i < 40; i++) { const c = new THREE.Mesh(new THREE.SphereGeometry(4 + Math.random() * 6, 8, 6), new THREE.MeshLambertMaterial({ color: 0xffffff })); c.position.set(K.rnd(-120, 120), -18 - Math.random() * 10, K.rnd(-140, 80)); c.scale.y = 0.4; scene.add(c); }
  // start island + castle
  island(0, 0, 0, 24, 24);
  box(0, 3, 9, 8, 6, 4, 0xf2f2ff); box(-4.5, 5, 9, 2, 10, 2, 0xe8e8f8); box(4.5, 5, 9, 2, 10, 2, 0xe8e8f8);
  const roof1 = new THREE.Mesh(new THREE.ConeGeometry(1.6, 3, 6), new THREE.MeshLambertMaterial({ color: 0xff5a7a })); roof1.position.set(-4.5, 11.5, 9); scene.add(roof1); const roof2 = roof1.clone(); roof2.position.x = 4.5; scene.add(roof2);
  for (let a = 0; a < 8; a++) coinAt(Math.cos(a / 8 * 6.28) * 5, 1, Math.sin(a / 8 * 6.28) * 5 - 2);
  flags.push(flag(-8, 0, -6)); checkpoint = flags[0];
  // north steps to island 2
  box(0, 0.5, -16, 4, 1, 4, 0xffd8a0); box(0, 1.5, -22, 4, 1, 4, 0xffd8a0); box(0, 2.5, -28, 4, 1, 4, 0xffd8a0);
  island(0, 3, -42, 16, 16); flags.push(flag(-5, 3, -36));
  // star 1: tower of stairs on island 2
  box(4, 4.5, -46, 3, 3, 3, 0xc8b8f0); box(4, 6, -50, 3, 6, 3, 0xc8b8f0); box(0, 7.5, -50, 3, 9, 3, 0xc8b8f0); starAt(0, 13.5, -50, 'Tower on the north island');
  puff(-4, 3, -42, 4, 'x');
  // star 6: thin beam out over the void from island 2
  box(-16.3, 3.25, -42, 16.6, 0.5, 1.2, 0xffffff); box(-24, 3.25, -48, 1.2, 0.5, 12, 0xffffff); starAt(-24, 5, -53, 'End of the sky beam');
  // east: moving platform to island 3
  mover(19, -0.4, 0, 4, 4, 'x', 7, 0.8); island(40, 0, 0, 14, 14); flags.push(flag(36, 0, 4));
  puff(38, 0, -3, 4, 'z'); puff(42, 0, 3, 4, 'x');
  starAt(44, 1.5, -4, 'Guarded by the Puffs on the east island');
  // star 3: staggered pillars on island 3
  box(36, 1.5, -10, 2, 3, 2, 0xc8b8f0); box(40, 3, -13, 2, 6, 2, 0xc8b8f0); box(44, 4.5, -16, 2, 9, 2, 0xc8b8f0); box(48, 6, -19, 2, 12, 2, 0xc8b8f0); starAt(48, 13.5, -19, 'Top of the east pillars');
  // west: elevator platforms up to island 4
  mover(-16, 1, 0, 4, 4, 'y', 3, 0.9); mover(-24, 5, 0, 4, 4, 'y', 3, 1.1); island(-38, 9, 0, 14, 14); flags.push(flag(-34, 9, 4));
  puff(-38, 9, -3, 5, 'x');
  starAt(-42, 10.5, 4, 'West island in the clouds');
  // star 5: moving platforms in a row from island 4 to a tiny islet
  mover(-38, 8.6, -14, 3.5, 3.5, 'x', 5, 1.2); mover(-38, 8.6, -22, 3.5, 3.5, 'x', 5, 1.5); island(-38, 9, -32, 6, 6); starAt(-38, 10.5, -32, 'Past the sliding platforms, west island');
  for (let i = 0; i < 6; i++) coinAt(13.5 + i * 2.2, 1.2, 0);
  for (let i = 0; i < 5; i++) coinAt(0, 2 + i, -16 - i * 3);
  hero = { x: 0, y: 1, z: -2, vx: 0, vy: 0, vz: 0, ang: Math.PI, ground: false, jumps: 0, pound: false, inv: 0, on: null };
  heroM = new THREE.Group(); const body = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.5, 1, 8), new THREE.MeshLambertMaterial({ color: 0x2a6fdb })); body.position.y = 0.7; const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 10, 8), new THREE.MeshLambertMaterial({ color: 0xffcf9e })); head.position.y = 1.5; const hat = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.6, 8), new THREE.MeshLambertMaterial({ color: 0xff5a36 })); hat.position.y = 1.95; const nose = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 4), new THREE.MeshLambertMaterial({ color: 0xff9a7a })); nose.position.set(0, 1.45, 0.42); const fl = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.3, 0.4), new THREE.MeshLambertMaterial({ color: 0x5a3a1a })); fl.position.set(-0.2, 0.15, 0.05); const fr = fl.clone(); fr.position.x = 0.2; heroM.add(body, head, hat, nose, fl, fr); heroM.userData.feet = [fl, fr]; scene.add(heroM);
  cam = new THREE.Vector3(0, 5, 8); starN = 0; coinN = 0; hearts = 3; time = 0; msg = 'FIND 6 SUN STARS'; msgT = 2.5; hud2();
}
function hud2() { K.set('stars', '★ ' + starN + '/6'); K.set('coins', '● ' + coinN); K.set('hearts', '♥'.repeat(hearts)); K.set('time', Math.floor(time / 60) + ':' + String(Math.floor(time % 60)).padStart(2, '0')); }
function update(dt) {
  if (state !== 'play') return;
  time += dt; if (msgT > 0) msgT -= dt; if (Math.floor(time) !== Math.floor(time - dt)) hud2();
  const t = time;
  for (const m of movers) { const old = { x: m.x, y: m.y, z: m.z }; m.ph += dt * m.spd; const o = Math.sin(m.ph) * m.amp; m.x = m.base.x + (m.ax === 'x' ? o : 0); m.y = m.base.y + (m.ax === 'y' ? o : 0); m.z = m.base.z + (m.ax === 'z' ? o : 0); m.m.position.set(m.x, m.y, m.z); m.dx = m.x - old.x; m.dy = m.y - old.y; m.dz = m.z - old.z; }
  const h = hero;
  // carried by a moving platform
  if (h.on && h.on.dx !== undefined) { h.x += h.on.dx; h.y += h.on.dy; h.z += h.on.dz; }
  const turn = (K.down('left') ? 1 : 0) - (K.down('right') ? 1 : 0), fwd = (K.down('up') ? 1 : 0) - (K.down('down') ? 0.6 : 0);
  h.ang += turn * 2.8 * dt;
  const sp = 7.5, tx = Math.sin(h.ang) * fwd * sp, tz = Math.cos(h.ang) * fwd * sp;
  const acc = h.ground ? 12 : 5; h.vx += (tx - h.vx) * Math.min(1, acc * dt); h.vz += (tz - h.vz) * Math.min(1, acc * dt);
  if (K.hit('a')) { if (h.ground) { h.vy = 12; h.jumps = 1; K.beep(500, 0.08, { to: 800, vol: 0.05 }); } else if (h.jumps === 1) { h.vy = 11; h.jumps = 2; K.beep(700, 0.08, { to: 1000, vol: 0.05 }); } }
  if (K.hit('b') && !h.ground && !h.pound) { h.pound = true; h.vy = -24; h.vx = h.vz = 0; K.beep(300, 0.15, { to: 120, vol: 0.06 }); }
  h.vy -= 28 * dt; if (h.vy < -26) h.vy = -26;
  // move & collide (axis by axis against boxes)
  h.on = null; const R = 0.42, HH = 1.8;
  h.x += h.vx * dt; for (const b of boxes) if (hitBox(h, b, R, HH)) { h.x = h.vx > 0 ? b.x - b.w / 2 - R : b.x + b.w / 2 + R; h.vx = 0; }
  h.z += h.vz * dt; for (const b of boxes) if (hitBox(h, b, R, HH)) { h.z = h.vz > 0 ? b.z - b.d / 2 - R : b.z + b.d / 2 + R; h.vz = 0; }
  h.y += h.vy * dt; h.ground = false;
  for (const b of boxes) if (hitBox(h, b, R, HH)) { if (h.vy <= 0) { h.y = b.y + b.h / 2; h.ground = true; h.on = b; if (h.pound) { h.pound = false; K.noise(0.2, 0.25); } } else { h.y = b.y - b.h / 2 - HH; } h.vy = 0; }
  if (h.ground) h.jumps = 0;
  if (h.inv > 0) h.inv -= dt;
  if (h.y < -25) { hurt(true); }
  // coins, stars, flags
  for (const c of coins) { c.m.rotation.z += dt * 3; if (!c.got && Math.hypot(c.x - h.x, c.y - (h.y + 0.9), c.z - h.z) < 1.1) { c.got = true; scene.remove(c.m); coinN++; if (coinN % 10 === 0 && hearts < 3) hearts++; hud2(); K.beep(1320, 0.06, { vol: 0.04 }); } }
  for (const s of stars) { s.m.rotation.y += dt * 2; s.m.position.y = s.y + Math.sin(t * 2) * 0.2; if (!s.got && Math.hypot(s.x - h.x, s.y - (h.y + 0.9), s.z - h.z) < 1.4) { s.got = true; scene.remove(s.m); starN++; hud2(); K.tune([523, 659, 784, 1047, 1319, 1568], 0.08); msg = starN >= 6 ? 'ALL SIX STARS!' : 'SUN STAR! ' + (6 - starN) + ' TO GO'; msgT = 2; if (starN >= 6) setTimeout(win, 1800); } }
  for (const f of flags) { f.f.rotation.y = Math.sin(t * 3) * 0.3; if (checkpoint !== f && Math.hypot(f.x - h.x, f.z - h.z) < 2 && Math.abs(f.y - h.y) < 2) { checkpoint = f; f.f.material.color.setHex(0x7cff6b); K.tune([659, 880], 0.07); msg = 'CHECKPOINT'; msgT = 1.2; } }
  // puffs
  for (const p of puffs) {
    if (!p.alive) continue; p.ph += dt; const o = Math.sin(p.ph * 0.9) * p.range; p.x = p.base.x + (p.axis === 'x' ? o : 0); p.z = p.base.z + (p.axis === 'z' ? o : 0); p.m.position.set(p.x, p.y + Math.abs(Math.sin(p.ph * 4)) * 0.2, p.z); p.m.rotation.y = Math.cos(p.ph * 0.9) > 0 ? (p.axis === 'x' ? Math.PI / 2 : 0) : (p.axis === 'x' ? -Math.PI / 2 : Math.PI);
    const dx = h.x - p.x, dz = h.z - p.z, d = Math.hypot(dx, dz);
    if (d < 1.1 && h.y > p.y + 0.6 && h.y < p.y + 1.8 && h.vy < 0) { p.alive = false; scene.remove(p.m); h.vy = 9; coinN += 3; hud2(); K.beep(300, 0.1, { type: 'square', vol: 0.05 }); }
    else if (d < 1.1 && Math.abs(h.y - p.y) < 1.2 && h.inv <= 0) { h.vx = dx / d * 10; h.vz = dz / d * 10; h.vy = 6; hurt(false); }
  }
  heroM.position.set(h.x, h.y, h.z); heroM.rotation.y = h.ang;
  const run = Math.hypot(h.vx, h.vz) > 1 && h.ground; heroM.userData.feet[0].position.z = run ? Math.sin(t * 14) * 0.25 : 0.05; heroM.userData.feet[1].position.z = run ? -Math.sin(t * 14) * 0.25 : 0.05;
  heroM.visible = !(h.inv > 0 && Math.floor(t * 12) % 2);
}
function hitBox(h, b, R, HH) { return h.x + R > b.x - b.w / 2 && h.x - R < b.x + b.w / 2 && h.z + R > b.z - b.d / 2 && h.z - R < b.z + b.d / 2 && h.y + HH > b.y - b.h / 2 && h.y < b.y + b.h / 2; }
function hurt(fell) {
  if (!fell && hero.inv > 0) return; hearts--; hero.inv = 1.5; hud2(); K.beep(180, 0.3, { type: 'sawtooth', to: 80, vol: 0.06 });
  if (fell || hearts <= 0) { if (hearts <= 0) { hearts = 3; msg = 'OUT OF HEARTS! BACK TO THE FLAG'; } else msg = 'WHOOPS!'; msgT = 1.5; hero.x = checkpoint.x + 1.5; hero.y = checkpoint.y + 0.5; hero.z = checkpoint.z; hero.vx = hero.vy = hero.vz = 0; hud2(); }
}
function win() { state = 'over'; const tt = Math.floor(time); best = K.saveBest('cloudcastle', tt, true); K.card({ title: 'SUN STARS SAVED!', text: 'You found all six stars in ' + Math.floor(tt / 60) + 'm ' + tt % 60 + 's with ' + coinN + ' coins.', best: 'BEST TIME ' + Math.floor(best / 60) + ':' + String(best % 60).padStart(2, '0'), button: 'Play again', onStart: () => { build(); state = 'play'; } }); }
function draw() {
  if (!renderer || !scene || !hero) return;
  const h = hero, want = new THREE.Vector3(h.x - Math.sin(h.ang) * 8, h.y + 4.2, h.z - Math.cos(h.ang) * 8);
  cam.lerp(want, 0.08); camera.position.copy(cam); camera.lookAt(h.x, h.y + 1.4, h.z);
  renderer.render(scene, camera);
  const c = hud, w = hudC._w, H = hudC._h; c.clearRect(0, 0, w, H);
  // star compass: point at the nearest star you still need
  const left = stars.filter(s => !s.got).sort((a, b) => Math.hypot(a.x - h.x, a.z - h.z) - Math.hypot(b.x - h.x, b.z - h.z))[0];
  if (left) { const a = Math.atan2(left.x - h.x, left.z - h.z) - h.ang; c.save(); c.translate(w / 2, 54); c.rotate(-a); c.fillStyle = 'rgba(255,210,63,.9)'; c.beginPath(); c.moveTo(0, -16); c.lineTo(9, 6); c.lineTo(-9, 6); c.fill(); c.restore(); c.font = '9px Rubik, sans-serif'; c.textAlign = 'center'; c.fillStyle = '#fff'; c.fillText(left.hint, w / 2, 78); }
  if (msgT > 0) { c.font = '20px Bungee, Impact, sans-serif'; c.textAlign = 'center'; c.fillStyle = 'rgba(0,0,0,.4)'; c.fillText(msg, w / 2 + 2, H * 0.32 + 2); c.fillStyle = '#ffd23f'; c.fillText(msg, w / 2, H * 0.32); }
}
title();
K.run(update, draw);
</script>
