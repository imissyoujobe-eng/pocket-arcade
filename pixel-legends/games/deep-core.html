<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deep Core</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script>
// Deep Core: explore an alien base room by room. Find the roll orb, missiles and jump boots to reach new areas, then destroy the creature at the core.
K.theme({ bg: '#05070f', ink: '#e8f4ff', accent: '#ff8a1f', accentInk: '#2a1000' });
const VW = 320, VH = 240, T = 16, RW = 20, RH = 15;
K.screen(VW, VH);
K.hud(['energy', 'missiles', 'items']);
K.pad({ dpad: '4', buttons: [{ id: 'x', label: 'MSL' }, { id: 'b', label: 'FIRE' }, { id: 'a', label: 'JUMP' }] });
</script>
<script src="../lib/plat.js"></script>
<script src="../lib/art.js"></script>
<script>
const WORLD = ["############################################################", "#..................##..................##..................#", "#..................##..................##..................#", "#..................##..................##..................#", "#..................##..................##..................#", "#.........f........##..................##..................#", "#..................##..................##..................#", "#..................##..................##.........m........#", "#..................##..............######........===.......#", "#...r..............##..............######..................#", "#..====............##..............######..................#", "#..................DD..............######....===...........#", "#.......c..........DD....P..S......######.............f....#", "#..................DD......................................#", "###########################...##############################", "###########################...##############################", "#..................##..................##..................#", "#..................##.....=====........##..................#", "#..................##..................##..................#", "#..................##..................##..................#", "#..................##..====............##..................#", "#..................##..................##..................#", "#....e.............##..................##..................#", "#...===............##.......====.......##..................#", "#..................##..................##...........##.....#", "#..................##.....f............##...........##.....#", "#........===.......DD...........===....RR...........##.....#", "#...c..............DD.........c........RR....f......##.....#", "#..................DD.S................RR...........##..S..#", "#####...###############################################...##", "#####...###############################################...##", "#..................##..................##..................#", "#....====..........##..................##..................#", "#..................##..................##..................#", "#..................##..................##..................#", "#....====..........##..................##..................#", "#..................##..................##..................#", "#..................##.........e........##..................#", "#..................##........===.......##......====........#", "#..====............##..................##..................#", "#..................##..................##..B...............#", "#..................DD...====.....===...##..===.......===...#", "#.......c..........DD.....f............##..................#", "#..............j...DD...AAAAA..........##..................#", "############################################################"];
const WT = WORLD[0].length, HT = WORLD.length;
const ITEMS = { r: 'ROLL ORB: press down to curl into a ball and roll through tunnels.', m: 'MISSILES: tap MSL to fire. They open orange doors.', j: 'JUMP BOOTS: you can jump much higher now.', e: 'ENERGY TANK: +100 max energy.' };
let state = 'title', w, p, ents, shots, eshots, fx, energy, maxE, missiles, has, save, room, seen, doorsOpen, boss, msg, msgT, popup, time, best = K.best('deepcore');
// the MSL button is a third button; map X key to it as well
addEventListener('keydown', e => { if (e.key === 'c' || e.key === 'C') K.press('x'); });
addEventListener('keyup', e => { if (e.key === 'c' || e.key === 'C') K.release('x'); });
function title() { K.card({ title: 'DEEP CORE', text: 'Explore the alien base. Shoot blue doors to open them. Find upgrades to reach new rooms: the roll orb (press down to roll through low tunnels), missiles (MSL button, opens orange doors) and jump boots. Touch a glowing save pad to heal. Destroy the creature at the core!', best: best ? 'BEST TIME ' + fmt(best) : '', button: 'Land', onStart: start }); }
function fmt(s) { return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }
function start() {
  w = P.world(WORLD.map(r => r)); P.SOLID = '#DR'; P.ONEWAY = '=';
  ents = []; shots = []; eshots = []; fx = []; energy = 99; maxE = 99; missiles = 0; has = {}; seen = {}; time = 0; popup = 0; boss = null;
  for (let y = 0; y < HT; y++) for (let x = 0; x < WT; x++) {
    const ch = w.g[y][x], X = x * T, Y = y * T;
    if (ch === 'P') { save = { x: X, y: Y }; w.g[y][x] = '.'; }
    if (ch === 'c') { ents.push(P.walker(X, Y + 4, { kind: 'crawler', w: 14, h: 10, vx: 30, hp: 2, smart: true })); w.g[y][x] = '.'; }
    if (ch === 'f') { ents.push({ kind: 'flyer', x: X, y: Y, hx: X, hy: Y, w: 12, h: 10, hp: 2, alive: true, t: 0 }); w.g[y][x] = '.'; }
    if (ch === 'B') { boss = { x: X, y: Y - 20, w: 40, h: 40, hp: 140, max: 140, t: 0, alive: true, vy: 40 }; w.g[y][x] = '.'; }
  }
  respawn(); state = 'play'; hud();
}
function respawn() { p = P.player(save.x, save.y, { w: 10, h: 20, jump: 300, autoRun: false, run: 90, sprint: 90 }); p.ball = false; p.inv = 1; room = roomOf(); }
function roomOf() { return { c: Math.floor((p.x + p.w / 2) / (RW * T)), r: Math.floor((p.y + p.h / 2) / (RH * T)) }; }
function hud() { K.set('energy', 'EN ' + Math.max(0, Math.ceil(energy)) + '/' + maxE); K.set('missiles', has.m ? 'MSL ' + missiles : ''); K.set('items', (has.r ? '● ' : '') + (has.j ? '▲ ' : '') + fmt(time)); }
function hurt(n) { if (p.inv > 0) return; energy -= n; p.inv = 1; p.vy = -150; p.vx = -p.face * 80; K.beep(200, 0.15, { type: 'square', vol: 0.06 }); hud(); if (energy <= 0) { energy = 0; dead(); } }
function dead() { state = 'dying'; K.tune([392, 330, 262, 196], 0.18, { type: 'sawtooth' }); setTimeout(() => { energy = Math.min(maxE, 99); respawn(); state = 'play'; hud(); msg = 'BACK AT THE SAVE PAD'; msgT = 1.5; }, 1500); }

function update(dt) {
  if (state !== 'play') return;
  time += dt; if (msgT > 0) msgT -= dt; if (popup > 0) { popup -= dt; return; }
  for (const f of fx) { f.l -= dt; if (f.vx != null) { f.x += f.vx * dt; f.y += f.vy * dt; } } fx = fx.filter(f => f.l > 0);
  // roll into a ball / stand up
  if (has.r && K.hit('down') && p.ground && !p.ball) { p.ball = true; p.h = 12; p.y += 8; p.w = 12; K.beep(400, 0.08, { to: 200, vol: 0.04 }); }
  if (p.ball && (K.hit('up') || K.hit('a'))) { if (!P.hitsSolid(w, p.x, p.y - 8, 10, 20)) { p.ball = false; p.h = 20; p.w = 10; p.y -= 8; } }
  p.cfg.jump = has.j ? 405 : 300;
  if (p.ball) { const ax = (K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0); if (ax) p.face = ax; p.vx = ax * 95; p.vy = Math.min(330, p.vy + 820 * dt); P.move(w, p, dt); }
  else P.control(w, p, dt, { run: false, down: false });
  if (p.inv > 0) p.inv -= 0;
  // shooting: beam (up if holding up) and missiles
  if (!p.ball) {
    const up = K.down('up');
    if (K.hit('b')) { shots.push({ x: p.x + p.w / 2 + (up ? 0 : p.face * 8), y: p.y + (up ? 0 : 6), vx: up ? 0 : p.face * 300, vy: up ? -300 : 0, l: 0.35, m: false }); K.beep(1200, 0.05, { to: 500, vol: 0.03 }); }
    if (K.hit('x')) { if (has.m && missiles > 0) { missiles--; hud(); shots.push({ x: p.x + p.w / 2 + (up ? 0 : p.face * 8), y: p.y + (up ? 0 : 6), vx: up ? 0 : p.face * 260, vy: up ? -260 : 0, l: 0.8, m: true }); K.beep(300, 0.15, { to: 900, vol: 0.06 }); } else K.beep(120, 0.05, { vol: 0.04 }); }
  }
  for (const s of shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.l -= dt;
    const tx = Math.floor(s.x / T), ty = Math.floor(s.y / T), ch = P.tile(w, s.x, s.y);
    if (ch === 'D' || (ch === 'R' && s.m)) { openDoor(tx, ty, ch); s.l = 0; }
    else if (P.isSolid(ch)) s.l = 0;
  }
  // items and save pads
  const tc = P.touches(w, p, 'rmjeSA');
  if (tc) {
    if ('rmje'.includes(tc.ch)) { P.set(w, tc.tx, tc.ty, '.'); has[tc.ch] = true; if (tc.ch === 'm') missiles += 15; if (tc.ch === 'e') { maxE += 100; energy = maxE; } msg = ITEMS[tc.ch]; msgT = 3.5; popup = 1.2; K.tune([523, 659, 784, 1047, 1319], 0.1); hud(); }
    if (tc.ch === 'S') { if (energy < maxE || save.x !== tc.tx * T || save.y !== tc.ty * T) { energy = maxE; save = { x: tc.tx * T, y: tc.ty * T - 4 }; if (has.m) missiles = Math.max(missiles, 15); msg = 'SAVED. ENERGY RESTORED'; msgT = 1.6; K.tune([659, 880, 1175], 0.08); hud(); } }
    if (tc.ch === 'A') hurt(8);
  }
  room = roomOf(); seen[room.c + ',' + room.r] = true;
  // enemies only act in your room
  for (const e of ents) {
    if (!e.alive) continue;
    const er = { c: Math.floor(e.x / (RW * T)), r: Math.floor(e.y / (RH * T)) };
    if (er.c !== room.c || er.r !== room.r) continue;
    if (e.kind === 'crawler') P.stepWalker(w, e, dt);
    else { e.t += dt; const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy); if (d < 140) { e.x += dx / d * 50 * dt; e.y += dy / d * 50 * dt; } else { e.x += (e.hx - e.x) * dt; e.y += (e.hy + Math.sin(e.t * 2) * 20 - e.y) * dt; } }
    for (const s of shots) if (s.l > 0 && P.overlap({ x: s.x - 3, y: s.y - 3, w: 6, h: 6 }, e)) { s.l = 0; e.hp -= s.m ? 4 : 1; K.beep(500, 0.04, { vol: 0.04 }); if (e.hp <= 0) { e.alive = false; pop(e.x + 6, e.y + 5, '#ff8a1f'); if (Math.random() < 0.5) fx.push({ drop: has.m && Math.random() < 0.5 ? 'm' : 'e', x: e.x + 4, y: e.y, l: 8 }); } }
    if (e.alive && P.overlap(p, e)) hurt(12);
  }
  ents = ents.filter(e => e.alive);
  for (const d of fx) if (d.drop && Math.abs(d.x - (p.x + p.w / 2)) < 10 && Math.abs(d.y - (p.y + p.h / 2)) < 14) { d.l = 0; if (d.drop === 'm') missiles += 2; else energy = Math.min(maxE, energy + 15); K.beep(1100, 0.05, { vol: 0.04 }); hud(); }
  // boss
  if (boss && boss.alive) {
    const br = { c: Math.floor(boss.x / (RW * T)), r: Math.floor(boss.y / (RH * T)) };
    if (br.c === room.c && br.r === room.r) {
      boss.t += dt; boss.y += boss.vy * dt; if (boss.y < br.r * RH * T + 40 || boss.y > br.r * RH * T + 160) boss.vy = -boss.vy;
      if (boss.t > (boss.hp < 60 ? 0.9 : 1.4)) { boss.t = 0; for (let k = -1; k <= 1; k++) { const a = Math.atan2(p.y - boss.y - 20, p.x - boss.x - 20) + k * 0.25; eshots.push({ x: boss.x + 30, y: boss.y + 20, vx: Math.cos(a) * 110, vy: Math.sin(a) * 110, l: 4 }); } K.beep(150, 0.2, { type: 'sawtooth', vol: 0.05 }); }
      for (const s of shots) if (s.l > 0 && P.overlap({ x: s.x - 3, y: s.y - 3, w: 6, h: 6 }, boss)) { s.l = 0; boss.hp -= s.m ? 6 : 1; boss.hit = 0.08; K.beep(250, 0.04, { vol: 0.05 }); if (boss.hp <= 0) { boss.alive = false; for (let i = 0; i < 40; i++) fx.push({ x: boss.x + 20, y: boss.y + 20, vx: K.rnd(-120, 120), vy: K.rnd(-120, 120), l: 1, c: '#ff8a1f' }); K.noise(1, 0.5); setTimeout(win, 1800); } }
      if (boss.hit > 0) boss.hit -= dt;
      if (P.overlap(p, boss)) hurt(20);
    }
  }
  for (const b of eshots) { b.x += b.vx * dt; b.y += b.vy * dt; b.l -= dt; if (P.isSolid(P.tile(w, b.x, b.y))) b.l = 0; if (P.overlap({ x: b.x - 3, y: b.y - 3, w: 6, h: 6 }, p)) { b.l = 0; hurt(15); } }
  eshots = eshots.filter(b => b.l > 0); shots = shots.filter(s => s.l > 0);
  if (p.inv > 0) p.inv = Math.max(0, p.inv - dt);
  if (Math.floor(time) !== Math.floor(time - dt)) hud();
}
function openDoor(tx, ty, ch) { for (let dy = -3; dy <= 3; dy++) if (P.tile(w, tx * T + 1, (ty + dy) * T + 1) === ch) P.set(w, tx, ty + dy, '.'); K.beep(ch === 'R' ? 300 : 700, 0.2, { to: 1400, vol: 0.05 }); }
function pop(x, y, c) { for (let i = 0; i < 10; i++) fx.push({ x, y, vx: K.rnd(-80, 80), vy: K.rnd(-80, 80), l: 0.4, c }); K.noise(0.12, 0.15); }
function win() { state = 'over'; const t = Math.floor(time); best = K.saveBest('deepcore', t, true); K.card({ title: 'CORE DESTROYED', text: 'The base is safe! You finished in ' + fmt(t) + ' with ' + Object.keys(has).length + ' upgrades.', best: 'BEST TIME ' + fmt(best), button: 'Play again', onStart: start }); }

function draw(c, t) {
  c.fillStyle = '#05070f'; c.fillRect(0, 0, VW, VH);
  if (!w) return;
  const ox = room.c * RW * T, oy = room.r * RH * T;
  // background: deep cave wall with glowing crystals and pipes
  const bg = c.createLinearGradient(0, 0, 0, VH); bg.addColorStop(0, '#0a1020'); bg.addColorStop(1, '#141a34'); c.fillStyle = bg; c.fillRect(0, 0, VW, VH);
  for (let i = 0; i < 26; i++) { const hx = A.hash(i, room.r * 7 + room.c, 1) * VW, hy = A.hash(i, room.r + room.c * 5, 2) * VH, r = 10 + A.hash(i, 3) * 26; c.fillStyle = 'rgba(40,60,110,' + (0.15 + A.hash(i, 4) * 0.2) + ')'; c.beginPath(); c.ellipse(hx, hy, r, r * 0.6, A.hash(i, 5) * 3, 0, 7); c.fill(); }
  for (let i = 0; i < 6; i++) { const hx = A.hash(i, room.c + 11, 6) * VW, hy = A.hash(i, room.r + 13, 7) * VH, col = ['120,200,255', '200,120,255', '120,255,200'][i % 3]; A.glow(c, hx, hy, 30, col, 0.18); c.fillStyle = 'rgba(' + col + ',.7)'; c.beginPath(); c.moveTo(hx, hy - 7); c.lineTo(hx + 3, hy); c.lineTo(hx, hy + 4); c.lineTo(hx - 3, hy); c.fill(); }
  c.fillStyle = '#1a2440'; for (let y = 40; y < VH; y += 96) { c.fillRect(0, y, VW, 5); c.fillStyle = 'rgba(255,255,255,.08)'; c.fillRect(0, y, VW, 1); c.fillStyle = '#1a2440'; }
  const CAVE = Object.assign({}, A.PAL.stone, { base: '#34446a', hi: '#4c6292', lo: '#1e2a46', mortar: '#0c1222' });
  const solidAt = (gx, gy) => { const yy = room.r * RH + gy, xx = room.c * RW + gx; if (yy < 0 || yy >= w.rows || xx < 0 || xx >= w.cols) return true; return w.g[yy][xx] === '#'; };
  for (let y = 0; y < RH; y++) for (let x = 0; x < RW; x++) {
    const ch = w.g[room.r * RH + y][room.c * RW + x], X = x * T, Y = y * T;
    if (ch === '#') A.tile(c, 'dc', X, Y, A.edges(solidAt, x, y), room.c * RW + x, room.r * RH + y, CAVE);
    else if (ch === '=') A.ledge(c, X, Y, T, A.PAL.metal);
    else if (ch === 'D' || ch === 'R') { c.fillStyle = ch === 'D' ? '#2a8aff' : '#ff8a1f'; c.fillRect(X + 4, Y, 8, T); c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(X + 6, Y + 2, 2, T - 4); }
    else if (ch === 'A') { c.fillStyle = Math.floor(t / 200 + x) % 2 ? '#7cff6b' : '#4ad04a'; c.fillRect(X, Y + 6, T, 10); }
    else if (ch === 'S') { c.fillStyle = '#7cffda'; c.globalAlpha = 0.5 + Math.sin(t / 200) * 0.3; c.fillRect(X - 2, Y + 12, T + 4, 4); c.globalAlpha = 0.2; c.fillRect(X, Y - 20, T, 32); c.globalAlpha = 1; }
    else if ('rmje'.includes(ch)) { const b = Math.sin(t / 200) * 2; c.fillStyle = { r: '#ff5fa2', m: '#ff8a1f', j: '#46d0ff', e: '#7cff6b' }[ch]; c.beginPath(); c.arc(X + 8, Y + 8 + b, 6, 0, 7); c.fill(); c.fillStyle = '#fff'; c.fillRect(X + 6, Y + 5 + b, 2, 2); }
  }
  for (const e of ents) { const x = Math.round(e.x - ox), y = Math.round(e.y - oy); if (x < -20 || x > VW + 20 || y < -20 || y > VH + 20) continue; if (e.kind === 'crawler') { c.fillStyle = '#c0306a'; c.beginPath(); c.ellipse(x + 7, y + 6, 8, 6, 0, Math.PI, 0); c.fill(); c.fillStyle = '#ffd23f'; for (let k = 0; k < 4; k++) c.fillRect(x + 1 + k * 4, y + 3 - (k % 2) * 3, 2, 3); c.fillStyle = '#5a1a3a'; c.fillRect(x, y + 6, 14, 4); } else { c.fillStyle = '#7a4ad8'; c.fillRect(x, y + 2, 12, 6); c.fillStyle = '#b89aff'; c.fillRect(x - 3, y - (Math.floor(t / 80) % 2) * 3, 4, 3); c.fillRect(x + 11, y - (Math.floor(t / 80) % 2) * 3, 4, 3); c.fillStyle = '#ffd23f'; c.fillRect(x + 4, y + 4, 4, 2); } }
  if (boss && boss.alive) { const x = Math.round(boss.x - ox), y = Math.round(boss.y - oy); if (x > -60 && x < VW && y > -60 && y < VH) { c.fillStyle = boss.hit > 0 ? '#fff' : '#8a2a5a'; c.beginPath(); c.ellipse(x + 20, y + 20, 22, 20, 0, 0, 7); c.fill(); c.fillStyle = '#ff5fa2'; for (let k = 0; k < 5; k++) c.fillRect(x + 2 + k * 8, y + 36 + Math.sin(t / 150 + k) * 4, 4, 10); c.fillStyle = '#ffd23f'; c.beginPath(); c.arc(x + 26, y + 16, 7, 0, 7); c.fill(); c.fillStyle = '#000'; c.beginPath(); c.arc(x + 26 + Math.sign(p.x - boss.x) * 2, y + 16, 3, 0, 7); c.fill(); c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(VW / 2 - 60, 8, 120, 6); c.fillStyle = '#ff5fa2'; c.fillRect(VW / 2 - 59, 9, 118 * boss.hp / boss.max, 4); } }
  for (const s of shots) { c.fillStyle = s.m ? '#ff8a1f' : '#ffd23f'; if (s.vy) c.fillRect(s.x - ox - 1.5, s.y - oy - 5, 3, 10); else c.fillRect(s.x - ox - 5, s.y - oy - 1.5, 10, 3); }
  c.fillStyle = '#ff5fa2'; for (const b of eshots) { c.beginPath(); c.arc(b.x - ox, b.y - oy, 3, 0, 7); c.fill(); }
  for (const f of fx) { if (f.drop) { c.fillStyle = f.drop === 'm' ? '#ff8a1f' : '#7cff6b'; c.fillRect(f.x - ox, f.y - oy + Math.sin(t / 150) * 2, 6, 6); } else { c.fillStyle = f.c || '#fff'; c.fillRect(f.x - ox - 1.5, f.y - oy - 1.5, 3, 3); } }
  // hero in a power suit
  if (state !== 'dying' && !(p.inv > 0 && Math.floor(t / 60) % 2)) {
    const x = Math.round(p.x - ox), y = Math.round(p.y - oy), f = p.face;
    if (p.ball) { c.save(); c.translate(x + 6, y + 6); c.rotate(t / 60 * f); c.fillStyle = '#ff8a1f'; c.beginPath(); c.arc(0, 0, 6, 0, 7); c.fill(); c.fillStyle = '#ffd23f'; c.fillRect(-6, -1, 12, 2); c.restore(); }
    else {
      const k = p.ground && Math.abs(p.vx) > 5 ? Math.floor(p.anim / 8) % 2 : 0;
      c.fillStyle = '#c85a1a'; c.fillRect(x + 1 + k * 2, y + 13, 3, 7); c.fillRect(x + 6 - k * 2, y + 13, 3, 7);
      c.fillStyle = '#ff8a1f'; c.fillRect(x, y + 5, 10, 9); c.fillStyle = '#ffd23f'; c.fillRect(x + (f > 0 ? -1 : 8), y + 4, 3, 4);
      c.fillStyle = '#ff8a1f'; c.fillRect(x + 1, y - 1, 8, 7); c.fillStyle = '#7cffda'; c.fillRect(x + (f > 0 ? 5 : 1), y + 1, 4, 3);
      const up = K.down('up'); c.fillStyle = '#9aa0aa'; if (up) c.fillRect(x + (f > 0 ? 7 : 1), y - 6, 3, 9); else c.fillRect(x + (f > 0 ? 8 : -6), y + 6, 8, 4);
    }
  }
  // minimap
  c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(VW - 40, 6, 34, 26);
  for (let r = 0; r < 3; r++) for (let cc = 0; cc < 3; cc++) { c.fillStyle = cc === room.c && r === room.r ? '#ffd23f' : seen[cc + ',' + r] ? '#2a8aff' : '#222'; c.fillRect(VW - 38 + cc * 11, 8 + r * 8, 9, 6); }
  if (msgT > 0) { c.fillStyle = 'rgba(0,0,0,.7)'; c.fillRect(10, VH - 52, VW - 20, 40); wrap(c, msg, VW / 2, VH - 38, VW - 40); }
}
function wrap(c, txt, x, y, mw) { c.font = '9px Rubik, sans-serif'; c.textAlign = 'center'; c.fillStyle = '#fff'; let line = ''; for (const wd of txt.split(' ')) { const tst = line ? line + ' ' + wd : wd; if (c.measureText(tst).width > mw) { c.fillText(line, x, y); y += 12; line = wd; } else line = tst; } c.fillText(line, x, y); }
title();
{ const _draw = draw; draw = function (c, t) { _draw(c, t); if (w) { A.ambient(c, VW, VH, t, 'dust', 14); A.vignette(c, VW, VH, 0.45); } }; }
K.run(update, draw);
</script>
</body>
</html>
