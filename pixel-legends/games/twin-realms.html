........T", "T..............TT...XXXXXXXX...TT..............T", "T..~~~~~~~~....TT...X......X...TT..XXX..XXX....T", "T..~......~.........X..K...X...................T", "T..~..1...~.........XXXXGXXX...................T", "T..~......~....................................T", "T..~~~..~~~...........................w..w.....T", "T..............TT..............TT..............T", "T..............TT..............TT..............T", "T..............TT..............TT..............T", "TTTTTT....TTTTTTTTTTTT....TTTTTTTTTTTT....TTTTTT", "TTTTTT....TTTTTTTTTTTT....TTTTTTTTTTTT....TTTTTT", "T..............TT..............TT..............T", "T.X.X.X.X......TT..............TT..............T", "T..............TT..............TT...XX..XX.....T", "T...................X......X........X....X.....T", "T........w..........................X....X.....T", "T...................................X....X.....T", "T...................................XXXXXX.....T", "T.X.X.X.X......TT.....w........TT.........w..w.T", "T..............TT..............TT..............T", "T..............TT..............TT..............T", "TTTTTT....TTTTTTTTTTTT....TTTTTTTTTTTT....TTTTTT", "TTTTTT....TTTTTTTTTTTT....TTTTTTTTTTTT....TTTTTT", "T..............TT..............TT..............T", "T..............TT..............TT..............T", "T..XXXX........TT..XX......XX..TT..............T", "T..X..X............XX......XX.......XXXXXX.....T", "T..X..X.............................X....X.....T", "T..X..X...w.........................X.3..X.....T", "T..XXXX.............................X....X.....T", "T..............TT.......w......TT...XXXXXX.w...T", "T..............TT..............TT..............T", "T..............TT..............TT..............T", "TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT"]};

let state = 'title', worlds, realm, w, p, cam, trans, ents, fx, hp, maxHp, shards, hasMirror, talk, time, flash, kingDead, best = K.best('twinrealms');
function title() { K.card({ title: 'TWIN REALMS', text: 'Two worlds share one map. Find the mirror, then press MIRROR to flip between the sunlit realm and the shadow realm. A wall in one world can be open ground in the other! Collect three sun shards to open the Shadow King\'s gate.', best: best ? 'BEST TIME ' + fmt(best) : '', button: 'Begin', onStart: start }); }
function fmt(s) { return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }
function start() {
  worlds = { light: D.world(MAPS.light), shadow: D.world(MAPS.shadow) };
  D.SOLID = '#TWRXB~G';
  hp = 4; maxHp = 4; shards = 0; hasMirror = false; time = 0; flash = 0; kingDead = false; fx = [];
  realm = 'light'; w = worlds.light;
  let at = { x: 32, y: 32 }; for (let y = 0; y < w.rows; y++) for (let x = 0; x < w.cols; x++) if (w.g[y][x] === 'P') { at = { x: x * T + 2, y: y * T + 2 }; w.g[y][x] = '.'; }
  p = { x: at.x, y: at.y, w: 12, h: 12, face: 'u', atk: 0, inv: 0 }; spawn = { x: at.x, y: at.y, realm: 'light' };
  const s = D.screenOf(p.x + 6, p.y + 6); cam = D.camFor(s); trans = null; loadScreen(s);
  state = 'play'; hud();
  talk = { who: '', lines: ['The land has split in two: a sunlit realm and its shadow.', 'Legends say a mirror lets you step between them. Look in the rocky nook to the west.'] };
}
let spawn;
function hud() { K.set('realm', realm === 'light' ? '☀ SUNLIT' : '☾ SHADOW'); K.set('shards', 'SHARDS ' + shards + '/3'); K.set('time', fmt(time)); }
function loadScreen(s) {
  ents = [];
  for (let y = 0; y < D.SH; y++) for (let x = 0; x < D.SW; x++) {
    const tx = s.sx * D.SW + x, ty = s.sy * D.SH + y, ch = w.g[ty][tx], X = tx * T, Y = ty * T;

    if (ch === 'm') ents.push({ kind: 'grunt', x: X + 2, y: Y + 2, w: 12, h: 12, hp: 2, t: 0, dir: [0, 0], inv: 0, alive: true });

}
function swap() {

  realm = realm === 'light' ? 'shadow' : 'light'; w = other; flash = 0.4; hud();
  K.tune(realm === 'shadow' ? [659, 523, 392] : [392, 523, 659], 0.07, { type: 'triangle' });
  loadScreen(D.screenOf(p.x + 6, p.y + 6));
}
function update(dt) {

  if (flash > 0) flash -= dt;
  for (const f of fx) { f.l -= dt; if (f.vx != null) { f.x += f.vx * dt; f.y += f.vy * dt; } } fx = fx.filter(f => f.l > 0);
  if (trans) { trans.t += dt / 0.45; cam.x = trans.fx + (trans.tx - trans.fx) * Math.min(1, trans.t); cam.y = trans.fy + (trans.ty - trans.fy) * Math.min(1, trans.t); if (trans.t >= 1) trans = null; return; }

  if (p.atk > 0) p.atk -= dt;

    const d = D.input(p);
    if (d[0] || d[1]) { D.move(w, p, d[0] * 74 * dt, 0); D.move(w, p, 0, d[1] * 74 * dt); p.walk = (p.walk || 0) + dt; }
    if (K.hit('a')) { p.atk = 0.22; K.beep(900, 0.06, { to: 300, vol: 0.04 }); const box = D.swordBox(p, 16); for (const e of ents) if (e.alive && e.inv <= 0 && D.overlap(box, e)) { e.hp--; e.inv = 0.35; K.beep(300, 0.06, { vol: 0.05 }); if (e.hp <= 0) kill(e); } for (const [ax, ay] of [[box.x + box.w / 2, box.y + box.h / 2]]) if (D.tile(w, ax, ay) === 'B') { D.set(w, Math.floor(ax / T), Math.floor(ay / T), '.'); } }

  }

    const ch = D.tile(w, ax, ay), tx = Math.floor(ax / T), ty = Math.floor(ay / T);
    if (ch === 'M') { D.set(w, tx, ty, '.'); hasMirror = true; K.tune([523, 659, 784, 1047, 1319], 0.1); talk = { who: '', lines: ['You found the Twin Mirror!', 'Press MIRROR to flip realms. If something solid stands in the same spot in the other world, the mirror will not let you through.'] }; }
    if ('123'.includes(ch)) { D.set(w, tx, ty, '.'); shards++; hp = maxHp; hud(); K.tune([784, 988, 1175, 1568], 0.09); talk = { who: '', lines: shards < 3 ? ['A sun shard! ' + (3 - shards) + ' to go.'] : ['The third sun shard! Far to the north, the Shadow King\'s gate is weakening...'] }; if (shards >= 3) { const sw = worlds.shadow; for (let y = 0; y < sw.rows; y++) for (let x = 0; x < sw.cols; x++) if (sw.g[y][x] === 'G') sw.g[y][x] = '.'; } }

  }

  if (c2.x !== cam.x || c2.y !== cam.y) { trans = { fx: cam.x, fy: cam.y, tx: c2.x, ty: c2.y, t: 0 }; loadScreen(s); return; }

      if (D.move(w, e, e.dir[0] * 34 * dt, e.dir[1] * 34 * dt)) e.t = 0;
    } else if (e.kind === 'wraith') {
      const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1; e.x += dx / d * 24 * dt; e.y += dy / d * 24 * dt;
      if (e.t <= 0) { e.t = 2.2; fx.push({ orb: true, x: e.x + 6, y: e.y + 6, vx: dx / d * 80, vy: dy / d * 80, l: 3 }); }
    } else if (e.kind === 'king') {
      e.tp -= dt; if (e.tp <= 0) { e.tp = 2.6; e.x = cam.x + K.rnd(40, VW - 60); e.y = cam.y + K.rnd(40, 80); for (let i = 0; i < 10; i++) fx.push({ x: e.x + 10, y: e.y + 10, vx: K.rnd(-60, 60), vy: K.rnd(-60, 60), l: 0.4, c: '#c8a0ff' }); }
      if (e.t <= 0) { e.t = e.hp < 8 ? 0.9 : 1.4; for (let k = 0; k < (e.hp < 8 ? 8 : 5); k++) { const a = k / (e.hp < 8 ? 8 : 5) * Math.PI * 2 + time; fx.push({ orb: true, x: e.x + 10, y: e.y + 10, vx: Math.cos(a) * 70, vy: Math.sin(a) * 70, l: 3 }); } K.beep(200, 0.2, { type: 'sawtooth', vol: 0.04 }); }
      e.x = K.clamp(e.x, cam.x + 4, cam.x + VW - 24); e.y = K.clamp(e.y, cam.y + 4, cam.y + VH - 24);
    }
    if (p.inv <= 0 && D.overlap(p, e)) hurt(e.kind === 'king' ? 1 : 0.5, e);
  }
  ents = ents.filter(e => e.alive);
  for (const f of fx) if (f.orb) { if (D.isSolid(D.tile(w, f.x, f.y))) f.l = 0; if (p.inv <= 0 && Math.abs(f.x - p.x - 6) < 8 && Math.abs(f.y - p.y - 6) < 8) { f.l = 0; hurt(0.5, f); } }
}
function kill(e) {
  e.alive = false; K.noise(0.15, 0.15); for (let i = 0; i < 10; i++) fx.push({ x: e.x + e.w / 2, y: e.y + e.h / 2, vx: K.rnd(-60, 60), vy: K.rnd(-60, 60), l: 0.4, c: realm === 'light' ? '#fff' : '#c8a0ff' });
  if (Math.random() < 0.3) hp = Math.min(maxHp, hp + 0.5);
  if (e.kind === 'king') { kingDead = true; K.tune([392, 523, 659, 784, 1047, 1319], 0.14); talk = { who: '', lines: ['The Shadow King fades with a howl. Light floods back into both realms.'], done: win }; }
}
function hurt(n, src) {
  if (p.inv > 0) return; hp -= n; p.inv = 1; const dx = p.x - src.x, dy = p.y - src.y, d = Math.hypot(dx, dy) || 1; D.move(w, p, dx / d * 10, 0); D.move(w, p, 0, dy / d * 10); K.beep(220, 0.15, { type: 'square', vol: 0.06 });
  if (hp <= 0) { hp = maxHp; realm = spawn.realm; w = worlds[realm]; p.x = spawn.x; p.y = spawn.y; const s = D.screenOf(p.x + 6, p.y + 6); cam = D.camFor(s); loadScreen(s); hud(); talk = { who: '', lines: ['You black out... and wake where you began.'] }; }
}
function win() { state = 'over'; const t = Math.floor(time); best = K.saveBest('twinrealms', t, true); K.card({ title: 'REALMS REUNITED', text: 'You defeated the Shadow King in ' + fmt(t) + '.', best: 'BEST TIME ' + fmt(best), button: 'Play again', onStart: start }); }

function drawTile(c, ch, x, y, tx, ty, t) {
  const sh = realm === 'shadow';
  c.fillStyle = sh ? ((tx + ty) % 2 ? '#3a2a4a' : '#362846') : ((tx + ty) % 2 ? '#8ad06a' : '#84ca64'); c.fillRect(x, y, T, T);
  if (ch === 'T') { if (sh) { c.fillStyle = '#5a4a3a'; c.fillRect(x + 7, y + 2, 2, 14); c.fillRect(x + 3, y + 5, 10, 2); c.fillRect(x + 4, y + 2, 2, 4); } else { c.fillStyle = '#2f7a2c'; c.beginPath(); c.arc(x + 8, y + 7, 7, 0, 7); c.fill(); c.fillStyle = '#6a3a1a'; c.fillRect(x + 6, y + 12, 4, 4); } }
  else if (ch === 'W') { c.fillStyle = '#2a7ad8'; c.fillRect(x, y, T, T); c.fillStyle = '#7ac8ff'; c.fillRect(x + (t / 80 + tx * 3) % 12, y + 6, 4, 1); }
  else if (ch === '~') { c.fillStyle = '#3a5a2a'; c.fillRect(x, y, T, T); c.fillStyle = '#6a8a3a'; c.fillRect(x + (t / 120 + tx * 5) % 12, y + 7, 3, 2); }
  else if (ch === 'R') { c.fillStyle = '#9a8a7a'; c.fillRect(x, y, T, T); c.fillStyle = '#b8a898'; c.fillRect(x + 2, y + 2, 6, 5); c.fillRect(x + 8, y + 9, 6, 5); }
  else if (ch === 'X') { c.fillStyle = '#1a1424'; c.fillRect(x, y, T, T); c.fillStyle = '#5a3a8a'; c.fillRect(x + 3, y + 3, 4, 4); c.fillRect(x + 9, y + 9, 4, 4); }
  else if (ch === 'B') { c.fillStyle = '#3fa34d'; c.beginPath(); c.arc(x + 8, y + 8, 7, 0, 7); c.fill(); }

  else if (ch === 'M') { c.fillStyle = '#c8a050'; c.fillRect(x + 2, y + 4, 12, 10); c.fillStyle = '#8a5a2a'; c.fillRect(x + 2, y + 8, 12, 2); c.fillStyle = '#ffd23f'; c.fillRect(x + 7, y + 7, 2, 4); }
  else if ('123'.includes(ch)) { const g = 0.6 + Math.sin(t / 180) * 0.3; c.fillStyle = 'rgba(255,210,63,' + g * 0.4 + ')'; c.beginPath(); c.arc(x + 8, y + 8, 9, 0, 7); c.fill(); c.fillStyle = '#ffd23f'; c.beginPath(); c.moveTo(x + 8, y + 2); c.lineTo(x + 13, y + 8); c.lineTo(x + 8, y + 14); c.lineTo(x + 3, y + 8); c.fill(); }

function draw(c, t) {

    else if (e.kind === 'grunt') { c.fillStyle = '#c86a2a'; c.fillRect(x, y + 3, 12, 9); c.fillStyle = '#8a4a1a'; c.fillRect(x + 1, y - 1, 10, 6); c.fillStyle = '#ff3b5c'; c.fillRect(x + 3, y + 1, 2, 2); c.fillRect(x + 7, y + 1, 2, 2); }

    else if (e.kind === 'king') { c.fillStyle = '#2a1a3a'; c.beginPath(); c.moveTo(x + 10, y - 2); c.lineTo(x + 22, y + 22); c.lineTo(x - 2, y + 22); c.fill(); c.fillStyle = '#ffd23f'; c.fillRect(x + 4, y - 4, 12, 4); c.fillRect(x + 4, y - 7, 2, 3); c.fillRect(x + 9, y - 7, 2, 3); c.fillRect(x + 14, y - 7, 2, 3); c.fillStyle = '#ff3b5c'; c.fillRect(x + 6, y + 6, 3, 2); c.fillRect(x + 12, y + 6, 3, 2); c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(x - 6, y - 14, 32, 4); c.fillStyle = '#c8a0ff'; c.fillRect(x - 6, y - 14, 32 * e.hp / 16, 4); }

    c.fillStyle = '#000'; if (f !== 'u') { if (f !== 'l') c.fillRect(x + 7, y + 2, 1, 2); if (f !== 'r') c.fillRect(x + 4, y + 2, 1, 2); }

  if (flash > 0) { c.fillStyle = realm === 'shadow' ? 'rgba(200,160,255,' + flash * 2 + ')' : 'rgba(255,255,220,' + flash * 2 + ')'; c.fillRect(0, 0, VW, VH); }
