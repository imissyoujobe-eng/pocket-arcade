<script>
// Pipe Hopper: a classic run-and-jump adventure. Bonk blocks, stomp Grumps, grab berries to grow and sparks to throw fire. Reach the flag in each of four worlds.
K.theme({ bg: '#0c0c14', ink: '#fffaf0', accent: '#ff5a36', accentInk: '#fff' });
const VW = 256, VH = 192, T = 16;
K.screen(VW, VH);
K.hud(['score', 'coins', 'world', 'time']);
K.pad({ dpad: 'lr', buttons: [{ id: 'b', label: 'RUN' }, { id: 'a', label: 'JUMP' }] });

const E = '................', G = '################';
function col(rows) { return rows; }
const CH = {
  start: [E, E, E, E, E, E, E, E, E, E, E, E, '.S..............', G, G],
  blocks: [E, E, E, E, E, '........?.......', E, E, E, '...?..B?B?B.....', E, E, '...........g....', G, G],
  pipes: [E, E, E, E, E, E, E, E, E, '............v...', '............PP..', '.....PP.....PP..', '.....PP..g..PP..', G, G],
  stairs: [E, E, E, E, E, E, E, E, E, E, '..........H.....', '.........HH.....', '........HHH.....', '#####...########', '#####...########'],
  float: [E, E, E, E, '.....oooo.......', '....BBBBBB......', E, E, '.oo.........ooo.', '.==........====.', E, '.......g....g...', E, G, G],
  shell: [E, E, E, E, E, E, E, E, E, '.....B?BMB......', E, E, '........k.......', G, G],
  pillars: [E, E, E, E, E, '.......f........', E, E, '....HH....HH....', '....HH....HH....', '....HH....HH....', '....HH.oo.HH....', '....HH....HH....', '######....######', '######....######'],
  ceiling: [E, E, E, E, E, '..BBBBBBBBBBBB..', E, E, E, '..o..o..o..o....', E, '....g......g....', E, G, G],
  bees: [E, E, E, '...f......f.....', E, E, E, '......M.........', E, E, E, '..g..........g..', E, G, G],
  castle1: [G, G, E, E, E, E, E, E, E, E, E, '....H......H....', '....H..g...H....', '#####LLLL#######', G],
  castle2: [G, G, E, E, E, E, E, '.......HHH......', E, E, '...HHH.....HHH..', E, E, '###LLLLLLLLLLL##', G],
  end: ['........................', '........................', '........................', '.................F......', '.................F......', '.................F......', '.................F......', '.................F......', '.................F......', '.................F......', '.........HHHH....F......', '........HHHHH....F......', '.......HHHHHH....H......', '########################', '########################']
};
const WORLDS = [
  { n: '1', sky: '#6ec3ff', ground: '#c8602c', dark: '#8a3a1a', chunks: ['start', 'blocks', 'pipes', 'float', 'shell', 'stairs', 'ceiling', 'end'] },
  { n: '2', sky: '#121228', ground: '#3a6ad8', dark: '#22408a', chunks: ['start', 'ceiling', 'shell', 'pipes', 'pillars', 'blocks', 'stairs', 'bees', 'end'] },
  { n: '3', sky: '#ffb27a', ground: '#3fa34d', dark: '#26702e', chunks: ['start', 'float', 'pillars', 'bees', 'stairs', 'pillars', 'float', 'shell', 'end'] },
  { n: '4', sky: '#1a0e0e', ground: '#7a7a8a', dark: '#4a4a5a', chunks: ['start', 'castle1', 'shell', 'castle2', 'pipes', 'castle1', 'castle2', 'bees', 'end'] }
];

let mid = false, state = 'title', wi, w, p, cam, ents, items, fx, score, coins, lives, timeLeft, power, deadT, winT, msg, msgT, best = K.best('pipehopper');
function title() { K.card({ title: 'PIPE HOPPER', text: 'Run and jump through four worlds to the flag. Bonk ? blocks for coins and power berries. Stomp Grumps and kick Clunker shells. With a spark flower, RUN also throws fire. Hold a direction to break into a sprint.', best: best ? 'BEST ' + best : '', button: 'Let\'s hop', onStart: () => { wi = 0; mid = false; score = 0; coins = 0; lives = 3; power = 0; load(); state = 'play'; } }); }
function load() {
  const W_ = WORLDS[wi];
  w = P.world(P.join(W_.chunks.map(k => CH[k])));
  ents = []; items = []; fx = []; cam = { x: 0, y: 0 }; deadT = 0; winT = 0; timeLeft = 300; msg = 'WORLD ' + W_.n; msgT = 1.6;
  for (let y = 0; y < w.rows; y++) for (let x = 0; x < w.cols; x++) {
    const ch = w.g[y][x], X = x * T, Y = y * T;
    if (ch === 'S') { w.start = { x: X, y: Y }; w.g[y][x] = '.'; }
    if (ch === 'g') { ents.push(P.walker(X + 2, Y + 4, { kind: 'grump' })); w.g[y][x] = '.'; }
    if (ch === 'k') { ents.push(P.walker(X + 2, Y + 2, { kind: 'clunker', h: 14, smart: true })); w.g[y][x] = '.'; }
    if (ch === 'f') { ents.push({ kind: 'bee', x: X, y: Y, y0: Y, w: 12, h: 10, vx: -22, ph: Math.random() * 6, alive: true }); w.g[y][x] = '.'; }
    if (ch === 'v') { ents.push({ kind: 'snapper', x: X + 16, base: Y + 16, y: Y + 16, w: 12, h: 16, t: 0, alive: true, stompable: false }); w.g[y][x] = '.'; }
  }
  P.SOLID = '#BHP?MU'; P.HURT = 'L';
  if (mid) { for (let x = Math.floor(w.cols / 2); x < w.cols; x++) if (w.g[13][x] === '#' && w.g[12][x] === '.' && w.g[11][x] === '.' && w.g[12][x + 1] === '.') { w.start = { x: x * T, y: 11 * T }; break; } }
  p = P.player(w.start.x, w.start.y, { h: power ? 26 : 14 });
  hud();
}
function hud() { K.set('score', score); K.set('coins', '● ' + coins); K.set('world', 'W' + WORLDS[wi].n + ' ♥' + lives); K.set('time', Math.max(0, Math.ceil(timeLeft))); }
function addCoin(x, y) { coins++; score += 100; if (coins >= 100) { coins -= 100; lives++; K.tune([660, 880, 1320], 0.08); } K.beep(988, 0.05, { vol: 0.05 }); K.beep(1319, 0.12, { vol: 0.05, at: 0.05 }); if (x != null) fx.push({ t: 'coin', x, y, vy: -160, l: 0.5 }); hud(); }
function setPower(n) {
  if (n > 0 && power === 0) { p.y -= 12; p.h = 26; }
  if (n === 0 && power > 0) { p.h = 14; p.y += 12; }
  power = n;
}

function hurt() {
  if (p.inv > 0 || deadT) return;
  if (power > 0) { setPower(0); p.inv = 2; K.beep(300, 0.4, { to: 120, vol: 0.06 }); return; }
  die();
}
function die() { deadT = 2.4; p.vy = -260; p.vx = 0; K.tune([494, 466, 440, 415, 392], 0.12, { type: 'triangle' }); }

function update(dt) {
  if (state !== 'play') return;
  if (msgT > 0) msgT -= dt;
  for (const f of fx) { f.l -= dt; if (f.vy != null) { f.y += f.vy * dt; f.vy += 600 * dt; } if (f.vx != null) f.x += f.vx * dt; } fx = fx.filter(f => f.l > 0);
  P.stepBumps(w, dt);
  if (deadT > 0) {
    deadT -= dt; p.vy += 700 * dt; p.y += p.vy * dt;
    if (deadT <= 0) { lives--; if (lives < 0) return over(); setPower(0); load(); }
    return;
  }
  if (winT > 0) {
    winT -= dt; p.vx = 60; p.vy = Math.min(200, p.vy + 800 * dt); P.move(w, p, dt);
    if (timeLeft > 0) { const d = Math.min(timeLeft, dt * 120); timeLeft -= d; score += Math.round(d) * 10; hud(); }

    return;
  }
  timeLeft -= dt * 2.5; if (timeLeft <= 0) { timeLeft = 0; die(); }
  if (Math.floor(timeLeft) !== Math.floor(timeLeft + dt * 2.5)) hud();

  if (!mid && p.x > w.px / 2) { mid = true; msg = 'CHECKPOINT'; msgT = 1; K.beep(1047, 0.1, { vol: 0.04 }); }
  if (p.ground && p.vy === 0 && p.justLanded) {}
  // head bonks
  if (p.hitHead) bonk(p.hitHead.tx, p.hitHead.ty);
  // tiles touched
  const tc = P.touches(w, p, 'oFL');
  if (tc) {
    if (tc.ch === 'o') { P.set(w, tc.tx, tc.ty, '.'); addCoin(); }
    if (tc.ch === 'L') return die();
    if (tc.ch === 'F') { const h = Math.max(0, 12 - tc.ty); score += h * 400; hud(); winT = 3.2; p.vx = 0; K.tune([392, 523, 659, 784, 1047, 1319], 0.1, { type: 'square' }); return; }
  }
  if (p.fell) { p.fell = false; return die(); }
  // fireballs
  if (power === 2 && K.hit('b')) { fx.push({ t: 'fire', x: p.x + (p.face > 0 ? p.w : -6), y: p.y + 8, vx: p.face * 200, vy: 0, l: 2, fire: true }); K.beep(700, 0.06, { to: 300, vol: 0.05 }); }
  for (const f of fx) if (f.fire) {
    f.vy = Math.min(250, f.vy + 900 * dt);
    if (P.isSolid(P.tile(w, f.x, f.y + 4))) { f.vy = -150; f.y -= 2; }
    if (P.isSolid(P.tile(w, f.x + Math.sign(f.vx) * 4, f.y))) f.l = 0;
    for (const e of ents) if (e.alive && e.kind !== 'snapper' && Math.abs(e.x + e.w / 2 - f.x) < 9 && Math.abs(e.y + e.h / 2 - f.y) < 9) { kill(e, 200); f.l = 0; }
    for (const e of ents) if (e.alive && e.kind === 'snapper' && Math.abs(e.x - f.x) < 9 && Math.abs(e.y + 6 - f.y) < 12 && e.y < e.base - 4) { kill(e, 200); f.l = 0; }
  }
  // items (berries slide, flowers sit)
  for (const it of items) {
    if (it.rise > 0) { it.rise -= dt; it.y -= 20 * dt; continue; }
    if (it.kind === 'berry') { it.vy = Math.min(250, (it.vy || 0) + 800 * dt); const v0 = it.vx; P.move(w, it, dt); if (it.hitWall) it.vx = -v0; }
    if (P.overlap(p, it)) { it.dead = true; score += 1000; hud(); setPower(it.kind === 'berry' ? Math.max(1, power) : 2); K.tune([523, 659, 784, 1047], 0.05); }
    if (it.y > w.py) it.dead = true;
  }
  items = items.filter(i => !i.dead);
  // enemies, woken up as they come near the screen
  for (const e of ents) {
    if (!e.alive) continue;
    if (e.x > cam.x + VW + 40) continue;
    if (e.kind === 'grump' || e.kind === 'clunker') {
      if (e.shell) {
        if (e.vx) { e.vy = Math.min(300, e.vy + 800 * dt); const v0 = e.vx; P.move(w, e, dt); if (e.hitWall) { e.vx = -v0; K.beep(200, 0.03, { vol: 0.04 }); } for (const o of ents) if (o !== e && o.alive && P.overlap(o, e)) kill(o, 300); }
        else { e.vy = Math.min(300, e.vy + 800 * dt); P.move(w, e, dt); }
      } else P.stepWalker(w, e, dt);
      if (e.y > w.py) e.alive = false;
    } else if (e.kind === 'bee') { e.ph += dt * 3; e.x += e.vx * dt; e.y = e.y0 + Math.sin(e.ph) * 24; }
    else if (e.kind === 'snapper') {
      e.t += dt; const cyc = e.t % 4, near = Math.abs(p.x - e.x) < 26;
      const up = cyc < 1 ? cyc : cyc < 2.5 ? 1 : cyc < 3.5 ? 3.5 - cyc : 0;
      if (near && up === 0) e.t -= dt;
      e.y = e.base - up * 22; e.x0 = e.x;
    }
    // touching the hero
    const box = e.kind === 'snapper' ? { x: e.x - 6, y: e.y, w: 12, h: e.base - e.y } : e;
    if (box.h <= 2) continue;
    const r = P.contact(p, box);
    if (r === 'stomp' && e.kind !== 'snapper') {
      p.vy = K.down('a') ? -300 : -180; p.jumping = K.down('a');
      if (e.kind === 'clunker') { if (!e.shell) { e.shell = true; e.vx = 0; e.h = 10; e.y += 4; score += 100; } else if (e.vx) { e.vx = 0; } else { e.vx = (p.x < e.x ? 1 : -1) * 210; } K.beep(400, 0.06, { vol: 0.05 }); }
      else kill(e, 100, true);
      hud();
    } else if (r === 'hurt') {
      if (e.shell && !e.vx) { e.vx = (p.x < e.x ? 1 : -1) * 210; e.x += Math.sign(e.vx) * 4; K.beep(400, 0.06, { vol: 0.05 }); }
      else hurt();
    }
  }
  ents = ents.filter(e => e.alive);
  cam = P.cam(w, p, cam, VW, VH);
}
function kill(e, pts, squash) {
  e.alive = false; score += pts; hud();
  fx.push({ t: squash ? 'squash' : 'flip', x: e.x, y: e.y, w: e.w, h: e.h, kind: e.kind, vy: squash ? 0 : -150, l: 0.6 });
  fx.push({ t: 'pts', x: e.x, y: e.y - 6, txt: String(pts), vy: -30, l: 0.7 });
  K.beep(squash ? 300 : 500, 0.08, { type: 'square', vol: 0.05 });
}
function bonk(tx, ty) {
  const ch = w.g[ty][tx];
  // anything standing on the block gets knocked
  for (const e of ents) if (e.alive && Math.abs(e.x + e.w / 2 - (tx * T + 8)) < 14 && Math.abs(e.y + e.h - ty * T) < 4) kill(e, 100);
  if (ch === '?') { P.set(w, tx, ty, 'U'); P.bump(w, tx, ty); addCoin(tx * T + 4, ty * T - 8); }
  else if (ch === 'M') { P.set(w, tx, ty, 'U'); P.bump(w, tx, ty); items.push({ kind: power === 0 ? 'berry' : 'flower', x: tx * T + 2, y: ty * T, w: 12, h: 12, vx: 50, vy: 0, rise: 0.6 }); K.beep(600, 0.2, { to: 1200, vol: 0.05 }); }
  else if (ch === 'B') {
    if (power > 0) { P.set(w, tx, ty, '.'); score += 50; hud(); K.noise(0.15, 0.2); for (let i = 0; i < 4; i++) fx.push({ t: 'brick', x: tx * T + 4 + (i % 2) * 8, y: ty * T + 4 + (i > 1 ? 8 : 0), vx: (i % 2 ? 1 : -1) * 60, vy: -200 + (i > 1 ? 60 : 0), l: 1 }); }
    else { P.bump(w, tx, ty); K.beep(150, 0.05, { vol: 0.05 }); }
  } else K.beep(150, 0.05, { vol: 0.04 });
}
function over() { state = 'over'; best = K.saveBest('pipehopper', score); K.card({ title: 'GAME OVER', text: 'You made it to world ' + WORLDS[Math.min(wi, 3)].n + ' with ' + score + ' points.', best: 'BEST ' + best, button: 'Try again', onStart: () => { wi = 0; mid = false; score = 0; coins = 0; lives = 3; power = 0; load(); state = 'play'; } }); }
function victory() { state = 'over'; best = K.saveBest('pipehopper', score + lives * 5000); K.card({ title: 'YOU DID IT!', text: 'All four worlds cleared! Final score ' + (score + lives * 5000) + ' including ' + lives + ' spare life bonus.', best: 'BEST ' + best, button: 'Play again', onStart: () => { wi = 0; mid = false; score = 0; coins = 0; lives = 3; power = 0; load(); state = 'play'; } }); }

// ---- drawing ----
function drawTile(c, ch, x, y, tx, ty, t) {
  const Wd = WORLDS[wi]; y += P.bumpOffset(w, tx, ty);
  if (ch === '#') { artTile(c, '#', x, y, tx, ty, wi, '#', (ART[wi] || ART[0]).pal); }
  else if (ch === 'B') { artTile(c, 'B', x, y, tx, ty, wi, 'B', Object.assign({}, A.PAL.castle, { base: '#b5502a', hi: '#d8784a', lo: '#7a3018', mortar: '#2a1008' })); }
  else if (ch === '?' || ch === 'M') { const f = Math.floor(t / 180) % 3; c.fillStyle = ['#ffb02e', '#ffd23f', '#ffc84a'][f]; c.fillRect(x, y, T, T); c.fillStyle = '#8a4a10'; c.fillRect(x, y + 15, T, 1); c.fillRect(x + 15, y, 1, T); K.text(c, '?', x + 8, y + 8, 10, '#8a4a10'); }
  else if (ch === 'U') { c.fillStyle = '#8a6a4a'; c.fillRect(x, y, T, T); c.fillStyle = '#5a3a1a'; c.fillRect(x + 2, y + 2, 2, 2); c.fillRect(x + 12, y + 2, 2, 2); c.fillRect(x + 2, y + 12, 2, 2); c.fillRect(x + 12, y + 12, 2, 2); }
  else if (ch === 'H') { artTile(c, 'H', x, y, tx, ty, wi, 'H', A.PAL.stone); }
  else if (ch === 'P') {
    const top = !w.g[ty - 1] || w.g[ty - 1][tx] !== 'P', left = w.g[ty][tx - 1] !== 'P';
    c.fillStyle = '#2fa84a'; c.fillRect(x + (left ? 2 : 0), y, left ? 14 : 14, T); c.fillStyle = '#7ee08a'; if (left) c.fillRect(x + 4, y, 3, T); c.fillStyle = '#1a6a2a'; if (!left) c.fillRect(x + 10, y, 3, T);
    if (top) { c.fillStyle = '#2fa84a'; c.fillRect(x, y, T, 7); c.fillStyle = '#7ee08a'; if (left) c.fillRect(x + 2, y + 1, 3, 5); c.fillStyle = '#0a3a12'; c.fillRect(x, y + 6, T, 1); }
  }
  else if (ch === 'o') { const s = Math.abs(Math.sin(t / 200 + tx)); c.fillStyle = '#ffd23f'; c.fillRect(x + 8 - 4 * s, y + 3, 8 * s + 1, 10); c.fillStyle = '#fff3a0'; c.fillRect(x + 7, y + 5, 1, 6); }
  else if (ch === 'F') { c.fillStyle = '#ddd'; c.fillRect(x + 7, y, 2, T); if (!w.g[ty - 1] || w.g[ty - 1][tx] !== 'F') { c.fillStyle = '#3fa34d'; c.beginPath(); c.arc(x + 8, y, 4, 0, 7); c.fill(); c.fillStyle = '#ff5a36'; c.beginPath(); c.moveTo(x + 7, y + 4); c.lineTo(x - 8, y + 10); c.lineTo(x + 7, y + 16); c.fill(); } }
  else if (ch === 'L') { c.fillStyle = Math.floor(t / 150 + tx) % 2 ? '#ff5a1a' : '#ff8a1a'; c.fillRect(x, y + 3, T, T - 3); c.fillStyle = '#ffd23f'; c.fillRect(x + (t / 40 + tx * 5) % 14, y + 5, 2, 2); }
  else if (ch === '=') { c.fillStyle = '#e8d6b0'; c.fillRect(x, y, T, 5); c.fillStyle = '#a88a5a'; c.fillRect(x, y + 5, T, 2); c.fillRect(x + 7, y, 2, 5); }
}
function drawHero(c, x, y, t) {
  if (p.inv > 0 && Math.floor(t / 60) % 2) return;
  const big = power > 0, f = p.face, run = p.ground && Math.abs(p.vx) > 5 ? Math.floor(p.anim / 10) % 2 : 0, air = !p.ground;
  const h = big ? 26 : 14, top = y;
  c.save(); c.translate(x + 6, 0); c.scale(f, 1); c.translate(-6, 0);
  const cap = power === 2 ? '#fff' : '#ff5a36', suit = power === 2 ? '#ff5a36' : '#2a6fdb';
  // legs + feet
  c.fillStyle = suit; c.fillRect(1, top + h - 7, 4, 5 - (air ? 1 : run)); c.fillRect(7, top + h - 7, 4, 5 - (air ? 0 : 1 - run));
  c.fillStyle = '#5a3a22'; c.fillRect(run || air ? 0 : 1, top + h - 2, 5, 2); c.fillRect(run ? 8 : 7, top + h - 2, 5, 2);
  // body
  c.fillStyle = suit; c.fillRect(1, top + (big ? 10 : 6), 10, big ? 10 : 4);
  c.fillStyle = '#ffd23f'; c.fillRect(3, top + (big ? 12 : 7), 2, 2); c.fillRect(7, top + (big ? 12 : 7), 2, 2);
  c.fillStyle = '#9a6a3a'; c.fillRect(air ? 10 : 11, top + (big ? 11 : 6) - (air ? 3 : 0), 2, big ? 6 : 3);
  // head: bear cub with cap
  c.fillStyle = '#9a6a3a'; c.fillRect(2, top - (big ? 0 : 2), 9, big ? 10 : 8);
  c.fillStyle = '#d9a35b'; c.fillRect(7, top + (big ? 4 : 2), 5, big ? 4 : 3);
  c.fillStyle = '#111'; c.fillRect(11, top + (big ? 4 : 2), 1, 1); c.fillRect(7, top + (big ? 2 : 0), 1, 2);
  c.fillStyle = cap; c.fillRect(1, top - (big ? 3 : 4), 10, 3); c.fillRect(8, top - (big ? 1 : 2), 5, 1);
  c.fillStyle = '#9a6a3a'; c.fillRect(1, top - (big ? 4 : 5), 2, 2);
  c.restore();
}
function drawEnt(c, e, x, y, t) {
  if (e.kind === 'grump') { const k = Math.floor(t / 150) % 2; c.fillStyle = '#8a4a2a'; c.beginPath(); c.ellipse(x + 6, y + 6, 7, 6, 0, Math.PI, 0); c.fill(); c.fillRect(x - 1, y + 5, 14, 4); c.fillStyle = '#f0d6b0'; c.fillRect(x + 2, y + 9, 8, 2); c.fillStyle = '#2a1a10'; c.fillRect(x + (k ? 0 : 1), y + 10, 5, 2); c.fillRect(x + (k ? 8 : 7), y + 10, 5, 2); c.fillStyle = '#fff'; c.fillRect(x + 2, y + 3, 3, 3); c.fillRect(x + 7, y + 3, 3, 3); c.fillStyle = '#000'; c.fillRect(x + 3, y + 4, 1, 2); c.fillRect(x + 8, y + 4, 1, 2); c.fillRect(x + 2, y + 2, 3, 1); c.fillRect(x + 7, y + 2, 3, 1); }
  else if (e.kind === 'clunker') {
    c.fillStyle = '#2fa84a'; c.beginPath(); c.ellipse(x + 6, y + (e.shell ? 6 : 6), 7, e.shell ? 5 : 6, 0, Math.PI, 0); c.fill(); c.fillStyle = '#1a6a2a'; c.fillRect(x - 1, y + (e.shell ? 6 : 6), 14, 2); c.fillStyle = '#7ee08a'; c.fillRect(x + 4, y + 2, 4, 2);
    if (!e.shell) { c.fillStyle = '#ffd23f'; c.fillRect(x + (e.vx < 0 ? -3 : 11), y + 2, 4, 5); c.fillRect(x + 1, y + 8, 3, 4); c.fillRect(x + 8, y + 8, 3, 4); c.fillStyle = '#000'; c.fillRect(x + (e.vx < 0 ? -2 : 13), y + 3, 1, 1); }
    else { c.fillStyle = '#f0e0a0'; c.fillRect(x + 1, y + 8, 10, 2); }
  }
  else if (e.kind === 'bee') { const f = Math.floor(t / 60) % 2; c.fillStyle = '#ffd23f'; c.fillRect(x, y + 2, 12, 7); c.fillStyle = '#222'; c.fillRect(x + 3, y + 2, 2, 7); c.fillRect(x + 7, y + 2, 2, 7); c.fillStyle = 'rgba(255,255,255,.8)'; c.fillRect(x + 3, y - (f ? 4 : 1), 6, 3); c.fillStyle = '#000'; c.fillRect(x + 1, y + 4, 1, 1); }
  else if (e.kind === 'snapper') { const yy = y; c.fillStyle = '#3fa34d'; c.fillRect(x - 1, yy + 10, 2, e.base - yy - 10); c.fillStyle = '#e63946'; c.beginPath(); c.arc(x, yy + 6, 7, 0, 7); c.fill(); c.fillStyle = '#fff'; for (let k = -5; k < 6; k += 3) c.fillRect(x + k, yy + 5 + (Math.floor(t / 150) % 2), 1, 2); c.fillStyle = '#fff'; c.fillRect(x - 4, yy + 1, 2, 2); c.fillRect(x + 2, yy + 1, 2, 2); }
}
function draw(c, t) {
  if (!w) { c.fillStyle = '#6ec3ff'; c.fillRect(0, 0, VW, VH); c.fillStyle = '#c8602c'; c.fillRect(0, 208, VW, 32); return; }
  const Wd = WORLDS[wi]; artBg(c, t, wi);
  P.eachVisible(w, cam, VW, VH, (ch, x, y, tx, ty) => drawTile(c, ch, x, y, tx, ty, t));
  for (const it of items) { const x = Math.round(it.x - cam.x), y = Math.round(it.y - cam.y); if (it.kind === 'berry') { c.fillStyle = '#c0306a'; c.beginPath(); c.arc(x + 6, y + 7, 6, 0, 7); c.fill(); c.fillStyle = '#ff8fc7'; c.fillRect(x + 3, y + 4, 2, 2); c.fillStyle = '#3fa34d'; c.fillRect(x + 5, y - 1, 3, 3); } else { c.fillStyle = '#3fa34d'; c.fillRect(x + 5, y + 6, 2, 6); const k = Math.floor(t / 100) % 2; c.fillStyle = k ? '#ff5a36' : '#ffd23f'; c.beginPath(); c.arc(x + 6, y + 4, 5, 0, 7); c.fill(); c.fillStyle = '#fff'; c.fillRect(x + 5, y + 3, 2, 2); } }
  for (const e of ents) if (e.x > cam.x - 30 && e.x < cam.x + VW + 30) drawEnt(c, e, Math.round(e.x - cam.x), Math.round(e.y - cam.y), t);
  // pipes drawn over snappers so they appear to come out of them
  for (const e of ents) if (e.kind === 'snapper') { const tx = Math.floor(e.x / T), ty = Math.floor(e.base / T); for (const dx of [-1, 0]) drawTile(c, 'P', (tx + dx) * T - Math.round(cam.x), ty * T - Math.round(cam.y), tx + dx, ty, t); }
  for (const f of fx) {
    const x = Math.round(f.x - cam.x), y = Math.round(f.y - cam.y);
    if (f.t === 'coin') { c.fillStyle = '#ffd23f'; c.fillRect(x + 2, y, 4, 9); }
    else if (f.t === 'brick') { c.fillStyle = '#b5502a'; c.fillRect(x, y, 5, 5); }
    else if (f.t === 'fire') { c.fillStyle = Math.floor(t / 50) % 2 ? '#ff5a36' : '#ffd23f'; c.beginPath(); c.arc(x, y, 3.5, 0, 7); c.fill(); }
    else if (f.t === 'pts') K.text(c, f.txt, x + 6, y, 7, '#fff');
    else if (f.t === 'squash') { c.fillStyle = '#8a4a2a'; c.fillRect(x - 1, y + f.h - 4, 14, 4); }
    else if (f.t === 'flip') { c.save(); c.translate(x + 6, y + 6); c.scale(1, -1); drawEnt(c, { kind: f.kind, vx: 1 }, -6, -6, t); c.restore(); }
  }
  drawHero(c, Math.round(p.x - cam.x), Math.round(p.y - cam.y), t);
  if (msgT > 0) K.text(c, msg, VW / 2, 70, 18, '#fff');
}
title();
const ART = [{ pal: A.PAL.earth, sky: { top: '#2a7ae0', mid: '#8ad0ff', bottom: '#e8f8ff', sun: '#fff6c0', sunY: 50 }, layers: [{ factor: 0.12, base: 150, amp: 45, col: '#7ab8a8', edge: 'rgba(0,0,0,.18)', seed: 2, fog: 'rgba(220,240,255,.35)' }, { factor: 0.28, base: 185, amp: 40, col: '#4a9a5a', edge: 'rgba(0,0,0,.3)', seed: 5 }, { t: 'trees', factor: 0.45, base: 212, col: '#2a7a3a', hi: '#4aa04a', kind: 'round', spacing: 28, ground: true }], amb: "dust", vig: .2 }, { pal: Object.assign({}, A.PAL.stone, { base: '#4a5078', hi: '#6a72a0', lo: '#2e3250', mortar: '#14162a' }), sky: { top: '#06060f', mid: '#10102a', bottom: '#1a1a3a', clouds: false }, layers: [{ factor: 0.15, base: 150, amp: 70, col: '#18183a', edge: 'rgba(120,140,255,.25)', seed: 7 }, { factor: 0.3, base: 200, amp: 50, col: '#10102a', edge: 'rgba(120,140,255,.3)', seed: 3 }], amb: "dust", vig: .45 }, { pal: Object.assign({}, A.PAL.earth, { base: '#c88a4a', hi: '#e8aa6a', lo: '#9a5a2a', mortar: '#5a3014', grass: '#e8c06a', grassHi: '#fff0a0', grassLo: '#b08a3a' }), sky: { top: '#3a2a6a', mid: '#ff8a5a', bottom: '#ffd88a', sun: '#ffe8a0', sunY: 80, sunR: 18 }, layers: [{ factor: 0.12, base: 160, amp: 60, col: '#a05a5a', bands: ['rgba(255,200,150,.25)', 'rgba(120,40,40,.25)'], mesa: true, edge: 'rgba(0,0,0,.25)', seed: 1, fog: 'rgba(255,220,180,.2)' }, { factor: 0.3, base: 195, amp: 50, col: '#7a3a3a', bands: ['rgba(255,160,100,.3)', 'rgba(60,20,20,.3)'], mesa: true, edge: 'rgba(0,0,0,.45)', seed: 4 }, { t: 'trees', factor: 0.5, base: 215, col: '#4a2a2a', kind: 'palm', spacing: 46 }], amb: "leaf", vig: .25 }, { pal: A.PAL.castle, sky: { top: '#060208', mid: '#2a0a0a', bottom: '#7a1a0a', clouds: false }, layers: [{ factor: 0.15, base: 170, amp: 50, col: '#2a0a0a', mesa: true, edge: 'rgba(255,90,30,.35)', seed: 9 }, { factor: 0.3, base: 205, amp: 40, col: '#180606', mesa: true, edge: 'rgba(255,90,30,.4)', seed: 2 }], amb: "ember", vig: .45, glow: "255,80,20" }];

function artBg(c, t, i) { const L = ART[i] || ART[0]; A.sky(c, VW, VH, L.sky, t); c.save(); c.translate(0, Math.round(-cam.y * 0.9)); (L.layers || []).forEach(o => o.t === 'trees' ? A.trees(c, cam.x, o) : A.ridge(c, cam.x, o)); c.restore(); if (L.glow) A.glow(c, VW / 2, VH, 220, L.glow, 0.25); }
function artTile(c, ch, x, y, tx, ty, i, set, pal) { const sol = (a, b) => a < 0 || a >= w.cols || b >= w.rows || (b >= 0 && set.indexOf(w.g[b][a]) >= 0); A.tile(c, ch + i, x, y, A.edges(sol, tx, ty), tx, ty, pal); }
drawHero = A.ink(drawHero);
drawEnt = A.ink(drawEnt);
{ const _draw = draw; draw = function (c, t) { _draw(c, t); if (w) { const L = ART[wi] || ART[0]; A.ambient(c, VW, VH, t, L.amb, 16); A.vignette(c, VW, VH, L.vig == null ? 0.3 : L.vig); } }; }
K.run(update, draw);
