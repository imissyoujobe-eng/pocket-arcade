<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Street Brawl</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script src="../lib/brawl.js"></script>
<script>
// Street Brawl: twin-fist street fighting. Punch combos, jump kicks, a spinning back kick and whatever the gang drops: bats, pipes and knives.
const ZMIN = B.ZMIN, ZMAX = B.ZMAX;
function city(sky, wall, win, floor) {
  const pal = Object.assign({}, A.PAL.stone, { base: floor, hi: A.shade(floor, 0.18), lo: A.shade(floor, -0.25), mortar: A.shade(floor, -0.55) });
  return function (c, cx, t) {
    A.sky(c, 320, ZMIN, { top: sky[0], mid: sky[1], bottom: A.shade(sky[1], 0.3), stars: sky[0] === '#101820' || sky[0] === '#200a10', clouds: false }, t * 1000);
    A.skyline(c, cx, { factor: 0.25, base: ZMIN - 30, col: 'rgba(10,8,20,.75)', amp: 60 });
    A.facades(c, cx, { factor: 0.75, base: ZMIN - 8, h: 92, w: 80, cols: [wall, A.shade(wall, 0.12), A.shade(wall, -0.1)], awn: ['#c03a3a', '#3a7ac0', '#3a9a5a'], signs: ['#ff4a8a', '#4ad8ff', '#ffd23a'], lit: win === '#ffd88a' ? 0.5 : 0.3 });
    c.fillStyle = A.INK; c.fillRect(0, ZMIN - 10, 320, 3); c.fillStyle = '#8a8a90'; c.fillRect(0, ZMIN - 9, 320, 2);
    A.floor(c, cx, ZMIN - 8, 240, 320, pal);
    for (let x = -(cx % 120); x < 320; x += 120) { c.fillStyle = 'rgba(230,220,120,.5)'; c.fillRect(x, ZMIN + 40, 40, 2); }
  };
}const look = (top, legs, hair, extra) => Object.assign({ skin: '#e0b088', hair, top, legs, belt: '#222' }, extra || {});
B.start({
  title: 'STREET BRAWL', key: 'streetbrawl', button: 'Fight',
  theme: { bg: '#120c18', ink: '#fff0f0', accent: '#ff4a6a', accentInk: '#fff' },
  text: 'Move with the arrows (up and down walk into the street). HIT three times for a combo, JUMP + HIT for a flying kick, SPECIAL for a spinning back kick that hits all around (costs a little health). HIT while standing on a weapon to pick it up. Keyboard: Z hit, X jump, C special.',
  hero: { hp: 60, spd: 72, dmg: 1, reach: 20, look: look('#3a7aff', '#2a3a6a', '#4a2a10', { gloves: '#e0b088' }) },
  finisher: 'kick',
  foes: {
    thug: { name: 'THUG', hp: 4, spd: 40, dmg: 5, look: look('#6a6a6a', '#2a2a2a', '#222'), score: 100, drop: 'bat' },
    whip: { name: 'WHIPPER', hp: 4, spd: 48, dmg: 5, reach: 30, look: look('#a03a7a', '#2a1a2a', '#c02a2a'), score: 150, kick: true },
    knife: { name: 'BLADE', hp: 3, spd: 45, dmg: 6, ranged: 'knife', cool: 1.8, look: look('#3a5a3a', '#3a3020', '#111'), score: 150, drop: 'knife' },
    brute: { name: 'BRUTE', hp: 10, spd: 30, dmg: 10, reach: 22, knock: true, cool: 1.6, wind: 0.5, look: look('#5a3a2a', '#3a2a1a', '#111', { size: 1.3, skin: '#8a5a3a' }), score: 400, drop: 'food' },
    boss1: { name: 'IRON MIKE', hp: 24, spd: 42, dmg: 9, reach: 24, knock: true, cool: 1.2, look: look('#2a2a2a', '#5a2a2a', '#d0d0d0', { size: 1.25, beard: '#d0d0d0' }), score: 3000, drop: 'gem' },
    boss2: { name: 'THE BOSS', hp: 34, spd: 46, dmg: 8, ranged: 'knife', reach: 26, cool: 1.1, knock: true, look: look('#f0f0f0', '#202020', '#111', { size: 1.25, hat: '#222' }), score: 5000 },
  },
  stages: [
    { name: 'BACK ALLEY', len: 1300, bg: city(['#2a1840', '#e06a4a'], '#5a3a3a', '#ffd88a', '#4a4048'),
      props: [{ x: 300, z: 180, drop: 'food' }, { x: 700, z: 210, drop: 'pipe', kind: 'crate' }],
      waves: [{ at: 260, foes: ['thug', 'thug'] }, { at: 560, foes: ['thug', 'whip', 'knife'] }, { at: 900, foes: ['brute', 'thug'] }, { at: 1200, foes: ['thug', 'whip'], boss: 'boss1' }] },
    { name: 'THE WAREHOUSE', len: 1500, bg: city(['#101820', '#30485a'], '#4a4a3a', '#8aa0a0', '#3a3a34'),
      props: [{ x: 350, z: 170, drop: 'food' }, { x: 380, z: 200, kind: 'crate', drop: 'bat' }, { x: 1000, z: 190, drop: 'gem' }],
      waves: [{ at: 280, foes: ['knife', 'thug', 'whip'] }, { at: 620, foes: ['brute', 'whip'] }, { at: 950, foes: ['thug', 'thug', 'knife', 'whip'] }, { at: 1400, foes: ['brute', 'knife'], boss: 'boss1' }] },
    { name: 'GANG HIDEOUT', len: 1600, bg: city(['#200a10', '#601a2a'], '#3a2a3a', '#ff6a6a', '#2a2428'),
      props: [{ x: 420, z: 200, drop: 'food' }, { x: 900, z: 170, kind: 'crate', drop: 'pipe' }, { x: 1250, z: 210, drop: 'food' }],
      waves: [{ at: 300, foes: ['whip', 'whip', 'knife'] }, { at: 650, foes: ['brute', 'brute'] }, { at: 1000, foes: ['thug', 'knife', 'whip', 'thug'] }, { at: 1500, foes: ['brute', 'knife'], boss: 'boss2' }] },
  ],
  winText: 'The gang is finished and the streets are yours again!',
});
</script>
</body>
</html>
