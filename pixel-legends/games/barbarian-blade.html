  P.eachVisible(w, cam, VW, VH, (ch, x, y, tx, ty) => {
    if (ch === '#') A.tile(c, 'g' + si, x, y, A.edges(solid, tx, ty), tx, ty, L.pal);
    else if (ch === '=') { const l = P.tile(w, (tx - 1) * T, ty * T) === '=', r = P.tile(w, (tx + 1) * T, ty * T) === '='; A.ledge(c, x - (l ? 0 : 0), y, T, A.PAL.wood); if (!l) { c.fillStyle = A.INK; c.fillRect(x, y, 1, 6); } if (!r) { c.fillStyle = A.INK; c.fillRect(x + T - 1, y, 1, 6); } }
    else if (ch === 'L') { if (P.tile(w, tx * T, (ty - 1) * T) !== 'L') A.lava(c, x, y + 2, T, T - 2, t + tx * 40); else A.lava(c, x, y - 2, T, T + 2, t + tx * 40); }
    else if (ch === '^') A.spikes(c, x, y, T);
  });
  items.forEach(it => { const x = it.x - cx, y = it.y - cy + Math.sin(t / 200) * 2; if (it.k === 'h') { c.fillStyle = '#ff3a5a'; c.beginPath(); c.arc(x + 4, y + 5, 3.5, 0, 7); c.arc(x + 9, y + 5, 3.5, 0, 7); c.fill(); c.beginPath(); c.moveTo(x + 1, y + 6); c.lineTo(x + 6.5, y + 12); c.lineTo(x + 12, y + 6); c.fill(); } else { c.fillStyle = it.k === 'x' ? '#ccd' : it.k === 'f' ? '#ff8a2a' : '#88a'; c.fillRect(x, y, 12, 12); K.text(c, it.k === 'x' ? 'A' : it.k === 'f' ? 'F' : 'S', x + 6, y + 6, 8, '#222'); } });
  foes.forEach(f => { const x = Math.round(f.x) - cx, y = Math.round(f.y) - cy; if (x < -40 || x > VW + 40) return; const face = Math.sign(f.vx || (p.x - f.x)) || 1; drawFoe(c, f, x, y, face, t); });
  if (deadT <= 0 && !(p.inv > 0 && Math.floor(t / 80) % 2) && state !== 'title') hero(c, Math.round(p.x) - cx, Math.round(p.y) - cy, p.face, t, p.vx, swingT > 0.1);
  shots.forEach(s => { c.fillStyle = Math.floor(t / 60) % 2 ? '#ff8a2a' : '#ffd23a'; c.beginPath(); c.arc(s.x - cx, s.y - cy, 4, 0, 7); c.fill(); });
  eshots.forEach(s => { c.fillStyle = s.fire ? '#ff6a2a' : '#eee'; c.fillRect(s.x - cx - 2, s.y - cy - 2, 5, 4); });
  fx.forEach(e => { c.fillStyle = e.c; c.fillRect(e.x - cx, e.y - cy, 2, 2); });
  A.ambient(c, VW, VH, t, (LOOK[si] || LOOK[0]).amb, 20); A.vignette(c, VW, VH, si === 1 ? 0.55 : 0.35);
  c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(8, 8, 62, 7); c.fillStyle = hp > 3 ? '#7aff4a' : '#ff4a4a'; c.fillRect(9, 9, 6 * Math.max(0, hp), 5);
  if (msgT > 0) K.text(c, msg, VW / 2, 40, 12, '#fff');
}
newGame(); state = 'title'; title(); K.run(update, draw);
</script>
