<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Girder Gauntlet</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script>
// Girder Gauntlet: climb the construction site past the barrels the Wrecker bot keeps rolling down, and rescue the puppy at the top.
K.theme({ bg: '#0a0a14', ink: '#fff6ea', accent: '#ff5a36', accentInk: '#fff' });
const W = 240, H = 330;
K.screen(W, H);
K.hud(['score', 'bonus', 'stage', 'lives']);
K.pad({ dpad: '4', buttons: [{ id: 'a', label: 'JUMP' }] });

// girders: [xLeft, yLeft, xRight, yRight]; barrels roll downhill and drop off the low end
const FL = [[0, 314, 240, 308], [0, 262, 220, 272], [20, 222, 240, 212], [0, 172, 220, 182], [20, 132, 240, 122], [0, 84, 220, 94], [86, 46, 156, 46]];
const LAD = [[196, 0, 1], [58, 0, 1, true], [40, 1, 2], [124, 1, 2, true], [200, 2, 3], [100, 2, 3], [44, 3, 4], [150, 3, 4, true], [204, 4, 5], [146, 5, 6]];
const HAMMERS = [[36, 1], [176, 4]];
function fy(f, x) { const g = FL[f]; const k = (x - g[0]) / (g[2] - g[0]); return g[1] + (g[3] - g[1]) * Math.max(0, Math.min(1, k)); }
function downhill(f) { const g = FL[f]; return g[3] > g[1] ? 1 : -1; }

let state = 'title', stage, score, lives, bonus, pl, barrels, fires, hammers, throwT, deadT, winT, parts, best = K.best('girder');
function title() { K.card({ title: 'GIRDER GAUNTLET', text: 'The Wrecker bot grabbed the puppy! Climb ladders with up and down, JUMP over the rolling barrels, and grab a hammer to smash them. Reach the top girder to win the stage.', best: best ? 'BEST ' + best : '', button: 'Climb', onStart: () => { stage = 1; score = 0; lives = 3; begin(); state = 'play'; } }); }
function begin() { pl = { f: 0, x: 30, y: fy(0, 30), vy: 0, air: false, climb: null, face: 1, hammer: 0, jumped: [] }; barrels = []; fires = []; parts = []; hammers = HAMMERS.map(h => ({ x: h[0], f: h[1], got: false })); throwT = 1.5; deadT = 0; winT = 0; bonus = 5000; hud(); }
function hud() { K.set('score', score); K.set('bonus', 'BONUS ' + bonus); K.set('stage', 'STAGE ' + stage); K.set('lives', '♥'.repeat(Math.max(0, lives))); }
const speed = () => 52 + stage * 9;

function update(dt) {
  if (state !== 'play') return;
  for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 300 * dt; q.l -= dt; } parts = parts.filter(q => q.l > 0);
  if (deadT > 0) { deadT -= dt; if (deadT <= 0) { lives--; hud(); if (lives <= 0) return over(); begin(); } return; }
  if (winT > 0) { winT -= dt; if (winT <= 0) { stage++; begin(); } return; }
  pl.bt = (pl.bt || 0) + dt; if (pl.bt >= 1.2) { pl.bt = 0; bonus = Math.max(0, bonus - 100); hud(); if (bonus <= 0) return die(); }
  // player
  const ax = (K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0);
  if (pl.climb) {
    const L = pl.climb, dy = (K.down('down') ? 1 : 0) - (K.down('up') ? 1 : 0);
    pl.y += dy * 42 * dt;
    const top = fy(L[2], L[0]), bot = fy(L[1], L[0]);
    if (pl.y <= top) { pl.y = top; pl.f = L[2]; pl.climb = null; }
    else if (pl.y >= bot) { pl.y = bot; pl.f = L[1]; pl.climb = null; }
  } else {
    if (ax) pl.face = ax;
    pl.x = K.clamp(pl.x + ax * (pl.hammer > 0 ? 40 : 55) * dt, FL[pl.f][0] + 4, FL[pl.f][2] - 4);
    if (pl.air) { pl.vy += 420 * dt; pl.y += pl.vy * dt; if (pl.y >= fy(pl.f, pl.x) && pl.vy > 0) { pl.y = fy(pl.f, pl.x); pl.air = false; } }
    else {
      pl.y = fy(pl.f, pl.x);
      if (K.hit('a') && pl.hammer <= 0) { pl.air = true; pl.vy = -150; pl.jumped = []; K.beep(500, 0.06, { to: 750, vol: 0.04 }); }
      if (pl.hammer <= 0) {
        if (K.down('up')) { const L = LAD.find(l => l[1] === pl.f && !l[3] && Math.abs(l[0] - pl.x) < 6); if (L) { pl.climb = L; pl.x = L[0]; } }
        if (K.down('down')) { const L = LAD.find(l => l[2] === pl.f && !l[3] && Math.abs(l[0] - pl.x) < 6); if (L) { pl.climb = L; pl.x = L[0]; } }
      }
    }
    if (ax && !pl.air && Math.random() < 0.15) K.beep(140, 0.02, { vol: 0.02 });
  }
  if (pl.hammer > 0) pl.hammer -= dt;
  for (const h of hammers) if (!h.got && pl.f === h.f && !pl.climb && Math.abs(pl.x - h.x) < 8 && pl.y < fy(h.f, h.x) - 8) { h.got = true; pl.hammer = 9; K.tune([523, 659, 784], 0.06); }
  if (pl.f === 6 && !pl.climb) { score += bonus; hud(); winT = 2.5; K.tune([523, 659, 784, 1047, 1319], 0.12); return; }
  // the wrecker throws barrels
  throwT -= dt;
  if (throwT <= 0) { barrels.push({ f: 5, x: 30, y: fy(5, 30), dir: 1, fall: null, rot: 0, down: null }); throwT = K.rnd(1.6, 2.8) / (1 + stage * 0.12); K.beep(120, 0.15, { type: 'sawtooth', vol: 0.05 }); }
  for (const b of barrels) {
    b.rot += dt * 8 * b.dir;
    if (b.down) { b.y += 70 * dt; const ty = fy(b.down[1], b.down[0]); if (b.y >= ty) { b.f = b.down[1]; b.down = null; b.dir = downhill(b.f); } }
    else if (b.fall != null) { b.vy += 400 * dt; b.y += b.vy * dt; b.x += b.dir * 20 * dt; const ty = fy(b.fall, b.x); if (b.y >= ty) { b.f = b.fall; b.fall = null; b.y = ty; b.dir = downhill(b.f); } }
    else {
      b.dir = downhill(b.f); b.x += b.dir * speed() * dt; b.y = fy(b.f, b.x);
      // sometimes take a ladder down, more often if you're below
      for (const L of LAD) if (L[2] === b.f && Math.abs(L[0] - b.x) < 1.5 && !b.tried) { b.tried = L; if (Math.random() < (pl.f < b.f ? 0.35 : 0.12)) { b.down = L; b.x = L[0]; } }
      if (b.tried && Math.abs(b.tried[0] - b.x) > 4) b.tried = null;
      const g = FL[b.f];
      if (b.x > g[2] || b.x < g[0]) { if (b.f === 0) { b.dead = true; if (stage >= 2 && fires.length < stage) fires.push({ x: 10, f: 0, dir: 1, t: 0 }); } else { b.fall = b.f - 1; b.vy = -40; } }
    }
    // hits
    const dx = Math.abs(b.x - pl.x), dy = Math.abs((b.y - 5) - (pl.y - 7));
    if (pl.hammer > 0 && dx < 18 && dy < 14) { b.dead = true; score += 300; hud(); smash(b.x, b.y - 5); continue; }
    if (dx < 8 && dy < 9) return die();
    if (pl.air && dx < 6 && b.y > pl.y && !pl.jumped.includes(b) && b.f === pl.f) { pl.jumped.push(b); score += 100; hud(); parts.push({ txt: '100', x: pl.x, y: pl.y - 16, vx: 0, vy: -20, l: 0.7 }); K.beep(880, 0.06, { vol: 0.04 }); }
  }
  barrels = barrels.filter(b => !b.dead && b.y < H + 10);
  for (const f of fires) {
    f.t += dt; f.x += f.dir * 34 * dt; if (f.x > FL[f.f][2] - 4 || f.x < FL[f.f][0] + 4) f.dir = -f.dir;
    if (Math.random() < dt * 0.4) { const L = LAD.find(l => l[1] === f.f && Math.abs(l[0] - f.x) < 4 && !l[3]); if (L && f.f < 4) { f.f = L[2]; } }
    f.y = fy(f.f, f.x);
    if (pl.hammer > 0 && Math.abs(f.x - pl.x) < 16 && Math.abs(f.y - pl.y) < 14) { f.dead = true; score += 500; hud(); smash(f.x, f.y - 5); }
    else if (Math.abs(f.x - pl.x) < 7 && Math.abs(f.y - pl.y) < 10) return die();
  }
  fires = fires.filter(f => !f.dead);
}
function smash(x, y) { K.noise(0.2, 0.25); for (let i = 0; i < 10; i++) parts.push({ x, y, vx: K.rnd(-70, 70), vy: K.rnd(-120, -20), l: 0.6, c: i % 2 ? '#c8783a' : '#ffd23f' }); }
function die() { deadT = 2; K.tune([392, 330, 262, 196], 0.15, { type: 'sawtooth' }); }
function over() { state = 'over'; best = K.saveBest('girder', score); K.card({ title: 'GAME OVER', text: 'You reached stage ' + stage + ' with ' + score + ' points.', best: 'BEST ' + best, button: 'Climb again', onStart: () => { stage = 1; score = 0; lives = 3; begin(); state = 'play'; } }); }

function draw(c, t) {
  A.sky(c, W, H, { top: '#04040e', mid: '#141a3a', bottom: '#3a2a4a', stars: true, sun: '#fff4d8', moon: true, sunX: 200, sunY: 30, sunR: 12, sunGlow: '200,210,255', clouds: false }, t);
  A.skyline(c, 0, { factor: 0, base: H, col: '#0e1024', amp: 140, win: 'rgba(255,210,120,.35)' });
  c.strokeStyle = 'rgba(255,200,60,.35)'; c.lineWidth = 2; c.beginPath(); c.moveTo(232, H); c.lineTo(232, 20); c.lineTo(140, 20); c.moveTo(232, 30); c.lineTo(250, 30); c.stroke(); for (let y = 30; y < H; y += 14) { c.beginPath(); c.moveTo(228, y); c.lineTo(236, y + 14); c.moveTo(236, y); c.lineTo(228, y + 14); c.stroke(); } c.lineWidth = 1;
  // ladders
  for (const L of LAD) { const top = fy(L[2], L[0]), bot = fy(L[1], L[0]); A.part(c, L[0] - 5, top, 2, bot - top, '#46d0ff'); A.part(c, L[0] + 3, top, 2, bot - top, '#46d0ff'); for (let y = top + 3; y < bot; y += 6) { if (L[3] && y > top + 10 && y < bot - 10) continue; c.fillStyle = A.INK; c.fillRect(L[0] - 5, y - 0.5, 10, 2.5); c.fillStyle = '#8ae8ff'; c.fillRect(L[0] - 5, y, 10, 1.5); } }
  // girders
  for (const g of FL) { c.save(); c.translate(g[0], g[1]); const len = Math.hypot(g[2] - g[0], g[3] - g[1]); c.rotate(Math.atan2(g[3] - g[1], g[2] - g[0])); c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(2, 7, len, 3); c.fillStyle = A.INK; c.fillRect(-0.7, -0.7, len + 1.4, 8.4); const gg = c.createLinearGradient(0, 0, 0, 7); gg.addColorStop(0, '#ff8a8a'); gg.addColorStop(0.3, '#e63946'); gg.addColorStop(1, '#8a1a24'); c.fillStyle = gg; c.fillRect(0, 0, len, 7); c.fillStyle = '#3a0a12'; for (let x = 2; x < len; x += 8) { c.beginPath(); c.moveTo(x, 1.5); c.lineTo(x + 3, 5.5); c.lineTo(x + 6, 1.5); c.fill(); } c.fillStyle = '#ffd0d0'; for (let x = 4; x < len; x += 16) { c.fillRect(x, 0.8, 1.2, 1.2); } c.restore(); }
  // oil drum at bottom left
  A.part(c, 4, 292, 14, 16, '#2a6fdb'); c.fillStyle = '#fff'; c.fillRect(4, 298, 14, 2); if (fires && fires.length) { A.glow(c, 11, 286, 22, '255,140,40', 0.5); c.fillStyle = '#ff5a1a'; c.beginPath(); c.moveTo(5, 292); c.quadraticCurveTo(11, 276 + Math.sin(t / 60) * 3, 17, 292); c.fill(); c.fillStyle = '#ffd23f'; c.beginPath(); c.moveTo(8, 292); c.quadraticCurveTo(11, 283 + Math.sin(t / 45) * 2, 14, 292); c.fill(); }
  // wrecker bot + stacked barrels
  c.fillStyle = '#8a5a2a'; for (let i = 0; i < 4; i++) c.fillRect(2 + (i % 2) * 9, 60 + Math.floor(i / 2) * 11, 8, 10);
  const arm = throwT < 0.3 ? -6 : 0; c.fillStyle = '#7a7a8a'; c.fillRect(22, 56, 22, 24); c.fillStyle = '#4a4a5a'; c.fillRect(26, 46, 14, 11); c.fillStyle = '#ff3b5c'; c.fillRect(28, 49, 3, 3); c.fillRect(35, 49, 3, 3); c.fillStyle = '#7a7a8a'; c.fillRect(44, 58 + arm, 8, 5); c.fillRect(16, 58 - arm, 8, 5); c.fillStyle = '#ffd23f'; c.fillRect(22, 66, 22, 2);
  // puppy on top
  const px = 128, py = 46; c.fillStyle = '#f2e3c6'; c.fillRect(px - 6, py - 9, 12, 7); c.fillRect(px + 3, py - 13, 6, 6); c.fillStyle = '#8a5a2a'; c.fillRect(px + 7, py - 14, 3, 5); c.fillStyle = '#000'; c.fillRect(px + 7, py - 11, 1, 1); c.fillStyle = '#f2e3c6'; c.fillRect(px - 9, py - 10 + Math.sin(t / 100) * 2, 3, 3); c.fillRect(px - 5, py - 2, 2, 2); c.fillRect(px + 3, py - 2, 2, 2);
  if (Math.floor(t / 400) % 2 && pl) K.text(c, 'HELP!', px, py - 24, 8, '#fff');
  if (!pl) return;
  for (const h of hammers) if (!h.got) { const y = fy(h.f, h.x) - 18; c.fillStyle = '#c8783a'; c.fillRect(h.x - 1, y, 2, 10); c.fillStyle = '#9aa0aa'; c.fillRect(h.x - 5, y - 3, 10, 5); }
  for (const b of barrels) { c.save(); c.translate(b.x, b.y - 5); if (!b.down) c.rotate(b.rot); c.fillStyle = '#c8783a'; c.beginPath(); c.arc(0, 0, 5, 0, 7); c.fill(); c.strokeStyle = '#7a3a1a'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(-5, 0); c.lineTo(5, 0); c.stroke(); c.restore(); }
  for (const f of fires) { const x = f.x, y = f.y - 6; c.fillStyle = Math.floor(t / 70) % 2 ? '#ff5a1a' : '#ffd23f'; c.beginPath(); c.arc(x, y, 5, 0, 7); c.fill(); c.fillStyle = '#fff'; c.fillRect(x - 2, y - 1, 1, 2); c.fillRect(x + 1, y - 1, 1, 2); }
  // player: a welder in hard hat
  if (!(deadT > 0 && Math.floor(t / 100) % 2)) {
    const x = Math.round(pl.x), y = Math.round(pl.y), f = pl.face, run = !pl.air && !pl.climb && (K.down('left') || K.down('right')) ? Math.floor(t / 100) % 2 : 0;
    c.fillStyle = '#2a6fdb'; c.fillRect(x - 3 + run, y - 5, 3, 5); c.fillRect(x + 1 - run, y - 5, 3, 5);
    c.fillStyle = '#ff8a1f'; c.fillRect(x - 4, y - 12, 8, 7); c.fillStyle = '#ffcf9e'; c.fillRect(x - 3, y - 17, 6, 5); c.fillStyle = '#ffd23f'; c.fillRect(x - 4, y - 19, 8, 3);
    if (pl.hammer > 0) { const sw = Math.floor(t / 120) % 2; c.fillStyle = '#c8783a'; if (sw) { c.fillRect(x + f * 5, y - 22, 2, 10); c.fillStyle = '#9aa0aa'; c.fillRect(x + f * 5 - 4, y - 26, 10, 5); } else { c.fillRect(x + f * 5, y - 10, 10 * f, 2); c.fillStyle = '#9aa0aa'; c.fillRect(x + f * 14 - 2, y - 14, 5, 10); } }
  }
  for (const q of parts) { c.globalAlpha = Math.min(1, q.l * 2); if (q.txt) K.text(c, q.txt, q.x, q.y, 7, '#fff'); else { c.fillStyle = q.c; c.fillRect(q.x - 2, q.y - 2, 3, 3); } } c.globalAlpha = 1;
  if (winT > 0) K.text(c, 'PUPPY SAVED!', W / 2, 150, 16, '#ffd23f');
}
title();
{ const _draw = draw; draw = function (c, t) { _draw(c, t); A.vignette(c, W, H, 0.35); }; }
K.run(update, draw);
</script>
</body>
</html>
