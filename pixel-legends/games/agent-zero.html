  c.fillStyle = 'rgba(255,255,255,.7)'; c.fillRect(W / 2 - 1, VIEWH / 2 - 5, 2, 3); c.fillRect(W / 2 - 1, VIEWH / 2 + 2, 2, 3); c.fillRect(W / 2 - 5, VIEWH / 2 - 1, 3, 2); c.fillRect(W / 2 + 2, VIEWH / 2 - 1, 3, 2);
  if (hurtT > 0) { c.fillStyle = 'rgba(255,0,0,' + hurtT + ')'; c.fillRect(0, 0, W, VIEWH); }
  // bottom strip: health + minimap
  c.fillStyle = '#12141c'; c.fillRect(0, VIEWH, W, H - VIEWH);
  c.fillStyle = '#333'; c.fillRect(8, VIEWH + 9, 80, 8); c.fillStyle = hp > 30 ? '#3df07a' : '#ff3b5c'; c.fillRect(8, VIEWH + 9, 80 * Math.max(0, hp) / 100, 8);
  K.text(c, 'HEALTH', 116, VIEWH + 13, 7, '#aaa');
  const ms = 1.1, ox = W - g[0].length * ms - 8, oy = VIEWH + 2;
  for (let y = 0; y < g.length; y++) for (let x = 0; x < g[0].length; x++) { const ch = g[y][x]; if (ch === '#') { c.fillStyle = '#4a5a7a'; c.fillRect(ox + x * ms, oy + y * ms, ms, ms); } if (ch === 'E') { c.fillStyle = '#3df07a'; c.fillRect(ox + x * ms, oy + y * ms, ms, ms); } }
  c.fillStyle = '#ffd23f'; c.fillRect(ox + pl.x * ms - 1, oy + pl.y * ms - 1, 2, 2);
  if (msgT > 0) { c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(0, 6, W, 22); c.font = '9px Rubik, sans-serif'; c.textAlign = 'center'; c.fillStyle = '#ffd23f'; c.fillText(msg, W / 2, 20, W - 10); }
}
title();
K.run(update, draw);
</script>
