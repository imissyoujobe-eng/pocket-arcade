<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diamond Dash</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script>
// Diamond Dash: three innings of arcade baseball. Pitch to the computer's lineup, then step up and swing for the fences.
K.theme({ bg: '#0d2a18', ink: '#f6fff2', accent: '#ffd23f', accentInk: '#2a1d00' });
const W = 240, H = 340, PLATE = { x: 120, y: 296 }, MOUND = { x: 120, y: 138 }, ZONE = { x0: 100, x1: 140, y0: 248, y1: 290 };
K.screen(W, H, { smooth: true });
K.hud(['score', 'inning', 'count']);
K.pad({ dpad: '4', buttons: [{ id: 'b', label: 'CURVE' }, { id: 'a', label: 'SWING' }] });

// fielders by angle (degrees, 0 = straight away to center) and distance in feet
const FIELD = [['P', 0, 60], ['1B', 38, 92], ['2B', 14, 140], ['SS', -14, 140], ['3B', -38, 92], ['LF', -28, 270], ['CF', 0, 305], ['RF', 28, 270]];
const INNINGS = 3;
let state = 'title', inn, isTop, outs, balls, strikes, runs, bases, mode, pitch, target, swingT, swingAnim, result, fieldAnim, msg, msgT, lastType, wins = K.best('diamond-wins');

function title() { K.card({ title: 'DIAMOND DASH', text: 'Three innings against the computer. When you pitch: move the target with the arrows or tap the zone, then throw a FASTBALL (SWING button) or a CURVE. When you bat: press SWING just as the ball reaches the plate. Swing early to pull it, late to go the other way.', best: wins ? 'WINS ' + wins : '', button: 'Play ball', onStart: start }); }
function start() { inn = 1; isTop = true; runs = [0, 0]; lastType = ''; newHalf(); state = 'play'; }
function newHalf() { outs = 0; bases = [false, false, false]; newCount(); mode = isTop ? 'pitchAim' : 'batWait'; target = { x: 120, y: 269 }; say((isTop ? 'TOP ' : 'BOTTOM ') + inn + (isTop ? ' · YOU PITCH' : ' · YOU BAT'), 1.8); if (!isTop) queueCpuPitch(1.6); hud(); }
function newCount() { balls = 0; strikes = 0; }
function say(t, d) { msg = t; msgT = d || 1.2; }
function hud() {
  K.set('score', 'YOU ' + runs[1] + ' · CPU ' + runs[0]);
  K.set('inning', (isTop ? '▲' : '▼') + inn);
  K.set('count', 'B' + balls + ' S' + strikes + ' O' + outs);
}

// ---- pitches ----
function throwPitch(type, aimX, aimY, cpuThrows) {
  const wild = type === 'curve' ? 7 : 5;
  const tx = aimX + K.rnd(-wild, wild), ty = aimY + K.rnd(-wild, wild);
  const dur = type === 'curve' ? 0.82 : Math.max(0.5, 0.62 - inn * 0.015);
  pitch = { type, t: 0, dur, tx, ty, brk: type === 'curve' ? K.rnd(10, 16) : 0, cpuThrows, done: false };
  swingT = null; swingAnim = 0; mode = 'pitchFly';
  K.beep(200, 0.08, { type: 'triangle', to: 120, vol: 0.05 });
}
function queueCpuPitch(delay) { pitch = null; mode = 'batWait'; setTimeout(() => { if (state !== 'play' || isTop || mode !== 'batWait') return; const inZone = Math.random() < 0.62; const x = inZone ? K.rnd(ZONE.x0 + 4, ZONE.x1 - 4) : (Math.random() < 0.5 ? K.rnd(84, 97) : K.rnd(143, 156)); const y = inZone ? K.rnd(ZONE.y0 + 4, ZONE.y1 - 4) : K.rnd(244, 300); throwPitch(Math.random() < 0.35 ? 'curve' : 'fast', x, y, true); }, delay * 1000); }
function ballPos(p) {
  const k = Math.min(1, p.t / p.dur), e = k * k * (3 - 2 * k) * 0.3 + k * 0.7;
  const x = MOUND.x + (p.tx - MOUND.x) * e + (p.type === 'curve' ? -Math.sin(k * Math.PI) * 6 : 0);
  const y = MOUND.y + (p.ty - MOUND.y) * e + p.brk * k * k * (p.type === 'curve' ? 1 : 0) - p.brk;
  return { x, y, r: 1.6 + k * 3.4, k };
}
const inZoneXY = (x, y) => x >= ZONE.x0 && x <= ZONE.x1 && y >= ZONE.y0 && y <= ZONE.y1;

// ---- hits ----
function wallAt(dir) { return 330 + 70 * Math.cos(dir * Math.PI / 90); }
function resolveHit(dir, dist, ground) {
  if (Math.abs(dir) > 45) return { r: 'FOUL', dir, dist };
  const lx = dist * Math.sin(dir * Math.PI / 180), ly = dist * Math.cos(dir * Math.PI / 180);
  let near = 1e9, who = null;
  for (const f of FIELD) { const fx = f[2] * Math.sin(f[1] * Math.PI / 180), fy = f[2] * Math.cos(f[1] * Math.PI / 180), d = Math.hypot(fx - lx, fy - ly); if (d < near) { near = d; who = f[0]; } }
  if (ground) {
    const inf = FIELD.slice(1, 5).find(f => Math.abs(f[1] - dir) < 11);
    if (inf && Math.random() < 0.8) return { r: 'OUT', dir, dist: Math.min(dist, inf[2]), how: 'GROUNDOUT' };
    return { r: dist > 170 && Math.random() < 0.25 ? '2B' : '1B', dir, dist };
  }
  if (dist >= wallAt(dir)) return { r: 'HR', dir, dist };
  const hang = 1.4 + dist / 130, reach = 21 * hang + 12;
  if (near < reach) return { r: 'OUT', dir, dist, how: dist > 200 ? 'FLY OUT' : 'POP OUT' };
  if (dist > 290 && near > reach + 60) return { r: '3B', dir, dist };
  if (dist > 240) return { r: '2B', dir, dist };
  return { r: '1B', dir, dist };
}
function scoreRuns(n) { runs[isTop ? 0 : 1] += n; if (n) K.tune([660, 880], 0.08); }
function advance(nb, walk) {
  let r = 0;
  if (walk) { if (bases[0]) { if (bases[1]) { if (bases[2]) r++; bases[2] = true; } bases[1] = true; } bases[0] = true; }
  else {
    const nbases = [false, false, false];
    for (let i = 2; i >= 0; i--) if (bases[i]) { const to = i + nb; if (to >= 3) r++; else nbases[to] = true; }
    if (nb >= 4) r++; else nbases[nb - 1] = true;
    bases = nbases;
  }
  scoreRuns(r); return r;
}
function addOut() { outs++; newCount(); if (outs >= 3) { setTimeout(endHalf, 900); return true; } return false; }
function applyResult(res) {
  const names = { '1B': 'SINGLE!', '2B': 'DOUBLE!', '3B': 'TRIPLE!', 'HR': 'HOME RUN!!' };
  if (res.r === 'FOUL') { if (strikes < 2) strikes++; say('FOUL BALL'); K.beep(300, 0.08, { vol: 0.05 }); hud(); return nextPitch(); }
  if (res.r === 'OUT') { say(res.how || 'OUT'); K.beep(180, 0.15, { type: 'square', vol: 0.05 }); hud(); if (!addOut()) nextPitch(); hud(); return; }
  const r = advance({ '1B': 1, '2B': 2, '3B': 3, 'HR': 4 }[res.r]); newCount();
  say(names[res.r] + (r ? ' +' + r : ''), 1.6); if (res.r === 'HR') K.tune([523, 659, 784, 1047, 1319], 0.1);
  hud(); if (!checkWalkoff()) nextPitch();
}
function checkWalkoff() { if (!isTop && inn >= INNINGS && runs[1] > runs[0]) { setTimeout(endGame, 1600); mode = 'end'; return true; } return false; }
function nextPitch() { setTimeout(() => { if (state !== 'play' || mode === 'end') return; if (isTop) mode = 'pitchAim'; else queueCpuPitch(0.6); }, 1300); mode = 'wait'; }
function endHalf() {
  if (state !== 'play') return;
  if (isTop) { if (inn >= INNINGS && runs[1] > runs[0]) return endGame(); isTop = false; }
  else { if (inn >= INNINGS && runs[0] !== runs[1]) return endGame(); if (inn >= 9) return endGame(); inn++; isTop = true; }
  newHalf();
}
function endGame() {
  if (state !== 'play') return; state = 'over'; const win = runs[1] > runs[0];
  if (win) { wins++; try { localStorage.setItem('pa-diamond-wins', wins); } catch (e) {} K.tune([523, 659, 784, 1047, 1319, 1568], 0.12); } else K.tune([392, 330, 262], 0.18);
  K.card({ title: win ? 'YOU WIN!' : runs[1] === runs[0] ? 'TIE GAME' : 'CPU WINS', text: 'Final score: You ' + runs[1] + ', CPU ' + runs[0] + '.', best: 'WINS ' + wins, button: 'Play again', onStart: start });
}
function showHit(res) { fieldAnim = { res, t: 0 }; mode = 'field'; }

// ---- the pitch arrives ----
function pitchArrived() {
  const b = ballPos(pitch), zone = inZoneXY(b.x, b.y);
  if (pitch.cpuThrows) {
    // you are batting
    if (swingT != null) {
      const err = swingT - pitch.dur, cx = (ZONE.x0 + ZONE.x1) / 2, cy = (ZONE.y0 + ZONE.y1) / 2;
      const off = Math.hypot((b.x - cx) / 24, (b.y - cy) / 26);
      if (Math.abs(err) <= 0.11 && off < 1.6) {
        const q = K.clamp((1 - Math.abs(err) / 0.11) * (1 - Math.max(0, off - 0.4) * 0.6), 0, 1);
        const aim = (K.down('left') ? -1 : 0) + (K.down('right') ? 1 : 0);
        const dir = err / 0.11 * 48 + aim * 10 + K.rnd(-6, 6);
        const ground = q < 0.32 || K.down('down');
        const dist = ground ? 70 + q * 140 : 120 + Math.pow(q, 1.3) * 300 + K.rnd(-15, 20) + (K.down('up') ? 15 : 0);
        K.noise(0.1, 0.4); K.beep(900, 0.06, { vol: 0.06 });
        return showHit(resolveHit(dir, dist, ground));
      }
      strikes++; say('SWING AND A MISS'); K.beep(140, 0.12, { vol: 0.05 });
    } else if (zone) { strikes++; say('STRIKE!'); }
    else { balls++; say('BALL'); }
  } else {
    // the computer is batting
    const cx = (ZONE.x0 + ZONE.x1) / 2, cy = (ZONE.y0 + ZONE.y1) / 2, edge = K.clamp(Math.max(Math.abs(b.x - cx) / 20, Math.abs(b.y - cy) / 21), 0, 2);
    const swing = Math.random() < (zone ? 0.72 : 0.28);
    swingAnim = swing ? 1 : 0;
    if (swing) {
      let hitChance = 0.62 - (zone ? edge * 0.22 : 0.3) - (pitch.type === 'fast' ? 0.04 : 0) + (pitch.type === lastType ? 0.1 : -0.06) + inn * 0.02;
      lastType = pitch.type;
      if (Math.random() < hitChance) {
        const q = Math.pow(Math.random(), 0.9) * (1 - Math.min(1, edge) * 0.4);
        const ground = q < 0.35, dir = K.rnd(-52, 52), dist = ground ? 70 + q * 140 : 120 + Math.pow(q, 1.4) * 300;
        K.noise(0.1, 0.4); return showHit(resolveHit(dir, dist, ground));
      }
      strikes++; say('SWING AND A MISS');
    } else { lastType = pitch.type; if (zone) { strikes++; say('STRIKE!'); } else { balls++; say('BALL'); } }
  }
  if (strikes >= 3) { say('STRIKE THREE!', 1.2); K.beep(isTop ? 880 : 160, 0.2, { vol: 0.06 }); if (!addOut()) nextPitch(); hud(); return; }
  if (balls >= 4) { say('WALK'); advance(1, true); newCount(); hud(); if (!checkWalkoff()) nextPitch(); return; }
  hud(); nextPitch();
}

function update(dt) {
  if (state !== 'play') return;
  if (msgT > 0) msgT -= dt;
  if (swingAnim > 0) swingAnim = Math.max(0, swingAnim - dt * 3);
  if (mode === 'pitchAim') {
    target.x = K.clamp(target.x + ((K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0)) * 50 * dt, 84, 156);
    target.y = K.clamp(target.y + ((K.down('down') ? 1 : 0) - (K.down('up') ? 1 : 0)) * 50 * dt, 238, 302);
    if (K.ptr.down && K.ptr.y > 225) { target.x = K.clamp(K.ptr.x, 84, 156); target.y = K.clamp(K.ptr.y, 238, 302); }
    if (K.hit('a')) throwPitch('fast', target.x, target.y, false);
    else if (K.hit('b')) throwPitch('curve', target.x, target.y, false);
  } else if (mode === 'pitchFly') {
    pitch.t += dt;
    if (pitch.cpuThrows && swingT == null && (K.hit('a') || (K.ptr.tapped && K.ptr.y > 150))) { swingT = pitch.t; swingAnim = 1; K.beep(400, 0.05, { type: 'sawtooth', to: 120, vol: 0.04 }); }
    if (pitch.t >= pitch.dur + (pitch.cpuThrows ? 0.11 : 0) && !pitch.done) { pitch.done = true; pitchArrived(); }
  } else if (mode === 'field') {
    fieldAnim.t += dt;
    if (fieldAnim.t > 2) { const r = fieldAnim.res; fieldAnim = null; mode = 'wait'; applyResult(r); }
  }
}

// ---- drawing ----
function drawPitchView(c, t) {
  c.fillStyle = '#2f8a3a'; c.fillRect(0, 0, W, H);
  // outfield wall and crowd
  const sg = c.createLinearGradient(0, 0, 0, 70); sg.addColorStop(0, '#0a1a3a'); sg.addColorStop(1, '#1d4a6b'); c.fillStyle = sg; c.fillRect(0, 0, W, 70);
  for (let row = 0; row < 4; row++) for (let i = 0; i < 22; i++) { const x = i * 11 + (row % 2) * 5, y = 12 + row * 13 + Math.sin(t / 260 + i + row) * 1.2; c.fillStyle = ['#ffd23f', '#f4f4f4', '#ff6b6b', '#7ee0ff', '#8aff8a'][(i * 3 + row) % 5]; c.fillRect(x - 4, y + 3, 8, 7); c.fillStyle = ['#f0c8a0', '#c8905a', '#8a5a3a'][(i + row) % 3]; c.beginPath(); c.arc(x, y, 3.2, 0, 7); c.fill(); }
  A.glow(c, 30, 0, 80, '255,250,220', 0.25); A.glow(c, W - 30, 0, 80, '255,250,220', 0.25);
  c.fillStyle = '#145a2a'; c.fillRect(0, 70, W, 14); c.fillStyle = '#ffd23f'; c.fillRect(0, 84, W, 2);
  c.fillStyle = '#38a046'; for (let y = 86; y < H; y += 20) c.fillRect(0, y, W, 10); for (let k = 0; k < 120; k++) { c.fillStyle = k % 2 ? 'rgba(20,80,30,.3)' : 'rgba(140,220,120,.25)'; c.fillRect(A.hash(k, 1) * W, 86 + A.hash(k, 2) * (H - 86), 1, 2); }
  // infield dirt
  c.fillStyle = '#c98a4a'; c.beginPath(); c.moveTo(120, 112); c.lineTo(214, 230); c.lineTo(120, 330); c.lineTo(26, 230); c.closePath(); c.fill();
  c.fillStyle = '#3f9a44'; c.beginPath(); c.moveTo(120, 150); c.lineTo(182, 226); c.lineTo(120, 292); c.lineTo(58, 226); c.closePath(); c.fill();
  c.fillStyle = '#c98a4a'; c.beginPath(); c.ellipse(MOUND.x, MOUND.y + 6, 16, 6, 0, 0, 7); c.fill();
  c.fillStyle = '#fff'; for (const [x, y] of [[182, 226], [120, 150], [58, 226]]) c.fillRect(x - 3, y - 3, 6, 6);
  // runners on base
  [[182, 226], [120, 150], [58, 226]].forEach(([x, y], i) => { if (bases && bases[i]) { c.fillStyle = isTop ? '#ff6b6b' : '#46a8ff'; c.fillRect(x - 3, y - 14, 6, 10); c.fillStyle = '#ffcf9e'; c.fillRect(x - 2, y - 18, 4, 4); } });
  // pitcher
  const throwing = mode === 'pitchFly' && pitch && pitch.t < 0.15;
  c.fillStyle = isTop ? '#46a8ff' : '#ff6b6b'; c.fillRect(MOUND.x - 4, MOUND.y - 12, 8, 12); c.fillStyle = '#ffcf9e'; c.fillRect(MOUND.x - 3, MOUND.y - 17, 6, 5);
  c.fillStyle = isTop ? '#1d5bd8' : '#c0303a'; c.fillRect(MOUND.x - 4, MOUND.y - 19, 8, 3);
  c.fillStyle = '#ffcf9e'; c.fillRect(MOUND.x + (throwing ? 4 : 3), MOUND.y - (throwing ? 18 : 10), 3, 3);
  // plate and zone
  c.fillStyle = '#fff'; c.beginPath(); c.moveTo(110, 302); c.lineTo(130, 302); c.lineTo(130, 308); c.lineTo(120, 314); c.lineTo(110, 308); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1; c.strokeRect(ZONE.x0, ZONE.y0, ZONE.x1 - ZONE.x0, ZONE.y1 - ZONE.y0);
  c.strokeStyle = 'rgba(255,255,255,.2)'; for (let k = 1; k < 3; k++) { c.beginPath(); c.moveTo(ZONE.x0 + k * 40 / 3, ZONE.y0); c.lineTo(ZONE.x0 + k * 40 / 3, ZONE.y1); c.moveTo(ZONE.x0, ZONE.y0 + k * 14); c.lineTo(ZONE.x1, ZONE.y0 + k * 14); c.stroke(); }
  // batter
  const bx = 86, by = 300, sw = swingAnim > 0 ? 1 - swingAnim : 0;
  c.fillStyle = isTop ? '#ff6b6b' : '#46a8ff'; c.fillRect(bx - 6, by - 34, 12, 18); c.fillStyle = '#eee'; c.fillRect(bx - 6, by - 16, 12, 14);
  c.fillStyle = '#ffcf9e'; c.fillRect(bx - 4, by - 42, 8, 8); c.fillStyle = isTop ? '#c0303a' : '#1d5bd8'; c.fillRect(bx - 5, by - 45, 10, 4);
  c.save(); c.translate(bx + 4, by - 28); c.rotate(swingAnim > 0 ? -2.2 + sw * 3.4 : -2.3); c.fillStyle = '#c99a57'; c.fillRect(0, -2, 30, 4); c.restore();
  // ball
  if (pitch && mode === 'pitchFly') { const b = ballPos(pitch); c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(b.x, Math.min(b.y + 10 * (1 - b.k) + 6, 312), b.r, b.r * 0.4, 0, 0, 7); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(b.x, b.y, b.r, 0, 7); c.fill(); c.strokeStyle = '#e63946'; c.lineWidth = 0.6; c.beginPath(); c.arc(b.x - b.r * 0.3, b.y, b.r * 0.7, -1, 1); c.stroke(); }
  // pitch target
  if (mode === 'pitchAim') {
    c.strokeStyle = inZoneXY(target.x, target.y) ? '#ffd23f' : '#ff6b6b'; c.lineWidth = 2; c.beginPath(); c.arc(target.x, target.y, 5 + Math.sin(t / 150), 0, 7); c.stroke();
    K.text(c, 'AIM, THEN FASTBALL OR CURVE', W / 2, 100, 8, '#fff');
  }
  if (!isTop && mode === 'batWait') K.text(c, 'GET READY…', W / 2, 100, 9, '#fff');
}
function drawField(c, t) {
  const f = fieldAnim, res = f.res, s = 0.48, hx = 120, hy = 318;
  const P = (ang, d) => ({ x: hx + d * s * Math.sin(ang * Math.PI / 180), y: hy - d * s * Math.cos(ang * Math.PI / 180) });
  c.fillStyle = '#1d4a6b'; c.fillRect(0, 0, W, H);
  c.fillStyle = '#2f8a3a'; c.beginPath(); c.moveTo(hx, hy); for (let a = -45; a <= 45; a += 3) { const p = P(a, wallAt(a)); c.lineTo(p.x, p.y); } c.closePath(); c.fill();
  c.strokeStyle = '#ffd23f'; c.lineWidth = 2; c.beginPath(); for (let a = -45; a <= 45; a += 3) { const p = P(a, wallAt(a)); a === -45 ? c.moveTo(p.x, p.y) : c.lineTo(p.x, p.y); } c.stroke();
  c.strokeStyle = '#fff'; c.lineWidth = 1; for (const a of [-45, 45]) { const p = P(a, wallAt(a)); c.beginPath(); c.moveTo(hx, hy); c.lineTo(p.x, p.y); c.stroke(); }
  c.fillStyle = '#c98a4a'; c.beginPath(); c.moveTo(hx, hy); const b1 = P(45, 90), b2 = P(0, 127), b3 = P(-45, 90); c.lineTo(b1.x, b1.y); c.lineTo(b2.x, b2.y); c.lineTo(b3.x, b3.y); c.closePath(); c.fill();
  const k = Math.min(1, f.t / 1.3), d = res.dist * k, bp = P(res.dir, d), h = res.r === 'OUT' && res.how === 'GROUNDOUT' ? 0 : Math.sin(k * Math.PI) * Math.min(60, res.dist / 6);
  for (const fl of FIELD) {
    let p = P(fl[1], fl[2]);
    const goal = P(res.dir, Math.min(res.dist, wallAt(res.dir) - 5)), gd = Math.hypot(goal.x - p.x, goal.y - p.y), mv = Math.min(gd, f.t * 10);
    if (gd > 0) p = { x: p.x + (goal.x - p.x) / gd * mv, y: p.y + (goal.y - p.y) / gd * mv };
    c.fillStyle = isTop ? '#46a8ff' : '#ff6b6b'; c.beginPath(); c.arc(p.x, p.y, 3, 0, 7); c.fill();
  }
  c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.arc(bp.x, bp.y, 2, 0, 7); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(bp.x, bp.y - h, 2.5 + h / 30, 0, 7); c.fill();
  if (f.t > 1.3) { const lbl = res.r === 'FOUL' ? 'FOUL BALL' : res.r === 'OUT' ? (res.how || 'OUT') : { '1B': 'SINGLE!', '2B': 'DOUBLE!', '3B': 'TRIPLE!', 'HR': 'HOME RUN!!' }[res.r]; K.text(c, lbl, W / 2, 60, 18, res.r === 'HR' ? '#ffd23f' : '#fff'); }
}
function draw(c, t) {
  if (mode === 'field' && fieldAnim) drawField(c, t); else drawPitchView(c, t);
  if (state === 'play' && mode !== 'field') {
    // mini base diamond + count
    c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(W - 54, 92, 48, 40);
    [[W - 18, 112], [W - 30, 100], [W - 42, 112]].forEach(([x, y], i) => { c.fillStyle = bases && bases[i] ? '#ffd23f' : 'rgba(255,255,255,.3)'; c.save(); c.translate(x, y); c.rotate(Math.PI / 4); c.fillRect(-4, -4, 8, 8); c.restore(); });
    for (let i = 0; i < 2; i++) { c.fillStyle = i < outs ? '#ff6b6b' : 'rgba(255,255,255,.25)'; c.beginPath(); c.arc(W - 36 + i * 12, 126, 3, 0, 7); c.fill(); }
  }
  if (msgT > 0 && mode !== 'field') K.text(c, msg, W / 2, 200, 14, '#ffd23f');
}
title();
{ const _draw = draw; draw = function (c, t) { _draw(c, t); A.vignette(c, W, H, 0.25); }; }
K.run(update, draw);
</script>
</body>
</html>
