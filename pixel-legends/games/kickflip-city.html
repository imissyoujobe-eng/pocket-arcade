<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kickflip City</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script>
// Kickflip City: a 90-second street skate session. Ollie, flip, grab and grind across ledges and rails, chain combos and spell SKATE.
K.theme({ bg: '#1a1430', ink: '#fff6ea', accent: '#ff4fa3', accentInk: '#fff' });
const W = 320, H = 240, GY = 196, PX = 90, SESSION = 90;
K.screen(W, H);
K.hud(['score', 'combo', 'time']);
K.pad({ dpad: '4', buttons: [{ id: 'b', label: 'GRAB' }, { id: 'a', label: 'OLLIE' }] });
const TRICKS = { up: ['KICKFLIP', 0.34, 300], down: ['HEELFLIP', 0.34, 300], left: ['360 SHUV', 0.3, 250] };

let state = 'title', obs, genX, sk, cam, timeLeft, score, combo, comboPts, comboList, groundT, letters, got, msg, msgT, parts, best = K.best('kickflip');
function title() { K.card({ title: 'KICKFLIP CITY', text: 'Hold ▶ to push, ◀ to slow down. OLLIE to jump. In the air press ▲ kickflip, ▼ heelflip, ◀ 360 shuv, or hold GRAB. Finish the trick before you land! Land on a rail to grind it. Keep tricking without touching the ground to build your combo, and grab the S-K-A-T-E letters.', best: best ? 'BEST ' + best : '', button: 'Skate', onStart: start }); }
function start() {
  obs = []; genX = 360; letters = []; got = 0;
  sk = { x: 40, h: 0, vh: 0, v: 110, air: false, surf: null, trick: null, tt: 0, flip: 0, grab: 0, bail: 0, grindT: 0 };
  cam = 0; timeLeft = SESSION; score = 0; combo = 0; comboPts = 0; comboList = []; groundT = 0; parts = [];
  gen(); state = 'play'; say('GO!', 1); hud();
}
function say(t, d) { msg = t; msgT = d || 1.1; }
function hud() { K.set('score', score); K.set('combo', combo > 0 ? comboPts + ' x' + combo : 'SKATE'.slice(0, got) + '·'.repeat(5 - got)); K.set('time', Math.ceil(timeLeft) + 's'); }
function gen() {
  while (genX < sk.x + 900) {
    const k = Math.random();
    if (k < 0.24) obs.push({ t: 'ledge', x: genX, w: 60 + Math.random() * 50, top: 16 });
    else if (k < 0.48) obs.push({ t: 'rail', x: genX, w: 70 + Math.random() * 40, top: 24 });
    else if (k < 0.66) obs.push({ t: 'kick', x: genX, w: 30, top: 16 });
    else if (k < 0.8) { obs.push({ t: 'kick', x: genX, w: 30, top: 16 }); obs.push({ t: 'rail', x: genX + 70, w: 80, top: 40 }); genX += 80; }
    else obs.push({ t: 'cone', x: genX, w: 8, top: 10 });
    if (Math.random() < 0.3 && letters.filter(l => !l.got).length < 1 && got < 5) letters.push({ x: genX + 40, h: 50 + Math.random() * 20, ch: 'SKATE'[got + letters.filter(l => !l.got).length], got: false });
    genX += obs[obs.length - 1].w + 90 + Math.random() * 120;
  }
  obs = obs.filter(o => o.x + o.w > cam - 50);
}
function surfAt(x) {
  // what you would be standing on at x: [height, obstacle]
  for (const o of obs) {
    if (x < o.x || x > o.x + o.w) continue;
    if (o.t === 'ledge') return [o.top, o];
    if (o.t === 'kick') return [o.top * (x - o.x) / o.w, o];
  }
  return [0, null];
}
function bank() {
  if (combo > 0) { const pts = comboPts * combo; score += pts; if (combo > 1) say('COMBO ' + comboPts + ' x ' + combo + ' = ' + pts, 1.4); }
  combo = 0; comboPts = 0; comboList = []; hud();
}
function addTrick(name, pts) { combo++; comboPts += pts; comboList.push(name); hud(); }
function bail(why) {
  sk.bail = 1.2; sk.air = false; sk.h = surfAt(sk.x)[0]; sk.vh = 0; sk.trick = null; sk.surf = null; sk.v = 40;
  combo = 0; comboPts = 0; comboList = []; say(why || 'BAIL!'); K.noise(0.4, 0.3); hud();
  for (let i = 0; i < 14; i++) parts.push({ x: sk.x, y: GY - sk.h - 10, vx: K.rnd(-60, 60), vy: K.rnd(-90, -20), l: 0.6, c: i % 2 ? '#ff4fa3' : '#ffd23f' });
}
function land(top, o) {
  sk.air = false; sk.h = top; sk.vh = 0;
  if (sk.trick) { const tr = TRICKS[sk.trick]; if (sk.tt / tr[1] < 0.7) return bail('LANDED MID-TRICK!'); addTrick('SKETCHY ' + tr[0], tr[2] >> 1); say('SKETCHY!', 0.6); sk.trick = null; }
  if (K.down('b') && sk.grab > 0.12) return bail('STILL GRABBING!');
  if (sk.grab > 0.3) { addTrick('GRAB', Math.floor(sk.grab * 4) * 50); }
  sk.grab = 0; sk.flip = 0;
  if (o && o.t === 'rail') { sk.surf = o; sk.grindT = 0; K.beep(900, 0.05, { vol: 0.04 }); }
  else { K.noise(0.06, 0.12); groundT = 0; }
}
function update(dt) {
  if (state !== 'play') return;
  if (msgT > 0) msgT -= dt;
  timeLeft -= dt; if (timeLeft <= 0) return end();
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.l -= dt; } parts = parts.filter(p => p.l > 0);
  if (sk.bail > 0) { sk.bail -= dt; sk.x += sk.v * dt; sk.v = Math.max(0, sk.v - 80 * dt); cam = sk.x - PX; gen(); return; }
  // speed
  if (!sk.air) { if (K.down('right')) sk.v = Math.min(230, sk.v + 160 * dt); else if (K.down('left')) sk.v = Math.max(50, sk.v - 200 * dt); else sk.v += (120 - sk.v) * dt * 0.4; }
  const prevX = sk.x; sk.x += sk.v * dt;
  if (sk.surf) {
    // grinding a rail
    sk.h = sk.surf.top; sk.grindT += dt;
    if (Math.floor(sk.grindT * 5) !== Math.floor((sk.grindT - dt) * 5)) { comboPts += 30; hud(); K.beep(1300, 0.03, { vol: 0.02 }); }
    if (Math.random() < 0.7) parts.push({ x: sk.x - 6, y: GY - sk.h, vx: K.rnd(-60, -10), vy: K.rnd(-60, -10), l: 0.25, c: '#ffd23f' });
    if (K.hit('a')) { addTrick('RAIL GRIND', Math.round(sk.grindT * 150)); sk.surf = null; sk.air = true; sk.vh = 200; K.beep(500, 0.08, { to: 800, vol: 0.05 }); }
    else if (sk.x > sk.surf.x + sk.surf.w) { addTrick('RAIL GRIND', Math.round(sk.grindT * 150)); sk.surf = null; sk.air = true; sk.vh = 40; }
  } else if (!sk.air) {
    const [top, o] = surfAt(sk.x);
    // ran into the side of a ledge or a cone
    for (const q of obs) {
      if ((q.t === 'ledge' || q.t === 'cone' || q.t === 'rail') && prevX + 6 <= q.x && sk.x + 6 > q.x && sk.h < q.top - 2 && q.t !== 'rail') return bail(q.t === 'cone' ? 'HIT A CONE!' : 'SMACKED THE LEDGE!');
    }
    if (top < sk.h - 3) { sk.air = true; sk.vh = 0; }
    else {
      if (o && o.t === 'kick' && sk.x + sk.v * dt > o.x + o.w) { sk.air = true; sk.vh = 120 + sk.v * 0.7; sk.h = top; }
      else sk.h = top;
    }
    if (K.hit('a')) { sk.air = true; sk.vh = 250 + sk.v * 0.25; K.beep(500, 0.08, { to: 800, vol: 0.05 }); }
    groundT += dt; if (groundT > 0.35 && combo > 0) bank();
  } else {
    // in the air: tricks
    sk.vh -= 620 * dt; sk.h += sk.vh * dt;
    if (!sk.trick) for (const d of ['up', 'down', 'left']) if (K.hit(d)) { sk.trick = d; sk.tt = 0; K.beep(700, 0.05, { type: 'triangle', vol: 0.04 }); break; }
    if (sk.trick) { const tr = TRICKS[sk.trick]; sk.tt += dt; sk.flip = sk.tt / tr[1]; if (sk.tt >= tr[1]) { addTrick(tr[0], tr[2]); say(tr[0], 0.6); sk.trick = null; sk.flip = 0; } }
    if (K.down('b')) sk.grab += dt;
    // landing on rails, ledges, kickers or the street
    for (const o of obs) if (o.t === 'rail' && sk.vh < 0 && sk.x > o.x && sk.x < o.x + o.w && sk.h <= o.top && sk.h - sk.vh * dt >= o.top - 1) { sk.h = o.top; return land(o.top, o); }
    const [top, o] = surfAt(sk.x);
    if (sk.h <= top && sk.vh < 0) { if (sk.h < top - 6 && o && o.t === 'ledge') return bail('SMACKED THE LEDGE!'); return land(top, o); }
    if (sk.h <= 0) return land(0, null);
  }
  // letters
  for (const l of letters) if (!l.got && Math.abs(l.x - sk.x) < 12 && Math.abs(l.h - (sk.h + 14)) < 16) { l.got = true; got++; score += got === 5 ? 1000 : 100; say(got === 5 ? 'S-K-A-T-E! +1000' : 'LETTER ' + l.ch, 1); K.tune([784, 988, 1175], 0.06); hud(); }
  cam = sk.x - PX; gen();
  if (Math.floor(timeLeft * 2) !== Math.floor((timeLeft + dt) * 2)) hud();
}
function end() { bank(); state = 'over'; best = K.saveBest('kickflip', score); K.tune([523, 659, 784, 1047], 0.1); K.card({ title: 'SESSION OVER', text: 'You scored ' + score + ' points' + (got === 5 ? ' and spelled SKATE!' : ' and found ' + got + ' of 5 letters.'), best: 'BEST ' + best, button: 'Skate again', onStart: start }); }

function draw(c, t) {
  const g = c.createLinearGradient(0, 0, 0, GY); g.addColorStop(0, '#3a1f6e'); g.addColorStop(1, '#ff8a5a'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  const cm = cam || 0;
  // skyline
  for (const [par, col, hmax] of [[0.2, '#4a2a6a', 90], [0.45, '#2a1a40', 120]]) { c.fillStyle = col; for (let i = -1; i < 12; i++) { const bw = 40, wx = i * bw - ((cm * par) % bw), id = Math.floor((cm * par) / bw) + i, h = 40 + (Math.abs(Math.sin(id * 12.9)) * hmax); c.fillRect(wx, GY - 20 - h, bw - 4, h); if (par > 0.3) { c.fillStyle = '#ffd86b'; for (let y = GY - 20 - h + 8; y < GY - 30; y += 12) for (let x = 4; x < bw - 8; x += 10) if (Math.sin(id * 3 + x + y) > 0.3) c.fillRect(wx + x, y, 4, 5); c.fillStyle = col; } } }
  // sidewalk + street
  A.facades(c, cm, { factor: 0.8, base: GY, h: 70, w: 76, cols: ['#8a4a4a', '#6a5a7a', '#9a7a5a'], awn: ['#e84a6a', '#3a9ad8', '#f4c02a'], signs: ['#ff4ab0', '#4ae0ff', '#ffe04a'], lit: 0.55 });
  c.fillStyle = A.INK; c.fillRect(0, GY - 1, W, 2); A.floor(c, cm, GY, GY + 8, W, Object.assign({}, A.PAL.stone, { base: '#9a9aa6', hi: '#bcbcc8', lo: '#6a6a76', mortar: '#3a3a44' }));
  const rd = c.createLinearGradient(0, GY + 8, 0, H); rd.addColorStop(0, '#22222a'); rd.addColorStop(1, '#383844'); c.fillStyle = rd; c.fillRect(0, GY + 8, W, H - GY - 8); c.fillStyle = A.INK; c.fillRect(0, GY + 8, W, 1);
  for (let k = 0; k < 50; k++) { c.fillStyle = 'rgba(255,255,255,.07)'; c.fillRect(((A.hash(k, 1) * 700 - cm) % 700 + 700) % 700 - 30, GY + 10 + A.hash(k, 2) * (H - GY - 12), 2, 1); }
  c.fillStyle = '#ffd23f'; for (let x = -(cm % 40); x < W; x += 40) { c.fillRect(x, GY + 24, 20, 2.5); }
  for (let x = -(cm * 0.8 % 160) + 60; x < W + 20; x += 160) { A.part(c, x, GY - 44, 2, 44, '#3a3a44'); A.part(c, x - 2, GY - 46, 12, 3, '#3a3a44'); A.glow(c, x + 8, GY - 42, 50, '255,220,140', 0.2); c.fillStyle = '#fff4c0'; c.fillRect(x + 5, GY - 43, 6, 2); }
  if (!obs) return;
  for (const o of obs) {
    const x = o.x - cm; if (x > W + 10 || x + o.w < -10) continue;
    if (o.t === 'ledge') { c.fillStyle = '#9a8f7e'; c.fillRect(x, GY - o.top, o.w, o.top); c.fillStyle = '#c8bca8'; c.fillRect(x, GY - o.top, o.w, 3); c.fillStyle = '#7a705f'; c.fillRect(x, GY - o.top + 6, o.w, 1); }
    else if (o.t === 'rail') { c.fillStyle = '#555'; for (const px of [x + 4, x + o.w - 6]) c.fillRect(px, GY - o.top, 2, o.top); c.fillStyle = '#d0d6e0'; c.fillRect(x, GY - o.top - 2, o.w, 3); }
    else if (o.t === 'kick') { c.fillStyle = '#b5793a'; c.beginPath(); c.moveTo(x, GY); c.lineTo(x + o.w, GY - o.top); c.lineTo(x + o.w, GY); c.fill(); c.fillStyle = '#d99a52'; c.fillRect(x + o.w - 2, GY - o.top, 2, o.top); }
    else if (o.t === 'cone') { c.fillStyle = '#ff7a1a'; c.beginPath(); c.moveTo(x, GY); c.lineTo(x + 4, GY - o.top); c.lineTo(x + 8, GY); c.fill(); c.fillStyle = '#fff'; c.fillRect(x + 2, GY - 5, 4, 2); }
  }
  for (const l of letters) if (!l.got) { const x = l.x - cm; if (x < -10 || x > W + 10) continue; c.fillStyle = '#ffd23f'; c.beginPath(); c.arc(x, GY - l.h + Math.sin(t / 200) * 2, 8, 0, 7); c.fill(); K.text(c, l.ch, x, GY - l.h + Math.sin(t / 200) * 2, 9, '#2a1d00'); }
  // skater
  const x = sk.x - cm, y = GY - sk.h;
  c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(x, GY - surfAt(sk.x)[0], 10, 2, 0, 0, 7); c.fill();
  if (sk.bail > 0) { c.save(); c.translate(x, y - 6); c.rotate(sk.bail * 6); c.fillStyle = '#ff4fa3'; c.fillRect(-4, -8, 8, 12); c.restore(); c.fillStyle = '#ffd23f'; c.fillRect(x + 10, GY - 3, 18, 3); }
  else {
    // board: flips around its long axis, shuv spins it flat
    const fl = sk.trick === 'left' ? 0 : sk.flip * Math.PI * 2, sh = sk.trick === 'left' ? Math.cos(sk.flip * Math.PI * 2) : 1;
    const by = y - 2, grabbing = sk.air && K.down('b');
    c.fillStyle = '#ffd23f'; c.fillRect(x - 10 * sh, by - 1.5 * Math.abs(Math.cos(fl)) - 1, 20 * sh, Math.max(1.5, 3 * Math.abs(Math.cos(fl))));
    if (Math.cos(fl) > -0.2) { c.fillStyle = '#222'; c.fillRect(x - 7 * sh, by + 1, 3, 2); c.fillRect(x + 4 * sh, by + 1, 3, 2); }
    const crouch = sk.air ? (grabbing ? 6 : 3) : sk.surf ? 2 : 0;
    c.fillStyle = '#2a4a8a'; c.fillRect(x - 4, by - 10 + crouch, 3, 9 - crouch); c.fillRect(x + 1, by - 10 + crouch, 3, 9 - crouch);
    c.fillStyle = '#ff4fa3'; c.fillRect(x - 4, by - 20 + crouch, 8, 11);
    c.fillStyle = '#ffcf9e'; c.fillRect(x - 3, by - 26 + crouch, 6, 6);
    c.fillStyle = '#222'; c.fillRect(x - 4, by - 28 + crouch, 8, 3); c.fillRect(x + 2, by - 27 + crouch, 4, 1);
    c.fillStyle = '#ffcf9e'; if (grabbing) c.fillRect(x + 4, by - 6, 3, 3); else { c.fillRect(x - 8, by - 18 + crouch, 4, 2); c.fillRect(x + 4, by - 18 + crouch, 4, 2); }
  }
  for (const p of parts) { c.fillStyle = p.c; c.fillRect(p.x - cm, p.y, 2, 2); }
  if (combo > 0) K.text(c, comboList.slice(-3).join(' + '), W / 2, 30, 8, '#fff');
  if (msgT > 0) K.text(c, msg, W / 2, 50, 13, '#ffd23f');
  K.text(c, 'SKATE'.split('').map((ch, i) => i < got ? ch : '_').join(' '), W - 40, 12, 9, '#ffd23f');
}
title();
{ const _draw = draw; draw = function (c, t) { _draw(c, t); A.vignette(c, W, H, 0.3); }; }
K.run(update, draw);
</script>
</body>
</html>
