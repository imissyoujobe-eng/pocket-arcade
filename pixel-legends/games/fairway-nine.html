<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fairway Nine</title>
</head>
<body>
<script src="../lib/kit.js"></script>
<script src="../lib/art.js"></script>
<script>
// Fairway Nine: nine holes of top-down golf. Pull back to aim and set power, mind the wind, sand, trees and water.
K.theme({ bg: '#123a1c', ink: '#f4fff0', accent: '#ffd23f', accentInk: '#2a1d00' });
const W = 240, H = 340, TOP = 26;
K.screen(W, H);
K.hud(['hole', 'strokes', 'total']);
K.pad({ dpad: 'lr', buttons: [{ id: 'a', label: 'SWING' }] });

// ellipses are [x, y, rx, ry]; trees are [x, y, r]
const HOLES = [
  { par: 3, tee: [120, 312], cup: [120, 72], fair: [[120, 200, 50, 110]], green: [120, 72, 34, 26], sand: [[78, 98, 14, 10], [164, 102, 14, 10]], water: [], trees: [[40, 200, 10], [200, 222, 10], [50, 120, 9]] },
  { par: 4, tee: [60, 314], cup: [180, 62], fair: [[60, 250, 32, 70], [110, 170, 60, 34], [175, 120, 35, 50]], green: [180, 62, 32, 24], sand: [[140, 152, 16, 10]], water: [[205, 235, 28, 40]], trees: [[28, 150, 10], [100, 108, 10], [118, 252, 12]] },
  { par: 3, tee: [120, 314], cup: [130, 82], fair: [[120, 292, 32, 24]], green: [130, 82, 38, 28], sand: [[90, 112, 12, 8]], water: [[120, 192, 112, 52]], trees: [[30, 80, 10], [214, 90, 10]] },
  { par: 4, tee: [182, 314], cup: [60, 62], fair: [[170, 240, 35, 70], [110, 162, 70, 30], [60, 112, 35, 45]], green: [60, 62, 30, 24], sand: [[100, 72, 14, 10], [110, 212, 14, 10]], water: [[30, 232, 24, 58]], trees: [[220, 150, 11], [150, 92, 10], [200, 60, 10]] },
  { par: 5, tee: [120, 320], cup: [120, 48], fair: [[90, 262, 40, 50], [150, 182, 45, 40], [90, 112, 45, 35]], green: [120, 48, 30, 22], sand: [[182, 252, 14, 10], [48, 172, 14, 12], [162, 78, 12, 9]], water: [[204, 132, 28, 30]], trees: [[30, 262, 11], [212, 304, 10], [124, 178, 9], [30, 72, 10]] },
  { par: 3, tee: [120, 316], cup: [120, 110], fair: [[120, 292, 28, 22]], green: [120, 110, 34, 26], sand: [[150, 92, 9, 7]], water: [[120, 168, 116, 112]], trees: [[24, 40, 10], [214, 44, 10]] },
  { par: 4, tee: [120, 318], cup: [120, 56], fair: [[120, 190, 26, 120]], green: [120, 56, 30, 22], sand: [[152, 72, 12, 9]], water: [], trees: [[70, 250, 10], [170, 240, 10], [75, 180, 10], [165, 170, 10], [70, 110, 10], [172, 106, 10]] },
  { par: 4, tee: [60, 316], cup: [170, 66], fair: [[80, 262, 40, 45], [150, 132, 50, 55]], green: [170, 66, 30, 24], sand: [[210, 102, 12, 10], [122, 82, 12, 9]], water: [[120, 198, 130, 11]], trees: [[202, 262, 12], [20, 150, 10]] },
  { par: 5, tee: [200, 320], cup: [52, 52], fair: [[190, 252, 35, 55], [120, 182, 60, 30], [60, 112, 35, 45]], green: [52, 52, 32, 24], sand: [[92, 62, 14, 10], [60, 202, 14, 10], [150, 232, 12, 10]], water: [[182, 112, 38, 34]], trees: [[120, 282, 11], [228, 172, 10], [20, 140, 10], [112, 112, 9]] }
];
const PAR = HOLES.reduce((a, h) => a + h.par, 0);
const FRICT = { green: [0.5, 16], fair: [0.3, 30], rough: [0.12, 60], sand: [0.02, 140] };

let state = 'title', hole, hd, ball, last, aim, power, meter, meterDir, charging, dragging, strokes, cards, wind, msg, msgT, phase, best = K.best('fairway9'), splash, prevA;
function bestLine() { return best ? 'BEST ' + fmtPar(best - 100) : ''; }
function fmtPar(n) { return n === 0 ? 'EVEN' : (n > 0 ? '+' : '') + n; }
function title() { K.card({ title: 'FAIRWAY NINE', text: 'Nine holes of golf. Drag back from anywhere on the course like a slingshot to aim and set power, then let go. Or turn with the arrows and hold SWING. Watch the wind, and stay out of the water!', best: bestLine(), button: 'Tee off', onStart: start }); }
function start() { cards = []; hole = 0; loadHole(); state = 'play'; }
function loadHole() {
  hd = HOLES[hole]; strokes = 0; splash = null;
  ball = { x: hd.tee[0], y: hd.tee[1], vx: 0, vy: 0, z: 0, vz: 0 }; last = { x: ball.x, y: ball.y };
  aim = Math.atan2(hd.cup[1] - ball.y, hd.cup[0] - ball.x); power = 0; meter = 0; meterDir = 1; charging = false; dragging = false;
  const a = Math.random() * Math.PI * 2, s = Math.random() * (0.4 + hole * 0.07);
  wind = { x: Math.cos(a) * s, y: Math.sin(a) * s };
  phase = 'aim'; say('HOLE ' + (hole + 1) + ' · PAR ' + hd.par, 1.8); hud();
}
function say(t, d) { msg = t; msgT = d || 1.4; }
function totalRel() { return cards.reduce((a, c) => a + c.s - c.p, 0); }
function hud() { K.set('hole', 'HOLE ' + (hole + 1) + '/9'); K.set('strokes', 'SHOTS ' + strokes); K.set('total', fmtPar(totalRel())); }

const inE = (x, y, e) => ((x - e[0]) / e[2]) ** 2 + ((y - e[1]) / e[3]) ** 2 < 1;
function terrain(x, y) {
  if (inE(x, y, hd.green)) return 'green';
  for (const e of hd.sand) if (inE(x, y, e)) return 'sand';
  for (const e of hd.water) if (inE(x, y, e)) return 'water';
  for (const e of hd.fair) if (inE(x, y, e)) return 'fair';
  return 'rough';
}

function shoot(p) {
  if (p < 0.04) return;
  const t = terrain(ball.x, ball.y);
  strokes++; last = { x: ball.x, y: ball.y }; hud();
  if (t === 'green') { const sp = 18 + p * 150; ball.vx = Math.cos(aim) * sp; ball.vy = Math.sin(aim) * sp; ball.vz = 0; K.beep(900, 0.05, { type: 'triangle', vol: 0.05 }); }
  else {
    const k = t === 'sand' ? 0.6 : t === 'rough' ? 0.85 : 1, sp = (50 + p * 170) * k;
    ball.vx = Math.cos(aim) * sp; ball.vy = Math.sin(aim) * sp; ball.vz = 105 * p * k + 12;
    K.noise(0.08, 0.2); K.beep(300, 0.08, { type: 'triangle', to: 700, vol: 0.05 });
    if (t === 'sand') say('SAND SHOT', 0.8);
  }
  phase = 'roll'; power = 0; meter = 0;
}
function penalty(why) {
  strokes++; hud(); say(why + ' +1', 1.4);
  ball.x = last.x; ball.y = last.y; ball.vx = ball.vy = ball.z = ball.vz = 0; phase = 'aim';
  aim = Math.atan2(hd.cup[1] - ball.y, hd.cup[0] - ball.x);
}
function holed() {
  phase = 'holed'; const rel = strokes - hd.par;
  const names = { '-3': 'ALBATROSS!', '-2': 'EAGLE!', '-1': 'BIRDIE!', '0': 'PAR', '1': 'BOGEY', '2': 'DOUBLE BOGEY' };
  say(strokes === 1 ? 'HOLE IN ONE!' : names[rel] || ('+' + rel), 2);
  K.tune(rel <= -1 ? [523, 659, 784, 1047, 1319] : rel === 0 ? [523, 659, 784] : [392, 330], 0.1, { type: 'triangle' });
  cards.push({ p: hd.par, s: strokes }); hud();
  setTimeout(() => { if (state !== 'play') return; if (hole < 8) { hole++; loadHole(); } else finish(); }, 2200);
}
function finish() {
  state = 'over'; const rel = totalRel(), tot = cards.reduce((a, c) => a + c.s, 0);
  best = K.saveBest('fairway9', rel + 100, true);
  const rows = cards.map((c, i) => (i + 1) + ':' + c.s).join('  ');
  K.card({ title: rel < 0 ? 'UNDER PAR!' : rel === 0 ? 'EVEN PAR' : 'ROUND DONE', text: 'You shot ' + tot + ' on a par ' + PAR + ' course (' + fmtPar(rel) + '). ' + rows, best: bestLine(), button: 'Play again', onStart: start });
}

function update(dt) {
  if (state !== 'play') return;
  if (msgT > 0) msgT -= dt;
  if (splash) { splash.t -= dt; if (splash.t <= 0) splash = null; }
  if (phase === 'aim') {
    // arrows turn, hold SWING to run the power meter, let go to hit
    const turn = (K.down('right') ? 1 : 0) - (K.down('left') ? 1 : 0);
    if (turn && !dragging) aim += turn * 1.4 * dt;
    if (K.down('a')) { charging = true; meter += meterDir * dt * 0.9; if (meter >= 1) { meter = 1; meterDir = -1; } if (meter <= 0) { meter = 0; meterDir = 1; } power = meter; }
    else if (prevA && charging) { charging = false; shoot(power); }
    // pull back like a slingshot
    if (K.ptr.down) {
      const dx = ball.x - K.ptr.x, dy = ball.y - K.ptr.y, d = Math.hypot(dx, dy);
      if (K.ptr.tapped) dragging = true;
      if (dragging && d > 6) { aim = Math.atan2(dy, dx); power = K.clamp((d - 6) / 100, 0, 1); }
      else if (dragging) power = 0;
    } else if (dragging) { dragging = false; shoot(power); }
  }
  prevA = K.down('a');
  if (phase === 'roll') {
    if (ball.z > 0 || ball.vz > 0) {
      ball.vx += wind.x * 40 * dt; ball.vy += wind.y * 40 * dt;
      ball.vz -= 220 * dt; ball.z += ball.vz * dt;
      ball.x += ball.vx * dt; ball.y += ball.vy * dt;
      if (ball.z <= 0) {
        ball.z = 0; ball.vz = 0; const t = terrain(ball.x, ball.y);
        const keep = t === 'sand' ? 0.1 : t === 'rough' ? 0.35 : t === 'green' ? 0.45 : 0.55;
        ball.vx *= keep; ball.vy *= keep; K.beep(160, 0.05, { vol: 0.04 });
      }
    } else {
      const t = terrain(ball.x, ball.y);
      if (t === 'water') { splash = { x: ball.x, y: ball.y, t: 0.8 }; K.noise(0.4, 0.3); return penalty('SPLASH'); }
      const [f, sub] = FRICT[t], sp = Math.hypot(ball.vx, ball.vy);
      const ns = Math.max(0, sp * Math.pow(f, dt) - sub * dt);
      if (sp > 0) { ball.vx *= ns / sp; ball.vy *= ns / sp; }
      ball.x += ball.vx * dt; ball.y += ball.vy * dt;
      // the cup
      const cd = Math.hypot(ball.x - hd.cup[0], ball.y - hd.cup[1]);
      if (cd < 4) {
        if (ns < 130) { ball.x = hd.cup[0]; ball.y = hd.cup[1]; ball.vx = ball.vy = 0; return holed(); }
        ball.vx += (ball.x - hd.cup[0]) * 6; ball.vy += (ball.y - hd.cup[1]) * 6; K.beep(1200, 0.04, { vol: 0.04 });
      }
      if (ns < 3) {
        ball.vx = ball.vy = 0; phase = 'aim';
        aim = Math.atan2(hd.cup[1] - ball.y, hd.cup[0] - ball.x);
        if (strokes >= 10) { say('PICKED UP', 1.4); cards.push({ p: hd.par, s: 10 }); phase = 'holed'; hud(); setTimeout(() => { if (state !== 'play') return; if (hole < 8) { hole++; loadHole(); } else finish(); }, 1600); }
      }
    }
    // trees block low balls
    for (const tr of hd.trees) {
      const dx = ball.x - tr[0], dy = ball.y - tr[1], d = Math.hypot(dx, dy);
      if (ball.z < 16 && d < tr[2] + 2) {
        const nx = dx / (d || 1), ny = dy / (d || 1), dot = ball.vx * nx + ball.vy * ny;
        if (dot < 0) { ball.vx = (ball.vx - 2 * dot * nx) * 0.45; ball.vy = (ball.vy - 2 * dot * ny) * 0.45; ball.x = tr[0] + nx * (tr[2] + 2); ball.y = tr[1] + ny * (tr[2] + 2); K.noise(0.1, 0.15); say('TREE!', 0.8); }
      }
    }
    if (ball.x < 3 || ball.x > W - 3 || ball.y < TOP + 3 || ball.y > H - 3) penalty('OUT OF BOUNDS');
  }
}

function ell(c, e, col) { c.fillStyle = col; c.beginPath(); c.ellipse(e[0], e[1], e[2], e[3], 0, 0, 7); c.fill(); }
function draw(c, t) {
  for (let ty = 0; ty < H / 16 + 1; ty++) for (let tx = 0; tx < W / 16 + 1; tx++) A.grassTD(c, tx * 16, ty * 16, tx, ty, { base: '#3e8a36', hi: '#58a84a', lo: '#2e6e2a' });
  if (!hd) return;
  const inE = (e, x, y, pad) => ((x - e[0]) / (e[2] + pad)) ** 2 + ((y - e[1]) / (e[3] + pad)) ** 2 < 1;
  const clear = (x, y) => !hd.fair.some(e => inE(e, x, y, 10)) && !hd.water.some(e => inE(e, x, y, 8)) && !hd.sand.some(e => inE(e, x, y, 8)) && !inE(hd.green, x, y, 12) && Math.hypot(x - hd.tee[0], y - hd.tee[1]) > 20;
  const trees = []; for (let i = 0; i < 70; i++) { const x = A.hash(i, hole, 1) * W, y = A.hash(i, hole, 2) * H; if (clear(x, y)) trees.push([x, y, i]); }
  for (const e of hd.fair) ell(c, e, '#6cc24a');
  c.save(); c.beginPath(); for (const e of hd.fair) { c.moveTo(e[0] + e[2], e[1]); c.ellipse(e[0], e[1], e[2], e[3], 0, 0, 7); } c.clip();
  c.fillStyle = '#62b442'; for (let y = 0; y < H; y += 16) c.fillRect(0, y, W, 8); c.restore();
  for (const e of hd.water) { ell(c, [e[0], e[1], e[2] + 2, e[3] + 2], '#2a6aa8'); ell(c, e, '#3a8fd8'); }
  c.save(); c.beginPath(); for (const e of hd.water) { c.moveTo(e[0] + e[2], e[1]); c.ellipse(e[0], e[1], e[2], e[3], 0, 0, 7); } c.clip();
  c.fillStyle = 'rgba(255,255,255,.25)'; for (let i = 0; i < 30; i++) c.fillRect((i * 37 + t / 40) % W, (i * 53) % H, 6, 1); c.restore();
  ell(c, [hd.green[0], hd.green[1], hd.green[2] + 3, hd.green[3] + 3], '#76d054'); ell(c, hd.green, '#93e870');
  for (const e of hd.sand) { ell(c, [e[0], e[1], e[2] + 2, e[3] + 2], '#9a8048'); ell(c, [e[0], e[1], e[2] + 1, e[3] + 1], '#c9b070'); ell(c, e, '#efdca0'); c.save(); c.beginPath(); c.ellipse(e[0], e[1], e[2], e[3], 0, 0, 7); c.clip(); for (let k = 0; k < 40; k++) { c.fillStyle = k % 2 ? 'rgba(160,130,70,.4)' : 'rgba(255,255,255,.4)'; c.fillRect(e[0] - e[2] + A.hash(k, e[0]) * e[2] * 2, e[1] - e[3] + A.hash(k, e[1]) * e[3] * 2, 1, 1); } c.restore(); }
  for (const e of hd.water) { c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 1; c.beginPath(); c.ellipse(e[0], e[1], e[2] - 1, e[3] - 1, 0, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); }
  trees.sort((a, b) => a[1] - b[1]).forEach(([x, y, i]) => A.treeTD(c, x - 8, y - 12, i, hole));
  // tee box
  c.fillStyle = '#7ad458'; c.fillRect(hd.tee[0] - 10, hd.tee[1] - 6, 20, 12); c.fillStyle = '#fff'; c.fillRect(hd.tee[0] - 9, hd.tee[1] - 1, 2, 2); c.fillRect(hd.tee[0] + 7, hd.tee[1] - 1, 2, 2);
  // cup + flag
  const [cx, cy] = hd.cup;
  c.fillStyle = '#111'; c.beginPath(); c.ellipse(cx, cy, 3.5, 2.6, 0, 0, 7); c.fill();
  c.fillStyle = '#eee'; c.fillRect(cx, cy - 22, 1, 22);
  const wv = Math.sin(t / 200) * 2 + wind.x * 3; c.fillStyle = '#e63946'; c.beginPath(); c.moveTo(cx + 1, cy - 22); c.lineTo(cx + 12 + wv, cy - 19); c.lineTo(cx + 1, cy - 15); c.fill();
  // trees
  for (const tr of hd.trees) { c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(tr[0] + 4, tr[1] + 5, tr[2], tr[2] * 0.7, 0, 0, 7); c.fill(); c.fillStyle = '#1f5e26'; c.beginPath(); c.arc(tr[0], tr[1], tr[2], 0, 7); c.fill(); c.fillStyle = '#2f7d32'; c.beginPath(); c.arc(tr[0] - tr[2] * 0.3, tr[1] - tr[2] * 0.3, tr[2] * 0.6, 0, 7); c.fill(); }
  if (splash) { c.strokeStyle = 'rgba(255,255,255,' + splash.t + ')'; c.beginPath(); c.arc(splash.x, splash.y, (0.8 - splash.t) * 18, 0, 7); c.stroke(); }
  // aim guide
  if (phase === 'aim' && state === 'play') {
    const onGreen = terrain(ball.x, ball.y) === 'green', len = 14 + power * (onGreen ? 70 : 110);
    c.fillStyle = 'rgba(255,255,255,.85)';
    for (let d = 8; d < len; d += 6) c.fillRect(ball.x + Math.cos(aim) * d - 1, ball.y + Math.sin(aim) * d - 1, 2, 2);
    c.fillStyle = power > 0.85 ? '#ff5a36' : '#ffd23f'; c.beginPath(); c.arc(ball.x + Math.cos(aim) * len, ball.y + Math.sin(aim) * len, 3, 0, 7); c.fill();
    // power bar
    c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(8, H - 16, 90, 9); c.fillStyle = power > 0.85 ? '#ff5a36' : '#ffd23f'; c.fillRect(9, H - 15, 88 * power, 7);
    K.text(c, onGreen ? 'PUTT' : 'POWER', 116, H - 11, 8, '#fff');
  }
  // ball, raised and shadowed when in the air
  c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(ball.x + 1, ball.y + 1, 2.5, 1.6, 0, 0, 7); c.fill();
  if (phase !== 'holed') { const r = 2.6 + ball.z * 0.04; c.fillStyle = '#fff'; c.beginPath(); c.arc(ball.x, ball.y - ball.z * 0.5, r, 0, 7); c.fill(); }
  // wind
  const ws = Math.hypot(wind.x, wind.y);
  c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(W - 60, 6, 54, 22);
  c.save(); c.translate(W - 46, 17); c.rotate(Math.atan2(wind.y, wind.x)); c.fillStyle = '#9fd6ff'; c.fillRect(-7, -1.5, 12, 3); c.beginPath(); c.moveTo(8, 0); c.lineTo(3, -4); c.lineTo(3, 4); c.fill(); c.restore();
  K.text(c, Math.round(ws * 20) + ' MPH', W - 22, 17, 7, '#fff');
  K.text(c, 'PAR ' + hd.par, 26, 17, 9, '#fff');
  if (msgT > 0) K.text(c, msg, W / 2, H / 2 - 30, 15, '#ffd23f');
}
title();
{ const _draw = draw; draw = function (c, t) { _draw(c, t); A.vignette(c, W, H, 0.25); }; }
K.run(update, draw);
</script>
</body>
</html>
